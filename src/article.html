<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article - LanaAI</title>
  <script src="js/tailwind-loader.js"></script>
  <script src="js/error-reporter.js"></script>
  <script src="js/config.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/version.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/navigation-helpers.js"></script>
    <script src="js/new-project-modal.js"></script>
    <script src="js/conversation-menu.js"></script>
  <script src="js/conversation-search-modal.js"></script>
  <script src="js/article.js"></script>
  <style>
    /* Article typography styles */
    .article-content h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-top: 2rem;
      margin-bottom: 1rem;
      color: #111827;
    }
    .article-content h2 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-top: 1.75rem;
      margin-bottom: 0.875rem;
      color: #1f2937;
    }
    .article-content h3 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-top: 1.5rem;
      margin-bottom: 0.75rem;
      color: #374151;
    }
    .article-content p {
      margin-bottom: 1rem;
      line-height: 1.75;
      color: #4b5563;
    }
    .article-content ul, .article-content ol {
      margin-bottom: 1rem;
      padding-left: 1.5rem;
    }
    .article-content li {
      margin-bottom: 0.5rem;
      line-height: 1.75;
      color: #4b5563;
    }
    .article-content ul {
      list-style-type: disc;
    }
    .article-content ol {
      list-style-type: decimal;
    }
    .article-content strong {
      font-weight: 600;
      color: #1f2937;
    }
    .article-content code {
      background-color: #f3f4f6;
      padding: 0.125rem 0.375rem;
      border-radius: 0.25rem;
      font-size: 0.875em;
      font-family: 'Courier New', monospace;
      color: #dc2626;
    }
    .article-content blockquote {
      border-left: 4px solid #6366f1;
      padding-left: 1rem;
      margin: 1.5rem 0;
      color: #6b7280;
      font-style: italic;
    }
  </style>

  <!-- Inline preloader styles - Pure CSS, no dependencies -->
  <style>
    #lana-preloader {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.3s ease-out;
    }
    #lana-preloader.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .preloader-logo {
      width: 80px;
      height: 80px;
      margin-bottom: 24px;
      animation: pulse-preloader 2s ease-in-out infinite;
    }
    .preloader-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }
    .preloader-text {
      color: white;
      font-size: 16px;
      font-weight: 500;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse-preloader {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(0.96); }
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="lana-preloader">
    <svg class="preloader-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="45" fill="white" opacity="0.15"/>
      <circle cx="50" cy="50" r="35" fill="white" opacity="0.3"/>
      <circle cx="50" cy="50" r="25" fill="white"/>
      <text x="50" y="58" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#667eea" text-anchor="middle">L</text>
    </svg>
    <div class="preloader-spinner"></div>
    <div class="preloader-text">Loading LanaAI...</div>
  </div>

  <div id="app-content">
  <!-- Sidebar -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-gray-900 text-white transform -translate-x-full lg:translate-x-0 transition-transform z-30 flex flex-col">
    <div class="flex-shrink-0 flex items-center justify-between h-16 px-6 border-b border-gray-800">
      <img src="img/logo-light.png" alt="LanaAI" class="h-7">
      <button id="closeSidebar" class="lg:hidden text-gray-400 hover:text-white">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <nav id="mainNav" class="flex-1 mt-6 px-3 overflow-hidden">
      <!-- Menu will be dynamically rendered by menu.js -->
    </nav>
  </aside>

  <!-- Main Content -->
  <div class="lg:ml-64">
    <!-- Top Bar -->
    <header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-20">
      <div class="flex items-center justify-between h-16 px-4 lg:px-8">
        <button id="openSidebar" class="lg:hidden text-gray-500 hover:text-gray-700">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </button>

        <div class="flex-1 px-4 lg:px-0">
          <h1 class="text-xl font-semibold text-gray-900" id="pageTitle">Help Article</h1>
        </div>

        <div class="flex items-center gap-4">
          <!-- User Menu -->
          <div class="relative" id="userMenu">
            <button class="flex items-center gap-2 text-gray-700 hover:text-gray-900 p-1" title="Settings">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
              </svg>
            </button>
            <div id="userDropdown" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-200 py-1">
              <a href="settings.html" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Settings</a>
              <hr class="my-1">
              <button id="logoutBtn" class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-gray-100">Sign out</button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <main class="p-4 lg:p-8">
      <!-- Loading State -->
      <div id="articleLoading" class="flex items-center justify-center py-12">
        <div class="animate-spin w-12 h-12 border-4 border-indigo-200 border-t-indigo-600 rounded-full"></div>
      </div>

      <!-- Error State -->
      <div id="articleError" class="hidden bg-red-50 border border-red-200 rounded-lg p-6 text-center max-w-2xl mx-auto">
        <svg class="w-12 h-12 text-red-500 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <h3 class="text-lg font-semibold text-gray-900 mb-2">Article not found</h3>
        <p class="text-gray-600 mb-4">The requested article could not be found.</p>
        <a href="help.html" class="inline-block px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors">
          Back to Help Center
        </a>
      </div>

      <!-- Article Content -->
      <div id="articleContainer" class="hidden">
        <div class="max-w-4xl mx-auto">
          <!-- Breadcrumb -->
          <nav class="flex items-center gap-2 text-sm text-gray-600 mb-6">
            <a href="index.html" class="hover:text-indigo-600">Home</a>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
            </svg>
            <a href="help.html" class="hover:text-indigo-600">Help Center</a>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
            </svg>
            <span id="breadcrumbSection" class="text-gray-900 font-medium"></span>
          </nav>

          <!-- Article Header -->
          <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8 mb-6">
            <div class="flex items-start justify-between mb-4">
              <div class="flex-1">
                <div class="flex items-center gap-2 mb-3">
                  <span id="articleCategory" class="px-3 py-1 bg-indigo-100 text-indigo-700 text-sm font-medium rounded-full"></span>
                  <span class="text-sm text-gray-500" id="articleReadTime"></span>
                </div>
                <h1 id="articleTitle" class="text-4xl font-bold text-gray-900 mb-3"></h1>
                <p id="articleSummary" class="text-lg text-gray-600"></p>
              </div>
            </div>
            <div class="flex items-center gap-6 text-sm text-gray-500 pt-4 border-t border-gray-200">
              <div class="flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span>Updated <span id="articleUpdated"></span></span>
              </div>
              <div id="articleTags" class="flex items-center gap-2">
                <!-- Tags will be inserted here -->
              </div>
            </div>
          </div>

          <!-- Article Body -->
          <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8 mb-6">
            <div id="articleContent" class="article-content prose max-w-none">
              <!-- Article content will be inserted here -->
            </div>
          </div>

          <!-- Was this helpful? -->
          <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8 mb-6" style="display: none;">
            <h3 class="text-lg font-semibold text-gray-900 mb-4">Was this article helpful?</h3>
            <div class="flex items-center gap-4">
              <button id="helpfulYes" class="flex items-center gap-2 px-4 py-2 border border-gray-300 rounded-lg hover:bg-green-50 hover:border-green-500 hover:text-green-700 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10h4.764a2 2 0 011.789 2.894l-3.5 7A2 2 0 0115.263 21h-4.017c-.163 0-.326-.02-.485-.06L7 20m7-10V5a2 2 0 00-2-2h-.095c-.5 0-.905.405-.905.905 0 .714-.211 1.412-.608 2.006L7 11v9m7-10h-2M7 20H5a2 2 0 01-2-2v-6a2 2 0 012-2h2.5"></path>
                </svg>
                Yes
              </button>
              <button id="helpfulNo" class="flex items-center gap-2 px-4 py-2 border border-gray-300 rounded-lg hover:bg-red-50 hover:border-red-500 hover:text-red-700 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14H5.236a2 2 0 01-1.789-2.894l3.5-7A2 2 0 018.736 3h4.018a2 2 0 01.485.06l3.76.94m-7 10v5a2 2 0 002 2h.096c.5 0 .905-.405.905-.904 0-.715.211-1.413.608-2.008L17 13V4m-7 10h2m5-10h2a2 2 0 012 2v6a2 2 0 01-2 2h-2.5"></path>
                </svg>
                No
              </button>
              <div id="feedbackMessage" class="hidden text-sm text-green-600 flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
                Thank you for your feedback!
              </div>
            </div>
          </div>

          <!-- Related Articles -->
          <div id="relatedArticles" class="bg-white rounded-xl shadow-sm border border-gray-200 p-8">
            <h3 class="text-lg font-semibold text-gray-900 mb-4">Related Articles</h3>
            <div id="relatedArticlesList" class="space-y-3">
              <!-- Related articles will be inserted here -->
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Overlay for mobile sidebar -->
  <div id="sidebarOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-20 hidden lg:hidden"></div>

  <script>
    // Auth check
    if (!api.isAuthenticated()) {
      window.location.href = 'login.html';
    }

    // Render dynamic menu
    renderMenu('#mainNav');

    // Initialize conversation menu
    if (typeof ConversationMenu !== 'undefined' && ConversationMenu.init()) {
      ConversationMenu.loadConversations(true);
    }

    // Initialize conversation search modal
    if (typeof ConversationSearchModal !== 'undefined') {
      ConversationSearchModal.init();
    }


    // UI Elements
    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebarOverlay');
    const openSidebar = document.getElementById('openSidebar');
    const closeSidebar = document.getElementById('closeSidebar');
    const userMenu = document.getElementById('userMenu');
    const userDropdown = document.getElementById('userDropdown');
    const logoutBtn = document.getElementById('logoutBtn');

    // Sidebar toggle
    openSidebar.addEventListener('click', () => {
      sidebar.classList.remove('-translate-x-full');
      sidebarOverlay.classList.remove('hidden');
    });

    closeSidebar.addEventListener('click', () => {
      sidebar.classList.add('-translate-x-full');
      sidebarOverlay.classList.add('hidden');
    });

    sidebarOverlay.addEventListener('click', () => {
      sidebar.classList.add('-translate-x-full');
      sidebarOverlay.classList.add('hidden');
    });

    // User menu toggle
    userMenu.addEventListener('click', () => {
      userDropdown.classList.toggle('hidden');
    });

    document.addEventListener('click', (e) => {
      if (!userMenu.contains(e.target)) {
        userDropdown.classList.add('hidden');
      }
    });

    // Logout
    logoutBtn.addEventListener('click', async () => {
      await api.logout();
      window.location.href = 'login.html';
    });

    // Load user info
    function loadUserInfo() {
      const user = api.user;
      if (user) {
        const name = `${user.firstName || ''} ${user.lastName || ''}`.trim() || user.email;
        const initials = (user.firstName?.[0] || '') + (user.lastName?.[0] || '') || user.email[0].toUpperCase();

        const uNameEl = document.getElementById('userName');
        const uInitEl = document.getElementById('userInitials');
        if (uNameEl) uNameEl.textContent = name;
        if (uInitEl) uInitEl.textContent = initials;
      }
    }

    loadUserInfo();

    // Initialize article system
    if (window.ArticleSystem) {
      ArticleSystem.init();
    }

    // Conversation actions modal
    let selectedConversationId = null;
    let selectedConversationTitle = null;
    let selectedConversationMatterId = null;
    let selectedConversationIsProject = false;

    window.openConversationActionsModal = function(conversationId, conversationTitle, matterId, isProject = false) {
        selectedConversationId = conversationId;
        selectedConversationTitle = conversationTitle;
        selectedConversationMatterId = matterId;
        selectedConversationIsProject = isProject;

        // Set the conversation title in the modal
        const titleEl = document.getElementById('modalConversationTitle');
        if (titleEl) {
            titleEl.textContent = `Current Name: ${conversationTitle}`;
        }

        // Show/hide View Matter Details button based on whether there's a matter
        const viewMatterBtn = document.getElementById('viewMatterDetailsBtn');
        if (viewMatterBtn) {
            if (matterId) {
                viewMatterBtn.classList.remove('hidden');
            } else {
                viewMatterBtn.classList.add('hidden');
            }
        }

        document.getElementById('conversationActionsModal').classList.remove('hidden');
        document.getElementById('conversationActionsModal').classList.add('flex');
    };

    window.closeConversationActionsModal = function() {
        document.getElementById('conversationActionsModal').classList.add('hidden');
        document.getElementById('conversationActionsModal').classList.remove('flex');
    };

    window.editConversationFromModal = function() {
        closeConversationActionsModal();

        // Decode HTML entities for editing
        const input = document.getElementById('renameInput');
        const decodedTitle = selectedConversationTitle
            .replace(/&apos;/g, "'")
            .replace(/&quot;/g, '"')
            .replace(/&#96;/g, '`')
            .replace(/&amp;/g, '&');

        input.value = decodedTitle;
        document.getElementById('renameConversationModal').classList.remove('hidden');
        document.getElementById('renameConversationModal').classList.add('flex');
        input.focus();
    };

    window.closeRenameModal = function() {
        document.getElementById('renameConversationModal').classList.add('hidden');
        document.getElementById('renameConversationModal').classList.remove('flex');
    };

    window.confirmRename = async function() {
        const newTitle = document.getElementById('renameInput').value.trim();

        if (!newTitle) {
            Toast.error('Please enter a conversation name');
            return;
        }

        try {
            await api.updateChatSession(selectedConversationId, { title: newTitle });
            Toast.success('Conversation renamed successfully');
            closeRenameModal();

            // Reload conversations in sidebar
            if (typeof ConversationMenu !== 'undefined') {
                ConversationMenu.loadConversations(true);
            }
        } catch (error) {
            console.error('Failed to rename conversation:', error);
            Toast.error('Failed to rename conversation');
        }
    };

    window.viewMatterDetailsFromModal = function() {
        if (selectedConversationMatterId) {
            closeConversationActionsModal();
            window.location.href = `matters.html?matter_id=${selectedConversationMatterId}`;
        }
    };

    window.deleteConversationFromModal = function() {
        const confirmTitle = selectedConversationIsProject
            ? 'Delete Project Conversation?'
            : 'Delete Conversation?';

        const confirmMessage = selectedConversationIsProject
            ? 'This will only delete the chat messages. The matter/project itself will NOT be deleted and you can create new conversations for it later.'
            : 'This action cannot be undone. All messages in this conversation will be permanently deleted.';

        openDeleteConfirmModal(confirmTitle, confirmMessage);
    };

    window.openDeleteConfirmModal = function(title, message) {
        closeConversationActionsModal();
        document.getElementById('deleteConfirmTitle').textContent = title;
        document.getElementById('deleteConfirmMessage').textContent = message;
        document.getElementById('deleteConfirmModal').classList.remove('hidden');
        document.getElementById('deleteConfirmModal').classList.add('flex');
    };

    window.closeDeleteConfirmModal = function() {
        document.getElementById('deleteConfirmModal').classList.add('hidden');
        document.getElementById('deleteConfirmModal').classList.remove('flex');
    };

    window.confirmDeleteConversation = async function() {
        try {
            await api.deleteChatSession(selectedConversationId);
            Toast.success('Conversation deleted successfully');
            closeDeleteConfirmModal();

            // Reload conversations in sidebar
            if (typeof ConversationMenu !== 'undefined') {
                ConversationMenu.loadConversations(true);
            }
        } catch (error) {
            console.error('Failed to delete conversation:', error);
            Toast.error('Failed to delete conversation');
        }
    };
  </script>

  <!-- Conversation Actions Modal -->
  <div id="conversationActionsModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center p-4" style="z-index: 9999;" onclick="if(event.target === this) closeConversationActionsModal()">
      <div class="bg-white rounded-xl shadow-2xl w-full max-w-md" onclick="event.stopPropagation()">
          <!-- Modal Header -->
          <div class="flex items-center justify-between p-6 border-b border-gray-200">
              <h2 class="text-xl font-semibold text-gray-900">Conversation Options</h2>
              <button onclick="closeConversationActionsModal()" class="text-gray-400 hover:text-gray-600 transition-colors">
                  <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                  </svg>
              </button>
          </div>

          <!-- Modal Body -->
          <div class="p-6">
              <h3 id="modalConversationTitle" class="text-lg font-medium text-gray-900 mb-6"></h3>

              <!-- Action Buttons -->
              <div class="space-y-3">
                  <!-- Rename Conversation -->
                  <button onclick="editConversationFromModal()" class="w-full flex items-center gap-3 p-4 text-left bg-white border-2 border-gray-200 rounded-xl hover:border-indigo-300 hover:bg-indigo-50 transition-all group">
                      <div class="flex-shrink-0 w-10 h-10 bg-indigo-100 rounded-lg flex items-center justify-center group-hover:bg-indigo-200 transition-colors">
                          <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                          </svg>
                      </div>
                      <div class="flex-1">
                          <div class="font-medium text-gray-900">Rename Conversation</div>
                          <div class="text-sm text-gray-500">Change the conversation name</div>
                      </div>
                  </button>

                  <!-- View Matter Details (conditionally shown) -->
                  <button id="viewMatterDetailsBtn" onclick="viewMatterDetailsFromModal()" class="w-full flex items-center gap-3 p-4 text-left bg-white border-2 border-gray-200 rounded-xl hover:border-indigo-300 hover:bg-indigo-50 transition-all group hidden">
                      <div class="flex-shrink-0 w-10 h-10 bg-blue-100 rounded-lg flex items-center justify-center group-hover:bg-blue-200 transition-colors">
                          <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                          </svg>
                      </div>
                      <div class="flex-1">
                          <div class="font-medium text-gray-900">View Matter Details</div>
                          <div class="text-sm text-gray-500">Open the associated matter</div>
                      </div>
                  </button>

                  <!-- Delete Conversation -->
                  <button onclick="deleteConversationFromModal()" class="w-full flex items-center gap-3 p-4 text-left bg-white border-2 border-gray-200 rounded-xl hover:border-red-300 hover:bg-red-50 transition-all group">
                      <div class="flex-shrink-0 w-10 h-10 bg-red-100 rounded-lg flex items-center justify-center group-hover:bg-red-200 transition-colors">
                          <svg class="w-5 h-5 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                          </svg>
                      </div>
                      <div class="flex-1">
                          <div class="font-medium text-gray-900">Delete Conversation</div>
                          <div class="text-sm text-gray-500">Permanently remove this conversation</div>
                      </div>
                  </button>
              </div>
          </div>
      </div>
  </div>

  <!-- Rename Conversation Modal -->
  <div id="renameConversationModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center p-4" style="z-index: 10000;" onclick="if(event.target === this) closeRenameModal()">
      <div class="bg-white rounded-xl shadow-2xl w-full max-w-md" onclick="event.stopPropagation()">
          <!-- Modal Header -->
          <div class="flex items-center justify-between p-6 border-b border-gray-200">
              <h2 class="text-xl font-semibold text-gray-900">Rename Conversation</h2>
              <button onclick="closeRenameModal()" class="text-gray-400 hover:text-gray-600 transition-colors">
                  <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                  </svg>
              </button>
          </div>

          <!-- Modal Body -->
          <div class="p-6">
              <label for="renameInput" class="block text-sm font-medium text-gray-700 mb-2">New conversation name</label>
              <input
                  type="text"
                  id="renameInput"
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                  placeholder="Enter new conversation name"
                  onkeypress="if(event.key === 'Enter') confirmRename()"
              />
          </div>

          <!-- Modal Footer -->
          <div class="flex items-center justify-end gap-3 p-6 border-t border-gray-200">
              <button onclick="closeRenameModal()" class="px-4 py-2 text-sm font-medium text-gray-700 hover:text-gray-900 transition-colors">
                  Cancel
              </button>
              <button onclick="confirmRename()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg transition-colors">
                  Save
              </button>
          </div>
      </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div id="deleteConfirmModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center p-4" style="z-index: 10001;" onclick="if(event.target === this) closeDeleteConfirmModal()">
      <div class="bg-white rounded-xl shadow-2xl w-full max-w-md" onclick="event.stopPropagation()">
          <!-- Modal Header -->
          <div class="flex items-center justify-between p-6 border-b border-gray-200">
              <div class="flex items-center gap-3">
                  <div class="flex-shrink-0 w-10 h-10 bg-red-100 rounded-lg flex items-center justify-center">
                      <svg class="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                      </svg>
                  </div>
                  <h2 id="deleteConfirmTitle" class="text-xl font-semibold text-gray-900">Delete Conversation?</h2>
              </div>
              <button onclick="closeDeleteConfirmModal()" class="text-gray-400 hover:text-gray-600 transition-colors">
                  <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                  </svg>
              </button>
          </div>

          <!-- Modal Body -->
          <div class="p-6">
              <p id="deleteConfirmMessage" class="text-gray-600 leading-relaxed"></p>
          </div>

          <!-- Modal Footer -->
          <div class="flex items-center justify-end gap-3 p-6 border-t border-gray-200 bg-gray-50">
              <button onclick="closeDeleteConfirmModal()" class="px-4 py-2 text-sm font-medium text-gray-700 hover:text-gray-900 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
                  Cancel
              </button>
              <button onclick="confirmDeleteConversation()" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white text-sm font-medium rounded-lg transition-colors flex items-center gap-2">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                  </svg>
                  Delete
              </button>
          </div>
      </div>
  </div>
  </div>
</body>
</html>
