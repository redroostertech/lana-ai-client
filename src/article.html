<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article - LANA AI</title>

  <!-- ── CSS + Tailwind in head — behavioral scripts at end of body ── -->
  <link rel="stylesheet" href="css/lex-tokens.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/tailwind-output.css">
  <link rel="stylesheet" href="css/companion-bridge-consent.css">
  <script src="js/tailwind-loader.js"></script>

  <style>
    /* Article typography styles */
    .article-content h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-top: 2rem;
      margin-bottom: 1rem;
      color: #111827;
    }
    .article-content h2 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-top: 1.75rem;
      margin-bottom: 0.875rem;
      color: #1f2937;
    }
    .article-content h3 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-top: 1.5rem;
      margin-bottom: 0.75rem;
      color: #374151;
    }
    .article-content p {
      margin-bottom: 1rem;
      line-height: 1.75;
      color: #4b5563;
    }
    .article-content ul, .article-content ol {
      margin-bottom: 1rem;
      padding-left: 1.5rem;
    }
    .article-content li {
      margin-bottom: 0.5rem;
      line-height: 1.75;
      color: #4b5563;
    }
    .article-content ul {
      list-style-type: disc;
    }
    .article-content ol {
      list-style-type: decimal;
    }
    .article-content strong {
      font-weight: 600;
      color: #1f2937;
    }
    .article-content code {
      background-color: #f3f4f6;
      padding: 0.125rem 0.375rem;
      border-radius: 0.25rem;
      font-size: 0.875em;
      font-family: 'Courier New', monospace;
      color: #dc2626;
    }
    .article-content blockquote {
      border-left: 4px solid #6366f1;
      padding-left: 1rem;
      margin: 1.5rem 0;
      color: #6b7280;
      font-style: italic;
    }
  </style>

  <link rel="stylesheet" href="css/lex-chat.css">
</head>
<body>

  <!-- Branded loader — shows once lex-loader.js upgrades the element -->
  <lex-loader theme="light"></lex-loader>

  <!-- App shell — sidebar, topbar, empty content area.
       Page content lives in <template> below and gets injected after
       the shell renders. This avoids double-rendering of child components. -->
  <lex-app
    logo-src="img/logo-light.png"
    logo-alt="LANA AI"
    logo-href="dashboard.html"
    active-nav-id="help"
    page-title="Help Article"
  ></lex-app>

  <!-- Page content as inert <template> — elements inside are NOT upgraded
       by the browser until cloned into the live DOM. Zero double-rendering. -->
  <template id="page-content">

    <main>

      <!-- Loading State -->
      <div id="articleLoading" class="flex items-center justify-center py-12">
        <div class="animate-spin w-12 h-12 border-4 border-indigo-200 border-t-indigo-600 rounded-full"></div>
      </div>

      <!-- Error State -->
      <div id="articleError" class="hidden bg-red-50 border border-red-200 rounded-lg p-6 text-center max-w-2xl mx-auto">
        <svg class="w-12 h-12 text-red-500 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <h3 class="text-lg font-semibold text-gray-900 mb-2">Article not found</h3>
        <p class="text-gray-600 mb-4">The requested article could not be found.</p>
        <a href="help.html" class="inline-block px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors">
          Back to Help Center
        </a>
      </div>

      <!-- Article Content -->
      <div id="articleContainer" class="hidden">
        <div class="max-w-4xl mx-auto">
          <lex-breadcrumb id="articleBreadcrumb" items='[{"label":"Help &amp; Support","href":"help.html"},{"label":"Loading..."}]'></lex-breadcrumb>

          <!-- Article Header -->
          <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8 mb-6">
            <div class="flex items-start justify-between mb-4">
              <div class="flex-1">
                <div class="flex items-center gap-2 mb-3">
                  <span id="articleCategory" class="px-3 py-1 bg-indigo-100 text-indigo-700 text-sm font-medium rounded-full"></span>
                  <span class="text-sm text-gray-500" id="articleReadTime"></span>
                </div>
                <h1 id="articleTitle" class="text-4xl font-bold text-gray-900 mb-3"></h1>
                <p id="articleSummary" class="text-lg text-gray-600"></p>
              </div>
            </div>
            <div class="flex items-center gap-6 text-sm text-gray-500 pt-4 border-t border-gray-200">
              <div class="flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span>Updated <span id="articleUpdated"></span></span>
              </div>
              <div id="articleTags" class="flex items-center gap-2">
                <!-- Tags will be inserted here -->
              </div>
            </div>
          </div>

          <!-- Article Body -->
          <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8 mb-6">
            <div id="articleContent" class="article-content prose max-w-none">
              <!-- Article content will be inserted here -->
            </div>
          </div>

          <!-- Was this helpful? -->
          <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8 mb-6" style="display: none;">
            <h3 class="text-lg font-semibold text-gray-900 mb-4">Was this article helpful?</h3>
            <div class="flex items-center gap-4">
              <button id="helpfulYes" class="flex items-center gap-2 px-4 py-2 border border-gray-300 rounded-lg hover:bg-green-50 hover:border-green-500 hover:text-green-700 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10h4.764a2 2 0 011.789 2.894l-3.5 7A2 2 0 0115.263 21h-4.017c-.163 0-.326-.02-.485-.06L7 20m7-10V5a2 2 0 00-2-2h-.095c-.5 0-.905.405-.905.905 0 .714-.211 1.412-.608 2.006L7 11v9m7-10h-2M7 20H5a2 2 0 01-2-2v-6a2 2 0 012-2h2.5"></path>
                </svg>
                Yes
              </button>
              <button id="helpfulNo" class="flex items-center gap-2 px-4 py-2 border border-gray-300 rounded-lg hover:bg-red-50 hover:border-red-500 hover:text-red-700 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14H5.236a2 2 0 01-1.789-2.894l3.5-7A2 2 0 018.736 3h4.018a2 2 0 01.485.06l3.76.94m-7 10v5a2 2 0 002 2h.096c.5 0 .905-.405.905-.904 0-.715.211-1.413.608-2.008L17 13V4m-7 10h2m5-10h2a2 2 0 012 2v6a2 2 0 01-2 2h-2.5"></path>
                </svg>
                No
              </button>
              <div id="feedbackMessage" class="hidden text-sm text-green-600 flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
                Thank you for your feedback!
              </div>
            </div>
          </div>

          <!-- Related Articles -->
          <div id="relatedArticles" class="bg-white rounded-xl shadow-sm border border-gray-200 p-8">
            <h3 class="text-lg font-semibold text-gray-900 mb-4">Related Articles</h3>
            <div id="relatedArticlesList" class="space-y-3">
              <!-- Related articles will be inserted here -->
            </div>
          </div>
        </div>
      </div>

    </main>

  </template>

  <noscript>
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,sans-serif;color:#666;">
      Please enable JavaScript to use LANA AI.
    </div>
  </noscript>

  <!-- ══════════════════════════════════════════════════════════════════
       Scripts at end of body — HTML renders first, scripts load after
       ══════════════════════════════════════════════════════════════════ -->

  <!-- Universal shell scripts -->
  <script src="js/error-reporter.js"></script>
  <script src="js/config.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/utils/rename-conversation.js"></script>
  <script src="js/components.js"></script>
  <script src="js/version.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/navigation-helpers.js"></script>
  <script src="js/new-project-modal.js"></script>
  <script src="js/conversation-menu.js"></script>
  <script src="js/conversation-search-modal.js"></script>
  <script src="js/contact-search-modal.js"></script>
  <script src="js/notifications.js"></script>

  <!-- Lex UI core -->
  <script src="js/lex/lex.core.js"></script>
  <script src="js/lex/lex.icons.js"></script>
  <script src="js/lex/lex.data.js"></script>
  <script src="js/lex/lex.forms.js"></script>
  <script src="js/lex/lex.state.js"></script>
  <script src="js/lex/lex.utils.js"></script>
  <script src="js/lex/lex.auth.js"></script>
  <script src="js/lex/lex-nav.js"></script>

  <!-- Lex UI layout (shell components — lex-app builds sidebar/topbar) -->
  <script src="js/lex/components/foundation/lex-loader.js"></script>
  <script src="js/lex/components/foundation/lex-toast.js"></script>
  <script src="js/lex/components/foundation/lex-spinner.js"></script>
  <script src="js/lex/components/foundation/lex-btn.js"></script>
  <script src="js/lex/components/foundation/lex-empty.js"></script>
  <script src="js/lex/components/layout/lex-sidebar.js"></script>
  <script src="js/lex/components/layout/lex-topbar.js"></script>
  <script src="js/lex/components/layout/lex-conversation-item.js"></script>
  <script src="js/lex/components/layout/lex-notification-panel.js"></script>
  <script src="js/lex/components/layout/lex-app.js"></script>

  <!-- Page-specific Lex components -->
  <script src="js/lex/components/foundation/lex-breadcrumb.js"></script>
  <script src="js/lex/components/foundation/lex-modal.js"></script>

  <!-- Inject page content + hoist modals -->
  <script src="js/lex/lex-page-init.js"></script>

  <!-- Page controller (MUST be last before auth-guard) -->
  <script src="js/article.js"></script>

  <!-- PAC bridge consent handler (Lex modal for token requests) -->
  <script src="js/companion-bridge-consent.js"></script>

  <lex-lana-dock page-scope="dashboard" context-type="full_chat" placeholder="Ask LANA anything..." thread-title="LANA Chat"></lex-lana-dock>
  <!-- LANA dock (IDE-style docked chat panel) -->
  <script src="js/lex/chat/lex-chat.format.js"></script>
  <script src="js/lex/chat/lex-chat.source.js"></script>
  <script src="js/lex/chat/lex-chat.message.js"></script>
  <script src="js/lex/chat/lex-chat.activity.js"></script>
  <script src="js/lex/chat/lex-chat.documents.js"></script>
  <script src="js/lex/chat/lex-chat.composer-mentions.js"></script>
  <script src="js/lex/chat/lex-chat.composer.js"></script>
  <script src="js/lex/chat/lex-chat.thread.js"></script>
  <script src="js/lex/chat/lex-chat.threads.js"></script>
  <script src="js/lex/chat/lex-chat.js"></script>
  <script src="js/lex/chat/lex-dynamic-card.renderer.js"></script>
  <script src="js/lex/chat/lex-agentic-plan-card.js"></script>
  <script src="js/lex/chat/lex-chat.index.js"></script>
  <script src="js/lex/components/chat/lex-lana-panel.js"></script>
  <script src="js/lex/components/layout/lex-lana-dock.js"></script>

  <!-- Auth guard + loader dismiss (MUST be last) -->
  <script src="js/auth-guard.js"></script>
</body>
</html>
