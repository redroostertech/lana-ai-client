<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Active Sessions - LANA AI</title>

  <!-- ── CSS + Tailwind in head — behavioral scripts at end of body ── -->
  <link rel="stylesheet" href="../css/lex-tokens.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/tailwind-output.css">
  <script src="../js/tailwind-loader.js"></script>

</head>
<body>

  <!-- Branded loader — shows once lex-loader.js upgrades the element -->
  <lex-loader theme="light"></lex-loader>

  <!-- App shell -->
  <lex-app
    logo-src="../img/logo-light.png"
    logo-alt="LANA AI"
    logo-href="../dashboard.html"
    active-nav-id="admin"
    page-title="Active Sessions"
  ></lex-app>

  <!-- Page content as inert <template> -->
  <template id="page-content">

    <main class="p-4 lg:p-8">

      <!-- Page header -->
      <lex-banner
        variant="light"
        size="compact"
        heading="Active Sessions"
        subtitle="Monitor and manage active user sessions across the platform"
      >
        <button id="refreshSessionsBtn"
          class="flex items-center gap-2 px-3 py-1.5 text-sm rounded-lg transition-colors"
          style="background:var(--lex-bg-secondary);color:var(--lex-text-secondary);">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
            </path>
          </svg>
          Refresh
        </button>
      </lex-banner>

      <lex-breadcrumb items='[{"label":"Administration","href":"admin/index.html"},{"label":"Active Sessions"}]'></lex-breadcrumb>

      <!-- Stats -->
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
        <lex-metric id="metricActiveSessions" label="Active Sessions" value="-"></lex-metric>
        <lex-metric id="metricUniqueUsers"    label="Unique Users"    value="-"></lex-metric>
        <lex-metric id="metricLocations"      label="Unique Locations" value="-"></lex-metric>
        <lex-metric id="metricAvgAge"         label="Avg. Session Age" value="-"></lex-metric>
      </div>

      <!-- Sessions Table -->
      <lex-card padding="none">
        <lex-table
          id="sessionsTable"
          columns="user_display,device,ip_location,started,last_activity,status"
          labels="User,Device,IP / Location,Started,Last Activity,Status"
          searchable
          empty-text="No active sessions found"
          sort-by="started"
          sort-dir="desc"
        ></lex-table>
      </lex-card>

    </main>


    <!-- ================================================================
         Session Details Drawer
         ================================================================ -->
    <lex-drawer
      id="sessionDrawer"
      heading="Session Details"
      side="right"
      width="480px"
    >
      <div id="sessionDrawerContent">
        <div id="sessionDrawerLoading" style="text-align:center;padding:2rem;">
          <lex-spinner label="Loading session..."></lex-spinner>
        </div>
        <div id="sessionDrawerBody" class="hidden">

          <!-- User header -->
          <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;">
            <div id="sessionDrawerAvatar" style="
              width:3.5rem;height:3.5rem;border-radius:9999px;
              background:var(--lex-bg-accent);color:var(--lex-text-on-accent);
              display:flex;align-items:center;justify-content:center;
              font-size:1.25rem;font-weight:600;flex-shrink:0;
            "></div>
            <div style="min-width:0;">
              <div id="sessionDrawerName" style="font-size:var(--lex-body-base-size,1rem);font-weight:600;color:var(--lex-text-primary);"></div>
              <div id="sessionDrawerEmail" style="font-size:var(--lex-body-sm-size,0.875rem);color:var(--lex-text-tertiary);"></div>
            </div>
          </div>

          <lex-divider style="margin-bottom:1rem;"></lex-divider>

          <!-- Key-value detail pairs -->
          <lex-stack direction="vertical" gap="sm" style="margin-bottom:1.5rem;">
            <lex-kv id="drawerKvStatus"     label="Status"></lex-kv>
            <lex-kv id="drawerKvSessionId"  label="Session ID"></lex-kv>
            <lex-kv id="drawerKvBrowser"    label="Browser"></lex-kv>
            <lex-kv id="drawerKvOS"         label="Operating System"></lex-kv>
            <lex-kv id="drawerKvDeviceType" label="Device Type"></lex-kv>
            <lex-kv id="drawerKvIP"         label="IP Address"></lex-kv>
            <lex-kv id="drawerKvLocation"   label="Location"></lex-kv>
            <lex-kv id="drawerKvStarted"    label="Session Started"></lex-kv>
            <lex-kv id="drawerKvLastActive" label="Last Activity"></lex-kv>
            <lex-kv id="drawerKvDuration"   label="Duration"></lex-kv>
          </lex-stack>

          <lex-divider style="margin-bottom:1rem;"></lex-divider>

          <!-- Terminate button -->
          <lex-btn id="drawerTerminateBtn" variant="danger" icon="log-out" style="width:100%;">Terminate Session</lex-btn>

        </div>
      </div>
    </lex-drawer>

  </template>

  <noscript>
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,sans-serif;color:#666;">
      Please enable JavaScript to use LANA AI.
    </div>
  </noscript>

  <!-- ══════════════════════════════════════════════════════════════════
       Scripts at end of body — HTML renders first, scripts load after
       ══════════════════════════════════════════════════════════════════ -->

  <!-- Universal shell scripts -->
  <script src="../js/error-reporter.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/version.js"></script>
  <script src="../js/menu.js"></script>
  <script src="../js/navigation-helpers.js"></script>
  <script src="../js/new-project-modal.js"></script>
  <script src="../js/conversation-menu.js"></script>
  <script src="../js/conversation-search-modal.js"></script>
  <script src="../js/contact-search-modal.js"></script>
  <script src="../js/notifications.js"></script>

  <!-- Lex UI core -->
  <script src="../js/lex/lex.core.js"></script>
  <script src="../js/lex/lex.icons.js"></script>
  <script src="../js/lex/lex.data.js"></script>
  <script src="../js/lex/lex.forms.js"></script>
  <script src="../js/lex/lex.state.js"></script>
  <script src="../js/lex/lex.utils.js"></script>
  <script src="../js/lex/lex.auth.js"></script>
  <script src="../js/lex/lex-nav.js"></script>

  <!-- Lex UI foundation + layout -->
  <script src="../js/lex/components/foundation/lex-loader.js"></script>
  <script src="../js/lex/components/foundation/lex-toast.js"></script>
  <script src="../js/lex/components/foundation/lex-spinner.js"></script>
  <script src="../js/lex/components/foundation/lex-btn.js"></script>
  <script src="../js/lex/components/foundation/lex-empty.js"></script>
  <script src="../js/lex/components/form/lex-segmented.js"></script>
  <script src="../js/lex/components/layout/lex-sidebar.js"></script>
  <script src="../js/lex/components/layout/lex-topbar.js"></script>
  <script src="../js/lex/components/layout/lex-conversation-item.js"></script>
  <script src="../js/lex/components/layout/lex-notification-panel.js"></script>
  <script src="../js/lex/components/layout/lex-app.js"></script>

  <!-- Page-specific Lex components (BEFORE inject) -->
  <script src="../js/lex/components/foundation/lex-breadcrumb.js"></script>
  <script src="../js/lex/components/foundation/lex-banner.js"></script>
  <script src="../js/lex/components/foundation/lex-metric.js"></script>
  <script src="../js/lex/components/foundation/lex-card.js"></script>
  <script src="../js/lex/components/foundation/lex-kv.js"></script>
  <script src="../js/lex/components/foundation/lex-divider.js"></script>
  <script src="../js/lex/components/foundation/lex-stack.js"></script>
  <script src="../js/lex/components/foundation/lex-drawer.js"></script>
  <script src="../js/lex/components/foundation/lex-modal.js"></script>
  <script src="../js/lex/components/data/lex-table.js"></script>
  <script src="../js/lex/components/form/lex-dropdown-btn.js"></script>

  <!-- Inject page content + hoist modals -->
  <script src="../js/lex/lex-page-init.js"></script>

  <!-- Page controller -->
  <script src="../js/admin/admin-sessions.js"></script>

  <!-- Auth guard + loader dismiss (MUST be last) -->
  <script src="../js/auth-guard.js"></script>
</body>
</html>
