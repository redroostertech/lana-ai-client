<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Builder - LANA AI</title>

  <link rel="stylesheet" href="../css/lex-tokens.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/tailwind-output.css">
  <link rel="stylesheet" href="../css/admin/insights-dashboard.css">
  <script src="../js/tailwind-loader.js"></script>
  <link rel="stylesheet" href="../css/lex-chat.css">
</head>
<body>
  <lex-loader theme="light"></lex-loader>

  <lex-app
    logo-src="../img/logo-light.png"
    logo-alt="LANA AI"
    logo-href="../dashboard.html"
    active-nav-id="insights-create"
    page-title="Dashboard Builder"
  ></lex-app>

  <template id="page-content">
    <main>
      <lex-banner
        id="dashboardBuilderBanner"
        variant="light"
        heading="Dashboard Builder"
        subtitle="Create or edit dashboards from metric catalog cards"
        lana
        lana-context-type="full_chat"
      >
        <lex-btn id="dashboardBuilderSave" variant="primary" size="sm">Save Dashboard</lex-btn>
      </lex-banner>

      <lex-breadcrumb id="dashboardBuilderBreadcrumb"></lex-breadcrumb>

      <section class="dash-builder dash-builder--wizard">
        <div class="dash-builder__steps" aria-label="Dashboard builder progress">
          <div class="dash-builder__step-indicator is-active" data-builder-step-indicator="details">
            <span>1</span>
            <strong>Dashboard</strong>
          </div>
          <div class="dash-builder__step-indicator" data-builder-step-indicator="visibility">
            <span>2</span>
            <strong>Access</strong>
          </div>
          <div class="dash-builder__step-indicator" data-builder-step-indicator="metrics">
            <span>3</span>
            <strong>Metrics</strong>
          </div>
        </div>

        <div class="dash-builder__wizard">
          <section class="dash-builder__panel dash-builder__step" data-builder-step="details">
            <div class="dash-builder__step-heading">
              <div>
                <div class="dash-builder__panel-title">Step 1</div>
                <h2>Dashboard details</h2>
              </div>
              <span class="dash-builder__step-state" data-builder-step-state="details">Required</span>
            </div>
            <label class="dash-builder__field">
              <span>Name</span>
              <input id="dashboardBuilderName" type="text" placeholder="Dashboard name" autocomplete="off">
            </label>
            <label class="dash-builder__field">
              <span>Description</span>
              <textarea id="dashboardBuilderDescription" rows="4" placeholder="What this dashboard is for"></textarea>
            </label>
            <label class="dash-builder__field">
              <span>Default view</span>
              <select id="dashboardBuilderType">
                <option value="owner">Owner Performance</option>
                <option value="department">Department Dashboards</option>
                <option value="attorney">Attorney Performance</option>
                <option value="other">Other Dashboards</option>
              </select>
            </label>
          </section>

          <section class="dash-builder__panel dash-builder__step" data-builder-step="visibility" aria-disabled="true">
            <div class="dash-builder__step-heading">
              <div>
                <div class="dash-builder__panel-title">Step 2</div>
                <h2>Visibility and access</h2>
              </div>
              <span class="dash-builder__step-state" data-builder-step-state="visibility">Locked</span>
            </div>
            <label class="dash-builder__field">
              <span>Access</span>
              <select id="dashboardBuilderVisibility">
                <option value="private">Private</option>
                <option value="organization">Organization-wide</option>
                <option value="custom">Specific people or groups</option>
              </select>
            </label>
            <div id="dashboardBuilderShareSearchWrap" class="dash-builder__share" hidden>
              <label class="dash-builder__field">
                <span>Add people or groups</span>
                <input id="dashboardBuilderShareSearch" type="search" placeholder="Search users or groups" autocomplete="off">
              </label>
              <div id="dashboardBuilderShareResults" class="dash-builder__share-results"></div>
            </div>
            <div id="dashboardBuilderShareList" class="dash-builder__share-list"></div>
          </section>

          <section class="dash-builder__panel dash-builder__step" data-builder-step="metrics" aria-disabled="true">
            <div class="dash-builder__step-heading">
              <div>
                <div class="dash-builder__panel-title">Step 3</div>
                <h2>Select metric cards</h2>
              </div>
              <span class="dash-builder__step-state" data-builder-step-state="metrics">Locked</span>
            </div>
            <div class="dash-builder__selected">
              <div>
                <div class="dash-builder__panel-title">Selected Metrics</div>
                <div class="dash-builder__muted" id="dashboardBuilderSelectedCount">0 selected</div>
              </div>
              <button id="dashboardBuilderClear" class="dash-builder__link" type="button">Clear</button>
            </div>
            <div class="dash-browser">
              <aside class="dash-browser__rail" aria-label="Dashboard metric filters">
                <div class="dash-browser__rail-title">Types</div>
                <div class="dash-browser__search">
                  <span class="dash-browser__search-icon" aria-hidden="true">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <circle cx="11" cy="11" r="8"></circle>
                      <path d="m21 21-4.35-4.35"></path>
                    </svg>
                  </span>
                  <input id="dashboardBuilderMetricSearch" type="search" placeholder="Search metrics..." autocomplete="off">
                </div>
                <div id="dashboardBuilderTypeFilters" class="dash-browser__filters"></div>
              </aside>
              <div class="dash-browser__content">
                <div id="dashboardBuilderMetricGrid" class="dash-card-grid"></div>
              </div>
            </div>
            <lex-empty id="dashboardBuilderEmpty" message="No metrics found" description="Try a different search or type filter" icon="chart" hidden></lex-empty>
          </section>
        </div>
      </section>
    </main>
  </template>

  <noscript><div class="lex-noscript-message">Please enable JavaScript to use LANA AI.</div></noscript>

  <script src="../js/error-reporter.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/time-utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/version.js"></script>
  <script src="../js/menu.js"></script>
  <script src="../js/navigation-helpers.js"></script>
  <script src="../js/new-project-modal.js"></script>
  <script src="../js/conversation-search-modal.js"></script>
  <script src="../js/contact-search-modal.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/lex/lex.core.js"></script>
  <script src="../js/lex/lex.icons.js"></script>
  <script src="../js/lex/lex.data.js"></script>
  <script src="../js/lex/lex.forms.js"></script>
  <script src="../js/lex/lex.state.js"></script>
  <script src="../js/lex/lex.utils.js"></script>
  <script src="../js/lex/lex.auth.js"></script>
  <script src="../js/lex/lex-nav.js"></script>
  <script src="../js/lex/components/foundation/lex-loader.js"></script>
  <script src="../js/lex/components/foundation/lex-toast.js"></script>
  <script src="../js/lex/components/foundation/lex-spinner.js"></script>
  <script src="../js/lex/components/foundation/lex-btn.js"></script>
  <script src="../js/lex/components/foundation/lex-empty.js"></script>
  <script src="../js/lex/components/form/lex-segmented.js"></script>
  <script src="../js/lex/components/layout/lex-sidebar.js"></script>
  <script src="../js/lex/components/layout/lex-topbar.js"></script>
  <script src="../js/lex/components/layout/lex-conversation-item.js"></script>
  <script src="../js/lex/components/layout/lex-notification-panel.js"></script>
  <script src="../js/lex/components/layout/lex-app.js"></script>
  <script src="../js/lex/components/foundation/lex-breadcrumb.js"></script>
  <script src="../js/lex/components/foundation/lex-banner.js"></script>
  <script src="../js/lex/lex-page-init.js"></script>
  <script src="../js/admin/dashboard-builder.js"></script>
  <script src="../js/auth-guard.js"></script>
  <lex-lana-dock page-scope="dashboard" context-type="full_chat" placeholder="Ask LANA anything..." thread-title="LANA Chat"></lex-lana-dock>
  <!-- LANA dock (IDE-style docked chat panel) -->
  <script src="../js/lex/chat/lex-chat.format.js"></script>
  <script src="../js/lex/chat/lex-chat.conversations-api.js"></script>
  <script src="../js/lex/chat/lex-chat.source.js"></script>
  <script src="../js/lex/chat/lex-chat.message.js"></script>
  <script src="../js/lex/chat/lex-chat.activity.js"></script>
  <script src="../js/lex/chat/lex-chat.documents.js"></script>
  <script src="../js/lex/chat/lex-chat.composer-mentions.js"></script>
  <script src="../js/lex/chat/lex-chat.composer.js"></script>
  <script src="../js/lex/chat/lex-chat.thread.js"></script>
  <script src="../js/lex/chat/lex-chat.threads.js"></script>
  <script src="../js/lex/chat/lex-chat.js"></script>
  <script src="../js/lex/chat/lex-dynamic-card.renderer.js"></script>
  <script src="../js/lex/chat/lex-agentic-plan-card.js"></script>
  <script src="../js/lex/chat/lex-chat.index.js"></script>
  <script src="../js/lex/components/chat/lex-lana-panel.js"></script>
  <script src="../js/lex/components/layout/lex-lana-dock.js"></script>
</body>
</html>
