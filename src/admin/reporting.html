<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports - LANA AI</title>

  <!-- CSS in head -->
  <link rel="stylesheet" href="../css/lex-tokens.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/tailwind-output.css">
  <link rel="stylesheet" href="../insights/raw-data-viewer.css">
  <script src="../js/tailwind-loader.js"></script>

</head>
<body>

  <lex-loader theme="light"></lex-loader>

  <lex-app
    logo-src="../img/logo-light.png"
    logo-alt="LANA AI"
    logo-href="../dashboard.html"
    active-nav-id="reports"
    page-title="Reports"
  ></lex-app>

  <template id="page-content">

    <main>

      <!-- Page Header -->
      <lex-banner
        id="reportingBanner"
        variant="light"
        corners
        heading="Reports"
        subtitle="Select a report module from the sidebar to get started"
      ></lex-banner>

      <!-- Two-column layout: Module Sidebar + Main Content -->
      <div id="reportingLayout" style="display:grid;grid-template-columns:260px 1fr;gap:1.5rem;align-items:start;">

        <!-- ── Module Sidebar ──────────────────────────────────────── -->
        <div id="moduleSidebarColumn">

          <!-- External Reporting Links -->
          <lex-card id="externalLinksCard" padding="compact">
            <div style="padding:0.25rem 0 0.75rem;border-bottom:1px solid var(--lex-border-subtle);margin-bottom:0.75rem;">
              <p class="lex-overline lex-text-secondary" style="margin-bottom:0.5rem;">External Reporting</p>
              <div style="display:flex;flex-direction:column;gap:0.375rem;">
                <a href="http://nuvuaimodel.nuvuadvisory.com" target="_blank" rel="noopener noreferrer"
                   class="lex-hover-bg-accent"
                   style="display:flex;align-items:center;gap:0.5rem;padding:0.375rem 0.5rem;border-radius:var(--lex-radius-md);text-decoration:none;transition:var(--lex-transition-fast);">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--lex-text-accent);flex-shrink:0;" aria-hidden="true">
                    <path d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                  </svg>
                  <span class="lex-label lex-text-primary">NuVu Advisory</span>
                </a>
                <a href="https://amabcm.lovable.app/" target="_blank" rel="noopener noreferrer"
                   class="lex-hover-bg-accent"
                   style="display:flex;align-items:center;gap:0.5rem;padding:0.375rem 0.5rem;border-radius:var(--lex-radius-md);text-decoration:none;transition:var(--lex-transition-fast);">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--lex-text-accent);flex-shrink:0;" aria-hidden="true">
                    <path d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                  </svg>
                  <span class="lex-label lex-text-primary">AMABCM</span>
                </a>
              </div>
            </div>

            <!-- Module Search + List -->
            <p class="lex-overline lex-text-secondary" style="margin-bottom:0.5rem;">Report Modules</p>
            <lex-input
              id="moduleSearchInput"
              placeholder="Search modules..."
              leading-icon="search"
              size="sm"
              style="margin-bottom:0.75rem;"
            ></lex-input>

            <div id="moduleMenu" style="display:flex;flex-direction:column;gap:0.25rem;">
              <div class="lex-body-sm lex-text-secondary" style="padding:0.75rem;text-align:center;">Loading modules...</div>
            </div>

            <lex-empty
              id="moduleSearchEmpty"
              message="No modules found"
              description="Try a different search term"
              icon="search"
              style="display:none;"
            ></lex-empty>
          </lex-card>

        </div>

        <!-- ── Main Content Column ────────────────────────────────── -->
        <div id="reportingMainColumn" style="display:flex;flex-direction:column;gap:1.5rem;">

          <!-- Controls Card -->
          <lex-card id="controlsCard">
            <!-- Period Presets -->
            <div style="margin-bottom:1rem;">
              <p class="lex-label lex-text-secondary" style="margin-bottom:0.5rem;">Quick Select Period</p>
              <div id="periodPresets" style="display:flex;flex-wrap:wrap;gap:0.5rem;">
                <lex-btn data-preset="last7days" variant="secondary" size="sm">Last 7 Days</lex-btn>
                <lex-btn data-preset="last30days" variant="secondary" size="sm">Last 30 Days</lex-btn>
                <lex-btn data-preset="thisMonth" variant="secondary" size="sm">This Month</lex-btn>
                <lex-btn data-preset="lastMonth" variant="secondary" size="sm">Last Month</lex-btn>
                <lex-btn data-preset="thisQuarter" variant="secondary" size="sm">This Quarter</lex-btn>
                <lex-btn data-preset="thisYear" variant="secondary" size="sm">This Year</lex-btn>
                <lex-btn data-preset="lastYear" variant="secondary" size="sm">Last Year</lex-btn>
              </div>
            </div>

            <!-- Date Range Row -->
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem;margin-bottom:1rem;">
              <lex-input id="periodStart" label="Start Date" type="date" name="periodStart"></lex-input>
              <lex-input id="periodEnd" label="End Date" type="date" name="periodEnd"></lex-input>
              <lex-select
                id="periodType"
                label="Compare By"
                name="periodType"
                options='[{"value":"daily","label":"Daily"},{"value":"weekly","label":"Weekly"},{"value":"monthly","label":"Monthly"},{"value":"quarterly","label":"Quarterly"},{"value":"yearly","label":"Yearly"}]'
              ></lex-select>
            </div>

            <!-- Execute Button -->
            <lex-btn id="executeBtn" variant="primary">Run Report</lex-btn>

            <!-- Execution Feedback -->
            <div id="executionInfo" style="display:none;margin-top:1rem;padding:0.75rem 1rem;background:var(--lex-bg-accent-soft);border:1px solid var(--lex-border-accent);border-radius:var(--lex-radius-md);">
              <p id="executionInfoText" class="lex-body-sm lex-text-accent"></p>
            </div>
            <div id="executionError" style="display:none;margin-top:1rem;padding:0.75rem 1rem;background:var(--lex-status-danger-bg, #fef2f2);border:1px solid var(--lex-status-danger-border, #fecaca);border-radius:var(--lex-radius-md);">
              <p class="lex-label-sm" style="color:var(--lex-status-danger);margin-bottom:0.25rem;">Execution Failed</p>
              <p id="executionErrorText" class="lex-body-sm" style="color:var(--lex-status-danger);"></p>
            </div>
          </lex-card>

          <!-- Results Placeholder (shown when no report has run) -->
          <lex-empty
            id="reportingPlaceholder"
            message="Select a report module"
            description="Choose a module from the sidebar, set your date range, and click Run Report"
            icon="chart"
          ></lex-empty>

          <!-- Module Results (hidden until a report runs) -->
          <div id="moduleResults" style="display:none;flex-direction:column;gap:1.5rem;">
            <!-- Results Header Card -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
              <div class="flex items-start justify-between mb-2">
                <div class="flex items-center gap-3">
                  <h2 id="moduleTitle" class="text-xl font-bold text-gray-900"></h2>
                  <button onclick="window._reporting.showModuleInfo()" class="flex items-center gap-1 px-3 py-1 text-xs font-medium text-indigo-600 hover:bg-indigo-50 rounded-lg">Learn More</button>
                </div>
                <div class="flex gap-3">
                  <button onclick="window._reporting.exportToPDF()" class="flex items-center gap-2 px-4 py-2 bg-white border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 text-sm">PDF</button>
                  <button onclick="window._reporting.exportToCSV()" class="flex items-center gap-2 px-4 py-2 bg-white border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 text-sm">CSV</button>
                </div>
              </div>
              <div class="grid grid-cols-4 gap-4 mt-4 text-sm">
                <div><p class="text-xs text-gray-500">Compare By</p><p id="resultPeriodType" class="font-medium text-gray-900"></p></div>
                <div><p class="text-xs text-gray-500">Current Period</p><p id="resultCurrentPeriod" class="font-medium text-gray-900"></p></div>
                <div><p class="text-xs text-gray-500">Prior Period</p><p id="resultPriorPeriod" class="font-medium text-gray-900"></p></div>
                <div><p class="text-xs text-gray-500">Execution Time</p><p id="executionTime" class="font-medium text-gray-900"></p></div>
              </div>
              <div class="flex items-center gap-3 mt-4">
                <button id="dataSourcesBtn" class="flex items-center gap-2 px-3 py-1.5 text-xs font-medium text-gray-600 border border-gray-300 rounded-lg hover:bg-gray-50">
                  <span id="dataSourcesCount">0 Connectors</span>
                </button>
                <button id="missingEntitiesBtn" class="hidden flex items-center gap-2 px-3 py-1.5 text-xs font-medium text-amber-700 bg-amber-50 border border-amber-200 rounded-lg hover:bg-amber-100">
                  <span id="missingEntitiesCount">0 Missing</span>
                </button>
              </div>
            </div>
            <div id="visualizationsContainer"></div>
          </div>

        </div><!-- /reportingMainColumn -->

      </div><!-- /reportingLayout -->

      <!-- Drilldown Modal -->
      <div id="drilldownModal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-75 overflow-y-auto h-full w-full z-50">
        <div class="relative top-10 mx-auto p-6 w-full max-w-4xl">
          <div class="bg-white rounded-lg shadow-xl">
            <div class="flex items-start justify-between p-5 border-b border-gray-200">
              <h3 id="drilldownTitle" class="text-xl font-semibold text-gray-900"></h3>
              <button onclick="window._reporting.closeDrilldownModal()" class="text-gray-400 hover:text-gray-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
              </button>
            </div>
            <div id="drilldownContent" class="p-5"></div>
          </div>
        </div>
      </div>

      <!-- Data Override Panel Overlay -->
      <div id="dataOverrideOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity"></div>
      <div id="dataOverridePanel" class="fixed inset-y-0 right-0 w-full sm:w-96 bg-white shadow-2xl z-50 transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
        <div class="flex items-center justify-between h-16 px-6 border-b border-gray-200 flex-shrink-0">
          <h2 class="text-lg font-semibold text-gray-900">Override Target Value</h2>
          <button id="closeDataOverridePanel" class="text-gray-400 hover:text-gray-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          </button>
        </div>
        <div class="flex-1 overflow-y-auto p-6">
          <div class="mb-6 p-4 bg-indigo-50 rounded-lg border border-indigo-100">
            <h3 id="overrideMetricName" class="font-semibold text-gray-900 mb-1"></h3>
            <p id="overrideMetricDescription" class="text-sm text-gray-600"></p>
            <div class="mt-3 text-xs text-gray-500">
              <p>Period: <span id="overridePeriodRange" class="font-medium text-gray-700"></span></p>
            </div>
          </div>
          <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-2">Current Target</label>
            <div class="p-3 bg-gray-50 rounded-lg border border-gray-200">
              <p id="overrideCurrentValue" class="text-2xl font-bold text-gray-900">-</p>
              <p class="text-xs text-gray-500 mt-1">Default target value</p>
            </div>
          </div>
          <form id="overrideForm" class="space-y-4">
            <div>
              <label for="overrideValue" class="block text-sm font-medium text-gray-700 mb-2">New Target Value <span class="text-red-500">*</span></label>
              <input type="number" id="overrideValue" step="0.01" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" placeholder="Enter new target value">
            </div>
            <div>
              <label for="overrideNotes" class="block text-sm font-medium text-gray-700 mb-2">Notes (Optional)</label>
              <textarea id="overrideNotes" rows="3" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" placeholder="Why are you overriding this value?"></textarea>
            </div>
            <input type="hidden" id="overrideType" value="manual">
            <input type="hidden" id="overridePeriodStart">
            <input type="hidden" id="overridePeriodEnd">
            <input type="hidden" id="overridePeriodType">
            <input type="hidden" id="overrideModuleKey">
            <input type="hidden" id="overrideMetricKey">
            <div class="flex gap-3 pt-4">
              <button type="submit" id="saveOverrideBtn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2 rounded-lg transition-colors">
                <span id="saveOverrideBtnText">Save Override</span>
              </button>
              <button type="button" onclick="window._reporting.closeDataOverridePanel()" class="px-4 py-2 bg-white border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors">Cancel</button>
            </div>
          </form>
          <div id="existingOverridesSection" class="hidden mt-8 pt-6 border-t border-gray-200">
            <h3 class="text-sm font-semibold text-gray-900 mb-3">Existing Override</h3>
            <div id="existingOverridesList" class="space-y-2"></div>
          </div>
        </div>
      </div>

      <!-- Data Sources Modal -->
      <div id="dataSourcesModal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-75 overflow-y-auto h-full w-full z-50">
        <div class="relative top-20 mx-auto p-6 w-full max-w-md">
          <div class="bg-white rounded-lg shadow-xl">
            <div class="flex items-start justify-between p-5 border-b border-gray-200">
              <h3 class="text-xl font-semibold text-gray-900">Data Sources</h3>
              <button onclick="window._reporting.closeDataSourcesModal()" class="text-gray-400 hover:text-gray-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
              </button>
            </div>
            <div class="p-5">
              <p class="text-sm text-gray-600 mb-4">This report pulls data from the following connectors:</p>
              <div id="dataSourcesList" class="space-y-3"></div>
            </div>
            <div class="flex justify-end p-5 border-t border-gray-200">
              <button onclick="window._reporting.closeDataSourcesModal()" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-lg hover:bg-gray-300">Close</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Missing Entities Modal -->
      <div id="missingEntitiesModal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-75 overflow-y-auto h-full w-full z-50">
        <div class="relative top-20 mx-auto p-6 w-full max-w-2xl">
          <div class="bg-white rounded-lg shadow-xl">
            <div class="flex items-start justify-between p-5 border-b border-gray-200">
              <h3 class="text-xl font-semibold text-gray-900">Missing Data Entities</h3>
              <button onclick="window._reporting.closeMissingEntitiesModal()" class="text-gray-400 hover:text-gray-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
              </button>
            </div>
            <div class="p-5">
              <div class="mb-4 p-4 bg-amber-50 border border-amber-200 rounded-lg">
                <p class="text-sm font-medium text-amber-900">Incomplete Data</p>
                <p class="text-sm text-amber-700 mt-1">This report requires data entities that are not currently available. Connect the appropriate data sources to enable full reporting.</p>
              </div>
              <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                  <thead class="bg-gray-50">
                    <tr>
                      <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Entity Type</th>
                      <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Description</th>
                      <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Impact</th>
                    </tr>
                  </thead>
                  <tbody id="missingEntitiesList" class="bg-white divide-y divide-gray-200"></tbody>
                </table>
              </div>
            </div>
            <div class="flex justify-end p-5 border-t border-gray-200">
              <button onclick="window._reporting.closeMissingEntitiesModal()" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-lg hover:bg-gray-300">Close</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Module Info Modal -->
      <div id="moduleInfoModal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-75 overflow-y-auto h-full w-full z-50">
        <div class="relative top-20 mx-auto p-6 w-full max-w-lg">
          <div class="bg-white rounded-lg shadow-xl">
            <div class="flex items-start justify-between p-5 border-b border-gray-200">
              <h3 class="text-xl font-semibold text-gray-900">Module Information</h3>
              <button onclick="window._reporting.closeModuleInfo()" class="text-gray-400 hover:text-gray-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
              </button>
            </div>
            <div class="p-5 space-y-4">
              <div><p class="text-xs text-gray-500">Module Name</p><p id="modalModuleName" class="text-lg font-semibold text-gray-900"></p></div>
              <div><p class="text-xs text-gray-500">Module Key</p><p id="modalModuleKey" class="text-sm text-gray-600 font-mono"></p></div>
              <div><p class="text-xs text-gray-500">Description</p><p id="modalModuleDescription" class="text-sm text-gray-700"></p></div>
              <div class="grid grid-cols-3 gap-4">
                <div><p class="text-xs text-gray-500">Version</p><p id="modalModuleVersion" class="text-sm font-medium"></p></div>
                <div><p class="text-xs text-gray-500">Metrics</p><p id="modalModuleMetrics" class="text-sm font-medium"></p></div>
                <div><p class="text-xs text-gray-500">Category</p><p id="modalModuleCategory" class="text-sm font-medium"></p></div>
              </div>
              <div><p class="text-xs text-gray-500">Status</p><span id="modalModuleStatus" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-800"></span></div>
            </div>
            <div class="flex justify-end p-5 border-t border-gray-200">
              <button onclick="window._reporting.closeModuleInfo()" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-lg hover:bg-gray-300">Close</button>
            </div>
          </div>
        </div>
      </div>

    </main>

  </template>

  <noscript>
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,sans-serif;color:#666;">
      Please enable JavaScript to use LANA AI.
    </div>
  </noscript>

  <!-- ════════════════════════════════════════════════════════════════
       Scripts at end of body
       ════════════════════════════════════════════════════════════════ -->

  <!-- Universal shell scripts -->
  <script src="../js/error-reporter.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/version.js"></script>
  <script src="../js/menu.js"></script>
  <script src="../js/navigation-helpers.js"></script>
  <script src="../js/new-project-modal.js"></script>
  <script src="../js/conversation-menu.js"></script>
  <script src="../js/conversation-search-modal.js"></script>
  <script src="../js/contact-search-modal.js"></script>
  <script src="../js/notifications.js"></script>

  <!-- Lex UI core -->
  <script src="../js/lex/lex.core.js"></script>
  <script src="../js/lex/lex.icons.js"></script>
  <script src="../js/lex/lex.data.js"></script>
  <script src="../js/lex/lex.forms.js"></script>
  <script src="../js/lex/lex.state.js"></script>
  <script src="../js/lex/lex.utils.js"></script>
  <script src="../js/lex/lex.auth.js"></script>
  <script src="../js/lex/lex-nav.js"></script>

  <!-- Lex UI layout -->
  <script src="../js/lex/components/foundation/lex-loader.js"></script>
  <script src="../js/lex/components/foundation/lex-toast.js"></script>
  <script src="../js/lex/components/foundation/lex-spinner.js"></script>
  <script src="../js/lex/components/foundation/lex-btn.js"></script>
  <script src="../js/lex/components/foundation/lex-empty.js"></script>
  <script src="../js/lex/components/form/lex-segmented.js"></script>
  <script src="../js/lex/components/layout/lex-sidebar.js"></script>
  <script src="../js/lex/components/layout/lex-topbar.js"></script>
  <script src="../js/lex/components/layout/lex-conversation-item.js"></script>
  <script src="../js/lex/components/layout/lex-notification-panel.js"></script>
  <script src="../js/lex/components/layout/lex-app.js"></script>

  <!-- Page-specific Lex components — loaded before lex-page-init.js -->
  <script src="../js/lex/components/foundation/lex-banner.js"></script>
  <script src="../js/lex/components/foundation/lex-card.js"></script>
  <script src="../js/lex/components/form/lex-input.js"></script>
  <script src="../js/lex/components/form/lex-select.js"></script>

  <!-- Inject page content + hoist modals -->
  <script src="../js/lex/lex-page-init.js"></script>

  <!-- Vendor libraries for visualizations -->
  <script src="../js/vendor/chart.js"></script>
  <script src="../js/vendor/jspdf.umd.min.js"></script>
  <script src="../js/vendor/jspdf.plugin.autotable.min.js"></script>
  <script src="../js/vendor/marked.min.js"></script>
  <script src="../js/drilldown-renderer.js"></script>
  <script src="../insights/raw-data-viewer.js" defer></script>

  <!-- Page controller (MUST be last before auth-guard) -->
  <script src="../js/admin/reporting.js"></script>

  <!-- ES module bridge for visualization renderers -->
  <script type="module">
    import { TimeSeriesRenderer } from '../js/visualizations/renderers/time-series-renderer.js';
    import { PieChartRenderer } from '../js/visualizations/renderers/pie-chart-renderer.js';
    import { FunnelChartRenderer } from '../js/visualizations/renderers/funnel-chart-renderer.js';
    import { BarChartRenderer } from '../js/visualizations/renderers/bar-chart-renderer.js';
    window.TimeSeriesRenderer = TimeSeriesRenderer;
    window.PieChartRenderer = PieChartRenderer;
    window.FunnelChartRenderer = FunnelChartRenderer;
    window.BarChartRenderer = BarChartRenderer;
  </script>

  <!-- Auth guard + loader dismiss (MUST be last) -->
  <script src="../js/auth-guard.js"></script>

</body>
</html>
