<!-- Organization Details — SPA page fragment.
     Loaded by lex-router into the lex-app content area.
     NOT a full HTML document — no <html>, <head>, <body>, or <script> tags.
     Controller: js/admin/organizations.js -->

<div id="lex-page-content">

  <main>

    <!-- ================================================================
         Zone A — Page Banner
         Populated by organizations.js:_renderBanner()
         ================================================================ -->
    <lex-banner
      id="orgBanner"
      variant="light"
      corners
      heading="Loading..."
      subtitle=""
    >
      <div id="orgBannerActions"></div>
    </lex-banner>


    <!-- ================================================================
         Zone B — Quota Metrics (2 cards with progress bars)
         Populated by organizations.js:_renderQuotas()
         ================================================================ -->
    <div class="org-quota-grid" id="orgQuotaGrid">

      <!-- Users quota card -->
      <lex-card variant="default" padding="normal">
        <lex-metric
          id="metricUsers"
          label="Users"
          value="-"
          status="blue"
        ></lex-metric>
        <div class="org-quota-bar">
          <div
            class="org-quota-bar__track"
            role="progressbar"
            aria-valuenow="0"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-label="Users quota"
          >
            <div
              class="org-quota-bar__fill"
              id="userQuotaFill"
              style="width:0%"
            ></div>
          </div>
          <span class="org-quota-label" id="userQuotaLabel"></span>
        </div>
      </lex-card>

      <!-- Matters quota card -->
      <lex-card variant="default" padding="normal">
        <lex-metric
          id="metricMatters"
          label="Matters"
          value="-"
          status="blue"
        ></lex-metric>
        <div class="org-quota-bar">
          <div
            class="org-quota-bar__track"
            role="progressbar"
            aria-valuenow="0"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-label="Matters quota"
          >
            <div
              class="org-quota-bar__fill"
              id="matterQuotaFill"
              style="width:0%"
            ></div>
          </div>
          <span class="org-quota-label" id="matterQuotaLabel"></span>
        </div>
      </lex-card>

    </div>


    <!-- ================================================================
         Zone C — Organization Information (key-value pairs)
         Populated by organizations.js:_renderInfo()
         ================================================================ -->
    <lex-card
      id="orgInfoCard"
      heading="Organization Information"
      variant="default"
    >
      <div class="org-kv-grid">
        <lex-kv id="kvOrgId"      label="Organization ID"   value="-" copyable="true"></lex-kv>
        <lex-kv id="kvOrgTier"    label="Subscription Tier" value="-"></lex-kv>
        <lex-kv id="kvOrgCreated" label="Created"           value="-"></lex-kv>
        <lex-kv id="kvOrgUpdated" label="Last Updated"      value="-"></lex-kv>
      </div>
    </lex-card>


    <!-- ================================================================
         Error State (hidden by default)
         Shown by organizations.js:_showError() on API failure
         ================================================================ -->
    <div id="orgErrorState" class="hidden">
      <lex-empty
        icon="folder"
        message="Unable to load organization"
        description="Please try again later"
      ></lex-empty>
    </div>

  </main>

</div>
