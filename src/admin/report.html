<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report - LANA AI</title>

  <!-- CSS in head -->
  <script src="../js/lex/lex.theme.js"></script>
  <link rel="stylesheet" href="../css/lex-tokens.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/tailwind-output.css">
  <link rel="stylesheet" href="../insights/raw-data-viewer.css">
  <link rel="stylesheet" href="../css/drilldown-renderer.css">
  <link rel="stylesheet" href="../css/lex-chat.css">
  <link rel="stylesheet" href="../css/admin/admin-tables.css">
  <link rel="stylesheet" href="../css/detail-page.css">
  <link rel="stylesheet" href="../css/admin/report.css">
  <script src="../js/tailwind-loader.js"></script>

  <!-- target="_blank" links open through the guarded channel (js/shared/external-links.js). -->
  <script src="../js/shared/external-links.js"></script>
</head>
<body>

  <lex-loader theme="light"></lex-loader>

  <lex-app
    logo-src="../img/logo-light.png"
    logo-alt="LANA AI"
    logo-href="../dashboard.html"
    active-nav-id="insights-reports"
    page-title="Report"
  ></lex-app>

  <template id="page-content">

    <main>

      <!-- Laid out like the dashboard detail page: the report's name and
           summary (report.js sets them; the banner escapes them), All reports,
           and a menu of report actions. The banner shows copies of its
           children, so the actions run through data-reporting-action. -->
      <lex-banner
        id="reportBanner"
        class="detail-banner"
        variant="light"
        heading="Report"
        max-actions="1"
        lana
        lana-context-type="full_chat"
      >
        <lex-btn data-reporting-action="all-reports" variant="secondary" size="sm">All reports</lex-btn>
        <button type="button" role="menuitem" data-reporting-action="export-pdf" disabled>
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          Export PDF
        </button>
        <button type="button" role="menuitem" data-reporting-action="export-csv" disabled>
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          Export CSV
        </button>
        <button type="button" role="menuitem" data-reporting-action="delete-report" data-variant="danger">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6M1 7h22M9 7V4a2 2 0 012-2h2a2 2 0 012 2v3"/></svg>
          Delete report
        </button>
      </lex-banner>

      <!-- Reports / this report (report.js sets its name). -->
      <lex-breadcrumb id="reportBreadcrumb" items='[{"label":"Reports","href":"admin/reports-list.html"},{"label":"Report"}]'></lex-breadcrumb>

      <!-- The period card; the report body (results) stacks below -->
      <div id="reportingLayout" class="reporting-layout">

        <!-- ── Main Content Column ────────────────────────────────── -->
        <div id="reportingMainColumn" class="reporting-main-column">

          <!-- Period card (shared with the dashboard detail page): the period
               to run, then Run Report -->
          <section id="controlsCard" class="detail-period-card" aria-labelledby="reportPeriodHeading">
            <!-- A saved copy says so. -->
            <div class="reporting-selected">
              <lex-badge id="selectedReportSavedBadge" class="reporting-selected__badge" label="Saved copy" color="gray" hidden></lex-badge>
            </div>

            <!-- Period Presets -->
            <div class="detail-period-card__presets">
              <p class="detail-period-card__label" id="reportPeriodHeading">Quick Select Period</p>
              <div id="periodPresets" class="detail-period-card__buttons">
                <lex-btn data-preset="last7days" variant="secondary" size="sm">Last 7 Days</lex-btn>
                <lex-btn data-preset="last30days" variant="secondary" size="sm">Last 30 Days</lex-btn>
                <lex-btn data-preset="thisMonth" variant="secondary" size="sm">This Month</lex-btn>
                <lex-btn data-preset="lastMonth" variant="secondary" size="sm">Last Month</lex-btn>
                <lex-btn data-preset="thisQuarter" variant="secondary" size="sm">This Quarter</lex-btn>
                <lex-btn data-preset="thisYear" variant="secondary" size="sm">This Year</lex-btn>
                <lex-btn data-preset="lastYear" variant="secondary" size="sm">Last Year</lex-btn>
              </div>
            </div>

            <!-- Date Range Row -->
            <div class="detail-period-card__fields">
              <lex-input id="periodStart" label="Start Date" type="date" name="periodStart"></lex-input>
              <lex-input id="periodEnd" label="End Date" type="date" name="periodEnd"></lex-input>
              <lex-select
                id="periodType"
                label="Compare By"
                name="periodType"
                value="monthly"
                options='[{"value":"daily","label":"Daily"},{"value":"weekly","label":"Weekly"},{"value":"monthly","label":"Monthly"},{"value":"quarterly","label":"Quarterly"},{"value":"yearly","label":"Yearly"}]'
              ></lex-select>
            </div>

            <!-- Execute + Customize Buttons -->
            <div class="reporting-run-actions">
              <lex-btn id="executeBtn" variant="primary">Run Report</lex-btn>
              <!-- Customize is hidden for now; its code stays. -->
              <lex-btn id="customizeBtn" class="reporting-customize-btn" variant="secondary" size="sm" hidden>
                <span class="reporting-btn-content">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12.22 2h-.44a2 2 0 00-2 2v.18a2 2 0 01-1 1.73l-.43.25a2 2 0 01-2 0l-.15-.08a2 2 0 00-2.73.73l-.22.38a2 2 0 00.73 2.73l.15.1a2 2 0 011 1.72v.51a2 2 0 01-1 1.74l-.15.09a2 2 0 00-.73 2.73l.22.38a2 2 0 002.73.73l.15-.08a2 2 0 012 0l.43.25a2 2 0 011 1.73V20a2 2 0 002 2h.44a2 2 0 002-2v-.18a2 2 0 011-1.73l.43-.25a2 2 0 012 0l.15.08a2 2 0 002.73-.73l.22-.39a2 2 0 00-.73-2.73l-.15-.08a2 2 0 01-1-1.74v-.5a2 2 0 011-1.74l.15-.09a2 2 0 00.73-2.73l-.22-.38a2 2 0 00-2.73-.73l-.15.08a2 2 0 01-2 0l-.43-.25a2 2 0 01-1-1.73V4a2 2 0 00-2-2z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                  Customize
                </span>
              </lex-btn>
              <span id="customizationBadge" class="reporting-customization-badge"></span>
            </div>

            <!-- Execution Feedback -->
            <div id="executionInfo" class="reporting-execution-info">
              <p id="executionInfoText" class="lex-body-sm lex-text-accent"></p>
            </div>
            <div id="executionError" class="reporting-execution-error">
              <p class="lex-label-sm reporting-execution-error__title">Execution Failed</p>
              <p id="executionErrorText" class="lex-body-sm reporting-execution-error__text"></p>
            </div>
            <div id="executionState" class="reporting-run-state" hidden></div>
          </section>

          <!-- Results Placeholder (shown when no report has run) -->
          <lex-empty
            id="reportingPlaceholder"
            message="Ready to run"
            description="Set your dates, then click Run Report."
            icon="chart"
          ></lex-empty>

          <!-- Module Results (hidden until a report runs) -->
          <div id="moduleResults" class="reporting-module-results">
            <!-- Results Header Card -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
              <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-3">
                  <h2 id="moduleTitle" class="text-xl font-bold text-gray-900"></h2>
                  <button type="button" data-reporting-action="show-module-info" class="flex items-center gap-1 px-3 py-1 text-xs font-medium text-indigo-600 hover:bg-indigo-50 rounded-lg">Learn More</button>
                </div>
              </div>
              <!--
                Metadata row — responsive:
                  - <640px (mobile): 2-col grid (text items 2x2, buttons wrap below)
                  - 640–1023px (tablet): 4-col grid (text items in one row, buttons below)
                  - ≥1024px (desktop): single flex row with justify-between (original layout)
                Each text cell uses min-w-0 so values can wrap inside the cell
                instead of pushing siblings into weird text breaks.
              -->
              <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 lg:flex lg:items-center lg:justify-between lg:gap-6 text-sm">
                <div class="min-w-0"><p class="text-xs text-gray-500">Compare By</p><p id="resultPeriodType" class="font-medium text-gray-900 break-words"></p></div>
                <div class="min-w-0"><p class="text-xs text-gray-500">Current Period</p><p id="resultCurrentPeriod" class="font-medium text-gray-900 break-words"></p></div>
                <div class="min-w-0"><p class="text-xs text-gray-500">Prior Period</p><p id="resultPriorPeriod" class="font-medium text-gray-900 break-words"></p></div>
                <button id="missingEntitiesBtn" class="hidden col-span-1 flex items-center justify-center gap-2 px-3 py-1.5 text-xs font-medium text-amber-700 bg-amber-50 border border-amber-200 rounded-lg hover:bg-amber-100 whitespace-nowrap">
                  <span id="missingEntitiesCount">0 Missing</span>
                </button>
              </div>
            </div>
            <div id="visualizationsContainer"></div>
          </div>

        </div><!-- /reportingMainColumn -->

      </div><!-- /reportingLayout -->

      <!-- Drilldown Modal -->
      <lex-modal id="drilldownModal" heading="Details" size="xl" hide-actions>
        <div id="drilldownContent"></div>
      </lex-modal>

      <!-- Module Customization Panel -->
      <lex-drawer id="customizePanel" heading="Customize Module" side="right" width="480px">
        <div class="space-y-6">

          <!-- Active customization info -->
          <div id="activeCustomizationInfo" class="hidden p-4 bg-indigo-50 rounded-lg border border-indigo-100">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-sm font-semibold text-gray-900" id="activeCustomizationName"></p>
                <p class="text-xs text-gray-500 mt-0.5" id="activeCustomizationDesc"></p>
              </div>
              <button id="removeDefaultBtn" class="text-xs text-red-600 hover:text-red-800 font-medium">Remove Default</button>
            </div>
          </div>

          <!-- Customization Name -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Customization Name <span class="text-red-500">*</span></label>
            <input type="text" id="custName" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm" placeholder="e.g. Our Active Matters View" maxlength="255">
          </div>

          <!-- Description -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
            <textarea id="custDescription" rows="2" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm" placeholder="What does this customization change?" maxlength="1000"></textarea>
          </div>

          <!-- Metric Overrides -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Metrics</label>
            <lex-select id="custMetricMode" class="w-full mb-2" value="" options='[{"value":"","label":"No change (use defaults)"},{"value":"replace","label":"Replace all metrics"},{"value":"extend","label":"Add extra metrics"},{"value":"remove","label":"Remove specific metrics"}]'></lex-select>
            <div id="custMetricsList" class="hidden space-y-2">
              <p class="text-xs text-gray-500">Select metrics (function.column format):</p>
              <div id="custMetricsContainer"></div>
              <button type="button" id="addMetricBtn" class="text-xs text-indigo-600 hover:text-indigo-800 font-medium">+ Add metric</button>
            </div>
          </div>

          <!-- Dimension Overrides -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Group By (Dimensions)</label>
            <lex-select id="custDimensionMode" class="w-full mb-2" value="" options='[{"value":"","label":"No change (use defaults)"},{"value":"replace","label":"Replace dimensions"},{"value":"extend","label":"Add extra dimensions"},{"value":"remove","label":"Remove specific dimensions"}]'></lex-select>
            <div id="custDimensionsList" class="hidden space-y-2">
              <p class="text-xs text-gray-500">Select columns to group by:</p>
              <div id="custDimensionsContainer"></div>
              <button type="button" id="addDimensionBtn" class="text-xs text-indigo-600 hover:text-indigo-800 font-medium">+ Add dimension</button>
            </div>
          </div>

          <!-- Filter Overrides -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Filters</label>
            <lex-select id="custFilterMode" class="w-full mb-2" value="" options='[{"value":"","label":"No change (use defaults)"},{"value":"replace","label":"Replace all filters"},{"value":"extend","label":"Add extra filters"}]'></lex-select>
            <div id="custFiltersList" class="hidden space-y-2">
              <div id="custFiltersContainer"></div>
              <button type="button" id="addFilterBtn" class="text-xs text-indigo-600 hover:text-indigo-800 font-medium">+ Add filter</button>
            </div>
          </div>

          <!-- Existing Customizations -->
          <div class="pt-4 border-t border-gray-200">
            <h3 class="text-sm font-semibold text-gray-900 mb-3">Saved Customizations</h3>
            <div id="existingCustomizations" class="space-y-2">
              <p class="text-xs text-gray-500">No customizations yet</p>
            </div>
          </div>
        </div>

        <!-- Footer -->
        <div data-slot="footer" class="flex gap-3 w-full">
          <button type="button" id="saveCustomizationBtn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2 rounded-lg transition-colors text-sm">Save Customization</button>
          <button type="button" id="saveAndSetDefaultBtn" class="flex-1 bg-white border border-indigo-600 text-indigo-600 hover:bg-indigo-50 font-medium px-4 py-2 rounded-lg transition-colors text-sm">Save &amp; Set Default</button>
        </div>
      </lex-drawer>

      <!-- Data Sources Modal -->
      <div id="dataSourcesModal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-75 overflow-y-auto h-full w-full z-50">
        <div class="relative top-20 mx-auto p-6 w-full max-w-md">
          <div class="bg-white rounded-lg shadow-xl">
            <div class="flex items-start justify-between p-5 border-b border-gray-200">
              <h3 class="text-xl font-semibold text-gray-900">Data Sources</h3>
              <button type="button" data-reporting-action="close-data-sources" class="text-gray-400 hover:text-gray-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
              </button>
            </div>
            <div class="p-5">
              <p class="text-sm text-gray-600 mb-4">This report pulls data from the following connectors:</p>
              <div id="dataSourcesList" class="space-y-3"></div>
            </div>
            <div class="flex justify-end p-5 border-t border-gray-200">
              <button type="button" data-reporting-action="close-data-sources" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-lg hover:bg-gray-300">Close</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Missing Entities Modal -->
      <div id="missingEntitiesModal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-75 overflow-y-auto h-full w-full z-50">
        <div class="relative top-20 mx-auto p-6 w-full max-w-2xl">
          <div class="bg-white rounded-lg shadow-xl">
            <div class="flex items-start justify-between p-5 border-b border-gray-200">
              <h3 class="text-xl font-semibold text-gray-900">Missing Data Entities</h3>
              <button type="button" data-reporting-action="close-missing-entities" class="text-gray-400 hover:text-gray-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
              </button>
            </div>
            <div class="p-5">
              <div class="mb-4 p-4 bg-amber-50 border border-amber-200 rounded-lg">
                <p class="text-sm font-medium text-amber-900">Incomplete Data</p>
                <p class="text-sm text-amber-700 mt-1">This report requires data entities that are not currently available. Connect the appropriate data sources to enable full reporting.</p>
              </div>
              <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                  <thead class="bg-gray-50">
                    <tr>
                      <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Entity Type</th>
                      <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Description</th>
                      <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Impact</th>
                    </tr>
                  </thead>
                  <tbody id="missingEntitiesList" class="bg-white divide-y divide-gray-200"></tbody>
                </table>
              </div>
            </div>
            <div class="flex justify-end p-5 border-t border-gray-200">
              <button type="button" data-reporting-action="close-missing-entities" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-lg hover:bg-gray-300">Close</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Module Info Modal -->
      <div id="moduleInfoModal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-75 overflow-y-auto h-full w-full z-50">
        <div class="relative top-20 mx-auto p-6 w-full max-w-lg">
          <div class="bg-white rounded-lg shadow-xl">
            <div class="flex items-start justify-between p-5 border-b border-gray-200">
              <h3 class="text-xl font-semibold text-gray-900">Module Information</h3>
              <button type="button" data-reporting-action="close-module-info" class="text-gray-400 hover:text-gray-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
              </button>
            </div>
            <div class="p-5 space-y-4">
              <div><p class="text-xs text-gray-500">Module Name</p><p id="modalModuleName" class="text-lg font-semibold text-gray-900"></p></div>
              <div><p class="text-xs text-gray-500">Module Key</p><p id="modalModuleKey" class="text-sm text-gray-600 font-mono"></p></div>
              <div><p class="text-xs text-gray-500">Description</p><p id="modalModuleDescription" class="text-sm text-gray-700"></p></div>
              <div class="grid grid-cols-3 gap-4">
                <div><p class="text-xs text-gray-500">Version</p><p id="modalModuleVersion" class="text-sm font-medium"></p></div>
                <div><p class="text-xs text-gray-500">Metrics</p><p id="modalModuleMetrics" class="text-sm font-medium"></p></div>
                <div><p class="text-xs text-gray-500">Category</p><p id="modalModuleCategory" class="text-sm font-medium"></p></div>
              </div>
              <div><p class="text-xs text-gray-500">Status</p><span id="modalModuleStatus" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-800"></span></div>
            </div>
            <div class="flex justify-end p-5 border-t border-gray-200">
              <button type="button" data-reporting-action="close-module-info" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-lg hover:bg-gray-300">Close</button>
            </div>
          </div>
        </div>
      </div>

    </main>

  </template>

  <noscript>
    <div class="reporting-noscript">
      Please enable JavaScript to use LANA AI.
    </div>
  </noscript>

  <!-- ════════════════════════════════════════════════════════════════
       Scripts at end of body
       ════════════════════════════════════════════════════════════════ -->

  <!-- Universal shell scripts -->
  <script src="../js/error-reporter.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/time-utils.js"></script>
  <script src="../js/shared/request-retry.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/version.js"></script>
  <script src="../js/menu.js"></script>
  <script src="../js/navigation-helpers.js"></script>
  <script src="../js/conversation-search-modal.js"></script>
  <script src="../js/contact-search-modal.js"></script>
  <script src="../js/notifications.js"></script>

  <!-- Lex UI core -->
  <script src="../js/lex/lex.core.js"></script>
  <script src="../js/lex/lex.icons.js"></script>
  <script src="../js/lex/lex.data.js"></script>
  <script src="../js/lex/lex.forms.js"></script>
  <script src="../js/lex/lex.state.js"></script>
  <script src="../js/lex/lex.utils.js"></script>
  <script src="../js/lex/lex.auth.js"></script>
  <script src="../js/lex/lex-nav.js"></script>

  <!-- Lex UI layout -->
  <script src="../js/lex/components/foundation/lex-loader.js"></script>
  <script src="../js/lex/components/foundation/lex-toast.js"></script>
  <script src="../js/lex/components/foundation/lex-spinner.js"></script>
  <script src="../js/lex/components/foundation/lex-btn.js"></script>
  <script src="../js/lex/components/foundation/lex-empty.js"></script>
  <script src="../js/lex/components/foundation/lex-spacer.js"></script>
  <script src="../js/lex/components/form/lex-segmented.js"></script>
  <script src="../js/lex/components/layout/lex-sidebar.js"></script>
  <script src="../js/lex/components/layout/lex-topbar.js"></script>
  <script src="../js/lex/components/layout/lex-conversation-item.js"></script>
  <script src="../js/lex/components/layout/lex-notification-panel.js"></script>
  <script src="../js/lex/components/layout/lex-app.js"></script>

  <!-- Page-specific Lex components — loaded before lex-page-init.js -->
  <script src="../js/lex/components/foundation/lex-breadcrumb.js"></script>
  <script src="../js/lex/components/foundation/lex-banner.js"></script>
  <script src="../js/lex/components/foundation/lex-card.js"></script>
  <script src="../js/lex/components/foundation/lex-drawer.js"></script>
  <script src="../js/lex/components/foundation/lex-modal.js"></script>
  <script src="../js/lex/components/foundation/lex-badge.js"></script>
  <script src="../js/lex/components/data/lex-table.js"></script>
  <script src="../js/lex/components/form/lex-input.js"></script>
  <script src="../js/lex/components/form/lex-select.js"></script>

  <script src="../js/shared/safe-url.js"></script>
  <script src="../js/shared/safe-html.js"></script>

  <script src="../js/lex/chat/lex-chat.conversations-api.js"></script>
  <script src="../js/lex/chat/lex-chat.source.js"></script>
  <script src="../js/lex/chat/lex-chat.message.js"></script>
  <script src="../js/lex/chat/lex-chat-progress-events.js"></script>
  <script src="../js/lex/chat/lex-chat.activity.js"></script>
  <script src="../js/lex/chat/lex-chat.documents.js"></script>
  <script src="../js/lex/chat/lex-chat.composer-mentions.js"></script>
