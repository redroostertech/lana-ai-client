<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billable Hours - LANA AI</title>

  <link rel="stylesheet" href="../css/lex-tokens.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin/admin-tables.css">
  <link rel="stylesheet" href="../css/tailwind-output.css">
  <link rel="stylesheet" href="../css/lex-chat.css">
  <script src="../js/tailwind-loader.js"></script>
</head>
<body>

  <lex-loader theme="light"></lex-loader>

  <lex-app
    logo-src="../img/logo-light.png"
    logo-alt="LANA AI"
    logo-href="../dashboard.html"
    active-nav-id="billable-hours"
    page-title="Billable Hours"
  ></lex-app>

  <template id="page-content">

    <main>

      <style>
        /* Billable hours tables (docs/TABLE-STANDARD.md section 8) */
        .bh-num { display: block; font-variant-numeric: tabular-nums; font-size: 13px; color: var(--lex-text-primary); white-space: nowrap; }
        .bh-num--strong { font-weight: 600; color: var(--lex-color-blue-700, #1d4ed8); }
        .bh-row-actions { display: flex; gap: 0.25rem; justify-content: flex-end; flex-wrap: nowrap; }
        .bh-row-btn { padding: 0.25rem 0.5rem; font-size: 0.75rem; font-weight: 600; background: var(--lex-bg-primary, #fff); color: var(--lex-text-primary); border: 1px solid var(--lex-border-default, #e5e7eb); border-radius: 0.25rem; cursor: pointer; white-space: nowrap; }
        .bh-row-btn--approve { background: var(--lex-color-green-50, #f0fdf4); color: var(--lex-color-green-700, #15803d); border-color: var(--lex-color-green-200, #bbf7d0); }
        .bh-row-btn:disabled { opacity: 0.6; cursor: default; }

        /* By attorney: Attorney, Email, Total hours, Billable, Amount, Drafts, Submitted, Approved, Created */
        #bhAttorneysTable table { min-width: 1180px; }
        #bhAttorneysTable th { white-space: nowrap; }
        #bhAttorneysTable th:nth-child(2) { width: 20%; }
        #bhAttorneysTable th:nth-child(3), #bhAttorneysTable th:nth-child(4) { width: 120px; }
        #bhAttorneysTable th:nth-child(5) { width: 130px; }
        #bhAttorneysTable th:nth-child(6), #bhAttorneysTable th:nth-child(7), #bhAttorneysTable th:nth-child(8) { width: 110px; }
        #bhAttorneysTable th:nth-child(9) { width: 176px; }

        /* By matter: Matter, Client, Attorneys, Total hours, Billable, Amount, Created */
        #bhMattersTable table { min-width: 1080px; }
        #bhMattersTable th { white-space: nowrap; }
        #bhMattersTable th:nth-child(2) { width: 20%; }
        #bhMattersTable th:nth-child(3) { width: 110px; }
        #bhMattersTable th:nth-child(4), #bhMattersTable th:nth-child(5) { width: 120px; }
        #bhMattersTable th:nth-child(6) { width: 130px; }
        #bhMattersTable th:nth-child(7) { width: 176px; }

        /* Approval queue: (select), Attorney, Matter, Hours, Type, Description, Worked, Created, actions */
        #bhApprovalsTable table { min-width: 1320px; }
        #bhApprovalsTable th { white-space: nowrap; }
        #bhApprovalsTable th:nth-child(1) { width: 44px; }
        #bhApprovalsTable th:nth-child(2) { width: 16%; }
        #bhApprovalsTable th:nth-child(3) { width: 18%; }
        #bhApprovalsTable th:nth-child(4) { width: 90px; }
        #bhApprovalsTable th:nth-child(5) { width: 140px; }
        #bhApprovalsTable th:nth-child(7), #bhApprovalsTable th:nth-child(8) { width: 176px; }
        #bhApprovalsTable th:nth-child(9) { width: 220px; }
      </style>

      <lex-banner
        id="bhBanner"
        variant="light"
        corners
        heading="Billable Hours"
        subtitle="Firm-wide time tracking, utilization, and approval management"
        lana
        lana-context-type="full_chat"
      ></lex-banner>

      <lex-spacer size="md"></lex-spacer>

      <lex-breadcrumb
        crumbs='[{"label":"Analytics","href":"analytics.html"},{"label":"Billable Hours"}]'
      ></lex-breadcrumb>

      <!-- Admin quick links -->
      <div style="display:flex;gap:0.5rem;margin-bottom:1rem;">
        <lex-btn variant="outline" size="sm" onclick="window.location.href='block-billing-rules.html'">Block Billing Rules</lex-btn>
      </div>

      <!-- Summary Metrics -->
      <div id="bhAdminSummary" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1rem;margin-bottom:1.5rem;"></div>

      <!-- Period Selector -->
      <div id="bhAdminPeriod" style="display:flex;align-items:center;gap:0.75rem;margin-bottom:1.5rem;flex-wrap:wrap;">
        <lex-btn data-preset="last7days" variant="secondary" size="sm" class="bh-period-btn">Last 7 Days</lex-btn>
        <lex-btn data-preset="last30days" variant="secondary" size="sm" class="bh-period-btn">Last 30 Days</lex-btn>
        <lex-btn data-preset="thisMonth" variant="primary" size="sm" class="bh-period-btn">This Month</lex-btn>
        <lex-btn data-preset="thisQuarter" variant="secondary" size="sm" class="bh-period-btn">This Quarter</lex-btn>
        <div style="margin-left:auto;display:flex;align-items:center;gap:0.5rem;">
          <input type="date" id="bhAdminDateFrom" style="padding:0.25rem 0.5rem;border:1px solid var(--lex-border-default,#e5e7eb);border-radius:0.375rem;font-size:0.8125rem;">
          <span style="font-size:0.75rem;color:var(--lex-text-muted);">to</span>
          <input type="date" id="bhAdminDateTo" style="padding:0.25rem 0.5rem;border:1px solid var(--lex-border-default,#e5e7eb);border-radius:0.375rem;font-size:0.8125rem;">
          <lex-btn id="bhAdminApplyDates" variant="outline" size="sm">Apply</lex-btn>
        </div>
      </div>

      <!-- Tab navigation -->
      <div id="bhAdminTabs" style="display:flex;gap:0;border-bottom:1px solid var(--lex-border-default,#e5e7eb);margin-bottom:1.5rem;">
        <button data-tab="attorneys" class="bh-admin-tab" style="padding:0.75rem 1.25rem;font-size:0.875rem;font-weight:600;border-bottom:2px solid var(--lex-color-blue-600,#2563eb);color:var(--lex-color-blue-600,#2563eb);background:none;cursor:pointer;">By Attorney</button>
        <button data-tab="matters" class="bh-admin-tab" style="padding:0.75rem 1.25rem;font-size:0.875rem;font-weight:600;border-bottom:2px solid transparent;color:var(--lex-text-muted);background:none;cursor:pointer;">By Matter</button>
        <button data-tab="approvals" class="bh-admin-tab" style="padding:0.75rem 1.25rem;font-size:0.875rem;font-weight:600;border-bottom:2px solid transparent;color:var(--lex-text-muted);background:none;cursor:pointer;">Approval Queue</button>
      </div>

      <!-- Tab contents -->
      <div id="bhAdminTabAttorneys">
        <div class="bg-white rounded-lg shadow-sm border mb-4 p-4" style="border-color: var(--lex-border-default)" role="search" aria-label="Search and filter attorneys">
          <div class="flex items-center gap-4 flex-wrap">
            <div class="flex-1 min-w-[200px]">
              <lex-input id="bhAttorneysSearch" placeholder="Search attorneys..." clearable="true" leading-icon="search"></lex-input>
            </div>
            <div class="flex items-center gap-2">
              <label class="admin-table-toolbar-label text-sm whitespace-nowrap">Sort by:</label>
              <lex-select id="bhAttorneysSort" options='[{"value":"billable_hours","label":"Billable"},{"value":"total_hours","label":"Total hours"},{"value":"billable_amount","label":"Amount"},{"value":"submitted_count","label":"Submitted"},{"value":"name","label":"Attorney"},{"value":"created_at","label":"Created"}]' value="billable_hours"></lex-select>
            </div>
            <lex-btn id="bhAttorneysSortOrder" variant="ghost" icon="true" title="Toggle sort order" data-order="desc">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12"></path></svg>
            </lex-btn>
            <div class="flex items-center gap-2">
              <label class="admin-table-toolbar-label text-sm whitespace-nowrap">Pending approval:</label>
              <lex-select id="bhAttorneysPendingFilter" options='[{"value":"all","label":"All"},{"value":"yes","label":"Has pending entries"},{"value":"no","label":"Nothing pending"}]' value="all"></lex-select>
            </div>
            <div id="bhAttorneysCount" class="admin-table-toolbar-label text-sm whitespace-nowrap"></div>
          </div>
        </div>
        <section aria-labelledby="bhAttorneysHeading">
          <div class="flex items-center justify-between mb-3">
            <h2 id="bhAttorneysHeading" class="admin-table-section-title text-lg font-semibold">By Attorney</h2>
            <span id="bhAttorneysSectionCount" class="admin-table-toolbar-label text-sm" aria-live="polite"></span>
          </div>
          <lex-table
            id="bhAttorneysTable"
            class="admin-table lex-table--card"
            column-filters
            columns="name,email,total_hours,billable_hours,billable_amount,draft_count,submitted_count,approved_count,created_at"
            labels="Attorney,Email,Total hours,Billable,Amount,Drafts,Submitted,Approved,Created"
            search-keys="name,email"
            sort-by="billable_hours"
            sort-dir="desc"
            limit="20"
            id-key="user_id"
            empty-text="No billable hours for this period"
            aria-label="Billable hours by attorney"
          ></lex-table>
        </section>
      </div>
      <div id="bhAdminTabMatters" class="hidden">
        <div class="bg-white rounded-lg shadow-sm border mb-4 p-4" style="border-color: var(--lex-border-default)" role="search" aria-label="Search and filter matters">
          <div class="flex items-center gap-4 flex-wrap">
            <div class="flex-1 min-w-[200px]">
              <lex-input id="bhMattersSearch" placeholder="Search matters or clients..." clearable="true" leading-icon="search"></lex-input>
            </div>
            <div class="flex items-center gap-2">
              <label class="admin-table-toolbar-label text-sm whitespace-nowrap">Sort by:</label>
              <lex-select id="bhMattersSort" options='[{"value":"billable_hours","label":"Billable"},{"value":"total_hours","label":"Total hours"},{"value":"billable_amount","label":"Amount"},{"value":"attorneys","label":"Attorneys"},{"value":"matter_name","label":"Matter"},{"value":"client_name","label":"Client"},{"value":"created_at","label":"Created"}]' value="billable_hours"></lex-select>
            </div>
            <lex-btn id="bhMattersSortOrder" variant="ghost" icon="true" title="Toggle sort order" data-order="desc">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12"></path></svg>
            </lex-btn>
            <div class="flex items-center gap-2">
              <label class="admin-table-toolbar-label text-sm whitespace-nowrap">Client:</label>
              <lex-select id="bhMattersClientFilter" options='[{"value":"all","label":"All"}]' value="all"></lex-select>
            </div>
            <div id="bhMattersCount" class="admin-table-toolbar-label text-sm whitespace-nowrap"></div>
          </div>
        </div>
        <section aria-labelledby="bhMattersHeading">
          <div class="flex items-center justify-between mb-3">
            <h2 id="bhMattersHeading" class="admin-table-section-title text-lg font-semibold">By Matter</h2>
            <span id="bhMattersSectionCount" class="admin-table-toolbar-label text-sm" aria-live="polite"></span>
          </div>
          <lex-table
            id="bhMattersTable"
            class="admin-table lex-table--card"
            column-filters
            columns="matter_name,client_name,attorneys,total_hours,billable_hours,billable_amount,created_at"
            labels="Matter,Client,Attorneys,Total hours,Billable,Amount,Created"
            search-keys="matter_name,client_name"
            sort-by="billable_hours"
            sort-dir="desc"
            limit="20"
            id-key="matter_id"
            empty-text="No billable hours for this period"
            aria-label="Billable hours by matter"
          ></lex-table>
        </section>
      </div>
      <div id="bhAdminTabApprovals" class="hidden">
        <div class="bg-white rounded-lg shadow-sm border mb-4 p-4" style="border-color: var(--lex-border-default)" role="search" aria-label="Search and filter the approval queue">
          <div class="flex items-center gap-4 flex-wrap">
            <div class="flex-1 min-w-[200px]">
              <lex-input id="bhApprovalsSearch" placeholder="Search entries..." clearable="true" leading-icon="search"></lex-input>
            </div>
            <div class="flex items-center gap-2">
              <label class="admin-table-toolbar-label text-sm whitespace-nowrap">Sort by:</label>
              <lex-select id="bhApprovalsSort" options='[{"value":"start_time","label":"Worked"},{"value":"created_at","label":"Created"},{"value":"duration_minutes","label":"Hours"},{"value":"attorney","label":"Attorney"},{"value":"matter","label":"Matter"},{"value":"activity_type","label":"Type"}]' value="start_time"></lex-select>
            </div>
            <lex-btn id="bhApprovalsSortOrder" variant="ghost" icon="true" title="Toggle sort order" data-order="desc">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12"></path></svg>
            </lex-btn>
            <div class="flex items-center gap-2">
              <label class="admin-table-toolbar-label text-sm whitespace-nowrap">Type:</label>
              <lex-select id="bhApprovalsTypeFilter" options='[{"value":"all","label":"All"}]' value="all"></lex-select>
            </div>
            <div id="bhApprovalsCount" class="admin-table-toolbar-label text-sm whitespace-nowrap"></div>
          </div>
        </div>
        <section aria-labelledby="bhApprovalsHeading">
          <div class="flex items-center justify-between mb-3">
            <h2 id="bhApprovalsHeading" class="admin-table-section-title text-lg font-semibold">Approval Queue</h2>
            <span id="bhApprovalsSectionCount" class="admin-table-toolbar-label text-sm" aria-live="polite"></span>
          </div>
          <lex-table
            id="bhApprovalsTable"
            class="admin-table lex-table--card"
            column-filters
            selectable
            bulk-actions='[{"label":"Approve selected","action":"approve"}]'
            columns="attorney,matter,duration_minutes,activity_type,description,start_time,created_at,actions"
            labels="Attorney,Matter,Hours,Type,Description,Worked,Created,Actions"
            search-keys="attorney,matter,activity_type,description"
            sort-by="start_time"
            sort-dir="desc"
            limit="20"
            id-key="id"
            empty-text="No entries pending approval"
            aria-label="Approval queue"
          ></lex-table>
        </section>
      </div>

    </main>

  </template>

  <!-- Lex Framework Core -->
  <script src="../js/time-utils.js"></script>
  <script src="../js/lex/lex.core.js"></script>
  <script src="../js/lex/lex.icons.js"></script>
  <script src="../js/lex/lex.data.js"></script>
  <script src="../js/lex/lex.forms.js"></script>
  <script src="../js/lex/lex.state.js"></script>
  <script src="../js/lex/lex.utils.js"></script>
  <script src="../js/lex/lex.auth.js"></script>
  <script src="../js/lex/lex-nav.js"></script>

  <!-- Lex Components -->
  <script src="../js/lex/components/foundation/lex-loader.js"></script>
  <script src="../js/lex/components/foundation/lex-toast.js"></script>
  <script src="../js/lex/components/foundation/lex-spinner.js"></script>
  <script src="../js/lex/components/foundation/lex-btn.js"></script>
  <script src="../js/lex/components/foundation/lex-empty.js"></script>
  <script src="../js/lex/components/foundation/lex-spacer.js"></script>
  <script src="../js/lex/components/foundation/lex-breadcrumb.js"></script>
  <script src="../js/lex/components/foundation/lex-banner.js"></script>
  <script src="../js/lex/components/foundation/lex-card.js"></script>
  <script src="../js/lex/components/foundation/lex-drawer.js"></script>
  <script src="../js/lex/components/foundation/lex-badge.js"></script>
  <script src="../js/lex/components/foundation/lex-modal.js"></script>
  <script src="../js/lex/components/data/lex-table.js"></script>
  <script src="../js/lex/components/form/lex-input.js"></script>
  <script src="../js/lex/components/form/lex-select.js"></script>
  <script src="../js/lex/components/form/lex-segmented.js"></script>

  <!-- Lex Layout -->
  <script src="../js/lex/components/layout/lex-sidebar.js"></script>
  <script src="../js/lex/components/layout/lex-topbar.js"></script>
  <script src="../js/lex/components/layout/lex-notification-panel.js"></script>
  <script src="../js/lex/components/layout/lex-app.js"></script>

  <!-- Lex Chat (powers the global LANA dock).
       MUST load before lex-page-init.js so the custom elements are
       defined by the time the page-content template is materialized
       — otherwise the dock's <lex-lana-panel> mounts before <lex-chat> is a real
       custom element, _chatEl ends up as a generic HTMLElement, and
       calls like clearConversation() blow up. -->
  <script src="../js/lex/chat/lex-chat.format.js"></script>
  <script src="../js/lex/chat/lex-chat.conversations-api.js"></script>
  <script src="../js/lex/chat/lex-chat.source.js"></script>
  <script src="../js/lex/chat/lex-chat.message.js"></script>
  <script src="../js/lex/chat/lex-chat-progress-events.js"></script>
  <script src="../js/lex/chat/lex-chat.activity.js"></script>
  <script src="../js/lex/chat/lex-chat.documents.js"></script>
  <script src="../js/lex/chat/lex-chat.composer-mentions.js"></script>
  <script src="../js/services/slash-commands.service.js"></script>
  <script src="../js/lex/chat/lex-chat.composer-slash.js"></script>
  <script src="../js/lex/chat/lex-chat.composer.js"></script>
  <script src="../js/lex/chat/lex-chat.thread.js"></script>
  <script src="../js/lex/chat/lex-chat.threads.js"></script>
  <script src="../js/lex/chat/lex-chat.js"></script>
  <script src="../js/lex/chat/lex-dynamic-card.renderer.js"></script>
  <script src="../js/lex/chat/lex-agentic-plan-card.js"></script>
  <script src="../js/lex/chat/lex-chat.index.js"></script>
  <script src="../js/lex/components/chat/lex-lana-panel.js"></script>

  <!-- Lex Page Init -->
  <script src="../js/lex/lex-page-init.js"></script>

  <!-- Dependencies -->
  <script src="../js/config.js"></script>
  <script src="../js/shared/request-retry.js"></script>
  <script src="../js/api.js"></script>

  <!-- Page controller -->
  <script src="../js/shared/library-column-filters.js"></script>
  <script src="../js/admin/admin-table-kit.js"></script>
  <script src="../js/admin/billable-hours-reporting.js"></script>

  <!-- Auth guard (MUST be last) -->
  <script src="../js/auth-guard.js"></script>

  <lex-lana-dock page-scope="dashboard" context-type="full_chat" placeholder="Ask LANA anything..." thread-title="LANA Chat"></lex-lana-dock>
  <!-- LANA dock (IDE-style docked chat panel) -->
  <script src="../js/lex/components/layout/lex-lana-dock.js"></script>
</body>
</html>
