<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management - LANA AI</title>

  <!-- ── CSS + Tailwind in head — behavioral scripts at end of body ── -->
  <link rel="stylesheet" href="../css/lex-tokens.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin/admin-switcher.css">
  <link rel="stylesheet" href="../css/admin/admin-tables.css">
  <link rel="stylesheet" href="../css/tailwind-output.css">
  <script src="../js/tailwind-loader.js"></script>

  <link rel="stylesheet" href="../css/lex-chat.css">
</head>
<body>

  <!-- Branded loader — shows once lex-loader.js upgrades the element -->
  <lex-loader theme="light"></lex-loader>

  <!-- App shell -->
  <lex-app
    logo-src="../img/logo-light.png"
    logo-alt="LANA AI"
    logo-href="../dashboard.html"
    active-nav-id="admin"
    page-title="User Management"
  ></lex-app>

  <!-- Page content as inert <template> -->
  <template id="page-content">

    <main>

      <!-- Page header -->
      <lex-banner
        variant="light"
        heading="User Management"
        subtitle="Manage team members, roles, and access"
        lana
        lana-context-type="full_chat"
      >
        <lex-btn id="addUserBtn" variant="primary" leading-icon="user-plus">Add User</lex-btn>
      </lex-banner>

      <lex-breadcrumb items='[{"label":"Administration","href":"admin/index.html"},{"label":"User Management"}]'></lex-breadcrumb>


      <!-- Search / Sort / Filter toolbar (docs/TABLE-STANDARD.md) -->
      <div class="bg-white rounded-lg shadow-sm border mb-4 mt-4 p-4" style="border-color: var(--lex-border-default)" role="search" aria-label="Search and filter users">
        <div class="flex items-center gap-4 flex-wrap">
          <div class="flex-1 min-w-[200px]">
            <lex-input id="usersSearch" placeholder="Search users..." clearable="true" leading-icon="search"></lex-input>
          </div>
          <div class="flex items-center gap-2">
            <label class="admin-table-toolbar-label text-sm whitespace-nowrap">Sort by:</label>
            <lex-select id="usersSort" options='[{"value":"created_at","label":"Created"},{"value":"email","label":"Email"},{"value":"username","label":"Username"},{"value":"status","label":"Status"}]' value="created_at"></lex-select>
          </div>
          <lex-btn id="usersSortOrder" variant="ghost" icon="true" title="Toggle sort order" data-order="desc">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12"></path>
            </svg>
          </lex-btn>
          <div class="flex items-center gap-2">
            <label class="admin-table-toolbar-label text-sm whitespace-nowrap">Status:</label>
            <lex-select id="usersStatusFilter" options='[{"value":"all","label":"All"},{"value":"active","label":"Active"},{"value":"inactive","label":"Inactive"},{"value":"suspended","label":"Suspended"},{"value":"deactivated","label":"Deactivated"}]' value="all"></lex-select>
          </div>
          <div id="usersCount" class="admin-table-toolbar-label text-sm whitespace-nowrap"></div>
        </div>
      </div>

      <section aria-labelledby="usersHeading">
        <div class="flex items-center justify-between mb-3">
          <h2 id="usersHeading" class="admin-table-section-title text-lg font-semibold">All Users</h2>
          <span id="usersSectionCount" class="admin-table-toolbar-label text-sm" aria-live="polite"></span>
        </div>

        <lex-table
          id="usersTable"
          class="admin-table lex-table--card"
          column-filters
          server-paging
          columns="name,email,username,role,status,created_at"
          labels="Name,Email,Username,Role,Status,Created"
          sortable-columns="email,username,status,created_at"
          sort-by="created_at"
          sort-dir="desc"
          limit="20"
          id-key="id"
          empty-text="No users yet"
          aria-label="Users"
        ></lex-table>
      </section>

    </main>


    <!-- ================================================================
         Create / Edit User Modal
         footer-content: Cancel + Save sit in the modal footer, outside
         lex-form; admin-users.js re-emits lex-submit when Save is clicked.
         data-hoist: moved to document.body so it is not clipped by
         lex-content's overflow stacking context.
         ================================================================ -->
    <lex-modal
      id="userModal"
      heading="Add User"
      size="md"
      footer-content='<lex-btn id="userModalCancelBtn" variant="secondary" size="md">Cancel</lex-btn><lex-btn id="userModalSaveBtn" variant="primary" size="md" type="submit">Save</lex-btn>'
      data-hoist
    >
      <lex-form id="userForm">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem;">
          <lex-input
            id="userFirstName"
            name="first_name"
            label="First Name"
            placeholder="Jane"
            required
          ></lex-input>
          <lex-input
            id="userLastName"
            name="last_name"
            label="Last Name"
            placeholder="Smith"
            required
          ></lex-input>
        </div>
        <lex-input
          id="userEmail"
          name="email"
          type="email"
          label="Email Address"
          placeholder="jane.smith@example.com"
          required
          style="margin-bottom:1rem;"
        ></lex-input>
        <lex-input
          id="userUsername"
          name="username"
          label="Username"
          placeholder="jsmith"
          required
          style="margin-bottom:1rem;"
        ></lex-input>
        <div id="userPasswordGroup" style="margin-bottom:1rem;">
          <lex-input
            id="userPassword"
            name="password"
            type="password"
            label="Password"
            placeholder="Minimum 8 characters"
            required
          ></lex-input>
          <div
            id="userPasswordHint"
            class="lex-text-tertiary"
            style="font-size:var(--lex-body-xs-size,0.75rem);margin-top:0.25rem;"
          ></div>
        </div>
        <lex-select
          id="userRole"
          name="role_id"
          label="Role"
          placeholder="Select a role..."
          required
          options='[]'
          style="margin-bottom:1.25rem;"
        ></lex-select>
      </lex-form>
    </lex-modal>


  </template>

  <noscript>
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,sans-serif;color:#666;">
      Please enable JavaScript to use LANA AI.
    </div>
  </noscript>

  <!-- ══════════════════════════════════════════════════════════════════
       Scripts at end of body — HTML renders first, scripts load after
       ══════════════════════════════════════════════════════════════════ -->

  <!-- Universal shell scripts -->
  <script src="../js/error-reporter.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/time-utils.js"></script>
  <script src="../js/shared/request-retry.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/version.js"></script>
  <script src="../js/menu.js"></script>
  <script src="../js/navigation-helpers.js"></script>
  <script src="../js/conversation-search-modal.js"></script>
  <script src="../js/contact-search-modal.js"></script>
  <script src="../js/notifications.js"></script>

  <!-- Lex UI core -->
  <script src="../js/lex/lex.core.js"></script>
  <script src="../js/lex/lex.icons.js"></script>
  <script src="../js/lex/lex.data.js"></script>
  <script src="../js/lex/lex.forms.js"></script>
  <script src="../js/lex/lex.state.js"></script>
  <script src="../js/lex/lex.utils.js"></script>
  <script src="../js/lex/lex.auth.js"></script>
  <script src="../js/lex/lex-nav.js"></script>

  <!-- Lex UI foundation + layout -->
  <script src="../js/lex/components/foundation/lex-loader.js"></script>
  <script src="../js/lex/components/foundation/lex-toast.js"></script>
  <script src="../js/lex/components/foundation/lex-spinner.js"></script>
  <script src="../js/lex/components/foundation/lex-btn.js"></script>
  <script src="../js/lex/components/foundation/lex-empty.js"></script>
  <script src="../js/lex/components/form/lex-segmented.js"></script>
  <script src="../js/lex/components/layout/lex-sidebar.js"></script>
  <script src="../js/lex/components/layout/lex-topbar.js"></script>
  <script src="../js/lex/components/layout/lex-conversation-item.js"></script>
  <script src="../js/lex/components/layout/lex-notification-panel.js"></script>
  <script src="../js/lex/components/layout/lex-app.js"></script>

  <!-- Page-specific Lex components (BEFORE inject) -->
  <script src="../js/lex/components/foundation/lex-breadcrumb.js"></script>
  <script src="../js/lex/components/foundation/lex-banner.js"></script>
  <script src="../js/lex/components/foundation/lex-card.js"></script>
  <script src="../js/lex/components/foundation/lex-badge.js"></script>
  <script src="../js/lex/components/foundation/lex-text.js"></script>
  <script src="../js/lex/components/foundation/lex-stack.js"></script>
  <script src="../js/lex/components/foundation/lex-divider.js"></script>
  <script src="../js/lex/components/foundation/lex-kv.js"></script>
  <script src="../js/lex/components/foundation/lex-modal.js"></script>
  <script src="../js/lex/components/data/lex-table.js"></script>
  <script src="../js/lex/components/form/lex-form.js"></script>
  <script src="../js/lex/components/form/lex-input.js"></script>
  <script src="../js/lex/components/form/lex-select.js"></script>
  <script src="../js/lex/components/form/lex-dropdown-btn.js"></script>

  <!-- Inject page content + hoist modals -->
  <script src="../js/lex/lex-page-init.js"></script>
  <script src="../js/admin/admin-switcher.js"></script>

  <!-- Page controller -->
  <script src="../js/shared/library-column-filters.js"></script>
  <script src="../js/admin/admin-table-kit.js"></script>
  <script src="../js/admin/admin-users.pagination.js"></script>
  <script src="../js/admin/admin-users.js"></script>

  <lex-lana-dock page-scope="dashboard" context-type="full_chat" placeholder="Ask LANA anything..." thread-title="LANA Chat"></lex-lana-dock>
  <!-- LANA dock (IDE-style docked chat panel) -->
  <script src="../js/lex/chat/lex-chat.format.js"></script>
  <script src="../js/lex/chat/lex-chat.conversations-api.js"></script>
  <script src="../js/lex/chat/lex-chat.source.js"></script>
  <script src="../js/lex/chat/lex-chat.message.js"></script>
  <script src="../js/lex/chat/lex-chat-progress-events.js"></script>
  <script src="../js/lex/chat/lex-chat.activity.js"></script>
  <script src="../js/lex/chat/lex-chat.documents.js"></script>
  <script src="../js/lex/chat/lex-chat.composer-mentions.js"></script>
  <script src="../js/services/slash-commands.service.js"></script>
  <script src="../js/lex/chat/lex-chat.composer-slash.js"></script>
  <script src="../js/lex/chat/lex-chat.composer.js"></script>
  <script src="../js/lex/chat/lex-chat.thread.js"></script>
  <script src="../js/lex/chat/lex-chat.threads.js"></script>
  <script src="../js/lex/chat/lex-chat.js"></script>
  <script src="../js/lex/chat/lex-dynamic-card.renderer.js"></script>
  <script src="../js/lex/chat/lex-agentic-plan-card.js"></script>
  <script src="../js/lex/chat/lex-chat.index.js"></script>
  <script src="../js/lex/components/chat/lex-lana-panel.js"></script>
  <script src="../js/lex/components/layout/lex-lana-dock.js"></script>

  <!-- Auth guard + loader dismiss (MUST be last) -->
  <script src="../js/auth-guard.js"></script>
</body>
</html>
