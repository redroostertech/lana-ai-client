<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plugins - LanaAI</title>
  <script src="../js/tailwind-loader.js"></script>
  <link rel="stylesheet" href="../css/components.css">
  <script src="../js/error-reporter.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/menu.js"></script>
  <script src="../js/notifications.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <!-- Sidebar -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-gray-900 text-white transform -translate-x-full lg:translate-x-0 transition-transform z-30 flex flex-col">
    <div class="flex-shrink-0 flex items-center justify-between h-16 px-6 border-b border-gray-800">
      <a href="../index.html" class="text-xl font-bold text-indigo-400">LanaAI</a>
      <button id="closeSidebar" class="lg:hidden text-gray-400 hover:text-white">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>
    <nav id="mainNav" class="flex-1 overflow-hidden pt-6 px-3">
      <!-- Menu will be dynamically rendered by menu.js -->
    </nav>
  </aside>

  <!-- Main Content -->
  <div class="lg:ml-64">
    <header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-20">
      <div class="flex items-center justify-between h-16 px-4 lg:px-8">
        <button id="openSidebar" class="lg:hidden text-gray-500 hover:text-gray-700">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
        <div class="flex-1 px-4 lg:px-0">
          <h1 class="text-xl font-semibold text-gray-900">Plugins</h1>
        </div>
        <div class="flex items-center gap-4">
          <!-- Notifications -->
          <button id="notificationBtn" class="relative text-gray-500 hover:text-gray-700">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
            </svg>
            <span id="notificationBadge" class="hidden absolute -top-1 -right-1 w-4 h-4 bg-red-500 text-white text-xs rounded-full flex items-center justify-center">0</span>
          </button>

          <!-- User Menu -->
          <div class="relative" id="userMenu">
            <button class="flex items-center gap-2 text-gray-700 hover:text-gray-900">
              <div class="w-8 h-8 bg-indigo-100 rounded-full flex items-center justify-center">
                <span id="userInitials" class="text-sm font-medium text-indigo-600">U</span>
              </div>
              <span id="userName" class="hidden sm:block text-sm font-medium">User</span>
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
              </svg>
            </button>
            <div id="userDropdown" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-200 py-1 z-50">
              <a href="../settings.html" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Settings</a>
              <hr class="my-1">
              <button id="logoutBtn" class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-gray-100">Sign out</button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Notification Panel Overlay -->
    <div id="notificationOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity"></div>

    <!-- Notification Slide-out Panel -->
    <div id="notificationPanel" class="fixed inset-y-0 right-0 w-full sm:w-96 bg-white shadow-2xl z-50 transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
      <div class="flex items-center justify-between h-16 px-6 border-b border-gray-200 flex-shrink-0">
        <h2 class="text-lg font-semibold text-gray-900">Notifications</h2>
        <div class="flex items-center gap-3">
          <button id="markAllReadBtn" class="text-sm text-indigo-600 hover:text-indigo-800 font-medium hidden">Mark all read</button>
          <button id="refreshNotificationsBtn" class="text-gray-400 hover:text-gray-600 transition-colors" title="Refresh">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
          </button>
          <button id="closeNotificationPanel" class="text-gray-400 hover:text-gray-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
        </div>
      </div>
      <div class="flex border-b border-gray-200 px-6 flex-shrink-0">
        <button id="filterAll" class="px-4 py-3 text-sm font-medium text-indigo-600 border-b-2 border-indigo-600">All</button>
        <button id="filterUnread" class="px-4 py-3 text-sm font-medium text-gray-500 hover:text-gray-700">Unread</button>
      </div>
      <div id="notificationList" class="flex-1 overflow-y-auto">
        <div id="notificationLoading" class="p-8 text-center">
          <div class="animate-spin w-8 h-8 border-4 border-indigo-200 border-t-indigo-600 rounded-full mx-auto"></div>
          <p class="text-gray-500 mt-3 text-sm">Loading notifications...</p>
        </div>
      </div>
      <div id="notificationLoadingMore" class="hidden p-4 border-t border-gray-100 text-center flex-shrink-0">
        <div class="animate-spin w-5 h-5 border-2 border-indigo-200 border-t-indigo-600 rounded-full mx-auto"></div>
      </div>
    </div>

    <main class="p-4 lg:p-8">
      <!-- Tabs -->
      <div class="border-b border-gray-200 mb-6">
        <nav class="flex gap-8">
          <button id="tabInstalled" class="tab-btn pb-4 px-1 border-b-2 border-indigo-500 text-indigo-600 font-medium">Installed</button>
          <button id="tabMarketplace" class="tab-btn pb-4 px-1 border-b-2 border-transparent text-gray-500 hover:text-gray-700 font-medium">Marketplace</button>
        </nav>
      </div>

      <!-- Installed Plugins -->
      <div id="installedContent">
        <div id="installedPlugins" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          <!-- Installed plugins will be loaded here -->
        </div>
      </div>

      <!-- Marketplace -->
      <div id="marketplaceContent" class="hidden">
        <div class="flex flex-col sm:flex-row gap-4 mb-6">
          <div class="flex-1 max-w-md">
            <input type="text" id="marketplaceSearch" placeholder="Search plugins..."
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
          </div>
          <select id="categoryFilter" class="select-standard inline-block w-auto pl-3 py-2 border border-gray-300 rounded-lg text-sm text-gray-900 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            <option value="">All Categories</option>
          </select>
        </div>
        <div id="marketplacePlugins" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          <!-- Marketplace plugins will be loaded here -->
        </div>
      </div>
    </main>
  </div>

  <script>
    if (!api.requireAuth()) throw new Error('Not authenticated');
    
    // Load full user profile with roles before rendering menu
    (async () => {
      try {
        await api.loadUserProfile();
      } catch (error) {
        console.error('Failed to load user profile:', error);
      }
      
      // Render dynamic menu (will now have access to roles)
      renderMenu('#mainNav');
    })();

    // Initialize notifications panel
    NotificationPanel.init();

    // Load user info
    function loadUserInfo() {
      const user = api.user;
      if (user) {
        const name = `${user.firstName || ''} ${user.lastName || ''}`.trim() || user.email;
        const initials = (user.firstName?.[0] || '') + (user.lastName?.[0] || '') || user.email[0].toUpperCase();
        document.getElementById('userName').textContent = name;
        document.getElementById('userInitials').textContent = initials;
      }
    }
    loadUserInfo();

    // User menu toggle
    const userMenu = document.getElementById('userMenu');
    const userDropdown = document.getElementById('userDropdown');
    userMenu.addEventListener('click', (e) => {
      e.stopPropagation();
      userDropdown.classList.toggle('hidden');
    });
    document.addEventListener('click', (e) => {
      if (!userMenu.contains(e.target)) userDropdown.classList.add('hidden');
    });

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await api.logout();
      window.location.href = '../login.html';
    });

    // Sidebar toggle
    const sidebar = document.getElementById('sidebar');
    document.getElementById('openSidebar').addEventListener('click', () => sidebar.classList.remove('-translate-x-full'));
    document.getElementById('closeSidebar').addEventListener('click', () => sidebar.classList.add('-translate-x-full'));

    // Tab switching
    const tabInstalled = document.getElementById('tabInstalled');
    const tabMarketplace = document.getElementById('tabMarketplace');
    const installedContent = document.getElementById('installedContent');
    const marketplaceContent = document.getElementById('marketplaceContent');

    tabInstalled.addEventListener('click', () => {
      tabInstalled.classList.add('border-indigo-500', 'text-indigo-600');
      tabInstalled.classList.remove('border-transparent', 'text-gray-500');
      tabMarketplace.classList.remove('border-indigo-500', 'text-indigo-600');
      tabMarketplace.classList.add('border-transparent', 'text-gray-500');
      installedContent.classList.remove('hidden');
      marketplaceContent.classList.add('hidden');
    });

    tabMarketplace.addEventListener('click', () => {
      tabMarketplace.classList.add('border-indigo-500', 'text-indigo-600');
      tabMarketplace.classList.remove('border-transparent', 'text-gray-500');
      tabInstalled.classList.remove('border-indigo-500', 'text-indigo-600');
      tabInstalled.classList.add('border-transparent', 'text-gray-500');
      marketplaceContent.classList.remove('hidden');
      installedContent.classList.add('hidden');
      loadMarketplace();
    });

    // Load installed plugins
    async function loadInstalled() {
      const container = document.getElementById('installedPlugins');
      try {
        const result = await api.getInstalledPlugins();
        const plugins = result.plugins || [];

        if (plugins.length === 0) {
          container.innerHTML = `
            <div class="col-span-full text-center py-12">
              <svg class="w-16 h-16 text-gray-300 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 4a2 2 0 114 0v1a1 1 0 001 1h3a1 1 0 011 1v3a1 1 0 01-1 1h-1a2 2 0 100 4h1a1 1 0 011 1v3a1 1 0 01-1 1h-3a1 1 0 01-1-1v-1a2 2 0 10-4 0v1a1 1 0 01-1 1H7a1 1 0 01-1-1v-3a1 1 0 00-1-1H4a2 2 0 110-4h1a1 1 0 001-1V7a1 1 0 011-1h3a1 1 0 001-1V4z"></path>
              </svg>
              <p class="text-gray-500">No plugins installed</p>
              <button onclick="tabMarketplace.click()" class="mt-4 text-indigo-600 hover:text-indigo-800 font-medium">Browse marketplace</button>
            </div>
          `;
          return;
        }

        container.innerHTML = plugins.map(plugin => `
          <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
            <div class="flex items-start justify-between mb-4">
              <div>
                <h3 class="text-lg font-semibold text-gray-900">${plugin.name}</h3>
                <p class="text-sm text-gray-500">v${plugin.version}</p>
              </div>
              ${statusBadge(plugin.status)}
            </div>
            <div class="flex gap-2 mt-4">
              ${plugin.status === 'active' ?
                `<button onclick="stopPlugin('${plugin.id}')" class="flex-1 px-3 py-2 bg-yellow-100 hover:bg-yellow-200 text-yellow-700 rounded-lg text-sm">Stop</button>` :
                `<button onclick="startPlugin('${plugin.id}')" class="flex-1 px-3 py-2 bg-green-100 hover:bg-green-200 text-green-700 rounded-lg text-sm">Start</button>`
              }
              <button onclick="restartPlugin('${plugin.id}')" class="px-3 py-2 bg-blue-100 hover:bg-blue-200 text-blue-700 rounded-lg text-sm">Restart</button>
              <button onclick="uninstallPlugin('${plugin.id}')" class="px-3 py-2 bg-red-100 hover:bg-red-200 text-red-700 rounded-lg text-sm">Uninstall</button>
            </div>
          </div>
        `).join('');
      } catch (error) {
        Toast.error('Failed to load installed plugins');
      }
    }

    // Load marketplace
    async function loadMarketplace() {
      const container = document.getElementById('marketplacePlugins');
      const search = document.getElementById('marketplaceSearch').value;
      const category = document.getElementById('categoryFilter').value;

      try {
        const result = await api.getMarketplacePlugins(search, category);
        const plugins = result.plugins || [];
        const categories = result.categories || [];

        // Update category filter
        const categorySelect = document.getElementById('categoryFilter');
        if (categorySelect.options.length <= 1) {
          categories.forEach(cat => {
            const option = document.createElement('option');
            option.value = cat;
            option.textContent = cat.replace('-', ' ').replace(/\b\w/g, l => l.toUpperCase());
            categorySelect.appendChild(option);
          });
        }

        container.innerHTML = plugins.map(plugin => `
          <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
            <div class="flex items-start justify-between mb-2">
              <h3 class="text-lg font-semibold text-gray-900">${plugin.name}</h3>
              ${plugin.installed ? '<span class="px-2 py-1 bg-green-100 text-green-800 text-xs rounded">Installed</span>' : ''}
            </div>
            <p class="text-sm text-gray-500 mb-2">${plugin.description}</p>
            <div class="flex items-center gap-4 text-xs text-gray-400 mb-4">
              <span>v${plugin.version}</span>
              <span>by ${plugin.author}</span>
              <span>${plugin.downloads?.toLocaleString()} downloads</span>
              <span class="flex items-center gap-1">
                <svg class="w-3 h-3 text-yellow-400" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
                ${plugin.rating}
              </span>
            </div>
            ${!plugin.installed ?
              `<button onclick="installPlugin('${plugin.id}', '${plugin.name}', '${plugin.version}')" class="w-full px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm">Install</button>` :
              `<button disabled class="w-full px-4 py-2 bg-gray-100 text-gray-500 rounded-lg text-sm cursor-not-allowed">Already Installed</button>`
            }
          </div>
        `).join('');
      } catch (error) {
        Toast.error('Failed to load marketplace');
      }
    }

    // Plugin actions
    async function startPlugin(pluginId) {
      try {
        await api.startPlugin(pluginId);
        Toast.success('Plugin started');
        loadInstalled();
      } catch (error) {
        Toast.error(error.message);
      }
    }

    async function stopPlugin(pluginId) {
      try {
        await api.stopPlugin(pluginId);
        Toast.success('Plugin stopped');
        loadInstalled();
      } catch (error) {
        Toast.error(error.message);
      }
    }

    async function restartPlugin(pluginId) {
      try {
        await api.restartPlugin(pluginId);
        Toast.success('Plugin restarted');
        loadInstalled();
      } catch (error) {
        Toast.error(error.message);
      }
    }

    async function uninstallPlugin(pluginId) {
      Modal.confirm('Uninstall Plugin', 'Are you sure you want to uninstall this plugin?', async () => {
        try {
          await api.uninstallPlugin(pluginId);
          Toast.success('Plugin uninstalled');
          loadInstalled();
        } catch (error) {
          Toast.error(error.message);
        }
      });
    }

    async function installPlugin(pluginId, name, version) {
      try {
        await api.installPlugin(name, version);
        Toast.success('Plugin installed');
        loadMarketplace();
        loadInstalled();
      } catch (error) {
        Toast.error(error.message);
      }
    }

    // Search
    document.getElementById('marketplaceSearch').addEventListener('input', debounce(loadMarketplace, 300));
    document.getElementById('categoryFilter').addEventListener('change', loadMarketplace);

    // Initialize
    loadInstalled();
  </script>
</body>
</html>
