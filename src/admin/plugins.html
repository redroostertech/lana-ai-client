<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plugins - LANA AI</title>

  <link rel="stylesheet" href="../css/lex-tokens.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin/admin-switcher.css">
  <link rel="stylesheet" href="../css/admin/admin-tables.css">
  <link rel="stylesheet" href="../css/tailwind-output.css">
  <script src="../js/tailwind-loader.js"></script>
  <link rel="stylesheet" href="../css/lex-chat.css">
</head>
<body>

  <lex-loader theme="light"></lex-loader>

  <lex-app
    logo-src="../img/logo-light.png"
    logo-alt="LANA AI"
    logo-href="../dashboard.html"
    active-nav-id="admin-plugins"
    page-title="Plugins"
  ></lex-app>

  <template id="page-content">
    <main>
      <!-- Per-table widths (docs/TABLE-STANDARD.md section 8). Inside the
           content region so SPA navigation carries them too. -->
      <style>
        /* Installed plugins: Plugin, Version, Status, Created, Last edited, actions */
        #installedPluginsTable table { min-width: 940px; }
        #installedPluginsTable th { white-space: nowrap; }
        #installedPluginsTable th:nth-child(2) { width: 110px; }
        #installedPluginsTable th:nth-child(3) { width: 120px; }
        #installedPluginsTable th:nth-child(4) { width: 176px; }
        #installedPluginsTable th:nth-child(5) { width: 150px; }
        #installedPluginsTable th:nth-child(6) { width: 250px; }
        .admin-plugin-actions { display: flex; gap: 6px; flex-wrap: nowrap; }
        .admin-plugin-card { background: var(--lex-bg-primary, #fff); border: 1px solid var(--lex-border-default); border-radius: var(--lex-radius-lg, 12px); padding: 20px; }
        .admin-plugin-card h3 { color: var(--lex-text-primary); font-size: 16px; font-weight: 600; }
        .admin-plugin-card p, .admin-plugin-card .admin-plugin-meta { color: var(--lex-text-secondary); font-size: 13px; }
      </style>

      <lex-banner
        variant="light"
        heading="Plugins"
        subtitle="Run, stop and install organization plugins"
        lana
        lana-context-type="full_chat"
      ></lex-banner>

      <lex-breadcrumb items='[{"label":"Administration","href":"admin/index.html"},{"label":"Plugins"}]'></lex-breadcrumb>

      <lex-tabs id="pluginTabs" variant="underline" active="installed"
        tabs='[{"id":"installed","label":"Installed"},{"id":"marketplace","label":"Marketplace"}]'></lex-tabs>

      <!-- Installed plugins (docs/TABLE-STANDARD.md) -->
      <div id="installedContent">
        <div class="bg-white rounded-lg shadow-sm border mb-4 mt-4 p-4" style="border-color: var(--lex-border-default)" role="search" aria-label="Search and filter installed plugins">
          <div class="flex items-center gap-4 flex-wrap">
            <div class="flex-1 min-w-[200px]">
              <lex-input id="pluginsSearch" placeholder="Search plugins..." clearable="true" leading-icon="search"></lex-input>
            </div>
            <div class="flex items-center gap-2">
              <label class="admin-table-toolbar-label text-sm whitespace-nowrap">Sort by:</label>
              <lex-select id="pluginsSort" options='[{"value":"created_at","label":"Created"},{"value":"updated_at","label":"Last edited"},{"value":"name","label":"Plugin"},{"value":"version","label":"Version"},{"value":"status","label":"Status"}]' value="created_at"></lex-select>
            </div>
            <lex-btn id="pluginsSortOrder" variant="ghost" icon="true" title="Toggle sort order" data-order="desc">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12"></path>
            </svg>
            </lex-btn>
            <div class="flex items-center gap-2">
              <label class="admin-table-toolbar-label text-sm whitespace-nowrap">Status:</label>
              <lex-select id="pluginsStatusFilter" options='[{"value":"all","label":"All"},{"value":"active","label":"Active"},{"value":"installed","label":"Installed"},{"value":"disabled","label":"Disabled"}]' value="all"></lex-select>
            </div>
            <div id="pluginsCount" class="admin-table-toolbar-label text-sm whitespace-nowrap"></div>
          </div>
        </div>

        <section aria-labelledby="pluginsHeading">
          <div class="flex items-center justify-between mb-3">
            <h2 id="pluginsHeading" class="admin-table-section-title text-lg font-semibold">Installed Plugins</h2>
            <span id="pluginsSectionCount" class="admin-table-toolbar-label text-sm" aria-live="polite"></span>
          </div>

          <lex-table
            id="installedPluginsTable"
            class="admin-table lex-table--card"
            column-filters
            columns="name,version,status,created_at,updated_at,actions"
            labels="Plugin,Version,Status,Created,Last edited,"
            sortable-columns="name,version,status,created_at,updated_at"
            search-keys="name,version,status"
            sort-by="created_at"
            sort-dir="desc"
            limit="20"
            id-key="id"
            empty-text="No plugins installed yet"
            empty-action-label="Browse marketplace"
            aria-label="Installed plugins"
          ></lex-table>
        </section>
      </div>

      <!-- Marketplace: a gallery, kept as cards -->
      <div id="marketplaceContent" class="hidden">
        <div class="flex flex-col sm:flex-row gap-4 mb-6 mt-4">
          <div class="flex-1 max-w-md">
            <lex-input id="marketplaceSearch" placeholder="Search plugins..." clearable="true" leading-icon="search"></lex-input>
          </div>
          <div class="flex items-center gap-2">
            <label class="admin-table-toolbar-label text-sm whitespace-nowrap">Category:</label>
            <lex-select id="categoryFilter" options='[{"value":"","label":"All categories"}]' value=""></lex-select>
          </div>
        </div>
        <div id="marketplacePlugins" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
      </div>
    </main>
  </template>

  <noscript>
    <div>Please enable JavaScript to use LANA AI.</div>
  </noscript>

  <script src="../js/error-reporter.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/time-utils.js"></script>
  <script src="../js/shared/request-retry.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/version.js"></script>
  <script src="../js/menu.js"></script>
  <script src="../js/navigation-helpers.js"></script>
  <script src="../js/conversation-search-modal.js"></script>
  <script src="../js/contact-search-modal.js"></script>
  <script src="../js/notifications.js"></script>

  <script src="../js/lex/lex.core.js"></script>
  <script src="../js/lex/lex.icons.js"></script>
  <script src="../js/lex/lex.data.js"></script>
  <script src="../js/lex/lex.forms.js"></script>
  <script src="../js/lex/lex.state.js"></script>
  <script src="../js/lex/lex.utils.js"></script>
  <script src="../js/lex/lex.auth.js"></script>
  <script src="../js/lex/lex-nav.js"></script>

  <script src="../js/lex/components/foundation/lex-loader.js"></script>
  <script src="../js/lex/components/foundation/lex-toast.js"></script>
  <script src="../js/lex/components/foundation/lex-spinner.js"></script>
  <script src="../js/lex/components/foundation/lex-btn.js"></script>
  <script src="../js/lex/components/foundation/lex-empty.js"></script>
  <script src="../js/lex/components/form/lex-segmented.js"></script>
  <script src="../js/lex/components/layout/lex-sidebar.js"></script>
  <script src="../js/lex/components/layout/lex-topbar.js"></script>
  <script src="../js/lex/components/layout/lex-conversation-item.js"></script>
  <script src="../js/lex/components/layout/lex-notification-panel.js"></script>
  <script src="../js/lex/components/layout/lex-app.js"></script>

  <script src="../js/lex/components/foundation/lex-breadcrumb.js"></script>
  <script src="../js/lex/components/foundation/lex-banner.js"></script>
  <script src="../js/lex/components/foundation/lex-badge.js"></script>
  <script src="../js/lex/components/foundation/lex-tabs.js"></script>
  <script src="../js/lex/components/foundation/lex-modal.js"></script>
  <script src="../js/lex/components/data/lex-table.js"></script>
  <script src="../js/lex/components/form/lex-input.js"></script>
  <script src="../js/lex/components/form/lex-select.js"></script>

  <script src="../js/lex/lex-page-init.js"></script>
  <script src="../js/admin/admin-switcher.js"></script>
  <script src="../js/shared/library-column-filters.js"></script>
  <script src="../js/admin/admin-table-kit.js"></script>
  <script src="../js/admin/admin-plugins.js"></script>
  <script src="../js/auth-guard.js"></script>
  <lex-lana-dock page-scope="dashboard" context-type="full_chat" placeholder="Ask LANA anything..." thread-title="LANA Chat"></lex-lana-dock>
  <!-- LANA dock (IDE-style docked chat panel) -->
  <script src="../js/lex/chat/lex-chat.format.js"></script>
  <script src="../js/lex/chat/lex-chat.conversations-api.js"></script>
  <script src="../js/lex/chat/lex-chat.source.js"></script>
  <script src="../js/lex/chat/lex-chat.message.js"></script>
  <script src="../js/lex/chat/lex-chat-progress-events.js"></script>
  <script src="../js/lex/chat/lex-chat.activity.js"></script>
  <script src="../js/lex/chat/lex-chat.documents.js"></script>
  <script src="../js/lex/chat/lex-chat.composer-mentions.js"></script>
  <script src="../js/services/slash-commands.service.js"></script>
  <script src="../js/lex/chat/lex-chat.composer-slash.js"></script>
  <script src="../js/lex/chat/lex-chat.composer.js"></script>
  <script src="../js/lex/chat/lex-chat.thread.js"></script>
  <script src="../js/lex/chat/lex-chat.threads.js"></script>
  <script src="../js/lex/chat/lex-chat.js"></script>
  <script src="../js/lex/chat/lex-dynamic-card.renderer.js"></script>
  <script src="../js/lex/chat/lex-agentic-plan-card.js"></script>
  <script src="../js/lex/chat/lex-chat.index.js"></script>
  <script src="../js/lex/components/chat/lex-lana-panel.js"></script>
  <script src="../js/lex/components/layout/lex-lana-dock.js"></script>
</body>
</html>
