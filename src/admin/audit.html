<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audit Logs - LANA AI</title>

  <!-- ── CSS + Tailwind in head — behavioral scripts at end of body ── -->
  <link rel="stylesheet" href="../css/lex-tokens.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/tailwind-output.css">
  <script src="../js/tailwind-loader.js"></script>

</head>
<body>

  <!-- Branded loader — shows once lex-loader.js upgrades the element -->
  <lex-loader theme="light"></lex-loader>

  <!-- App shell -->
  <lex-app
    logo-src="../img/logo-light.png"
    logo-alt="LANA AI"
    logo-href="../dashboard.html"
    active-nav-id="admin"
    page-title="Audit Logs"
  ></lex-app>

  <!-- Page content as inert <template> -->
  <template id="page-content">

    <main class="p-4 lg:p-8">

      <!-- Page header -->
      <lex-banner
        variant="light"
        heading="Audit Logs"
        subtitle="Review system activity, security events, and user actions"
      ></lex-banner>

      <lex-breadcrumb items='[{"label":"Administration","href":"admin/index.html"},{"label":"Audit Logs"}]'></lex-breadcrumb>

      <!-- Statistics Cards -->
      <div class="grid grid-cols-1 md:grid-cols-5 gap-4 mb-6">
        <lex-card id="statCardAll" class="cursor-pointer" compact>
          <div class="flex items-center gap-2 mb-1">
            <span class="text-sm font-medium lex-text-secondary">Total Events (30d)</span>
          </div>
          <p id="statTotal" class="text-2xl font-bold lex-text-primary mt-1">-</p>
        </lex-card>

        <lex-card id="statCardSecurity" class="cursor-pointer" compact>
          <div class="flex items-center gap-2 mb-1">
            <span class="text-sm font-medium lex-text-secondary">Security Events</span>
            <button id="infoSecurity" class="lex-text-tertiary" style="line-height:1;" title="What are security events?">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
            </button>
          </div>
          <p id="statSecurity" class="text-2xl font-bold mt-1" style="color:var(--lex-color-danger-600,#DC2626);">-</p>
        </lex-card>

        <lex-card id="statCardUser" class="cursor-pointer" compact>
          <div class="flex items-center gap-2 mb-1">
            <span class="text-sm font-medium lex-text-secondary">User Actions</span>
            <button id="infoUser" class="lex-text-tertiary" style="line-height:1;" title="What are user actions?">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
            </button>
          </div>
          <p id="statUser" class="text-2xl font-bold mt-1" style="color:var(--lex-color-info-600,#2563EB);">-</p>
        </lex-card>

        <lex-card id="statCardSystem" class="cursor-pointer" compact>
          <div class="flex items-center gap-2 mb-1">
            <span class="text-sm font-medium lex-text-secondary">System Events</span>
            <button id="infoSystem" class="lex-text-tertiary" style="line-height:1;" title="What are system events?">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
            </button>
          </div>
          <p id="statSystem" class="text-2xl font-bold mt-1" style="color:var(--lex-color-success-600,#16A34A);">-</p>
        </lex-card>

        <lex-card id="statCardOther" class="cursor-pointer" compact>
          <div class="flex items-center gap-2 mb-1">
            <span class="text-sm font-medium lex-text-secondary">Other Events</span>
            <button id="infoOther" class="lex-text-tertiary" style="line-height:1;" title="What are other events?">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
            </button>
          </div>
          <p id="statOther" class="text-2xl font-bold lex-text-secondary mt-1">-</p>
        </lex-card>
      </div>

      <!-- Audit Logs Table + Filters + Pagination -->
      <lex-card padding="none">

        <!-- Filters -->
        <div style="padding:1rem 1.5rem;" class="flex flex-wrap gap-4 items-end">
          <div class="flex-1 min-w-[200px]">
            <lex-select
              id="eventTypeFilter"
              label="Event Type"
              placeholder="All Event Types"
              options='[]'
            ></lex-select>
          </div>
          <div class="flex-1 min-w-[150px]">
            <lex-input
              id="fromDate"
              type="date"
              label="From Date"
            ></lex-input>
          </div>
          <div class="flex-1 min-w-[150px]">
            <lex-input
              id="toDate"
              type="date"
              label="To Date"
            ></lex-input>
          </div>
          <div class="flex gap-2" style="padding-bottom:2px;">
            <lex-btn id="applyFiltersBtn" variant="primary" size="md">Apply</lex-btn>
            <lex-btn id="clearFiltersBtn" variant="secondary" size="md">Clear</lex-btn>
          </div>
        </div>

        <lex-table
          id="auditTable"
          columns="timestamp,event_type,user_email,ip_address"
          labels="Timestamp,Event Type,User,IP Address"
          empty-text="No audit logs found"
        ></lex-table>

        <!-- Pagination -->
        <div id="paginationRow" class="flex items-center justify-between" style="padding:0.75rem 1.5rem;">
          <span id="paginationInfo" class="text-xs lex-text-tertiary"></span>
          <div id="paginationControls" class="flex gap-2"></div>
        </div>

      </lex-card>

    </main>


    <!-- ================================================================
         Event Info Modal — shows category descriptions
         ================================================================ -->
    <lex-modal
      id="eventInfoModal"
      heading="Event Category"
      size="md"
      data-hoist
    >
      <div id="eventInfoContent"></div>
    </lex-modal>


    <!-- ================================================================
         Audit Log Detail Drawer
         ================================================================ -->
    <lex-drawer
      id="auditDrawer"
      heading="Audit Log Details"
      side="right"
      width="520px"
    >
      <div id="auditDrawerContent">
        <lex-stack direction="vertical" gap="sm" style="margin-bottom:1.5rem;">
          <lex-kv id="auditKvEventType" label="Event Type"></lex-kv>
          <lex-kv id="auditKvTimestamp" label="Timestamp"></lex-kv>
          <lex-kv id="auditKvUser"      label="User"></lex-kv>
          <lex-kv id="auditKvIP"        label="IP Address"></lex-kv>
        </lex-stack>
        <lex-divider label="Details" style="margin-bottom:1rem;"></lex-divider>
        <pre id="auditKvDetails" style="
          background:var(--lex-bg-secondary,#F5F5F0);
          border:1px solid var(--lex-border-default);
          border-radius:var(--lex-radius-md,6px);
          padding:0.75rem 1rem;
          font-family:monospace;
          font-size:var(--lex-body-xs-size,0.75rem);
          overflow-x:auto;
          white-space:pre-wrap;
          word-break:break-all;
          color:var(--lex-text-primary);
        "></pre>
      </div>
    </lex-drawer>

  </template>

  <noscript>
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,sans-serif;color:#666;">
      Please enable JavaScript to use LANA AI.
    </div>
  </noscript>

  <!-- ══════════════════════════════════════════════════════════════════
       Scripts at end of body — HTML renders first, scripts load after
       ══════════════════════════════════════════════════════════════════ -->

  <!-- Universal shell scripts -->
  <script src="../js/error-reporter.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/version.js"></script>
  <script src="../js/menu.js"></script>
  <script src="../js/navigation-helpers.js"></script>
  <script src="../js/new-project-modal.js"></script>
  <script src="../js/conversation-menu.js"></script>
  <script src="../js/conversation-search-modal.js"></script>
  <script src="../js/contact-search-modal.js"></script>
  <script src="../js/notifications.js"></script>

  <!-- Utility dependency (event display names) -->
  <script src="../js/utils/event-display-names.js"></script>

  <!-- Lex UI core -->
  <script src="../js/lex/lex.core.js"></script>
  <script src="../js/lex/lex.icons.js"></script>
  <script src="../js/lex/lex.data.js"></script>
  <script src="../js/lex/lex.forms.js"></script>
  <script src="../js/lex/lex.state.js"></script>
  <script src="../js/lex/lex.utils.js"></script>
  <script src="../js/lex/lex.auth.js"></script>
  <script src="../js/lex/lex-nav.js"></script>

  <!-- Lex UI foundation + layout -->
  <script src="../js/lex/components/foundation/lex-loader.js"></script>
  <script src="../js/lex/components/foundation/lex-toast.js"></script>
  <script src="../js/lex/components/foundation/lex-spinner.js"></script>
  <script src="../js/lex/components/foundation/lex-btn.js"></script>
  <script src="../js/lex/components/foundation/lex-empty.js"></script>
  <script src="../js/lex/components/form/lex-segmented.js"></script>
  <script src="../js/lex/components/layout/lex-sidebar.js"></script>
  <script src="../js/lex/components/layout/lex-topbar.js"></script>
  <script src="../js/lex/components/layout/lex-conversation-item.js"></script>
  <script src="../js/lex/components/layout/lex-notification-panel.js"></script>
  <script src="../js/lex/components/layout/lex-app.js"></script>

  <!-- Page-specific Lex components (BEFORE inject) -->
  <script src="../js/lex/components/foundation/lex-breadcrumb.js"></script>
  <script src="../js/lex/components/foundation/lex-banner.js"></script>
  <script src="../js/lex/components/foundation/lex-card.js"></script>
  <script src="../js/lex/components/foundation/lex-badge.js"></script>
  <script src="../js/lex/components/foundation/lex-kv.js"></script>
  <script src="../js/lex/components/foundation/lex-divider.js"></script>
  <script src="../js/lex/components/foundation/lex-stack.js"></script>
  <script src="../js/lex/components/foundation/lex-modal.js"></script>
  <script src="../js/lex/components/foundation/lex-drawer.js"></script>
  <script src="../js/lex/components/data/lex-table.js"></script>
  <script src="../js/lex/components/form/lex-select.js"></script>
  <script src="../js/lex/components/form/lex-input.js"></script>
  <script src="../js/lex/components/form/lex-dropdown-btn.js"></script>

  <!-- Inject page content + hoist modals -->
  <script src="../js/lex/lex-page-init.js"></script>

  <!-- Page controller -->
  <script src="../js/admin/admin-audit.js"></script>

  <!-- Auth guard + loader dismiss (MUST be last) -->
  <script src="../js/auth-guard.js"></script>
</body>
</html>
