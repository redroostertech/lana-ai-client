<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audit Logs - LanaAI</title>
  <script src="../js/tailwind-loader.js"></script>
  <script src="../js/error-reporter.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/menu.js"></script>
  <script src="../js/notifications.js"></script>

  <!-- Inline preloader styles - Pure CSS, no dependencies -->
  <style>
    #lana-preloader {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.3s ease-out;
    }
    #lana-preloader.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .preloader-logo {
      width: 80px;
      height: 80px;
      margin-bottom: 24px;
      animation: pulse 2s ease-in-out infinite;
    }
    .preloader-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }
    .preloader-text {
      color: white;
      font-size: 16px;
      font-weight: 500;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(0.96); }
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="lana-preloader">
    <svg class="preloader-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="45" fill="white" opacity="0.15"/>
      <circle cx="50" cy="50" r="35" fill="white" opacity="0.3"/>
      <circle cx="50" cy="50" r="25" fill="white"/>
      <text x="50" y="58" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#667eea" text-anchor="middle">L</text>
    </svg>
    <div class="preloader-spinner"></div>
    <div class="preloader-text">Loading LanaAI...</div>
  </div>

  <div id="app-content">
  <!-- Sidebar -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-gray-900 text-white transform -translate-x-full lg:translate-x-0 transition-transform z-30 flex flex-col">
    <div class="flex-shrink-0 flex items-center justify-between h-16 px-6 border-b border-gray-800">
      <a href="../index.html" class="text-xl font-bold text-indigo-400">LanaAI</a>
      <button id="closeSidebar" class="lg:hidden text-gray-400 hover:text-white">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>
    <nav id="mainNav" class="flex-1 overflow-hidden pt-6 px-3">
      <!-- Menu will be dynamically rendered by menu.js -->
    </nav>
  </aside>

  <!-- Main Content -->
  <div class="lg:ml-64">
    <header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-20">
      <div class="flex items-center justify-between h-16 px-4 lg:px-8">
        <button id="openSidebar" class="lg:hidden text-gray-500 hover:text-gray-700">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
        <div class="flex-1 px-4 lg:px-0">
          <h1 class="text-xl font-semibold text-gray-900">Audit Logs</h1>
        </div>
        <div class="flex items-center gap-4">
          <!-- Notifications -->
          <button id="notificationBtn" class="relative text-gray-500 hover:text-gray-700">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
            </svg>
            <span id="notificationBadge" class="hidden absolute -top-1 -right-1 w-4 h-4 bg-red-500 text-white text-xs rounded-full flex items-center justify-center">0</span>
          </button>

          <!-- User Menu -->
          <div class="relative" id="userMenu">
            <button class="flex items-center gap-2 text-gray-700 hover:text-gray-900">
              <div class="w-8 h-8 bg-indigo-100 rounded-full flex items-center justify-center">
                <span id="userInitials" class="text-sm font-medium text-indigo-600">U</span>
              </div>
              <span id="userName" class="hidden sm:block text-sm font-medium">User</span>
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
              </svg>
            </button>
            <div id="userDropdown" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-200 py-1 z-50">
              <a href="../settings.html" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Settings</a>
              <hr class="my-1">
              <button id="logoutBtn" class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-gray-100">Sign out</button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Notification Panel Overlay -->
    <div id="notificationOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity"></div>

    <!-- Notification Slide-out Panel -->
    <div id="notificationPanel" class="fixed inset-y-0 right-0 w-full sm:w-96 bg-white shadow-2xl z-50 transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
      <div class="flex items-center justify-between h-16 px-6 border-b border-gray-200 flex-shrink-0">
        <h2 class="text-lg font-semibold text-gray-900">Notifications</h2>
        <div class="flex items-center gap-3">
          <button id="markAllReadBtn" class="text-sm text-indigo-600 hover:text-indigo-800 font-medium hidden">Mark all read</button>
          <button id="refreshNotificationsBtn" class="text-gray-400 hover:text-gray-600 transition-colors" title="Refresh">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
          </button>
          <button id="closeNotificationPanel" class="text-gray-400 hover:text-gray-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
        </div>
      </div>
      <div class="flex border-b border-gray-200 px-6 flex-shrink-0">
        <button id="filterAll" class="px-4 py-3 text-sm font-medium text-indigo-600 border-b-2 border-indigo-600">All</button>
        <button id="filterUnread" class="px-4 py-3 text-sm font-medium text-gray-500 hover:text-gray-700">Unread</button>
      </div>
      <div id="notificationList" class="flex-1 overflow-y-auto">
        <div id="notificationLoading" class="p-8 text-center">
          <div class="animate-spin w-8 h-8 border-4 border-indigo-200 border-t-indigo-600 rounded-full mx-auto"></div>
          <p class="text-gray-500 mt-3 text-sm">Loading notifications...</p>
        </div>
      </div>
      <div id="notificationLoadingMore" class="hidden p-4 border-t border-gray-100 text-center flex-shrink-0">
        <div class="animate-spin w-5 h-5 border-2 border-indigo-200 border-t-indigo-600 rounded-full mx-auto"></div>
      </div>
    </div>

    <main class="p-4 lg:p-8">
      <!-- Statistics Cards -->
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
          <h3 class="text-sm font-medium text-gray-500">Total Events (30d)</h3>
          <p id="statTotal" class="text-2xl font-bold text-gray-900 mt-1">-</p>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
          <h3 class="text-sm font-medium text-gray-500">Security Events</h3>
          <p id="statSecurity" class="text-2xl font-bold text-red-600 mt-1">-</p>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
          <h3 class="text-sm font-medium text-gray-500">User Actions</h3>
          <p id="statUser" class="text-2xl font-bold text-blue-600 mt-1">-</p>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
          <h3 class="text-sm font-medium text-gray-500">System Events</h3>
          <p id="statSystem" class="text-2xl font-bold text-green-600 mt-1">-</p>
        </div>
      </div>

      <!-- Filters -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 mb-6">
        <div class="flex flex-wrap gap-4 items-end">
          <div class="flex-1 min-w-[200px]">
            <label class="block text-sm font-medium text-gray-700 mb-1">Event Type</label>
            <select id="eventTypeFilter" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
              <option value="">All Event Types</option>
            </select>
          </div>
          <div class="flex-1 min-w-[150px]">
            <label class="block text-sm font-medium text-gray-700 mb-1">From Date</label>
            <input type="date" id="fromDate" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
          </div>
          <div class="flex-1 min-w-[150px]">
            <label class="block text-sm font-medium text-gray-700 mb-1">To Date</label>
            <input type="date" id="toDate" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
          </div>
          <div class="flex gap-2">
            <button id="applyFilters" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg">Apply</button>
            <button id="clearFilters" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg">Clear</button>
            <button id="exportBtn" class="px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg flex items-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
              Export
            </button>
          </div>
        </div>
      </div>

      <!-- Audit Logs Table -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-100">
        <div id="auditTable"></div>
      </div>
    </main>
  </div>

  <!-- Export Modal -->
  <div id="exportModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl shadow-xl max-w-md w-full">
      <div class="px-6 py-4 border-b border-gray-200">
        <h3 class="text-lg font-semibold text-gray-900">Export Audit Logs</h3>
      </div>
      <div class="p-6 space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Export Format</label>
          <div class="flex gap-4">
            <label class="flex items-center gap-2">
              <input type="radio" name="exportFormat" value="csv" checked class="w-4 h-4 text-indigo-600">
              CSV
            </label>
            <label class="flex items-center gap-2">
              <input type="radio" name="exportFormat" value="json" class="w-4 h-4 text-indigo-600">
              JSON
            </label>
          </div>
        </div>
        <p class="text-sm text-gray-500">Export will include all logs matching current filters.</p>
      </div>
      <div class="px-6 py-4 border-t border-gray-200 flex justify-end gap-3">
        <button id="cancelExport" class="px-4 py-2 text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg">Cancel</button>
        <button id="confirmExport" class="px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg">Export</button>
      </div>
    </div>
  </div>

  <script>
    if (!api.requireAuth()) throw new Error('Not authenticated');
    
    // Load full user profile with roles before rendering menu
    (async () => {
      try {
        await api.loadUserProfile();
      } catch (error) {
        console.error('Failed to load user profile:', error);
      }
      
      // Render dynamic menu (will now have access to roles)
      renderMenu('#mainNav');
    })();

    // Initialize notifications panel
    NotificationPanel.init();

    // Load user info
    function loadUserInfo() {
      const user = api.user;
      if (user) {
        const name = `${user.firstName || ''} ${user.lastName || ''}`.trim() || user.email;
        const initials = (user.firstName?.[0] || '') + (user.lastName?.[0] || '') || user.email[0].toUpperCase();
        document.getElementById('userName').textContent = name;
        document.getElementById('userInitials').textContent = initials;
      }
    }
    loadUserInfo();

    // User menu toggle
    const userMenu = document.getElementById('userMenu');
    const userDropdown = document.getElementById('userDropdown');
    userMenu.addEventListener('click', (e) => {
      e.stopPropagation();
      userDropdown.classList.toggle('hidden');
    });
    document.addEventListener('click', (e) => {
      if (!userMenu.contains(e.target)) userDropdown.classList.add('hidden');
    });

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await api.logout();
      window.location.href = '../login.html';
    });

    // Sidebar toggle
    const sidebar = document.getElementById('sidebar');
    document.getElementById('openSidebar').addEventListener('click', () => sidebar.classList.remove('-translate-x-full'));
    document.getElementById('closeSidebar').addEventListener('click', () => sidebar.classList.add('-translate-x-full'));

    // State
    let currentPage = 1;
    const pageSize = 10;
    let logs = [];
    let eventTypes = [];

    // Table
    const table = new DataTable('#auditTable', {
      columns: [
        {
          key: 'timestamp',
          label: 'Timestamp',
          render: (val) => formatDateTime(val)
        },
        {
          key: 'event_type',
          label: 'Event Type',
          render: (val) => `<span class="px-2 py-1 bg-gray-100 text-gray-700 text-xs rounded font-mono">${val}</span>`
        },
        {
          key: 'user_email',
          label: 'User',
          render: (val) => `<div class="max-w-xs break-words">${val || '-'}</div>`
        },
        {
          key: 'ip_address',
          label: 'IP Address',
          render: (val) => val || '-'
        },
        {
          key: 'details',
          label: 'Details',
          render: (val, row) => `
            <button onclick="viewLogDetails('${row.id}')" class="text-indigo-600 hover:text-indigo-800 text-sm">View</button>
          `
        }
      ],
      pageSize,
      emptyMessage: 'No audit logs found',
      onPageChange: (page) => {
        currentPage = page;
        loadLogs();
      }
    });

    // Load event types
    async function loadEventTypes() {
      try {
        const result = await api.getAuditEventTypes();
        eventTypes = result.event_types || [];
        const select = document.getElementById('eventTypeFilter');
        select.innerHTML = '<option value="">All Event Types</option>' +
          eventTypes.map(et => {
            // Handle both string format and object format
            const eventType = typeof et === 'string' ? et : et.event_type;
            const count = typeof et === 'object' && et.count ? ` (${et.count})` : '';
            return `<option value="${eventType}">${eventType}${count}</option>`;
          }).join('');
      } catch (error) {
        console.error('Failed to load event types:', error);
      }
    }

    // Load statistics
    async function loadStatistics() {
      try {
        const thirtyDaysAgo = new Date();
        thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
        const result = await api.getAuditStatistics(thirtyDaysAgo.toISOString(), new Date().toISOString());

        document.getElementById('statTotal').textContent = result.total_events || 0;
        
        // Handle security_events - can be number or object
        const securityCount = typeof result.security_events === 'object' 
          ? Object.values(result.security_events || {}).reduce((sum, val) => sum + val, 0)
          : result.security_events || 0;
        document.getElementById('statSecurity').textContent = securityCount;

        // Calculate user and system events from by_event_type (array format)
        const byType = result.by_event_type || [];
        let userEvents = 0;
        let systemEvents = 0;
        
        byType.forEach(item => {
          const type = item.event_type;
          const count = parseInt(item.count) || 0;
          if (type.startsWith('user.') || type.includes('login') || type.includes('logout')) {
            userEvents += count;
          } else if (type.startsWith('system.')) {
            systemEvents += count;
          }
        });
        
        document.getElementById('statUser').textContent = userEvents;
        document.getElementById('statSystem').textContent = systemEvents;
      } catch (error) {
        console.error('Failed to load statistics:', error);
      }
    }

    // Load logs
    async function loadLogs() {
      try {
        const eventType = document.getElementById('eventTypeFilter').value;
        const fromDate = document.getElementById('fromDate').value;
        const toDate = document.getElementById('toDate').value;

        const filters = {};
        if (eventType) filters.event_type = eventType;
        if (fromDate) filters.start_date = fromDate;
        if (toDate) filters.end_date = toDate;

        const result = await api.getAuditLogs(currentPage, pageSize, filters);
        logs = result.logs || [];
        const total = result.pagination?.total || result.total || logs.length;
        table.setData(logs, total);
      } catch (error) {
        console.error('Failed to load audit logs:', error);
        Toast.error('Failed to load audit logs');
      }
    }

    // View log details
    async function viewLogDetails(logId) {
      const log = logs.find(l => l.id === logId);
      if (!log) return;

      const content = document.createElement('div');
      content.className = 'space-y-4 text-sm';
      content.innerHTML = `
        <div class="grid grid-cols-2 gap-4">
          <div>
            <p class="text-gray-500">Event Type</p>
            <p class="font-medium">${log.event_type}</p>
          </div>
          <div>
            <p class="text-gray-500">Timestamp</p>
            <p class="font-medium">${formatDateTime(log.timestamp)}</p>
          </div>
          <div>
            <p class="text-gray-500">User</p>
            <p class="font-medium">${log.user_email || '-'}</p>
          </div>
          <div>
            <p class="text-gray-500">IP Address</p>
            <p class="font-medium">${log.ip_address || '-'}</p>
          </div>
        </div>
        <div>
          <p class="text-gray-500 mb-1">Details</p>
          <pre class="bg-gray-100 p-3 rounded-lg overflow-x-auto text-xs">${JSON.stringify(log.details || {}, null, 2)}</pre>
        </div>
      `;

      Modal.show({
        title: 'Audit Log Details',
        content,
        cancelText: 'Close',
        confirmText: 'OK'
      });
    }

    // Filters
    document.getElementById('applyFilters').addEventListener('click', () => {
      currentPage = 1;
      loadLogs();
    });

    document.getElementById('clearFilters').addEventListener('click', () => {
      document.getElementById('eventTypeFilter').value = '';
      document.getElementById('fromDate').value = '';
      document.getElementById('toDate').value = '';
      currentPage = 1;
      loadLogs();
    });

    // Export
    const exportModal = document.getElementById('exportModal');
    document.getElementById('exportBtn').addEventListener('click', () => exportModal.classList.remove('hidden'));
    document.getElementById('cancelExport').addEventListener('click', () => exportModal.classList.add('hidden'));

    document.getElementById('confirmExport').addEventListener('click', async () => {
      const format = document.querySelector('input[name="exportFormat"]:checked').value;
      const eventType = document.getElementById('eventTypeFilter').value;
      const fromDate = document.getElementById('fromDate').value;
      const toDate = document.getElementById('toDate').value;

      try {
        const result = await api.exportAuditLogs(format, {
          event_type: eventType || undefined,
          start_date: fromDate || undefined,
          end_date: toDate || undefined
        });

        // Download the data
        const blob = new Blob([format === 'csv' ? result.data : JSON.stringify(result.data, null, 2)], {
          type: format === 'csv' ? 'text/csv' : 'application/json'
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `audit-logs-${new Date().toISOString().split('T')[0]}.${format}`;
        a.click();
        URL.revokeObjectURL(url);

        exportModal.classList.add('hidden');
        Toast.success('Export downloaded');
      } catch (error) {
        Toast.error('Export failed');
      }
    });

    // Set default date to today
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('toDate').value = today;

    // Initialize
    loadEventTypes();
    loadStatistics();
    loadLogs();
  </script>
  </div>
</body>
</html>
