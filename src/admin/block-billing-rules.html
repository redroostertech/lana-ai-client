<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Block Billing Rules - LANA AI</title>

  <link rel="stylesheet" href="../css/lex-tokens.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/tailwind-output.css">

  <!-- Lex Core -->
  <script src="../js/lex/core/lex.core.js"></script>
  <script src="../js/lex/core/lex.loader.js"></script>
  <script src="../js/lex/core/lex.router.js"></script>

  <!-- Lex Components -->
  <script src="../js/lex/components/lex-card.js"></script>
  <script src="../js/lex/components/lex-btn.js"></script>
  <script src="../js/lex/components/lex-banner.js"></script>
  <script src="../js/lex/components/lex-modal.js"></script>
  <script src="../js/lex/components/lex-select.js"></script>
  <script src="../js/lex/components/lex-empty.js"></script>
  <script src="../js/lex/components/layout/lex-app.js"></script>
  <script src="../js/lex/components/layout/lex-sidebar.js"></script>
  <script src="../js/lex/components/layout/lex-topbar.js"></script>

  <!-- API + Auth -->
  <script src="../js/api.js"></script>
  <script src="../js/config.js"></script>
</head>
<body>
  <lex-app page-title="Block Billing Rules" active-nav-id="reports">
    <template id="page-content">
      <div style="max-width:72rem;margin:0 auto;padding:1.5rem;">

        <!-- Header -->
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;">
          <div>
            <div style="font-size:0.75rem;color:var(--lex-text-muted);">
              <a href="analytics.html" style="color:var(--lex-color-blue-600);text-decoration:none;">Analytics</a>
              <span style="margin:0 0.25rem;">></span>
              <a href="billable-hours.html" style="color:var(--lex-color-blue-600);text-decoration:none;">Billable Hours</a>
              <span style="margin:0 0.25rem;">></span>
              Block Billing Rules
            </div>
            <h1 style="font-size:1.5rem;font-weight:700;color:var(--lex-text-primary);margin-top:0.25rem;">Block Billing Rules</h1>
            <p style="font-size:0.875rem;color:var(--lex-text-muted);margin-top:0.25rem;">Define rules to group related activities into coherent billing blocks with UTBMS codes.</p>
          </div>
          <div style="display:flex;gap:0.5rem;">
            <lex-btn id="bbInitBtn" variant="outline" size="sm">Initialize Defaults</lex-btn>
            <lex-btn id="bbCreateBtn" variant="primary" size="sm">Create Rule</lex-btn>
          </div>
        </div>

        <!-- Rules table -->
        <lex-card>
          <div id="bbRulesLoading" style="padding:2rem;text-align:center;">
            <div class="animate-pulse"><div class="cc-skeleton" style="height:2rem;width:100%;margin-bottom:0.5rem;"></div><div class="cc-skeleton" style="height:2rem;width:100%;"></div></div>
          </div>
          <div id="bbRulesTable" class="hidden"></div>
          <div id="bbRulesEmpty" class="hidden" style="padding:3rem;text-align:center;">
            <lex-empty heading="No block billing rules" description="Click 'Initialize Defaults' to load recommended rules for legal work, or create custom rules."></lex-empty>
          </div>
        </lex-card>

      </div>
    </template>
  </lex-app>

  <!-- Page controller -->
  <script src="../js/admin/block-billing-rules.js"></script>

  <!-- Auth guard -->
  <script src="../js/auth-guard.js"></script>
</body>
</html>
