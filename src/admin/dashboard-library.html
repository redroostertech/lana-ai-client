<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library - LANA AI</title>

  <link rel="stylesheet" href="../css/lex-tokens.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/tailwind-output.css">
  <link rel="stylesheet" href="../css/admin/insights-dashboard.css">
  <script src="../js/tailwind-loader.js"></script>
  <link rel="stylesheet" href="../css/lex-chat.css">
</head>
<body>
  <lex-loader theme="light"></lex-loader>

  <lex-app
    logo-src="../img/logo-light.png"
    logo-alt="LANA AI"
    logo-href="../dashboard.html"
    active-nav-id="insights-library"
    page-title="Library"
  ></lex-app>

  <template id="page-content">
    <main>
      <lex-banner
        variant="light"
        heading="Library"
        subtitle="Search and open completed dashboards"
        lana
        lana-context-type="full_chat"
      >
        <lex-btn id="createDashboardBtn" variant="primary" size="sm">Create Dashboard</lex-btn>
      </lex-banner>

      <section id="dashboardLibraryPinnedSection" class="insights-pinned-section" aria-label="Pinned dashboards" hidden>
        <div class="insights-pinned-header">
          <div class="insights-pinned-header__title">
            <svg class="insights-pinned-header__icon" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M16 12V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v8l-2 2v2h5v6l1 1 1-1v-6h5v-2l-2-2z"/>
            </svg>
            <span>Pinned</span>
          </div>
          <div class="insights-pinned-header__count" id="dashboardLibraryPinnedCount">0 items</div>
        </div>
        <div id="dashboardLibraryPinnedGrid" class="insights-pinned-grid"></div>
      </section>

      <!-- Search / Sort / Filter toolbar (docs/TABLE-STANDARD.md section 2) -->
      <div class="bg-white rounded-lg shadow-sm border mb-4 mt-4 p-4" style="border-color: var(--lex-border-default)" role="search" aria-label="Search and filter dashboards">
        <div class="flex items-center gap-4 flex-wrap">
          <div class="flex-1 min-w-[200px]">
            <lex-input id="dashboardLibrarySearch" placeholder="Search dashboards..." clearable="true" leading-icon="search"></lex-input>
          </div>
          <div class="flex items-center gap-2">
            <label class="text-sm whitespace-nowrap" style="color: var(--lex-text-secondary)">Sort by:</label>
            <lex-select
              id="dashboardLibrarySort"
              options='[{"value":"updated_at","label":"Last edited"},{"value":"created_at","label":"Created"},{"value":"name","label":"Name"},{"value":"audience","label":"Audience"},{"value":"category","label":"Category"}]'
              value="updated_at"
            ></lex-select>
          </div>
          <lex-btn id="dashboardLibrarySortOrder" variant="ghost" icon="true" title="Toggle sort order" data-order="desc">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12"></path>
            </svg>
          </lex-btn>
          <div class="flex items-center gap-2">
            <label class="text-sm whitespace-nowrap" style="color: var(--lex-text-secondary)">Audience:</label>
            <lex-select id="dashboardLibraryAudienceFilter" options='[{"value":"all","label":"All"}]' value="all"></lex-select>
          </div>
          <div id="dashboardLibraryCount" class="text-sm whitespace-nowrap" style="color: var(--lex-text-secondary)"></div>
        </div>
      </div>

      <section class="insights-section" aria-labelledby="dashboardLibraryHeading">
        <div class="flex items-center justify-between mb-3">
          <h2 id="dashboardLibraryHeading" class="text-lg font-semibold" style="color: var(--lex-text-primary)">Dashboard Library</h2>
          <span id="dashboardLibrarySectionCount" class="text-sm" style="color: var(--lex-text-secondary)" aria-live="polite"></span>
        </div>

        <lex-table
          id="dashboardLibraryTable"
          class="lex-table--card"
          column-filters
          columns="pin,name,audience,category,scope,visibility,state,created_at,updated_at,actions"
          labels=" ,Name,Audience,Category,Scope,Visibility,State,Created,Last edited,Actions"
          sortable-columns="name,audience,category,scope,visibility,state,created_at,updated_at"
          sort-by="updated_at"
          sort-dir="desc"
          limit="20"
          id-key="row_id"
          empty-text="No dashboards yet"
          empty-action-label="Create Dashboard"
          aria-label="Dashboard library"
        ></lex-table>
      </section>
    </main>
  </template>

  <noscript><div class="lex-noscript-message">Please enable JavaScript to use LANA AI.</div></noscript>

  <script src="../js/error-reporter.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/time-utils.js"></script>
  <script src="../js/shared/request-retry.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/version.js"></script>
  <script src="../js/menu.js"></script>
  <script src="../js/navigation-helpers.js"></script>
  <script src="../js/conversation-search-modal.js"></script>
  <script src="../js/contact-search-modal.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/lex/lex.core.js"></script>
  <script src="../js/lex/lex.icons.js"></script>
  <script src="../js/lex/lex.data.js"></script>
  <script src="../js/lex/lex.forms.js"></script>
  <script src="../js/lex/lex.state.js"></script>
  <script src="../js/lex/lex.utils.js"></script>
  <script src="../js/lex/lex.auth.js"></script>
  <script src="../js/lex/lex-nav.js"></script>
  <script src="../js/lex/components/foundation/lex-loader.js"></script>
  <script src="../js/lex/components/foundation/lex-toast.js"></script>
  <script src="../js/lex/components/foundation/lex-spinner.js"></script>
  <script src="../js/lex/components/foundation/lex-btn.js"></script>
  <script src="../js/lex/components/foundation/lex-empty.js"></script>
  <script src="../js/lex/components/foundation/lex-badge.js"></script>
  <script src="../js/lex/components/foundation/lex-modal.js"></script>
  <script src="../js/lex/components/form/lex-input.js"></script>
  <script src="../js/lex/components/form/lex-select.js"></script>
  <script src="../js/lex/components/data/lex-table.js"></script>
  <script src="../js/lex/components/form/lex-segmented.js"></script>
  <script src="../js/lex/components/layout/lex-sidebar.js"></script>
  <script src="../js/lex/components/layout/lex-topbar.js"></script>
  <script src="../js/lex/components/layout/lex-conversation-item.js"></script>
  <script src="../js/lex/components/layout/lex-notification-panel.js"></script>
  <script src="../js/lex/components/layout/lex-app.js"></script>
  <script src="../js/lex/components/foundation/lex-banner.js"></script>
  <script src="../js/lex/lex-page-init.js"></script>
  <script src="../js/shared/library-column-filters.js"></script>
  <script src="../js/shared/metric-tables.js"></script>
  <script src="../js/admin/dashboard-catalog.js"></script>
  <script src="../js/admin/dashboard-library.js"></script>
  <script src="../js/auth-guard.js"></script>
  <lex-lana-dock page-scope="dashboard" context-type="full_chat" placeholder="Ask LANA anything..." thread-title="LANA Chat"></lex-lana-dock>
  <!-- LANA dock (IDE-style docked chat panel) -->
  <script src="../js/lex/chat/lex-chat.format.js"></script>
  <script src="../js/lex/chat/lex-chat.conversations-api.js"></script>
  <script src="../js/lex/chat/lex-chat.source.js"></script>
  <script src="../js/lex/chat/lex-chat.message.js"></script>
  <script src="../js/lex/chat/lex-chat-progress-events.js"></script>
  <script src="../js/lex/chat/lex-chat.activity.js"></script>
  <script src="../js/lex/chat/lex-chat.documents.js"></script>
  <script src="../js/lex/chat/lex-chat.composer-mentions.js"></script>
  <script src="../js/services/slash-commands.service.js"></script>
  <script src="../js/lex/chat/lex-chat.composer-slash.js"></script>
  <script src="../js/lex/chat/lex-chat.composer.js"></script>
  <script src="../js/lex/chat/lex-chat.thread.js"></script>
  <script src="../js/lex/chat/lex-chat.threads.js"></script>
  <script src="../js/lex/chat/lex-chat.js"></script>
  <script src="../js/lex/chat/lex-dynamic-card.renderer.js"></script>
  <script src="../js/lex/chat/lex-agentic-plan-card.js"></script>
  <script src="../js/lex/chat/lex-chat.index.js"></script>
  <script src="../js/lex/components/chat/lex-lana-panel.js"></script>
  <script src="../js/lex/components/layout/lex-lana-dock.js"></script>
</body>
</html>
