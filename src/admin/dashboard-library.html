<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library - LANA AI</title>

  <link rel="stylesheet" href="../css/lex-tokens.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/tailwind-output.css">
  <link rel="stylesheet" href="../css/admin/insights-dashboard.css">
  <script src="../js/tailwind-loader.js"></script>
</head>
<body>
  <lex-loader theme="light"></lex-loader>

  <lex-app
    logo-src="../img/logo-light.png"
    logo-alt="LANA AI"
    logo-href="../dashboard.html"
    active-nav-id="insights-library"
    page-title="Library"
  ></lex-app>

  <template id="page-content">
    <main>
      <lex-banner
        variant="light"
        heading="Library"
        subtitle="Search and open completed dashboards"
      >
        <lex-btn id="createDashboardBtn" variant="primary" size="sm">Create Dashboard</lex-btn>
      </lex-banner>

      <section id="dashboardLibraryPinnedSection" class="insights-pinned-section" aria-label="Pinned dashboards" hidden>
        <div class="insights-pinned-header">
          <div class="insights-pinned-header__title">
            <svg class="insights-pinned-header__icon" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M16 12V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v8l-2 2v2h5v6l1 1 1-1v-6h5v-2l-2-2z"/>
            </svg>
            <span>Pinned</span>
          </div>
          <div class="insights-pinned-header__count" id="dashboardLibraryPinnedCount">0 items</div>
        </div>
        <div id="dashboardLibraryPinnedGrid" class="insights-pinned-grid"></div>
      </section>

      <section class="insights-section" aria-labelledby="dashboardLibraryHeading">
        <div class="insights-section-header">
          <div>
            <div class="insights-section-title" id="dashboardLibraryHeading">Dashboard Library</div>
            <div class="insights-section-subtitle">Role-aware dashboard groups backed by report modules and metric catalog entries</div>
          </div>
        </div>

        <div class="insights-library-card">
          <lex-table
            id="dashboardLibraryTable"
            searchable
            filterable
            column-filters
            compact
            limit="10"
            columns="pin,name,audience,category,scope,visibility,state,actions"
            labels=" ,Name,Audience,Category,Scope,Visibility,State,Actions"
            sort-by="name"
            sort-dir="asc"
            empty-text="No dashboards found"
            aria-label="Dashboard library"
          ></lex-table>
        </div>
      </section>
    </main>
  </template>

  <noscript><div class="lex-noscript-message">Please enable JavaScript to use LANA AI.</div></noscript>

  <script src="../js/error-reporter.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/version.js"></script>
  <script src="../js/menu.js"></script>
  <script src="../js/navigation-helpers.js"></script>
  <script src="../js/new-project-modal.js"></script>
  <script src="../js/conversation-menu.js"></script>
  <script src="../js/conversation-search-modal.js"></script>
  <script src="../js/contact-search-modal.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/lex/lex.core.js"></script>
  <script src="../js/lex/lex.icons.js"></script>
  <script src="../js/lex/lex.data.js"></script>
  <script src="../js/lex/lex.forms.js"></script>
  <script src="../js/lex/lex.state.js"></script>
  <script src="../js/lex/lex.utils.js"></script>
  <script src="../js/lex/lex.auth.js"></script>
  <script src="../js/lex/lex-nav.js"></script>
  <script src="../js/lex/components/foundation/lex-loader.js"></script>
  <script src="../js/lex/components/foundation/lex-toast.js"></script>
  <script src="../js/lex/components/foundation/lex-spinner.js"></script>
  <script src="../js/lex/components/foundation/lex-btn.js"></script>
  <script src="../js/lex/components/foundation/lex-empty.js"></script>
  <script src="../js/lex/components/data/lex-filter-bar.js"></script>
  <script src="../js/lex/components/data/lex-table.js"></script>
  <script src="../js/lex/components/form/lex-segmented.js"></script>
  <script src="../js/lex/components/layout/lex-sidebar.js"></script>
  <script src="../js/lex/components/layout/lex-topbar.js"></script>
  <script src="../js/lex/components/layout/lex-conversation-item.js"></script>
  <script src="../js/lex/components/layout/lex-notification-panel.js"></script>
  <script src="../js/lex/components/layout/lex-app.js"></script>
  <script src="../js/lex/components/foundation/lex-banner.js"></script>
  <script src="../js/lex/lex-page-init.js"></script>
  <script src="../js/admin/dashboard-catalog.js"></script>
  <script src="../js/admin/dashboard-library.js"></script>
  <script src="../js/auth-guard.js"></script>
</body>
</html>
