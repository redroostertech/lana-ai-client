<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Objects - LANA AI</title>

  <!-- ── CSS + Tailwind in head — behavioral scripts at end of body ── -->
  <script src="../js/lex/lex.theme.js"></script>
  <link rel="stylesheet" href="../css/lex-tokens.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin/custom-objects.css">
  <link rel="stylesheet" href="../css/admin/admin-switcher.css">
  <link rel="stylesheet" href="../css/tailwind-output.css">
  <script src="../js/tailwind-loader.js"></script>

  <link rel="stylesheet" href="../css/lex-chat.css">
</head>
<body>

  <!-- Branded loader — shows once lex-loader.js upgrades the element -->
  <lex-loader theme="light"></lex-loader>

  <!-- App shell -->
  <lex-app
    logo-src="../img/logo-light.png"
    logo-alt="LANA AI"
    logo-href="../dashboard.html"
    active-nav-id="admin"
    page-title="Custom Objects"
  ></lex-app>

  <!-- Page content as inert <template> -->
  <template id="page-content">

    <main>

      <lex-banner
        variant="light"
        corners
        heading="Custom objects"
        subtitle="Define the records your firm keeps on matters, such as payments, with their fields and who may change them"
        lana
        lana-context-type="full_chat"
      ></lex-banner>

      <lex-breadcrumb items='[{"label":"Administration","href":"admin/index.html"},{"label":"Custom Objects"}]'></lex-breadcrumb>

      <!-- The organization's object types (GET /api/v1/custom-object-types) -->
      <lex-card id="typesCard" heading="Object types" variant="default" class="custom-objects__card">
        <div class="custom-objects__toolbar">
          <lex-toggle id="typesShowArchived" name="include_archived" label="Show archived types"></lex-toggle>
          <lex-btn id="typesNew" variant="primary">New type</lex-btn>
        </div>
        <p class="custom-objects__help">New estate matters show Payments on their own. On a matter opened before, open the matter's menu, choose Object types, and add Payments there.</p>
        <p id="typesNotice" class="custom-objects__notice" hidden></p>
        <lex-table id="typesTable" class="lex-table--card" columns="label,key,fields,status,author,editor" labels="Type,Key,Fields,Status,Created,Last changed" empty-text="No object types yet"></lex-table>
        <lex-empty id="typesEmpty" message="No object types yet" description="Create one, or wait for LANA to add the types that come with your practice." hidden></lex-empty>
      </lex-card>

      <!-- Editor: one type's fields and rules -->
      <lex-card id="editorCard" variant="default" class="custom-objects__card" hidden>
        <h2 id="editorTitle" class="custom-objects__title">Object type</h2>
        <p id="editorProtected" class="custom-objects__help" hidden>This type came with LANA. Its protected fields and status options cannot be removed.</p>
        <p id="editorAttribution" class="custom-objects__help"></p>
        <div class="custom-objects__grid">
          <lex-input id="editorLabel" name="label" label="Name (one)" placeholder="Payment"></lex-input>
          <lex-input id="editorPlural" name="label_plural" label="Name (many), shown as the matter tab" placeholder="Payments"></lex-input>
          <lex-input id="editorKey" name="key" label="Key" help="Used by automations. It cannot change after the type is created."></lex-input>
        </div>
        <lex-textarea id="editorDescription" name="description" label="Description" rows="2"></lex-textarea>

        <h3 class="custom-objects__section">Fields</h3>
        <div id="editorFields" class="custom-objects__fields"></div>
        <lex-btn id="editorAddField" variant="ghost" size="sm">Add field</lex-btn>

        <h3 class="custom-objects__section">Who may change records</h3>
        <div class="custom-objects__grid">
          <lex-select id="editorRecordEdit" name="record_edit" label="Edit a record"></lex-select>
          <lex-select id="editorRecordDelete" name="record_delete" label="Delete a record"></lex-select>
        </div>
        <p class="custom-objects__help">Everyone also needs to be able to edit the matter. Field locks set by LANA (for example the amount once a payment is paid) stay in place.</p>

        <p id="editorNotice" class="custom-objects__notice" hidden></p>
        <div class="custom-objects__actions">
          <lex-btn id="editorSave" variant="primary">Save type</lex-btn>
          <lex-btn id="editorCancel" variant="ghost">Close</lex-btn>
          <lex-btn id="editorArchive" variant="danger" class="custom-objects__archive">Archive type</lex-btn>
        </div>
      </lex-card>

    </main>

  </template>

  <noscript>
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,sans-serif;color:#666;">
      Please enable JavaScript to use LANA AI.
    </div>
  </noscript>

  <!-- ══════════════════════════════════════════════════════════════════
       Scripts at end of body — HTML renders first, scripts load after
       ══════════════════════════════════════════════════════════════════ -->

  <!-- Universal shell scripts -->
  <script src="../js/error-reporter.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/time-utils.js"></script>
  <script src="../js/shared/request-retry.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/version.js"></script>
  <script src="../js/menu.js"></script>
  <script src="../js/navigation-helpers.js"></script>
  <script src="../js/conversation-search-modal.js"></script>
  <script src="../js/contact-search-modal.js"></script>
  <script src="../js/notifications.js"></script>

  <!-- Lex UI core -->
  <script src="../js/lex/lex.core.js"></script>
  <script src="../js/lex/lex.icons.js"></script>
  <script src="../js/lex/lex.data.js"></script>
  <script src="../js/lex/lex.forms.js"></script>
  <script src="../js/lex/lex.state.js"></script>
  <script src="../js/lex/lex.utils.js"></script>
  <script src="../js/lex/lex.auth.js"></script>
  <script src="../js/lex/lex-nav.js"></script>

  <!-- Lex UI foundation + layout -->
  <script src="../js/lex/components/foundation/lex-loader.js"></script>
  <script src="../js/lex/components/foundation/lex-toast.js"></script>
  <script src="../js/lex/components/foundation/lex-spinner.js"></script>
  <script src="../js/lex/components/foundation/lex-btn.js"></script>
  <script src="../js/lex/components/foundation/lex-empty.js"></script>
  <script src="../js/lex/components/form/lex-segmented.js"></script>
  <script src="../js/lex/components/layout/lex-sidebar.js"></script>
  <script src="../js/lex/components/layout/lex-topbar.js"></script>
  <script src="../js/lex/components/layout/lex-conversation-item.js"></script>
  <script src="../js/lex/components/layout/lex-notification-panel.js"></script>
  <script src="../js/lex/components/layout/lex-app.js"></script>

  <!-- Page-specific Lex components (BEFORE inject) -->
  <script src="../js/lex/components/foundation/lex-breadcrumb.js"></script>
  <script src="../js/lex/components/foundation/lex-banner.js"></script>
  <script src="../js/lex/components/foundation/lex-card.js"></script>
  <script src="../js/lex/components/foundation/lex-badge.js"></script>
  <script src="../js/lex/components/foundation/lex-metric.js"></script>
  <script src="../js/lex/components/data/lex-table.js"></script>
  <script src="../js/lex/components/form/lex-select.js"></script>
  <script src="../js/lex/components/form/lex-input.js"></script>
  <script src="../js/lex/components/form/lex-toggle.js"></script>
  <script src="../js/lex/components/form/lex-textarea.js"></script>

  <!-- Inject page content + hoist modals -->
  <script src="../js/lex/lex-page-init.js"></script>
  <script src="../js/admin/admin-switcher.js"></script>

  <!-- Page controller -->
  <script src="../js/shared/custom-objects.js"></script>
  <script src="../js/api/custom-objects-api.client.js"></script>
  <script src="../js/admin/custom-objects.js"></script>

  <lex-lana-dock page-scope="dashboard" context-type="full_chat" placeholder="Ask LANA anything..." thread-title="LANA Chat"></lex-lana-dock>
  <!-- LANA dock (IDE-style docked chat panel) -->
  <script src="../js/shared/safe-url.js"></script>
  <script src="../js/shared/safe-html.js"></script>
  <script src="../js/lex/chat/lex-chat.format.js"></script>
  <script src="../js/lex/chat/lex-chat.conversations-api.js"></script>
  <script src="../js/lex/chat/lex-chat.source.js"></script>
  <script src="../js/lex/chat/lex-chat.message.js"></script>
  <script src="../js/lex/chat/lex-chat-progress-events.js"></script>
  <script src="../js/lex/chat/lex-chat.activity.js"></script>
  <script src="../js/lex/chat/lex-chat.documents.js"></script>
  <script src="../js/lex/chat/lex-chat.composer-mentions.js"></script>
  <script src="../js/services/slash-commands.service.js"></script>
  <script src="../js/lex/chat/lex-chat.composer-slash.js"></script>
  <script src="../js/lex/chat/lex-chat.composer.js"></script>
  <script src="../js/lex/chat/lex-chat.thread.js"></script>
  <script src="../js/lex/chat/lex-chat.threads.js"></script>
  <script src="../js/lex/chat/lex-chat.js"></script>
  <script src="../js/lex/chat/lex-dynamic-card.renderer.js"></script>
  <script src="../js/lex/chat/lex-agentic-plan-card.js"></script>
  <script src="../js/lex/chat/lex-chat.index.js"></script>
  <script src="../js/lex/components/chat/lex-lana-panel.js"></script>
  <script src="../js/lex/components/layout/lex-lana-dock.js"></script>

  <!-- Auth guard + loader dismiss (MUST be last) -->
  <script src="../js/auth-guard.js"></script>
</body>
</html>
