<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Details - LANA AI</title>

  <!-- ── CSS + Tailwind in head — behavioral scripts at end of body ── -->
  <link rel="stylesheet" href="../css/lex-tokens.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/tailwind-output.css">
  <script src="../js/tailwind-loader.js"></script>

  <style>
    #userActionsDropdown .lex-ddbtn-dropdown { left: auto; right: 0; }
  </style>

  <link rel="stylesheet" href="../css/lex-chat.css">
</head>
<body>

  <!-- Branded loader — shows once lex-loader.js upgrades the element -->
  <lex-loader theme="light"></lex-loader>

  <!-- App shell -->
  <lex-app
    logo-src="../img/logo-light.png"
    logo-alt="LANA AI"
    logo-href="../dashboard.html"
    active-nav-id="admin"
    page-title="User Details"
  ></lex-app>

  <!-- Page content as inert <template> -->
  <template id="page-content">

    <main>

      <!-- Page header -->
      <lex-banner
        id="userBanner"
        variant="light"
        heading="Loading..."
        subtitle=""
        lana
        lana-context-type="full_chat"
      >
        <lex-dropdown-btn
          id="userActionsDropdown"
          button-label="Actions"
          variant="secondary"
          options='[
            {"value":"edit","label":"Edit User","icon":"edit-2"},
            {"value":"toggle-status","label":"Activate User","icon":"toggle-right"},
            {"value":"reset-pw","label":"Reset Password","icon":"key"},
            {"value":"regen-key","label":"Regenerate Activation Key","icon":"refresh-cw"},
            {"value":"delete","label":"Delete User","icon":"trash-2"}
          ]'
        ></lex-dropdown-btn>
      </lex-banner>

      <lex-breadcrumb id="userBreadcrumb" items='[{"label":"Administration","href":"admin/index.html"},{"label":"User Management","href":"admin/users.html"},{"label":"Loading..."}]'></lex-breadcrumb>


      <!-- ================================================================
           Section 1: Profile Information
           ================================================================ -->
      <lex-card heading="Profile Information" style="margin-bottom:1.5rem;">
        <!-- 2-column KV grid -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem 2rem;">
          <lex-kv id="kvUsername"  label="Username"></lex-kv>
          <lex-kv id="kvRole"     label="Role"></lex-kv>
          <lex-kv id="kvStatus"   label="Status"></lex-kv>
          <lex-kv id="kvCreated"  label="Created"></lex-kv>
          <lex-kv id="kvLastLogin" label="Last Login"></lex-kv>
          <lex-kv id="kvOrgId"    label="Organization ID"></lex-kv>
        </div>

      </lex-card>


      <!-- ================================================================
           Section 2: Active Sessions
           ================================================================ -->
      <lex-card id="sessionsCard">

        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;">
          <h3 style="font-size:var(--lex-h4-size,1.125rem);font-weight:var(--lex-h4-weight,600);color:var(--lex-text-primary);margin:0;">Active Sessions</h3>
          <lex-btn id="revokeAllBtn" variant="danger" size="sm" icon="log-out">Revoke All Sessions</lex-btn>
        </div>

        <lex-table
          id="userSessionsTable"
          columns="device,ip_address,created_at,expires_at"
          labels="Device,IP Address,Created,Expires"
          empty-text="No active sessions"
          sort-by="created_at"
          sort-dir="desc"
        ></lex-table>

        <lex-pagination id="sessionsPagination" style="margin-top:1rem;"></lex-pagination>

      </lex-card>

    </main>


    <!-- ================================================================
         Edit User Modal
         hide-actions: the form has its own Save button so we suppress the
         modal footer. data-hoist: moved to document.body so it is not
         clipped by lex-content's overflow stacking context.
         ================================================================ -->
    <lex-modal
      id="userModal"
      heading="Edit User"
      size="md"
      hide-actions
      data-hoist
    >
      <lex-form id="userForm">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem;">
          <lex-input
            id="userFirstName"
            name="first_name"
            label="First Name"
            placeholder="Jane"
            required
          ></lex-input>
          <lex-input
            id="userLastName"
            name="last_name"
            label="Last Name"
            placeholder="Smith"
            required
          ></lex-input>
        </div>
        <lex-input
          id="userEmail"
          name="email"
          type="email"
          label="Email Address"
          placeholder="jane.smith@example.com"
          required
          style="margin-bottom:1rem;"
        ></lex-input>
        <lex-input
          id="userUsername"
          name="username"
          label="Username"
          placeholder="jsmith"
          required
          style="margin-bottom:1rem;"
        ></lex-input>
        <lex-select
          id="userRole"
          name="role_id"
          label="Role"
          placeholder="Select a role..."
          required
          options='[]'
          style="margin-bottom:1.25rem;"
        ></lex-select>
        <!-- Form footer: Cancel + Save buttons inside the form -->
        <div style="display:flex;justify-content:flex-end;gap:0.5rem;padding-top:0.75rem;border-top:1px solid var(--lex-border-subtle);">
          <lex-btn id="userModalCancelBtn" variant="secondary" size="md">Cancel</lex-btn>
          <lex-btn id="userModalSaveBtn"   variant="primary"   size="md" type="submit">Save</lex-btn>
        </div>
      </lex-form>
    </lex-modal>


    <!-- ================================================================
         Reset Password Modal
         hide-actions: the form has its own Reset button.
         data-hoist: same stacking context fix as above.
         ================================================================ -->
    <lex-modal
      id="resetPasswordModal"
      heading="Reset Password"
      size="sm"
      hide-actions
      data-hoist
    >
      <lex-form id="resetPasswordForm">
        <p class="lex-text-secondary" style="font-size:var(--lex-body-sm-size,0.875rem);margin-bottom:1rem;">
          Set a new temporary password for this user. They will be prompted to change it on next login.
        </p>
        <lex-input
          id="resetPasswordNew"
          name="new_password"
          type="password"
          label="New Password"
          placeholder="Minimum 8 characters"
          required
          style="margin-bottom:1rem;"
        ></lex-input>
        <lex-input
          id="resetPasswordConfirm"
          name="confirm_password"
          type="password"
          label="Confirm Password"
          placeholder="Re-enter new password"
          required
        ></lex-input>
        <div
          id="resetPasswordHint"
          class="lex-text-tertiary"
          style="font-size:var(--lex-body-xs-size,0.75rem);margin-top:0.5rem;margin-bottom:1.25rem;"
        ></div>
        <!-- Form footer -->
        <div style="display:flex;justify-content:flex-end;gap:0.5rem;padding-top:0.75rem;border-top:1px solid var(--lex-border-subtle);">
          <lex-btn id="resetPasswordCancelBtn" variant="secondary" size="md">Cancel</lex-btn>
          <lex-btn id="resetPasswordSubmitBtn" variant="danger"    size="md" type="submit">Reset Password</lex-btn>
        </div>
      </lex-form>
    </lex-modal>

  </template>

  <noscript>
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,sans-serif;color:#666;">
      Please enable JavaScript to use LANA AI.
    </div>
  </noscript>

  <!-- ══════════════════════════════════════════════════════════════════
       Scripts at end of body — HTML renders first, scripts load after
       ══════════════════════════════════════════════════════════════════ -->

  <!-- Universal shell scripts -->
  <script src="../js/error-reporter.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/time-utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/version.js"></script>
  <script src="../js/menu.js"></script>
  <script src="../js/navigation-helpers.js"></script>
  <script src="../js/new-project-modal.js"></script>
  <script src="../js/conversation-menu.js"></script>
  <script src="../js/conversation-search-modal.js"></script>
  <script src="../js/contact-search-modal.js"></script>
  <script src="../js/notifications.js"></script>

  <!-- Lex UI core -->
  <script src="../js/lex/lex.core.js"></script>
  <script src="../js/lex/lex.icons.js"></script>
  <script src="../js/lex/lex.data.js"></script>
  <script src="../js/lex/lex.forms.js"></script>
  <script src="../js/lex/lex.state.js"></script>
  <script src="../js/lex/lex.utils.js"></script>
  <script src="../js/lex/lex.auth.js"></script>
  <script src="../js/lex/lex-nav.js"></script>

  <!-- Lex UI foundation + layout -->
  <script src="../js/lex/components/foundation/lex-loader.js"></script>
  <script src="../js/lex/components/foundation/lex-toast.js"></script>
  <script src="../js/lex/components/foundation/lex-spinner.js"></script>
  <script src="../js/lex/components/foundation/lex-btn.js"></script>
  <script src="../js/lex/components/foundation/lex-empty.js"></script>
  <script src="../js/lex/components/form/lex-segmented.js"></script>
  <script src="../js/lex/components/layout/lex-sidebar.js"></script>
  <script src="../js/lex/components/layout/lex-topbar.js"></script>
  <script src="../js/lex/components/layout/lex-conversation-item.js"></script>
  <script src="../js/lex/components/layout/lex-notification-panel.js"></script>
  <script src="../js/lex/components/layout/lex-app.js"></script>

  <!-- Page-specific Lex components (BEFORE inject) -->
  <script src="../js/lex/components/foundation/lex-breadcrumb.js"></script>
  <script src="../js/lex/components/foundation/lex-banner.js"></script>
  <script src="../js/lex/components/foundation/lex-card.js"></script>
  <script src="../js/lex/components/foundation/lex-badge.js"></script>
  <script src="../js/lex/components/foundation/lex-text.js"></script>
  <script src="../js/lex/components/foundation/lex-stack.js"></script>
  <script src="../js/lex/components/foundation/lex-divider.js"></script>
  <script src="../js/lex/components/foundation/lex-kv.js"></script>
  <script src="../js/lex/components/foundation/lex-modal.js"></script>
  <script src="../js/lex/components/data/lex-table.js"></script>
  <script src="../js/lex/components/data/lex-pagination.js"></script>
  <script src="../js/lex/components/form/lex-form.js"></script>
  <script src="../js/lex/components/form/lex-input.js"></script>
  <script src="../js/lex/components/form/lex-select.js"></script>
  <script src="../js/lex/components/form/lex-dropdown-btn.js"></script>

  <!-- Inject page content + hoist modals -->
  <script src="../js/lex/lex-page-init.js"></script>

  <!-- Page controller -->
  <script src="../js/admin/admin-user-details.js"></script>

  <lex-lana-dock page-scope="dashboard" context-type="full_chat" placeholder="Ask LANA anything..." thread-title="LANA Chat"></lex-lana-dock>
  <!-- LANA dock (IDE-style docked chat panel) -->
  <script src="../js/lex/chat/lex-chat.format.js"></script>
  <script src="../js/lex/chat/lex-chat.conversations-api.js"></script>
  <script src="../js/lex/chat/lex-chat.source.js"></script>
  <script src="../js/lex/chat/lex-chat.message.js"></script>
  <script src="../js/lex/chat/lex-chat.activity.js"></script>
  <script src="../js/lex/chat/lex-chat.documents.js"></script>
  <script src="../js/lex/chat/lex-chat.composer-mentions.js"></script>
  <script src="../js/lex/chat/lex-chat.composer.js"></script>
  <script src="../js/lex/chat/lex-chat.thread.js"></script>
  <script src="../js/lex/chat/lex-chat.threads.js"></script>
  <script src="../js/lex/chat/lex-chat.js"></script>
  <script src="../js/lex/chat/lex-dynamic-card.renderer.js"></script>
  <script src="../js/lex/chat/lex-agentic-plan-card.js"></script>
  <script src="../js/lex/chat/lex-chat.index.js"></script>
  <script src="../js/lex/components/chat/lex-lana-panel.js"></script>
  <script src="../js/lex/components/layout/lex-lana-dock.js"></script>

  <!-- Auth guard + loader dismiss (MUST be last) -->
  <script src="../js/auth-guard.js"></script>
</body>
</html>
