<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Plans - LANA AI</title>

  <link rel="stylesheet" href="../css/lex-tokens.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin/task-plans.css">
  <link rel="stylesheet" href="../css/admin/admin-switcher.css">
  <link rel="stylesheet" href="../css/tailwind-output.css">
  <script src="../js/tailwind-loader.js"></script>
  <link rel="stylesheet" href="../css/lex-chat.css">
</head>
<body>

  <lex-loader theme="light"></lex-loader>

  <lex-app
    logo-src="../img/logo-light.png"
    logo-alt="LANA AI"
    logo-href="../dashboard.html"
    active-nav-id="admin-task-plans"
    page-title="Task Plans"
  ></lex-app>

  <template id="page-content">
    <main>
      <lex-banner
        variant="light"
        heading="Task Plans"
        subtitle="Create, review, and publish task/checklist plans"
      >
        <div class="task-plans-banner-actions">
          <lex-btn id="createTaskPlanBtn" variant="primary" leading-icon="plus">Create Plan</lex-btn>
        </div>
      </lex-banner>

      <lex-breadcrumb items='[{"label":"Administration","href":"admin/index.html"},{"label":"Task Plans"}]'></lex-breadcrumb>

      <section id="taskPlansUnavailable" class="task-plans-unavailable hidden">
        <lex-empty
          icon="document"
          message="Task plan service unavailable"
          description="The backend task-plan API is not available in this environment."
        ></lex-empty>
      </section>

      <section id="taskPlansWorkspace" class="task-plans-workspace">
        <lex-card heading="Plans" subtitle="Backend-owned draft and published plans">
          <div id="taskPlansList" class="task-plans-list" aria-live="polite"></div>
        </lex-card>

        <lex-card id="taskPlanDetailCard" heading="Plan Details" subtitle="Select a plan to review">
          <div id="taskPlanDetail" class="task-plan-detail">
            <lex-empty
              icon="document"
              message="No plan selected"
              description="Choose a task plan from the list."
            ></lex-empty>
          </div>
        </lex-card>
      </section>
    </main>

    <lex-modal
      id="taskPlanModal"
      heading="Create Task Plan"
      size="lg"
      hide-actions
      data-hoist
    >
      <lex-form id="taskPlanForm">
        <div class="task-plan-form-grid">
          <lex-input
            id="taskPlanTitle"
            name="title"
            label="Title"
            placeholder="New client onboarding"
            required
          ></lex-input>
          <lex-select
            id="taskPlanType"
            name="source_type"
            label="Plan Type"
            placeholder="Select type"
            options='[{"value":"manual","label":"Manual Draft"},{"value":"lana_draft","label":"Lana Draft"}]'
          ></lex-select>
          <div class="task-plan-scope-field task-plan-picker-field">
            <label class="task-plan-picker-label" for="taskPlanMatterPickBtn">
              Matter / Workspace Scope <span class="task-plan-picker-optional">(optional)</span>
            </label>
            <button
              type="button"
              id="taskPlanMatterPickBtn"
              class="task-plan-picker-trigger"
              aria-haspopup="dialog"
            >
              <span id="taskPlanMatterPickLabel" class="task-plan-picker-trigger__label is-placeholder">
                None — applies to your organization
              </span>
              <span class="task-plan-picker-trigger__hint" aria-hidden="true">Browse</span>
            </button>
            <input type="hidden" id="taskPlanMatterId" name="matter_id" />
          </div>
          <lex-select
            id="taskPlanTargetType"
            name="target_type"
            label="Assign To"
            options='[{"value":"unassigned","label":"Unassigned / Org-level"},{"value":"user","label":"Individual User"},{"value":"organization","label":"Entire Organization"}]'
          ></lex-select>
          <lex-select
            id="taskPlanTargetUserId"
            name="target_user_id"
            label="User"
            placeholder="Select user"
            searchable
            class="hidden"
            options="[]"
          ></lex-select>
        </div>

        <lex-textarea
          id="taskPlanDescription"
          name="description"
          label="Description"
          placeholder="Purpose and scope for this task plan"
          rows="3"
          auto-resize
        ></lex-textarea>

        <lex-textarea
          id="taskPlanInstructions"
          name="draft_instructions"
          label="Draft Notes"
          placeholder="Optional notes for the backend draft/review workflow"
          rows="4"
          auto-resize
        ></lex-textarea>

        <div class="task-plan-modal-actions">
          <lex-btn id="taskPlanCancelBtn" variant="secondary" size="md">Cancel</lex-btn>
          <lex-btn id="taskPlanSaveBtn" variant="primary" size="md" type="submit">Create Draft</lex-btn>
        </div>
      </lex-form>
    </lex-modal>

    <lex-modal
      id="taskPlanItemModal"
      heading="Plan Item"
      size="md"
      hide-actions
      data-hoist
    >
      <lex-form id="taskPlanItemForm">
        <h3 id="taskPlanItemHeading" class="task-plan-modal-heading">Add Plan Item</h3>
        <div class="task-plan-form-grid">
          <lex-input
            id="taskPlanItemMatterId"
            name="matter_id"
            label="Matter / Workspace Scope"
            placeholder="Optional matter or workspace ID"
          ></lex-input>
          <lex-select
            id="taskPlanItemPriority"
            name="priority"
            label="Priority"
            options='[{"value":"low","label":"Low"},{"value":"normal","label":"Normal"},{"value":"medium","label":"Medium"},{"value":"high","label":"High"}]'
          ></lex-select>
          <lex-select
            id="taskPlanItemAssignee"
            name="assigned_to_user_id"
            label="Assign Item To"
            placeholder="Optional assignee"
            searchable
            clearable
            options="[]"
          ></lex-select>
        </div>
        <lex-input
          id="taskPlanItemTitle"
          name="title"
          label="Title"
          required
        ></lex-input>
        <lex-textarea
          id="taskPlanItemDescription"
          name="description"
          label="Description"
          rows="3"
          auto-resize
        ></lex-textarea>
        <lex-input
          id="taskPlanItemDueDate"
          name="due_date"
          label="Due Date"
          type="date"
        ></lex-input>
        <div class="task-plan-modal-actions">
          <lex-btn id="taskPlanItemCancelBtn" variant="secondary" size="md">Cancel</lex-btn>
          <lex-btn id="taskPlanItemSaveBtn" variant="primary" size="md" type="submit">Save Item</lex-btn>
        </div>
      </lex-form>
    </lex-modal>
  </template>

  <noscript>
    <div class="task-plans-noscript">Please enable JavaScript to use LANA AI.</div>
  </noscript>

  <script src="../js/error-reporter.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/time-utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/version.js"></script>
  <script src="../js/menu.js"></script>
  <script src="../js/navigation-helpers.js"></script>
  <script src="../js/new-project-modal.js"></script>
  <script src="../js/conversation-menu.js"></script>
  <script src="../js/conversation-search-modal.js"></script>
  <script src="../js/contact-search-modal.js"></script>
  <script src="../js/notifications.js"></script>

  <script src="../js/lex/lex.core.js"></script>
  <script src="../js/lex/lex.icons.js"></script>
  <script src="../js/lex/lex.data.js"></script>
  <script src="../js/lex/lex.forms.js"></script>
  <script src="../js/lex/lex.state.js"></script>
  <script src="../js/lex/lex.utils.js"></script>
  <script src="../js/lex/lex.auth.js"></script>
  <script src="../js/lex/lex-nav.js"></script>

  <script src="../js/lex/components/foundation/lex-loader.js"></script>
  <script src="../js/lex/components/foundation/lex-toast.js"></script>
  <script src="../js/lex/components/foundation/lex-spinner.js"></script>
  <script src="../js/lex/components/foundation/lex-btn.js"></script>
  <script src="../js/lex/components/foundation/lex-empty.js"></script>
  <script src="../js/lex/components/form/lex-segmented.js"></script>
  <script src="../js/lex/components/layout/lex-sidebar.js"></script>
  <script src="../js/lex/components/layout/lex-topbar.js"></script>
  <script src="../js/lex/components/layout/lex-conversation-item.js"></script>
  <script src="../js/lex/components/layout/lex-notification-panel.js"></script>
  <script src="../js/lex/components/layout/lex-app.js"></script>

  <script src="../js/lex/components/foundation/lex-breadcrumb.js"></script>
  <script src="../js/lex/components/foundation/lex-banner.js"></script>
  <script src="../js/lex/components/foundation/lex-card.js"></script>
  <script src="../js/lex/components/foundation/lex-badge.js"></script>
  <script src="../js/lex/components/foundation/lex-modal.js"></script>
  <script src="../js/lex/components/form/lex-form.js"></script>
  <script src="../js/lex/components/form/lex-input.js"></script>
  <script src="../js/lex/components/form/lex-select.js"></script>
  <script src="../js/lex/components/form/lex-textarea.js"></script>

  <script src="../js/lex/lex-page-init.js"></script>
  <script src="../js/admin/admin-switcher.js"></script>
  <script src="../js/admin/task-plans.js"></script>
  <script src="../js/auth-guard.js"></script>
  <lex-lana-dock page-scope="dashboard" context-type="full_chat" placeholder="Ask LANA anything..." thread-title="LANA Chat"></lex-lana-dock>
  <!-- LANA dock (IDE-style docked chat panel) -->
  <script src="../js/lex/chat/lex-chat.format.js"></script>
  <script src="../js/lex/chat/lex-chat.source.js"></script>
  <script src="../js/lex/chat/lex-chat.message.js"></script>
  <script src="../js/lex/chat/lex-chat.activity.js"></script>
  <script src="../js/lex/chat/lex-chat.documents.js"></script>
  <script src="../js/lex/chat/lex-chat.composer-mentions.js"></script>
  <script src="../js/lex/chat/lex-chat.composer.js"></script>
  <script src="../js/lex/chat/lex-chat.thread.js"></script>
  <script src="../js/lex/chat/lex-chat.threads.js"></script>
  <script src="../js/lex/chat/lex-chat.js"></script>
  <script src="../js/lex/chat/lex-dynamic-card.renderer.js"></script>
  <script src="../js/lex/chat/lex-agentic-plan-card.js"></script>
  <script src="../js/lex/chat/lex-chat.index.js"></script>
  <script src="../js/lex/components/chat/lex-lana-panel.js"></script>
  <script src="../js/lex/components/layout/lex-lana-dock.js"></script>
</body>
</html>
