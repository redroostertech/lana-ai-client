<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Backend Updates - LANA AI</title>

  <!-- ── CSS + Tailwind in head — behavioral scripts at end of body ── -->
  <link rel="stylesheet" href="../css/lex-tokens.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin/admin-switcher.css">
  <link rel="stylesheet" href="../css/tailwind-output.css">
  <script src="../js/tailwind-loader.js"></script>

</head>
<body>

  <!-- Branded loader — shows once lex-loader.js upgrades the element -->
  <lex-loader theme="light"></lex-loader>

  <!-- App shell -->
  <lex-app
    logo-src="../img/logo-light.png"
    logo-alt="LANA AI"
    logo-href="../dashboard.html"
    active-nav-id="admin"
    page-title="Backend Updates"
  ></lex-app>

  <!-- Page content as inert <template> -->
  <template id="page-content">

    <main class="p-4 lg:p-8">

      <!-- Page header -->
      <lex-banner
        id="updatesBanner"
        variant="light"
        heading="Backend Updates"
        subtitle="Review and apply backend updates for this deployment"
      >
        <div id="updateStatusBadge"></div>
      </lex-banner>

      <lex-breadcrumb items='[{"label":"Administration","href":"admin/index.html"},{"label":"Backend Updates"}]'></lex-breadcrumb>

      <!-- Mandatory update banner (shown by JS only when mandatory) -->
      <div id="mandatoryBanner" class="hidden mb-6">
        <lex-banner
          variant="light"
          status="warning"
          heading="A required backend update is available"
          subtitle="This update is mandatory. Apply it to keep this deployment supported."
        ></lex-banner>
      </div>

      <!-- Version + status -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">

        <lex-card id="versionCard" heading="Deployment Version">
          <div class="grid grid-cols-2 gap-3">
            <lex-kv id="kvCurrentVersion" label="Current Version" value="--"></lex-kv>
            <lex-kv id="kvLatestVersion"  label="Latest Version"  value="--"></lex-kv>
            <lex-kv id="kvUpdateStatus"   label="Status"          value="--"></lex-kv>
            <lex-kv id="kvDeliveryMode"   label="Delivery"        value="--"></lex-kv>
          </div>

          <!-- Action row -->
          <div class="mt-6 flex items-center gap-3" data-slot="footer">
            <lex-btn id="applyBtn" variant="success" leading-icon="download" disabled>Apply Update</lex-btn>
            <span id="applyHint" class="text-xs lex-text-secondary"></span>
          </div>
        </lex-card>

        <lex-card id="releaseNotesCard" heading="Release Notes">
          <style>
            .release-notes ul, .release-notes ol { list-style: revert; padding-left: 1.25rem; margin: 0.25rem 0; }
            .release-notes li { margin: 0.15rem 0; }
            .release-notes p { margin: 0.4rem 0; }
            .release-notes h1, .release-notes h2, .release-notes h3 { font-weight: 600; margin: 0.5rem 0 0.25rem; color: var(--lex-text-primary, inherit); }
            .release-notes strong { font-weight: 600; }
            .release-notes code { font-family: ui-monospace, monospace; font-size: 0.85em; }
          </style>
          <div id="releaseNotes" class="text-sm lex-text-secondary release-notes">No release notes available.</div>
        </lex-card>

      </div>

      <!-- Update progress / result (shown by JS during + after an apply) -->
      <lex-card id="progressCard" heading="Update Progress" class="hidden mb-6">
        <div class="flex items-center gap-3">
          <lex-spinner id="progressSpinner" size="sm" class="hidden"></lex-spinner>
          <div id="progressBadge"></div>
          <span id="progressMessage" class="text-sm lex-text-primary">--</span>
        </div>
      </lex-card>

      <!-- Refresh -->
      <div class="flex items-center gap-3">
        <lex-btn id="refreshBtn" variant="secondary" leading-icon="refresh-cw">Refresh</lex-btn>
        <span id="lastUpdatedText" class="text-xs lex-text-secondary"></span>
      </div>

    </main>

  </template>

  <noscript>
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,sans-serif;color:#666;">
      Please enable JavaScript to use LANA AI.
    </div>
  </noscript>

  <!-- ══════════════════════════════════════════════════════════════════
       Scripts at end of body — HTML renders first, scripts load after
       ══════════════════════════════════════════════════════════════════ -->

  <!-- Universal shell scripts -->
  <script src="../js/error-reporter.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/version.js"></script>
  <script src="../js/menu.js"></script>
  <script src="../js/navigation-helpers.js"></script>
  <script src="../js/new-project-modal.js"></script>
  <script src="../js/conversation-menu.js"></script>
  <script src="../js/conversation-search-modal.js"></script>
  <script src="../js/contact-search-modal.js"></script>
  <script src="../js/notifications.js"></script>

  <!-- Lex UI core -->
  <script src="../js/lex/lex.core.js"></script>
  <script src="../js/lex/lex.icons.js"></script>
  <script src="../js/lex/lex.data.js"></script>
  <script src="../js/lex/lex.forms.js"></script>
  <script src="../js/lex/lex.state.js"></script>
  <script src="../js/lex/lex.utils.js"></script>
  <script src="../js/lex/lex.auth.js"></script>
  <script src="../js/lex/lex-nav.js"></script>

  <!-- Lex UI foundation + layout -->
  <script src="../js/lex/components/foundation/lex-loader.js"></script>
  <script src="../js/lex/components/foundation/lex-toast.js"></script>
  <script src="../js/lex/components/foundation/lex-spinner.js"></script>
  <script src="../js/lex/components/foundation/lex-btn.js"></script>
  <script src="../js/lex/components/foundation/lex-empty.js"></script>
  <script src="../js/lex/components/form/lex-segmented.js"></script>
  <script src="../js/lex/components/layout/lex-sidebar.js"></script>
  <script src="../js/lex/components/layout/lex-topbar.js"></script>
  <script src="../js/lex/components/layout/lex-conversation-item.js"></script>
  <script src="../js/lex/components/layout/lex-notification-panel.js"></script>
  <script src="../js/lex/components/layout/lex-app.js"></script>

  <!-- Page-specific Lex components (BEFORE inject) -->
  <script src="../js/lex/components/foundation/lex-breadcrumb.js"></script>
  <script src="../js/lex/components/foundation/lex-banner.js"></script>
  <script src="../js/lex/components/foundation/lex-card.js"></script>
  <script src="../js/lex/components/foundation/lex-badge.js"></script>
  <script src="../js/lex/components/foundation/lex-kv.js"></script>
  <script src="../js/lex/components/foundation/lex-modal.js"></script>
  <!-- Required by admin-switcher.js — it renders the admin page dropdown as a
       <lex-select> and bails silently if this element isn't registered. -->
  <script src="../js/lex/components/form/lex-select.js"></script>

  <!-- Inject page content + hoist modals -->
  <script src="../js/lex/lex-page-init.js"></script>
  <script src="../js/admin/admin-switcher.js"></script>

  <!-- Shared markdown evaluator (Lex.Markdown wraps vendored marked) for release notes -->
  <script src="../js/vendor/marked.min.js"></script>
  <script src="../js/lex/lex.markdown.js"></script>

  <!-- Page controller -->
  <script src="../js/admin/admin-updates.js"></script>

  <!-- Auth guard + loader dismiss (MUST be last) -->
  <script src="../js/auth-guard.js"></script>
</body>
</html>
