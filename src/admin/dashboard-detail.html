<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Detail - LANA AI</title>

  <script src="../js/lex/lex.theme.js"></script>
  <link rel="stylesheet" href="../css/lex-tokens.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/tailwind-output.css">
  <link rel="stylesheet" href="../css/admin/insights-dashboard.css">
  <link rel="stylesheet" href="../css/title-switcher.css">
  <link rel="stylesheet" href="../css/detail-page.css">
  <link rel="stylesheet" href="../css/lex-motion.css">
  <link rel="stylesheet" href="../css/mini-charts.css">
  <link rel="stylesheet" href="../css/setup-banner.css">
  <script src="../js/tailwind-loader.js"></script>
  <link rel="stylesheet" href="../css/lex-chat.css">
  <!-- target="_blank" links open through the guarded channel (js/shared/external-links.js). -->
  <script src="../js/shared/external-links.js"></script>
</head>
<body>
  <lex-loader theme="light"></lex-loader>

  <lex-app
    logo-src="../img/logo-light.png"
    logo-alt="LANA AI"
    logo-href="../dashboard.html"
    active-nav-id="insights-dashboards"
    page-title="Dashboard"
  ></lex-app>

  <template id="page-content">
    <main>
      <!-- One header: greeting, the dashboard's title and actions, the
           Insights mark and the date-range control. The breadcrumb sits under it. -->
      <header class="dash-header">
        <!-- "Learn More" in the banner opens this: the dashboard's story. -->
        <div id="dashboardStoryPanel" class="dash-story__panel" role="dialog" aria-label="About this dashboard" hidden>
          <p class="dash-story__heading">About this dashboard</p>
          <div id="dashboardStoryBody" class="dash-story__body"></div>
        </div>
        <div class="dash-header__main">
          <!-- Insights brand animation: plays once on load, first frame under Reduce Motion. -->
          <lex-brand-mark id="dashboardHeaderMark" class="dash-header__mark" animation="chart" size="48" once></lex-brand-mark>
          <div class="dash-header__titles">
            <p id="dashboardGreeting" class="dash-header__greeting" hidden></p>
            <lex-banner
              id="dashboardDetailBanner"
              class="dash-header__banner detail-banner detail-banner--no-actions"
              variant="light"
              size="compact"
              heading="Dashboard"
              subtitle="Role-aware metric cards backed by the report module metric catalog"
              max-actions="1"
              lana
              lana-context-type="full_chat"
            >
              <lex-btn id="dashboardLearnMoreBtn" variant="secondary" size="sm" aria-haspopup="dialog" aria-controls="dashboardStoryPanel">Learn More</lex-btn>
              <button id="editDashboardBtn" type="button" role="menuitem">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                Edit
              </button>
              <button id="deleteDashboardBtn" type="button" role="menuitem" data-variant="danger">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6M1 7h22M9 7V4a2 2 0 012-2h2a2 2 0 012 2v3"/></svg>
                Delete
              </button>
            </lex-banner>
          </div>
        </div>
        <!-- Under the title: the date pill (left-aligned with the title text), then the counts. -->
        <div class="dash-header__bar">
          <div class="dash-period">
            <lex-brand-mark id="dashboardPeriodLoading" class="dash-period__loading" animation="spinner" size="24" label="Loading the numbers" hidden></lex-brand-mark>
            <button id="dashboardPeriodToggle" class="dash-period__toggle" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="dashboardPeriodPanel">
              <svg class="dash-period__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
              <span id="dashboardPeriodLabel" class="dash-period__label">Dates</span>
              <svg class="dash-period__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <div id="dashboardPeriodPanel" class="dash-period__panel" role="dialog" aria-label="Choose the dates" hidden>
              <section class="detail-period-card" aria-labelledby="dashboardPeriodHeading">
              <div class="detail-period-card__presets">
              <p class="detail-period-card__label" id="dashboardPeriodHeading">Quick picks</p>
              <div id="dashboardPeriodPresets" class="detail-period-card__buttons">
                <lex-btn data-dashboard-preset="last7days" variant="secondary" size="sm">Last 7 Days</lex-btn>
                <lex-btn data-dashboard-preset="last30days" variant="secondary" size="sm">Last 30 Days</lex-btn>
                <lex-btn data-dashboard-preset="thisMonth" variant="secondary" size="sm">This Month</lex-btn>
                <lex-btn data-dashboard-preset="lastMonth" variant="secondary" size="sm">Last Month</lex-btn>
                <lex-btn data-dashboard-preset="thisQuarter" variant="secondary" size="sm">This Quarter</lex-btn>
                <lex-btn data-dashboard-preset="thisYear" variant="secondary" size="sm">This Year</lex-btn>
                <lex-btn data-dashboard-preset="lastYear" variant="secondary" size="sm">Last Year</lex-btn>
              </div>
              </div>
              <div class="detail-period-card__fields">
                <lex-input id="dashboardPeriodStart" label="Start Date" type="date" name="dashboardPeriodStart"></lex-input>
                <lex-input id="dashboardPeriodEnd" label="End Date" type="date" name="dashboardPeriodEnd"></lex-input>
                <lex-select
                  id="dashboardPeriodType"
                  label="Compare By"
                  name="dashboardPeriodType"
                  value="monthly"
                  options='[{"value":"daily","label":"Daily"},{"value":"weekly","label":"Weekly"},{"value":"monthly","label":"Monthly"},{"value":"quarterly","label":"Quarterly"},{"value":"yearly","label":"Yearly"}]'
                ></lex-select>
              </div>
              </section>
            </div>
          </div>
          <div class="dash-header__about">
            <div id="dashboardViewContext" class="dash-header__meta"></div>
          </div>
        </div>
      </header>

      <lex-breadcrumb id="dashboardDetailBreadcrumb" class="dash-crumbs"></lex-breadcrumb>
      <!-- "Finish your setup" when case or appointment types are not mapped yet (setup-banner.js). -->
      <div id="lanaSetupBanner" class="lana-setup-banner-slot" hidden></div>
      <p id="dashboardFallbackNote" class="dash-fallback-note" role="status" hidden></p>

      <section class="dash-detail-content">
        <div class="dash-tabs-row">
          <div id="dashboardTypeFilters" class="dash-tabs" role="tablist" aria-label="Metric types"></div>
          <label class="dash-tabs-row__search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path></svg>
            <input id="dashboardMetricSearch" type="search" placeholder="Search cards..." autocomplete="off" aria-label="Search cards">
          </label>
        </div>
        <div id="dashboardMetricGrid" class="dash-bento"></div>
        <lex-empty id="dashboardMetricEmpty" message="No metrics found" description="This dashboard view does not have cataloged metrics yet" icon="chart" hidden></lex-empty>
      </section>

      <div id="dashboardMetricModal" class="dash-metric-modal" role="dialog" aria-modal="true" aria-labelledby="dashboardMetricModalTitle" hidden>
        <div class="dash-metric-modal__backdrop" data-dashboard-modal-close></div>
        <section class="dash-metric-modal__panel">
          <div class="dash-metric-modal__header">
            <div>
              <div class="dash-metric-modal__eyebrow" id="dashboardMetricModalEyebrow"></div>
              <h2 class="dash-metric-modal__title" id="dashboardMetricModalTitle"></h2>
            </div>
            <button class="dash-metric-modal__close" type="button" aria-label="Close" data-dashboard-modal-close>&times;</button>
          </div>
          <div class="dash-metric-modal__body" id="dashboardMetricModalBody"></div>
        </section>
      </div>
    </main>
  </template>

  <noscript><div class="lex-noscript-message">Please enable JavaScript to use LANA AI.</div></noscript>

  <script src="../js/error-reporter.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/time-utils.js"></script>
  <script src="../js/shared/request-retry.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/version.js"></script>
  <script src="../js/menu.js"></script>
  <script src="../js/navigation-helpers.js"></script>
  <script src="../js/conversation-search-modal.js"></script>
  <script src="../js/contact-search-modal.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/lex/lex.core.js"></script>
  <script src="../js/lex/lex.icons.js"></script>
  <script src="../js/lex/lex.data.js"></script>
  <script src="../js/lex/lex.forms.js"></script>
  <script src="../js/lex/lex.state.js"></script>
  <script src="../js/lex/lex.utils.js"></script>
  <script src="../js/lex/lex.auth.js"></script>
  <script src="../js/lex/lex-nav.js"></script>
  <script src="../js/lex/components/foundation/lex-loader.js"></script>
  <script src="../js/lex/components/foundation/lex-toast.js"></script>
  <script src="../js/lex/components/foundation/lex-spinner.js"></script>
  <script src="../js/lex/components/foundation/lex-btn.js"></script>
  <script src="../js/lex/components/foundation/lex-empty.js"></script>
  <script src="../js/lex/components/form/lex-input.js"></script>
  <script src="../js/lex/components/form/lex-select.js"></script>
  <script src="../js/lex/components/form/lex-segmented.js"></script>
  <script src="../js/lex/components/layout/lex-sidebar.js"></script>
  <script src="../js/lex/components/layout/lex-topbar.js"></script>
  <script src="../js/lex/components/layout/lex-conversation-item.js"></script>
  <script src="../js/lex/components/layout/lex-notification-panel.js"></script>
  <script src="../js/lex/components/layout/lex-app.js"></script>
  <script src="../js/lex/components/foundation/lex-breadcrumb.js"></script>
  <script src="../js/lex/components/foundation/lex-banner.js"></script>
  <script src="../js/lex/lex-page-init.js"></script>
  <script src="../js/shared/current-pipeline-presentation.js"></script>
  <script src="../js/shared/acquisition-source-presentation.js"></script>
  <script src="../js/vendor/lottie_light.min.js"></script>
  <script src="../js/lex/brand/lex-brand-animations.js"></script>
  <script src="../js/lex/components/foundation/lex-brand-mark.js"></script>
  <script src="../js/dashboard/metric-goal-comparison.js"></script>
  <script src="../js/shared/data-state.js"></script>
  <script src="../js/shared/dashboard-tiles.js"></script>
  <script src="../js/shared/dashboard-period.js"></script>
  <script src="../js/shared/load-state.js"></script>
  <script src="../js/shared/metric-card-view.js"></script>
  <script src="../js/shared/mini-charts.js"></script>
  <script src="../js/shared/dashboard-layout.js"></script>
  <script src="../js/shared/dashboard-cards.js"></script>
  <script src="../js/shared/card-visuals.js"></script>
  <script src="../js/shared/lineage-view.js"></script>
  <script src="../js/shared/insights-breadcrumbs.js"></script>
  <script src="../js/settings-mappings.model.js"></script>
  <script src="../js/shared/setup-banner.js"></script>
  <script src="../js/shared/title-switcher.js"></script>
  <script src="../js/admin/dashboard-detail.js"></script>
  <script src="../js/auth-guard.js"></script>

  <script src="../js/shared/safe-url.js"></script>

  <script src="../js/lex/chat/lex-chat.documents.js"></script>
  <script src="../js/lex/chat/lex-chat.composer-mentions.js"></script>
  <script src="../js/services/slash-commands.service.js"></script>
  <script src="../js/lex/chat/lex-chat.composer-slash.js"></script>
  <script src="../js/lex/chat/lex-chat.composer.js"></script>
  <script src="../js/lex/chat/lex-chat.thread.js"></script>
  <script src="../js/lex/chat/lex-chat.threads.js"></script>
  <script src="../js/lex/chat/lex-chat.js"></script>
  <script src="../js/lex/chat/lex-dynamic-card.renderer.js"></script>
  <script src="../js/lex/chat/lex-agentic-plan-card.js"></script>
  <script src="../js/lex/chat/lex-chat.index.js"></script>

</body>
</html>
