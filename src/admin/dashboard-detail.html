<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Detail - LANA AI</title>

  <link rel="stylesheet" href="../css/lex-tokens.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/tailwind-output.css">
  <link rel="stylesheet" href="../css/admin/insights-dashboard.css">
  <script src="../js/tailwind-loader.js"></script>
  <link rel="stylesheet" href="../css/lex-chat.css">
</head>
<body>
  <lex-loader theme="light"></lex-loader>

  <lex-app
    logo-src="../img/logo-light.png"
    logo-alt="LANA AI"
    logo-href="../dashboard.html"
    active-nav-id="insights-dashboard"
    page-title="Dashboard"
  ></lex-app>

  <template id="page-content">
    <main>
      <lex-banner
        id="dashboardDetailBanner"
        class="dashboard-detail-banner dashboard-detail-banner--no-actions"
        variant="light"
        heading="Dashboard"
        subtitle="Role-aware metric cards backed by the report module metric catalog"
        max-actions="1"
        lana
        lana-context-type="full_chat"
      >
        <lex-btn id="openReportingBtn" variant="secondary" size="sm">Open Reports</lex-btn>
        <button id="editDashboardBtn" type="button" role="menuitem">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
          Edit
        </button>
        <button id="deleteDashboardBtn" type="button" role="menuitem" data-variant="danger">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6M1 7h22M9 7V4a2 2 0 012-2h2a2 2 0 012 2v3"/></svg>
          Delete
        </button>
      </lex-banner>

      <lex-breadcrumb id="dashboardDetailBreadcrumb"></lex-breadcrumb>

      <section class="dash-detail-content">
        <div id="dashboardViewContext" class="dash-view-context"></div>
        <section class="dash-period-card" aria-labelledby="dashboardPeriodHeading">
          <div class="dash-period-card__presets">
            <p class="dash-period-card__label" id="dashboardPeriodHeading">Quick Select Period</p>
            <div id="dashboardPeriodPresets" class="dash-period-card__buttons">
              <lex-btn data-dashboard-preset="last7days" variant="secondary" size="sm">Last 7 Days</lex-btn>
              <lex-btn data-dashboard-preset="last30days" variant="secondary" size="sm">Last 30 Days</lex-btn>
              <lex-btn data-dashboard-preset="thisMonth" variant="secondary" size="sm">This Month</lex-btn>
              <lex-btn data-dashboard-preset="lastMonth" variant="secondary" size="sm">Last Month</lex-btn>
              <lex-btn data-dashboard-preset="thisQuarter" variant="secondary" size="sm">This Quarter</lex-btn>
              <lex-btn data-dashboard-preset="thisYear" variant="secondary" size="sm">This Year</lex-btn>
              <lex-btn data-dashboard-preset="lastYear" variant="secondary" size="sm">Last Year</lex-btn>
            </div>
          </div>

          <div class="dash-period-card__fields">
            <lex-input id="dashboardPeriodStart" label="Start Date" type="date" name="dashboardPeriodStart"></lex-input>
            <lex-input id="dashboardPeriodEnd" label="End Date" type="date" name="dashboardPeriodEnd"></lex-input>
            <lex-select
              id="dashboardPeriodType"
              label="Compare By"
              name="dashboardPeriodType"
              value="monthly"
              options='[{"value":"daily","label":"Daily"},{"value":"weekly","label":"Weekly"},{"value":"monthly","label":"Monthly"},{"value":"quarterly","label":"Quarterly"},{"value":"yearly","label":"Yearly"}]'
            ></lex-select>
          </div>
        </section>
        <div class="dash-browser">
          <aside class="dash-browser__rail" aria-label="Dashboard metric filters">
            <div class="dash-browser__rail-title">Types</div>
            <div class="dash-browser__search">
              <span class="dash-browser__search-icon" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="11" cy="11" r="8"></circle>
                  <path d="m21 21-4.35-4.35"></path>
                </svg>
              </span>
              <input id="dashboardMetricSearch" type="search" placeholder="Search cards..." autocomplete="off">
            </div>
            <div id="dashboardTypeFilters" class="dash-browser__filters"></div>
          </aside>
          <div class="dash-browser__content">
            <div id="dashboardMetricGrid" class="dash-card-grid"></div>
          </div>
        </div>
        <lex-empty id="dashboardMetricEmpty" message="No metrics found" description="This dashboard view does not have cataloged metrics yet" icon="chart" hidden></lex-empty>
      </section>

      <div id="dashboardMetricModal" class="dash-metric-modal" role="dialog" aria-modal="true" aria-labelledby="dashboardMetricModalTitle" hidden>
        <div class="dash-metric-modal__backdrop" data-dashboard-modal-close></div>
        <section class="dash-metric-modal__panel">
          <div class="dash-metric-modal__header">
            <div>
              <div class="dash-metric-modal__eyebrow" id="dashboardMetricModalEyebrow"></div>
              <h2 class="dash-metric-modal__title" id="dashboardMetricModalTitle"></h2>
            </div>
            <button class="dash-metric-modal__close" type="button" aria-label="Close" data-dashboard-modal-close>&times;</button>
          </div>
          <div class="dash-metric-modal__body" id="dashboardMetricModalBody"></div>
        </section>
      </div>
    </main>
  </template>

  <noscript><div class="lex-noscript-message">Please enable JavaScript to use LANA AI.</div></noscript>

  <script src="../js/error-reporter.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/time-utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/version.js"></script>
  <script src="../js/menu.js"></script>
  <script src="../js/navigation-helpers.js"></script>
  <script src="../js/conversation-search-modal.js"></script>
  <script src="../js/contact-search-modal.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/lex/lex.core.js"></script>
  <script src="../js/lex/lex.icons.js"></script>
  <script src="../js/lex/lex.data.js"></script>
  <script src="../js/lex/lex.forms.js"></script>
  <script src="../js/lex/lex.state.js"></script>
  <script src="../js/lex/lex.utils.js"></script>
  <script src="../js/lex/lex.auth.js"></script>
  <script src="../js/lex/lex-nav.js"></script>
  <script src="../js/lex/components/foundation/lex-loader.js"></script>
  <script src="../js/lex/components/foundation/lex-toast.js"></script>
  <script src="../js/lex/components/foundation/lex-spinner.js"></script>
  <script src="../js/lex/components/foundation/lex-btn.js"></script>
  <script src="../js/lex/components/foundation/lex-empty.js"></script>
  <script src="../js/lex/components/form/lex-input.js"></script>
  <script src="../js/lex/components/form/lex-select.js"></script>
  <script src="../js/lex/components/form/lex-segmented.js"></script>
  <script src="../js/lex/components/layout/lex-sidebar.js"></script>
  <script src="../js/lex/components/layout/lex-topbar.js"></script>
  <script src="../js/lex/components/layout/lex-conversation-item.js"></script>
  <script src="../js/lex/components/layout/lex-notification-panel.js"></script>
  <script src="../js/lex/components/layout/lex-app.js"></script>
  <script src="../js/lex/components/foundation/lex-breadcrumb.js"></script>
  <script src="../js/lex/components/foundation/lex-banner.js"></script>
  <script src="../js/lex/lex-page-init.js"></script>
  <script src="../js/admin/dashboard-detail.js"></script>
  <script src="../js/auth-guard.js"></script>
  <lex-lana-dock page-scope="dashboard" context-type="full_chat" placeholder="Ask LANA anything..." thread-title="LANA Chat"></lex-lana-dock>
  <!-- LANA dock (IDE-style docked chat panel) -->
  <script src="../js/lex/chat/lex-chat.format.js"></script>
  <script src="../js/lex/chat/lex-chat.conversations-api.js"></script>
  <script src="../js/lex/chat/lex-chat.source.js"></script>
  <script src="../js/lex/chat/lex-chat.message.js"></script>
  <script src="../js/lex/chat/lex-chat-progress-events.js"></script>
  <script src="../js/lex/chat/lex-chat.activity.js"></script>
  <script src="../js/lex/chat/lex-chat.documents.js"></script>
  <script src="../js/lex/chat/lex-chat.composer-mentions.js"></script>
  <script src="../js/services/slash-commands.service.js"></script>
  <script src="../js/lex/chat/lex-chat.composer-slash.js"></script>
  <script src="../js/lex/chat/lex-chat.composer.js"></script>
  <script src="../js/lex/chat/lex-chat.thread.js"></script>
  <script src="../js/lex/chat/lex-chat.threads.js"></script>
  <script src="../js/lex/chat/lex-chat.js"></script>
  <script src="../js/lex/chat/lex-dynamic-card.renderer.js"></script>
  <script src="../js/lex/chat/lex-agentic-plan-card.js"></script>
  <script src="../js/lex/chat/lex-chat.index.js"></script>
  <script src="../js/lex/components/chat/lex-lana-panel.js"></script>
  <script src="../js/lex/components/layout/lex-lana-dock.js"></script>
</body>
</html>
