<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration - LANA AI</title>

  <!-- ── CSS + Tailwind in head — behavioral scripts at end of body ── -->
  <link rel="stylesheet" href="../css/lex-tokens.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/tailwind-output.css">
  <script src="../js/tailwind-loader.js"></script>

</head>
<body>

  <!-- Branded loader — shows once lex-loader.js upgrades the element -->
  <lex-loader theme="light"></lex-loader>

  <!-- App shell — sidebar, topbar, empty content area.
       Page content lives in <template> below and gets injected after
       the shell renders. This avoids double-rendering of child components. -->
  <lex-app
    logo-src="../img/logo-light.png"
    logo-alt="LANA AI"
    logo-href="../dashboard.html"
    active-nav-id="admin"
    page-title="Administration"
  ></lex-app>

  <!-- Page content as inert <template> — elements inside are NOT upgraded
       by the browser until cloned into the live DOM. Zero double-rendering. -->
  <template id="page-content">

    <main>

      <!-- Page header -->
      <lex-banner
        variant="light"
        heading="Administration"
        subtitle="Manage users, roles, organizations, and system settings"
      ></lex-banner>

      <!-- Admin navigation cards grid -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" style="margin-top:1.5rem;">

        <lex-action-card
          title="Users"
          description="Manage user accounts, permissions, and access"
          tag="Identity"
          data-href="admin/users.html"
        ></lex-action-card>

        <lex-action-card
          title="Roles &amp; Permissions"
          description="Configure roles and permission levels"
          tag="Identity"
          data-href="admin/roles.html"
        ></lex-action-card>

        <lex-action-card
          title="Organizations"
          description="Manage organizational structure and settings"
          tag="Structure"
          data-href="admin/organizations.html"
        ></lex-action-card>

        <lex-action-card
          title="Task Plans"
          description="Create, review, and publish task/checklist plans"
          tag="Workflow"
          data-href="admin/task-plans.html"
        ></lex-action-card>

        <lex-action-card
          title="Communications"
          description="Manage communication channels and messaging settings"
          tag="Coming soon"
          data-href="admin/communications.html"
          data-admin-roles="system_admin,org_admin,organization_admin"
        ></lex-action-card>

        <lex-action-card
          title="Sessions"
          description="Monitor active user sessions and connections"
          tag="Security"
          data-href="admin/sessions.html"
        ></lex-action-card>

        <lex-action-card
          title="Audit Logs"
          description="View system activity and security logs"
          tag="Security"
          data-href="admin/audit.html"
        ></lex-action-card>

        <lex-action-card
          title="System Health"
          description="Monitor system status and performance"
          tag="Operations"
          data-href="admin/health.html"
        ></lex-action-card>

        <lex-action-card
          title="Chat Traces"
          description="Debug and observability for AI chat interactions"
          tag="Operations"
          data-href="admin/traces.html"
        ></lex-action-card>

        <lex-action-card
          title="Metric Catalog"
          description="Inspect every metric in the registry and verify its calculation executes"
          tag="Insights"
          data-href="admin/metric-catalog.html"
        ></lex-action-card>

      </div>

    </main>

  </template>

  <noscript>
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,sans-serif;color:#666;">
      Please enable JavaScript to use LANA AI.
    </div>
  </noscript>

  <!-- ══════════════════════════════════════════════════════════════════
       Scripts at end of body — HTML renders first, scripts load after
       ══════════════════════════════════════════════════════════════════ -->

  <!-- Universal shell scripts -->
  <script src="../js/error-reporter.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/version.js"></script>
  <script src="../js/menu.js"></script>
  <script src="../js/navigation-helpers.js"></script>
  <script src="../js/new-project-modal.js"></script>
  <script src="../js/conversation-menu.js"></script>
  <script src="../js/conversation-search-modal.js"></script>
  <script src="../js/contact-search-modal.js"></script>
  <script src="../js/notifications.js"></script>

  <!-- Lex UI core -->
  <script src="../js/lex/lex.core.js"></script>
  <script src="../js/lex/lex.icons.js"></script>
  <script src="../js/lex/lex.data.js"></script>
  <script src="../js/lex/lex.forms.js"></script>
  <script src="../js/lex/lex.state.js"></script>
  <script src="../js/lex/lex.utils.js"></script>
  <script src="../js/lex/lex.auth.js"></script>
  <script src="../js/lex/lex-nav.js"></script>

  <!-- Lex UI foundation + layout -->
  <script src="../js/lex/components/foundation/lex-loader.js"></script>
  <script src="../js/lex/components/foundation/lex-toast.js"></script>
  <script src="../js/lex/components/foundation/lex-spinner.js"></script>
  <script src="../js/lex/components/foundation/lex-btn.js"></script>
  <script src="../js/lex/components/foundation/lex-empty.js"></script>
  <script src="../js/lex/components/form/lex-segmented.js"></script>
  <script src="../js/lex/components/layout/lex-sidebar.js"></script>
  <script src="../js/lex/components/layout/lex-topbar.js"></script>
  <script src="../js/lex/components/layout/lex-conversation-item.js"></script>
  <script src="../js/lex/components/layout/lex-notification-panel.js"></script>
  <script src="../js/lex/components/layout/lex-app.js"></script>

  <!-- Page-specific Lex components (BEFORE inject) -->
  <script src="../js/lex/components/foundation/lex-breadcrumb.js"></script>
  <script src="../js/lex/components/foundation/lex-banner.js"></script>
  <script src="../js/lex/components/foundation/lex-action-card.js"></script>

  <!-- Inject page content + hoist modals -->
  <script src="../js/lex/lex-page-init.js"></script>

  <!-- Page controller -->
  <script src="../js/admin/admin-index.js"></script>

  <!-- Auth guard + loader dismiss (MUST be last) -->
  <script src="../js/auth-guard.js"></script>
</body>
</html>
