<!-- Administration — Navigation hub for admin console sections.
     SPA page fragment loaded by lex-router into lex-app content area.
     Uses #lex-page-content for Strategy 1 extraction (see lex-router.js). -->

<div id="lex-page-content">

  <main>

    <!-- Page header -->
    <lex-banner
      variant="light"
      size="compact"
      heading="Administration"
      subtitle="Manage users, roles, organizations, and system settings"
    ></lex-banner>

    <!-- Admin navigation cards grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

      <lex-action-card
        title="Users"
        description="Manage user accounts, permissions, and access"
        tag="Identity"
        data-href="admin/users.html"
      ></lex-action-card>

      <lex-action-card
        title="Roles &amp; Permissions"
        description="Configure roles and permission levels"
        tag="Identity"
        data-href="admin/roles.html"
      ></lex-action-card>

      <lex-action-card
        title="Organizations"
        description="Manage organizational structure and settings"
        tag="Structure"
        data-href="admin/organizations.html"
      ></lex-action-card>

      <lex-action-card
        title="Sessions"
        description="Monitor active user sessions and connections"
        tag="Security"
        data-href="admin/sessions.html"
      ></lex-action-card>

      <lex-action-card
        title="Audit Logs"
        description="View system activity and security logs"
        tag="Security"
        data-href="admin/audit.html"
      ></lex-action-card>

      <lex-action-card
        title="System Health"
        description="Monitor system status and performance"
        tag="Operations"
        data-href="admin/health.html"
      ></lex-action-card>

    </div>

  </main>

</div>
