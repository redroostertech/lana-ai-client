<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metric Catalog - LANA AI</title>

  <link rel="stylesheet" href="../css/lex-tokens.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/tailwind-output.css">
  <link rel="stylesheet" href="../css/admin/insights-dashboard.css">
  <link rel="stylesheet" href="../css/admin/metric-catalog.css">
  <script src="../js/tailwind-loader.js"></script>
</head>
<body>
  <lex-loader theme="light"></lex-loader>

  <lex-app
    logo-src="../img/logo-light.png"
    logo-alt="LANA AI"
    logo-href="../dashboard.html"
    active-nav-id="admin"
    page-title="Metric Catalog"
  ></lex-app>

  <template id="page-content">
    <main>
      <lex-banner
        variant="light"
        heading="Metric Catalog Inspector"
        subtitle="Browse every metric in the registry and verify that its calculation runs end-to-end."
      ></lex-banner>

      <section class="metric-catalog-summary" aria-label="Catalog summary">
        <div class="metric-catalog-summary__stat">
          <div class="metric-catalog-summary__label">Total Metrics</div>
          <div class="metric-catalog-summary__value" id="metricCatalogTotal">-</div>
        </div>
        <div class="metric-catalog-summary__stat">
          <div class="metric-catalog-summary__label">Executable</div>
          <div class="metric-catalog-summary__value" id="metricCatalogExecutable">-</div>
        </div>
        <div class="metric-catalog-summary__stat">
          <div class="metric-catalog-summary__label">Planned</div>
          <div class="metric-catalog-summary__value" id="metricCatalogPlanned">-</div>
        </div>
        <div class="metric-catalog-summary__stat">
          <div class="metric-catalog-summary__label">Run Results</div>
          <div class="metric-catalog-summary__value">
            <span id="metricCatalogPassed" class="metric-catalog-summary__pill metric-catalog-summary__pill--pass">0 pass</span>
            <span id="metricCatalogFailed" class="metric-catalog-summary__pill metric-catalog-summary__pill--fail">0 fail</span>
          </div>
        </div>
      </section>

      <section class="metric-catalog-toolbar">
        <input id="metricCatalogSearch" type="search" placeholder="Search by key, name, description..." autocomplete="off" class="metric-catalog-toolbar__search" />
        <select id="metricCatalogExecutableFilter" class="metric-catalog-toolbar__select" aria-label="Executable filter">
          <option value="">All metrics</option>
          <option value="true">Executable only</option>
          <option value="false">Planned only</option>
        </select>
        <select id="metricCatalogDomainFilter" class="metric-catalog-toolbar__select" aria-label="Domain filter">
          <option value="">All domains</option>
        </select>
        <select id="metricCatalogAudienceFilter" class="metric-catalog-toolbar__select" aria-label="Audience filter">
          <option value="">All audiences</option>
        </select>
        <lex-btn id="metricCatalogRunAllBtn" variant="primary" size="sm">Run visible</lex-btn>
      </section>

      <section class="metric-catalog-card">
        <lex-table
          id="metricCatalogTable"
          sortable
          paginated
          page-size="25"
          columns="display_name,display_domain,display_primary_audience,display_status,executable_label,last_run,actions"
          labels="Name,Domain,Audience,Status,Executable,Last Run,Actions"
          sort-by="display_name"
          sort-dir="asc"
          empty-text="No metrics match the current filters"
          aria-label="Metric catalog"
        ></lex-table>
      </section>

      <!-- Detail drawer is opened by metric-catalog.js using Lex.Drawer -->

    </main>
  </template>

  <noscript><div class="lex-noscript-message">Please enable JavaScript to use LANA AI.</div></noscript>

  <script src="../js/error-reporter.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/version.js"></script>
  <script src="../js/menu.js"></script>
  <script src="../js/navigation-helpers.js"></script>
  <script src="../js/new-project-modal.js"></script>
  <script src="../js/conversation-menu.js"></script>
  <script src="../js/conversation-search-modal.js"></script>
  <script src="../js/contact-search-modal.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/lex/lex.core.js"></script>
  <script src="../js/lex/lex.icons.js"></script>
  <script src="../js/lex/lex.data.js"></script>
  <script src="../js/lex/lex.forms.js"></script>
  <script src="../js/lex/lex.state.js"></script>
  <script src="../js/lex/lex.utils.js"></script>
  <script src="../js/lex/lex.auth.js"></script>
  <script src="../js/lex/lex-nav.js"></script>
  <script src="../js/lex/components/foundation/lex-loader.js"></script>
  <script src="../js/lex/components/foundation/lex-toast.js"></script>
  <script src="../js/lex/components/foundation/lex-spinner.js"></script>
  <script src="../js/lex/components/foundation/lex-btn.js"></script>
  <script src="../js/lex/components/foundation/lex-empty.js"></script>
  <script src="../js/lex/components/foundation/lex-drawer.js"></script>
  <script src="../js/lex/components/data/lex-table.js"></script>
  <script src="../js/lex/components/layout/lex-sidebar.js"></script>
  <script src="../js/lex/components/layout/lex-topbar.js"></script>
  <script src="../js/lex/components/layout/lex-conversation-item.js"></script>
  <script src="../js/lex/components/layout/lex-notification-panel.js"></script>
  <script src="../js/lex/components/layout/lex-app.js"></script>
  <script src="../js/lex/components/foundation/lex-banner.js"></script>
  <script src="../js/lex/lex-page-init.js"></script>
  <script src="../js/admin/metric-catalog.js"></script>
  <script src="../js/auth-guard.js"></script>
</body>
</html>
