<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metric Catalog - LANA AI</title>

  <link rel="stylesheet" href="../css/lex-tokens.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/tailwind-output.css">
  <link rel="stylesheet" href="../css/admin/insights-dashboard.css">
  <link rel="stylesheet" href="../css/admin/metric-catalog.css">
  <script src="../js/tailwind-loader.js"></script>
  <link rel="stylesheet" href="../css/lex-chat.css">
</head>
<body>
  <lex-loader theme="light"></lex-loader>

  <lex-app
    logo-src="../img/logo-light.png"
    logo-alt="LANA AI"
    logo-href="../dashboard.html"
    active-nav-id="admin"
    page-title="Metric Catalog"
  ></lex-app>

  <template id="page-content">
    <main>
      <lex-banner
        variant="light"
        heading="Metric Catalog Inspector"
        subtitle="Browse every metric in the registry and verify that its calculation runs end-to-end."
        lana
        lana-context-type="full_chat"
      ></lex-banner>

      <section class="metric-catalog-summary" aria-label="Catalog summary">
        <div class="metric-catalog-summary__stat">
          <div class="metric-catalog-summary__label">Total Metrics</div>
          <div class="metric-catalog-summary__value" id="metricCatalogTotal">-</div>
        </div>
        <div class="metric-catalog-summary__stat">
          <div class="metric-catalog-summary__label">Executable</div>
          <div class="metric-catalog-summary__value" id="metricCatalogExecutable">-</div>
        </div>
        <div class="metric-catalog-summary__stat">
          <div class="metric-catalog-summary__label">Planned</div>
          <div class="metric-catalog-summary__value" id="metricCatalogPlanned">-</div>
        </div>
        <div class="metric-catalog-summary__stat">
          <div class="metric-catalog-summary__label">Run Results</div>
          <div class="metric-catalog-summary__value">
            <span id="metricCatalogPassed" class="metric-catalog-summary__pill metric-catalog-summary__pill--pass">0 pass</span>
            <span id="metricCatalogFailed" class="metric-catalog-summary__pill metric-catalog-summary__pill--fail">0 fail</span>
          </div>
        </div>
      </section>

      <!-- Search / Sort / Filter toolbar (docs/TABLE-STANDARD.md section 2) -->
      <div class="metric-catalog-toolbar bg-white rounded-lg shadow-sm border mb-4 mt-4 p-4" style="border-color: var(--lex-border-default)" role="search" aria-label="Search and filter metrics">
        <div class="flex items-center gap-4 flex-wrap">
          <div class="flex-1 min-w-[200px]">
            <lex-input id="metricCatalogSearch" placeholder="Search by key, name, description..." clearable="true" leading-icon="search"></lex-input>
          </div>
          <div class="flex items-center gap-2">
            <label class="text-sm whitespace-nowrap" style="color: var(--lex-text-secondary)">Sort by:</label>
            <lex-select
              id="metricCatalogSort"
              options='[{"value":"display_name","label":"Name"},{"value":"domain","label":"Domain"},{"value":"audience","label":"Audience"},{"value":"status","label":"Status"},{"value":"executable","label":"Executable"},{"value":"last_run_status","label":"Last run"},{"value":"last_run_value","label":"Value"},{"value":"goal_target","label":"Goal"}]'
              value="display_name"
            ></lex-select>
          </div>
          <lex-btn id="metricCatalogSortOrder" variant="ghost" icon="true" title="Toggle sort order" data-order="asc">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12"></path>
            </svg>
          </lex-btn>
          <div class="flex items-center gap-2">
            <label class="text-sm whitespace-nowrap" style="color: var(--lex-text-secondary)">Executable:</label>
            <lex-select
              id="metricCatalogExecutableFilter"
              options='[{"value":"all","label":"All metrics"},{"value":"true","label":"Executable only"},{"value":"false","label":"Planned only"}]'
              value="all"
            ></lex-select>
          </div>
          <div id="metricCatalogCount" class="text-sm whitespace-nowrap" style="color: var(--lex-text-secondary)"></div>
          <lex-btn id="metricCatalogRunAllBtn" variant="primary" size="sm">Run All</lex-btn>
        </div>
      </div>

      <section class="metric-catalog-list" aria-labelledby="metricCatalogHeading">
        <div class="flex items-center justify-between mb-3">
          <h2 id="metricCatalogHeading" class="text-lg font-semibold" style="color: var(--lex-text-primary)">All Metrics</h2>
          <span id="metricCatalogSectionCount" class="text-sm" style="color: var(--lex-text-secondary)" aria-live="polite"></span>
        </div>
        <lex-table
          id="metricCatalogTable"
          class="lex-table--card"
          column-filters
          columns="display_name,domain,audience,entity_keys,status,executable,last_run_status,last_run_value,goal_target,actions"
          labels="Name,Domain,Audience,Entities,Status,Executable,Last run,Value,Goal,Actions"
          sortable-columns="display_name,domain,audience,status,executable,last_run_status,last_run_value,goal_target"
          sort-by="display_name"
          sort-dir="asc"
          limit="20"
          id-key="key"
          empty-text="No metrics in the registry"
          aria-label="Metric catalog"
        ></lex-table>
      </section>

      <!-- Detail drawer is opened by metric-catalog.js using Lex.Drawer -->

    </main>
  </template>

  <noscript><div class="lex-noscript-message">Please enable JavaScript to use LANA AI.</div></noscript>
