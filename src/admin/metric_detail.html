<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metric Detail - LANA AI</title>

  <script src="../js/lex/lex.theme.js"></script>
  <link rel="stylesheet" href="../css/lex-tokens.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/tailwind-output.css">
  <link rel="stylesheet" href="../css/admin/insights-dashboard.css">
  <link rel="stylesheet" href="../css/report-object-panel.css">
  <link rel="stylesheet" href="../css/mini-charts.css">
  <script src="../js/tailwind-loader.js"></script>
  <link rel="stylesheet" href="../css/lex-chat.css">
  <!-- target="_blank" links open through the guarded channel (js/shared/external-links.js). -->
  <script src="../js/shared/external-links.js"></script>
</head>
<body>
  <lex-loader theme="light"></lex-loader>

  <lex-app
    logo-src="../img/logo-light.png"
    logo-alt="LANA AI"
    logo-href="../dashboard.html"
    active-nav-id="insights-dashboards"
    page-title="Metric Detail"
  ></lex-app>

  <template id="page-content">
    <main>
      <lex-banner
        id="metricDetailBanner"
        variant="light"
        heading="Metric Detail"
        subtitle="Canonical metric calculation, movement, and raw data drilldown"
        lana
        lana-context-type="full_chat"
      ></lex-banner>

      <lex-breadcrumb id="metricDetailBreadcrumb"></lex-breadcrumb>

      <section class="metric-detail-layout">
        <!-- One summary: the value with its unit, the change against the prior
             period, and a small comparison (or the trend when history exists). -->
        <section class="metric-summary" aria-labelledby="metricTitle">
          <div class="metric-summary__main">
            <h2 id="metricTitle" class="metric-summary__title">Metric</h2>
            <div id="metricSummaryValue" class="metric-summary__value">-</div>
            <p id="metricSummarySecondLine" class="metric-summary__second-line" hidden></p>
            <div class="metric-summary__change-row">
              <span id="metricSummaryChange" class="metric-summary__chip" hidden></span>
              <span id="metricSummaryPrior" class="metric-summary__prior"></span>
            </div>
            <p id="metricPeriodLine" class="metric-summary__period">For <span id="metricPeriod"></span></p>
            <div id="metricFreshness" class="metric-summary__freshness" hidden></div>
          </div>
          <div id="metricSummaryVisual" class="metric-summary__visual" aria-hidden="true"></div>
        </section>

        <!-- About this number: plain words from the catalog. -->
        <section class="metric-about" aria-labelledby="metricAboutHeading">
          <div class="metric-about__header">
            <svg class="metric-about__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
            <h2 id="metricAboutHeading" class="metric-about__heading">About this number</h2>
          </div>
          <p id="metricDescription" class="metric-about__lead"></p>
          <div class="metric-about__blocks">
            <div id="metricCalculationBlock" class="metric-about__block">
              <h3 class="metric-about__label">How it's calculated</h3>
              <p id="metricCalculation"></p>
            </div>
            <div id="metricBusinessLogicBlock" class="metric-about__block">
              <h3 class="metric-about__label">Why it matters</h3>
              <p id="metricBusinessLogic"></p>
            </div>
          </div>
          <!-- Data used: the sources, the details we read, and the rules (data.lineage). -->
          <div id="metricDataUsed" class="metric-data" hidden></div>
        </section>

        <!-- History: only when there are at least two stored values. -->
        <section id="metricHistorySection" class="metric-detail-card" hidden>
          <div class="metric-detail-card__header">
            <h2>How it has moved</h2>
          </div>
          <div id="metricHistoryChart" class="metric-history__chart" aria-hidden="true"></div>
          <div class="metric-detail-toolbar" role="search" aria-label="Search and filter snapshots">
            <lex-input id="metricSnapshotsSearch" class="metric-detail-toolbar__search" placeholder="Search snapshots..." clearable="true" leading-icon="search"></lex-input>
            <lex-select id="metricSnapshotsSort" options='[{"value":"created_at","label":"Created"},{"value":"value","label":"Value"},{"value":"status","label":"Status"},{"value":"period_start","label":"Period start"},{"value":"period_end","label":"Period end"}]' value="created_at"></lex-select>
            <lex-btn id="metricSnapshotsSortOrder" variant="ghost" icon="true" title="Toggle sort order" data-order="desc"><svg class="metric-detail-toolbar__icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12"></path></svg></lex-btn>
            <lex-select id="metricSnapshotsStatusFilter" options='[{"value":"all","label":"All"}]' value="all"></lex-select>
            <div id="metricSnapshotsCount" class="metric-detail-toolbar__count"></div>
          </div>
          <span id="metricSnapshotsSectionCount" class="metric-detail-toolbar__count" aria-live="polite"></span>
          <lex-table
            id="metricSnapshotsTable"
            class="lex-table--card"
            column-filters
            columns="created_at,value,status,period_start,period_end"
            labels="Created,Value,Status,Period start,Period end"
            sortable-columns="created_at,value,status,period_start,period_end"
            sort-by="created_at"
            sort-dir="desc"
            limit="20"
            id-key="id"
            empty-text="No snapshots captured yet"
            aria-label="Metric snapshots"
          ></lex-table>
        </section>

        <!-- The records behind the number. -->
        <section id="metricSourcePanel" class="metric-detail-card">
          <div class="metric-detail-card__header">
            <div>
              <h2>The records behind this number</h2>
              <p id="metricRawDataHelp" class="metric-detail-tab-help">One row per record counted for these dates.</p>
              <p id="metricRawDataTotalNote" class="metric-detail-tab-help" hidden></p>
            </div>
            <span id="metricRawDataSectionCount" class="metric-detail-toolbar__count" aria-live="polite"></span>
          </div>
          <div id="metricRawDataUnavailable" hidden></div>
          <div id="metricRawDataToolbar" class="metric-detail-toolbar" role="search" aria-label="Search source records">
            <lex-input id="metricRawDataSearch" class="metric-detail-toolbar__search" placeholder="Search records..." clearable="true" leading-icon="search"></lex-input>
            <lex-select id="metricRawDataSort" options='[]' value=""></lex-select>
            <lex-btn id="metricRawDataSortOrder" variant="ghost" icon="true" title="Toggle sort order" data-order="asc"><svg class="metric-detail-toolbar__icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12"></path></svg></lex-btn>
            <div id="metricRawDataCount" class="metric-detail-toolbar__count"></div>
          </div>
          <lex-table
            id="metricRawDataTable"
            class="lex-table--card"
            column-filters
            limit="20"
            id-key="_row_id"
            empty-text="No records for these dates"
            aria-label="Records behind this number"
          ></lex-table>
        </section>
      </section>
    </main>
  </template>

  <noscript><div class="lex-noscript-message">Please enable JavaScript to use LANA AI.</div></noscript>

  <script src="../js/error-reporter.js"></script>

  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/version.js"></script>
  <script src="../js/menu.js"></script>
  <script src="../js/navigation-helpers.js"></script>
  <script src="../js/conversation-search-modal.js"></script>
  <script src="../js/contact-search-modal.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/lex/lex.core.js"></script>
  <script src="../js/lex/lex.icons.js"></script>
  <script src="../js/lex/lex.data.js"></script>
  <script src="../js/lex/lex.forms.js"></script>
  <script src="../js/lex/lex.state.js"></script>
  <script src="../js/lex/lex.utils.js"></script>
  <script src="../js/lex/lex.auth.js"></script>
  <script src="../js/lex/lex-nav.js"></script>
  <script src="../js/lex/components/foundation/lex-loader.js"></script>
  <script src="../js/lex/components/foundation/lex-toast.js"></script>
  <script src="../js/lex/components/foundation/lex-spinner.js"></script>

  <script src="../js/lex/components/layout/lex-sidebar.js"></script>
  <script src="../js/lex/components/layout/lex-topbar.js"></script>
  <script src="../js/lex/components/layout/lex-conversation-item.js"></script>
  <script src="../js/lex/components/layout/lex-notification-panel.js"></script>
  <script src="../js/lex/components/layout/lex-app.js"></script>
  <script src="../js/lex/components/foundation/lex-breadcrumb.js"></script>
  <script src="../js/lex/components/foundation/lex-banner.js"></script>
  <script src="../js/lex/components/foundation/lex-tabs.js"></script>
  <script src="../js/lex/components/foundation/lex-badge.js"></script>
  <script src="../js/lex/components/form/lex-input.js"></script>
  <script src="../js/lex/components/form/lex-select.js"></script>
  <script src="../js/lex/components/data/lex-table.js"></script>
  <script src="../js/lex/lex-page-init.js"></script>
  <script src="../js/shared/library-column-filters.js"></script>
  <script src="../js/shared/metric-tables.js"></script>
  <script src="../js/shared/data-state.js"></script>
  <script src="../js/dashboard/metric-goal-comparison.js"></script>
  <script src="../js/shared/metric-card-view.js"></script>
  <script src="../js/shared/mini-charts.js"></script>
  <script src="../js/shared/metric-detail-view.js"></script>
  <script src="../js/lex/components/foundation/lex-drawer.js"></script>
  <script src="../js/shared/report-objects.js"></script>
  <script src="../js/shared/report-object-panel.js"></script>
  <script src="../js/shared/lineage-view.js"></script>
  <script src="../js/shared/insights-breadcrumbs.js"></script>

  <script src="../js/auth-guard.js"></script>
