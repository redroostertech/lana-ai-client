<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Library - LANA AI</title>

  <link rel="stylesheet" href="css/lex-tokens.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/document-library.css">
  <link rel="stylesheet" href="css/document-create-modal.css">
  <link rel="stylesheet" href="css/tailwind-output.css">
  <link rel="stylesheet" href="css/companion-bridge-consent.css">
  <link rel="stylesheet" href="css/lex-chat.css">
  <script src="js/tailwind-loader.js"></script>
</head>
<body>
  <lex-loader theme="light"></lex-loader>

  <lex-app
    logo-src="img/logo-light.png"
    logo-alt="LANA AI"
    logo-href="dashboard.html"
    active-nav-id="document-library"
    page-title="Document Library"
  ></lex-app>

  <template id="page-content">
    <main id="documentLibrary" class="document-library">
      <lex-banner
        id="documentLibraryBanner"
        variant="light"
        corners
        heading="Document Library"
        subtitle="Pick up where you left off or start a new document."
        lana
        lana-context-type="full_chat"
      >
        <lex-btn id="documentLibraryNewBtn" variant="primary" leading-icon="file-plus" data-action="new-document">New Document</lex-btn>
      </lex-banner>

      <!-- Search / Sort / Filter toolbar — Library-style, drives the table below -->
      <div class="document-library-toolbar bg-white rounded-lg shadow-sm border mb-4 mt-4 p-4" role="search" aria-label="Search and filter documents">
        <div class="flex items-center gap-4 flex-wrap">
          <div class="flex-1 min-w-[200px]">
            <lex-input
              id="documentLibrarySearch"
              placeholder="Search documents..."
              clearable="true"
              leading-icon="search"
            ></lex-input>
          </div>

          <div class="flex items-center gap-2">
            <label class="document-library-toolbar-label text-sm whitespace-nowrap">Sort by:</label>
            <lex-select
              id="documentLibrarySort"
              options='[{"value":"updated_at","label":"Last Edited"},{"value":"created_at","label":"Created"},{"value":"name","label":"File Name"},{"value":"size","label":"Size"}]'
              value="updated_at"
            ></lex-select>
          </div>

          <lex-btn id="documentLibrarySortOrder" variant="ghost" icon="true" title="Toggle sort order" data-order="desc">
            <svg class="document-library-toolbar-icon w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12"></path>
            </svg>
          </lex-btn>

          <div class="flex items-center gap-2">
            <label class="document-library-toolbar-label text-sm whitespace-nowrap">Type:</label>
            <lex-select
              id="documentLibraryTypeFilter"
              options='[{"value":"all","label":"All"},{"value":"document","label":"Documents"},{"value":"spreadsheet","label":"Spreadsheets"},{"value":"presentation","label":"Presentations"},{"value":"pdf","label":"PDFs"}]'
              value="all"
            ></lex-select>
          </div>

          <div id="documentLibraryCount" class="document-library-toolbar-label text-sm whitespace-nowrap"></div>
        </div>
      </div>

      <section class="document-library-recents" aria-labelledby="documentLibraryRecentHeading">
        <!-- Section header — title + count, Library-style -->
        <div class="flex items-center justify-between mb-3">
          <h2 id="documentLibraryRecentHeading" class="document-library-section-title text-lg font-semibold">All Documents</h2>
          <span id="documentLibraryRecentCount" class="document-library-toolbar-label text-sm" aria-live="polite"></span>
        </div>

        <lex-table
          id="documentLibraryTable"
          column-filters
          class="document-library-table lex-table--card"
          server-paging
          columns="name,type,size,workspace,created_at,updated_at"
          labels="File,Type,Size,Workspace,Created,Last edited"
          sortable-columns="name,size,created_at,updated_at"
          sort-by="updated_at"
          sort-dir="desc"
          limit="20"
          id-key="id"
          empty-text="No documents found"
          empty-action-label="New Document"
          empty-action-icon="file-plus"
          aria-label="Documents"
        ></lex-table>
      </section>
    </main>
  </template>

  <lex-lana-dock page-scope="document-library" context-type="full_chat" placeholder="Ask LANA about your documents..." thread-title="Document Library Chat"></lex-lana-dock>

  <noscript>
    <div class="document-library-noscript">Please enable JavaScript to use LANA AI.</div>
  </noscript>
