<!-- Open-source licenses: every third-party library, font and runtime the LANA AI
     client ships, with its license and full license text. Opened from Help & Support.

     Page fragment, injected into the lex-app shell by the SPA router. See
     lex-router.pages.js for the descriptor (activeNav: 'help'). The data comes from
     js/pages/open-source-licenses.data.js, generated by scripts/licenses/generate.js. -->

<div id="lex-page-content">
  <main id="ossPage" class="oss-page">

    <lex-banner
      variant="light"
      size="compact"
      heading="Open-source licenses"
      subtitle="The LANA AI client is built with these libraries, fonts and runtime. Each belongs to its authors and is used under the license shown."
    ></lex-banner>

    <div class="oss-toolbar">
      <lex-input id="ossFilter" type="search" placeholder="Filter by name or license" leading-icon="search" clearable></lex-input>
      <p id="ossCount" class="oss-count"></p>
    </div>

    <div id="ossSections" class="oss-sections"></div>

    <div id="ossEmpty" class="hidden">
      <lex-empty icon="search" message="No matches" description="No component has that name or license."></lex-empty>
    </div>

    <p class="oss-footnote">
      Chromium, Node.js and FFmpeg notices ship with the app as resources/licenses/LICENSES.chromium.html.
      The full list is also published at lanaai.io/open-source.
    </p>

  </main>
</div>
