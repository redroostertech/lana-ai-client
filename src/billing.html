<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billing and Plan - LANA AI</title>

  <!-- CSS + Tailwind in head; behavioral scripts at end of body -->
  <link rel="stylesheet" href="css/lex-tokens.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/billing.css">
  <link rel="stylesheet" href="css/tailwind-output.css">
  <script src="js/tailwind-loader.js"></script>

</head>
<body>

  <lex-loader theme="light"></lex-loader>

  <lex-app
    logo-src="img/logo-light.png"
    logo-alt="LANA AI"
    logo-href="dashboard.html"
    active-nav-id="billing"
    page-title="Billing and Plan"
  ></lex-app>

  <template id="page-content">

    <main class="bl-page">

      <!-- Current plan -->
      <section class="bl-section">
        <lex-card id="bl-plan-card" heading="Current plan">
          <div class="bl-plan-row">
            <div class="bl-card-icon" id="bl-plan-icon"></div>
            <div>
              <p class="bl-plan-name" id="bl-plan-name">Loading...</p>
              <p class="bl-plan-meta" id="bl-plan-meta"></p>
            </div>
            <div class="bl-plan-actions">
              <lex-btn id="bl-manage-btn" variant="secondary" size="sm" leading-icon="credit-card">Manage billing</lex-btn>
            </div>
          </div>
          <div id="bl-billing-unavailable" class="bl-hidden">
            <lex-banner
              variant="light"
              heading="Billing is not available yet"
              subtitle="Plan changes and self-serve checkout are being enabled for LANA One. To upgrade in the meantime, contact your workspace owner or support.">
            </lex-banner>
          </div>
        </lex-card>
      </section>

      <!-- Usage this period -->
      <section class="bl-section">
        <lex-card heading="Usage this period" subtitle="A qualitative view of where you stand against your plan limits">
          <div class="bl-usage-list" id="bl-usage-list">

            <div class="bl-usage-item" id="bl-usage-storage-item">
              <div class="bl-usage-head">
                <span class="bl-usage-label">Stored files</span>
                <span class="bl-usage-detail" id="bl-usage-storage-detail">Loading...</span>
              </div>
              <div class="bl-usage-track">
                <div class="bl-usage-fill" id="bl-usage-storage-fill" style="width:0%"></div>
              </div>
            </div>

          </div>
        </lex-card>
      </section>

      <!-- Plan grid -->
      <section class="bl-section">
        <lex-card heading="Choose a plan" subtitle="Free, Pro, and Max. Every plan includes prompt redaction, citation verification, and tenant isolation.">
          <div class="bl-grid" id="bl-plan-grid">
            <!-- Cards rendered by JS -->
          </div>
          <p class="bl-note">
            Prices shown in USD, billed monthly. Switch or cancel anytime. Team and firm plans are available on LANA AI.
          </p>
          <!-- Shown only when the account's current tier has no card in the
               grid (grid membership, never edition); JS toggles bl-hidden -->
          <p class="bl-note bl-hidden" id="bl-grid-locked-note">
            Your plan is managed on LANA AI Business, so plan changes are not available here.
          </p>
        </lex-card>
      </section>

      <!-- Graduate to Business: shown ONLY under the LANA One edition
           (form-factor affordance; JS removes bl-hidden when edition is lana_one) -->
      <section class="bl-section bl-hidden" id="bl-graduate-section">
        <lex-card heading="For teams and firms">
          <div class="bl-plan-row">
            <div class="bl-card-icon" id="bl-graduate-icon"></div>
            <div>
              <p class="bl-plan-name">Graduate to LANA AI Business</p>
              <p class="bl-plan-meta">
                LANA One is built for individuals. Teams, firms, and enterprises run on LANA AI Business,
                with multi seat administration, shared matters, and enterprise controls.
                Your plan here stays as it is until you choose to move.
              </p>
            </div>
            <div class="bl-plan-actions">
              <lex-btn id="bl-graduate-btn" variant="secondary" size="sm" leading-icon="building-2">Explore Business</lex-btn>
            </div>
          </div>
        </lex-card>
      </section>

    </main>

  </template>

  <noscript>
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,sans-serif;color:#666;">
      Please enable JavaScript to use LANA AI.
    </div>
  </noscript>

  <!-- Universal shell scripts -->
  <script src="js/error-reporter.js"></script>
  <script src="js/config.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/utils/rename-conversation.js"></script>
  <script src="js/components.js"></script>
  <script src="js/version.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/navigation-helpers.js"></script>
  <script src="js/new-project-modal.js"></script>
  <script src="js/conversation-menu.js"></script>
  <script src="js/conversation-search-modal.js"></script>
  <script src="js/contact-search-modal.js"></script>
  <script src="js/notifications.js"></script>

  <!-- Lex UI core -->
  <script src="js/lex/lex.core.js"></script>
  <script src="js/lex/lex.icons.js"></script>
  <script src="js/lex/lex.data.js"></script>
  <script src="js/lex/lex.forms.js"></script>
  <script src="js/lex/lex.state.js"></script>
  <script src="js/lex/lex.utils.js"></script>
  <script src="js/lex/lex.auth.js"></script>
  <script src="js/lex/lex-nav.js"></script>

  <!-- Lex UI foundation -->
  <script src="js/lex/components/foundation/lex-loader.js"></script>
  <script src="js/lex/components/foundation/lex-toast.js"></script>
  <script src="js/lex/components/foundation/lex-spinner.js"></script>
  <script src="js/lex/components/foundation/lex-btn.js"></script>
  <script src="js/lex/components/foundation/lex-empty.js"></script>

  <!-- Lex UI layout -->
  <script src="js/lex/components/layout/lex-sidebar.js"></script>
  <script src="js/lex/components/layout/lex-topbar.js"></script>
  <script src="js/lex/components/layout/lex-conversation-item.js"></script>
  <script src="js/lex/components/layout/lex-notification-panel.js"></script>
  <script src="js/lex/components/layout/lex-app.js"></script>

  <!-- Page-specific Lex components (loaded BEFORE inject) -->
  <script src="js/lex/components/foundation/lex-card.js"></script>
  <script src="js/lex/components/foundation/lex-badge.js"></script>
  <script src="js/lex/components/foundation/lex-banner.js"></script>
  <script src="js/lex/components/foundation/lex-text.js"></script>
  <script src="js/lex/components/foundation/lex-stack.js"></script>
  <script src="js/lex/components/foundation/lex-divider.js"></script>
  <script src="js/lex/components/foundation/lex-modal.js"></script>

  <!-- Inject page content + hoist modals -->
  <script src="js/lex/lex-page-init.js"></script>

  <!-- Billing data + API + page controller -->
  <script src="js/shared/product-edition.client.js"></script>
  <script src="js/billing/pricing-tiers.js"></script>
  <script src="js/api/billing-api.client.js"></script>
  <script src="js/pages/billing.js"></script>

  <!-- Auth guard + loader dismiss (MUST be last) -->
  <script src="js/auth-guard.js"></script>
</body>
</html>
