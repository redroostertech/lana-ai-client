<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Result - LANA AI</title>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search || '');
      var hasDetail = !!(params.get('entity_id') || params.get('id') || params.get('external_id') || params.get('result_key'));
      if (!hasDetail) {
        var query = params.get('q') || params.get('query') || '';
        try {
          sessionStorage.setItem('lana-open-global-search', '1');
          if (query) sessionStorage.setItem('lana-pending-global-search', query);
        } catch (_err) {
          window.name = query ? 'lana-pending-global-search:' + query : 'lana-open-global-search';
        }
      } else {
        try {
          sessionStorage.setItem('_lex_last_path', '/search-results.html' + (window.location.search || ''));
        } catch (_err) {}
      }
      if (!window.Lex) window.location.replace('app.html');
    })();
  </script>
</head>
<body>
  <main id="lex-page-content">
    <section class="search-result-page">
      <style>
        .search-result-page {
          max-width: 1180px;
          margin: 0 auto;
          padding: 1.5rem;
          color: #111827;
        }
        .search-result-header {
          display: flex;
          align-items: flex-start;
          justify-content: space-between;
          gap: 1rem;
          margin-bottom: 1rem;
        }
        .search-result-kicker {
          color: #64748b;
          font-size: 0.8125rem;
          text-transform: uppercase;
          letter-spacing: 0.04em;
        }
        .search-result-title {
          margin: 0.25rem 0 0;
          font-size: 1.5rem;
          line-height: 1.25;
          font-weight: 700;
        }
        .search-result-subtitle {
          margin-top: 0.375rem;
          color: #64748b;
        }
        .search-result-actions {
          display: flex;
          gap: 0.5rem;
          flex-wrap: wrap;
        }
        .search-result-action {
          border: 1px solid #d1d5db;
          border-radius: 6px;
          background: #fff;
          color: #374151;
          padding: 0.5rem 0.75rem;
          cursor: pointer;
        }
        .search-result-action[data-primary="true"] {
          border-color: #4f46e5;
          background: #4f46e5;
          color: #fff;
        }
        .search-result-tabs-shell {
          display: flex;
          flex-direction: column;
          min-height: 0;
          margin-top: 1.5rem;
        }
        .search-result-tabs-shell lex-tabs {
          padding: 0 1.5rem;
        }
        .search-result-tab-content {
          padding: 1.5rem;
        }
        .search-result-tab-panel.hidden {
          display: none;
        }
        .search-result-grid {
          display: grid;
          grid-template-columns: minmax(0, 1fr) minmax(18rem, 28rem);
          gap: 1rem;
          margin-top: 1rem;
        }
        .search-result-card {
          border: 1px solid #e5e7eb;
          border-radius: 8px;
          background: #fff;
          overflow: hidden;
        }
        .search-result-card h2 {
          margin: 0;
          padding: 0.75rem 1rem;
          border-bottom: 1px solid #e5e7eb;
          font-size: 0.875rem;
          text-transform: uppercase;
        }
        .search-result-kv {
          display: grid;
          grid-template-columns: minmax(8rem, 32%) minmax(0, 1fr);
          gap: 0.75rem;
          padding: 0.625rem 1rem;
          border-bottom: 1px solid #f1f5f9;
          font-size: 0.875rem;
        }
        .search-result-kv:last-child { border-bottom: 0; }
        .search-result-key { color: #64748b; }
        .search-result-value { overflow-wrap: anywhere; }
        .search-result-preview {
          padding: 1rem;
          white-space: pre-wrap;
          line-height: 1.5;
        }
        .search-result-json {
          margin: 0;
          max-height: 28rem;
          overflow: auto;
          padding: 1rem;
          background: #0f172a;
          color: #dbeafe;
          font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
          font-size: 0.8125rem;
          line-height: 1.5;
          white-space: pre-wrap;
          overflow-wrap: anywhere;
        }
        .search-result-empty {
          padding: 2rem;
          color: #64748b;
          text-align: center;
        }
        .search-result-editor-backdrop {
          position: fixed;
          inset: 0;
          z-index: 11000;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 1.5rem;
          background: rgba(15, 23, 42, 0.48);
        }
        .search-result-editor {
          width: min(920px, 100%);
          max-height: min(820px, calc(100vh - 3rem));
          display: flex;
          flex-direction: column;
          border: 1px solid #dbe3ef;
          border-radius: 8px;
          background: #fff;
          overflow: hidden;
        }
        .search-result-editor-header,
        .search-result-editor-footer {
          padding: 1rem;
          border-bottom: 1px solid #e5e7eb;
        }
        .search-result-editor-footer {
          border-top: 1px solid #e5e7eb;
          border-bottom: 0;
          display: flex;
          justify-content: flex-end;
          gap: 0.5rem;
        }
        .search-result-editor-title {
          margin: 0;
          font-size: 1rem;
        }
        .search-result-editor-body {
          min-height: 0;
          padding: 1rem;
          overflow: auto;
        }
        .search-result-editor-textarea {
          width: 100%;
          min-height: 26rem;
          resize: vertical;
          border: 1px solid #d1d5db;
          border-radius: 6px;
          padding: 0.75rem;
          font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
          font-size: 0.8125rem;
          line-height: 1.5;
        }
        .search-result-editor-status {
          margin-top: 0.75rem;
          min-height: 1.25rem;
          color: #64748b;
          font-size: 0.875rem;
        }
        .search-result-editor-status[data-error="true"] {
          color: #b91c1c;
        }
        @media (max-width: 900px) {
          .search-result-grid { grid-template-columns: 1fr; }
        }
      </style>
      <div id="searchResultDetailRoot" class="search-result-empty">Loading result details...</div>
    </section>
  </main>
</body>
</html>
