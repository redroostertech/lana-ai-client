<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password - LanaAI</title>

  <!-- Lex design tokens (loader theming) + Tailwind -->
  <link rel="stylesheet" href="css/lex-tokens.css">
  <link rel="stylesheet" href="css/tailwind-output.css">
  <script src="js/tailwind-loader.js"></script>
  <script src="js/error-reporter.js"></script>
  <script src="js/config.js"></script>
  <script src="js/version.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/time-utils.js"></script>
  <script src="js/shared/request-retry.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils/rename-conversation.js"></script>
  <script src="js/components.js"></script>
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center p-4">

  <!-- Branded Lex loader — dismissed on DOMContentLoaded -->
  <lex-loader theme="light"></lex-loader>

  <!-- App content -->
  <div id="app-content">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <img src="img/logo-dark.png" alt="LanaAI" class="h-12 mx-auto">
      <p class="text-gray-600 mt-2">Set New Password</p>
    </div>

    <div class="bg-white rounded-2xl shadow-xl p-8">
      <div id="changeForm">
        <h2 class="text-2xl font-semibold text-gray-900 mb-2">Set a new password</h2>
        <p class="text-gray-600 mb-6">Set a new password to finish signing in. It must be at least 10 characters long.</p>

        <form id="passwordChangeForm" class="space-y-5">
          <!-- Current password (only shown when it can't be carried from login) -->
          <div id="currentPasswordField" class="hidden">
            <label for="currentPassword" class="block text-sm font-medium text-gray-700 mb-1">Current password</label>
            <div class="relative">
              <input type="password" id="currentPassword" name="currentPassword" minlength="1"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors">
              <button type="button" data-toggle="currentPassword" class="toggle-visibility absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                </svg>
              </button>
            </div>
          </div>

          <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">New password</label>
            <div class="relative">
              <input type="password" id="password" name="password" required minlength="10"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors">
              <button type="button" data-toggle="password" class="toggle-visibility absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                </svg>
              </button>
            </div>
          </div>

          <div>
            <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">Confirm new password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required minlength="10"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors">
          </div>

          <!-- Password strength indicator -->
          <div class="space-y-2">
            <div class="flex gap-1">
              <div id="str1" class="h-1 flex-1 bg-gray-200 rounded"></div>
              <div id="str2" class="h-1 flex-1 bg-gray-200 rounded"></div>
              <div id="str3" class="h-1 flex-1 bg-gray-200 rounded"></div>
              <div id="str4" class="h-1 flex-1 bg-gray-200 rounded"></div>
            </div>
            <p id="strengthText" class="text-xs text-gray-500">Enter a password</p>
          </div>

          <button type="submit" id="submitBtn"
            class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg transition-colors">
            Set password &amp; continue
          </button>
        </form>

        <div class="mt-6 text-center">
          <p class="text-sm text-gray-600">
            <a href="#" id="logoutLink" class="text-indigo-600 hover:text-indigo-500 font-medium">Log out</a>
          </p>
        </div>
      </div>

      <div id="successMessage" class="hidden text-center">
        <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
          <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
          </svg>
        </div>
        <h3 class="text-xl font-semibold text-gray-900 mb-2">Password updated</h3>
        <p class="text-gray-600 mb-6">You're all set. Taking you to your dashboard...</p>
      </div>
    </div>

    <!-- Footer -->
    <p class="text-center text-gray-500 text-sm mt-8">
      &copy; 2026 LanaAI. All rights reserved.
    </p>
    <p id="app-version" class="text-center text-gray-400 text-xs mt-2"></p>
  </div>

  <script>
    // Set app version from centralized version system
    document.getElementById('app-version').textContent = window.APP_VERSION?.getVersion() || 'v0.0.0';

    // Read-then-remove the short-lived temp password stashed by login.html.
    // If it's absent (e.g. the user reached this page via the auth-guard 403
    // redirect with only a stored token), we fall back to asking for it.
    let carriedCurrentPassword = null;
    try {
      carriedCurrentPassword = sessionStorage.getItem('lana_fce_cp');
      sessionStorage.removeItem('lana_fce_cp');
    } catch (e) {
      console.warn('[ChangePassword] Unable to read stashed temp password:', e && e.message);
    }

    const currentPasswordField = document.getElementById('currentPasswordField');
    const currentPasswordInput = document.getElementById('currentPassword');
    const hasCarriedPassword = typeof carriedCurrentPassword === 'string' && carriedCurrentPassword.length > 0;
    if (!hasCarriedPassword) {
      // Must ask the user for their current (temp) password.
      currentPasswordField.classList.remove('hidden');
      currentPasswordInput.setAttribute('required', 'required');
    }

    const form = document.getElementById('passwordChangeForm');
    const passwordInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirmPassword');
    const submitBtn = document.getElementById('submitBtn');

    // Show/hide password toggles
    document.querySelectorAll('.toggle-visibility').forEach((btn) => {
      btn.addEventListener('click', () => {
        const target = document.getElementById(btn.getAttribute('data-toggle'));
        if (target) target.type = target.type === 'password' ? 'text' : 'password';
      });
    });

    // Log out link — clears the session and returns to login.
    document.getElementById('logoutLink').addEventListener('click', async (e) => {
      e.preventDefault();
      try { await api.logout(); } catch (err) { console.warn('[ChangePassword] Logout failed:', err && err.message); }
      window.location.href = 'login.html';
    });

    // Password strength checker (cosmetic)
    passwordInput.addEventListener('input', () => {
      const password = passwordInput.value;
      let strength = 0;

      if (password.length >= 10) strength++;
      if (password.match(/[a-z]/) && password.match(/[A-Z]/)) strength++;
      if (password.match(/[0-9]/)) strength++;
      if (password.match(/[^a-zA-Z0-9]/)) strength++;

      const colors = ['bg-red-500', 'bg-orange-500', 'bg-yellow-500', 'bg-green-500'];
      const texts = ['Weak', 'Fair', 'Good', 'Strong'];

      for (let i = 1; i <= 4; i++) {
        const el = document.getElementById(`str${i}`);
        el.className = `h-1 flex-1 rounded ${i <= strength ? colors[strength - 1] : 'bg-gray-200'}`;
      }

      document.getElementById('strengthText').textContent = strength > 0 ? texts[strength - 1] : 'Enter a password';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const newPassword = passwordInput.value;
      const confirmPassword = confirmInput.value;
      const currentPassword = hasCarriedPassword ? carriedCurrentPassword : currentPasswordInput.value;

      if (!currentPassword) {
        Toast.error('Please enter your current password');
        return;
      }

      if (newPassword.length < 10) {
        Toast.error('New password must be at least 10 characters long');
        return;
      }

      if (newPassword !== confirmPassword) {
        Toast.error('New passwords do not match');
        return;
      }

      if (newPassword === currentPassword) {
        Toast.error('New password must be different from your current password');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Setting password...';

      try {
        await api.changePasswordSelf(currentPassword, newPassword);

        // Clear the flag on the locally cached user so subsequent guards and
        // page loads treat the account as fully signed in.
        try {
          const storedUser = JSON.parse(localStorage.getItem('user') || 'null');
          if (storedUser && typeof storedUser === 'object') {
            storedUser.mustChangePassword = false;
            localStorage.setItem('user', JSON.stringify(storedUser));
            if (window.api && api.user) api.user.mustChangePassword = false;
          }
        } catch (err) {
          console.warn('[ChangePassword] Unable to update cached user:', err && err.message);
        }

        document.getElementById('changeForm').classList.add('hidden');
        document.getElementById('successMessage').classList.remove('hidden');

        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 800);
      } catch (error) {
        Toast.error(error.message || 'Failed to change password. Please try again.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Set password & continue';
      }
    });
  </script>
  </div> <!-- End #app-content -->

  <!-- Lex UI core + loader (minimum for branded loader) -->
  <script src="js/lex/lex.core.js"></script>
  <script src="js/lex/components/foundation/lex-loader.js"></script>
  <script>
    // Dismiss branded loader once the page is ready
    (function () {
      function dismiss() {
        if (window.Lex && window.Lex.Loader) Lex.Loader.hide();
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', dismiss);
      } else {
        dismiss();
      }
    })();
  </script>
</body>
</html>
