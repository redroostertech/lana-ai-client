<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LANA AI</title>

  <!-- ── Design tokens & global CSS ── -->
  <link rel="stylesheet" href="css/lex-tokens.css">
  <link rel="stylesheet" href="css/components.css">

  <!-- ── Tailwind (existing loader) ── -->
  <script src="js/tailwind-loader.js"></script>

  <!-- ── Universal shell scripts (loaded once, never re-loaded) ── -->
  <script src="js/error-reporter.js"></script>
  <script src="js/config.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/components.js"></script>
  <script src="js/version.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/navigation-helpers.js"></script>
  <script src="js/new-project-modal.js"></script>
  <script src="js/conversation-menu.js"></script>
  <script src="js/conversation-search-modal.js"></script>
  <script src="js/contact-search-modal.js"></script>
  <script src="js/notifications.js"></script>

  <!-- ── Lex UI core ── -->
  <script src="js/lex/lex.core.js"></script>
  <script src="js/lex/lex.icons.js"></script>
  <script src="js/lex/lex.data.js"></script>
  <script src="js/lex/lex.forms.js"></script>
  <script src="js/lex/lex.state.js"></script>

  <!-- ── Lex UI foundation (loader used during startup) ── -->
  <script src="js/lex/components/foundation/lex-loader.js"></script>
  <script src="js/lex/components/foundation/lex-toast.js"></script>
  <script src="js/lex/components/foundation/lex-spinner.js"></script>

  <!-- ── Lex UI layout (sidebar + topbar must precede lex-app) ── -->
  <script src="js/lex/components/layout/lex-sidebar.js"></script>
  <script src="js/lex/components/layout/lex-topbar.js"></script>
  <script src="js/lex/components/layout/lex-conversation-item.js"></script>

  <!-- ── Shell + Router ── -->
  <script src="js/lex/components/layout/lex-app.js"></script>
  <script src="js/lex/lex-router.pages.js"></script>
  <script src="js/lex/lex-router.js"></script>

  <style>
    /* Ensure body has no flash before shell renders */
    html { scroll-behavior: auto; }
    body {
      font-family: var(--lex-font-sans);
      background: var(--lex-bg-secondary);
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }
  </style>
</head>
<body>

  <!-- Branded loader — shows immediately, hidden after first route loads -->
  <lex-loader theme="dark"></lex-loader>

  <!-- App shell — sidebar, topbar, content area -->
  <lex-app
    logo-src="img/logo-light.png"
    logo-alt="LANA AI"
    logo-href="index.html"
  ></lex-app>

  <noscript>
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,sans-serif;color:#666;">
      Please enable JavaScript to use LANA AI.
    </div>
  </noscript>

  <script>
    // Bootstrap: authenticate via Lex.state then start the router
    (function () {
      var app = document.querySelector('lex-app');
      if (!app) return;

      /**
       * Auth guard — verify the user has a valid (non-expired) token before
       * launching the SPA. Retries up to 3 times (300ms total) to handle the
       * race where Electron storage hasn't flushed to localStorage yet.
       *
       * Uses Lex.state as centralized auth state. On failure → redirect to
       * login.html (full reload, not routed).
       */
      function checkAuthWithRetry(retries) {
        if (retries === undefined) retries = 3;

        // Re-read from localStorage in case it wasn't ready when api.js loaded
        var token = localStorage.getItem('token');
        if (token && api) {
          api.token = token;
          api.user = JSON.parse(localStorage.getItem('user') || 'null');
          // Sync into Lex.state so all consumers see updated auth
          if (Lex.state) {
            Lex.state.setAuth(token, api.user);
          }
        }

        // Check 1: token must exist
        if (!Lex.state || !Lex.state.isAuthenticated) {
          if (retries > 0) {
            setTimeout(function () { checkAuthWithRetry(retries - 1); }, 100);
            return;
          }
          window.location.href = 'login.html';
          return;
        }

        // Check 2: token must not be expired
        if (Lex.state.isTokenExpired) {
          Lex.state.clearAuth();
          window.location.href = 'login.html';
          return;
        }

        // Auth is valid — proceed to start the app
        startApp();
      }

      function startApp() {
        app.addEventListener('lex-app-ready', function () {
          // Determine initial page from URL or default to dashboard
          var startPath = window.location.pathname || '/index.html';
          if (startPath === '/' || startPath === '' || startPath.endsWith('/app.html')) {
            startPath = '/index.html';
          }

          LexRouter.start(startPath);

          // Hide the branded loader after the first page renders AND its
          // initial data has loaded. We listen for lex-page-ready (content +
          // scripts injected) then wait for either lex-data-loaded (from
          // LexDataSource) or a 2-second timeout — whichever comes first.
          document.addEventListener('lex-page-ready', function onFirstPage() {
            document.removeEventListener('lex-page-ready', onFirstPage);

            var dismissed = false;
            function dismissLoader() {
              if (dismissed) return;
              dismissed = true;
              if (window.Lex && window.Lex.Loader) {
                window.Lex.Loader.hide();
              }
            }

            // If the page fires lex-data-loaded (LexDataSource fetch complete),
            // dismiss immediately — data is ready.
            document.addEventListener('lex-data-loaded', function onData() {
              document.removeEventListener('lex-data-loaded', onData);
              dismissLoader();
            });

            // Fallback: dismiss after 2 seconds regardless. Handles pages
            // with no LexDataSource, or if the API is slow.
            setTimeout(dismissLoader, 2000);
          });
        });
      }

      checkAuthWithRetry();
    })();
  </script>
</body>
</html>
