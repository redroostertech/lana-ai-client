<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - LANA AI</title>

  <!-- ── CSS + Tailwind in head — behavioral scripts at end of body ── -->
  <link rel="stylesheet" href="css/lex-tokens.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/session-tracking.css">
  <link rel="stylesheet" href="css/dashboard-command-center.css">
  <link rel="stylesheet" href="css/tailwind-output.css">
  <link rel="stylesheet" href="css/lana-heartbeat.css">
  <script src="js/tailwind-loader.js"></script>

</head>
<body>

  <!-- Branded loader — shows once lex-loader.js upgrades the element -->
  <lex-loader theme="light"></lex-loader>

  <!-- App shell — sidebar, topbar, empty content area.
       Page content lives in <template> below and gets injected after
       the shell renders. This avoids double-rendering of child components. -->
  <lex-app
    logo-src="img/logo-light.png"
    logo-alt="LANA AI"
    logo-href="dashboard.html"
    active-nav-id="dashboard"
    page-title="Dashboard"
  ></lex-app>

  <!-- Page content as inert <template> — elements inside are NOT upgraded
       by the browser until cloned into the live DOM. Zero double-rendering. -->
  <template id="page-content">

    <main>

      <!-- ================================================================
           Zone A — Morning Orientation Bar (full width)
           ================================================================ -->
      <lex-banner
        id="ccZoneA"
        variant="light"
        corners
        heading="Good morning, there"
        subtitle=""
      >
        <lex-btn id="ccZoneAMatters" variant="secondary">
          <span id="ccZoneAMattersCount">-</span> active matters
        </lex-btn>
      </lex-banner>


      <!-- ================================================================
           Zone E — Pipeline Intelligence (3 equal columns)
           ================================================================ -->
      <div class="cc-pipeline" id="ccZoneE">
        <lex-metric data-metric-key="team" label="Team Members" value="-" status="blue"></lex-metric>
        <lex-metric data-metric-key="docs" label="Total Documents" value="-" status="blue"></lex-metric>
        <lex-metric data-metric-key="storage" label="Storage Used" value="-" status="blue"></lex-metric>
      </div>

      <!-- Expandable detail panel (accordion — one open at a time) -->
      <lex-detail-panel id="ccDetailPanel"></lex-detail-panel>


      <!-- ================================================================
           Zones C + D row
           ================================================================ -->
      <div class="cc-action-row">

        <!-- Zone C — My Action Queue -->
        <div id="ccZoneC">
          <lex-card padding="compact">
            <div class="cc-section-header">
              <div>
                <div class="cc-section-title">My Action Queue</div>
                <div class="cc-section-subtitle">Most recent first</div>
              </div>
              <lex-btn id="ccZoneCViewAll" variant="ghost" size="sm">View all</lex-btn>
            </div>

            <!-- Loading state -->
            <div id="ccZoneCLoading">
              <lex-action-card title="Loading..." description="..." priority="medium" aria-hidden="true"></lex-action-card>
              <lex-action-card title="Loading..." description="..." priority="low" aria-hidden="true"></lex-action-card>
              <lex-action-card title="Loading..." description="..." priority="low" aria-hidden="true"></lex-action-card>
            </div>

            <!-- Content (rendered by JS) -->
            <div id="ccZoneCContent" class="hidden"></div>
          </lex-card>
        </div>

        <!-- Zone D — My Tasks -->
        <div id="ccZoneD">
          <lex-card padding="compact">
            <div class="cc-section-header">
              <div>
                <div class="cc-section-title">My Tasks</div>
                <div class="cc-section-subtitle">Today and outstanding work</div>
              </div>
              <lex-btn id="ccZoneDViewAll" variant="ghost" size="sm">View all</lex-btn>
            </div>

            <!-- Loading skeleton -->
            <div id="ccZoneDLoading">
              <div style="padding:16px;display:flex;flex-direction:column;gap:12px;">
                <div style="height:36px;background:var(--lex-bg-secondary);border-radius:6px;"></div>
                <div style="height:36px;background:var(--lex-bg-secondary);border-radius:6px;"></div>
              </div>
            </div>

            <!-- Content (rendered by JS) -->
            <div id="ccZoneDContent" class="hidden"></div>
          </lex-card>
        </div>

      </div>


      <!-- ================================================================
           Zone F row
           ================================================================ -->
      <div class="cc-signals-row">

        <!-- Zone F left — Activity Overview + Heatmap -->
        <div id="userProductivityWidget">
          <lex-card padding="compact">
            <div class="cc-section-header">
              <div class="flex items-start gap-2">
                <div>
                  <div class="cc-section-title">Activity Overview</div>
                  <div class="cc-section-subtitle">Last 90 days of organization activity</div>
                </div>
                <lex-btn id="activityHeatmapInfoBtn" variant="ghost" size="sm" icon aria-label="How to read the heatmap" title="How to read the heatmap" style="flex-shrink:0;">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M12 16v-4M12 8h.01"/>
                  </svg>
                </lex-btn>
              </div>
              <!-- User Filter Dropdown (Admins Only) -->
              <div id="activityUserFilterContainer" class="hidden">
                <lex-select
                  id="activityUserFilter"
                  placeholder="Filter by user"
                  options='[{"value":"me","label":"My Activity"},{"value":"all","label":"All Users"}]'
                  style="min-width:14rem;"
                ></lex-select>
              </div>
            </div>

            <!-- Stats summary -->
            <div class="flex items-center gap-4 mb-4 text-sm lex-text-secondary">
              <div>
                <span id="totalActivities" class="font-semibold lex-text-primary">-</span>
                activities in the last 90 days
              </div>
            </div>

            <!-- Side-by-side: Heatmap + Divider + Recent Activity feed -->
            <div class="cc-activity-split">

              <!-- Heatmap container -->
              <div class="cc-activity-split__heatmap">
                <div id="activityHeatmapSkeleton" class="cc-heatmap-skeleton">
                  <div class="cc-heatmap-skeleton__labels">
                    <span class="cc-skeleton cc-skeleton--text-sm" style="width:1.75rem;"></span>
                    <span class="cc-skeleton cc-skeleton--text-sm" style="width:1.75rem;"></span>
                    <span class="cc-skeleton cc-skeleton--text-sm" style="width:1.75rem;"></span>
                  </div>
                  <div class="cc-heatmap-skeleton__grid" aria-hidden="true"></div>
                  <div class="cc-heatmap-skeleton__legend">
                    <span class="cc-skeleton cc-skeleton--text-sm" style="width:2rem;"></span>
                    <span class="cc-heatmap-skeleton__dot"></span>
                    <span class="cc-heatmap-skeleton__dot"></span>
                    <span class="cc-heatmap-skeleton__dot"></span>
                    <span class="cc-heatmap-skeleton__dot"></span>
                    <span class="cc-heatmap-skeleton__dot"></span>
                    <span class="cc-skeleton cc-skeleton--text-sm" style="width:2rem;"></span>
                  </div>
                </div>
                <div id="activityHeatmapContainer" class="w-full min-w-0"></div>
              </div>

              <lex-divider direction="vertical" spacing="sm" class="cc-activity-split__divider"></lex-divider>

              <!-- Recent Activity feed -->
              <div class="cc-activity-split__feed flex flex-col">
                <div class="mb-3 flex items-center justify-between">
                  <span class="text-sm font-semibold lex-text-primary">Recent Activity</span>
                  <div class="flex items-center gap-2">
                    <lex-btn id="refreshActivityFeedBtn" variant="ghost" size="sm" aria-label="Refresh activity feed" title="Refresh">
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                      </svg>
                    </lex-btn>
                    <lex-btn id="viewAllActivityHeaderBtn" variant="ghost" size="sm">View all</lex-btn>
                  </div>
                </div>

                <!-- Loading skeleton -->
                <div id="activityFeedLoading" class="divide-y" style="border-color:var(--lex-border-subtle);">
                  <div class="py-3 animate-pulse">
                    <div class="flex items-start gap-3">
                      <div class="w-8 h-8 cc-skeleton rounded-full flex-shrink-0"></div>
                      <div class="flex-1">
                        <div class="cc-skeleton cc-skeleton--text-sm" style="width:75%;margin-bottom:0.25rem;"></div>
                        <div class="cc-skeleton cc-skeleton--text-sm" style="width:50%;"></div>
                      </div>
                    </div>
                  </div>
                  <div class="py-3 animate-pulse">
                    <div class="flex items-start gap-3">
                      <div class="w-8 h-8 cc-skeleton rounded-full flex-shrink-0"></div>
                      <div class="flex-1">
                        <div class="cc-skeleton cc-skeleton--text-sm" style="width:60%;margin-bottom:0.25rem;"></div>
                        <div class="cc-skeleton cc-skeleton--text-sm" style="width:40%;"></div>
                      </div>
                    </div>
                  </div>
                  <div class="py-3 animate-pulse">
                    <div class="flex items-start gap-3">
                      <div class="w-8 h-8 cc-skeleton rounded-full flex-shrink-0"></div>
                      <div class="flex-1">
                        <div class="cc-skeleton cc-skeleton--text-sm" style="width:80%;margin-bottom:0.25rem;"></div>
                        <div class="cc-skeleton cc-skeleton--text-sm" style="width:45%;"></div>
                      </div>
                    </div>
                  </div>
                </div>

                <div
                  id="activityFeed"
                  class="hidden divide-y max-h-80 overflow-y-auto"
                  style="border-color:var(--lex-border-subtle);"
                ></div>
              </div>

            </div>
          </lex-card>
        </div>

        <!-- Zone F center — Billable Hours Today -->
        <div id="ccZoneFBillable">
          <lex-card padding="compact">
            <div class="cc-section-header">
              <div>
                <div class="cc-section-title">Billable Hours</div>
                <div class="cc-section-subtitle">Today's tracked time</div>
              </div>
            </div>

            <!-- Loading skeleton -->
            <div id="billableHoursLoading" class="animate-pulse" style="padding:0.5rem 0;">
              <div class="cc-skeleton" style="width:40%;height:2rem;margin-bottom:0.75rem;"></div>
              <div class="cc-skeleton cc-skeleton--text-sm" style="width:70%;margin-bottom:0.5rem;"></div>
              <div class="cc-skeleton cc-skeleton--text-sm" style="width:55%;margin-bottom:0.5rem;"></div>
              <div class="cc-skeleton cc-skeleton--text-sm" style="width:60%;"></div>
            </div>

            <!-- Content -->
            <div id="billableHoursContent" class="hidden">
              <div style="margin-bottom:0.75rem;">
                <span id="billableTotalHours" style="font-size:1.5rem;font-weight:700;color:var(--lex-text-primary);">0.0</span>
                <span style="font-size:0.875rem;color:var(--lex-text-muted);margin-left:0.25rem;">hours</span>
              </div>

              <!-- Per-matter breakdown -->
              <div id="billableMatterList" style="display:flex;flex-direction:column;gap:0.375rem;max-height:12rem;overflow-y:auto;">
              </div>

              <!-- Draft entries list -->
              <div id="billableDraftsList" style="margin-top:0.75rem;padding-top:0.5rem;border-top:1px solid var(--lex-border-subtle,#e5e7eb);display:flex;flex-direction:column;gap:0.25rem;max-height:16rem;overflow-y:auto;">
              </div>

              <!-- Drafts summary -->
              <div id="billableDraftsInfo" style="margin-top:0.5rem;font-size:0.8rem;color:var(--lex-text-muted);">
              </div>
            </div>
          </lex-card>
        </div>

        <!-- Zone F right — Data Pulse -->
        <div id="ccZoneFRight">
          <lex-card padding="compact">
            <div class="cc-section-header">
              <div>
                <div class="cc-section-title">Data Pulse</div>
                <div class="cc-section-subtitle">Connected integrations</div>
              </div>
              <lex-btn id="addWidgetBtn" variant="ghost" size="sm">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M12 5v14M5 12h14"/>
                </svg>
                Add
              </lex-btn>
            </div>

            <div id="ccZoneFRightLoading">
              <div class="cc-connector-row" aria-hidden="true">
                <div class="cc-skeleton cc-skeleton--text-sm" style="width:40%;"></div>
                <div class="cc-skeleton" style="width:0.5rem;height:0.5rem;border-radius:9999px;"></div>
              </div>
              <div class="cc-connector-row" aria-hidden="true">
                <div class="cc-skeleton cc-skeleton--text-sm" style="width:55%;"></div>
                <div class="cc-skeleton" style="width:0.5rem;height:0.5rem;border-radius:9999px;"></div>
              </div>
              <div class="cc-connector-row" aria-hidden="true">
                <div class="cc-skeleton cc-skeleton--text-sm" style="width:45%;"></div>
                <div class="cc-skeleton" style="width:0.5rem;height:0.5rem;border-radius:9999px;"></div>
              </div>
            </div>

            <div id="ccZoneFRightContent" class="hidden"></div>

            <div id="widgetGrid" class="hidden mt-4 grid grid-cols-1 gap-4"></div>
          </lex-card>
        </div>

      </div>

      <!-- Hidden elements — backward-compat with existing JS -->
      <div id="statsLoading" class="hidden" aria-hidden="true"></div>
      <div id="statsContent" class="hidden" aria-hidden="true">
        <span id="statMatters"></span>
        <span id="statMattersLabel"></span>
        <div id="mattersBreakdown" class="hidden"><span id="mattersBreakdownText"></span></div>
        <div id="statUsersCard" class="hidden">
          <span id="statUsers"></span>
          <div id="userBreakdown" class="hidden">
            <span id="activeUsers"></span>
            <span id="otherUsers"></span>
          </div>
        </div>
        <span id="statDocuments"></span>
        <div id="documentBreakdown" class="hidden">
          <span id="activeDocuments"></span>
          <span id="deletedDocuments"></span>
        </div>
        <div id="statStorageCard" class="hidden">
          <span id="statStorage"></span>
          <span id="storageUsagePercent"></span>
          <span id="storageRemaining"></span>
          <div id="storageBreakdown" class="hidden">
            <span id="databaseStorage"></span>
            <div id="volumeStorageList"></div>
          </div>
        </div>
      </div>

      <div id="globalSearchSection" class="hidden" aria-hidden="true">
        <input type="text" id="globalSearchInput" autocomplete="off">
        <button type="button" id="globalSearchBtn"></button>
      </div>

      <section id="commandCenterWidgets" class="hidden" aria-hidden="true"></section>

      <div id="activity-heatmap-tooltip" style="position:absolute;display:none;background-color:rgba(0,0,0,0.9);color:white;padding:8px 12px;border-radius:6px;font-size:12px;pointer-events:none;z-index:1000;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.15);"></div>

    </main>


    <!-- Activity Slide-out Panel -->
    <lex-drawer id="activityPanel" heading="Activity" width="md" side="right">
      <div id="activityList" class="flex-1 overflow-y-auto">
        <div id="activityLoading" class="p-8 text-center">
          <lex-spinner label="Loading activity..."></lex-spinner>
        </div>
      </div>
      <div id="activityLoadingMore" class="hidden p-4 border-t text-center" style="border-color:var(--lex-border-subtle);">
        <lex-spinner size="sm"></lex-spinner>
      </div>
    </lex-drawer>

    <!-- Activity Heatmap Info Modal -->
    <lex-modal id="activityHeatmapInfoModal" heading="Understanding the Activity Overview" size="lg" hide-actions>
      <div class="space-y-6">
        <div>
          <h3 class="text-sm font-semibold lex-text-primary mb-2">What is this?</h3>
          <p class="text-sm lex-text-secondary leading-relaxed">The Activity Overview is a calendar-style chart that shows <strong>when your organization was active</strong> over the last 90 days. Each small square represents one day; the color shows how much activity happened that day.</p>
        </div>
        <div>
          <h3 class="text-sm font-semibold lex-text-primary mb-2">Why does it matter?</h3>
          <p class="text-sm lex-text-secondary leading-relaxed">It helps you spot patterns at a glance: which days of the week are busiest, whether activity is steady or concentrated in certain weeks, and how engagement has changed over time.</p>
        </div>
        <div>
          <h3 class="text-sm font-semibold lex-text-primary mb-2">How we track activity</h3>
          <p class="text-sm lex-text-secondary leading-relaxed mb-2">Activity is counted from usage across your whole organization. Each time someone in your org uses LANA (conversations, documents, searches, and other interactions), that counts as activity. The chart adds up all of these actions per day.</p>
          <p class="text-sm lex-text-secondary leading-relaxed">The numbers you see are <strong>total activity events</strong> for that day, not unique users.</p>
        </div>
        <div>
          <h3 class="text-sm font-semibold lex-text-primary mb-2">What am I looking at?</h3>
          <ul class="text-sm lex-text-secondary space-y-2 list-disc pl-5">
            <li><strong class="lex-text-primary">Rows.</strong> Each row is a day of the week (Sunday at the top through Saturday at the bottom).</li>
            <li><strong class="lex-text-primary">Columns.</strong> Each column is one week. Time runs left to right.</li>
            <li><strong class="lex-text-primary">Colors.</strong> Each square's color shows how much activity happened that day.</li>
          </ul>
        </div>
        <div>
          <h3 class="text-sm font-semibold lex-text-primary mb-2">Color scale</h3>
          <ul class="text-sm lex-text-secondary space-y-1.5 list-disc pl-5">
            <li><strong class="lex-text-primary">Light gray:</strong> No activity (0 events)</li>
            <li><strong class="lex-text-primary">Light green:</strong> Low activity (1 to 4 events)</li>
            <li><strong class="lex-text-primary">Medium green:</strong> Moderate activity (5 to 9 events)</li>
            <li><strong class="lex-text-primary">Dark green:</strong> High activity (10 to 14 events)</li>
            <li><strong class="lex-text-primary">Darkest green:</strong> Very high activity (15 or more events)</li>
          </ul>
        </div>
      </div>
    </lex-modal>

  </template>

  <noscript>
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,sans-serif;color:#666;">
      Please enable JavaScript to use LANA AI.
    </div>
  </noscript>

  <!-- ══════════════════════════════════════════════════════════════════
       Scripts at end of body — HTML renders first, scripts load after
       ══════════════════════════════════════════════════════════════════ -->

  <!-- Universal shell scripts -->
  <script src="js/error-reporter.js"></script>
  <script src="js/config.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/components.js"></script>
  <script src="js/version.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/navigation-helpers.js"></script>
  <script src="js/new-project-modal.js"></script>
  <script src="js/conversation-menu.js"></script>
  <script src="js/conversation-search-modal.js"></script>
  <script src="js/contact-search-modal.js"></script>
  <script src="js/notifications.js"></script>

  <!-- Lex UI core -->
  <script src="js/lex/lex.core.js"></script>
  <script src="js/lex/lex.icons.js"></script>
  <script src="js/lex/lex.data.js"></script>
  <script src="js/lex/lex.forms.js"></script>
  <script src="js/lex/lex.state.js"></script>
  <script src="js/lex/lex.utils.js"></script>
  <script src="js/lex/lex.auth.js"></script>
  <script src="js/lex/lex-nav.js"></script>

  <!-- Lex UI layout (shell components — lex-app builds sidebar/topbar) -->
  <script src="js/lex/components/foundation/lex-loader.js"></script>
  <script src="js/lex/components/foundation/lex-toast.js"></script>
  <script src="js/lex/components/foundation/lex-spinner.js"></script>
  <script src="js/lex/components/foundation/lex-btn.js"></script>
  <script src="js/lex/components/foundation/lex-empty.js"></script>
  <script src="js/lex/components/form/lex-segmented.js"></script>
  <script src="js/lex/components/layout/lex-sidebar.js"></script>
  <script src="js/lex/components/layout/lex-topbar.js"></script>
  <script src="js/lex/components/layout/lex-conversation-item.js"></script>
  <script src="js/lex/components/layout/lex-notification-panel.js"></script>
  <script src="js/lex/components/layout/lex-app.js"></script>

  <!-- Page-specific Lex components — ALL loaded BEFORE inject so custom elements
       are defined when template content enters the DOM. Tree-order upgrade ensures
       parents capture un-rendered children (no double-rendering). -->
  <script src="js/lex/components/foundation/lex-banner.js"></script>
  <script src="js/lex/components/foundation/lex-metric.js"></script>
  <script src="js/lex/components/foundation/lex-action-card.js"></script>
  <script src="js/lex/components/foundation/lex-badge.js"></script>
  <script src="js/lex/components/foundation/lex-stack.js"></script>
  <script src="js/lex/components/foundation/lex-text.js"></script>
  <script src="js/lex/components/foundation/lex-modal.js"></script>
  <script src="js/lex/components/foundation/lex-drawer.js"></script>
  <script src="js/lex/components/foundation/lex-card.js"></script>
  <script src="js/lex/components/foundation/lex-divider.js"></script>
  <script src="js/lex/components/foundation/lex-detail-panel.js"></script>
  <script src="js/lex/components/form/lex-select.js"></script>

  <!-- Inject page content + hoist modals -->
  <script src="js/lex/lex-page-init.js"></script>

  <!-- Page dependencies -->
  <script src="js/utils/event-display-names.js"></script>
  <script src="js/services/feature-tracker.js"></script>
  <script src="js/activity.js"></script>
  <script src="js/activity-heatmap.js"></script>
  <script src="js/vendor/chart.js"></script>
  <script src="js/dashboard/widget-renderer.js"></script>
  <script src="js/dashboard/widget-config-modal.js"></script>
  <script src="js/dashboard/widgets/metric-card.widget.js"></script>
  <script src="js/dashboard/widgets/data-table.widget.js"></script>
  <script src="js/dashboard/widgets/chart.widget.js"></script>
  <script src="js/dashboard/widgets/activity-feed.widget.js"></script>
  <script src="js/dashboard/widgets/matter-summary.widget.js"></script>
  <script src="js/dashboard/widgets/connector-status.widget.js"></script>
  <script src="js/dashboard/widgets/module-metric.widget.js"></script>
  <script src="js/dashboard/widgets/alert-list.widget.js"></script>
  <script src="js/dashboard/widgets/billable-hours.widget.js"></script>
  <script src="js/services/session-tracking-service.js"></script>

  <!-- Heartbeat indicator (topbar button + modal) -->
  <script src="js/dashboard/heartbeat.js"></script>

  <!-- Page controller (MUST be last before auth-guard) -->
  <script src="js/dashboard/dashboard.js"></script>

  <!-- Auth guard + loader dismiss (MUST be last) -->
  <script src="js/auth-guard.js"></script>
</body>
</html>
