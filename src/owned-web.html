<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owned Web - LANA AI</title>
  <link rel="stylesheet" href="css/lex-tokens.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/tailwind-output.css">
  <link rel="stylesheet" href="css/owned-web.css">
  <script src="js/tailwind-loader.js"></script>
  <script src="js/config.js"></script>
  <script src="js/time-utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/menu.js"></script>
</head>
<body>
  <lex-loader theme="light"></lex-loader>
  <lex-app
    logo-src="img/logo-light.png"
    logo-alt="LANA AI"
    logo-href="dashboard.html"
    active-nav-id="owned-web"
    page-title="Owned Web"
  ></lex-app>

  <template id="page-content">
    <main class="owned-web-page">
      <section class="owned-web-panel" aria-labelledby="owned-web-health-title">
        <div class="owned-web-toolbar">
          <div>
            <h2 id="owned-web-health-title">Owned Web Health</h2>
            <div class="owned-web-muted">Mode <span id="owned-web-mode">unknown</span> | Status <span id="owned-web-master">unknown</span></div>
          </div>
          <button type="button" id="owned-web-health-refresh" class="owned-web-button">Refresh</button>
        </div>
        <div id="owned-web-health-grid" class="owned-web-status-grid" aria-live="polite"></div>
      </section>

      <div class="owned-web-grid">
        <section class="owned-web-panel" aria-labelledby="owned-web-search-title">
          <h2 id="owned-web-search-title">Search and Read</h2>
          <form id="owned-web-search-form" class="owned-web-row">
            <input id="owned-web-query" class="owned-web-input" type="search" maxlength="500" placeholder="Search query" required>
            <button type="submit" class="owned-web-button primary">Search</button>
          </form>
          <div id="owned-web-results" class="owned-web-list" aria-live="polite"></div>
        </section>

        <section class="owned-web-panel" aria-labelledby="owned-web-document-title">
          <div class="owned-web-toolbar">
            <h2 id="owned-web-document-title">No document</h2>
            <button type="button" id="owned-web-ingest-current" class="owned-web-button">Add to LANA</button>
            <span id="owned-web-ingest-status" class="owned-web-muted"></span>
          </div>
          <div id="owned-web-provenance" class="owned-web-provenance"></div>
          <pre id="owned-web-markdown" class="owned-web-markdown"></pre>
        </section>
      </div>

      <div class="owned-web-grid">
        <section class="owned-web-panel" aria-labelledby="owned-web-crawl-title">
          <div class="owned-web-toolbar">
            <h2 id="owned-web-crawl-title">Crawl Management</h2>
            <button type="button" id="owned-web-crawl-refresh" class="owned-web-button">Refresh</button>
          </div>
          <form id="owned-web-crawl-form" class="owned-web-list">
            <input id="owned-web-crawl-seed" class="owned-web-input" type="url" placeholder="Seed URL" required>
            <div class="owned-web-row">
              <input id="owned-web-crawl-depth" class="owned-web-input" type="number" min="0" max="10" value="1" aria-label="Depth">
              <input id="owned-web-crawl-pages" class="owned-web-input" type="number" min="1" max="1000" value="25" aria-label="Pages">
              <button type="submit" class="owned-web-button primary">Start Crawl</button>
            </div>
          </form>
          <div id="owned-web-crawl-status" aria-live="polite"></div>
        </section>

        <section class="owned-web-panel" aria-labelledby="owned-web-crawl-results-title">
          <h2 id="owned-web-crawl-results-title">Crawl Results</h2>
          <div id="owned-web-crawl-results" class="owned-web-list"></div>
        </section>
      </div>

      <div class="owned-web-grid">
        <section class="owned-web-panel" aria-labelledby="owned-web-browser-title">
          <h2 id="owned-web-browser-title">Browser Task</h2>
          <div class="owned-web-row">
            <select id="owned-web-browser-target" class="owned-web-select">
              <option value="server_isolated">Server isolated</option>
              <option value="desktop_local">Desktop local</option>
            </select>
            <input id="owned-web-browser-url" class="owned-web-input" type="url" placeholder="URL">
          </div>
          <div class="owned-web-row">
            <button type="button" id="owned-web-browser-open" class="owned-web-button primary">Open Session</button>
            <button type="button" id="owned-web-browser-snapshot-btn" class="owned-web-button">Snapshot</button>
          </div>
          <div class="owned-web-muted">Session <span id="owned-web-session">No session</span></div>
          <input id="owned-web-submit-selector" class="owned-web-input" type="text" value="form button[type=&quot;submit&quot;]" aria-label="Submit selector">
          <button type="button" id="owned-web-preview-submit" class="owned-web-button">Preview Submit</button>
        </section>

        <section class="owned-web-panel" aria-labelledby="owned-web-approval-title">
          <h2 id="owned-web-approval-title">Approval</h2>
          <div id="owned-web-approval"></div>
          <pre id="owned-web-browser-snapshot" class="owned-web-markdown"></pre>
        </section>
      </div>
    </main>
  </template>

  <script src="js/lex/lex.core.js"></script>
  <script src="js/lex/lex.icons.js"></script>
  <script src="js/lex/lex.data.js"></script>
  <script src="js/lex/lex.forms.js"></script>
  <script src="js/lex/lex.state.js"></script>
  <script src="js/lex/lex.utils.js"></script>
  <script src="js/lex/lex.auth.js"></script>
  <script src="js/lex/lex-nav.js"></script>
  <script src="js/lex/components/foundation/lex-loader.js"></script>
  <script src="js/lex/components/foundation/lex-toast.js"></script>
  <script src="js/lex/components/foundation/lex-btn.js"></script>
  <script src="js/lex/components/layout/lex-sidebar.js"></script>
  <script src="js/lex/components/layout/lex-topbar.js"></script>
  <script src="js/lex/components/layout/lex-notification-panel.js"></script>
  <script src="js/lex/components/layout/lex-app.js"></script>
  <script src="js/lex/lex-page-init.js"></script>
  <script src="js/owned-web.js"></script>
  <script src="js/auth-guard.js"></script>
</body>
</html>
