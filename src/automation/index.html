<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LANA Automation</title>
  <!-- Lex UI framework from lana-client -->
  <link rel="stylesheet" href="../css/tailwind-output.css">
  <script src="../js/tailwind-loader.js"></script>
  <link rel="stylesheet" href="../css/lex-tokens.css">
  <link rel="stylesheet" href="../css/lex-chat.css">
  <link rel="stylesheet" href="../css/lex-motion.css">
  <link rel="stylesheet" href="../css/app-walkthrough.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <lex-app
    id="automation-shell"
    logo-src="../img/logo-light.png"
    logo-alt="LANA AI"
    logo-href="../dashboard.html"
    active-nav-id="library"
    page-title="Library"
  ></lex-app>

  <div id="automation-modals">
    <lex-modal id="template-modal" heading="Automation Template" size="lg" class="automation-modal">
      <div class="automation-modal-body">
        <p id="template-modal-description" class="template-modal-description"></p>

        <div class="template-modal-recommended">
          <span class="template-modal-recommended-icon">!</span>
          <span id="template-modal-recommended"></span>
        </div>

        <div class="template-modal-section">
          <h3>App Types That Can Be Used</h3>
          <div id="template-modal-apps" class="template-modal-apps"></div>
        </div>

        <div class="template-modal-section">
          <h3>How It Works</h3>
          <ol id="template-modal-steps" class="template-modal-steps"></ol>
        </div>
      </div>
      <lex-btn data-slot="footer" id="template-modal-try" variant="primary" size="md" data-template-try>Try It</lex-btn>
    </lex-modal>

    <lex-modal id="check-data-modal" heading="Check Data Readiness" size="lg" class="automation-modal">
      <div class="automation-modal-body">
        <p id="check-data-modal-description" class="template-modal-description"></p>

        <div class="template-modal-section">
          <h3>Connector Hints</h3>
          <div id="check-data-modal-hints" class="template-modal-apps"></div>
        </div>

        <div class="template-modal-section">
          <h3>Why This Matters</h3>
          <ol id="check-data-modal-steps" class="template-modal-steps"></ol>
        </div>
      </div>
      <lex-btn data-slot="footer" id="check-data-modal-go" variant="primary" size="md" data-check-data-go>Open Data Connectors</lex-btn>
    </lex-modal>

  </div>

  <!-- Canonical lana-ai-client API + auth -->
  <script src="../js/config.js"></script>
  <script src="../js/version.js"></script>
  <script src="../js/time-utils.js"></script>
  <script src="../js/shared/request-retry.js"></script>
  <script src="../js/api.js"></script>

  <!-- Lex UI core -->
  <script src="../js/lex/lex.core.js"></script>
  <script src="../js/lex/lex.icons.js"></script>
  <script src="../js/lex/lex.utils.js"></script>
  <script src="../js/lex/lex.data.js"></script>
  <script src="../js/lex/lex.forms.js"></script>
  <script src="../js/lex/lex.state.js"></script>
  <script src="../js/lex/lex-nav.js"></script>
  <!-- lex-modal before lex-btn: the modal clones its children on upgrade, so footer lex-btns must still be un-upgraded -->
  <script src="../js/lex/components/foundation/lex-modal.js"></script>
  <script src="../js/lex/components/foundation/lex-btn.js"></script>
  <script src="../js/lex/components/foundation/lex-card.js"></script>
  <script src="../js/lex/components/foundation/lex-action-card.js"></script>
  <script src="../js/lex/components/foundation/lex-badge.js"></script>
  <script src="../js/lex/components/foundation/lex-empty.js"></script>
  <script src="../js/lex/components/foundation/lex-breadcrumb.js"></script>
  <script src="../js/lex/components/foundation/lex-banner.js"></script>
  <script src="../js/vendor/lottie_light.min.js"></script>
  <script src="../js/lex/brand/lex-brand-animations.js"></script>
  <script src="../js/lex/components/foundation/lex-brand-mark.js"></script>
  <script src="../js/lex/components/layout/lex-app-hero.js"></script>
  <script src="../js/lex/components/layout/lex-app-loop.js"></script>
  <script src="../js/lex/components/layout/lex-walkthrough.js"></script>
  <script src="../js/shared/app-walkthrough.js"></script>
  <script src="../js/walkthroughs/automate-walkthrough.js"></script>
  <script src="../js/lex/components/foundation/lex-drawer.js"></script>
  <script src="../js/lex/components/form/lex-input.js"></script>
  <script src="../js/lex/components/form/lex-select.js"></script>
  <script src="../js/lex/components/data/lex-table.js"></script>
  <script src="../js/lex/components/data/lex-filter-bar.js"></script>
  <script src="../js/lex/components/data/lex-pagination.js"></script>
  <script src="../js/lex/components/layout/lex-sidebar.js"></script>
  <script src="../js/lex/components/layout/lex-topbar.js"></script>
  <script src="../js/lex/components/layout/lex-notification-panel.js"></script>
  <script src="../js/lex/components/layout/lex-app.js"></script>
  <script src="../js/lex/chat/lex-chat.composer-mentions.js"></script>
  <script src="../js/services/slash-commands.service.js"></script>
  <script src="../js/lex/chat/lex-chat.composer-slash.js"></script>
  <script src="../js/lex/chat/lex-chat.composer.js"></script>
  <script src="../js/lex/index.js"></script>
  <script src="../js/shared/event-catalog.js"></script>
  <script src="../js/shared/event-browser.js"></script>
  <script src="../js/sidebar-footer-hydrate.js"></script>
  <lex-lana-dock page-scope="automations" context-type="full_chat" placeholder="Ask about your automations..." thread-title="LANA Chat"></lex-lana-dock>
  <!-- LANA dock (IDE-style docked chat panel) -->
  <script src="../js/lex/chat/lex-chat.format.js"></script>
  <script src="../js/lex/chat/lex-chat.conversations-api.js"></script>
  <script src="../js/lex/chat/lex-chat.source.js"></script>
  <script src="../js/lex/chat/lex-chat.message.js"></script>
  <script src="../js/lex/chat/lex-chat-progress-events.js"></script>
  <script src="../js/lex/chat/lex-chat.activity.js"></script>
  <script src="../js/lex/chat/lex-chat.documents.js"></script>
  <script src="../js/lex/chat/lex-chat.thread.js"></script>
  <script src="../js/lex/chat/lex-chat.threads.js"></script>
  <script src="../js/lex/chat/lex-chat.js"></script>
  <script src="../js/lex/chat/lex-dynamic-card.renderer.js"></script>
  <script src="../js/lex/chat/lex-agentic-plan-card.js"></script>
  <script src="../js/lex/chat/lex-chat.index.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/lex/components/chat/lex-lana-panel.js"></script>
  <script src="../js/lex/components/layout/lex-lana-dock.js"></script>
  <script src="../js/auth-guard.js"></script>
  <script src="../js/shared/library-column-filters.js"></script>
  <script src="./js/shared/table-queries.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
