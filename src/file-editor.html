<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Editor - LANA AI</title>

  <link rel="stylesheet" href="css/lex-tokens.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/lex-chat.css">
  <link rel="stylesheet" href="css/file-editor.css">
  <link rel="stylesheet" href="css/tailwind-output.css">
  <link rel="stylesheet" href="css/companion-bridge-consent.css">
  <script src="js/tailwind-loader.js"></script>
</head>
<body>
  <lex-loader theme="light"></lex-loader>

  <lex-app
    logo-src="img/logo-light.png"
    logo-alt="LANA AI"
    logo-href="dashboard.html"
    active-nav-id="document-library"
    page-title="File Editor"
  ></lex-app>

  <template id="page-content">
    <main class="office-shell file-editor-shell">
      <section class="office-workspace file-editor-workspace">
        <header class="office-editor-bar">
          <div class="office-editor-bar-main">
            <div class="office-title-group">
              <input id="officeFileTitle" class="office-title-input" type="text" aria-label="File title" autocomplete="off">
              <span id="officeFileMeta" class="office-file-meta" role="status" aria-live="polite"></span>
            </div>
            <div class="office-toolbar" role="toolbar" aria-label="File actions">
              <button class="office-icon-btn" type="button" data-action="save" title="Save" aria-label="Save">
                <span data-icon="save"></span>
              </button>
              <button class="office-btn" type="button" data-action="share">
                <span data-icon="share-2" aria-hidden="true"></span>
                <span>Share</span>
              </button>
              <button class="office-icon-btn" type="button" data-action="export" title="Download current document" aria-label="Download current document">
                <span data-icon="download"></span>
              </button>
              <button class="office-btn office-btn-primary" type="button" data-action="sign">
                <span data-icon="send" aria-hidden="true"></span>
                <span>Prepare for signature</span>
              </button>
              <button class="office-icon-btn" type="button" data-action="show-review-details" title="File info" aria-label="File info">
                <span data-icon="info"></span>
              </button>
            </div>
          </div>
          <div class="office-mode-tabs" role="tablist" aria-label="File editor views">
            <button id="officeEditorTab" class="is-active" type="button" role="tab" data-panel="editor" aria-selected="true" aria-controls="officeEditorPanel" tabindex="0">Editor</button>
            <button id="officeCollaborationTab" type="button" role="tab" data-panel="collaboration" aria-selected="false" aria-controls="officeCollabPanel" tabindex="-1">Collaboration</button>
            <button id="officeSignaturesTab" type="button" role="tab" data-panel="signatures" aria-selected="false" aria-controls="officeSignaturePanel" tabindex="-1">Sign</button>
          </div>
          <div id="officeContextToolbarHost" class="office-context-toolbar-host" aria-label="Editor tools"></div>
        </header>

        <section class="office-editor" aria-label="Office editor">

          <div id="officeEditorPanel" class="office-panel is-active" role="tabpanel" aria-labelledby="officeEditorTab" tabindex="0" aria-live="polite"></div>

          <div id="officeCollabPanel" class="office-panel" role="tabpanel" aria-labelledby="officeCollaborationTab" tabindex="0" hidden>
            <div class="office-data-placeholder" role="status" aria-live="polite">Loading collaboration&hellip;</div>
          </div>

          <div id="officeSignaturePanel" class="office-panel" role="tabpanel" aria-labelledby="officeSignaturesTab" tabindex="0" hidden>
            <div class="office-data-placeholder" role="status" aria-live="polite">Loading signatures&hellip;</div>
          </div>
          <input id="officeCsvImport" type="file" accept=".csv,text/csv" hidden>
        </section>

        <aside id="officeReviewRailHost" class="office-review-dock is-hidden" aria-label="Document review"></aside>

        <footer id="officeEditorStatusBar" class="office-editor-status-bar" aria-label="Document status">
          <span class="office-editor-status-details">
            <span id="officeSaveStatus" class="office-editor-save-status" role="status" aria-live="polite">Loading document status&hellip;</span>
            <span id="officeEditorEngineStatus" class="office-editor-engine-status" role="status" aria-live="polite">Loading editor&hellip;</span>
          </span>
          <span class="office-editor-document-counts" aria-label="Document counts">
            <span id="officePageCount">Pages &mdash;</span>
            <span id="officeWordCount">Words &mdash;</span>
            <span id="officeCharacterCount">Characters &mdash;</span>
            <span id="officeTokenCount">Tokens &mdash;</span>
            <span id="officeParagraphCount">Paragraphs &mdash;</span>
            <span id="officeReadingTime">Reading time &mdash;</span>
          </span>
          <span id="officeReviewFooterAction" class="office-editor-review-action" hidden>
            <button id="officeReviewReleaseButton" class="office-review-release-btn" type="button" data-action="release-review-version" disabled aria-disabled="true">Release Version</button>
          </span>
        </footer>
      </section>

    </main>
  </template>

  <lex-lana-dock
    page-scope="file-editor"
    context-type="document_chat"
    default-tool="document_chat"
    placeholder="Ask LANA about this document..."
    thread-title="Document Chat"
  ></lex-lana-dock>

  <noscript>
    <div class="office-noscript">
      Please enable JavaScript to use LANA AI.
    </div>
  </noscript>

  <script src="js/error-reporter.js"></script>
  <script src="js/config.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/time-utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/components.js"></script>
  <script src="js/version.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/navigation-helpers.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/lex/lex.core.js"></script>
  <script src="js/lex/lex.icons.js"></script>
  <script src="js/lex/lex.data.js"></script>
  <script src="js/lex/lex.forms.js"></script>
  <script src="js/lex/lex.state.js"></script>
  <script src="js/lex/lex.utils.js"></script>
  <script src="js/lex/lex.auth.js"></script>
  <script src="js/lex/lex-nav.js"></script>
  <script src="js/lex/components/foundation/lex-loader.js"></script>
  <script src="js/lex/components/foundation/lex-toast.js"></script>
  <script src="js/lex/components/foundation/lex-btn.js"></script>
  <script src="js/lex/components/foundation/lex-drawer.js"></script>
  <script src="js/lex/components/foundation/lex-modal.js"></script>
  <script src="js/app-catalog.js"></script>
  <script src="js/lex/components/layout/lex-sidebar.js"></script>
  <script src="js/lex/components/layout/lex-topbar.js"></script>
  <script src="js/lex/components/layout/lex-conversation-item.js"></script>
  <script src="js/lex/components/layout/lex-notification-panel.js"></script>
  <script src="js/lex/components/layout/lex-app.js"></script>
  <script src="js/lex/lex-page-init.js"></script>
  <script src="js/file-editor/writer-tools.js"></script>
  <script src="js/file-editor/sheet-engine.js"></script>
  <script src="js/services/document-review-api.service.js"></script>
  <script src="js/services/file-editor-collaboration-api.service.js"></script>
  <script src="js/services/file-editor-content-api.service.js"></script>
  <script src="js/file-editor.js"></script>
  <script src="js/companion-bridge-consent.js"></script>
  <script src="js/lex/chat/lex-chat.format.js"></script>
  <script src="js/lex/chat/lex-chat.conversations-api.js"></script>
  <script src="js/lex/chat/lex-chat.source.js"></script>
  <script src="js/lex/chat/lex-chat.message.js"></script>
  <script src="js/lex/chat/lex-chat-progress-events.js"></script>
  <script src="js/lex/chat/lex-chat.activity.js"></script>
  <script src="js/lex/chat/lex-chat.documents.js"></script>
  <script src="js/lex/chat/lex-chat.composer-mentions.js"></script>
  <script src="js/services/slash-commands.service.js"></script>
  <script src="js/lex/chat/lex-chat.composer-slash.js"></script>
  <script src="js/lex/chat/lex-chat.composer.js"></script>
  <script src="js/lex/chat/lex-chat.thread.js"></script>
  <script src="js/lex/chat/lex-chat.threads.js"></script>
  <script src="js/lex/chat/lex-chat.js"></script>
  <script src="js/lex/chat/lex-dynamic-card.renderer.js"></script>
  <script src="js/lex/chat/lex-agentic-plan-card.js"></script>
  <script src="js/lex/chat/lex-chat.index.js"></script>
  <script src="js/lex/components/chat/lex-lana-panel.js"></script>
  <script src="js/lex/components/layout/lex-lana-dock.js"></script>
  <script src="js/auth-guard.js"></script>
</body>
</html>
