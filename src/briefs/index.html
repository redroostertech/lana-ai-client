<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LANA Briefs</title>
  <link rel="stylesheet" href="../css/tailwind-output.css">
  <script src="../js/tailwind-loader.js"></script>
  <link rel="stylesheet" href="../css/lex-tokens.css">
  <link rel="stylesheet" href="../css/lex-chat.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <lex-app
    id="briefs-shell"
    logo-src="../img/logo-light.png"
    logo-alt="LANA AI"
    logo-href="./index.html"
    active-nav-id="briefs-meetings"
    page-title="LANA Briefs"
  ></lex-app>

  <template id="page-content">
    <div class="briefs-scroll">
      <section class="briefs-workspace" aria-live="polite">
        <section id="briefs-detail" class="briefs-detail" aria-label="Meeting">
          <lex-empty id="briefs-detail-empty" icon="file-text" message="Choose a meeting" description="Meetings from your phone and the ones you record here are listed in the sidebar."></lex-empty>
          <div id="briefs-new" class="briefs-new hidden">
            <header class="briefs-meeting-head">
              <p class="briefs-overline" id="briefs-new-overline">New meeting</p>
              <h2 id="briefs-new-title" class="briefs-meeting-title">Record a meeting here</h2>
              <p id="briefs-new-subtitle" class="briefs-meeting-facts">Audio, transcript and notes stay on this computer.</p>
            </header>

            <section id="briefs-new-setup" class="briefs-new-body" aria-label="Before you record">
              <p class="briefs-overline">Before you record</p>
              <p id="briefs-new-model" class="briefs-new-note is-warning hidden"></p>
              <p class="briefs-new-note">Let everyone know this meeting is being recorded. Some states require every person's agreement.</p>
              <lex-input id="briefs-new-name" label="Meeting title" placeholder="For example, Client intake" maxlength="200"></lex-input>
              <lex-radio id="briefs-new-consent" label="How consent was given" value="announced" options='[{"value":"announced","label":"I announced the recording","description":"Shown on the meeting as Recording announced."},{"value":"allPartiesConfirmed","label":"Every participant confirmed","description":"Shown on the meeting as All parties confirmed."}]'></lex-radio>
              <lex-input id="briefs-new-people" label="Who is in the meeting" placeholder="Names, separated by commas" help="Optional."></lex-input>
              <lex-input id="briefs-new-jurisdiction" label="Jurisdiction note" placeholder="Optional" help="For example, California: all parties must agree." maxlength="280"></lex-input>
              <lex-checkbox id="briefs-new-confirm" label="Everyone in this meeting knows it is being recorded and agreed where the law requires it."></lex-checkbox>
              <div id="briefs-new-permissions" class="briefs-new-permissions"></div>
              <p id="briefs-new-error" class="briefs-meeting-error hidden" role="alert"></p>
              <div class="briefs-new-actions">
                <lex-btn id="briefs-new-import" variant="secondary" leading-icon="upload">Import a recording</lex-btn>
                <lex-btn id="briefs-new-start" variant="primary" leading-icon="mic">Start recording</lex-btn>
              </div>
              <p id="briefs-new-hint" class="briefs-new-hint"></p>
              <input id="briefs-new-file" class="hidden" type="file" tabindex="-1" aria-hidden="true" accept=".m4a,.mp3,.wav,.caf,.aac,audio/mp4,audio/mpeg,audio/wav,audio/x-caf,audio/aac">

              <p class="briefs-overline briefs-new-how">How it works</p>
              <ol class="briefs-new-steps">
                <li><span class="briefs-new-step-title">Announce the recording</span><span class="briefs-new-step-detail">Let everyone know this meeting is being recorded, and confirm how they agreed.</span></li>
                <li><span class="briefs-new-step-title">Record</span><span class="briefs-new-step-detail">LANA records your microphone and the meeting audio, with a live level for each, so you can see both sides are heard.</span></li>
                <li><span class="briefs-new-step-title">Stop and review</span><span class="briefs-new-step-detail">LANA transcribes the meeting, tells the speakers apart and writes the notes. Proposed actions wait for your review.</span></li>
              </ol>
            </section>

            <section id="briefs-new-live" class="briefs-new-body hidden" aria-label="Recording">
              <div class="briefs-live-clock" role="timer" aria-live="off">
                <span id="briefs-live-pulse" class="briefs-live-pulse" aria-hidden="true"></span>
                <span id="briefs-live-time" class="briefs-live-time">0:00</span>
                <span id="briefs-live-state" class="briefs-live-state"></span>
              </div>
              <div class="briefs-meters">
                <div class="briefs-meter">
                  <span class="briefs-meter-label">Your microphone <span id="briefs-meter-mic-status" class="briefs-meter-status"></span></span>
                  <div id="briefs-meter-mic" class="briefs-meter-bars" aria-hidden="true"></div>
                </div>
                <div class="briefs-meter">
                  <span class="briefs-meter-label">Meeting audio <span id="briefs-meter-meeting-status" class="briefs-meter-status"></span></span>
                  <div id="briefs-meter-meeting" class="briefs-meter-bars" aria-hidden="true"></div>
                </div>
              </div>
              <p id="briefs-live-message" class="briefs-new-note is-warning hidden"></p>
              <div class="briefs-new-actions">
                <lex-btn id="briefs-live-pause" variant="secondary" leading-icon="pause">Pause</lex-btn>
                <lex-btn id="briefs-live-resume" variant="secondary" leading-icon="mic">Resume</lex-btn>
                <lex-btn id="briefs-live-stop" variant="danger" leading-icon="square">Stop</lex-btn>
              </div>
              <p class="briefs-new-hint">The transcript is made on this computer when you stop. You can open other pages while you record.</p>
              <p class="briefs-overline briefs-new-how">Notes</p>
              <div class="briefs-live-compose">
                <lex-input id="briefs-live-draft" placeholder="Jot a note to mark this moment" maxlength="10000"></lex-input>
                <lex-btn id="briefs-live-add" variant="secondary" leading-icon="plus">Add</lex-btn>
              </div>
              <ul id="briefs-live-notes" class="briefs-notes"></ul>
            </section>

            <section id="briefs-new-progress" class="briefs-new-body hidden" aria-label="Writing notes">
              <ol id="briefs-progress-steps" class="briefs-progress"></ol>
              <p id="briefs-progress-message" class="briefs-new-note is-warning hidden"></p>
              <lex-btn id="briefs-progress-open" class="hidden" variant="primary" trailing-icon="chevron-right">Open the meeting</lex-btn>
            </section>
          </div>

          <div id="briefs-detail-meeting" class="briefs-meeting hidden">
            <header class="briefs-meeting-head briefs-meeting-head-row">
              <div class="briefs-meeting-head-text">
                <p class="briefs-overline" id="briefs-detail-when"></p>
                <h2 id="briefs-detail-title" class="briefs-meeting-title"></h2>
                <p id="briefs-detail-meta" class="briefs-meeting-facts"></p>
              </div>
              <div id="briefs-share" class="briefs-share hidden">
                <lex-btn id="briefs-share-button" variant="secondary" size="sm" leading-icon="share">Share</lex-btn>
                <div id="briefs-share-popover" class="briefs-share-popover hidden" role="dialog" aria-label="Share this meeting"></div>
              </div>
            </header>
            <section id="briefs-review" class="briefs-review hidden" aria-label="Needs review"></section>
            <div id="briefs-replay" class="briefs-replay" aria-label="Meeting audio"></div>
            <p id="briefs-meeting-error" class="briefs-meeting-error hidden" role="alert"></p>
            <div class="briefs-meeting-body">
              <section class="briefs-transcript" aria-labelledby="briefs-transcript-title">
                <div class="briefs-transcript-head">
                  <span id="briefs-transcript-title" class="briefs-overline">Transcript</span>
                  <span class="briefs-transcript-tip">Click a line to clip it. Shift click or drag for several.</span>
                </div>
                <ol id="briefs-turns" class="briefs-turns" role="listbox" tabindex="0" aria-multiselectable="true" aria-label="Transcript lines. Click a line to clip it, Shift click to add lines."></ol>
              </section>
              <aside class="briefs-side" aria-label="Key points and notes">
                <lex-tabs id="briefs-side-tabs" active="keyPoints"></lex-tabs>
                <div id="briefs-side-panel" class="briefs-side-panel" role="tabpanel"></div>
              </aside>
            </div>
            <div id="briefs-clipbar" class="briefs-clipbar hidden" role="toolbar" aria-label="Clip actions"></div>
          </div>
          <section id="briefs-note-editor" class="briefs-note-editor hidden" role="dialog" aria-label="Note">
            <header class="briefs-note-toolbar">
              <lex-btn id="briefs-note-back" variant="ghost" size="sm" leading-icon="chevron-left" aria-label="Back to the meeting">Notes</lex-btn>
              <span class="briefs-note-spacer"></span>
              <span id="briefs-note-status" class="briefs-note-status" role="status"></span>
              <lex-btn id="briefs-note-delete" variant="ghost" size="sm" icon="true" leading-icon="trash-2" aria-label="Delete note"></lex-btn>
              <lex-btn id="briefs-note-done" variant="primary" size="sm">Done</lex-btn>
            </header>
            <div id="briefs-note-scroll" class="briefs-note-scroll">
              <div class="briefs-note-canvas">
                <p id="briefs-note-date" class="briefs-note-date"></p>
                <button type="button" id="briefs-note-moment" class="briefs-note-moment hidden"></button>
                <textarea id="briefs-note-title" class="briefs-note-title" rows="1" placeholder="Title" aria-label="Title"></textarea>
                <textarea id="briefs-note-body" class="briefs-note-body" rows="1" aria-label="Note"></textarea>
              </div>
            </div>
          </section>
        </section>
      </section>

      <lex-empty id="briefs-unavailable" class="hidden" icon="lock" message="LANA Briefs is not available right now" description="It runs while you are signed in and LANA Briefs is on for your firm. Sign in to LANA, or ask your firm admin to turn it on."></lex-empty>
    </div>
  </template>

  <script src="../js/config.js"></script>
  <script src="../js/version.js"></script>
  <script src="../js/time-utils.js"></script>
  <script src="../js/shared/request-retry.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/lex/lex.core.js"></script>
  <script src="../js/lex/lex.utils.js"></script>
  <script src="../js/lex/lex.icons.js"></script>
  <script src="../js/lex/lex.state.js"></script>
  <script src="../js/lex/lex-nav.js"></script>
  <script src="../js/lex/lex.forms.js"></script>
  <script src="../js/lex/components/foundation/lex-btn.js"></script>
  <script src="../js/lex/components/foundation/lex-card.js"></script>
  <script src="../js/lex/components/foundation/lex-badge.js"></script>
  <script src="../js/lex/components/foundation/lex-empty.js"></script>
  <script src="../js/lex/components/foundation/lex-modal.js"></script>
  <script src="../js/lex/components/foundation/lex-tabs.js"></script>
  <script src="../js/lex/components/foundation/lex-toast.js"></script>
  <script src="../js/lex/components/foundation/lex-spinner.js"></script>
  <script src="../js/lex/components/form/lex-select.js"></script>
  <script src="../js/lex/components/form/lex-input.js"></script>
  <script src="../js/lex/components/form/lex-checkbox.js"></script>
  <script src="../js/lex/components/form/lex-radio.js"></script>
  <script src="../js/lex/components/layout/lex-sidebar.js"></script>
  <script src="../js/lex/components/layout/lex-topbar.js"></script>
  <script src="../js/lex/components/layout/lex-notification-panel.js"></script>
  <script src="../js/lex/components/layout/lex-app.js"></script>
  <script src="../js/lex/index.js"></script>
  <script src="../js/lex/lex-page-init.js"></script>
  <script src="../js/sidebar-footer-hydrate.js"></script>
  <lex-lana-dock page-scope="briefs" context-type="full_chat" placeholder="Ask LANA..." thread-title="LANA Chat"></lex-lana-dock>
  <!-- LANA dock (IDE-style docked chat panel) -->
  <script src="../js/lex/chat/lex-chat.format.js"></script>
  <script src="../js/lex/chat/lex-chat.conversations-api.js"></script>
  <script src="../js/lex/chat/lex-chat.source.js"></script>
  <script src="../js/lex/chat/lex-chat.message.js"></script>
  <script src="../js/lex/chat/lex-chat-progress-events.js"></script>
  <script src="../js/lex/chat/lex-chat.activity.js"></script>
  <script src="../js/lex/chat/lex-chat.documents.js"></script>
  <script src="../js/lex/chat/lex-chat.composer-mentions.js"></script>
  <script src="../js/services/slash-commands.service.js"></script>
  <script src="../js/lex/chat/lex-chat.composer-slash.js"></script>
  <script src="../js/lex/chat/lex-chat.composer.js"></script>
  <script src="../js/lex/chat/lex-chat.thread.js"></script>
  <script src="../js/lex/chat/lex-chat.threads.js"></script>
  <script src="../js/lex/chat/lex-chat.js"></script>
  <script src="../js/lex/chat/lex-dynamic-card.renderer.js"></script>
  <script src="../js/lex/chat/lex-agentic-plan-card.js"></script>
  <script src="../js/lex/chat/lex-chat.index.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/lex/components/chat/lex-lana-panel.js"></script>
  <script src="../js/lex/components/layout/lex-lana-dock.js"></script>
  <script src="../js/auth-guard.js"></script>
  <script src="../js/briefs/briefs-meeting.js"></script>
  <script src="../js/briefs/briefs-replay.js"></script>
  <script src="../js/briefs/briefs-recording.js"></script>
  <script src="../js/briefs/briefs-share.js"></script>
  <script src="./app.js"></script>
</body>
</html>
