<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Template Library - LANA AI</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/lex-tokens.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/document-library.css">
  <link rel="stylesheet" href="css/document-library-templates.css">
  <link rel="stylesheet" href="css/document-create-modal.css">
  <link rel="stylesheet" href="css/tailwind-output.css">
  <link rel="stylesheet" href="css/companion-bridge-consent.css">
  <script src="js/tailwind-loader.js"></script>

  <link rel="stylesheet" href="css/lex-chat.css">
</head>
<body>

  <lex-loader theme="light"></lex-loader>

  <lex-app
    logo-src="img/logo-light.png"
    logo-alt="LANA AI"
    logo-href="dashboard.html"
    active-nav-id="library-templates"
    page-title="Template Library"
  ></lex-app>

  <template id="page-content">

    <main id="templateLibrary" class="document-library template-library">

      <lex-banner
        id="templateLibraryBanner"
        variant="light"
        corners
        heading="Template Library"
        subtitle="Reusable templates for the whole organization and for individual workspaces."
        lana
        lana-context-type="full_chat"
      >
        <lex-btn id="dstNewTemplate" variant="primary" leading-icon="file-plus" data-action="new-template">New Template</lex-btn>
      </lex-banner>

      <!-- Kind filter, org-wide toggle, and search -->
      <div class="dst-filters">
        <span class="dst-filter-label" id="dstKindFilterLabel">Template type</span>
        <lex-segmented
          id="dstKindFilter"
          aria-labelledby="dstKindFilterLabel"
          value=""
          options='[{"value":"","label":"All"},{"value":"fill","label":"Documents"},{"value":"compose","label":"Document sets"},{"value":"render","label":"Layouts"}]'
        ></lex-segmented>

        <div class="dst-filters-spacer"></div>

        <label class="dst-orgwide" title="Include organization-wide templates when a workspace is selected">
          <input type="checkbox" id="dstOrgWideToggle" checked>
          <span>Include organization-wide</span>
        </label>

        <input type="text" id="dstSearch" class="dst-search" placeholder="Search templates...">
      </div>

      <lex-card class="document-library-recents" padding="none" aria-labelledby="dstListHeading">
        <div class="document-library-section-heading">
          <div>
            <h2 id="dstListHeading">All templates</h2>
            <p>Organization-wide and workspace templates across every type.</p>
          </div>
          <span id="dstTotalCount" class="document-library-count" aria-live="polite"></span>
        </div>

        <div id="dstColumns" class="document-library-columns" role="row" hidden>
          <span aria-hidden="true"></span>
          <span role="columnheader">Template</span>
          <span role="columnheader">Workspace</span>
          <span role="columnheader">Last edited</span>
          <span aria-hidden="true"></span>
        </div>

        <div id="dstList" class="document-library-files" aria-live="polite" aria-busy="true">
          <div class="document-library-skeleton" aria-hidden="true"></div>
          <div class="document-library-skeleton" aria-hidden="true"></div>
          <div class="document-library-skeleton" aria-hidden="true"></div>
          <div class="document-library-skeleton" aria-hidden="true"></div>
        </div>

        <lex-pagination id="dstPagination" page="1" total-pages="1" total="0" limit="12" hidden></lex-pagination>
      </lex-card>

      <!-- Detail drawer (read-only) -->
      <lex-drawer id="dstDetailDrawer" heading="Template" side="right" width="480">
        <div id="dstDetailBody"></div>
      </lex-drawer>

    </main>

  </template>

  <noscript>
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,sans-serif;color:#666;">
      Please enable JavaScript to use LANA AI.
    </div>
  </noscript>

  <!-- Universal shell scripts -->
  <script src="js/error-reporter.js"></script>
  <script src="js/config.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/time-utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/components.js"></script>
  <script src="js/version.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/navigation-helpers.js"></script>
  <script src="js/notifications.js"></script>

  <!-- Lex UI core -->
  <script src="js/lex/lex.core.js"></script>
  <script src="js/lex/lex.icons.js"></script>
  <script src="js/lex/lex.data.js"></script>
  <script src="js/lex/lex.forms.js"></script>
  <script src="js/lex/lex.state.js"></script>
  <script src="js/lex/lex.utils.js"></script>
  <script src="js/lex/lex.auth.js"></script>
  <script src="js/lex/lex-nav.js"></script>

  <!-- Lex UI layout -->
  <script src="js/lex/components/foundation/lex-loader.js"></script>
  <script src="js/lex/components/foundation/lex-toast.js"></script>
  <script src="js/lex/components/foundation/lex-spinner.js"></script>
  <script src="js/lex/components/foundation/lex-btn.js"></script>
  <script src="js/app-catalog.js"></script>
  <script src="js/lex/components/foundation/lex-empty.js"></script>
  <script src="js/lex/components/form/lex-segmented.js"></script>
  <script src="js/lex/components/layout/lex-sidebar.js"></script>
  <script src="js/lex/components/layout/lex-topbar.js"></script>
  <script src="js/lex/components/layout/lex-conversation-item.js"></script>
  <script src="js/lex/components/layout/lex-notification-panel.js"></script>
  <script src="js/lex/components/layout/lex-app.js"></script>

  <!-- Page-specific Lex components -->
  <script src="js/lex/components/foundation/lex-badge.js"></script>
  <script src="js/lex/components/foundation/lex-banner.js"></script>
  <script src="js/lex/components/foundation/lex-modal.js"></script>
  <script src="js/lex/components/foundation/lex-card.js"></script>
  <script src="js/lex/components/foundation/lex-drawer.js"></script>
  <script src="js/lex/components/foundation/lex-kv.js"></script>
  <script src="js/lex/components/data/lex-pagination.js"></script>

  <!-- Inject page content -->
  <script src="js/lex/lex-page-init.js"></script>

  <!-- Document Studio data layer (pure mapper + API wrapper) -->
  <script src="js/shared/document-studio-templates-mapper.js"></script>
  <script src="js/document-studio-api.js"></script>
  <script src="js/services/document-create-modal.js"></script>

  <!-- Page controller (MUST be last before auth-guard) -->
  <script src="js/document-library-templates.js"></script>

  <!-- PAC bridge consent handler (Lex modal for token requests) -->
  <script src="js/companion-bridge-consent.js"></script>

  <!-- Auth guard + loader dismiss -->
  <script src="js/auth-guard.js"></script>
  <lex-lana-dock page-scope="document-library-templates" context-type="full_chat" placeholder="Ask LANA anything..." thread-title="LANA Chat"></lex-lana-dock>
  <!-- LANA dock (IDE-style docked chat panel) -->
  <script src="js/lex/chat/lex-chat.format.js"></script>
  <script src="js/lex/chat/lex-chat.conversations-api.js"></script>
  <script src="js/lex/chat/lex-chat.source.js"></script>
  <script src="js/lex/chat/lex-chat.message.js"></script>
  <script src="js/lex/chat/lex-chat-progress-events.js"></script>
  <script src="js/lex/chat/lex-chat.activity.js"></script>
  <script src="js/lex/chat/lex-chat.documents.js"></script>
  <script src="js/lex/chat/lex-chat.composer-mentions.js"></script>
  <script src="js/services/slash-commands.service.js"></script>
  <script src="js/lex/chat/lex-chat.composer-slash.js"></script>
  <script src="js/lex/chat/lex-chat.composer.js"></script>
  <script src="js/lex/chat/lex-chat.thread.js"></script>
  <script src="js/lex/chat/lex-chat.threads.js"></script>
  <script src="js/lex/chat/lex-chat.js"></script>
  <script src="js/lex/chat/lex-dynamic-card.renderer.js"></script>
  <script src="js/lex/chat/lex-agentic-plan-card.js"></script>
  <script src="js/lex/chat/lex-chat.index.js"></script>
  <script src="js/lex/components/chat/lex-lana-panel.js"></script>
  <script src="js/lex/components/layout/lex-lana-dock.js"></script>
</body>
</html>
