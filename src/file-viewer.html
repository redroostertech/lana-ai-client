<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Viewer - LANA AI</title>
  <link rel="stylesheet" href="css/lex-tokens.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/components/document-metadata.css">
  <link rel="stylesheet" href="css/lex-chat.css">
  <!-- lana-ask-btn.css replaced by self-contained lex-ask-lana-btn component -->
  <link rel="stylesheet" href="css/tailwind-output.css">
  <link rel="stylesheet" href="css/companion-bridge-consent.css">
  <link rel="stylesheet" href="css/file-viewer.css">
  <script src="js/tailwind-loader.js"></script>
</head>
<body>

  <lex-loader theme="light"></lex-loader>

  <lex-app
    logo-src="img/logo-light.png"
    logo-alt="LANA AI"
    logo-href="dashboard.html"
    active-nav-id="library"
    page-title="File Viewer"
  ></lex-app>

  <template id="page-content">
  <main style="display:flex;flex-direction:column;height:100%">

    <!-- Header bar -->
    <div id="viewerHeader" class="file-viewer-header">
      <lex-banner
        id="viewerBanner"
        class="file-viewer-banner"
        variant="light"
        heading="Loading..."
        subtitle=""
        max-actions="1"
      >
        <!-- Visible action: LANA -->
        <lex-ask-lana-btn id="askLanaBtn" panel="fileViewerLana" size="sm"></lex-ask-lana-btn>
        <!-- Overflow action: Open in Doc Studio -->
        <button id="openDocStudioBtn" type="button" class="hidden file-viewer-overflow-item" role="menuitem">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5M18 3h3m0 0v3m0-3L10 14"></path></svg>
          Open in Doc Studio
        </button>
        <!-- Overflow action: Download -->
        <button id="viewerDownloadBtn" type="button" class="file-viewer-overflow-item" role="menuitem">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
          Download
        </button>
        <!-- Overflow action: Use as Template -->
        <button id="viewerTemplateBtn" type="button" class="hidden file-viewer-overflow-item" role="menuitem">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
          <span id="viewerTemplateBtnLabel">Use as Template</span>
        </button>
        <!-- Overflow action: Generate from Template -->
        <button id="viewerGenerateBtn" type="button" class="hidden file-viewer-overflow-item" role="menuitem">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
          Generate from Template
        </button>
        <hr />
        <!-- Overflow action: Delete -->
        <button id="viewerDeleteBtn" type="button" data-variant="danger" class="file-viewer-overflow-item" role="menuitem">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6M1 7h22M9 7V4a2 2 0 012-2h2a2 2 0 012 2v3"></path></svg>
          Delete
        </button>
      </lex-banner>
    </div>

    <!-- Breadcrumb sits in its own row, sibling of the header (not nested
         inside it) so it owns its spacing and the banner stays unaffected. -->
    <lex-breadcrumb
      id="viewerBreadcrumb"
      class="file-viewer-breadcrumb"
      items='[{"label":"Loading..."}]'
    ></lex-breadcrumb>

    <!-- Two-column content area -->
    <div class="flex-1 flex overflow-hidden">

      <!-- Left: File Content Area -->
      <div id="viewerContent" class="flex-1 overflow-auto p-4 min-w-0" style="background-color: var(--lex-bg-secondary)">
        <!-- Loading -->
        <div id="viewerLoading" class="flex items-center justify-center h-full">
          <div class="text-center">
            <lex-spinner size="lg"></lex-spinner>
            <p class="mt-4" style="color: var(--lex-text-secondary)">Loading document...</p>
          </div>
        </div>

        <!-- Error state (full-page style) -->
        <div id="viewerError" class="hidden flex items-center justify-center h-full">
          <div class="text-center max-w-md">
            <svg class="w-16 h-16 mx-auto mb-4" style="color: var(--lex-status-danger)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
            </svg>
            <p id="viewerErrorMsg" class="mb-4 text-base" style="color: var(--lex-text-secondary)">Unable to preview this file</p>
            <div class="flex items-center justify-center gap-3">
              <lex-btn id="viewerErrorBack" variant="secondary">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Go Back
              </lex-btn>
              <lex-btn id="viewerErrorDownload" variant="primary">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                Download Instead
              </lex-btn>
              <lex-btn id="viewerErrorDelete" variant="danger">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6M1 7h22M9 7V4a2 2 0 012-2h2a2 2 0 012 2v3"></path></svg>
                Delete File
              </lex-btn>
            </div>
          </div>
        </div>

        <!-- Content viewers -->
        <iframe id="viewerIframe" class="hidden w-full h-full bg-white rounded-lg shadow-sm"></iframe>
        <pre id="viewerText" class="hidden w-full h-full bg-white rounded-lg shadow-sm p-6 overflow-auto text-sm font-mono whitespace-pre-wrap"></pre>
        <img id="viewerImage" class="hidden max-w-full max-h-full mx-auto rounded-lg shadow-sm object-contain">
        <div id="viewerEditor" class="hidden file-viewer-editor-host"></div>
        <div id="viewerDocx" class="hidden w-full h-full bg-white rounded-lg shadow-sm p-6 overflow-auto prose prose-sm max-w-none">
          <style>
            #viewerDocx table.docx-table { width: 100%; border-collapse: collapse; margin: 1em 0; border: 1px solid var(--lex-border-default); }
            #viewerDocx table.docx-table td, #viewerDocx table.docx-table th { border: 1px solid var(--lex-border-default); padding: 0.5em; text-align: left; }
            #viewerDocx table.docx-table th { background-color: var(--lex-bg-secondary); font-weight: 600; }
            #viewerDocx table.docx-table tr:nth-child(even) { background-color: var(--lex-bg-secondary); }
            #viewerDocx img { max-width: 100%; height: auto; margin: 1em 0; }
          </style>
        </div>
      </div>

      <!-- Right: Metadata Sidebar (collapsible) -->
      <div id="metadataSidebar" class="w-96 bg-white border-l flex flex-col overflow-hidden flex-shrink-0 transition-all duration-300" style="border-color: var(--lex-border-default)">
        <div class="px-4 py-3 border-b" style="border-color: var(--lex-border-default); background-color: var(--lex-bg-secondary)">
          <div class="flex items-center justify-between">
            <h4 class="text-sm font-semibold" style="color: var(--lex-text-primary)">Document Details</h4>
            <lex-segmented id="metaModeToggle" value="view" size="sm"
              options='[{"value":"view","label":"View"},{"value":"edit","label":"Edit"}]'>
            </lex-segmented>
          </div>
        </div>

        <div class="flex-1 overflow-y-auto p-4 space-y-4">
          <!-- File Info Card -->
          <div class="rounded-lg p-4 border shadow-sm" style="background: linear-gradient(to bottom right, var(--lex-bg-accent-soft), var(--lex-bg-accent-muted)); border-color: var(--lex-border-accent)">
            <div class="space-y-3 text-sm">
              <div class="flex justify-between items-center">
                <span class="font-medium flex items-center gap-1.5" style="color: var(--lex-text-secondary)">
                  <svg class="w-4 h-4" style="color: var(--lex-text-accent)" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4"></path></svg>
                  Size
                </span>
                <span id="metaFileSize" class="font-semibold" style="color: var(--lex-text-primary)">--</span>
              </div>
              <div class="flex justify-between items-center">
                <span class="font-medium flex items-center gap-1.5" style="color: var(--lex-text-secondary)">
                  <svg class="w-4 h-4" style="color: var(--lex-text-accent)" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                  Uploaded
                </span>
                <span id="metaUploadedAt" class="font-semibold" style="color: var(--lex-text-primary)">--</span>
              </div>
              <div class="flex justify-between items-center pt-2 border-t" style="border-color: var(--lex-border-accent)">
                <span class="font-medium flex items-center gap-1.5" style="color: var(--lex-text-secondary)">
                  <svg class="w-4 h-4" style="color: var(--lex-text-secondary)" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                  Chunks
                </span>
                <span id="metaChunkCount" class="font-semibold" style="color: var(--lex-text-primary)">--</span>
              </div>
              <div class="flex justify-between items-center pt-2 border-t" style="border-color: var(--lex-border-accent)">
                <span class="font-medium flex items-center gap-1.5" style="color: var(--lex-text-secondary)">
                  <svg class="w-4 h-4" style="color: var(--lex-text-accent)" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                  Lifecycle
                </span>
                <span id="metaLifecycleBadge" class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium">--</span>
              </div>
            </div>
          </div>

          <!-- View Mode -->
          <div id="metaViewMode" class="space-y-4">
            <div>
              <label class="block text-sm font-medium mb-1" style="color: var(--lex-text-primary)">Document Type</label>
              <div id="metaDocTypeView" class="text-sm" style="color: var(--lex-text-primary)">--</div>
            </div>
            <div>
              <label class="block text-sm font-medium mb-1" style="color: var(--lex-text-primary)">Tags</label>
              <div id="metaTagsView" class="flex flex-wrap gap-1 text-sm" style="color: var(--lex-text-primary)">--</div>
            </div>
            <div>
              <label class="block text-sm font-medium mb-1" style="color: var(--lex-text-primary)">Notes</label>
              <div id="metaNotesView" class="text-sm whitespace-pre-wrap" style="color: var(--lex-text-primary)">--</div>
            </div>
            <div id="metaSummarySection" class="hidden">
              <label class="block text-sm font-medium mb-1 flex items-center gap-1.5" style="color: var(--lex-text-primary)">
                <svg class="w-4 h-4" style="color: var(--lex-text-accent)" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                AI Summary
              </label>
              <div id="metaSummaryView" class="text-sm whitespace-pre-wrap leading-relaxed rounded-lg p-3 border" style="color: var(--lex-text-secondary); background: var(--lex-bg-secondary); border-color: var(--lex-border-subtle); max-height: 20rem; overflow-y: auto;">--</div>
              <div id="metaSummaryTimestamp" class="text-xs mt-1" style="color: var(--lex-text-tertiary)"></div>
            </div>
          </div>

          <!-- Edit Mode -->
          <div id="metaEditMode" class="hidden space-y-4">
            <lex-select
              id="metaDocType"
              label="Document Type"
              options='[{"value":"","label":"Auto-detect"},{"value":"contract","label":"Contract"},{"value":"pleading","label":"Pleading"},{"value":"deposition","label":"Deposition"},{"value":"medical_record","label":"Medical Record"},{"value":"police_report","label":"Police Report"},{"value":"email","label":"Email"},{"value":"correspondence","label":"Correspondence"},{"value":"other","label":"Other"}]'
            ></lex-select>
            <lex-input
              id="metaTags"
              label="Tags"
              placeholder="e.g., important, draft"
              help="Separate with commas"
            ></lex-input>
            <div>
              <lex-textarea
                id="metaNotes"
                label="Notes"
                placeholder="Add notes..."
                rows="4"
                maxlength="2000"
                show-count="true"
              ></lex-textarea>
            </div>
          </div>
        </div>

        <!-- Metadata Actions Footer (Edit Mode Only) -->
        <div id="metaActionsFooter" class="hidden px-4 py-3 border-t flex items-center justify-between gap-2" style="border-color: var(--lex-border-default); background-color: var(--lex-bg-secondary)">
          <lex-btn id="metaDeleteBtn" variant="danger">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6M1 7h22M9 7V4a2 2 0 012-2h2a2 2 0 012 2v3"></path></svg>
            Delete
          </lex-btn>
          <div class="flex items-center gap-2">
            <lex-btn id="metaCancelBtn" variant="secondary">Cancel</lex-btn>
            <lex-btn id="metaSaveBtn" variant="primary">Save Changes</lex-btn>
          </div>
        </div>
      </div>

    </div>

    <!-- DOCX Template Generation Modal -->
    <lex-modal id="fvDocxModal" heading="Generate Document from Template" size="full" hide-actions close-on-overlay>
      <div class="flex flex-col h-full">
        <!-- Two-column body -->
        <div class="flex-1 flex overflow-hidden">

          <!-- Left column: template info, contact, preview -->
          <div class="w-96 flex-shrink-0 border-r border-gray-200 overflow-y-auto p-6 space-y-5">
            <div class="flex items-center gap-3 pb-4 border-b border-gray-200">
              <div class="w-10 h-10 bg-purple-100 rounded-lg flex items-center justify-center flex-shrink-0">
                <svg class="w-5 h-5 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
              </div>
              <div class="flex-1 min-w-0">
                <h4 id="fvDocxTitle" class="text-sm font-medium text-gray-900 truncate">Template</h4>
                <p id="fvDocxPlaceholders" class="text-xs text-gray-500">Loading...</p>
              </div>
              <button id="fvDocxViewBtn" type="button" onclick="viewFvDocxTemplate()" class="shrink-0 inline-flex items-center gap-1 px-2 py-1 text-xs font-medium text-purple-700 bg-purple-50 border border-purple-200 rounded-md hover:bg-purple-100 transition-colors" title="Preview the template file">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                View
              </button>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Select Contacts</label>
              <div id="fvDocxContactList" class="border border-gray-300 rounded-lg overflow-hidden">
                <div class="flex items-center gap-2 px-3 py-2 bg-gray-50 border-b border-gray-200">
                  <input type="checkbox" id="fvDocxContactSelectAll" class="rounded border-gray-300 text-purple-600 focus:ring-purple-500">
                  <label for="fvDocxContactSelectAll" class="text-xs font-medium text-gray-600 cursor-pointer select-none">Select All</label>
                  <span id="fvDocxContactCount" class="ml-auto text-xs text-gray-400"></span>
                </div>
                <div class="px-2 py-1.5 border-b border-gray-200">
                  <input type="text" id="fvDocxContactSearch" class="w-full px-2 py-1 text-xs border border-gray-200 rounded focus:ring-1 focus:ring-purple-500 focus:border-purple-500" placeholder="Search contacts...">
                </div>
                <div id="fvDocxContactItems" class="max-h-40 overflow-y-auto divide-y divide-gray-100"></div>
              </div>
            </div>

            <div id="fvDocxPreview" class="hidden">
              <label class="block text-sm font-medium text-gray-700 mb-2">Field Preview</label>
              <div id="fvDocxPreviewList" class="bg-gray-50 rounded-lg p-3 space-y-1.5 overflow-y-auto text-sm"></div>
            </div>

            <div id="fvDocxCustomVars" class="hidden">
              <label class="block text-sm font-medium text-gray-700 mb-2">Custom Variables</label>
              <div id="fvDocxCustomVarsList" class="space-y-2"></div>
            </div>

            <div class="flex items-center gap-4">
              <label class="flex items-center gap-2 text-sm text-gray-700">
                <input type="checkbox" id="fvDocxSaveToMatter" checked class="rounded border-gray-300 text-purple-600 focus:ring-purple-500">
                Save to matter documents
              </label>
            </div>
          </div>

          <!-- Right column: blank fields (scrollable) -->
          <div class="flex-1 overflow-y-auto p-6">
            <div id="fvDocxBlanks" class="hidden">
              <div class="flex items-center justify-between mb-3">
                <div>
                  <label class="block text-sm font-medium text-gray-700">Blank Fields</label>
                  <p class="text-xs text-gray-500 mt-0.5">Assign what each blank field represents by selecting a variable or typing a custom value.</p>
                </div>
                <div id="fvDocxBlankFilters" class="flex items-center gap-1 flex-shrink-0">
                  <button type="button" class="dtm-filter-btn px-2.5 py-1 text-xs font-medium rounded-full bg-purple-100 text-purple-700" data-filter="all" data-prefix="fvDocx">All <span class="dtm-filter-count"></span></button>
                  <button type="button" class="dtm-filter-btn px-2.5 py-1 text-xs font-medium rounded-full bg-gray-100 text-gray-600 hover:bg-gray-200" data-filter="mapped" data-prefix="fvDocx">Mapped <span class="dtm-filter-count"></span></button>
                  <button type="button" class="dtm-filter-btn px-2.5 py-1 text-xs font-medium rounded-full bg-gray-100 text-gray-600 hover:bg-gray-200" data-filter="unmapped" data-prefix="fvDocx">Unmapped <span class="dtm-filter-count"></span></button>
                </div>
              </div>
              <div id="fvDocxBlanksList" class="space-y-3"></div>
            </div>
          </div>

        </div>

        <!-- Pinned footer -->
        <div class="flex items-center justify-end gap-3 px-6 py-4 border-t border-gray-200 flex-shrink-0">
          <lex-btn type="button" id="fvDocxCancelBtn" variant="secondary">Cancel</lex-btn>
          <lex-btn type="button" id="fvDocxGenerateBtn" variant="primary" disabled>Generate Document</lex-btn>
        </div>
      </div>
    </lex-modal>

    <!-- Unified LANA chat panel (drawer mode) -->
    <lex-lana-panel
      id="fileViewerLana"
      mode="drawer"
      drawer-heading="LANA — Document Context"
      drawer-width="lg"
      page-scope="workspace"
      context-type="document_chat"
      placeholder="Ask a question about this document..."
      tools-locked="true"
      default-tool="document_chat"
      thread-title="Document Context"
    ></lex-lana-panel>
  </main>
  </template>

  <noscript>
    <div style="padding: 2rem; text-align: center; font-family: system-ui, sans-serif;">
      <h1>JavaScript Required</h1>
      <p>LANA AI requires JavaScript to run. Please enable JavaScript in your browser settings.</p>
    </div>
  </noscript>

  <!-- ═══════════════════════════════════════════════════════════════════════
       Universal shell scripts
       ═══════════════════════════════════════════════════════════════════════ -->
  <script src="js/error-reporter.js"></script>
  <script src="js/config.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/time-utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/utils/rename-conversation.js"></script>
  <script src="js/components.js"></script>
  <script src="js/version.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/navigation-helpers.js"></script>
  <script src="js/conversation-search-modal.js"></script>
  <script src="js/contact-search-modal.js"></script>
  <script src="js/notifications.js"></script>

  <!-- ═══════════════════════════════════════════════════════════════════════
       Lex UI core
       ═══════════════════════════════════════════════════════════════════════ -->
  <script src="js/lex/lex.core.js"></script>
  <script src="js/lex/lex.icons.js"></script>
  <script src="js/lex/lex.data.js"></script>
  <script src="js/lex/lex.forms.js"></script>
  <script src="js/lex/lex.state.js"></script>
