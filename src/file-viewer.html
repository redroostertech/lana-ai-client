<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Viewer - LANA AI</title>
  <link rel="stylesheet" href="css/lex-tokens.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/components/document-metadata.css">
  <link rel="stylesheet" href="css/lex-chat.css">
  <!-- lana-ask-btn.css replaced by self-contained lex-ask-lana-btn component -->
  <link rel="stylesheet" href="css/tailwind-output.css">
  <script src="js/tailwind-loader.js"></script>
</head>
<body>

  <lex-loader theme="light"></lex-loader>

  <lex-app
    logo-src="img/logo-light.png"
    logo-alt="LANA AI"
    logo-href="dashboard.html"
    active-nav-id="storage"
    page-title="File Viewer"
  ></lex-app>

  <template id="page-content">
  <main style="display:flex;flex-direction:column;height:100%">

    <!-- Header bar -->
    <div id="viewerHeader" class="px-6 py-4 border-b flex items-center justify-between flex-shrink-0" style="border-color: var(--lex-border-default); background: var(--lex-bg-primary)">
      <div class="flex items-center gap-3 min-w-0">
        <!-- Back button -->
        <button id="backBtn" class="flex-shrink-0 p-2 rounded-lg transition-colors" style="color: var(--lex-text-secondary)" title="Go back"
                onmouseover="this.style.background='var(--lex-bg-hover)'" onmouseout="this.style.background='transparent'">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
          </svg>
        </button>
        <!-- File icon -->
        <svg class="w-6 h-6 flex-shrink-0" style="color: var(--lex-text-tertiary)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
        </svg>
        <div class="min-w-0">
          <h3 id="viewerFileName" class="text-lg font-semibold truncate" style="color: var(--lex-text-primary)">Loading...</h3>
          <p id="viewerFileInfo" class="text-sm" style="color: var(--lex-text-secondary)"></p>
        </div>
      </div>
      <div class="flex items-center gap-2 flex-shrink-0">
        <!-- Download button -->
        <lex-btn id="viewerDownloadBtn" variant="ghost">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
          Download
        </lex-btn>
        <!-- Toggle Metadata Sidebar -->
        <lex-btn id="toggleSidebarBtn" variant="ghost" icon="true" title="Toggle metadata sidebar">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2"></path>
          </svg>
        </lex-btn>
        <!-- Divider -->
        <div style="width:1px;height:20px;background:var(--lex-border-default);margin:0 4px;flex-shrink:0;"></div>
        <!-- LANA button -->
        <lex-ask-lana-btn id="askLanaBtn" panel="fileViewerLana" size="sm"></lex-ask-lana-btn>
      </div>
    </div>

    <!-- Two-column content area -->
    <div class="flex-1 flex overflow-hidden">

      <!-- Left: File Content Area -->
      <div id="viewerContent" class="flex-1 overflow-auto p-4 min-w-0" style="background-color: var(--lex-bg-secondary)">
        <!-- Loading -->
        <div id="viewerLoading" class="flex items-center justify-center h-full">
          <div class="text-center">
            <lex-spinner size="lg"></lex-spinner>
            <p class="mt-4" style="color: var(--lex-text-secondary)">Loading document...</p>
          </div>
        </div>

        <!-- Error state (full-page style) -->
        <div id="viewerError" class="hidden flex items-center justify-center h-full">
          <div class="text-center max-w-md">
            <svg class="w-16 h-16 mx-auto mb-4" style="color: var(--lex-status-danger)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
            </svg>
            <p id="viewerErrorMsg" class="mb-4 text-base" style="color: var(--lex-text-secondary)">Unable to preview this file</p>
            <div class="flex items-center justify-center gap-3">
              <lex-btn id="viewerErrorBack" variant="secondary">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Go Back
              </lex-btn>
              <lex-btn id="viewerErrorDownload" variant="primary">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                Download Instead
              </lex-btn>
            </div>
          </div>
        </div>

        <!-- Content viewers -->
        <iframe id="viewerIframe" class="hidden w-full h-full bg-white rounded-lg shadow-sm"></iframe>
        <pre id="viewerText" class="hidden w-full h-full bg-white rounded-lg shadow-sm p-6 overflow-auto text-sm font-mono whitespace-pre-wrap"></pre>
        <img id="viewerImage" class="hidden max-w-full max-h-full mx-auto rounded-lg shadow-sm object-contain">
        <div id="viewerDocx" class="hidden w-full h-full bg-white rounded-lg shadow-sm p-6 overflow-auto prose prose-sm max-w-none">
          <style>
            #viewerDocx table.docx-table { width: 100%; border-collapse: collapse; margin: 1em 0; border: 1px solid var(--lex-border-default); }
            #viewerDocx table.docx-table td, #viewerDocx table.docx-table th { border: 1px solid var(--lex-border-default); padding: 0.5em; text-align: left; }
            #viewerDocx table.docx-table th { background-color: var(--lex-bg-secondary); font-weight: 600; }
            #viewerDocx table.docx-table tr:nth-child(even) { background-color: var(--lex-bg-secondary); }
            #viewerDocx img { max-width: 100%; height: auto; margin: 1em 0; }
          </style>
        </div>
      </div>

      <!-- Right: Metadata Sidebar (collapsible) -->
      <div id="metadataSidebar" class="w-96 bg-white border-l flex flex-col overflow-hidden flex-shrink-0 transition-all duration-300" style="border-color: var(--lex-border-default)">
        <div class="px-4 py-3 border-b" style="border-color: var(--lex-border-default); background-color: var(--lex-bg-secondary)">
          <div class="flex items-center justify-between">
            <h4 class="text-sm font-semibold" style="color: var(--lex-text-primary)">Document Details</h4>
            <lex-segmented id="metaModeToggle" value="view" size="sm"
              options='[{"value":"view","label":"View"},{"value":"edit","label":"Edit"}]'>
            </lex-segmented>
          </div>
        </div>

        <div class="flex-1 overflow-y-auto p-4 space-y-4">
          <!-- File Info Card -->
          <div class="rounded-lg p-4 border shadow-sm" style="background: linear-gradient(to bottom right, var(--lex-bg-accent-soft), var(--lex-bg-accent-muted)); border-color: var(--lex-border-accent)">
            <div class="space-y-3 text-sm">
              <div class="flex justify-between items-center">
                <span class="font-medium flex items-center gap-1.5" style="color: var(--lex-text-secondary)">
                  <svg class="w-4 h-4" style="color: var(--lex-text-accent)" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4"></path></svg>
                  Size
                </span>
                <span id="metaFileSize" class="font-semibold" style="color: var(--lex-text-primary)">--</span>
              </div>
              <div class="flex justify-between items-center">
                <span class="font-medium flex items-center gap-1.5" style="color: var(--lex-text-secondary)">
                  <svg class="w-4 h-4" style="color: var(--lex-text-accent)" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                  Uploaded
                </span>
                <span id="metaUploadedAt" class="font-semibold" style="color: var(--lex-text-primary)">--</span>
              </div>
              <div class="flex justify-between items-center pt-2 border-t" style="border-color: var(--lex-border-accent)">
                <span class="font-medium flex items-center gap-1.5" style="color: var(--lex-text-secondary)">
                  <svg class="w-4 h-4" style="color: var(--lex-text-secondary)" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                  Chunks
                </span>
                <span id="metaChunkCount" class="font-semibold" style="color: var(--lex-text-primary)">--</span>
              </div>
            </div>
          </div>

          <!-- View Mode -->
          <div id="metaViewMode" class="space-y-4">
            <div>
              <label class="block text-sm font-medium mb-1" style="color: var(--lex-text-primary)">Document Type</label>
              <div id="metaDocTypeView" class="text-sm" style="color: var(--lex-text-primary)">--</div>
            </div>
            <div>
              <label class="block text-sm font-medium mb-1" style="color: var(--lex-text-primary)">Tags</label>
              <div id="metaTagsView" class="flex flex-wrap gap-1 text-sm" style="color: var(--lex-text-primary)">--</div>
            </div>
            <div>
              <label class="block text-sm font-medium mb-1" style="color: var(--lex-text-primary)">Notes</label>
              <div id="metaNotesView" class="text-sm whitespace-pre-wrap" style="color: var(--lex-text-primary)">--</div>
            </div>
            <div id="metaSummarySection" class="hidden">
              <label class="block text-sm font-medium mb-1 flex items-center gap-1.5" style="color: var(--lex-text-primary)">
                <svg class="w-4 h-4" style="color: var(--lex-text-accent)" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                AI Summary
              </label>
              <div id="metaSummaryView" class="text-sm whitespace-pre-wrap leading-relaxed rounded-lg p-3 border" style="color: var(--lex-text-secondary); background: var(--lex-bg-secondary); border-color: var(--lex-border-subtle); max-height: 20rem; overflow-y: auto;">--</div>
              <div id="metaSummaryTimestamp" class="text-xs mt-1" style="color: var(--lex-text-tertiary)"></div>
            </div>
          </div>

          <!-- Edit Mode -->
          <div id="metaEditMode" class="hidden space-y-4">
            <lex-select
              id="metaDocType"
              label="Document Type"
              options='[{"value":"","label":"Auto-detect"},{"value":"contract","label":"Contract"},{"value":"pleading","label":"Pleading"},{"value":"deposition","label":"Deposition"},{"value":"medical_record","label":"Medical Record"},{"value":"police_report","label":"Police Report"},{"value":"email","label":"Email"},{"value":"correspondence","label":"Correspondence"},{"value":"other","label":"Other"}]'
            ></lex-select>
            <lex-input
              id="metaTags"
              label="Tags"
              placeholder="e.g., important, draft"
              help="Separate with commas"
            ></lex-input>
            <div>
              <lex-textarea
                id="metaNotes"
                label="Notes"
                placeholder="Add notes..."
                rows="4"
                maxlength="2000"
                show-count="true"
              ></lex-textarea>
            </div>
          </div>
        </div>

        <!-- Metadata Actions Footer (Edit Mode Only) -->
        <div id="metaActionsFooter" class="hidden px-4 py-3 border-t flex items-center justify-end gap-2" style="border-color: var(--lex-border-default); background-color: var(--lex-bg-secondary)">
          <lex-btn id="metaCancelBtn" variant="secondary">Cancel</lex-btn>
          <lex-btn id="metaSaveBtn" variant="primary">Save Changes</lex-btn>
        </div>
      </div>

    </div>

    <!-- Unified LANA chat panel (drawer mode) -->
    <lex-lana-panel
      id="fileViewerLana"
      mode="drawer"
      drawer-heading="LANA — Document Chat"
      drawer-width="lg"
      page-scope="workspace"
      context-type="document_chat"
      placeholder="Ask a question about this document..."
      tools-locked="true"
      default-tool="document_chat"
      thread-title="Document Chat"
    ></lex-lana-panel>
  </main>
  </template>

  <noscript>
    <div style="padding: 2rem; text-align: center; font-family: system-ui, sans-serif;">
      <h1>JavaScript Required</h1>
      <p>LANA AI requires JavaScript to run. Please enable JavaScript in your browser settings.</p>
    </div>
  </noscript>

  <!-- ═══════════════════════════════════════════════════════════════════════
       Universal shell scripts
       ═══════════════════════════════════════════════════════════════════════ -->
  <script src="js/error-reporter.js"></script>
  <script src="js/config.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/components.js"></script>
  <script src="js/version.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/navigation-helpers.js"></script>
  <script src="js/new-project-modal.js"></script>
  <script src="js/conversation-menu.js"></script>
  <script src="js/conversation-search-modal.js"></script>
  <script src="js/contact-search-modal.js"></script>
  <script src="js/notifications.js"></script>

  <!-- ═══════════════════════════════════════════════════════════════════════
       Lex UI core
       ═══════════════════════════════════════════════════════════════════════ -->
  <script src="js/lex/lex.core.js"></script>
  <script src="js/lex/lex.icons.js"></script>
  <script src="js/lex/lex.data.js"></script>
  <script src="js/lex/lex.forms.js"></script>
  <script src="js/lex/lex.state.js"></script>
  <script src="js/lex/lex.utils.js"></script>
  <script src="js/lex/lex.auth.js"></script>
  <script src="js/lex/lex-nav.js"></script>

  <!-- ═══════════════════════════════════════════════════════════════════════
       Lex UI foundation
       ═══════════════════════════════════════════════════════════════════════ -->
  <script src="js/lex/components/foundation/lex-loader.js"></script>
  <script src="js/lex/components/foundation/lex-toast.js"></script>
  <script src="js/lex/components/foundation/lex-spinner.js"></script>
  <script src="js/lex/components/foundation/lex-btn.js"></script>
  <script src="js/lex/components/foundation/lex-empty.js"></script>
  <script src="js/lex/components/form/lex-segmented.js"></script>

  <!-- ═══════════════════════════════════════════════════════════════════════
       Lex UI layout
       ═══════════════════════════════════════════════════════════════════════ -->
  <script src="js/lex/components/layout/lex-sidebar.js"></script>
  <script src="js/lex/components/layout/lex-topbar.js"></script>
  <script src="js/lex/components/layout/lex-conversation-item.js"></script>
  <script src="js/lex/components/layout/lex-notification-panel.js"></script>
  <script src="js/lex/components/layout/lex-app.js"></script>

  <!-- Page-specific Lex components -->
  <script src="js/lex/components/foundation/lex-drawer.js"></script>
  <script src="js/lex/components/form/lex-input.js"></script>
  <script src="js/lex/components/form/lex-select.js"></script>
  <script src="js/lex/components/form/lex-textarea.js"></script>

  <!-- Mermaid diagram rendering (before chat format) -->
  <script src="js/vendor/mermaid.min.js"></script>

  <!-- Chat components for Ask LANA panel -->
  <script src="js/lex/chat/lex-chat.format.js"></script>
  <script src="js/lex/chat/lex-chat.source.js"></script>
  <script src="js/lex/chat/lex-chat.message.js"></script>
  <script src="js/lex/chat/lex-chat.activity.js"></script>
  <script src="js/lex/chat/lex-chat.documents.js"></script>
  <script src="js/lex/chat/lex-chat.composer.js"></script>
  <script src="js/lex/chat/lex-chat.thread.js"></script>
  <script src="js/lex/chat/lex-chat.threads.js"></script>
  <script src="js/lex/chat/lex-chat.js"></script>
  <script src="js/lex/chat/lex-chat.index.js"></script>
  <script src="js/lex/components/chat/lex-ask-lana-btn.js"></script>
  <script src="js/lex/components/chat/lex-lana-panel.js"></script>

  <!-- Inject page content + hoist modals -->
  <script src="js/lex/lex-page-init.js"></script>

  <!-- ═══════════════════════════════════════════════════════════════════════
       Page dependencies
       ═══════════════════════════════════════════════════════════════════════ -->
  <script src="js/vendor/mammoth.min.js"></script>
  <script src="js/utils/metadata-formatter.js"></script>
  <script src="js/services/metadata-service.js"></script>
  <script src="js/vendor/marked.min.js"></script>
  <script src="js/components/document-metadata-viewer.js"></script>

  <!-- Page controller (MUST be last before auth-guard) -->
  <script src="js/file-viewer-page.js"></script>

  <!-- Auth guard + loader dismiss (MUST be last) -->
  <script src="js/auth-guard.js"></script>

</body>
</html>
