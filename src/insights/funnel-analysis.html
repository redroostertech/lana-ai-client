<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Funnel Analysis - LanaAI</title>
  <script src="../js/tailwind-loader.js"></script>
  <script src="../js/error-reporter.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/menu.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/insights.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <!-- Sidebar -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-gray-900 text-white transform -translate-x-full lg:translate-x-0 transition-transform z-30 flex flex-col">
    <div class="flex-shrink-0 flex items-center justify-between h-16 px-6 border-b border-gray-800">
      <a href="../index.html" class="text-xl font-bold text-indigo-400">LanaAI</a>
      <button id="closeSidebar" class="lg:hidden text-gray-400 hover:text-white">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>
    <nav id="mainNav" class="flex-1 overflow-hidden pt-6 px-3">
      <!-- Menu will be dynamically rendered by menu.js -->
    </nav>
  </aside>

  <div class="lg:ml-64">
    <header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-20">
      <div class="flex items-center justify-between h-16 px-4 lg:px-8">
        <button id="openSidebar" class="lg:hidden text-gray-500 hover:text-gray-700">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
        <div class="flex-1 px-4 lg:px-0">
          <h1 class="text-xl font-semibold text-gray-900">Conversion Funnel</h1>
          <p class="text-sm text-gray-500">Lead to client conversion analysis</p>
        </div>

        <div class="flex items-center gap-4">
          <!-- Notifications -->
          <button id="notificationBtn" class="relative text-gray-500 hover:text-gray-700">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
            </svg>
            <span id="notificationBadge" class="hidden absolute -top-1 -right-1 w-4 h-4 bg-red-500 text-white text-xs rounded-full flex items-center justify-center">0</span>
          </button>

          <!-- User Menu -->
          <div class="relative" id="userMenu">
            <button class="flex items-center gap-2 text-gray-700 hover:text-gray-900">
              <div class="w-8 h-8 bg-indigo-100 rounded-full flex items-center justify-center">
                <span id="userInitials" class="text-sm font-medium text-indigo-600">U</span>
              </div>
              <span id="userName" class="hidden sm:block text-sm font-medium">User</span>
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
              </svg>
            </button>
            <div id="userDropdown" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-200 py-1 z-50">
              <a href="../settings.html" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Settings</a>
              <hr class="my-1">
              <button id="logoutBtn" class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-gray-100">Sign out</button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Notification Panel Overlay -->
    <div id="notificationOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity"></div>

    <!-- Notification Slide-out Panel -->
    <div id="notificationPanel" class="fixed inset-y-0 right-0 w-full sm:w-96 bg-white shadow-2xl z-50 transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
      <div class="flex items-center justify-between h-16 px-6 border-b border-gray-200 flex-shrink-0">
        <h2 class="text-lg font-semibold text-gray-900">Notifications</h2>
        <div class="flex items-center gap-3">
          <button id="markAllReadBtn" class="text-sm text-indigo-600 hover:text-indigo-800 font-medium hidden">Mark all read</button>
          <button id="refreshNotificationsBtn" class="text-gray-400 hover:text-gray-600 transition-colors" title="Refresh">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
            </svg>
          </button>
          <button id="closeNotificationPanel" class="text-gray-400 hover:text-gray-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          </button>
        </div>
      </div>
      <div class="flex border-b border-gray-200 px-6 flex-shrink-0">
        <button id="filterAll" class="px-4 py-3 text-sm font-medium text-indigo-600 border-b-2 border-indigo-600">All</button>
        <button id="filterUnread" class="px-4 py-3 text-sm font-medium text-gray-500 hover:text-gray-700">Unread</button>
      </div>
      <div id="notificationList" class="flex-1 overflow-y-auto">
        <div id="notificationLoading" class="p-8 text-center">
          <div class="animate-spin w-8 h-8 border-4 border-indigo-200 border-t-indigo-600 rounded-full mx-auto"></div>
          <p class="text-gray-500 mt-3 text-sm">Loading notifications...</p>
        </div>
      </div>
      <div id="notificationLoadingMore" class="hidden p-4 border-t border-gray-100 text-center flex-shrink-0">
        <div class="animate-spin w-5 h-5 border-2 border-indigo-200 border-t-indigo-600 rounded-full mx-auto"></div>
      </div>
    </div>

    <main class="p-4 lg:p-8">
      <!-- Visual Funnel Loading State -->
      <div id="funnelLoading" class="bg-white rounded-xl shadow-sm border border-gray-100 p-8 mb-8">
        <div class="h-5 bg-gray-200 rounded w-40 mx-auto mb-6 animate-pulse"></div>
        <div class="max-w-2xl mx-auto space-y-4 animate-pulse">
          <div class="mx-auto rounded-lg py-4 px-6 bg-gray-200 h-24" style="width: 100%"></div>
          <div class="mx-auto rounded-lg py-4 px-6 bg-gray-200 h-24" style="width: 85%"></div>
          <div class="mx-auto rounded-lg py-4 px-6 bg-gray-200 h-24" style="width: 65%"></div>
          <div class="mx-auto rounded-lg py-4 px-6 bg-gray-200 h-24" style="width: 45%"></div>
          <div class="mx-auto rounded-lg py-4 px-6 bg-gray-200 h-24" style="width: 30%"></div>
        </div>
      </div>

      <!-- Visual Funnel -->
      <div id="funnelContent" class="hidden bg-white rounded-xl shadow-sm border border-gray-100 p-8 mb-8">
        <h3 class="font-semibold text-gray-900 mb-6 text-center">Conversion Funnel</h3>
        <div id="funnelViz" class="max-w-2xl mx-auto space-y-2">
          <!-- Populated by JavaScript -->
        </div>
      </div>

      <!-- Conversion Rates Loading State -->
      <div id="ratesLoading" class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 animate-pulse">
          <div class="h-5 bg-gray-200 rounded w-32 mb-4"></div>
          <div class="space-y-4">
            <div><div class="flex justify-between mb-1"><div class="h-4 bg-gray-200 rounded w-32"></div><div class="h-4 bg-gray-200 rounded w-10"></div></div><div class="h-2 bg-gray-200 rounded-full"></div></div>
            <div><div class="flex justify-between mb-1"><div class="h-4 bg-gray-200 rounded w-40"></div><div class="h-4 bg-gray-200 rounded w-10"></div></div><div class="h-2 bg-gray-200 rounded-full"></div></div>
            <div><div class="flex justify-between mb-1"><div class="h-4 bg-gray-200 rounded w-36"></div><div class="h-4 bg-gray-200 rounded w-10"></div></div><div class="h-2 bg-gray-200 rounded-full"></div></div>
            <div><div class="flex justify-between mb-1"><div class="h-4 bg-gray-200 rounded w-28"></div><div class="h-4 bg-gray-200 rounded w-10"></div></div><div class="h-2 bg-gray-200 rounded-full"></div></div>
          </div>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 animate-pulse">
          <div class="h-5 bg-gray-200 rounded w-48 mb-4"></div>
          <div class="space-y-4">
            <div class="flex justify-between py-2 border-b border-gray-100"><div class="h-4 bg-gray-200 rounded w-32"></div><div class="h-4 bg-gray-200 rounded w-16"></div></div>
            <div class="flex justify-between py-2 border-b border-gray-100"><div class="h-4 bg-gray-200 rounded w-40"></div><div class="h-4 bg-gray-200 rounded w-16"></div></div>
            <div class="flex justify-between py-2 border-b border-gray-100"><div class="h-4 bg-gray-200 rounded w-36"></div><div class="h-4 bg-gray-200 rounded w-16"></div></div>
            <div class="flex justify-between py-2 border-b border-gray-100"><div class="h-4 bg-gray-200 rounded w-28"></div><div class="h-4 bg-gray-200 rounded w-16"></div></div>
          </div>
        </div>
      </div>

      <!-- Conversion Rates -->
      <div id="ratesContent" class="hidden grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
          <h3 class="font-semibold text-gray-900 mb-4">Conversion Rates</h3>
          <div id="conversionRates" class="space-y-4">
            <!-- Populated by JavaScript -->
          </div>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
          <h3 class="font-semibold text-gray-900 mb-4">Average Stage Duration (days)</h3>
          <div id="stageDurations" class="space-y-4">
            <!-- Populated by JavaScript -->
          </div>
        </div>
      </div>

      <!-- Stage Details Loading State -->
      <div id="tableLoading" class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="px-6 py-4 border-b border-gray-100 animate-pulse">
          <div class="h-5 bg-gray-200 rounded w-28"></div>
        </div>
        <div class="overflow-x-auto">
          <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
              <tr>
                <th class="px-6 py-3"><div class="h-4 bg-gray-200 rounded w-14"></div></th>
                <th class="px-6 py-3"><div class="h-4 bg-gray-200 rounded w-12"></div></th>
                <th class="px-6 py-3"><div class="h-4 bg-gray-200 rounded w-12"></div></th>
                <th class="px-6 py-3"><div class="h-4 bg-gray-200 rounded w-20"></div></th>
                <th class="px-6 py-3"><div class="h-4 bg-gray-200 rounded w-16"></div></th>
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-200 animate-pulse">
              <tr>
                <td class="px-6 py-4"><div class="flex items-center gap-3"><div class="w-3 h-3 bg-gray-200 rounded-full"></div><div class="h-4 bg-gray-200 rounded w-20"></div></div></td>
                <td class="px-6 py-4"><div class="h-4 bg-gray-200 rounded w-16"></div></td>
                <td class="px-6 py-4"><div class="h-4 bg-gray-200 rounded w-20"></div></td>
                <td class="px-6 py-4"><div class="h-6 bg-gray-200 rounded-full w-12"></div></td>
                <td class="px-6 py-4"><div class="h-4 bg-gray-200 rounded w-8"></div></td>
              </tr>
              <tr>
                <td class="px-6 py-4"><div class="flex items-center gap-3"><div class="w-3 h-3 bg-gray-200 rounded-full"></div><div class="h-4 bg-gray-200 rounded w-28"></div></div></td>
                <td class="px-6 py-4"><div class="h-4 bg-gray-200 rounded w-14"></div></td>
                <td class="px-6 py-4"><div class="h-4 bg-gray-200 rounded w-24"></div></td>
                <td class="px-6 py-4"><div class="h-6 bg-gray-200 rounded-full w-12"></div></td>
                <td class="px-6 py-4"><div class="h-4 bg-gray-200 rounded w-10"></div></td>
              </tr>
              <tr>
                <td class="px-6 py-4"><div class="flex items-center gap-3"><div class="w-3 h-3 bg-gray-200 rounded-full"></div><div class="h-4 bg-gray-200 rounded w-24"></div></div></td>
                <td class="px-6 py-4"><div class="h-4 bg-gray-200 rounded w-12"></div></td>
                <td class="px-6 py-4"><div class="h-4 bg-gray-200 rounded w-20"></div></td>
                <td class="px-6 py-4"><div class="h-6 bg-gray-200 rounded-full w-12"></div></td>
                <td class="px-6 py-4"><div class="h-4 bg-gray-200 rounded w-10"></div></td>
              </tr>
              <tr>
                <td class="px-6 py-4"><div class="flex items-center gap-3"><div class="w-3 h-3 bg-gray-200 rounded-full"></div><div class="h-4 bg-gray-200 rounded w-16"></div></div></td>
                <td class="px-6 py-4"><div class="h-4 bg-gray-200 rounded w-10"></div></td>
                <td class="px-6 py-4"><div class="h-4 bg-gray-200 rounded w-24"></div></td>
                <td class="px-6 py-4"><div class="h-6 bg-gray-200 rounded-full w-12"></div></td>
                <td class="px-6 py-4"><div class="h-4 bg-gray-200 rounded w-10"></div></td>
              </tr>
              <tr>
                <td class="px-6 py-4"><div class="flex items-center gap-3"><div class="w-3 h-3 bg-gray-200 rounded-full"></div><div class="h-4 bg-gray-200 rounded w-20"></div></div></td>
                <td class="px-6 py-4"><div class="h-4 bg-gray-200 rounded w-8"></div></td>
                <td class="px-6 py-4"><div class="h-4 bg-gray-200 rounded w-28"></div></td>
                <td class="px-6 py-4"><div class="h-6 bg-gray-200 rounded-full w-12"></div></td>
                <td class="px-6 py-4"><div class="h-4 bg-gray-200 rounded w-8"></div></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Stage Details -->
      <div id="tableContent" class="hidden bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="px-6 py-4 border-b border-gray-100">
          <h3 class="font-semibold text-gray-900">Stage Details</h3>
        </div>
        <div class="overflow-x-auto">
          <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
              <tr>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Stage</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Count</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Value</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Conversion</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Drop-off</th>
              </tr>
            </thead>
            <tbody id="stageTable" class="divide-y divide-gray-200"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script>
    if (!api.requireAuth()) throw new Error('Not authenticated');
    
    // Render dynamic menu
    renderMenu('#mainNav');

    // Initialize notifications panel
    NotificationPanel.init();

    // Load user info
    function loadUserInfo() {
      const user = api.user;
      if (user) {
        const name = `${user.firstName || ''} ${user.lastName || ''}`.trim() || user.email;
        const initials = (user.firstName?.[0] || '') + (user.lastName?.[0] || '') || user.email[0].toUpperCase();
        document.getElementById('userName').textContent = name;
        document.getElementById('userInitials').textContent = initials;
      }
    }
    loadUserInfo();

    // User menu toggle
    const userMenu = document.getElementById('userMenu');
    const userDropdown = document.getElementById('userDropdown');
    userMenu.addEventListener('click', () => userDropdown.classList.toggle('hidden'));
    document.addEventListener('click', (e) => {
      if (!userMenu.contains(e.target)) userDropdown.classList.add('hidden');
    });

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await api.logout();
      window.location.href = '../login.html';
    });

    // Sidebar toggle
    const sidebar = document.getElementById('sidebar');
    document.getElementById('openSidebar').addEventListener('click', () => sidebar.classList.remove('-translate-x-full'));
    document.getElementById('closeSidebar').addEventListener('click', () => sidebar.classList.add('-translate-x-full'));

    // Show/hide loading states
    function showLoadingStates() {
      document.getElementById('funnelLoading').classList.remove('hidden');
      document.getElementById('funnelContent').classList.add('hidden');
      document.getElementById('ratesLoading').classList.remove('hidden');
      document.getElementById('ratesContent').classList.add('hidden');
      document.getElementById('tableLoading').classList.remove('hidden');
      document.getElementById('tableContent').classList.add('hidden');
    }

    function hideLoadingStates() {
      document.getElementById('funnelLoading').classList.add('hidden');
      document.getElementById('funnelContent').classList.remove('hidden');
      document.getElementById('ratesLoading').classList.add('hidden');
      document.getElementById('ratesContent').classList.remove('hidden');
      document.getElementById('tableLoading').classList.add('hidden');
      document.getElementById('tableContent').classList.remove('hidden');
    }

    function formatCurrency(val) {
      return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 0 }).format(val);
    }

    const colors = ['#6366f1', '#8b5cf6', '#a855f7', '#c084fc', '#d8b4fe', '#22c55e'];

    function renderFunnel(stages) {
      const container = document.getElementById('funnelViz');

      // Handle empty state
      if (!stages || stages.length === 0) {
        container.innerHTML = '<p class="text-center text-gray-500 py-8">No funnel data available</p>';
        return;
      }

      const maxCount = stages[0].count;

      container.innerHTML = stages.map((s, i) => {
        const width = Math.max(30, (s.count / maxCount) * 100);
        return `
          <div class="relative">
            <div class="mx-auto rounded-lg py-4 px-6 text-center text-white font-medium transition-all" style="width: ${width}%; background-color: ${colors[i]}">
              <p class="text-lg">${s.name}</p>
              <p class="text-2xl font-bold">${s.count.toLocaleString()}</p>
              <p class="text-sm opacity-80">${formatCurrency(s.value)}</p>
            </div>
            ${i < stages.length - 1 ? `
              <div class="absolute -bottom-2 left-1/2 transform -translate-x-1/2 text-gray-400">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    function renderConversionRates(rates) {
      const container = document.getElementById('conversionRates');
      if (!rates || Object.keys(rates).length === 0) {
        container.innerHTML = '<p class="text-center text-gray-500 py-4">No conversion data available</p>';
        return;
      }
      container.innerHTML = Object.entries(rates).map(([key, value]) => `
        <div>
          <div class="flex items-center justify-between mb-1">
            <span class="text-sm text-gray-600">${key}</span>
            <span class="text-sm font-semibold ${value >= 80 ? 'text-green-600' : value >= 50 ? 'text-yellow-600' : 'text-red-600'}">${value}%</span>
          </div>
          <div class="h-2 bg-gray-200 rounded-full">
            <div class="h-full rounded-full ${value >= 80 ? 'bg-green-500' : value >= 50 ? 'bg-yellow-500' : 'bg-red-500'}" style="width: ${value}%"></div>
          </div>
        </div>
      `).join('');
    }

    function renderStageDurations(durations) {
      const container = document.getElementById('stageDurations');
      if (!durations || Object.keys(durations).length === 0) {
        container.innerHTML = '<p class="text-center text-gray-500 py-4">No duration data available</p>';
        return;
      }
      container.innerHTML = Object.entries(durations).map(([key, value]) => `
        <div class="flex items-center justify-between py-2 border-b border-gray-100">
          <span class="text-sm text-gray-600">${key}</span>
          <span class="text-sm font-semibold text-gray-900">${value} days</span>
        </div>
      `).join('');
    }

    function renderStageTable(stages, rates) {
      const tbody = document.getElementById('stageTable');
      if (!stages || stages.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="px-6 py-8 text-center text-gray-500">No stage data available</td></tr>';
        return;
      }
      const rateKeys = Object.keys(rates);

      tbody.innerHTML = stages.map((s, i) => {
        const dropoff = i > 0 ? Math.round((1 - s.count / stages[i-1].count) * 100) : 0;
        const convRate = i < rateKeys.length ? rates[rateKeys[i]] : 100;
        return `
          <tr class="hover:bg-gray-50">
            <td class="px-6 py-4">
              <div class="flex items-center gap-3">
                <div class="w-3 h-3 rounded-full" style="background-color: ${colors[i]}"></div>
                <span class="font-medium text-gray-900">${s.name}</span>
              </div>
            </td>
            <td class="px-6 py-4 text-sm text-gray-900 font-medium">${s.count.toLocaleString()}</td>
            <td class="px-6 py-4 text-sm text-green-600 font-medium">${formatCurrency(s.value)}</td>
            <td class="px-6 py-4"><span class="px-2 py-1 text-xs font-medium rounded-full ${convRate >= 80 ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'}">${i < rateKeys.length ? convRate + '%' : '-'}</span></td>
            <td class="px-6 py-4 text-sm ${dropoff > 30 ? 'text-red-600' : 'text-gray-500'}">${dropoff > 0 ? dropoff + '%' : '-'}</td>
          </tr>
        `;
      }).join('');
    }

    async function loadData() {
      // Show loading skeletons
      showLoadingStates();

      try {
        const data = await Insights.getFunnelData();
        renderFunnel(data.stages);
        renderConversionRates(data.conversionRates);
        renderStageDurations(data.avgStageDuration);
        renderStageTable(data.stages, data.conversionRates);

        // Hide loading skeletons, show content
        hideLoadingStates();
      } catch (error) {
        // Hide loading even on error
        hideLoadingStates();
        Toast.error('Failed to load funnel data');
        console.error(error);
      }
    }

    loadData();
  </script>
</body>
</html>
