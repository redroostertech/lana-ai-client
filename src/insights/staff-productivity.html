<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Productivity - LanaAI</title>
  <script src="../js/tailwind-loader.js"></script>
  <script src="../js/error-reporter.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/menu.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/insights.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-gray-900 text-white transform -translate-x-full lg:translate-x-0 transition-transform z-30 flex flex-col">
    <div class="flex-shrink-0 flex items-center justify-between h-16 px-6 border-b border-gray-800">
      <a href="../index.html" class="text-xl font-bold text-indigo-400">LanaAI</a>
      <button id="closeSidebar" class="lg:hidden text-gray-400 hover:text-white">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>
    <nav id="mainNav" class="flex-1 overflow-hidden pt-6 px-3">
      <!-- Menu will be dynamically rendered by menu.js -->
    </nav>
  </aside>

  <div class="lg:ml-64">
    <header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-20">
      <div class="flex items-center justify-between h-16 px-4 lg:px-8">
        <button id="openSidebar" class="lg:hidden text-gray-500 hover:text-gray-700">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
        <div class="flex-1 px-4 lg:px-0">
          <h1 class="text-xl font-semibold text-gray-900">Staff Productivity</h1>
          <p class="text-sm text-gray-500">Team performance metrics and analysis</p>
        </div>

        <div class="flex items-center gap-4">
          <!-- Notifications -->
          <button id="notificationBtn" class="relative text-gray-500 hover:text-gray-700">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
            </svg>
            <span id="notificationBadge" class="hidden absolute -top-1 -right-1 w-4 h-4 bg-red-500 text-white text-xs rounded-full flex items-center justify-center">0</span>
          </button>

          <!-- User Menu -->
          <div class="relative" id="userMenu">
            <button class="flex items-center gap-2 text-gray-700 hover:text-gray-900">
              <div class="w-8 h-8 bg-indigo-100 rounded-full flex items-center justify-center">
                <span id="userInitials" class="text-sm font-medium text-indigo-600">U</span>
              </div>
              <span id="userName" class="hidden sm:block text-sm font-medium">User</span>
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
              </svg>
            </button>
            <div id="userDropdown" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-200 py-1 z-50">
              <a href="../settings.html" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Settings</a>
              <hr class="my-1">
              <button id="logoutBtn" class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-gray-100">Sign out</button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Notification Panel Overlay -->
    <div id="notificationOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity"></div>

    <!-- Notification Slide-out Panel -->
    <div id="notificationPanel" class="fixed inset-y-0 right-0 w-full sm:w-96 bg-white shadow-2xl z-50 transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
      <div class="flex items-center justify-between h-16 px-6 border-b border-gray-200 flex-shrink-0">
        <h2 class="text-lg font-semibold text-gray-900">Notifications</h2>
        <div class="flex items-center gap-3">
          <button id="markAllReadBtn" class="text-sm text-indigo-600 hover:text-indigo-800 font-medium hidden">Mark all read</button>
          <button id="refreshNotificationsBtn" class="text-gray-400 hover:text-gray-600 transition-colors" title="Refresh">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
            </svg>
          </button>
          <button id="closeNotificationPanel" class="text-gray-400 hover:text-gray-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          </button>
        </div>
      </div>
      <div class="flex border-b border-gray-200 px-6 flex-shrink-0">
        <button id="filterAll" class="px-4 py-3 text-sm font-medium text-indigo-600 border-b-2 border-indigo-600">All</button>
        <button id="filterUnread" class="px-4 py-3 text-sm font-medium text-gray-500 hover:text-gray-700">Unread</button>
      </div>
      <div id="notificationList" class="flex-1 overflow-y-auto">
        <div id="notificationLoading" class="p-8 text-center">
          <div class="animate-spin w-8 h-8 border-4 border-indigo-200 border-t-indigo-600 rounded-full mx-auto"></div>
          <p class="text-gray-500 mt-3 text-sm">Loading notifications...</p>
        </div>
      </div>
      <div id="notificationLoadingMore" class="hidden p-4 border-t border-gray-100 text-center flex-shrink-0">
        <div class="animate-spin w-5 h-5 border-2 border-indigo-200 border-t-indigo-600 rounded-full mx-auto"></div>
      </div>
    </div>

    <main class="p-4 lg:p-8">
      <!-- Comparison Chart Loading State -->
      <div id="chartLoading" class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-8">
        <div class="h-5 bg-gray-200 rounded w-44 mb-4 animate-pulse"></div>
        <div class="h-72 bg-gray-100 rounded-lg flex items-end justify-around px-8 pb-8 animate-pulse">
          <div class="flex flex-col items-center gap-2">
            <div class="w-12 h-32 bg-gray-200 rounded-t"></div>
            <div class="w-12 h-24 bg-gray-300 rounded-t"></div>
            <div class="h-3 bg-gray-200 rounded w-16 mt-2"></div>
          </div>
          <div class="flex flex-col items-center gap-2">
            <div class="w-12 h-48 bg-gray-200 rounded-t"></div>
            <div class="w-12 h-40 bg-gray-300 rounded-t"></div>
            <div class="h-3 bg-gray-200 rounded w-16 mt-2"></div>
          </div>
          <div class="flex flex-col items-center gap-2">
            <div class="w-12 h-40 bg-gray-200 rounded-t"></div>
            <div class="w-12 h-28 bg-gray-300 rounded-t"></div>
            <div class="h-3 bg-gray-200 rounded w-16 mt-2"></div>
          </div>
          <div class="flex flex-col items-center gap-2">
            <div class="w-12 h-36 bg-gray-200 rounded-t"></div>
            <div class="w-12 h-44 bg-gray-300 rounded-t"></div>
            <div class="h-3 bg-gray-200 rounded w-16 mt-2"></div>
          </div>
        </div>
      </div>

      <!-- Comparison Chart -->
      <div id="chartContent" class="hidden bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-8">
        <h3 class="font-semibold text-gray-900 mb-4">Performance Comparison</h3>
        <div class="h-72"><canvas id="comparisonChart"></canvas></div>
      </div>

      <!-- Staff Cards Loading State -->
      <div id="cardsLoading" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 animate-pulse">
          <div class="flex items-center gap-4 mb-6">
            <div class="w-14 h-14 bg-gray-200 rounded-full"></div>
            <div>
              <div class="h-5 bg-gray-200 rounded w-32 mb-2"></div>
              <div class="h-4 bg-gray-200 rounded w-24"></div>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4 mb-4">
            <div class="text-center p-3 bg-gray-50 rounded-lg"><div class="h-7 bg-gray-200 rounded w-14 mx-auto mb-1"></div><div class="h-3 bg-gray-200 rounded w-24 mx-auto"></div></div>
            <div class="text-center p-3 bg-gray-50 rounded-lg"><div class="h-7 bg-gray-200 rounded w-14 mx-auto mb-1"></div><div class="h-3 bg-gray-200 rounded w-24 mx-auto"></div></div>
            <div class="text-center p-3 bg-gray-50 rounded-lg"><div class="h-7 bg-gray-200 rounded w-12 mx-auto mb-1"></div><div class="h-3 bg-gray-200 rounded w-20 mx-auto"></div></div>
            <div class="text-center p-3 bg-gray-50 rounded-lg"><div class="h-7 bg-gray-200 rounded w-20 mx-auto mb-1"></div><div class="h-3 bg-gray-200 rounded w-16 mx-auto"></div></div>
          </div>
          <div class="flex justify-between"><div class="h-4 bg-gray-200 rounded w-28"></div><div class="h-4 bg-gray-200 rounded w-24"></div><div class="h-4 bg-gray-200 rounded w-20"></div></div>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 animate-pulse">
          <div class="flex items-center gap-4 mb-6">
            <div class="w-14 h-14 bg-gray-200 rounded-full"></div>
            <div>
              <div class="h-5 bg-gray-200 rounded w-28 mb-2"></div>
              <div class="h-4 bg-gray-200 rounded w-20"></div>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4 mb-4">
            <div class="text-center p-3 bg-gray-50 rounded-lg"><div class="h-7 bg-gray-200 rounded w-14 mx-auto mb-1"></div><div class="h-3 bg-gray-200 rounded w-24 mx-auto"></div></div>
            <div class="text-center p-3 bg-gray-50 rounded-lg"><div class="h-7 bg-gray-200 rounded w-14 mx-auto mb-1"></div><div class="h-3 bg-gray-200 rounded w-24 mx-auto"></div></div>
            <div class="text-center p-3 bg-gray-50 rounded-lg"><div class="h-7 bg-gray-200 rounded w-12 mx-auto mb-1"></div><div class="h-3 bg-gray-200 rounded w-20 mx-auto"></div></div>
            <div class="text-center p-3 bg-gray-50 rounded-lg"><div class="h-7 bg-gray-200 rounded w-20 mx-auto mb-1"></div><div class="h-3 bg-gray-200 rounded w-16 mx-auto"></div></div>
          </div>
          <div class="flex justify-between"><div class="h-4 bg-gray-200 rounded w-28"></div><div class="h-4 bg-gray-200 rounded w-24"></div><div class="h-4 bg-gray-200 rounded w-20"></div></div>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 animate-pulse">
          <div class="flex items-center gap-4 mb-6">
            <div class="w-14 h-14 bg-gray-200 rounded-full"></div>
            <div>
              <div class="h-5 bg-gray-200 rounded w-36 mb-2"></div>
              <div class="h-4 bg-gray-200 rounded w-28"></div>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4 mb-4">
            <div class="text-center p-3 bg-gray-50 rounded-lg"><div class="h-7 bg-gray-200 rounded w-14 mx-auto mb-1"></div><div class="h-3 bg-gray-200 rounded w-24 mx-auto"></div></div>
            <div class="text-center p-3 bg-gray-50 rounded-lg"><div class="h-7 bg-gray-200 rounded w-14 mx-auto mb-1"></div><div class="h-3 bg-gray-200 rounded w-24 mx-auto"></div></div>
            <div class="text-center p-3 bg-gray-50 rounded-lg"><div class="h-7 bg-gray-200 rounded w-12 mx-auto mb-1"></div><div class="h-3 bg-gray-200 rounded w-20 mx-auto"></div></div>
            <div class="text-center p-3 bg-gray-50 rounded-lg"><div class="h-7 bg-gray-200 rounded w-20 mx-auto mb-1"></div><div class="h-3 bg-gray-200 rounded w-16 mx-auto"></div></div>
          </div>
          <div class="flex justify-between"><div class="h-4 bg-gray-200 rounded w-28"></div><div class="h-4 bg-gray-200 rounded w-24"></div><div class="h-4 bg-gray-200 rounded w-20"></div></div>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 animate-pulse">
          <div class="flex items-center gap-4 mb-6">
            <div class="w-14 h-14 bg-gray-200 rounded-full"></div>
            <div>
              <div class="h-5 bg-gray-200 rounded w-24 mb-2"></div>
              <div class="h-4 bg-gray-200 rounded w-32"></div>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4 mb-4">
            <div class="text-center p-3 bg-gray-50 rounded-lg"><div class="h-7 bg-gray-200 rounded w-14 mx-auto mb-1"></div><div class="h-3 bg-gray-200 rounded w-24 mx-auto"></div></div>
            <div class="text-center p-3 bg-gray-50 rounded-lg"><div class="h-7 bg-gray-200 rounded w-14 mx-auto mb-1"></div><div class="h-3 bg-gray-200 rounded w-24 mx-auto"></div></div>
            <div class="text-center p-3 bg-gray-50 rounded-lg"><div class="h-7 bg-gray-200 rounded w-12 mx-auto mb-1"></div><div class="h-3 bg-gray-200 rounded w-20 mx-auto"></div></div>
            <div class="text-center p-3 bg-gray-50 rounded-lg"><div class="h-7 bg-gray-200 rounded w-20 mx-auto mb-1"></div><div class="h-3 bg-gray-200 rounded w-16 mx-auto"></div></div>
          </div>
          <div class="flex justify-between"><div class="h-4 bg-gray-200 rounded w-28"></div><div class="h-4 bg-gray-200 rounded w-24"></div><div class="h-4 bg-gray-200 rounded w-20"></div></div>
        </div>
      </div>

      <!-- Staff Cards -->
      <div id="staffCards" class="hidden grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Populated by JavaScript -->
      </div>
    </main>
  </div>

  <script>
    if (!api.requireAuth()) throw new Error('Not authenticated');
    
    // Render dynamic menu
    renderMenu('#mainNav');

    // Initialize notifications panel
    NotificationPanel.init();

    // Load user info
    function loadUserInfo() {
      const user = api.user;
      if (user) {
        const name = `${user.firstName || ''} ${user.lastName || ''}`.trim() || user.email;
        const initials = (user.firstName?.[0] || '') + (user.lastName?.[0] || '') || user.email[0].toUpperCase();
        document.getElementById('userName').textContent = name;
        document.getElementById('userInitials').textContent = initials;
      }
    }
    loadUserInfo();

    // User menu toggle
    const userMenu = document.getElementById('userMenu');
    const userDropdown = document.getElementById('userDropdown');
    userMenu.addEventListener('click', () => userDropdown.classList.toggle('hidden'));
    document.addEventListener('click', (e) => {
      if (!userMenu.contains(e.target)) userDropdown.classList.add('hidden');
    });

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await api.logout();
      window.location.href = '../login.html';
    });

    // Sidebar toggle
    const sidebar = document.getElementById('sidebar');
    document.getElementById('openSidebar').addEventListener('click', () => sidebar.classList.remove('-translate-x-full'));
    document.getElementById('closeSidebar').addEventListener('click', () => sidebar.classList.add('-translate-x-full'));

    let comparisonChart = null;

    // Show/hide loading states
    function showLoadingStates() {
      document.getElementById('chartLoading').classList.remove('hidden');
      document.getElementById('chartContent').classList.add('hidden');
      document.getElementById('cardsLoading').classList.remove('hidden');
      document.getElementById('staffCards').classList.add('hidden');
    }

    function hideLoadingStates() {
      document.getElementById('chartLoading').classList.add('hidden');
      document.getElementById('chartContent').classList.remove('hidden');
      document.getElementById('cardsLoading').classList.add('hidden');
      document.getElementById('staffCards').classList.remove('hidden');
    }

    function formatCurrency(val) {
      return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 0 }).format(val);
    }

    function renderComparisonChart(staff) {
      const ctx = document.getElementById('comparisonChart').getContext('2d');
      if (comparisonChart) comparisonChart.destroy();

      // Handle empty state
      if (!staff || staff.length === 0) {
        document.getElementById('comparisonChart').parentElement.innerHTML = '<p class="text-center text-gray-500 py-8 h-72 flex items-center justify-center">No staff data available</p>';
        return;
      }

      comparisonChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: staff.map(s => s.name),
          datasets: [
            { label: 'Completion Rate %', data: staff.map(s => s.metrics.completionRate), backgroundColor: '#6366f1' },
            { label: 'Conversion Rate %', data: staff.map(s => s.metrics.conversionRate), backgroundColor: '#22c55e' }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: { y: { beginAtZero: true, max: 100 } },
          plugins: { legend: { position: 'bottom' } }
        }
      });
    }

    function renderStaffCards(staff) {
      const container = document.getElementById('staffCards');
      if (!staff || staff.length === 0) {
        container.innerHTML = '<div class="col-span-2 text-center text-gray-500 py-8">No staff data available</div>';
        return;
      }
      container.innerHTML = staff.map(s => `
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
          <div class="flex items-center gap-4 mb-6">
            <div class="w-14 h-14 bg-indigo-100 rounded-full flex items-center justify-center">
              <span class="text-xl font-bold text-indigo-600">${s.name.split(' ').map(n => n[0]).join('')}</span>
            </div>
            <div>
              <h3 class="font-semibold text-gray-900">${s.name}</h3>
              <p class="text-sm text-gray-500">${s.role}</p>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4 mb-4">
            <div class="text-center p-3 bg-gray-50 rounded-lg">
              <p class="text-2xl font-bold text-gray-900">${s.metrics.completionRate}%</p>
              <p class="text-xs text-gray-500">Completion Rate</p>
            </div>
            <div class="text-center p-3 bg-gray-50 rounded-lg">
              <p class="text-2xl font-bold text-gray-900">${s.metrics.conversionRate}%</p>
              <p class="text-xs text-gray-500">Conversion Rate</p>
            </div>
            <div class="text-center p-3 bg-gray-50 rounded-lg">
              <p class="text-2xl font-bold text-gray-900">${s.metrics.avgResponseTime}h</p>
              <p class="text-xs text-gray-500">Avg Response</p>
            </div>
            <div class="text-center p-3 bg-gray-50 rounded-lg">
              <p class="text-2xl font-bold text-green-600">${formatCurrency(s.metrics.revenueGenerated)}</p>
              <p class="text-xs text-gray-500">Revenue</p>
            </div>
          </div>
          <div class="space-y-2">
            <div class="flex justify-between text-sm">
              <span class="text-gray-500">Follow-ups: ${s.metrics.followupsCompleted}/${s.metrics.followupsAssigned}</span>
              <span class="text-gray-500">Consults: ${s.metrics.consultationsBooked}</span>
              <span class="text-gray-500">Signed: ${s.metrics.clientsSigned}</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function loadData() {
      // Show loading skeletons
      showLoadingStates();

      try {
        const data = await Insights.getStaffMetrics();
        renderComparisonChart(data.staff);
        renderStaffCards(data.staff);

        // Hide loading skeletons, show content
        hideLoadingStates();
      } catch (error) {
        // Hide loading even on error
        hideLoadingStates();
        Toast.error('Failed to load staff metrics');
        console.error(error);
      }
    }

    loadData();
  </script>
</body>
</html>
