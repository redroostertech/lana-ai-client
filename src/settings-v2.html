<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - LANA AI</title>

  <!-- ── CSS + Tailwind in head — behavioral scripts at end of body ── -->
  <link rel="stylesheet" href="css/lex-tokens.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/settings-v2.css">
  <link rel="stylesheet" href="css/settings-offline-copy.css">
  <link rel="stylesheet" href="css/settings-embedding-reembed.css">
  <link rel="stylesheet" href="css/tailwind-output.css">
  <link rel="stylesheet" href="css/companion-bridge-consent.css">
  <link rel="stylesheet" href="css/lex-motion.css">
  <link rel="stylesheet" href="css/briefs-phones.css">
  <link rel="stylesheet" href="css/settings-briefs.css">
  <link rel="stylesheet" href="css/settings-general.css">
  <link rel="stylesheet" href="css/settings-sessions.css">
  <script src="js/tailwind-loader.js"></script>

  <link rel="stylesheet" href="css/lex-chat.css">
</head>
<body>

  <!-- Branded loader — shows once lex-loader.js upgrades the element -->
  <lex-loader theme="light"></lex-loader>

  <!-- App shell — sidebar, topbar, empty content area.
       Page content lives in <template> below and gets injected after
       the shell renders. This avoids double-rendering of child components. -->
  <lex-app
    logo-src="img/logo-light.png"
    logo-alt="LANA AI"
    logo-href="dashboard.html"
    active-nav-id="settings"
    page-title="Settings"
  ></lex-app>

  <!-- Page content as inert <template> — elements inside are NOT upgraded
       by the browser until cloned into the live DOM. Zero double-rendering. -->
  <template id="page-content">

    <main class="sv2-page">

     <lex-banner
       class="sv2-banner"
       variant="light"
       heading="Settings"
       subtitle="Manage your profile, preferences, and account"
       lana
       lana-context-type="full_chat"
     ></lex-banner>

     <div class="sv2-layout">

      <!-- Section dropdown shown in place of the rail when the settings area
           is narrow. Options are built from the rail by settings-v2-nav.js. -->
      <lex-select id="sv2-nav-select" class="sv2-nav-select" variant="outlined" aria-label="Settings section"></lex-select>

      <!-- In-page section navigation (left rail).
           Icons are injected from Lex.Icons by settings-v2-nav.js. -->
      <nav class="sv2-nav" role="tablist" aria-orientation="vertical" aria-label="Settings sections">
        <button type="button" class="sv2-nav-item" role="tab" id="sv2-tab-profile"
          data-section="profile" aria-controls="sv2-panel-profile" aria-selected="true">
          <span class="sv2-nav-icon" data-icon="user" aria-hidden="true"></span>
          <span class="sv2-nav-label">Profile</span>
        </button>
        <button type="button" class="sv2-nav-item" role="tab" id="sv2-tab-general"
          data-section="general" aria-controls="sv2-panel-general" aria-selected="false" tabindex="-1">
          <span class="sv2-nav-icon" data-icon="settings" aria-hidden="true"></span>
          <span class="sv2-nav-label">General</span>
        </button>
        <button type="button" class="sv2-nav-item" role="tab" id="sv2-tab-notifications"
          data-section="notifications" aria-controls="sv2-panel-notifications" aria-selected="false" tabindex="-1">
          <span class="sv2-nav-icon" data-icon="bell" aria-hidden="true"></span>
          <span class="sv2-nav-label">Notifications</span>
        </button>
        <button type="button" class="sv2-nav-item" role="tab" id="sv2-tab-security"
          data-section="security" aria-controls="sv2-panel-security" aria-selected="false" tabindex="-1">
          <span class="sv2-nav-icon" data-icon="shield" aria-hidden="true"></span>
          <span class="sv2-nav-label">Security</span>
        </button>
        <button type="button" class="sv2-nav-item" role="tab" id="sv2-tab-computer"
          data-section="computer" aria-controls="sv2-panel-computer" aria-selected="false" tabindex="-1">
          <span class="sv2-nav-icon" data-icon="laptop" aria-hidden="true"></span>
          <span class="sv2-nav-label">This computer</span>
        </button>
        <!-- Screen diction: shown by settings-screen-diction.js once the feature ships (src/screen-voice/feature.js). -->
        <button type="button" class="sv2-nav-item sv2-hidden" role="tab" id="sv2-tab-screen-diction"
          data-section="screen-diction" aria-controls="sv2-panel-screen-diction" aria-selected="false" tabindex="-1">
          <span class="sv2-nav-icon" data-icon="mic" aria-hidden="true"></span>
          <span class="sv2-nav-label">Screen diction</span>
        </button>
        <!-- Apps: shown by settings-v2.js when this computer can list connected apps. -->
        <button type="button" class="sv2-nav-item sv2-hidden" role="tab" id="sv2-tab-apps"
          data-section="apps" aria-controls="sv2-panel-apps" aria-selected="false" tabindex="-1">
          <span class="sv2-nav-icon" data-icon="layout-grid" aria-hidden="true"></span>
          <span class="sv2-nav-label">Apps</span>
        </button>
        <!-- Connected devices: shown by settings-briefs.js while LANA Briefs runs for the firm. -->
        <button type="button" class="sv2-nav-item sv2-hidden" role="tab" id="sv2-tab-phone"
          data-section="phone" aria-controls="sv2-panel-phone" aria-selected="false" tabindex="-1">
          <span class="sv2-nav-icon" data-icon="smartphone" aria-hidden="true"></span>
          <span class="sv2-nav-label">Connected devices</span>
        </button>
        <button type="button" class="sv2-nav-item sv2-hidden" role="tab" id="sv2-tab-plugins"
          data-section="plugins" aria-controls="sv2-panel-plugins" aria-selected="false" tabindex="-1">
          <span class="sv2-nav-icon" data-icon="plug" aria-hidden="true"></span>
          <span class="sv2-nav-label">Plugins</span>
        </button>
        <button type="button" class="sv2-nav-item sv2-hidden" role="tab" id="sv2-tab-billing"
          data-section="billing" aria-controls="sv2-panel-billing" aria-selected="false" tabindex="-1">
          <span class="sv2-nav-icon" data-icon="sparkles" aria-hidden="true"></span>
          <span class="sv2-nav-label">Plan &amp; billing</span>
        </button>
        <button type="button" class="sv2-nav-item" role="tab" id="sv2-tab-usage"
          data-section="usage" aria-controls="sv2-panel-usage" aria-selected="false" tabindex="-1">
          <span class="sv2-nav-icon" data-icon="bar-chart-2" aria-hidden="true"></span>
          <span class="sv2-nav-label">Usage</span>
        </button>
        <button type="button" class="sv2-nav-item sv2-hidden" role="tab" id="sv2-tab-data-controls"
          data-section="data-controls" aria-controls="sv2-panel-data-controls" aria-selected="false" tabindex="-1">
          <span class="sv2-nav-icon" data-icon="shield" aria-hidden="true"></span>
          <span class="sv2-nav-label">Data controls</span>
        </button>
      </nav>

      <div class="sv2-panels">

      <!-- ╔═══════════════════════ PROFILE PANEL ═══════════════════════╗ -->
      <div class="sv2-panel is-active" id="sv2-panel-profile" role="tabpanel"
        aria-labelledby="sv2-tab-profile" data-section="profile">

      <!-- Profile
           ══════════════════════════════════════════════════════════════ -->
      <section id="sv2-section-profile" style="margin-bottom:0.5rem">
        <lex-card id="sv2-profile-card" heading="Profile Information" actions='[{"icon":"edit","label":"Edit"}]'>

          <!-- Read-only profile view -->
          <div id="sv2-profile-view">
            <lex-stack direction="horizontal" gap="6" align="center">
              <div class="sv2-avatar">
                <span id="sv2-avatar-initials" class="sv2-avatar-text">U</span>
              </div>
              <lex-stack direction="vertical" gap="1" class="sv2-profile-identity">
                <lex-text id="sv2-profile-name" variant="primary" size="h4" tag="h3">Loading...</lex-text>
                <lex-text id="sv2-profile-role" variant="secondary" size="body-sm" tag="p"></lex-text>
              </lex-stack>
            </lex-stack>

            <lex-divider spacing="md"></lex-divider>

            <div class="sv2-kv-grid">
              <lex-kv id="sv2-kv-firstname" label="First Name" value="--"></lex-kv>
              <lex-kv id="sv2-kv-lastname" label="Last Name" value="--"></lex-kv>
              <lex-kv id="sv2-kv-email" label="Email" value="--"></lex-kv>
              <lex-kv id="sv2-kv-org" label="Organization" value="--"></lex-kv>
              <lex-kv id="sv2-kv-title" label="Title" value="--"></lex-kv>
              <lex-kv id="sv2-kv-firm" label="Firm" value="--"></lex-kv>
              <lex-kv id="sv2-kv-location" label="Location" value="--"></lex-kv>
              <lex-kv id="sv2-kv-practice" label="Practice area" value="--"></lex-kv>
            </div>

          </div>

          <!-- Edit profile form -->
          <div id="sv2-profile-edit">
            <lex-stack direction="horizontal" gap="6" align="center">
              <div class="sv2-avatar">
                <span id="sv2-avatar-initials-edit" class="sv2-avatar-text">U</span>
              </div>
              <lex-stack direction="vertical" gap="1" class="sv2-profile-identity">
                <lex-text id="sv2-profile-name-edit" variant="primary" size="h4" tag="h3">Loading...</lex-text>
                <lex-text id="sv2-profile-role-edit" variant="secondary" size="body-sm" tag="p"></lex-text>
              </lex-stack>
            </lex-stack>

            <lex-divider spacing="md"></lex-divider>

            <lex-form id="sv2-profile-form">
              <lex-stack direction="horizontal" gap="4" wrap="true">
                <lex-input name="first_name" label="First Name" placeholder="Enter first name"></lex-input>
                <lex-input name="last_name" label="Last Name" placeholder="Enter last name"></lex-input>
                <lex-input name="title" label="Title" placeholder="e.g. Managing partner"></lex-input>
                <lex-input name="firm_name" label="Firm" placeholder="Enter firm name"></lex-input>
                <lex-input name="location" label="Location" placeholder="e.g. Atlanta, GA"></lex-input>
                <lex-input name="practice_area" label="Practice area" placeholder="e.g. estate planning"></lex-input>
              </lex-stack>
              <div class="sv2-form-actions">
                <lex-btn type="submit" variant="primary" size="sm">Save Changes</lex-btn>
                <lex-btn id="sv2-cancel-edit-btn" variant="ghost" size="sm">Cancel</lex-btn>
              </div>
            </lex-form>
          </div>

        </lex-card>
      </section>


      <!-- Personalization — always visible; saved data hydrates when the API is available.
           ══════════════════════════════════════════════════════════════ -->
      <section id="sv2-section-personalization" style="margin-bottom:0.5rem">
        <lex-card heading="Personalization" subtitle="How LANA tailors its replies to you">
          <lex-form id="sv2-personalization-form">
            <lex-stack direction="vertical" gap="4">
              <lex-select id="sv2-pz-base-style" name="base_style" label="Base style and tone"
                value="default"
                options='[{"value":"default","label":"Default"},{"value":"professional","label":"Professional"},{"value":"concise","label":"Concise"},{"value":"friendly","label":"Friendly"}]'></lex-select>
              <lex-input id="sv2-pz-nickname" name="nickname" label="Nickname" placeholder="What should LANA call you?"></lex-input>
              <lex-input id="sv2-pz-occupation" name="occupation" label="Occupation" placeholder="e.g. Litigation associate"></lex-input>
              <lex-textarea id="sv2-pz-custom-instructions" name="custom_instructions" label="Custom instructions" rows="4"
                placeholder="Tone, formatting, citation style, things to always include or avoid..."></lex-textarea>
              <lex-text variant="tertiary" size="body-xs" tag="p">Synced to your account and used to personalize LANA AI's replies.</lex-text>
            </lex-stack>

            <lex-divider spacing="md"></lex-divider>
            <lex-stack direction="vertical" gap="1">
              <lex-text variant="primary" size="body-sm" weight="semibold" tag="h3">About your practice</lex-text>
              <lex-text variant="secondary" size="body-sm" tag="p">LANA uses this to tailor every answer to your area of law.</lex-text>
            </lex-stack>

            <lex-stack direction="vertical" gap="4" style="margin-top:0.75rem">
              <lex-input id="sv2-pz-practice-areas" name="practice_areas" label="Practice areas" placeholder="Comma-separated, e.g. estate planning, personal injury"></lex-input>
              <lex-input id="sv2-pz-jurisdictions" name="jurisdictions" label="Jurisdictions" placeholder="Comma-separated, e.g. Georgia, Alabama, Florida"></lex-input>
              <lex-input id="sv2-pz-role" name="role" label="Role" placeholder="e.g. solo lawyer with a paralegal"></lex-input>
              <lex-input id="sv2-pz-represents" name="represents" label="Who you usually represent" placeholder="e.g. individuals and families"></lex-input>
              <lex-input id="sv2-pz-typical-tasks" name="typical_tasks" label="Typical tasks" placeholder="Comma-separated"></lex-input>
              <lex-textarea id="sv2-pz-goals" name="goals" label="Goals" rows="2"></lex-textarea>
              <lex-textarea id="sv2-pz-about" name="about" label="About you (free-form)" rows="3"></lex-textarea>
            </lex-stack>

            <div class="sv2-form-actions">
              <lex-btn id="sv2-pz-save-btn" type="submit" variant="primary" size="sm">Save</lex-btn>
              <lex-text id="sv2-pz-status" variant="tertiary" size="body-sm"></lex-text>
            </div>
          </lex-form>

          <lex-divider spacing="md"></lex-divider>

          <section id="sv2-personalization-memory" class="sv2-memory" aria-busy="true">
            <div class="sv2-memory-header">
              <div>
                <lex-text variant="primary" size="body-sm" weight="semibold" tag="h3">LANA Memory</lex-text>
                <lex-text variant="secondary" size="body-sm" tag="p">What LANA has retained for personalization and workspace continuity.</lex-text>
              </div>
              <lex-btn id="sv2-memory-manage-btn" variant="secondary" size="sm" icon="database">Manage memories</lex-btn>
            </div>
            <lex-text id="sv2-memory-status" variant="tertiary" size="body-sm" tag="p">Loading memory...</lex-text>
          </section>
        </lex-card>
      </section>

      <!-- Active sessions (settings-sessions.js): every device signed in to this account.
           ══════════════════════════════════════════════════════════════ -->
      <section id="sv2-section-sessions" class="sv2-sessions">
        <lex-card id="sv2-sessions-card" heading="Active sessions" subtitle="Devices signed in to your LANA account">
          <p id="sv2-sessions-status" class="sv2-sessions-note">Loading sessions...</p>
          <ul id="sv2-sessions-list" class="sv2-sessions-list" aria-label="Signed-in devices"></ul>
          <div class="sv2-sessions-footer">
            <p class="sv2-sessions-note">Signs out every device, including this computer. You will need to sign in again on each one.</p>
            <lex-btn id="sv2-sessions-signout-all" variant="danger" size="sm" icon="log-out" label="Sign out of all devices"></lex-btn>
          </div>
        </lex-card>
      </section>

      </div><!-- /sv2-panel-profile -->


      <!-- ╔════════════════════ CAPABILITIES PANEL ════════════════════╗ -->
      <div class="sv2-panel" id="sv2-panel-computer" role="tabpanel"
        aria-labelledby="sv2-tab-computer" data-section="computer">
        <section id="sv2-section-local-engine" class="sv2-local-engine" aria-busy="true" hidden>
          <lex-card heading="AI models" subtitle="Where LANA's AI runs, and the AI models kept on this computer">
            <div class="sv2-local-engine-head">
              <span class="sv2-local-engine-option-name">Local AI engine</span>
              <div class="sv2-local-engine-head-side">
                <lex-badge id="sv2-local-engine-badge" label="Checking" color="gray"></lex-badge>
                <lex-btn id="sv2-local-engine-restart" variant="ghost" size="sm" label="Restart" hidden></lex-btn>
              </div>
            </div>
            <p id="sv2-local-engine-note" class="sv2-local-engine-note"></p>
            <p id="sv2-local-engine-message" class="sv2-local-engine-message" role="status" hidden></p>
            <div id="sv2-local-engine-rows" class="sv2-local-engine-rows"></div>
            <div id="sv2-local-engine-use" class="sv2-local-engine-option" hidden>
              <div class="sv2-local-engine-option-copy">
                <span class="sv2-local-engine-option-name">Use local AI engine</span>
                <span class="sv2-local-engine-option-description">When off, LANA's AI runs on your organization's server.</span>
              </div>
              <lex-toggle id="sv2-local-engine-toggle" name="local_engine_enabled" aria-label="Use local AI engine"></lex-toggle>
            </div>
            <div id="sv2-local-engine-bg" hidden>
              <div class="sv2-local-engine-option">
                <div class="sv2-local-engine-option-copy">
                  <span class="sv2-local-engine-option-name">Run my background jobs on this computer when possible</span>
                  <span class="sv2-local-engine-option-description">Your own agent runs and document indexing start here. When this computer sleeps, closes or goes offline, they move to your organization's cloud.</span>
                </div>
                <lex-toggle id="sv2-local-engine-bg-toggle" name="local_engine_background_jobs" aria-label="Run my background jobs on this computer when possible"></lex-toggle>
              </div>
              <div class="sv2-local-engine-jobs">
                <div class="sv2-local-engine-jobs-head">
                  <span class="sv2-local-engine-option-name">Background jobs</span>
                  <lex-badge id="sv2-local-engine-jobs-badge" label="Checking" color="gray"></lex-badge>
                </div>
                <div id="sv2-local-engine-jobs-list" class="sv2-local-engine-jobs-list" role="list"></div>
                <p id="sv2-local-engine-jobs-empty" class="sv2-local-engine-note" hidden></p>
              </div>
            </div>
            <!-- Speech models (settings-briefs.js): shown while LANA Briefs is on. -->
            <div id="sv2-section-briefs-models" class="sv2-local-engine-speech sv2-briefs" hidden>
              <div class="sv2-local-engine-option-copy">
                <span class="sv2-local-engine-option-name">Speech models</span>
                <span class="sv2-local-engine-option-description">LANA Briefs transcribes meetings on this computer. Notes and actions are written by LANA's AI.</span>
              </div>
              <div id="sv2-briefs-models" class="sv2-briefs-models" aria-live="polite"></div>
            </div>
          </lex-card>
        </section>
        <section id="sv2-section-offline-copy" class="sv2-offline-copy" aria-busy="true" hidden>
          <lex-card heading="Offline copy" subtitle="Your own matters, tasks, contacts, notes, recent chats and documents, encrypted on this computer">
            <div class="sv2-offline-copy-head">
              <lex-badge id="sv2-offline-copy-badge" label="Checking" color="gray"></lex-badge>
              <lex-btn id="sv2-offline-copy-sync" variant="ghost" size="sm">Sync now</lex-btn>
            </div>
            <p id="sv2-offline-copy-message" class="sv2-offline-copy-message" role="status" hidden></p>
            <dl id="sv2-offline-copy-rows" class="sv2-offline-copy-rows"></dl>
            <div id="sv2-offline-copy-conflicts" class="sv2-offline-copy-list" role="list" aria-label="Changes to review" hidden></div>
            <div id="sv2-offline-copy-refused" class="sv2-offline-copy-list" role="list" aria-label="Changes not saved" hidden></div>
            <p class="sv2-offline-copy-note">Answers from the offline copy are labelled with the time of the last sync. Changes you make offline sync when you are back online; chat cannot make changes while offline.</p>
          </lex-card>
          <lex-card id="sv2-offline-copy-admin" heading="Offline copies for your organization" subtitle="For organization admins" hidden>
            <div class="sv2-offline-copy-option">
              <div class="sv2-offline-copy-option-copy">
                <span class="sv2-offline-copy-option-name">Let people keep an offline copy</span>
                <span id="sv2-offline-copy-admin-description" class="sv2-offline-copy-option-description"></span>
              </div>
              <lex-toggle id="sv2-offline-copy-admin-toggle" name="offline_copies_enabled" aria-label="Let people keep an offline copy"></lex-toggle>
            </div>
          </lex-card>
        </section>
        <section id="sv2-section-reembed" class="sv2-reembed" aria-busy="true" hidden>
          <lex-card heading="Search re-indexing for your organization" subtitle="For organization admins">
            <div class="sv2-reembed-head">
              <span class="sv2-reembed-name">Documents moved to the current search model</span>
              <lex-badge id="sv2-reembed-badge" label="Checking" color="gray"></lex-badge>
            </div>
            <lex-progress-bar id="sv2-reembed-bar" class="sv2-reembed-bar" value="0" size="sm" hidden></lex-progress-bar>
            <dl id="sv2-reembed-rows" class="sv2-reembed-rows" hidden></dl>
            <div id="sv2-reembed-excluded" class="sv2-reembed-callout" hidden>
              <span id="sv2-reembed-excluded-title" class="sv2-reembed-callout-title"></span>
              <span id="sv2-reembed-excluded-reason" class="sv2-reembed-callout-detail"></span>
            </div>
            <div id="sv2-reembed-error" class="sv2-reembed-callout" data-tone="red" role="status" hidden>
              <span id="sv2-reembed-error-when" class="sv2-reembed-callout-title"></span>
              <span id="sv2-reembed-error-label" class="sv2-reembed-callout-detail"></span>
            </div>
            <p id="sv2-reembed-note" class="sv2-reembed-note" hidden></p>
          </lex-card>
        </section>
      </div><!-- /sv2-panel-computer -->

      <!-- ╔═════════════════════════ SCREEN DICTION PANEL ══════════════╗
           Hidden until the feature ships (SCREEN_DICTION_READY in src/screen-voice/feature.js). -->
      <div class="sv2-panel sv2-hidden" id="sv2-panel-screen-diction" role="tabpanel"
        aria-labelledby="sv2-tab-screen-diction" data-section="screen-diction">
        <section id="sv2-section-screen-diction" class="sv2-screen-diction" aria-busy="true">
          <lex-card heading="Screen diction" subtitle="Speak, and LANA types or acts in the app in front of you">
            <div id="sv2-capabilities-list" class="sv2-capabilities-list" aria-live="polite"></div>
            <p id="sv2-capabilities-status" class="sv2-capabilities-status" role="status"></p>
          </lex-card>
        </section>
      </div><!-- /sv2-panel-screen-diction -->

      <!-- ╔════════════════════════ CONNECTED DEVICES PANEL ═══════════╗
           Paired phones, how meetings arrive and background updates (LANA Briefs).
           Rendered by settings-briefs.js; the Phones dialog is briefs-phones-ui.js. -->
      <div class="sv2-panel sv2-hidden" id="sv2-panel-phone" role="tabpanel"
        aria-labelledby="sv2-tab-phone" data-section="phone">
        <section id="sv2-section-phone" class="sv2-briefs">
          <lex-card heading="Phones" subtitle="Phones that send meetings to this computer">
            <div class="sv2-briefs-head">
              <lex-badge id="sv2-phone-badge" label="Checking" color="gray"></lex-badge>
              <lex-btn id="sv2-phone-manage" variant="secondary" size="sm" leading-icon="smartphone" label="Pair a phone"></lex-btn>
            </div>
            <p id="sv2-phone-summary" class="sv2-briefs-note"></p>
            <div id="sv2-phone-rows" class="sv2-briefs-rows"></div>
            <p id="sv2-phone-error" class="sv2-briefs-message" role="alert" hidden></p>
          </lex-card>
          <lex-card heading="Proximity check" subtitle="How this computer knows a phone is in the room before it accepts a meeting">
            <div id="sv2-phone-proximity"></div>
          </lex-card>
          <lex-card heading="Background updates" subtitle="Changes to meetings a phone already has">
            <div class="sv2-briefs-option sv2-briefs-option-first">
              <div class="sv2-briefs-option-copy">
                <span class="sv2-briefs-option-name">Let paired phones receive updates in the background</span>
                <span class="sv2-briefs-option-description">After a sync checked by the tone or QR code, the phone can get your changes to meetings it already has without the tone, while it is on this network. It never sends anything or receives new meetings this way.</span>
              </div>
              <lex-toggle id="sv2-phone-background" name="briefs_background_updates" aria-label="Let paired phones receive updates in the background"></lex-toggle>
            </div>
            <div class="sv2-briefs-option">
