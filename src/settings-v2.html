<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - LANA AI</title>

  <!-- ── CSS + Tailwind in head — behavioral scripts at end of body ── -->
  <link rel="stylesheet" href="css/lex-tokens.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/settings-v2.css">
  <link rel="stylesheet" href="css/tailwind-output.css">
  <link rel="stylesheet" href="css/companion-bridge-consent.css">
  <script src="js/tailwind-loader.js"></script>

  <link rel="stylesheet" href="css/lex-chat.css">
</head>
<body>

  <!-- Branded loader — shows once lex-loader.js upgrades the element -->
  <lex-loader theme="light"></lex-loader>

  <!-- App shell — sidebar, topbar, empty content area.
       Page content lives in <template> below and gets injected after
       the shell renders. This avoids double-rendering of child components. -->
  <lex-app
    logo-src="img/logo-light.png"
    logo-alt="LANA AI"
    logo-href="dashboard.html"
    active-nav-id="settings"
    page-title="Settings"
  ></lex-app>

  <!-- Page content as inert <template> — elements inside are NOT upgraded
       by the browser until cloned into the live DOM. Zero double-rendering. -->
  <template id="page-content">

    <main class="sv2-page">

     <lex-banner
       class="sv2-banner"
       variant="light"
       heading="Settings"
       subtitle="Manage your profile, preferences, and account"
       lana
       lana-context-type="full_chat"
     ></lex-banner>

     <div class="sv2-layout">

      <!-- In-page section navigation (left rail).
           Icons are injected from Lex.Icons by settings-v2-nav.js. -->
      <nav class="sv2-nav" role="tablist" aria-orientation="vertical" aria-label="Settings sections">
        <button type="button" class="sv2-nav-item" role="tab" id="sv2-tab-profile"
          data-section="profile" aria-controls="sv2-panel-profile" aria-selected="true">
          <span class="sv2-nav-icon" data-icon="user" aria-hidden="true"></span>
          <span class="sv2-nav-label">Profile</span>
        </button>
        <button type="button" class="sv2-nav-item" role="tab" id="sv2-tab-general"
          data-section="general" aria-controls="sv2-panel-general" aria-selected="false" tabindex="-1">
          <span class="sv2-nav-icon" data-icon="settings" aria-hidden="true"></span>
          <span class="sv2-nav-label">General</span>
        </button>
        <button type="button" class="sv2-nav-item" role="tab" id="sv2-tab-security"
          data-section="security" aria-controls="sv2-panel-security" aria-selected="false" tabindex="-1">
          <span class="sv2-nav-icon" data-icon="shield" aria-hidden="true"></span>
          <span class="sv2-nav-label">Security</span>
        </button>
        <button type="button" class="sv2-nav-item" role="tab" id="sv2-tab-personalization"
          data-section="personalization" aria-controls="sv2-panel-personalization" aria-selected="false" tabindex="-1">
          <span class="sv2-nav-icon" data-icon="wand-2" aria-hidden="true"></span>
          <span class="sv2-nav-label">Personalization</span>
        </button>
        <button type="button" class="sv2-nav-item" role="tab" id="sv2-tab-capabilities"
          data-section="capabilities" aria-controls="sv2-panel-capabilities" aria-selected="false" tabindex="-1">
          <span class="sv2-nav-icon" data-icon="puzzle" aria-hidden="true"></span>
          <span class="sv2-nav-label">Capabilities</span>
        </button>
        <button type="button" class="sv2-nav-item sv2-hidden" role="tab" id="sv2-tab-plugins"
          data-section="plugins" aria-controls="sv2-panel-plugins" aria-selected="false" tabindex="-1">
          <span class="sv2-nav-icon" data-icon="plug" aria-hidden="true"></span>
          <span class="sv2-nav-label">Plugins</span>
        </button>
        <button type="button" class="sv2-nav-item sv2-hidden" role="tab" id="sv2-tab-billing"
          data-section="billing" aria-controls="sv2-panel-billing" aria-selected="false" tabindex="-1">
          <span class="sv2-nav-icon" data-icon="sparkles" aria-hidden="true"></span>
          <span class="sv2-nav-label">Plan &amp; billing</span>
        </button>
        <button type="button" class="sv2-nav-item" role="tab" id="sv2-tab-usage"
          data-section="usage" aria-controls="sv2-panel-usage" aria-selected="false" tabindex="-1">
          <span class="sv2-nav-icon" data-icon="bar-chart-2" aria-hidden="true"></span>
          <span class="sv2-nav-label">Usage</span>
        </button>
        <button type="button" class="sv2-nav-item sv2-hidden" role="tab" id="sv2-tab-data-controls"
          data-section="data-controls" aria-controls="sv2-panel-data-controls" aria-selected="false" tabindex="-1">
          <span class="sv2-nav-icon" data-icon="shield" aria-hidden="true"></span>
          <span class="sv2-nav-label">Data controls</span>
        </button>
      </nav>

      <div class="sv2-panels">

      <!-- ╔═══════════════════════ PROFILE PANEL ═══════════════════════╗ -->
      <div class="sv2-panel is-active" id="sv2-panel-profile" role="tabpanel"
        aria-labelledby="sv2-tab-profile" data-section="profile">

      <!-- Profile
           ══════════════════════════════════════════════════════════════ -->
      <section id="sv2-section-profile" style="margin-bottom:0.5rem">
        <lex-card id="sv2-profile-card" heading="Profile Information" actions='[{"icon":"edit","label":"Edit"}]'>

          <!-- Read-only profile view -->
          <div id="sv2-profile-view">
            <lex-stack direction="horizontal" gap="6" align="center">
              <div class="sv2-avatar">
                <span id="sv2-avatar-initials" class="sv2-avatar-text">U</span>
              </div>
              <lex-stack direction="vertical" gap="1" class="sv2-profile-identity">
                <lex-text id="sv2-profile-name" variant="primary" size="h4" tag="h3">Loading...</lex-text>
                <lex-text id="sv2-profile-role" variant="secondary" size="body-sm" tag="p"></lex-text>
              </lex-stack>
            </lex-stack>

            <lex-divider spacing="md"></lex-divider>

            <div class="sv2-kv-grid">
              <lex-kv id="sv2-kv-firstname" label="First Name" value="--"></lex-kv>
              <lex-kv id="sv2-kv-lastname" label="Last Name" value="--"></lex-kv>
              <lex-kv id="sv2-kv-email" label="Email" value="--"></lex-kv>
              <lex-kv id="sv2-kv-org" label="Organization" value="--"></lex-kv>
              <lex-kv id="sv2-kv-title" label="Title" value="--"></lex-kv>
              <lex-kv id="sv2-kv-firm" label="Firm" value="--"></lex-kv>
              <lex-kv id="sv2-kv-location" label="Location" value="--"></lex-kv>
              <lex-kv id="sv2-kv-practice" label="Practice area" value="--"></lex-kv>
            </div>

          </div>

          <!-- Edit profile form -->
          <div id="sv2-profile-edit">
            <lex-stack direction="horizontal" gap="6" align="center">
              <div class="sv2-avatar">
                <span id="sv2-avatar-initials-edit" class="sv2-avatar-text">U</span>
              </div>
              <lex-stack direction="vertical" gap="1" class="sv2-profile-identity">
                <lex-text id="sv2-profile-name-edit" variant="primary" size="h4" tag="h3">Loading...</lex-text>
                <lex-text id="sv2-profile-role-edit" variant="secondary" size="body-sm" tag="p"></lex-text>
              </lex-stack>
            </lex-stack>

            <lex-divider spacing="md"></lex-divider>

            <lex-form id="sv2-profile-form">
              <lex-stack direction="horizontal" gap="4" wrap="true">
                <lex-input name="first_name" label="First Name" placeholder="Enter first name"></lex-input>
                <lex-input name="last_name" label="Last Name" placeholder="Enter last name"></lex-input>
                <lex-input name="title" label="Title" placeholder="e.g. Managing partner"></lex-input>
                <lex-input name="firm_name" label="Firm" placeholder="Enter firm name"></lex-input>
                <lex-input name="location" label="Location" placeholder="e.g. Atlanta, GA"></lex-input>
                <lex-input name="practice_area" label="Practice area" placeholder="e.g. estate planning"></lex-input>
              </lex-stack>
              <div class="sv2-form-actions">
                <lex-btn type="submit" variant="primary" size="sm">Save Changes</lex-btn>
                <lex-btn id="sv2-cancel-edit-btn" variant="ghost" size="sm">Cancel</lex-btn>
              </div>
            </lex-form>
          </div>

        </lex-card>
      </section>


      </div><!-- /sv2-panel-profile -->

      <!-- ╔══════════════════ PERSONALIZATION PANEL ═══════════════════╗ -->
      <div class="sv2-panel" id="sv2-panel-personalization" role="tabpanel"
        aria-labelledby="sv2-tab-personalization" data-section="personalization">

      <!-- Personalization — always visible; saved data hydrates when the API is available.
           ══════════════════════════════════════════════════════════════ -->
      <section id="sv2-section-personalization" style="margin-bottom:0.5rem">
        <lex-card heading="Personalization" subtitle="How LANA tailors its replies to you">
          <lex-form id="sv2-personalization-form">
            <lex-stack direction="vertical" gap="4">
              <lex-select id="sv2-pz-base-style" name="base_style" label="Base style and tone"
                value="default"
                options='[{"value":"default","label":"Default"},{"value":"professional","label":"Professional"},{"value":"concise","label":"Concise"},{"value":"friendly","label":"Friendly"}]'></lex-select>
              <lex-input id="sv2-pz-nickname" name="nickname" label="Nickname" placeholder="What should LANA call you?"></lex-input>
              <lex-input id="sv2-pz-occupation" name="occupation" label="Occupation" placeholder="e.g. Litigation associate"></lex-input>
              <lex-textarea id="sv2-pz-custom-instructions" name="custom_instructions" label="Custom instructions" rows="4"
                placeholder="Tone, formatting, citation style, things to always include or avoid..."></lex-textarea>
              <lex-text variant="tertiary" size="body-xs" tag="p">Synced to your account and used to personalize LANA AI's replies.</lex-text>
            </lex-stack>

            <lex-divider spacing="md"></lex-divider>
            <lex-stack direction="vertical" gap="1">
              <lex-text variant="primary" size="body-sm" weight="semibold" tag="h3">About your practice</lex-text>
              <lex-text variant="secondary" size="body-sm" tag="p">LANA uses this to tailor every answer to your area of law.</lex-text>
            </lex-stack>

            <lex-stack direction="vertical" gap="4" style="margin-top:0.75rem">
              <lex-input id="sv2-pz-practice-areas" name="practice_areas" label="Practice areas" placeholder="Comma-separated, e.g. estate planning, personal injury"></lex-input>
              <lex-input id="sv2-pz-jurisdictions" name="jurisdictions" label="Jurisdictions" placeholder="Comma-separated, e.g. Georgia, Alabama, Florida"></lex-input>
              <lex-input id="sv2-pz-role" name="role" label="Role" placeholder="e.g. solo lawyer with a paralegal"></lex-input>
              <lex-input id="sv2-pz-represents" name="represents" label="Who you usually represent" placeholder="e.g. individuals and families"></lex-input>
              <lex-input id="sv2-pz-typical-tasks" name="typical_tasks" label="Typical tasks" placeholder="Comma-separated"></lex-input>
              <lex-textarea id="sv2-pz-goals" name="goals" label="Goals" rows="2"></lex-textarea>
              <lex-textarea id="sv2-pz-about" name="about" label="About you (free-form)" rows="3"></lex-textarea>
            </lex-stack>

            <div class="sv2-form-actions">
              <lex-btn id="sv2-pz-save-btn" type="submit" variant="primary" size="sm">Save</lex-btn>
              <lex-text id="sv2-pz-status" variant="tertiary" size="body-sm"></lex-text>
            </div>
          </lex-form>

          <lex-divider spacing="md"></lex-divider>

          <section id="sv2-personalization-memory" class="sv2-memory" aria-busy="true">
            <div class="sv2-memory-header">
              <div>
                <lex-text variant="primary" size="body-sm" weight="semibold" tag="h3">LANA Memory</lex-text>
                <lex-text variant="secondary" size="body-sm" tag="p">What LANA has retained for personalization and workspace continuity.</lex-text>
              </div>
              <lex-btn id="sv2-memory-manage-btn" variant="secondary" size="sm" icon="database">Manage memories</lex-btn>
            </div>
            <lex-text id="sv2-memory-status" variant="tertiary" size="body-sm" tag="p">Loading memory...</lex-text>
          </section>
        </lex-card>
      </section>


      </div><!-- /sv2-panel-personalization -->

      <!-- ╔════════════════════ CAPABILITIES PANEL ════════════════════╗ -->
      <div class="sv2-panel" id="sv2-panel-capabilities" role="tabpanel"
        aria-labelledby="sv2-tab-capabilities" data-section="capabilities">
        <section id="sv2-section-capabilities" style="margin-bottom:0.5rem" aria-busy="true">
          <lex-card heading="Capabilities" subtitle="Features connected to your organization">
            <p class="sv2-capabilities-intro">
              Choose which optional capabilities are active on this device. Required capabilities are managed by your organization.
            </p>
            <div id="sv2-capabilities-list" class="sv2-capabilities-list" aria-live="polite"></div>
            <p id="sv2-capabilities-status" class="sv2-capabilities-status" role="status">Loading capabilities...</p>
          </lex-card>
        </section>
      </div><!-- /sv2-panel-capabilities -->

      <!-- ╔══════════════════════ PLUGINS PANEL ══════════════════════╗ -->
      <div class="sv2-panel sv2-hidden" id="sv2-panel-plugins" role="tabpanel"
        aria-labelledby="sv2-tab-plugins" data-section="plugins">
        <section id="sv2-section-user-connections" style="margin-bottom:0.5rem" aria-busy="true">
          <lex-card heading="Plugins &amp; Connections" subtitle="Connect your personal accounts to available LANA connectors">
            <div id="sv2-user-connections-content">
              <!-- Loading / list / empty rendered by JS -->
            </div>
            <p id="sv2-user-connections-status" class="sv2-connections-status" role="status">Checking connector availability...</p>
          </lex-card>
        </section>
      </div><!-- /sv2-panel-plugins -->

      <!-- ╔═══════════════════════ GENERAL PANEL ═══════════════════════╗
           App and account settings: time zone, password + MFA, preferences,
           active sessions, connected apps, and VPN. -->
      <div class="sv2-panel" id="sv2-panel-general" role="tabpanel"
        aria-labelledby="sv2-tab-general" data-section="general">

      <!-- Regional
           ══════════════════════════════════════════════════════════════ -->
      <section id="sv2-section-regional" style="margin-bottom:0.5rem">
        <lex-card heading="Time Zone" subtitle="How dates and times appear across LANA AI">
          <lex-stack direction="vertical" gap="3">
            <lex-select id="sv2-timezone-select"
              name="timezone"
              label="Time zone"
              placeholder="Select your time zone..."
              searchable="true">
            </lex-select>
            <lex-stack direction="horizontal" gap="3" align="center">
              <lex-btn id="sv2-tz-detect-btn" variant="ghost" size="sm">Detect</lex-btn>
              <lex-text id="sv2-tz-current" variant="tertiary" size="body-sm"></lex-text>
            </lex-stack>
          </lex-stack>
        </lex-card>
      </section>


      <!-- Preferences (conditionally shown by JS)
           ══════════════════════════════════════════════════════════════ -->
      <section id="sv2-section-preferences" class="sv2-hidden" style="margin-bottom:0.5rem">
        <lex-card heading="Preferences" subtitle="Customize your experience">
          <lex-stack direction="vertical" gap="0" divider="true">
            <lex-stack class="sv2-preference-row" direction="horizontal" gap="4" justify="between" align="center">
              <lex-stack class="sv2-preference-copy" direction="vertical" gap="1">
                <lex-text variant="primary" size="body" weight="medium">Desktop notifications</lex-text>
                <lex-text variant="tertiary" size="body-sm">Allow push notifications on devices where notifications are enabled</lex-text>
              </lex-stack>
              <lex-toggle id="sv2-pref-push" name="push_notifications"></lex-toggle>
            </lex-stack>

            <lex-stack class="sv2-preference-row" direction="horizontal" gap="4" justify="between" align="center">
              <lex-stack class="sv2-preference-copy" direction="vertical" gap="1">
                <lex-text variant="primary" size="body" weight="medium">In-app notifications</lex-text>
                <lex-text variant="tertiary" size="body-sm">Show notifications inside LANA AI</lex-text>
              </lex-stack>
              <lex-stack class="sv2-preference-actions" direction="horizontal" gap="2" align="center">
                <lex-toggle id="sv2-pref-in-app" name="in_app_notifications"></lex-toggle>
                <button type="button" id="sv2-in-app-types-toggle" class="sv2-capability-chevron-button sv2-in-app-types-toggle" aria-expanded="false" aria-controls="sv2-in-app-types" aria-label="Show in-app notification types">
                  <span class="sv2-capability-chevron" aria-hidden="true"></span>
                </button>
              </lex-stack>
            </lex-stack>

            <lex-stack id="sv2-in-app-types" class="sv2-in-app-types sv2-hidden" direction="vertical" gap="0" divider="true"></lex-stack>
          </lex-stack>
        </lex-card>
      </section>


      <!-- Connected Apps (Electron only — bridge consents)
           ══════════════════════════════════════════════════════════════ -->
      <section id="sv2-section-connected-apps" class="sv2-hidden" style="margin-bottom:0.5rem">
        <lex-card heading="Connected Apps" subtitle="Sibling Lana apps you have allowed to use this device's signed-in session">
          <div id="sv2-connected-apps-content">
            <!-- Loading / list / empty rendered by JS -->
          </div>
        </lex-card>
      </section>


      <!-- VPN (conditionally shown by JS — Electron only)
           ══════════════════════════════════════════════════════════════ -->
      <section id="sv2-section-vpn" class="sv2-hidden">
        <div id="sv2-vpn-content">
          <!-- Entire VPN content rendered by JS (configured vs. not-configured states) -->
        </div>
      </section>

      </div><!-- /sv2-panel-general -->

      <!-- ╔══════════════════════ SECURITY PANEL ══════════════════════╗ -->
      <div class="sv2-panel" id="sv2-panel-security" role="tabpanel"
        aria-labelledby="sv2-tab-security" data-section="security">
        <section id="sv2-section-security" style="margin-bottom:0.5rem">

          <!-- Password Change Card -->
          <lex-card heading="Change Password" subtitle="Update your account password">
            <lex-form id="sv2-password-form">
              <lex-stack direction="vertical" gap="4">
                <lex-input id="sv2-current-password" name="current_password"
                  label="Current Password" required="true"></lex-input>

                <div>
                  <lex-input id="sv2-new-password" name="new_password"
                    label="New Password" required="true"></lex-input>
                  <div id="sv2-pw-requirements" class="sv2-pw-requirements">
                    <!-- Populated by JS -->
                  </div>
                </div>

                <lex-input id="sv2-confirm-password" name="confirm_password"
                  label="Confirm New Password" required="true"></lex-input>
              </lex-stack>

              <div class="sv2-form-actions">
                <lex-btn id="sv2-update-password-btn" type="submit" variant="primary" size="sm" disabled>
                  Update Password
                </lex-btn>
              </div>
            </lex-form>
          </lex-card>

          <!-- MFA Card (hidden until the backend rollout is enabled) -->
          <div id="sv2-mfa-section" class="sv2-hidden" hidden aria-hidden="true"></div>

        </section>

        <section id="sv2-section-sessions" style="margin-bottom:0.5rem">
          <lex-card id="sv2-sessions-card" heading="Active Sessions">
            <lex-stack class="sv2-sessions-summary" direction="horizontal" gap="4" justify="between" align="center">
              <lex-stack class="sv2-sessions-summary-copy" direction="vertical" gap="1">
                <lex-text variant="secondary" size="body-sm">Review signed-in devices and revoke sessions you no longer use.</lex-text>
                <lex-text id="sv2-sessions-status" variant="tertiary" size="body-sm">Loading sessions...</lex-text>
              </lex-stack>
              <lex-btn id="sv2-sessions-manage-btn" variant="secondary" size="sm" icon="monitor">Manage sessions</lex-btn>
            </lex-stack>
          </lex-card>
        </section>
      </div><!-- /sv2-panel-security -->

      <!-- ╔═══════════════════ PLAN & BILLING PANEL ════════════════════╗
           Account menu deep-links here via settings-v2.html#billing.
           No billing/subscription endpoints exist in the client yet, so this
           is a section shell only. -->
      <div class="sv2-panel sv2-hidden" id="sv2-panel-billing" role="tabpanel"
        aria-labelledby="sv2-tab-billing" data-section="billing">
        <section id="sv2-section-billing" style="margin-bottom:0.5rem">
          <lex-card heading="Plan &amp; billing" subtitle="Your LANA One subscription">
            <lex-stack direction="vertical" gap="3">
              <lex-text variant="secondary" size="body-sm">Billing is managed on the web. Open your account to view or change your plan, payment method, and billing history.</lex-text>
              <!-- NOTE: confirm the exact billing path on one.lanaai.io; using /settings for now -->
              <lex-btn id="sv2-manage-billing-btn" variant="primary" size="sm" icon="external-link"
                data-billing-url="https://one.lanaai.io/settings">Manage billing</lex-btn>
            </lex-stack>
          </lex-card>
        </section>
      </div><!-- /sv2-panel-billing -->

      <!-- ╔═══════════════════════ USAGE PANEL ═════════════════════════╗ -->
      <div class="sv2-panel" id="sv2-panel-usage" role="tabpanel"
        aria-labelledby="sv2-tab-usage" data-section="usage">
        <section id="sv2-section-usage" class="sv2-section-usage" aria-busy="true">
          <lex-card heading="Usage">
            <div class="sv2-usage">
              <div class="sv2-usage-quota" aria-label="Usage meters">
                <div id="sv2-chat-usage-row" class="sv2-usage-quota-row" hidden>
                  <div class="sv2-usage-quota-heading">
                    <span class="sv2-usage-label">
                      <span class="sv2-usage-icon" data-usage-icon="message-square" aria-hidden="true"></span>
                      Chat usage
                    </span>
                    <span id="sv2-chat-usage-percent" class="sv2-usage-value">Not metered</span>
                  </div>
                  <lex-progress-bar id="sv2-chat-usage-bar" value="0" size="xs" hidden></lex-progress-bar>
                  <p id="sv2-chat-usage-detail" class="sv2-usage-detail">Your current plan does not report a chat limit.</p>
                </div>

                <div class="sv2-usage-quota-row">
                  <div class="sv2-usage-quota-heading">
                    <span class="sv2-usage-label">
                      <span class="sv2-usage-icon" data-usage-icon="file" aria-hidden="true"></span>
                      <span id="sv2-storage-label">Your stored files</span>
                    </span>
                    <span id="sv2-storage-percent" class="sv2-usage-value">Loading...</span>
                  </div>
                  <lex-progress-bar id="sv2-storage-bar" value="0" size="xs"></lex-progress-bar>
                  <p id="sv2-storage-detail" class="sv2-usage-detail">Loading storage usage...</p>
                </div>
              </div>

              <p class="sv2-usage-intro">Activity counts use the selected period where supported. Some meters are unavailable until account telemetry is enabled.</p>

              <lex-segmented id="sv2-usage-period" name="usage_period" value="30days" size="sm"
                aria-label="Usage reporting period"
                options='[{"value":"7days","label":"Last 7 days"},{"value":"30days","label":"Last 30 days"},{"value":"alltime","label":"All time"}]'>
              </lex-segmented>

              <div class="sv2-usage-metrics" aria-live="polite">
                <div class="sv2-usage-metric">
                  <strong id="sv2-estimated-tokens" class="sv2-usage-metric-value">—</strong>
                  <span class="sv2-usage-metric-label">Estimated tokens</span>
                  <span id="sv2-token-breakdown" class="sv2-usage-metric-detail">Token detail unavailable</span>
                </div>
                <div class="sv2-usage-metric">
                  <strong id="sv2-message-count" class="sv2-usage-metric-value">—</strong>
                  <span class="sv2-usage-metric-label">Messages</span>
                  <span id="sv2-message-detail" class="sv2-usage-metric-detail">In selected period</span>
                </div>
                <div class="sv2-usage-metric">
                  <strong id="sv2-conversation-count" class="sv2-usage-metric-value">—</strong>
                  <span class="sv2-usage-metric-label">Conversations</span>
                  <span id="sv2-conversation-detail" class="sv2-usage-metric-detail">All-time total</span>
                </div>
