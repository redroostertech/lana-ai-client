<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - LANA AI</title>

  <!-- ── CSS + Tailwind in head — behavioral scripts at end of body ── -->
  <link rel="stylesheet" href="css/lex-tokens.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/settings-v2.css">
  <link rel="stylesheet" href="css/tailwind-output.css">
  <link rel="stylesheet" href="css/companion-bridge-consent.css">
  <script src="js/tailwind-loader.js"></script>

</head>
<body>

  <!-- Branded loader — shows once lex-loader.js upgrades the element -->
  <lex-loader theme="light"></lex-loader>

  <!-- App shell — sidebar, topbar, empty content area.
       Page content lives in <template> below and gets injected after
       the shell renders. This avoids double-rendering of child components. -->
  <lex-app
    logo-src="img/logo-light.png"
    logo-alt="LANA AI"
    logo-href="dashboard.html"
    active-nav-id="settings"
    page-title="Settings"
  ></lex-app>

  <!-- Page content as inert <template> — elements inside are NOT upgraded
       by the browser until cloned into the live DOM. Zero double-rendering. -->
  <template id="page-content">

    <main class="sv2-page">

      <!-- Profile
           ══════════════════════════════════════════════════════════════ -->
      <section id="sv2-section-profile" style="margin-bottom:0.5rem">
        <lex-card id="sv2-profile-card" heading="Profile Information" actions='[{"icon":"edit","label":"Edit"}]'>

          <!-- Read-only profile view -->
          <div id="sv2-profile-view">
            <lex-stack direction="horizontal" gap="6" align="center">
              <div class="sv2-avatar">
                <span id="sv2-avatar-initials" class="sv2-avatar-text">U</span>
              </div>
              <lex-stack direction="vertical" gap="1">
                <lex-text id="sv2-profile-name" variant="primary" size="h4" tag="h3">Loading...</lex-text>
                <lex-text id="sv2-profile-email" variant="secondary" size="body-sm" tag="p"></lex-text>
              </lex-stack>
            </lex-stack>

            <lex-divider spacing="md"></lex-divider>

            <div class="sv2-kv-grid">
              <lex-kv id="sv2-kv-firstname" label="First Name" value="--"></lex-kv>
              <lex-kv id="sv2-kv-lastname" label="Last Name" value="--"></lex-kv>
              <lex-kv id="sv2-kv-role" label="Role" value="--"></lex-kv>
              <lex-kv id="sv2-kv-org" label="Organization" value="--"></lex-kv>
            </div>

          </div>

          <!-- Edit profile form -->
          <div id="sv2-profile-edit">
            <lex-stack direction="horizontal" gap="6" align="center">
              <div class="sv2-avatar">
                <span id="sv2-avatar-initials-edit" class="sv2-avatar-text">U</span>
              </div>
              <lex-stack direction="vertical" gap="1">
                <lex-text id="sv2-profile-name-edit" variant="primary" size="h4" tag="h3">Loading...</lex-text>
                <lex-text id="sv2-profile-email-edit" variant="secondary" size="body-sm" tag="p"></lex-text>
              </lex-stack>
            </lex-stack>

            <lex-divider spacing="md"></lex-divider>

            <lex-form id="sv2-profile-form">
              <lex-stack direction="horizontal" gap="4" wrap="true">
                <lex-input name="first_name" label="First Name" placeholder="Enter first name"></lex-input>
                <lex-input name="last_name" label="Last Name" placeholder="Enter last name"></lex-input>
              </lex-stack>
              <div class="sv2-form-actions">
                <lex-btn type="submit" variant="primary" size="sm">Save Changes</lex-btn>
                <lex-btn id="sv2-cancel-edit-btn" variant="ghost" size="sm">Cancel</lex-btn>
              </div>
            </lex-form>
          </div>

        </lex-card>
      </section>


      <!-- Personalization (LANA One — revealed by JS when the edition supports it)
           ══════════════════════════════════════════════════════════════ -->
      <section id="sv2-section-personalization" class="sv2-hidden" style="margin-bottom:0.5rem">
        <lex-card heading="Personalization" subtitle="How LANA tailors its replies to you">
          <lex-form id="sv2-personalization-form">
            <lex-stack direction="vertical" gap="4">
              <lex-select id="sv2-pz-base-style" name="base_style" label="Base style and tone"
                options='[{"value":"default","label":"Default"},{"value":"professional","label":"Professional"},{"value":"concise","label":"Concise"},{"value":"friendly","label":"Friendly"}]'></lex-select>
              <lex-input id="sv2-pz-nickname" name="nickname" label="Nickname" placeholder="What should LANA call you?"></lex-input>
              <lex-input id="sv2-pz-occupation" name="occupation" label="Occupation" placeholder="e.g. Litigation associate"></lex-input>
              <lex-textarea id="sv2-pz-custom-instructions" name="custom_instructions" label="Custom instructions" rows="4"
                placeholder="Tone, formatting, citation style, things to always include or avoid..."></lex-textarea>
            </lex-stack>

            <lex-divider spacing="md"></lex-divider>
            <lex-text variant="secondary" size="body-sm">About your practice — LANA uses this to tailor every answer to your work.</lex-text>

            <lex-stack direction="vertical" gap="4" style="margin-top:0.75rem">
              <lex-input id="sv2-pz-practice-areas" name="practice_areas" label="Practice areas" placeholder="Comma-separated, e.g. estate planning, personal injury"></lex-input>
              <lex-input id="sv2-pz-jurisdictions" name="jurisdictions" label="Jurisdictions" placeholder="Comma-separated, e.g. Georgia, Alabama, Florida"></lex-input>
              <lex-input id="sv2-pz-role" name="role" label="Role" placeholder="e.g. solo lawyer with a paralegal"></lex-input>
              <lex-input id="sv2-pz-represents" name="represents" label="Who you usually represent" placeholder="e.g. individuals and families"></lex-input>
              <lex-input id="sv2-pz-typical-tasks" name="typical_tasks" label="Typical tasks" placeholder="Comma-separated"></lex-input>
              <lex-textarea id="sv2-pz-goals" name="goals" label="Goals" rows="2"></lex-textarea>
              <lex-textarea id="sv2-pz-about" name="about" label="About you" rows="3"></lex-textarea>
            </lex-stack>

            <div class="sv2-form-actions">
              <lex-btn id="sv2-pz-save-btn" type="submit" variant="primary" size="sm">Save</lex-btn>
              <lex-text id="sv2-pz-status" variant="tertiary" size="body-sm"></lex-text>
            </div>
          </lex-form>
        </lex-card>
      </section>


      <!-- Regional
           ══════════════════════════════════════════════════════════════ -->
      <section id="sv2-section-regional" style="margin-bottom:0.5rem">
        <lex-card heading="Time Zone" subtitle="How dates and times appear across LANA AI">
          <lex-stack direction="vertical" gap="3">
            <lex-select id="sv2-timezone-select"
              name="timezone"
              label="Time zone"
              placeholder="Select your time zone..."
              searchable="true">
            </lex-select>
            <lex-stack direction="horizontal" gap="3" align="center">
              <lex-btn id="sv2-tz-detect-btn" variant="ghost" size="sm">Use browser default</lex-btn>
              <lex-text id="sv2-tz-current" variant="tertiary" size="body-sm"></lex-text>
            </lex-stack>
          </lex-stack>
        </lex-card>
      </section>


      <!-- Security
           ══════════════════════════════════════════════════════════════ -->
      <section id="sv2-section-security" style="margin-bottom:0.5rem">

        <!-- Password Change Card -->
        <lex-card heading="Change Password" subtitle="Update your account password">
          <lex-form id="sv2-password-form">
            <lex-stack direction="vertical" gap="4">
              <lex-input id="sv2-current-password" name="current_password"
                label="Current Password" required="true"></lex-input>

              <div>
                <lex-input id="sv2-new-password" name="new_password"
                  label="New Password" required="true"></lex-input>
                <div id="sv2-pw-requirements" class="sv2-pw-requirements">
                  <!-- Populated by JS -->
                </div>
              </div>

              <lex-input id="sv2-confirm-password" name="confirm_password"
                label="Confirm New Password" required="true"></lex-input>
            </lex-stack>

            <div class="sv2-form-actions">
              <lex-btn id="sv2-update-password-btn" type="submit" variant="primary" size="sm" disabled>
                Update Password
              </lex-btn>
            </div>
          </lex-form>
        </lex-card>

        <!-- MFA Card (conditionally rendered by JS) -->
        <div id="sv2-mfa-section"></div>

      </section>


      <!-- Preferences (conditionally shown by JS)
           ══════════════════════════════════════════════════════════════ -->
      <section id="sv2-section-preferences" class="sv2-hidden" style="margin-bottom:0.5rem">
        <lex-card heading="Preferences" subtitle="Customize your experience">
          <lex-stack direction="vertical" gap="5" divider="true">

            <lex-stack direction="horizontal" gap="4" justify="between" align="center">
              <lex-stack direction="vertical" gap="1">
                <lex-text variant="primary" size="body" weight="medium">Email Notifications</lex-text>
                <lex-text variant="tertiary" size="body-sm">Receive email notifications for important updates</lex-text>
              </lex-stack>
              <lex-toggle id="sv2-pref-email" name="email_notifications"></lex-toggle>
            </lex-stack>

            <lex-stack direction="horizontal" gap="4" justify="between" align="center">
              <lex-stack direction="vertical" gap="1">
                <lex-text variant="primary" size="body" weight="medium">Dark Mode</lex-text>
                <lex-text variant="tertiary" size="body-sm">Use dark theme for the interface</lex-text>
              </lex-stack>
              <lex-toggle id="sv2-pref-dark" name="dark_mode"></lex-toggle>
            </lex-stack>

          </lex-stack>
        </lex-card>
      </section>


      <!-- Sessions
           ══════════════════════════════════════════════════════════════ -->
      <section id="sv2-section-sessions" style="margin-bottom:0.5rem">
        <lex-card id="sv2-sessions-card">

          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;">
            <h3 style="font-size:var(--lex-h4-size,1.125rem);font-weight:var(--lex-h4-weight,600);color:var(--lex-text-primary);margin:0;">Active Sessions</h3>
            <lex-btn id="sv2-revoke-all-btn" variant="danger" size="sm" icon="log-out">Revoke All Other Sessions</lex-btn>
          </div>

          <lex-table
            id="sv2-sessions-table"
            columns="device,ip_address,created_at,expires_at"
            labels="Device,IP Address,Created,Expires"
            empty-text="No active sessions"
            sort-by="created_at"
            sort-dir="desc"
          ></lex-table>

          <lex-pagination id="sv2-sessions-pagination" style="margin-top:1rem;"></lex-pagination>

        </lex-card>
      </section>


      <!-- Connected Apps (Electron only — bridge consents)
           ══════════════════════════════════════════════════════════════ -->
      <section id="sv2-section-connected-apps" class="sv2-hidden" style="margin-bottom:0.5rem">
        <lex-card heading="Connected Apps" subtitle="Sibling Lana apps you have allowed to use this device's signed-in session">
          <div id="sv2-connected-apps-content">
            <!-- Loading / list / empty rendered by JS -->
          </div>
        </lex-card>
      </section>


      <!-- VPN (conditionally shown by JS — Electron only)
           ══════════════════════════════════════════════════════════════ -->
      <section id="sv2-section-vpn" class="sv2-hidden">
        <div id="sv2-vpn-content">
          <!-- Entire VPN content rendered by JS (configured vs. not-configured states) -->
        </div>
      </section>

    </main>

  </template>

  <noscript>
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,sans-serif;color:#666;">
      Please enable JavaScript to use LANA AI.
    </div>
  </noscript>

  <!-- ══════════════════════════════════════════════════════════════════
       Scripts at end of body — HTML renders first, scripts load after
       ══════════════════════════════════════════════════════════════════ -->

  <!-- Universal shell scripts -->
  <script src="js/error-reporter.js"></script>
  <script src="js/config.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/utils/rename-conversation.js"></script>
  <script src="js/components.js"></script>
  <script src="js/version.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/navigation-helpers.js"></script>
  <script src="js/new-project-modal.js"></script>
  <script src="js/conversation-menu.js"></script>
  <script src="js/conversation-search-modal.js"></script>
  <script src="js/contact-search-modal.js"></script>
  <script src="js/notifications.js"></script>

  <!-- Lex UI core -->
  <script src="js/lex/lex.core.js"></script>
  <script src="js/lex/lex.icons.js"></script>
  <script src="js/lex/lex.data.js"></script>
  <script src="js/lex/lex.forms.js"></script>
  <script src="js/lex/lex.state.js"></script>
  <script src="js/lex/lex.utils.js"></script>
  <script src="js/lex/lex.auth.js"></script>
  <script src="js/lex/lex-nav.js"></script>

  <!-- Lex UI foundation -->
  <script src="js/lex/components/foundation/lex-loader.js"></script>
  <script src="js/lex/components/foundation/lex-toast.js"></script>
  <script src="js/lex/components/foundation/lex-spinner.js"></script>
  <script src="js/lex/components/foundation/lex-btn.js"></script>
  <script src="js/lex/components/foundation/lex-empty.js"></script>

  <!-- Lex UI layout -->
  <script src="js/lex/components/layout/lex-sidebar.js"></script>
  <script src="js/lex/components/layout/lex-topbar.js"></script>
  <script src="js/lex/components/layout/lex-conversation-item.js"></script>
  <script src="js/lex/components/layout/lex-notification-panel.js"></script>
  <script src="js/lex/components/layout/lex-app.js"></script>

  <!-- Page-specific Lex components — ALL loaded BEFORE inject so custom elements
       are defined when template content enters the DOM. Tree-order upgrade ensures
       parents capture un-rendered children (no double-rendering). -->
  <script src="js/lex/components/foundation/lex-card.js"></script>
  <script src="js/lex/components/foundation/lex-badge.js"></script>
  <script src="js/lex/components/foundation/lex-text.js"></script>
  <script src="js/lex/components/foundation/lex-stack.js"></script>
  <script src="js/lex/components/foundation/lex-divider.js"></script>
  <script src="js/lex/components/foundation/lex-kv.js"></script>
  <script src="js/lex/components/foundation/lex-modal.js"></script>
  <script src="js/lex/components/form/lex-input.js"></script>
  <script src="js/lex/components/form/lex-form.js"></script>
  <script src="js/lex/components/form/lex-toggle.js"></script>
  <script src="js/lex/components/form/lex-select.js"></script>
  <script src="js/lex/components/form/lex-textarea.js"></script>
  <script src="js/lex/components/data/lex-table.js"></script>
  <script src="js/lex/components/data/lex-pagination.js"></script>

  <!-- Inject page content + hoist modals -->
  <script src="js/lex/lex-page-init.js"></script>

  <!-- Page controller (MUST be last before auth-guard) -->
  <script src="js/settings-v2.js"></script>
  <script src="js/pages/settings-personalization.js"></script>

  <!-- PAC bridge consent handler (Lex modal for token requests) -->
  <script src="js/companion-bridge-consent.js"></script>

  <!-- Auth guard + loader dismiss (MUST be last) -->
  <script src="js/auth-guard.js"></script>
</body>
</html>
