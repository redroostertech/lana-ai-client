<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Integration Configuration - LanaAI</title>
  <link rel="stylesheet" href="../css/tailwind-output.css">
  <script src="../js/tailwind-loader.js"></script>
  <script src="../js/error-reporter.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/menu.js"></script>
  <script src="../js/connectors.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <!-- Sidebar -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-gray-900 text-white transform -translate-x-full lg:translate-x-0 transition-transform z-30 flex flex-col h-full">
    <div class="flex items-center justify-between h-16 px-6 border-b border-gray-800 flex-shrink-0">
      <a href="../index.html"><img src="../img/logo-light.png" alt="LanaAI" class="h-7"></a>
      <button id="closeSidebar" class="lg:hidden text-gray-400 hover:text-white">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>
    <nav id="mainNav" class="flex-1 overflow-hidden pt-6 px-3">
      <!-- Menu will be dynamically rendered by menu.js -->
    </nav>
  </aside>

  <!-- Main Content -->
  <div class="lg:ml-64">
    <header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-20">
      <div class="flex items-center justify-between h-16 px-4 lg:px-8">
        <div class="flex items-center gap-4">
          <button id="openSidebar" class="lg:hidden text-gray-500 hover:text-gray-700">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
          </button>
          <a href="connectors.html" class="text-gray-500 hover:text-gray-700">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
          </a>
          <div>
            <h1 id="pageTitle" class="text-xl font-semibold text-gray-900">Integration Configuration</h1>
            <p id="pageSubtitle" class="text-sm text-gray-500">Loading...</p>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <span id="lastSyncTime" class="text-sm text-gray-500"></span>
          <button id="syncNowBtn" onclick="syncNow()" class="hidden flex items-center gap-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            Sync Now
          </button>
        </div>
      </div>
    </header>

    <main class="p-4 lg:p-8">
      <!-- Loading State -->
      <div id="loadingState" class="flex items-center justify-center py-12">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600"></div>
      </div>

      <!-- Not Configured State -->
      <div id="notConfigured" class="hidden">
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-8">
          <div class="text-center mb-8">
            <div id="connectorIcon" class="w-20 h-20 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-6">
              <svg class="w-10 h-10 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
            </div>
            <h2 id="connectTitle" class="text-2xl font-bold text-gray-900 mb-2">Connect Integration</h2>
            <p id="connectDescription" class="text-gray-500 max-w-md mx-auto">Configure this integration to sync data with LanaAI.</p>
          </div>

          <!-- Configuration Form -->
          <div id="authContainer" class="max-w-lg mx-auto">
            <!-- Dynamic auth form will be rendered here -->
          </div>
        </div>
      </div>

      <!-- Configured State -->
      <div id="configuredState" class="hidden space-y-8">
        <!-- Connection Status Card -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
          <div class="flex items-center justify-between mb-6">
            <h2 class="text-lg font-semibold text-gray-900">Connection Status</h2>
            <span id="connectionStatus" class="px-3 py-1 text-sm font-medium rounded-full bg-gray-100 text-gray-600">Unknown</span>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div>
              <p class="text-sm text-gray-500">Records Synced</p>
              <p id="recordsCount" class="text-2xl font-bold text-gray-900">-</p>
            </div>
            <div>
              <p class="text-sm text-gray-500">Last Sync</p>
              <p id="lastSync" class="text-lg font-semibold text-gray-900">-</p>
            </div>
            <div>
              <p class="text-sm text-gray-500">Sync Frequency</p>
              <p id="syncFrequency" class="text-lg font-semibold text-gray-900">-</p>
            </div>
          </div>
          <div class="flex gap-3 mt-6 pt-6 border-t">
            <button onclick="editConfiguration()" class="px-4 py-2 border border-gray-300 hover:bg-gray-50 text-gray-700 font-medium rounded-lg transition-colors">
              Edit Configuration
            </button>
            <button onclick="testConnection()" class="px-4 py-2 border border-gray-300 hover:bg-gray-50 text-gray-700 font-medium rounded-lg transition-colors">
              Test Connection
            </button>
            <button onclick="disconnectIntegration()" class="px-4 py-2 text-red-600 hover:bg-red-50 font-medium rounded-lg transition-colors">
              Disconnect
            </button>
          </div>
        </div>

        <!-- Sync History -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
          <h2 class="text-lg font-semibold text-gray-900 mb-4">Sync History</h2>
          <div id="syncHistory" class="space-y-3">
            <p class="text-sm text-gray-500 text-center py-8">No sync history available</p>
          </div>
        </div>

        <!-- Synced Data Preview -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
          <h2 class="text-lg font-semibold text-gray-900 mb-4">Synced Data</h2>
          <div id="syncedData" class="overflow-x-auto">
            <p class="text-sm text-gray-500 text-center py-8">No data synced yet</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Configuration Modal -->
  <div id="configModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center">
    <div class="bg-white rounded-xl shadow-xl max-w-lg w-full mx-4 max-h-[90vh] overflow-y-auto">
      <div class="p-6 border-b border-gray-200">
        <div class="flex items-center justify-between">
          <h3 id="modalTitle" class="text-lg font-semibold text-gray-900">Edit Configuration</h3>
          <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
        </div>
      </div>
      <div id="modalContent" class="p-6">
        <!-- Dynamic modal content -->
      </div>
    </div>
  </div>

  <script>
    if (!api.requireAuth()) throw new Error('Not authenticated');

    // Load full user profile with roles before rendering menu
    (async () => {
      try {
        await api.loadUserProfile();
      } catch (error) {
        console.error('Failed to load user profile:', error);
      }

      // Render dynamic menu
      renderMenu('#mainNav', { menuType: 'integrations' });
    })();

    // Sidebar toggle
    const sidebar = document.getElementById('sidebar');
    document.getElementById('openSidebar').addEventListener('click', () => sidebar.classList.remove('-translate-x-full'));
    document.getElementById('closeSidebar').addEventListener('click', () => sidebar.classList.add('-translate-x-full'));

    // State
    let connectorConfig = null;
    let integrationSource = null;
    let connectorId = null;

    // Get connector ID from URL
    function getConnectorIdFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get('id') || params.get('connector_id');
    }

    // Load connector configuration
    async function loadConnectorConfig() {
      connectorId = getConnectorIdFromUrl();
      if (!connectorId) {
        Toast.error('No connector ID specified');
        window.location.href = 'connectors.html';
        return;
      }

      try {
        // Fetch connector definition from the backend-owned catalog
        connectorConfig = await ConnectorRegistry.getConnectorConfig(connectorId);

        // Update page title
        document.getElementById('pageTitle').textContent = connectorConfig.metadata.name;
        document.getElementById('pageSubtitle').textContent = connectorConfig.metadata.description || 'Integration configuration';
        document.getElementById('connectTitle').textContent = `Connect ${connectorConfig.metadata.name}`;
        document.getElementById('connectDescription').textContent = connectorConfig.metadata.description || 'Configure this integration to sync data with LanaAI.';

        // Check if already installed
        await loadIntegrationStatus();
      } catch (error) {
        console.error('Failed to load connector config:', error);
        Toast.error('Failed to load connector configuration');
        setTimeout(() => window.location.href = 'connectors.html', 2000);
      }
    }

    // Load integration status from backend
    async function loadIntegrationStatus() {
      try {
        const result = await Connectors.getAll();
        const connectors = result.connectors || [];
        integrationSource = connectors.find(conn =>
          conn.id === connectorId ||
          conn.connector_id === connectorId ||
          conn.connector_type === connectorId ||
          conn.source_type === connectorId
        ) || null;

        if (integrationSource && (integrationSource.status === 'connected' || integrationSource.auth_status === 'connected')) {
          showConfiguredState();
        } else {
          showNotConfiguredState();
        }
      } catch (error) {
        // Not installed yet
        showNotConfiguredState();
      }
    }

    // Show not configured state
    function showNotConfiguredState() {
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('notConfigured').classList.remove('hidden');
      document.getElementById('configuredState').classList.add('hidden');
      renderAuthForm();
    }

    // Show configured state
    function showConfiguredState() {
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('notConfigured').classList.add('hidden');
      document.getElementById('configuredState').classList.remove('hidden');
      document.getElementById('syncNowBtn').classList.remove('hidden');

      updateConnectionStatus();
      loadSyncHistory();
      loadSyncedData();
    }

    // Render auth form based on connector type
    function renderAuthForm() {
      const authContainer = document.getElementById('authContainer');
      const authType = connectorConfig.auth.type;

      if (authType === 'oauth2') {
        authContainer.innerHTML = `
          <div class="space-y-6">
            <div class="bg-gray-50 rounded-lg p-6 text-center">
              <p class="text-sm text-gray-600 mb-4">This integration uses OAuth 2.0 for secure authentication.</p>
              <button onclick="startOAuth()" class="inline-flex items-center gap-2 px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                Connect with ${connectorConfig.metadata.name}
              </button>
              <p class="text-xs text-gray-500 mt-3">You'll be redirected to authorize access</p>
            </div>
          </div>
        `;
      } else if (authType === 'api_key') {
        authContainer.innerHTML = `
          <form id="apiKeyForm" class="space-y-6" onsubmit="return handleApiKeySubmit(event)">
            <div>
              <label for="apiKey" class="block text-sm font-medium text-gray-700 mb-1">API Key *</label>
              <input type="password" id="apiKey" name="api_key" required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                placeholder="Enter your ${connectorConfig.metadata.name} API key">
              <p class="mt-1 text-xs text-gray-500">${connectorConfig.auth.description || 'Enter your API key from the service'}</p>
            </div>
            <div>
              <label for="syncFrequency" class="block text-sm font-medium text-gray-700 mb-1">Sync Frequency</label>
              <select id="syncFrequency" name="sync_frequency"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                <option value="realtime">Real-time</option>
                <option value="hourly" selected>Hourly</option>
                <option value="daily">Daily</option>
                <option value="manual">Manual only</option>
              </select>
            </div>
            <div class="flex gap-3">
              <button type="button" onclick="window.location.href='connectors.html'" class="flex-1 px-4 py-2 border border-gray-300 hover:bg-gray-50 text-gray-700 font-medium rounded-lg transition-colors">
                Cancel
              </button>
              <button type="submit" class="flex-1 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg transition-colors">
                Save & Connect
              </button>
            </div>
          </form>
        `;
      }
    }

    // Start OAuth flow
    async function startOAuth() {
      try {
        Toast.info('Starting OAuth flow...');
        let redirectUri = window.location.href;
        let stateParam = '';

        // Use custom URL scheme in Electron for proper OAuth redirect
        if (window.isElectron && window.electronAPI) {
          const state = await window.electronAPI.generateOAuthState();
          redirectUri = `lana-ai://oauth/callback?provider=${connectorId}`;
          stateParam = `&state=${encodeURIComponent(state)}`;
        }

        const authUrl = `${api.baseUrl}/api/v1/integrations/oauth/${connectorId}/authorize?redirect_uri=${encodeURIComponent(redirectUri)}${stateParam}`;

        // Open in system browser for Electron (required for URL scheme callback)
        if (window.isElectron && window.electronAPI) {
          await window.electronAPI.invoke('open-external-url', authUrl);
        } else {
          window.location.href = authUrl;
        }
      } catch (error) {
        Toast.error('Failed to start OAuth: ' + error.message);
      }
    }

    // Listen for OAuth callback from deep link (Electron only)
    if (window.isElectron && window.electronAPI?.onOAuthCallback) {
      window.electronAPI.onOAuthCallback(async (data) => {
        if (data.provider !== connectorId) return;
        if (data.error) {
          Toast.error(`OAuth failed: ${data.error_description || data.error}`);
          return;
        }
        try {
          Toast.info('Completing authorization...');
          await api.post(`/api/v1/integrations/oauth/${connectorId}/callback`, {
            code: data.code,
            state: data.state
          });
          Toast.success('Integration authorized successfully!');
          setTimeout(() => window.location.reload(), 1500);
        } catch (error) {
          Toast.error('Failed to complete OAuth: ' + error.message);
        }
      });
    }

    // Handle API key form submission
    async function handleApiKeySubmit(event) {
      event.preventDefault();
      const formData = new FormData(event.target);
      const config = {
        api_key: formData.get('api_key'),
        sync_frequency: formData.get('sync_frequency')
      };

      try {
        Toast.info('Testing connection...');
        await Connectors.configure(connectorId, config);

        Toast.success('Connected successfully!');
        await loadIntegrationStatus();
      } catch (error) {
        Toast.error('Connection failed: ' + error.message);
      }

      return false;
    }

    // Update connection status
    function updateConnectionStatus() {
      if (!integrationSource) return;

      const statusEl = document.getElementById('connectionStatus');
      const statusColors = {
        connected: 'bg-green-100 text-green-800',
        disconnected: 'bg-gray-100 text-gray-600',
        error: 'bg-red-100 text-red-800',
        syncing: 'bg-blue-100 text-blue-800'
      };

      statusEl.className = `px-3 py-1 text-sm font-medium rounded-full ${statusColors[integrationSource.status] || statusColors.disconnected}`;
      statusEl.textContent = integrationSource.status.charAt(0).toUpperCase() + integrationSource.status.slice(1);

      document.getElementById('recordsCount').textContent = (integrationSource.records || 0).toLocaleString();
      document.getElementById('lastSync').textContent = integrationSource.lastSync ? timeAgo(integrationSource.lastSync) : 'Never';
      document.getElementById('syncFrequency').textContent = (integrationSource.config?.sync_frequency || 'Manual').charAt(0).toUpperCase() + (integrationSource.config?.sync_frequency || 'Manual').slice(1);

      if (integrationSource.lastSync) {
        document.getElementById('lastSyncTime').textContent = `Last sync: ${timeAgo(integrationSource.lastSync)}`;
      }
    }

    // Load sync history
    async function loadSyncHistory() {
      try {
        const result = await Connectors.getSyncHistory(connectorId, 10);
        const container = document.getElementById('syncHistory');

        if (!result.history || result.history.length === 0) {
          container.innerHTML = '<p class="text-sm text-gray-500 text-center py-8">No sync history available</p>';
          return;
        }

        const statusColors = {
          success: 'bg-green-100 text-green-800',
          error: 'bg-red-100 text-red-800',
          running: 'bg-blue-100 text-blue-800'
        };

        container.innerHTML = result.history.map(sync => `
          <div class="flex items-center justify-between p-4 bg-gray-50 rounded-lg">
            <div class="flex-1">
              <div class="flex items-center gap-3">
                <span class="px-2 py-1 text-xs font-medium rounded-full ${statusColors[sync.status] || statusColors.error}">${sync.status}</span>
                <span class="text-sm text-gray-600">${timeAgo(sync.started_at)}</span>
              </div>
              <p class="text-sm text-gray-900 mt-1">${sync.records_synced} records synced in ${Math.round(sync.duration_ms / 1000)}s</p>
            </div>
          </div>
        `).join('');
      } catch (error) {
        console.error('Failed to load sync history:', error);
      }
    }

    // Load synced data preview
    async function loadSyncedData() {
      const container = document.getElementById('syncedData');
      container.innerHTML = '<p class="text-sm text-gray-500 text-center py-8">Data preview coming soon</p>';
    }

    // Sync now
    async function syncNow() {
      try {
        Toast.info('Starting sync...');
        const result = await Connectors.triggerSync(connectorId);
        Toast.success(`Synced ${result.records_synced} records`);
        await loadIntegrationStatus();
        await loadSyncHistory();
      } catch (error) {
        Toast.error('Sync failed: ' + error.message);
      }
    }

    // Test connection
    async function testConnection() {
      try {
        Toast.info('Testing connection...');
        const result = await Connectors.testConnection(connectorId, {});
        Toast.success(result.message || 'Connection successful');
      } catch (error) {
        Toast.error('Connection test failed: ' + error.message);
      }
    }

    // Edit configuration
    function editConfiguration() {
      document.getElementById('modalTitle').textContent = 'Edit Configuration';
      document.getElementById('modalContent').innerHTML = `
        <p class="text-sm text-gray-500 mb-4">Configuration editing coming soon</p>
        <button onclick="closeModal()" class="w-full px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium rounded-lg transition-colors">
          Close
        </button>
      `;
      document.getElementById('configModal').classList.remove('hidden');
    }

    // Disconnect integration
    async function disconnectIntegration() {
      if (!confirm('Are you sure you want to disconnect this integration? This will remove all synced data.')) {
        return;
      }

      try {
        await Connectors.disconnect(connectorId);
        Toast.success('Integration disconnected');
        await loadIntegrationStatus();
      } catch (error) {
        Toast.error('Failed to disconnect: ' + error.message);
      }
    }

    // Close modal
    function closeModal() {
      document.getElementById('configModal').classList.add('hidden');
    }

    // Initialize
    loadConnectorConfig();
  </script>
</body>
</html>
