<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deprecated Connector Route</title>
</head>
<body>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const connectorId = params.get('connectorId') || params.get('connector_id') || params.get('id') || '';
      const viewerParams = new URLSearchParams({
        connectorId,
        connectorType: connectorId,
        sourceId: params.get('sourceId') || ''
      });

      if (params.get('chrome')) {
        viewerParams.set('chrome', params.get('chrome'));
      }

      window.location.replace('connector-viewer.html?' + viewerParams.toString());
    })();
  </script>
  <main>
    <h1>Connector route deprecated</h1>
    <p>This setup page has moved to the shared connector viewer.</p>
  </main>
</body>
</html>
