<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sync Status - LanaAI</title>
  <link rel="stylesheet" href="../css/tailwind-output.css">
  <script src="../js/tailwind-loader.js"></script>
  <script src="../js/error-reporter.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/time-utils.js"></script>
  <script src="../js/shared/request-retry.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/menu.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/shared/header-user-menu.js"></script>
  <script src="../js/connectors.js"></script>
  <script src="../js/lex/lex.core.js"></script>
  <script src="../js/lex/lex.icons.js"></script>
  <script src="../js/lex/lex.data.js"></script>
  <script src="../js/lex/lex.forms.js"></script>
  <script src="../js/lex/lex.utils.js"></script>
  <script src="../js/lex/components/foundation/lex-btn.js"></script>
  <script src="../js/lex/components/foundation/lex-badge.js"></script>
  <script src="../js/lex/components/foundation/lex-empty.js"></script>
  <script src="../js/lex/components/foundation/lex-modal.js"></script>
  <script src="../js/lex/components/foundation/lex-drawer.js"></script>
  <script src="../js/lex/components/form/lex-input.js"></script>
  <script src="../js/lex/components/form/lex-select.js"></script>
  <script src="../js/lex/components/data/lex-table.js"></script>
  <script src="../js/shared/library-column-filters.js"></script>
  <script src="../insights/js/record-table-kit.js"></script>
  <script src="js/integration-tables.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <!-- Sidebar -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-gray-900 text-white transform -translate-x-full lg:translate-x-0 transition-transform z-30 flex flex-col">
    <div class="flex-shrink-0 flex items-center justify-between h-16 px-6 border-b border-gray-800">
      <a href="../index.html"><img src="../img/logo-light.png" alt="LanaAI" class="h-7"></a>
      <button id="closeSidebar" class="lg:hidden text-gray-400 hover:text-white">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>
    <nav id="mainNav" class="flex-1 overflow-hidden pt-6 px-3">
      <!-- Menu will be dynamically rendered by menu.js -->
    </nav>
  </aside>

  <!-- Main Content -->
  <div class="lg:ml-64">
    <header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-20">
      <div class="flex items-center justify-between h-16 px-4 lg:px-8">
        <button id="openSidebar" class="lg:hidden text-gray-500 hover:text-gray-700">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
        <div class="flex-1 px-4 lg:px-0">
          <h1 class="text-xl font-semibold text-gray-900">Sync Status</h1>
          <p class="text-sm text-gray-500">Monitor data synchronization across all connected sources</p>
        </div>

        <div class="flex items-center gap-4">
          <!-- Sync All Button -->
          <button id="syncAllBtn" class="flex items-center gap-2 px-3 py-1.5 text-sm bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
          Sync All
        </button>

          <!-- Notifications -->
          <button id="notificationBtn" class="relative text-gray-500 hover:text-gray-700">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
            </svg>
            <span id="notificationBadge" class="hidden absolute -top-1 -right-1 w-4 h-4 bg-red-500 text-white text-xs rounded-full flex items-center justify-center">0</span>
          </button>

          <!-- User Menu -->
          <div class="relative" id="userMenu" data-header-user-menu data-settings-href="../settings-v2.html" data-login-href="../login.html"></div>
        </div>
      </div>
    </header>

    <main class="p-4 lg:p-8">
      <!-- Summary Stats - Loading -->
      <div id="statsLoading" class="grid grid-cols-1 md:grid-cols-5 gap-4 mb-8">
        <div class="bg-white rounded-xl shadow-sm p-5 border border-gray-100 animate-pulse">
          <div class="flex items-center justify-between">
            <div>
              <div class="h-4 bg-gray-200 rounded w-20 mb-2"></div>
              <div class="h-8 bg-gray-200 rounded w-8"></div>
            </div>
            <div class="w-10 h-10 bg-gray-200 rounded-lg"></div>
          </div>
        </div>
        <div class="bg-white rounded-xl shadow-sm p-5 border border-gray-100 animate-pulse">
          <div class="flex items-center justify-between">
            <div>
              <div class="h-4 bg-gray-200 rounded w-20 mb-2"></div>
              <div class="h-8 bg-gray-200 rounded w-10"></div>
            </div>
            <div class="w-10 h-10 bg-gray-200 rounded-lg"></div>
          </div>
        </div>
        <div class="bg-white rounded-xl shadow-sm p-5 border border-gray-100 animate-pulse">
          <div class="flex items-center justify-between">
            <div>
              <div class="h-4 bg-gray-200 rounded w-24 mb-2"></div>
              <div class="h-8 bg-gray-200 rounded w-16"></div>
            </div>
            <div class="w-10 h-10 bg-gray-200 rounded-lg"></div>
          </div>
        </div>
        <div class="bg-white rounded-xl shadow-sm p-5 border border-gray-100 animate-pulse">
          <div class="flex items-center justify-between">
            <div>
              <div class="h-4 bg-gray-200 rounded w-20 mb-2"></div>
              <div class="h-8 bg-gray-200 rounded w-8"></div>
            </div>
            <div class="w-10 h-10 bg-gray-200 rounded-lg"></div>
          </div>
        </div>
        <div class="bg-white rounded-xl shadow-sm p-5 border border-gray-100 animate-pulse">
          <div class="flex items-center justify-between">
            <div>
              <div class="h-4 bg-gray-200 rounded w-24 mb-2"></div>
              <div class="h-8 bg-gray-200 rounded w-12"></div>
            </div>
            <div class="w-10 h-10 bg-gray-200 rounded-lg"></div>
          </div>
        </div>
      </div>

      <!-- Summary Stats - Content -->
      <div id="statsContent" class="hidden grid grid-cols-1 md:grid-cols-5 gap-4 mb-8">
        <div class="bg-white rounded-xl shadow-sm p-5 border border-gray-100">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-sm text-gray-500">Active Syncs</p>
              <p id="activeSyncs" class="text-2xl font-bold text-gray-900">0</p>
            </div>
            <div class="w-10 h-10 bg-blue-100 rounded-lg flex items-center justify-center">
              <svg class="w-5 h-5 text-blue-600 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            </div>
          </div>
        </div>
        <div class="bg-white rounded-xl shadow-sm p-5 border border-gray-100">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-sm text-gray-500">Syncs Today</p>
              <p id="syncsToday" class="text-2xl font-bold text-gray-900">-</p>
            </div>
            <div class="w-10 h-10 bg-green-100 rounded-lg flex items-center justify-center">
              <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            </div>
          </div>
        </div>
        <div class="bg-white rounded-xl shadow-sm p-5 border border-gray-100">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-sm text-gray-500">Records Synced</p>
              <p id="recordsSynced" class="text-2xl font-bold text-gray-900">-</p>
            </div>
            <div class="w-10 h-10 bg-purple-100 rounded-lg flex items-center justify-center">
              <svg class="w-5 h-5 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4"></path></svg>
            </div>
          </div>
        </div>
        <div class="bg-white rounded-xl shadow-sm p-5 border border-gray-100">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-sm text-gray-500">Failed Syncs</p>
              <p id="failedSyncs" class="text-2xl font-bold text-red-600">-</p>
            </div>
            <div class="w-10 h-10 bg-red-100 rounded-lg flex items-center justify-center">
              <svg class="w-5 h-5 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
          </div>
        </div>
        <div class="bg-white rounded-xl shadow-sm p-5 border border-gray-100">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-sm text-gray-500">Next Scheduled</p>
              <p id="nextScheduled" class="text-2xl font-bold text-gray-900">-</p>
            </div>
            <div class="w-10 h-10 bg-indigo-100 rounded-lg flex items-center justify-center">
              <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
          </div>
        </div>
      </div>

      <!-- Connected Sources Status -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 mb-8">
        <div class="px-6 py-4 border-b border-gray-100">
          <h2 class="text-lg font-semibold text-gray-900">Connected Sources</h2>
          <p class="text-sm text-gray-500">Real-time sync status for all connected data sources</p>
        </div>
        <div id="connectedSourcesMount" class="p-4"></div>
      </div>

      <!-- Sync History -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-100">
        <div class="px-6 py-4 border-b border-gray-100">
          <h2 class="text-lg font-semibold text-gray-900">Sync History</h2>
          <p class="text-sm text-gray-500">Recent synchronization activity log</p>
        </div>
        <div id="syncHistoryMount" class="p-4"></div>
        <p id="syncHistoryLimitNote" class="hidden px-6 pb-4 text-sm text-gray-500"></p>
      </div>
    </main>
  </div>

  <script>
    if (!api.requireAuth()) throw new Error('Not authenticated');

    // Load full user profile with roles before rendering menu
    (async () => {
      try {
        await api.loadUserProfile();
      } catch (error) {
        console.error('Failed to load user profile:', error);
      }

      // Render dynamic menu (will now have access to roles)
      renderMenu('#mainNav');
    })();

    // Initialize notifications panel
    NotificationPanel.init();

    // Load user info
    function loadUserInfo() {
      const user = api.user;
      if (user) {
        const name = `${user.firstName || ''} ${user.lastName || ''}`.trim() || user.email;
        const initials = (user.firstName?.[0] || '') + (user.lastName?.[0] || '') || user.email[0].toUpperCase();
        const uNameEl = document.getElementById('userName');
        const uInitEl = document.getElementById('userInitials');
        if (uNameEl) uNameEl.textContent = name;
        if (uInitEl) uInitEl.textContent = initials;
      }
    }
    loadUserInfo();

    // Sidebar toggle
    const sidebar = document.getElementById('sidebar');
    document.getElementById('openSidebar').addEventListener('click', () => sidebar.classList.remove('-translate-x-full'));
    document.getElementById('closeSidebar').addEventListener('click', () => sidebar.classList.add('-translate-x-full'));

    // Tables (docs/TABLE-STANDARD.md): connected sources and sync history are
    // client-side lex-tables built by LanaRecordTableKit.
    const Kit = window.LanaRecordTableKit;
    const Tables = window.LanaIntegrationTables;
    // /integrations/sync-history takes a limit only (no offset or total), so
    // the page asks for the latest HISTORY_LIMIT and says so when it is hit.
    const HISTORY_LIMIT = 500;

    const sourcesTableReady = Kit.mount(document.getElementById('connectedSourcesMount'), {
      id: 'connectedSourcesTable',
      title: 'Sources',
      noun: ['source', 'sources'],
      ariaLabel: 'Connected sources',
      light: true,
      searchPlaceholder: 'Search sources...',
      emptyText: 'No connected sources. Connect your first data source to start syncing.',
      sortBy: 'last_sync',
      sortDir: 'desc',
      minWidth: 960,
      columns: Tables.connectorSourceColumns()
    }, {
      rows: [],
      onAction: (action, row) => { if (action === 'sync') triggerSync(row.id); }
    });

    const historyColumns = Tables.syncLogColumns({ connector: true, created: false, error: true });
    // The error column opens the full message.
    historyColumns.forEach((column) => {
      if (column.key === 'error_message') {
        column.render = (value, row) => value
          ? `<button type="button" class="rtk-action" data-row-action="error" data-row-id="${Kit.esc(row.id)}" title="${Kit.esc(value)}">View error</button>`
          : Kit.muted('');
      }
    });
    const historyTableReady = Kit.mount(document.getElementById('syncHistoryMount'), {
      id: 'syncHistoryTable',
      title: 'Syncs',
      noun: ['sync', 'syncs'],
      ariaLabel: 'Sync history',
      light: true,
      searchPlaceholder: 'Search sync history...',
      emptyText: 'No sync history available',
      sortBy: 'created_at',
      sortDir: 'desc',
      minWidth: 1000,
      columns: historyColumns
    }, {
      rows: [],
      onAction: (action, row) => { if (action === 'error' && row._raw) showError(row._raw.error_message || ''); }
    });

    // Trigger sync for a connector
    async function triggerSync(connectorId) {
      try {
        Toast.info('Starting sync...');
        await Connectors.triggerSync(connectorId);
        Toast.success('Sync completed successfully');
        loadData();
      } catch (error) {
        Toast.error('Sync failed: ' + error.message);
      }
    }

    // Show error details
    function showError(message) {
      Modal.alert('Sync Error', message);
    }

    // Sync all connected sources
    document.getElementById('syncAllBtn').addEventListener('click', async () => {
      try {
        const { connectors } = await Connectors.getAll();
        const connected = connectors.filter(c => c.status === 'connected');

        if (connected.length === 0) {
          Toast.warning('No connected sources to sync');
          return;
        }

        Toast.info(`Syncing ${connected.length} sources...`);

        for (const connector of connected) {
          await Connectors.triggerSync(connector.id);
        }

        Toast.success('All syncs completed');
        loadData();
      } catch (error) {
        Toast.error('Sync failed: ' + error.message);
      }
    });

    // Load all data
    async function loadData(showLoading = false) {
      const statsLoading = document.getElementById('statsLoading');
      const statsContent = document.getElementById('statsContent');

      // Only show loading skeletons on initial load
      if (showLoading) {
        statsLoading.classList.remove('hidden');
        statsContent.classList.add('hidden');
      }

      const [sourcesTable, historyTable] = await Promise.all([sourcesTableReady, historyTableReady]);
      try {
        const [connectorsData, statsData, historyData] = await Promise.all([
          Connectors.getAll(),
          Connectors.getSyncStats(),
          Connectors.getSyncHistory(null, HISTORY_LIMIT)
        ]);
        const connectors = connectorsData.connectors || [];

        // Update stats
        document.getElementById('activeSyncs').textContent = connectors.filter(c => c.status === 'syncing').length;
        document.getElementById('syncsToday').textContent = statsData.syncs_today || 0;
        document.getElementById('recordsSynced').textContent = statsData.total_records?.toLocaleString() || '0';
        document.getElementById('failedSyncs').textContent = statsData.sync_errors || 0;
        document.getElementById('nextScheduled').textContent = '5 min';

        sourcesTable.setRows(connectors.filter(c => c.status === 'connected').map(Tables.connectorSourceRow));

        const history = historyData.history || [];
        historyTable.setRows(history.map(Tables.syncLogRow));
        const note = document.getElementById('syncHistoryLimitNote');
        note.textContent = history.length >= HISTORY_LIMIT ? `Showing the latest ${HISTORY_LIMIT.toLocaleString()} syncs.` : '';
        note.classList.toggle('hidden', history.length < HISTORY_LIMIT);
      } catch (error) {
        sourcesTable.setError('Connected sources could not be loaded. Check your connection and try again.');
        historyTable.setError('Sync history could not be loaded. Check your connection and try again.');
        Toast.error('Failed to load sync data');
        console.error(error);
      } finally {
        statsLoading.classList.add('hidden');
        statsContent.classList.remove('hidden');
      }
    }

    // Initialize with loading state
    loadData(true);

    // Auto-refresh every 30 seconds
    setInterval(loadData, 30000);
  </script>
</body>
</html>
