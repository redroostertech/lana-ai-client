              </div>
              ${existingPanelHtml}
              ${createPanelHtml}
            </div>

            ${cascadeHtml ? `<div class="mt-4 rounded-xl border border-gray-200 p-4"><div class="text-sm font-semibold text-gray-900">Linked records</div><div class="mt-2">${cascadeHtml}</div>${cascadeWarningsHtml}</div>` : ''}

            <div class="mt-4 rounded-xl border border-blue-200 bg-blue-50 p-3 text-sm text-blue-900">
              <span id="assignDialogTotalsText">${renderAssignDialogTotalsText(totals, targetLabel, skippedCount, { oneMatterPerRow: oneMatterPerRow && dialog.mode === 'create', matterCount: ctxParentRows.length })}</span>
            </div>

            <div class="mt-6 flex justify-end gap-3">
              <button type="button" onclick="closeAssignDialog()" class="rounded-xl border border-gray-300 px-4 py-2 text-sm font-semibold text-gray-700 hover:bg-gray-50">Cancel</button>
              <button type="button" onclick="confirmAssignDialog()" ${canConfirm ? '' : 'disabled'} class="rounded-xl bg-blue-600 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700 ${canConfirm ? '' : 'opacity-60 cursor-not-allowed'}">${escapeHtml(confirmLabel)}</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderAssignDialogTotalsText(totals, targetLabel, skippedCount, options) {
      const opts = options || {};
      const skippedNote = skippedCount > 0 ? ` Skipping ${formatNumber(skippedCount)} already-assigned row${skippedCount === 1 ? '' : 's'}.` : '';
      if (opts.oneMatterPerRow) {
        const matterCount = Number.isFinite(opts.matterCount) ? opts.matterCount : 0;
        return `Will create ${formatNumber(matterCount)} new matter${matterCount === 1 ? '' : 's'} from the selection (linked records partitioned per parent).${skippedNote}`;
      }
      const cascadeNote = totals.cascadeChildren > 0
        ? ` (plus ${formatNumber(totals.cascadeChildren)} linked record${totals.cascadeChildren === 1 ? '' : 's'})`
        : '';
      return `Will assign ${formatNumber(totals.rowCount)} row${totals.rowCount === 1 ? '' : 's'}${cascadeNote} to ${escapeHtml(targetLabel)}.${skippedNote}`;
    }

    function refreshAssignDialogTotals() {
      const dialog = state.assignDialog;
      if (!dialog) return;
      const totals = getAssignDialogTotals();
      const targetLabel = dialog.mode === 'create'
        ? (dialog.createForm?.name?.trim() || 'newly-created matter')
        : (getMatterNameById(dialog.targetMatterId) || 'Unassigned');
      const skippedCount = dialog.alreadyImported.count || 0;
      const ctxParentRows = Array.isArray(dialog.context?.parentRows) ? dialog.context.parentRows : [];
      const oneMatterPerRow = Boolean(dialog.oneMatterPerRow) && dialog.mode === 'create';
      const text = renderAssignDialogTotalsText(totals, targetLabel, skippedCount, {
        oneMatterPerRow,
        matterCount: ctxParentRows.length
      });
      const node = document.getElementById('assignDialogTotalsText');
      if (node) node.innerHTML = text;
    }

    async function confirmAssignDialog() {
      const dialog = state.assignDialog;
      if (!dialog || dialog.inFlight) return;
      const ctx = dialog.context || {};

      const isPerRowCreate = dialog.mode === 'create' && Boolean(dialog.oneMatterPerRow);

      let target;
      if (!isPerRowCreate) {
        try {
          target = dialog.mode === 'existing'
            ? { mode: 'existing', matterId: dialog.targetMatterId }
            : { mode: 'create', createForm: dialog.createForm };
          buildAssignTargetBody(target);
        } catch (error) {
          showPageAlert(error.message || 'Invalid assignment target.', 'error');
          return;
        }
      }

      dialog.inFlight = true;
      renderAssignDialog();

      if (isPerRowCreate) {
        const parentRows = Array.isArray(ctx.parentRows) ? ctx.parentRows : [];
        if (!parentRows.length) {
          showPageAlert('No selected rows available to create matters from.', 'error');
          dialog.inFlight = false;
          renderAssignDialog();
          return;
        }
        const form = dialog.createForm || {};
        const status = (form.status || 'active').trim() || 'active';
        const matterType = (form.matter_type || 'workspace').trim() || 'workspace';
        const cascadeAvailable = Boolean(dialog.cascadeAvailable);
        const successes = [];
        const failures = [];

        for (const parent of parentRows) {
          if (!parent || !parent.id) {
            failures.push({ parent, error: 'Missing parent row id' });
            continue;
          }
          const derivedName = deriveMatterNameForRow(parent);
          try {
            let childIds = [];
            if (cascadeAvailable) {
              try {
                const preview = await previewCascadeForSelection([parent]);
                if (preview && preview.allChildIds) {
                  childIds = Array.from(preview.allChildIds);
                }
              } catch (cascadeError) {
                console.warn('[Connector Viewer] Per-row cascade preview failed; proceeding with parent only', { parentId: parent.id, error: cascadeError });
              }
            }
            const dataIds = Array.from(new Set([parent.id, ...childIds]));
            const body = {
              data_ids: dataIds,
              skip_already_assigned: true,
              create_matter: {
                name: derivedName,
                status,
                matter_type: matterType
              }
            };
            const response = await api.post(connectorApi('/data/assign-matter'), body);
            successes.push({ parent, derivedName, response });
          } catch (error) {
            console.error('[Connector Viewer] Per-row matter create failed', { parentId: parent.id, derivedName, error });
            failures.push({ parent, derivedName, error: error?.message || String(error) });
          }
        }

        const total = parentRows.length;
        const successCount = successes.length;
        const failureCount = failures.length;
        if (failureCount === 0) {
          showPageAlert(`Created ${formatNumber(successCount)} matter${successCount === 1 ? '' : 's'}.`, 'success');
        } else if (successCount === 0) {
          showPageAlert(`Failed to create ${formatNumber(failureCount)} matter${failureCount === 1 ? '' : 's'} — check the console for details.`, 'error');
          console.error('[Connector Viewer] Per-row matter create failures', failures);
        } else {
          showPageAlert(`Created ${formatNumber(successCount)} of ${formatNumber(total)} matters. ${formatNumber(failureCount)} failed — check the console for details.`, 'warning');
          console.error('[Connector Viewer] Per-row matter create partial failures', failures);
        }

        if (successCount > 0) {
          state.cascadeIndex = {};
          state.cascadeIndexErrors = {};
          try {
            await Promise.all([loadMatterOptions(), refreshDataPreview(), refreshBaseData(false)]);
          } catch (refreshError) {
            console.warn('[Connector Viewer] Post-create refresh failed', refreshError);
          }
        }

        state.assignDialog = null;
        renderAssignDialog();
        return;
      }

      try {
        const willCascade = dialog.cascadeAvailable && dialog.cascadePreview && dialog.cascadePreview.totalChildren > 0;
        const parentRows = Array.isArray(ctx.parentRows) ? ctx.parentRows : [];
        const parentIds = Array.isArray(ctx.parentIds) && ctx.parentIds.length
          ? ctx.parentIds.slice()
          : parentRows.map((row) => row.id).filter(Boolean);
        let payloadExtras;
        let label = ctx.label || 'Assignment complete';
        let fallbackCount = ctx.rowCount || parentRows.length;

        if (willCascade && parentIds.length) {
          const allIds = Array.from(new Set([...parentIds, ...dialog.cascadePreview.allChildIds]));
          payloadExtras = { data_ids: allIds };
          fallbackCount = allIds.length;
          label = ctx.cascadeLabel || 'Cascade assign complete';
        } else if (ctx.bodyMode === 'ids') {
          payloadExtras = { data_ids: parentIds };
          fallbackCount = parentIds.length;
        } else if (ctx.bodyMode === 'filtered') {
          payloadExtras = {
            q: ctx.filtered?.q || null,
            entity_type: ctx.filtered?.entity_type || null,
            filters: ctx.filtered?.filters || []
          };
        } else if (ctx.bodyMode === 'group') {
          payloadExtras = { group: ctx.group };
        } else {
          payloadExtras = { data_ids: parentIds };
        }

        await performAssign(target, payloadExtras, label, fallbackCount);
        state.assignDialog = null;
        renderAssignDialog();
      } catch (error) {
        console.error('[Connector Viewer] Assign dialog confirm failed', error);
        showPageAlert(error.message || 'Failed to assign rows.', 'error');
        if (state.assignDialog) {
          state.assignDialog.inFlight = false;
          renderAssignDialog();
        }
      }
    }

    async function assignSingleRecordWithCascade(recordId) {
      if (!state.sourceId) return;
      try {
        const rows = state.dataPreview && Array.isArray(state.dataPreview.data) ? state.dataPreview.data : [];
        const record = rows.find((row) => row.id === recordId) || state.selectedRecord;
        if (!record) {
          throw new Error('Record not found in current view');
        }
        openAssignDialog({
          parentRows: [record],
          rowCount: 1,
          parentDescription: `1 ${titleCase(record.entity_type || 'record')}`,
          bodyMode: 'ids',
          label: 'Record assigned',
          cascadeLabel: 'Record and linked rows assigned'
        });
      } catch (error) {
        console.error('[Connector Viewer] Single-record assign failed', error);
        showPageAlert(error.message || 'Failed to assign record.', 'error');
      }
    }

    // Single-record Linked Records uses targeted server-side filters per
    // relationship instead of the in-browser cascade index. The index caps
    // at 5000 rows per entity type, so for high-volume entity types (notes,
    // tasks, matter_participants) the open record's children almost never
    // land in the first page and the panel under-reports to zero.
    async function fetchLinkedRecordsForRow(parentRow) {
      const result = { breakdown: [], warnings: [], totalChildren: 0 };
      if (!parentRow || !parentRow.entity_type) return result;
      const rels = getRelationshipsForEntity(parentRow.entity_type);
      if (!rels.length) return result;

      for (const rel of rels) {
        if (state.cascadeDisabledRels[`${parentRow.entity_type}::${rel.entity_type}`]) continue;

        let matchValue;
        if (!rel.match || rel.match === 'external_id') {
          matchValue = parentRow.external_id != null ? String(parentRow.external_id) : null;
        } else if (rel.match === 'id') {
          matchValue = parentRow.id != null ? String(parentRow.id) : null;
        } else {
          matchValue = readPathValue(parentRow, rel.match);
        }

        if (matchValue == null || matchValue === '') {
          result.breakdown.push({
            parent_entity_type: parentRow.entity_type,
            entity_type: rel.entity_type,
            label: rel.label,
            count: 0,
            ids: []
          });
          continue;
        }

        const filters = JSON.stringify([{ field: rel.via, operator: 'equals', value: matchValue }]);
        const params = new URLSearchParams({
          entity_type: rel.entity_type,
          limit: '1',
          offset: '0',
          filters
        });
        try {
          const response = await api.get(`${connectorApi('/data')}?${params.toString()}`);
          const total = Number(response && response.pagination && response.pagination.total) || 0;
          result.breakdown.push({
            parent_entity_type: parentRow.entity_type,
            entity_type: rel.entity_type,
            label: rel.label,
            count: total,
            ids: []
          });
          result.totalChildren += total;
        } catch (error) {
          result.warnings.push(`Failed to load ${rel.label}: ${error.message || error}`);
        }
      }
      return result;
    }

    // Parents panel: walks the connector's relationships graph in the
    // reverse direction. For the open record, find every declared edge of
    // the shape `X -> currentEntityType via data.<field>` (i.e. any
    // entity that names this entity as a child). Each such edge tells us
    // the current row's data.<field> holds X's external_id. Look up the
    // parent rows by external_id and return them grouped by parent
    // entity type. Lets the viewer surface "this opportunity belongs to
    // THIS contact, THIS pipeline" even though the FK lives on the
    // opportunity (so cascade-assign sees it as a leaf with no children).
    function getParentRelationshipsForEntity(entityType) {
      if (!entityType) return [];
      const map = getDependentEntitiesMap();
      const out = [];
      for (const [parentEntity, rels] of Object.entries(map)) {
        for (const rel of rels) {
          if (rel && rel.entity_type === entityType && typeof rel.via === 'string' && rel.via.startsWith('data.')) {
            out.push({
              parent_entity_type: parentEntity,
              label: titleCase(parentEntity),
              via_field: rel.via.slice('data.'.length),
              match: rel.match || 'external_id'
            });
          }
        }
      }
      return out;
    }

    async function fetchParentRecordsForRow(parentRow) {
      const result = { breakdown: [], warnings: [] };
      if (!parentRow || !parentRow.entity_type) return result;
      const inbound = getParentRelationshipsForEntity(parentRow.entity_type);
      if (!inbound.length) return result;

      const data = parentRow.data && typeof parentRow.data === 'object' ? parentRow.data : {};
      // Group inbound edges by parent_entity_type so we only query each
      // parent table once per (entity, via-field-value) combo.
      for (const edge of inbound) {
        const fkValue = data[edge.via_field];
        if (fkValue == null || fkValue === '') {
          continue;
        }
        const targetColumn = edge.match === 'external_id' ? 'external_id' : `data.${edge.match.startsWith('data.') ? edge.match.slice('data.'.length) : edge.match}`;
        const filters = JSON.stringify([{ field: targetColumn, operator: 'equals', value: String(fkValue) }]);
        const params = new URLSearchParams({
          entity_type: edge.parent_entity_type,
          limit: '1',
          offset: '0',
          filters
        });
        try {
          const response = await api.get(`${connectorApi('/data')}?${params.toString()}`);
          const rows = Array.isArray(response.data) ? response.data : [];
          const total = Number(response && response.pagination && response.pagination.total) || 0;
          result.breakdown.push({
            parent_entity_type: edge.parent_entity_type,
            label: edge.label,
            via_field: edge.via_field,
            fk_value: String(fkValue),
            row: rows[0] || null,
            count: total
          });
        } catch (error) {
          result.warnings.push(`Failed to lookup ${edge.label}: ${error.message || error}`);
        }
      }
      return result;
    }

    async function refreshParentRecordsForOpenRecord() {
      if (!state.selectedRecord) {
        state.parentRecordsPanel = null;
        renderRecordDetail();
        return;
      }
      const inbound = getParentRelationshipsForEntity(state.selectedRecord.entity_type);
      if (!inbound.length) {
        state.parentRecordsPanel = null;
        renderRecordDetail();
        return;
      }
      state.parentRecordsPanel = { loading: true, breakdown: [], warnings: [] };
      renderRecordDetail();
      try {
        const preview = await fetchParentRecordsForRow(state.selectedRecord);
        state.parentRecordsPanel = {
          loading: false,
          breakdown: preview.breakdown,
          warnings: preview.warnings
        };
      } catch (error) {
        state.parentRecordsPanel = { loading: false, breakdown: [], warnings: [error.message || String(error)] };

      renderRecordDetail();
    }

    async function refreshLinkedRecordsForOpenRecord() {
      if (!state.selectedRecord) {
        state.cascadeLinkedPanel = null;
        renderRecordDetail();
        return;
      }
      const rels = getRelationshipsForEntity(state.selectedRecord.entity_type);
      if (!rels.length) {
        state.cascadeLinkedPanel = null;
        renderRecordDetail();
        return;
      }
      state.cascadeLinkedPanel = { loading: true, breakdown: [], warnings: [], totalChildren: 0 };

          loading: false,
          breakdown: preview.breakdown,
          warnings: preview.warnings,
          totalChildren: preview.totalChildren
        };
      } catch (error) {
        state.cascadeLinkedPanel = { loading: false, breakdown: [], warnings: [error.message || String(error)], totalChildren: 0 };
      }
      renderRecordDetail();
    }

    function filterToLinkedRecords(parentRecordId, childEntityType) {
      const rows = state.dataPreview && Array.isArray(state.dataPreview.data) ? state.dataPreview.data : [];
      const parent = rows.find((row) => row.id === parentRecordId) || state.selectedRecord;
      if (!parent || !childEntityType) return;
      const rels = getRelationshipsForEntity(parent.entity_type);
      const rel = rels.find((r) => r.entity_type === childEntityType);
      if (!rel) return;
      const matchValue = rel.match === 'external_id'
        ? (parent.external_id != null ? String(parent.external_id) : '')
        : (readPathValue(parent, rel.match) || '');
      if (!matchValue) {
        showPageAlert('Could not derive a filter key for this relationship.', 'error');
        return;
      }
      const entitySelect = document.getElementById('entityTypeFilter');
      if (entitySelect) entitySelect.value = childEntityType;
      const searchInput = document.getElementById('dataSearchInput');
      if (searchInput) searchInput.value = matchValue;
      closeRecordDetail();
      applyDataFilters();
      showPageAlert(`Filtered to ${rel.label} for ${parent.external_id || parent.entity_type}. Refine the search if unrelated rows appear.`, 'info');
    }

    function getValueByPath(obj, path) {
      if (obj == null || !path) return undefined;
      const segments = String(path).split('.').filter((s) => s.length > 0);
      let cursor = obj;
      for (const seg of segments) {
        if (cursor == null) return undefined;
        if (Array.isArray(cursor)) {
          const idx = Number(seg);
          if (!Number.isInteger(idx)) return undefined;
          cursor = cursor[idx];
        } else if (typeof cursor === 'object') {
          cursor = cursor[seg];
        } else {
          return undefined;
        }
      }
      return cursor;
    }

    function formatPayloadValue(value) {
      if (value === null) return 'null';
      if (value === undefined) return 'undefined';
      if (typeof value === 'string') return JSON.stringify(value);
      if (typeof value === 'number' || typeof value === 'boolean') return String(value);
      try { return JSON.stringify(value); } catch (e) { return String(value); }
    }

    function isLeafValue(value) {
      if (value === null || value === undefined) return true;
      const t = typeof value;
      if (t === 'string' || t === 'number' || t === 'boolean') return true;
      return false;
    }

    function collectFieldPaths(obj, prefix, out) {
      if (obj == null || typeof obj !== 'object') return;
      const entries = Array.isArray(obj) ? obj.map((v, i) => [String(i), v]) : Object.entries(obj);
      for (const [key, value] of entries) {
        const path = prefix ? `${prefix}.${key}` : key;
        if (isLeafValue(value)) {
          out.push(path);
        } else if (typeof value === 'object') {
          collectFieldPaths(value, path, out);
        }
      }
    }

    function renderCorrectionFieldOptions(record) {
      const data = record && typeof record.data === 'object' && record.data !== null ? record.data : {};
      const paths = [];
      collectFieldPaths(data, '', paths);
      paths.sort();
      const options = ['<option value="">Select a field…</option>']
        .concat(paths.map((p) => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`))
        .concat(['<option value="__custom__">Custom path…</option>']);
      return options.join('');
    }

    function renderInteractivePayload(record) {
      const data = record && typeof record.data === 'object' && record.data !== null ? record.data : {};
      const lines = [];

      function walk(value, prefix, indent, leadingKey) {
        const padStyle = `padding-left:${indent * 12}px`;
        if (isLeafValue(value)) {
          const path = prefix;
          const display = formatPayloadValue(value);
          const keyLabel = leadingKey == null
            ? ''
            : `<span class="text-teal-100">${escapeHtml(JSON.stringify(leadingKey))}</span><span class="text-gray-300">: </span>`;
          lines.push(`<button type="button" onclick="prefillCorrectionFromPath('${escapeHtml(path)}')" class="block w-full text-left rounded px-2 py-0.5 text-gray-100 hover:bg-gray-800" style="${padStyle}">${keyLabel}<span class="text-emerald-100">${escapeHtml(display)}</span></button>`);
          return;
        }
        if (Array.isArray(value)) {
          const header = leadingKey == null
            ? '<span class="text-gray-300">[</span>'
            : `<span class="text-teal-100">${escapeHtml(JSON.stringify(leadingKey))}</span><span class="text-gray-300">: [</span>`;
          lines.push(`<div class="px-2 py-0.5" style="${padStyle}">${header}</div>`);
          value.forEach((item, idx) => {
            const childPath = prefix ? `${prefix}.${idx}` : String(idx);
            walk(item, childPath, indent + 1, idx);
          });
          lines.push(`<div class="px-2 py-0.5 text-gray-300" style="${padStyle}">]</div>`);
          return;
        }
        if (typeof value === 'object') {
          const header = leadingKey == null
            ? '<span class="text-gray-300">{</span>'
            : `<span class="text-teal-100">${escapeHtml(JSON.stringify(leadingKey))}</span><span class="text-gray-300">: {</span>`;
          lines.push(`<div class="px-2 py-0.5" style="${padStyle}">${header}</div>`);
          for (const [k, v] of Object.entries(value)) {
            const childPath = prefix ? `${prefix}.${k}` : k;
            walk(v, childPath, indent + 1, k);
          }
          lines.push(`<div class="px-2 py-0.5 text-gray-300" style="${padStyle}">}</div>`);
          return;
        }
      }

      if (Object.keys(data).length === 0) {
        return '<div class="px-2 py-2 text-gray-400">{}  (empty payload)</div>';
      }
      walk(data, '', 0, null);
      return `<div class="connector-mono leading-relaxed">${lines.join('')}</div>`;
    }

    function getActiveCorrectionFieldKey() {
      const select = document.getElementById('recordCorrectionFieldSelect');
      if (!select) return '';
      if (select.value === '__custom__') {
        const custom = document.getElementById('recordCorrectionFieldCustom');
        return custom ? custom.value.trim() : '';
      }
      return select.value || '';
    }

    function updateCurrentValueDisplay() {
      const wrap = document.getElementById('recordCorrectionCurrentValueWrap');
      const target = document.getElementById('recordCorrectionCurrentValue');
      if (!wrap || !target) return;
      const path = getActiveCorrectionFieldKey();
      if (!path || !state.selectedRecord || !state.selectedRecord.data) {
        wrap.classList.add('hidden');
        target.textContent = '';
        return;
      }
      const value = getValueByPath(state.selectedRecord.data, path);
      if (value === undefined) {
        wrap.classList.remove('hidden');
        target.innerHTML = '<span class="italic text-gray-500">(field not present in current payload)</span>';
        return;
      }
      wrap.classList.remove('hidden');
      target.textContent = formatPayloadValue(value);
    }

    function onCorrectionFieldSelectChange() {
      const select = document.getElementById('recordCorrectionFieldSelect');
      const custom = document.getElementById('recordCorrectionFieldCustom');
      if (!select || !custom) return;
      if (select.value === '__custom__') {
        custom.classList.remove('hidden');
        custom.focus();
      } else {
        custom.classList.add('hidden');
      }
      updateCurrentValueDisplay();
    }

    function prefillCorrectionFromPath(path) {
      if (!path || !state.selectedRecord) return;
      const select = document.getElementById('recordCorrectionFieldSelect');
      const custom = document.getElementById('recordCorrectionFieldCustom');
      const proposedInput = document.getElementById('recordCorrectionValue');
      if (!select) return;

      const hasOption = [...select.options].some((opt) => opt.value === path);
      if (hasOption) {
        select.value = path;
        if (custom) custom.classList.add('hidden');
      } else if (custom) {
        select.value = '__custom__';
        custom.classList.remove('hidden');
        custom.value = path;
      }

      if (proposedInput) {
        const value = getValueByPath(state.selectedRecord.data, path);
        proposedInput.value = formatPayloadValue(value);
        proposedInput.focus();
        proposedInput.select();
      }

      updateCurrentValueDisplay();

      const form = document.getElementById('correctionForm');
      if (form && typeof form.scrollIntoView === 'function') {
        form.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function renderProposedCorrectionsSection(annotations) {
      const corrections = (Array.isArray(annotations) ? annotations : [])
        .filter((a) => a && a.annotation_type === 'correction');

      const intro = `
        <div class="text-sm font-semibold text-gray-900">Your Corrections</div>

      return `

          <div class="flex items-center justify-between gap-3">

    function renderSourceAttributionSection(record) {
      // Renders for ANY connector record that carries data.attributions[]
      // (Leadly opportunities and contacts today; any future connector that
      // emits attribution arrays gets the same panel for free). Attribution
      // metadata is too dimensional for the Linked Records count-per-entity
      // panel, so it gets its own table here. The optional top-level
      // data.source label is rendered above the table when present.
      const data = (record && record.data) || {};
      const attributions = Array.isArray(data.attributions) ? data.attributions : [];
      const sourceLabel = typeof data.source === 'string' ? data.source.trim() : '';
      if (attributions.length === 0 && !sourceLabel) return '';

      const positionFor = (attr, idx, total) => {
        if (attr && attr.isFirst === true) return 'first';
        if (attr && attr.isLast === true) return 'last';
        if (total === 1) return 'only';
        if (idx === 0) return 'first';
        if (idx === total - 1) return 'last';
        return 'middle';
      };

      const positionBadge = (pos) => {
        const palette = {
          first: 'bg-emerald-50 text-emerald-700 border-emerald-200',
          last: 'bg-blue-50 text-blue-700 border-blue-200',
          only: 'bg-violet-50 text-violet-700 border-violet-200',
          middle: 'bg-gray-50 text-gray-600 border-gray-200'
        };
        const cls = palette[pos] || palette.middle;
        return `<span class="inline-flex items-center rounded-md border px-2 py-0.5 text-xs font-semibold uppercase tracking-wide ${cls}">${escapeHtml(pos)}</span>`;
      };

      const truncate = (value, max) => {
        if (typeof value !== 'string') return '';
        if (value.length <= max) return value;
        return value.slice(0, Math.max(0, max - 1)) + '…';
      };

      const mediumIdCell = (attr) => {
        const id = attr && typeof attr.mediumId === 'string' ? attr.mediumId : '';
        if (!id) return '<span class="text-gray-400">—</span>';
        const medium = attr && typeof attr.medium === 'string' ? attr.medium.toLowerCase() : '';
        // calendar -> existing calendar row; form/survey/quiz -> form row
        // (new in leadly 2.4.7). Anything else stays as a plain id label.
        let targetEntity = null;
        if (medium === 'calendar') targetEntity = 'calendar';
        else if (medium === 'form' || medium === 'survey' || medium === 'quiz') targetEntity = 'form';
        if (targetEntity) {
          return `<button type="button" class="connector-mono text-xs font-semibold text-blue-600 hover:underline" onclick="filterDataPreviewToRecord('${escapeHtml(targetEntity)}','${escapeHtml(id)}')" title="Open ${escapeHtml(targetEntity)} ${escapeHtml(id)}">${escapeHtml(id)}</button>`;
        }
        return `<span class="connector-mono text-xs text-gray-700">${escapeHtml(id)}</span>`;
      };

      const cellTextLink = (value, max) => {
        if (typeof value !== 'string' || !value) return '<span class="text-gray-400">—</span>';
        const display = escapeHtml(truncate(value, max));
        if (/^https?:\/\//i.test(value)) {
          return `<a href="${escapeHtml(value)}" target="_blank" rel="noopener" class="text-xs text-blue-600 hover:underline break-all" title="${escapeHtml(value)}">${display}</a>`;
        }
        return `<span class="text-xs text-gray-700 break-all" title="${escapeHtml(value)}">${display}</span>`;
      };

      const rowsHtml = attributions.map((attr, idx) => {
        const pos = positionFor(attr, idx, attributions.length);
        const medium = attr && typeof attr.medium === 'string' ? attr.medium : '';
        const utm = attr && typeof attr.utmSessionSource === 'string' ? attr.utmSessionSource : '';
        const pageUrl = attr && typeof attr.pageUrl === 'string' ? attr.pageUrl : (attr && typeof attr.url === 'string' ? attr.url : '');
        const referrer = attr && typeof attr.referrer === 'string' ? attr.referrer : '';
        return `
          <tr class="border-t border-gray-100 align-top">
            <td class="px-3 py-2">${positionBadge(pos)}</td>
            <td class="px-3 py-2"><span class="text-xs font-medium text-gray-800">${escapeHtml(medium || '—')}</span></td>
            <td class="px-3 py-2">${mediumIdCell(attr)}</td>
            <td class="px-3 py-2"><span class="text-xs text-gray-700">${escapeHtml(utm || '—')}</span></td>
            <td class="px-3 py-2">${cellTextLink(pageUrl, 80)}</td>
            <td class="px-3 py-2">${cellTextLink(referrer, 60)}</td>
          </tr>
        `;
      }).join('');

      const tableHtml = attributions.length === 0
        ? '<div class="mt-3 text-sm text-gray-500">No attribution events recorded on this record.</div>'
        : `
          <div class="mt-3 overflow-x-auto rounded-xl border border-gray-200">
            <table class="min-w-full divide-y divide-gray-200">
              <thead class="bg-gray-50">
                <tr>
                  <th class="px-3 py-2 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Position</th>
                  <th class="px-3 py-2 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Medium</th>
                  <th class="px-3 py-2 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Medium ID</th>
                  <th class="px-3 py-2 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">UTM Source</th>
                  <th class="px-3 py-2 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Page URL</th>
                  <th class="px-3 py-2 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Referrer</th>
                </tr>
              </thead>
              <tbody class="bg-white">${rowsHtml}</tbody>
            </table>
          </div>
        `;

      const sourceRow = sourceLabel
        ? `<div class="mt-3 flex flex-wrap items-center gap-2 rounded-lg border border-gray-200 bg-gray-50 px-3 py-2">
             <span class="text-xs font-semibold uppercase tracking-wide text-gray-500">Source</span>
             <span class="text-sm font-medium text-gray-900">${escapeHtml(sourceLabel)}</span>
           </div>`
        : '';

      return `
        <div class="rounded-xl border border-gray-200 bg-white p-4">
          <div class="flex items-center justify-between gap-3">
            <div>
              <div class="text-sm font-semibold text-gray-900">Source / Attribution</div>
              <div class="mt-1 text-xs text-gray-500">Marketing-attribution events recorded against this record (first-touch, last-touch, UTM, referrer, page).</div>
            </div>
            <span class="rounded-md border border-gray-200 bg-gray-50 px-2 py-0.5 text-xs font-semibold text-gray-600">${attributions.length}</span>
          </div>
          ${sourceRow}
          ${tableHtml}
        </div>
      `;
    }

    function filterDataPreviewToRecord(entityType, externalId) {
      // Best-effort jump from an attribution mediumId to the entity row it
      // references. Switches the Data tab's entity filter and search query,
      // then reloads. If the row exists, the user will see it; if it doesn't
      // yet (e.g. a form id from before the `form` entity was synced in
      // leadly 2.4.7), the preview will be empty and prompt re-sync. We
      // intentionally do NOT auto-open record detail because the row may
      // not be loaded yet.
      try {
        const entitySelect = document.getElementById('entityTypeFilter');
        if (entitySelect) {
          // Only set if the option exists — otherwise leave the current filter
          // alone so we don't put the select into an invalid state.
          const hasOption = Array.from(entitySelect.options).some((opt) => opt.value === entityType);
          if (hasOption) {
            entitySelect.value = entityType;
          }
        }
        const searchInput = document.getElementById('dataSearchInput')
          || document.getElementById('dataPreviewSearchInput');
        if (searchInput) {
          searchInput.value = externalId;
        }
        if (state) {
          state.dataPreviewOffset = 0;
          state.selectedRecordId = '';
          state.selectedRecord = null;
        }
        if (typeof refreshDataPreview === 'function') {
          refreshDataPreview();
        }
      } catch (err) {
        // Non-fatal: panel still rendered, jump just failed silently.
        console.warn('filterDataPreviewToRecord failed', err);
      }
    }

    // Switch the data grid to the parent entity, refresh, and open the
    // parent row in the side drawer. Uses the same filter-then-open pattern
    // as filterToLinkedRecords (which goes the child direction).
    async function openParentRecord(parentEntityType, parentExternalId, parentRowId) {
      if (!parentEntityType || !parentExternalId) return;
      const entitySelect = document.getElementById('entityTypeFilter');
      if (entitySelect) entitySelect.value = parentEntityType;
      const searchInput = document.getElementById('dataSearchInput');
      if (searchInput) searchInput.value = String(parentExternalId);
      closeRecordDetail();
      state.dataPreviewOffset = 0;
      state.selectedDataIds = [];
      state.selectedRowsById = {};
      state.selectionMode = 'manual';
      try {
        await refreshDataPreview();
        const rows = state.dataPreview && Array.isArray(state.dataPreview.data) ? state.dataPreview.data : [];
        const targetRow = (parentRowId && rows.find((r) => r.id === parentRowId))
          || rows.find((r) => String(r.external_id) === String(parentExternalId));
        if (targetRow) {
          openRecordDetail(targetRow.id);
        } else {
          showPageAlert(`Filtered to ${parentEntityType} ${parentExternalId}, but the row was not in the page. Adjust the filter to find it.`, 'info');
        }
      } catch (error) {
        console.error('[Connector Viewer] Failed to open parent record', error);
        showPageAlert(error.message || 'Failed to open parent record.', 'error');
      }
    }

    function renderParentRecordsSection(record) {
      const inbound = getParentRelationshipsForEntity(record && record.entity_type);
      if (!inbound.length) return '';
      const panel = state.parentRecordsPanel;
      let bodyHtml;
      if (!panel) {
        bodyHtml = `
          <div class="mt-3 text-sm text-gray-500">Look up the records this row points back at.</div>
          <div class="mt-3"><button type="button" onclick="refreshParentRecordsForOpenRecord()" class="rounded-xl border border-gray-300 px-4 py-2 text-sm font-semibold text-gray-700 hover:bg-gray-50">Load Parents</button></div>
        `;
      } else if (panel.loading) {
        bodyHtml = '<div class="mt-3 text-sm text-gray-500">Loading parents...</div>';
      } else if (!panel.breakdown.length) {
        bodyHtml = '<div class="mt-3 text-sm text-gray-500">No parent references found on this row.</div>';
      } else {
        const rows = panel.breakdown.map((b) => {
          const found = b.row && b.count > 0;
          const name = found ? (b.row.data && (b.row.data.name || b.row.data.title || b.row.data.firstName + ' ' + (b.row.data.lastName || '') || b.row.external_id)) : '(not synced)';
          const action = found
            ? `<button type="button" onclick="openParentRecord('${escapeHtml(b.parent_entity_type)}','${escapeHtml(b.row.external_id || b.fk_value)}','${escapeHtml(b.row.id)}')" class="rounded-lg border border-gray-300 px-2 py-1 text-xs font-semibold text-gray-700 hover:bg-gray-50">Open</button>`
            : `<span class="text-xs text-gray-500">id: ${escapeHtml(b.fk_value)}</span>`;
          return `
            <div class="flex items-center justify-between gap-3 rounded-lg border border-gray-200 bg-white px-3 py-2 text-sm">
              <div>
                <div class="font-medium text-gray-900">${escapeHtml(b.label)}</div>
                <div class="text-xs text-gray-500">${escapeHtml(record.entity_type)} &rarr; ${escapeHtml(b.parent_entity_type)} via <code>data.${escapeHtml(b.via_field)}</code></div>
                <div class="mt-1 text-xs text-gray-700">${escapeHtml(String(name).trim() || '(no name)')}</div>
              </div>
              <div>${action}</div>
            </div>
          `;
        }).join('');
        const warningsHtml = panel.warnings && panel.warnings.length
          ? `<div class="mt-3 rounded-lg border border-amber-200 bg-amber-50 p-3 text-xs text-amber-800">${panel.warnings.map(escapeHtml).join('<br>')}</div>`
          : '';
        bodyHtml = `<div class="mt-3 space-y-2">${rows}</div>${warningsHtml}`;
      }
      return `
        <div class="rounded-xl border border-gray-200 bg-white p-4">
          <div class="flex items-center justify-between gap-3">
            <div>
              <div class="text-sm font-semibold text-gray-900">Parents</div>
              <div class="mt-1 text-xs text-gray-500">Records this row references via foreign keys on its own data.</div>
            </div>
            <button type="button" onclick="refreshParentRecordsForOpenRecord()" class="rounded-lg border border-gray-300 px-3 py-1 text-xs font-semibold text-gray-700 hover:bg-gray-50">Refresh</button>
          </div>
          ${bodyHtml}
        </div>
      `;
    }

    function renderLinkedRecordsSection(record) {
      const rels = getRelationshipsForEntity(record && record.entity_type);
      if (!rels.length) return '';
      const panel = state.cascadeLinkedPanel;
      let bodyHtml;
      if (!panel) {
        bodyHtml = `
          <div class="mt-3 text-sm text-gray-500">Discover related rows for this record.</div>
          <div class="mt-3"><button type="button" onclick="refreshLinkedRecordsForOpenRecord()" class="rounded-xl border border-gray-300 px-4 py-2 text-sm font-semibold text-gray-700 hover:bg-gray-50">Load Linked Records</button></div>
        `;
      } else if (panel.loading) {
        bodyHtml = '<div class="mt-3 text-sm text-gray-500">Loading linked records…</div>';
      } else if (!panel.breakdown.length || panel.totalChildren === 0) {
        bodyHtml = '<div class="mt-3 text-sm text-gray-500">No linked records found for this row.</div>';
      } else {
        const rows = panel.breakdown
          .filter((row) => row.count > 0)
          .map((row) => `
            <div class="flex items-center justify-between gap-3 rounded-lg border border-gray-200 bg-white px-3 py-2 text-sm">
              <div>
                <div class="font-medium text-gray-900">${escapeHtml(row.label)}${row.transitive ? ' <span class="text-xs text-gray-500">(transitive)</span>' : ''}</div>
                <div class="text-xs text-gray-500">${escapeHtml(row.parent_entity_type)} &rarr; ${escapeHtml(row.entity_type)}</div>
              </div>
              <div class="flex items-center gap-3">
                <span class="text-sm font-semibold text-gray-900">${formatNumber(row.count)}</span>
                <button type="button" onclick="filterToLinkedRecords('${escapeHtml(record.id)}','${escapeHtml(row.entity_type)}')" class="rounded-lg border border-gray-300 px-2 py-1 text-xs font-semibold text-gray-700 hover:bg-gray-50">View</button>
              </div>
            </div>
          `).join('');
        const warningsHtml = panel.warnings && panel.warnings.length
          ? `<div class="mt-3 rounded-lg border border-amber-200 bg-amber-50 p-3 text-xs text-amber-800">${panel.warnings.map(escapeHtml).join('<br>')}</div>`
          : '';
        bodyHtml = `<div class="mt-3 space-y-2">${rows || '<div class="text-sm text-gray-500">No linked records.</div>'}</div>${warningsHtml}`;
      }
      return `
        <div class="rounded-xl border border-gray-200 bg-white p-4">
          <div class="flex items-center justify-between gap-3">
            <div>
              <div class="text-sm font-semibold text-gray-900">Linked Records</div>
              <div class="mt-1 text-xs text-gray-500">Rows in other entity types that reference this record.</div>
            </div>
            <button type="button" onclick="refreshLinkedRecordsForOpenRecord()" class="rounded-lg border border-gray-300 px-3 py-1 text-xs font-semibold text-gray-700 hover:bg-gray-50">Refresh</button>
          </div>
          ${bodyHtml}
        </div>
      `;
    }

    function renderRecordAssignSection(record) {
      const hasRels = getRelationshipsForEntity(record && record.entity_type).length > 0;
      const cascadeLabel = hasRels
        ? 'Toggle "Also assign linked records" in Bulk Actions to include linked rows.'
        : 'This entity has no declared relationships; only this record will be assigned.';
      return `
        <div class="rounded-xl border border-gray-200 bg-white p-4">
          <div class="text-sm font-semibold text-gray-900">Assign To Matter</div>
          <div class="mt-1 text-xs text-gray-500">Uses the matter selected in the Bulk Actions panel. ${escapeHtml(cascadeLabel)}</div>
          <div class="mt-3 flex flex-wrap gap-2">
            <button type="button" onclick="assignSingleRecordWithCascade('${escapeHtml(record.id)}')" class="rounded-xl bg-blue-600 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700">Assign Record</button>
          </div>
        </div>
      `;
    }

    function closeRecordDetail() {
      state.selectedRecordId = '';
      state.selectedRecord = null;
      state.recordAnnotations = [];
      state.cascadeLinkedPanel = null;
      state.parentRecordsPanel = null;
      renderDataPreview();
    }

    function renderDataPreviewPagination(node, info) {
      if (!node) return;
      const { limit, offset, total, hasMore } = info;
      if (!total || total <= limit) {
        node.classList.add('hidden');
        node.classList.remove('flex');
        node.innerHTML = '';
        return;
      }
      const totalPages = Math.max(1, Math.ceil(total / limit));
      const currentPage = Math.floor(offset / limit) + 1;
      const isFirst = offset <= 0;
      const isLast = !hasMore;
      const btnBase = 'rounded-lg border border-gray-300 px-3 py-2 text-xs font-semibold text-gray-700 hover:bg-gray-50';
      const btnDisabled = 'rounded-lg border border-gray-200 px-3 py-2 text-xs font-semibold text-gray-300 cursor-not-allowed';

      node.classList.remove('hidden');
      node.classList.add('flex');
      node.innerHTML = `
        <div class="text-sm text-gray-600">Page <span class="font-semibold text-gray-900">${formatNumber(currentPage)}</span> of <span class="font-semibold text-gray-900">${formatNumber(totalPages)}</span></div>
        <div class="flex flex-wrap items-center gap-2">
          <button type="button" onclick="goToDataPage('first')" ${isFirst ? 'disabled' : ''} class="${isFirst ? btnDisabled : btnBase}">First</button>
          <button type="button" onclick="goToDataPage('prev')" ${isFirst ? 'disabled' : ''} class="${isFirst ? btnDisabled : btnBase}">Previous</button>
          <button type="button" onclick="goToDataPage('next')" ${isLast ? 'disabled' : ''} class="${isLast ? btnDisabled : btnBase}">Next</button>
          <button type="button" onclick="goToDataPage('last')" ${isLast ? 'disabled' : ''} class="${isLast ? btnDisabled : btnBase}">Last</button>
        </div>
      `;
    }

    function renderDataPreview() {
      const meta = document.getElementById('dataPreviewMeta');
      const container = document.getElementById('dataPreviewTable');
      const paginationNode = document.getElementById('dataPreviewPagination');
      const response = state.dataPreview;
      const rows = response && Array.isArray(response.data) ? response.data : [];
      const pagination = response && response.pagination ? response.pagination : null;

      if (!rows.length) {
        state.selectedDataIds = [];
        state.selectedRowsById = {};
        state.selectionMode = 'manual';
        renderBulkActionSummary();
        renderSelectionToolbar();
        renderRecordDetail();
        meta.textContent = 'No connector data found for this filter.';
        container.innerHTML = '<div class="p-8 text-center text-sm text-gray-500">No records to preview.</div>';
        if (paginationNode) {
          paginationNode.classList.add('hidden');
          paginationNode.classList.remove('flex');
          paginationNode.innerHTML = '';
        }
        return;
      }

      if (state.selectedRecordId) {
        state.selectedRecord = rows.find((row) => row.id === state.selectedRecordId) || state.selectedRecord;
      }

      if (pagination) {
        const limit = pagination.limit || state.dataPreviewLimit || rows.length;
        const offset = pagination.offset || 0;
        const total = pagination.total || 0;
        const start = total === 0 ? 0 : offset + 1;
        const end = offset + rows.length;
        meta.textContent = `Showing ${formatNumber(start)}–${formatNumber(end)} of ${formatNumber(total)} records`;
        renderDataPreviewPagination(paginationNode, { limit, offset, total, hasMore: Boolean(pagination.has_more) });
      } else {
        meta.textContent = `Showing ${rows.length} records`;
        if (paginationNode) {
          paginationNode.classList.add('hidden');
          paginationNode.classList.remove('flex');
          paginationNode.innerHTML = '';
        }
      }

      const allFiltered = state.selectionMode === 'all-filtered';
      const headerChecked = allFiltered || (state.selectedDataIds.length > 0 && state.selectedDataIds.length === rows.length);

      container.innerHTML = `
        <table class="min-w-full divide-y divide-gray-200 text-sm">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-4 py-3 text-left font-semibold text-gray-600">
                <input type="checkbox" ${headerChecked ? 'checked' : ''} onchange="toggleAllDataSelection(this.checked)">
              </th>
              <th class="px-4 py-3 text-left font-semibold text-gray-600">Entity</th>
              <th class="px-4 py-3 text-left font-semibold text-gray-600">External ID</th>
              <th class="px-4 py-3 text-left font-semibold text-gray-600">Matter</th>
              <th class="px-4 py-3 text-left font-semibold text-gray-600">Health</th>
              <th class="px-4 py-3 text-left font-semibold text-gray-600">Synced</th>
              <th class="px-4 py-3 text-left font-semibold text-gray-600">Actions</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-200 bg-white">
            ${rows.map((row) => `
              <tr class="${state.selectedRecordId === row.id ? 'bg-blue-50' : ''}">
                <td class="px-4 py-3 align-top">
                  <input type="checkbox" ${(allFiltered || state.selectedDataIds.includes(row.id)) ? 'checked' : ''} onchange="toggleDataSelection('${escapeHtml(row.id)}', this.checked)">
                </td>
                <td class="px-4 py-3 align-top">
                  <div class="font-semibold text-gray-900">${escapeHtml(titleCase(row.entity_type || 'record'))}</div>
                </td>
                <td class="px-4 py-3 align-top connector-mono text-gray-700">${escapeHtml(row.external_id || '')}</td>
                <td class="px-4 py-3 align-top text-gray-700">${escapeHtml(row.matter_name || 'Unassigned')}</td>
                <td class="px-4 py-3 align-top">
                  <div class="flex flex-wrap gap-2">
                    ${row.has_corrections ? getBadgeHtml('Corrections', 'badge-yellow') : ''}
                    ${row.has_flags ? getBadgeHtml(row.flag_count > 1 ? `Flagged ×${row.flag_count}` : 'Flagged', 'badge-amber') : ''}
                    ${(!row.has_corrections && !row.has_flags) ? getBadgeHtml('Clean', 'badge-green') : ''}
                    ${row.annotation_count ? getBadgeHtml(`${row.annotation_count} note${row.annotation_count === 1 ? '' : 's'}`, 'badge-slate') : ''}
                  </div>
                </td>
                <td class="px-4 py-3 align-top text-gray-600">${escapeHtml(formatDateTime(row.synced_at))}</td>
                <td class="px-4 py-3 align-top">
                  <div class="flex flex-wrap gap-2">
                    <button type="button" onclick="openRecordDetail('${escapeHtml(row.id)}')" class="rounded-lg border border-gray-300 px-3 py-2 text-xs font-semibold text-gray-700 hover:bg-gray-50">Inspect</button>
                    <button type="button" onclick="shortlistSingleRecord('${escapeHtml(row.id)}')" class="rounded-lg border border-amber-200 px-3 py-2 text-xs font-semibold text-amber-700 hover:bg-amber-50">Flag</button>
                  </div>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;

      renderBulkActionSummary();
      renderSelectionToolbar();
      renderRecordDetail();
      scheduleCascadePanelRefresh();
    }

    function renderLogs() {
      const meta = document.getElementById('logsMeta');
      const container = document.getElementById('logsTable');
      const response = state.logs;
      const rows = response && Array.isArray(response.logs) ? response.logs : [];
      const pagination = response && response.pagination ? response.pagination : null;

      if (!rows.length) {
        meta.textContent = 'No sync logs recorded yet.';
        container.innerHTML = '<div class="p-8 text-center text-sm text-gray-500">No execution logs yet.</div>';
        renderLogDetail();
        return;
      }

      meta.textContent = pagination
        ? `Showing ${rows.length} of ${formatNumber(pagination.total)} logs`
        : `Showing ${rows.length} logs`;

      container.innerHTML = `
        <table class="min-w-full divide-y divide-gray-200 text-sm">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-4 py-3 text-left font-semibold text-gray-600">Started</th>
              <th class="px-4 py-3 text-left font-semibold text-gray-600">Status</th>
              <th class="px-4 py-3 text-left font-semibold text-gray-600">Records</th>
              <th class="px-4 py-3 text-left font-semibold text-gray-600">Error</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-200 bg-white">
            ${rows.map((row) => `
              <tr class="cursor-pointer hover:bg-gray-50 ${state.selectedLogId === row.id ? 'bg-blue-50' : ''}" onclick="openLogDetail('${escapeHtml(row.id)}')">
                <td class="px-4 py-3 align-top text-gray-700">${escapeHtml(formatDateTime(row.started_at))}</td>
                <td class="px-4 py-3 align-top">${renderLogStatus(row.status)}</td>
                <td class="px-4 py-3 align-top text-gray-700">
                  Processed ${formatNumber(row.records && row.records.processed)}<br>
                  Failed ${formatNumber(row.records && row.records.failed)}
                </td>
                <td class="px-4 py-3 align-top text-gray-600">${escapeHtml(row.error_message || '')}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;

      renderLogDetail();
    }

    function renderLogStatus(status) {
      const normalized = String(status || 'unknown');
      if (normalized === 'completed') return getBadgeHtml('Completed', 'badge-green');
      if (normalized === 'failed') return getBadgeHtml('Failed', 'badge-red');
      if (normalized === 'running' || normalized === 'queued' || normalized === 'processing') return getBadgeHtml(normalized, 'badge-yellow');
      return getBadgeHtml(normalized, 'badge-slate');
    }

    function isLogInFlight(status) {
      const normalized = String(status || '').toLowerCase();
      return normalized === 'running' || normalized === 'queued' || normalized === 'processing' || normalized === 'started';
    }

    function findSelectedLog() {
      const rows = state.logs && Array.isArray(state.logs.logs) ? state.logs.logs : [];
      return rows.find((row) => row.id === state.selectedLogId) || null;
    }

    function openLogDetail(logId) {
      state.selectedLogId = logId;
      renderLogs();

      const log = findSelectedLog();
      if (state.logDetailPollTimer) {
        clearInterval(state.logDetailPollTimer);
        state.logDetailPollTimer = null;
      }
      if (log && isLogInFlight(log.status)) {
        state.logDetailPollTimer = setInterval(async () => {
          try {
            await refreshLogs();
            const current = findSelectedLog();
            if (!current || !isLogInFlight(current.status)) {
              if (state.logDetailPollTimer) {
                clearInterval(state.logDetailPollTimer);
                state.logDetailPollTimer = null;
              }
            }
          } catch (error) {
            console.error('[Connector Viewer] Failed to poll log detail', error);
          }
        }, 2000);
      }
    }

    function closeLogDetail() {
      state.selectedLogId = '';
      if (state.logDetailPollTimer) {
        clearInterval(state.logDetailPollTimer);
        state.logDetailPollTimer = null;
      }
      const panel = document.getElementById('logDetailPanel');
      const backdrop = document.getElementById('logDetailBackdrop');
      if (panel) {
        panel.classList.add('hidden');
        panel.innerHTML = '';
      }
      if (backdrop) {
        backdrop.classList.add('hidden');
      }
      renderLogs();
    }

    function renderLogDetail() {
      const panel = document.getElementById('logDetailPanel');
      const backdrop = document.getElementById('logDetailBackdrop');
      if (!panel) return;

      const log = findSelectedLog();
      if (!log) {
        panel.classList.add('hidden');
        panel.innerHTML = '';
        if (backdrop) backdrop.classList.add('hidden');
        return;
      }

      panel.classList.remove('hidden');
      if (backdrop) backdrop.classList.remove('hidden');

      const records = log.records || {};
      const changes = log.changes || {};
      const metadata = log.metadata && typeof log.metadata === 'object' ? log.metadata : null;
      const hasMetadata = metadata && Object.keys(metadata).length > 0;
      const inFlight = isLogInFlight(log.status);
      const completedDisplay = log.completed_at
        ? escapeHtml(formatDateTime(log.completed_at))
        : (inFlight ? '<span class="text-amber-600">Still running…</span>' : '<span class="text-gray-400">—</span>');
      const durationDisplay = (log.duration_seconds === null || log.duration_seconds === undefined)
        ? '<span class="text-gray-400">—</span>'
        : `${escapeHtml(String(log.duration_seconds))}s`;
      const triggeredBy = log.triggered_by || (log.triggered_by_user_id ? 'user' : 'system');
      const triggeredByUser = log.triggered_by_user_id ? ` (${escapeHtml(String(log.triggered_by_user_id))})` : '';
      const errorDetailsJson = log.error_details
        ? (typeof log.error_details === 'string' ? log.error_details : JSON.stringify(log.error_details, null, 2))
        : '';

      const consoleOutputHtml = renderConsoleOutput(metadata);

      panel.innerHTML = `
        <div class="min-h-full bg-white">
          <div class="sticky top-0 z-10 flex items-start justify-between gap-4 border-b border-gray-200 bg-white px-6 py-5">
            <div>
              <div class="flex items-center gap-3">
                ${renderLogStatus(log.status)}
                <div class="connector-label">Sync Log Detail</div>
              </div>
              <div class="mt-2 connector-mono text-xs text-gray-500">${escapeHtml(log.id || '')}</div>
            </div>
            <button type="button" onclick="closeLogDetail()" class="rounded-xl border border-gray-300 px-4 py-2 text-sm font-semibold text-gray-700 hover:bg-gray-50">
              Close
            </button>
          </div>

          <div class="space-y-6 p-6">
            <div class="grid gap-4 sm:grid-cols-2">
              <div class="rounded-xl border border-gray-200 bg-white p-4">
                <div class="text-xs font-semibold uppercase tracking-wide text-gray-500">Started At</div>
                <div class="mt-2 text-sm font-semibold text-gray-900">${escapeHtml(formatDateTime(log.started_at))}</div>
              </div>
              <div class="rounded-xl border border-gray-200 bg-white p-4">
                <div class="text-xs font-semibold uppercase tracking-wide text-gray-500">Completed At</div>
                <div class="mt-2 text-sm font-semibold text-gray-900">${completedDisplay}</div>
              </div>
              <div class="rounded-xl border border-gray-200 bg-white p-4">
                <div class="text-xs font-semibold uppercase tracking-wide text-gray-500">Duration</div>
                <div class="mt-2 text-sm font-semibold text-gray-900">${durationDisplay}</div>
              </div>
              <div class="rounded-xl border border-gray-200 bg-white p-4">
                <div class="text-xs font-semibold uppercase tracking-wide text-gray-500">Triggered By</div>
                <div class="mt-2 text-sm font-semibold text-gray-900">${escapeHtml(String(triggeredBy))}${triggeredByUser}</div>
              </div>
              <div class="rounded-xl border border-gray-200 bg-white p-4">
                <div class="text-xs font-semibold uppercase tracking-wide text-gray-500">Connector ID</div>
                <div class="mt-2 connector-mono text-xs font-semibold text-gray-900 break-all">${escapeHtml(log.connector_id || '')}</div>
              </div>
              <div class="rounded-xl border border-gray-200 bg-white p-4">
                <div class="text-xs font-semibold uppercase tracking-wide text-gray-500">Sync Type</div>
                <div class="mt-2 text-sm font-semibold text-gray-900">${escapeHtml(log.sync_type || '—')}</div>
              </div>
            </div>

            <div class="rounded-xl border border-gray-200 bg-white p-4">
              <div class="text-sm font-semibold text-gray-900">Records</div>
              <div class="mt-3 grid grid-cols-2 gap-3 sm:grid-cols-5">
                <div class="rounded-lg bg-gray-50 p-3">
                  <div class="text-xs uppercase tracking-wide text-gray-500">Processed</div>
                  <div class="mt-1 text-lg font-semibold text-gray-900">${formatNumber(records.processed)}</div>
                </div>
                <div class="rounded-lg bg-emerald-50 p-3">
                  <div class="text-xs uppercase tracking-wide text-emerald-700">Created</div>
                  <div class="mt-1 text-lg font-semibold text-emerald-900">${formatNumber(records.created)}</div>
                </div>
                <div class="rounded-lg bg-blue-50 p-3">
                  <div class="text-xs uppercase tracking-wide text-blue-700">Updated</div>
                  <div class="mt-1 text-lg font-semibold text-blue-900">${formatNumber(records.updated)}</div>
                </div>
                <div class="rounded-lg bg-red-50 p-3">
                  <div class="text-xs uppercase tracking-wide text-red-700">Failed</div>
                  <div class="mt-1 text-lg font-semibold text-red-900">${formatNumber(records.failed)}</div>
                </div>
                <div class="rounded-lg bg-gray-50 p-3">
                  <div class="text-xs uppercase tracking-wide text-gray-500">Unchanged</div>
                  <div class="mt-1 text-lg font-semibold text-gray-900">${formatNumber(records.unchanged)}</div>
                </div>
              </div>

              <div class="mt-5 text-sm font-semibold text-gray-900">Changes</div>
              <div class="mt-3 grid grid-cols-3 gap-3">
                <div class="rounded-lg bg-emerald-50 p-3">
                  <div class="text-xs uppercase tracking-wide text-emerald-700">Created</div>
                  <div class="mt-1 text-lg font-semibold text-emerald-900">${formatNumber(changes.created)}</div>
                </div>
                <div class="rounded-lg bg-blue-50 p-3">
                  <div class="text-xs uppercase tracking-wide text-blue-700">Updated</div>
                  <div class="mt-1 text-lg font-semibold text-blue-900">${formatNumber(changes.updated)}</div>
                </div>
                <div class="rounded-lg bg-red-50 p-3">
                  <div class="text-xs uppercase tracking-wide text-red-700">Deleted</div>

                </div>
              </div>
            </div>

            ${(log.error_message || errorDetailsJson) ? `
              <div class="rounded-xl border border-red-200 bg-red-50 p-4">
                <div class="text-sm font-semibold text-red-900">Error</div>
                ${log.error_message ? `<div class="mt-2 text-sm text-red-800">${escapeHtml(log.error_message)}</div>` : ''}
                ${errorDetailsJson ? `<pre class="mt-3 max-h-[320px] overflow-auto rounded-lg bg-red-100 p-3 text-xs text-red-900">${escapeHtml(errorDetailsJson)}</pre>` : ''}
              </div>
            ` : ''}

            ${hasMetadata ? `
              <div class="rounded-xl border border-gray-200 bg-white p-4">
                <div class="text-sm font-semibold text-gray-900">Metadata</div>
                <pre class="mt-3 max-h-[320px] overflow-auto rounded-xl bg-gray-950 p-4 text-xs text-gray-100 connector-mono">${escapeHtml(JSON.stringify(metadata, null, 2))}</pre>
              </div>
            ` : ''}

            <details class="rounded-xl border border-gray-200 bg-white p-4">
              <summary class="cursor-pointer text-sm font-semibold text-gray-900">Raw JSON</summary>
              <pre class="mt-3 max-h-[420px] overflow-auto rounded-xl bg-gray-950 p-4 text-xs text-gray-100 connector-mono">${escapeHtml(JSON.stringify(log, null, 2))}</pre>
            </details>

            ${consoleOutputHtml}
          </div>
        </div>
      `;
    }

    function renderConsoleOutput(metadata) {
      const meta = metadata && typeof metadata === 'object' ? metadata : {};
      const apiCalls = Array.isArray(meta.api_calls) ? meta.api_calls : [];
      const apiCallsTruncated = Number(meta.api_calls_truncated) || 0;
      const entityProgress = (meta.entity_progress && typeof meta.entity_progress === 'object')
        ? meta.entity_progress
        : {};

      const events = [];
      for (const [entityType, ev] of Object.entries(entityProgress)) {
        if (!ev || typeof ev !== 'object') continue;
        events.push({
          ts: ev.timestamp ? new Date(ev.timestamp).getTime() : 0,
          kind: 'entity',
          entityType,
          status: ev.status || '',
          stats: ev
        });
      }
      for (const call of apiCalls) {
        if (!call || typeof call !== 'object') continue;
        events.push({
          ts: call.ts ? new Date(call.ts).getTime() : 0,
          kind: 'api',
          call
        });
      }
      events.sort((a, b) => a.ts - b.ts);

      if (events.length === 0) {
        return `
          <details class="rounded-xl border border-gray-200 bg-white p-4">
            <summary class="cursor-pointer text-sm font-semibold text-gray-900">Console Output</summary>
            <div class="mt-3 rounded-xl bg-gray-950 p-4 text-xs text-gray-400 connector-mono">No API calls or entity events captured for this sync.</div>
          </details>
        `;
      }

      const lines = events.map((ev) => formatConsoleLine(ev)).join('<br>');
      const truncatedNote = apiCallsTruncated > 0
        ? `<div class="mt-3 text-xs text-amber-600">… ${apiCallsTruncated} additional API call(s) not shown (capped to keep log size bounded)</div>`
        : '';
      const summaryStats = `${apiCalls.length} call${apiCalls.length === 1 ? '' : 's'} · ${Object.keys(entityProgress).length} entity event${Object.keys(entityProgress).length === 1 ? '' : 's'}`;

      return `
        <details class="rounded-xl border border-gray-200 bg-white p-4" open>
          <summary class="cursor-pointer text-sm font-semibold text-gray-900">
            Console Output
            <span class="ml-2 text-xs font-normal text-gray-500">${escapeHtml(summaryStats)}</span>
          </summary>
          <div class="mt-3 max-h-[480px] overflow-auto rounded-xl bg-gray-950 p-4 text-xs leading-relaxed text-gray-100 connector-mono">${lines}</div>
          ${truncatedNote}
        </details>
      `;
    }

    function formatConsoleLine(ev) {
      const time = `<span class="text-gray-500">[${formatConsoleTime(ev.ts)}]</span>`;
      if (ev.kind === 'api') {
        const c = ev.call;
        const method = `<span class="text-cyan-400 font-semibold">${escapeHtml(String(c.method || 'GET').padEnd(6, ' '))}</span>`;
        const url = `<span class="text-gray-200 break-all">${escapeHtml(c.url || '')}</span>`;
        const statusText = (c.status === null || c.status === undefined) ? '---' : String(c.status);
        const status = `<span class="${consoleStatusColor(c.status)}">${escapeHtml(statusText)}</span>`;
        const duration = `<span class="text-gray-400">${escapeHtml(String(Math.round(c.duration_ms || 0)))}ms</span>`;
        const bytes = Number.isFinite(c.bytes)
          ? ` <span class="text-gray-500">·</span> <span class="text-gray-500">${escapeHtml(formatConsoleBytes(c.bytes))}</span>`
          : '';
        let line = `${time} ${method} ${url} <span class="text-gray-500">→</span> ${status} <span class="text-gray-500">·</span> ${duration}${bytes}`;
        if (c.error && c.error.message) {
          line += `<div class="pl-12 text-red-400">↳ ${escapeHtml(String(c.error.message))}</div>`;
        }
        return line;
      }
      const status = ev.status || '';
      const color = status === 'completed' ? 'text-emerald-400'
        : status === 'failed' ? 'text-red-400'
        : status === 'started' ? 'text-yellow-300'
        : 'text-blue-300';
      const restStats = {};
      for (const [k, v] of Object.entries(ev.stats || {})) {
        if (k === 'status' || k === 'timestamp') continue;
        restStats[k] = v;
      }
      const statsTail = Object.keys(restStats).length > 0
        ? ` <span class="text-gray-500">·</span> <span class="text-gray-400">${escapeHtml(JSON.stringify(restStats))}</span>`
        : '';
      return `${time} <span class="text-purple-400 font-semibold">entity</span> <span class="text-gray-200">${escapeHtml(ev.entityType)}</span> <span class="text-gray-500">→</span> <span class="${color}">${escapeHtml(status)}</span>${statsTail}`;
    }

    function formatConsoleTime(tsMs) {
      if (!tsMs) return '--:--:--.---';
      const d = new Date(tsMs);
      const pad = (n, w) => String(n).padStart(w, '0');
      return `${pad(d.getHours(), 2)}:${pad(d.getMinutes(), 2)}:${pad(d.getSeconds(), 2)}.${pad(d.getMilliseconds(), 3)}`;
    }

    function consoleStatusColor(status) {
      if (status === null || status === undefined) return 'text-gray-400';
      const n = Number(status);
      if (n >= 500) return 'text-red-400';
      if (n >= 400) return 'text-amber-400';
      if (n >= 300) return 'text-yellow-300';
      if (n >= 200) return 'text-emerald-400';
      return 'text-gray-300';
    }

    function formatConsoleBytes(b) {
      if (!Number.isFinite(b)) return '';
      if (b < 1024) return `${b} B`;
      if (b < 1024 * 1024) return `${(b / 1024).toFixed(1)} KB`;
      return `${(b / (1024 * 1024)).toFixed(2)} MB`;
    }

    function serializeConfigForm() {
      const forms = [document.getElementById('configForm'), document.getElementById('webhooksForm')].filter(Boolean);
      const fields = [...getCatalogFields(), ...getWebhookFields()];
      const dynamicFields = getCatalogDynamicFields();
      const payload = {};
      const authModes = getAvailableAuthModes();

      if (authModes.length > 1) {
        payload.auth_type = getSelectedAuthModeType();
      }

      fields.forEach((field) => {
        const element = forms
          .map((form) => form.elements[field.name])
          .find(Boolean);
        if (!element) return;

        if (field.type === 'boolean') {
          payload[field.name] = Boolean(element.checked);
          return;
        }

        const rawValue = element.value;
        if (rawValue === '' && !field.required) {
          return;
        }

        if (field.type === 'number') {
          payload[field.name] = rawValue === '' ? null : Number(rawValue);
          return;
        }

        if (field.type === 'multiselect' || field.type === 'multiselect_dynamic') {
          const selectedValues = Array.from(element.selectedOptions || [])
            .map((option) => option.value)
            .filter(Boolean);
          if (!selectedValues.length && !field.required) {
            return;
          }
          payload[field.name] = selectedValues;
          return;
        }

        payload[field.name] = rawValue;
      });

      dynamicFields.forEach((field) => {
        if (field.type === 'array') {
          payload[field.name] = getArrayFieldValuesFromDom(field.name);
        }
      });

      return payload;
    }

    async function discoverDynamicFieldOptions(fieldName) {
      if (!state.sourceId) return;

      const field = getCatalogFields().find((entry) => entry?.name === fieldName && entry?.type === 'multiselect_dynamic');
      if (!field || !field.dynamic_source) {
        return;
      }

      try {
        state.formDraft = captureConfigFormDraft();
        state.dynamicFieldLoading[fieldName] = true;
        delete state.dynamicFieldErrors[fieldName];
        renderConfiguration();

        const payload = serializeConfigForm();
        const result = await api.post(connectorApi(`/discovery/${encodeURIComponent(field.dynamic_source)}`), {
          config: payload
        });

        state.dynamicFieldOptions[fieldName] = Array.isArray(result?.options) ? result.options : [];
        delete state.dynamicFieldErrors[fieldName];
        showPageAlert(`${field.label || titleCase(field.name)} options loaded.`, 'success');
      } catch (error) {
        console.error('[Connector Viewer] Failed to discover dynamic field options', error);
        state.dynamicFieldErrors[fieldName] = error.message || 'Failed to load options.';
        showPageAlert(error.message || 'Failed to load connector options.', 'error');
      } finally {
        state.dynamicFieldLoading[fieldName] = false;
        renderConfiguration();
      }
    }

    async function refreshBaseData(showNotice, options = {}) {
      if (!state.sourceId) {

      const preservedDraft = options.preserveDraft ? captureConfigFormDraft() : null;
      const preservedAuthMode = options.preserveDraft ? (state.authModeDraft || getSelectedAuthModeType()) : '';

      const [summary, configResponse] = await Promise.all([
        api.get(connectorApi('/summary')),
        api.get(connectorApi('/config'))

      state.configResponse = configResponse;
      state.formDraft = options.preserveDraft ? preservedDraft : null;

      renderViewer();

    async function saveConfiguration(options = {}) {
      if (!state.sourceId) return;

      try {
        const forms = [document.getElementById('configForm'), document.getElementById('webhooksForm')].filter(Boolean);
        const invalidForm = forms.find((form) => typeof form.reportValidity === 'function' && !form.reportValidity());
        if (invalidForm) {
          throw new Error('Fill in the required configuration fields before saving.');
        }

        if (!options.silentLoading) {
          showPageAlert('Saving configuration...', 'info');
        }
        const configPayload = serializeConfigForm();
        const syncFrequency = document.getElementById('syncFrequency').value;
        const scheduledSyncTime = document.getElementById('scheduledSyncTime').value;

        await api.patch(connectorApi('/config'), configPayload);
        await api.patch(connectorApi('/sync-settings'), {
          sync_frequency: syncFrequency,
          ...(syncFrequency === 'daily' || syncFrequency === 'weekly'
            ? { scheduled_sync_time: scheduledSyncTime || '08:00:00' }
            : {})
        });

        state.pendingAuthorizationUrl = null;
        state.pendingAuthorizationUrlError = null;
        state.formDraft = null;
        state.authModeDraft = '';
        await refreshBaseData(false);
        if (!options.silentSuccess) {
          showPageAlert('Configuration saved.', 'success');
        }
        return true;
      } catch (error) {
        console.error('[Connector Viewer] Failed to save configuration', error);
        showPageAlert(error.message || 'Failed to save configuration.', 'error');
        throw error;
      }
    }
