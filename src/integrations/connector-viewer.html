<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connector - LANA AI</title>

  <link rel="stylesheet" href="../css/lex-tokens.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/tailwind-output.css">
  <script src="../js/tailwind-loader.js"></script>

  <style>
    .connector-tab.active {
      border-color: #2563eb;
      color: #2563eb;
      background: #eff6ff;
    }

    .connector-tabpane {
      display: none;
    }

    .connector-tabpane.active {
      display: block;
    }

    .connector-card {
      border: 1px solid #e5e7eb;
      border-radius: 1rem;
      background: #fff;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
    }

    .connector-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #6b7280;
    }

    .connector-value {
      color: #111827;
    }

    .connector-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .docs-frame {
      min-height: 70vh;
    }

    .docs-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      border-radius: 9999px;
      padding: 0.25rem 0.75rem;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge-green {
      background: #dcfce7;
      color: #166534;
    }

    .badge-yellow {
      background: #fef3c7;
      color: #92400e;
    }

    .badge-red {
      background: #fee2e2;
      color: #991b1b;
    }

    .badge-slate {
      background: #e5e7eb;
      color: #334155;
    }

    .output-layout {
      display: grid;
      gap: 1.5rem;
    }

    .output-sidebar,
    .output-main {
      min-width: 0;
    }

    @media (min-width: 1024px) {
      .output-layout {
        grid-template-columns: 340px minmax(0, 1fr);
        align-items: start;
      }

      .output-sidebar {
        position: sticky;
        top: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <lex-loader theme="light"></lex-loader>

  <lex-app
    logo-src="../img/logo-light.png"
    logo-alt="LANA AI"
    logo-href="../dashboard.html"
    active-nav-id="connectors"
    page-title="Connector"
    chrome="embedded"
    back-href="../data-connectors.html"
  ></lex-app>

  <template id="page-content">
    <main class="p-4 lg:p-8">
      <lex-breadcrumb id="connectorBreadcrumb" items='[{"label":"Data Connectors","href":"data-connectors.html"},{"label":"Connector"}]'></lex-breadcrumb>

      <div id="pageAlert" class="hidden mb-6 rounded-2xl border px-4 py-3 text-sm"></div>

      <div id="viewerLoading" class="flex items-center justify-center py-20">
        <div class="flex items-center gap-3 text-gray-600">
          <div class="h-10 w-10 animate-spin rounded-full border-4 border-gray-200 border-t-blue-600"></div>
          <span>Loading connector workspace...</span>
        </div>
      </div>

      <div id="viewerError" class="hidden connector-card p-10 text-center">
        <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-red-100 text-red-600">
          <svg class="h-7 w-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
        </div>
        <h2 class="mb-2 text-xl font-semibold text-gray-900">Failed to load connector</h2>
        <p id="viewerErrorMessage" class="mx-auto max-w-2xl text-sm text-gray-600"></p>
      </div>

      <div id="viewerContent" class="hidden space-y-6">
        <section class="grid gap-6 md:grid-cols-2 xl:grid-cols-4">
          <div class="connector-card p-5">
            <div class="connector-label">Setup</div>
            <div id="setupStatus" class="mt-3"></div>
            <div id="setupMessage" class="mt-3 text-sm text-gray-500"></div>
          </div>
          <div class="connector-card p-5">
            <div class="connector-label">Authentication</div>
            <div id="authStatus" class="mt-3 text-xl font-semibold text-gray-900">-</div>
            <div id="authType" class="mt-2 text-sm text-gray-500">-</div>
          </div>
          <div class="connector-card p-5">
            <div class="connector-label">Last Sync</div>
            <div id="lastSyncStatus" class="mt-3 text-xl font-semibold text-gray-900">Never</div>
            <div id="lastSyncTime" class="mt-2 text-sm text-gray-500">No sync recorded</div>
          </div>
          <div class="connector-card p-5">
            <div class="connector-label">Records Synced</div>
            <div id="recordsSynced" class="mt-3 text-xl font-semibold text-gray-900">0</div>
            <div id="entityCountSummary" class="mt-2 text-sm text-gray-500">No connector data yet</div>
          </div>
        </section>

        <section class="connector-card overflow-hidden">
          <div class="border-b border-gray-200 px-4">
            <nav id="tabNav" class="flex flex-wrap gap-2 py-3">
              <button type="button" class="connector-tab rounded-full border border-transparent px-4 py-2 text-sm font-medium text-gray-600 transition" data-tab="overview">Overview</button>
              <button type="button" class="connector-tab rounded-full border border-transparent px-4 py-2 text-sm font-medium text-gray-600 transition" data-tab="configuration">Configuration</button>
              <button type="button" class="connector-tab rounded-full border border-transparent px-4 py-2 text-sm font-medium text-gray-600 transition" data-tab="run">Run</button>
              <button type="button" id="webhooksTabButton" class="connector-tab hidden rounded-full border border-transparent px-4 py-2 text-sm font-medium text-gray-600 transition" data-tab="webhooks">Webhooks</button>
              <button type="button" class="connector-tab rounded-full border border-transparent px-4 py-2 text-sm font-medium text-gray-600 transition" data-tab="data">Output</button>
              <button type="button" class="connector-tab rounded-full border border-transparent px-4 py-2 text-sm font-medium text-gray-600 transition" data-tab="logs">Execution Logs</button>
              <button type="button" class="connector-tab rounded-full border border-transparent px-4 py-2 text-sm font-medium text-gray-600 transition" data-tab="docs">Documentation</button>
            </nav>
          </div>

          <div class="p-6">
            <section id="tab-overview" class="connector-tabpane space-y-6">
              <div id="overviewContent" class="space-y-8"></div>
            </section>

            <section id="tab-configuration" class="connector-tabpane space-y-6">

              <div class="grid gap-6 xl:grid-cols-[minmax(0,2fr)_minmax(320px,1fr)]">
                <form id="configForm" class="space-y-5 rounded-2xl border border-gray-200 p-5"></form>

                  <div class="rounded-2xl border border-gray-200 p-5">

                    <div class="mt-4 space-y-4">
                      <div>

                        <select id="syncFrequency" class="w-full rounded-xl border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200">
                          <option value="manual">Manual</option>
                          <option value="hourly">Hourly</option>
                          <option value="daily">Daily</option>
                          <option value="weekly">Weekly</option>
                        </select>
                      </div>
                      <div id="scheduledTimeGroup" class="hidden">
                        <label for="scheduledSyncTime" class="mb-2 block text-sm font-medium text-gray-700">Scheduled Time</label>
                        <input id="scheduledSyncTime" type="time" step="1" class="w-full rounded-xl border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200">

                    <div id="configStatusSummary" class="mt-4 space-y-3 text-sm text-gray-700"></div>

                </div>

            </section>

            <section id="tab-webhooks" class="connector-tabpane space-y-6">

            </section>

            <section id="tab-data" class="connector-tabpane space-y-6">
              <div class="output-layout">
                <aside class="output-sidebar space-y-6">
                  <div class="rounded-2xl border border-gray-200 p-5">
                    <div class="flex flex-wrap items-start justify-between gap-4">
                      <div>
                        <div class="connector-label">Data Filters</div>
                        <div class="mt-2 text-sm text-gray-500">Use broad search plus field rules to narrow synced connector data the way analytics tools do.</div>

                      <div class="flex flex-wrap gap-2">
                        <button type="button" onclick="addDataRule()" class="rounded-xl border border-gray-300 px-4 py-2 text-sm font-semibold text-gray-700 hover:bg-gray-50">

                    <div class="mt-5 space-y-5">

                        <select id="entityTypeFilter" onchange="refreshDataPreview()" class="w-full rounded-xl border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200">

                      <div class="grid gap-6 md:grid-cols-2 xl:grid-cols-1">
                        <label class="block">
                          <div class="mb-2 text-sm font-medium text-gray-900">Sort By</div>
                          <select id="dataSortBy" class="w-full rounded-xl border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200">
                            <option value="synced_at">Last Synced</option>
                            <option value="source_created_at">Source Created</option>
                            <option value="source_updated_at">Source Updated</option>
                            <option value="entity_type">Entity Type</option>
                            <option value="external_id">External ID</option>
                            <option value="annotation_count">Annotations</option>

                        <label class="block">
                          <div class="mb-2 text-sm font-medium text-gray-900">Direction</div>
                          <select id="dataSortDir" class="w-full rounded-xl border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200">
                            <option value="desc">Descending</option>

              <div id="generatedDocsGuide" class="rounded-2xl border border-gray-200 bg-white p-6"></div>
            </section>
          </div>
        </section>
      </div>
    </main>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const state = {
      sourceId: urlParams.get('sourceId') || '',
      connectorType: urlParams.get('connectorType') || '',
      connectorId: urlParams.get('connectorId') || '',
      connectorName: urlParams.get('name') || 'Connector',
      uiEntryPoint: urlParams.get('ui') || '',
      catalog: null,
      summary: null,
      configResponse: null,
      dataPreview: null,
      dataGroups: null,
      logs: null,
      matterOptions: [],
      dataRules: [],
      selectedDataIds: [],
      selectedRecordId: '',
      selectedRecord: null,
      recordAnnotations: [],
      dynamicFieldOptions: {},
      dynamicFieldLoading: {},
      dynamicFieldErrors: {},
      formDraft: null,
      authModeDraft: '',
      activeTab: urlParams.get('tab') || 'overview',
      docsLoaded: false,
      iframeOnlyFallback: false,
      pendingAuthorizationUrl: null,
      pendingAuthorizationUrlLoading: false,
      pendingAuthorizationUrlError: null,
      editingConfig: false,
      deleteConfigModalOpen: false
    };

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatNumber(value) {
      const number = Number(value || 0);
      return Number.isFinite(number) ? number.toLocaleString() : '0';
    }

    function formatDateTime(value) {
      if (!value) return 'Never';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);
      return date.toLocaleString();
    }

    function timeAgo(value) {
      if (!value) return 'Never';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);

      const diffMs = Date.now() - date.getTime();
      const minute = 60 * 1000;
      const hour = 60 * minute;
      const day = 24 * hour;
      const month = 30 * day;

      if (diffMs < minute) return 'just now';
      if (diffMs < hour) return `${Math.floor(diffMs / minute)} minute${Math.floor(diffMs / minute) === 1 ? '' : 's'} ago`;
      if (diffMs < day) return `${Math.floor(diffMs / hour)} hour${Math.floor(diffMs / hour) === 1 ? '' : 's'} ago`;
      if (diffMs < month) return `${Math.floor(diffMs / day)} day${Math.floor(diffMs / day) === 1 ? '' : 's'} ago`;
      return `${Math.floor(diffMs / month)} month${Math.floor(diffMs / month) === 1 ? '' : 's'} ago`;
    }

    function titleCase(value) {
      return String(value || '')
        .replace(/[_-]+/g, ' ')
        .replace(/\b\w/g, (letter) => letter.toUpperCase());
    }

    function humanizeAuthType(value) {
      const normalized = String(value || '').toLowerCase();
      if (!normalized) return 'Unknown';
      if (normalized === 'none') return 'No Authentication';
      if (normalized === 'api_key') return 'API Key';
      if (normalized === 'oauth2') return 'OAuth 2.0';
      if (normalized === 'oauth2_or_api_key') return 'OAuth 2.0 or API Key';
      if (normalized === 'basic') return 'Basic Auth';
      return titleCase(normalized);
    }

    function getUiBehavior() {
      return state.catalog?.ui_behavior || {};
    }

    function getValueByPath(source, dottedPath) {
      if (!source || !dottedPath) return undefined;
      return String(dottedPath)
        .split('.')
        .filter(Boolean)
        .reduce((current, key) => (current == null ? undefined : current[key]), source);
    }

    function normalizeAuthType(value) {
      return String(value || '').trim().toLowerCase();
    }

    function getAvailableAuthModes() {
      const auth = state.catalog?.auth || {};
      const modes = [];
      const seen = new Set();
      const addMode = (type, config, source) => {
        const normalizedType = normalizeAuthType(type || config?.type);
        if (!normalizedType || seen.has(normalizedType)) {
          return;
        }
        seen.add(normalizedType);
        modes.push({
          type: normalizedType,
          config: config || {},
          source: source || 'primary'
        });
      };

      addMode(auth.type, auth, 'primary');

      if (auth.oauth2_alternative && auth.oauth2_alternative.enabled !== false) {
        addMode(auth.oauth2_alternative.type || 'oauth2', {
          ...auth.oauth2_alternative,
          type: 'oauth2'
        }, 'oauth2_alternative');
      }

      if (auth.oauth2_fallback) {
        addMode(auth.oauth2_fallback.type || 'oauth2', {
          ...auth.oauth2_fallback,
          type: normalizeAuthType(auth.oauth2_fallback.type || 'oauth2') || 'oauth2'
        }, 'oauth2_fallback');
      }

      return modes;
    }

    function getSelectedAuthModeType() {
      const selector = document.getElementById('authModeSelect');
      const modes = getAvailableAuthModes();
      if (selector && selector.value && modes.some((mode) => mode.type === selector.value)) {
        return selector.value;
      }

      if (state.authModeDraft && modes.some((mode) => mode.type === state.authModeDraft)) {
        return state.authModeDraft;
      }

      const savedType = normalizeAuthType(state.formDraft?.auth_type || state.configResponse?.config?.auth_type);
      if (savedType && modes.some((mode) => mode.type === savedType)) {
        return savedType;
      }

      return modes[0]?.type || normalizeAuthType(state.catalog?.auth?.type) || 'unknown';
    }

    function getSelectedAuthMode() {
      const selectedType = getSelectedAuthModeType();
      return getAvailableAuthModes().find((mode) => mode.type === selectedType) || null;
    }

    function getAuthModeDisplayLabel(mode) {
      if (!mode) {
        return humanizeAuthType('unknown');
      }

      const authLabel = getUiBehavior().auth?.label;
      if (authLabel && getAvailableAuthModes().length === 1) {
        return authLabel;
      }

      return humanizeAuthType(mode.type);
    }

    function getAuthFieldsForMode(mode) {
      if (!mode?.config) {
        return [];
      }

      const authConfig = mode.config;
      if (Array.isArray(authConfig.fields) && authConfig.fields.length) {
        return authConfig.fields
          .map((field) => normalizeCatalogField(field, field.required !== false))
          .filter(Boolean);
      }

      if (mode.type === 'api_key') {
        const fieldName = authConfig.api_key_field || state.catalog?.auth?.api_key_field || 'api_key';
        return [{
          name: fieldName,
          label: titleCase(fieldName),
          type: 'password',
          description: 'API credential used to authenticate connector requests.',
          help_text: 'This field was inferred from the connector auth schema because the connector catalog did not expose a UI field definition.',
          required: true
        }];
      }

      if (mode.type === 'basic') {
        return [
          {
            name: 'username',
            label: 'Username',
            type: 'text',
            description: 'Username used for connector authentication.',
            required: true
          },
          {
            name: 'password',
            label: 'Password',
            type: 'password',
            description: 'Password used for connector authentication.',
            required: true
          }
        ];
      }

      if (mode.type === 'oauth2') {
        const clientIdField = authConfig.client_id_field || 'client_id';
        const clientSecretField = authConfig.client_secret_field || 'client_secret';
        return [
          {
            name: clientIdField,
            label: 'Client ID',
            type: 'text',
            description: 'OAuth client ID used to start the authorization flow.',
            help_text: authConfig.note || 'Store the client credentials in LANA, then use Connect to complete authorization.',
            required: true
          },
          {
            name: clientSecretField,
            label: 'Client Secret',
            type: 'password',
            description: 'OAuth client secret used to exchange authorization codes for tokens.',
            required: true
          }
        ];
      }

      return [];
    }

    function getAuthTypeDisplayLabel() {
      const mode = getSelectedAuthMode();
      const authFields = getCatalogAuthFields();
      if (authFields.length > 1 && mode?.type === 'api_key') {
        return 'API Credentials';
      }

      return getAuthModeDisplayLabel(mode);
    }

    function humanizeStatus(value) {
      const normalized = String(value || '').toLowerCase();
      if (!normalized) return 'Unknown';
      if (normalized === 'not_configured') return 'Not Configured';
      if (normalized === 'active') return 'Connected';
      if (normalized === 'completed') return 'Completed';
      if (normalized === 'failed') return 'Failed';
      if (normalized === 'queued') return 'Queued';
      if (normalized === 'running') return 'Running';
      if (normalized === 'processing') return 'Processing';
      return titleCase(normalized);
    }

    function truncateJson(value) {
      try {
        const text = JSON.stringify(value, null, 2);
        return text.length > 700 ? `${text.slice(0, 700)}\n...` : text;
      } catch (_error) {
        return String(value);
      }
    }

    function getBadgeHtml(label, variant) {
      return `<span class="badge ${variant}">${escapeHtml(label)}</span>`;
    }

    function showPageAlert(message, type) {
      const node = document.getElementById('pageAlert');
      if (!node) return;

      if (!message) {
        node.classList.add('hidden');
        node.textContent = '';
        node.className = 'hidden mb-6 rounded-2xl border px-4 py-3 text-sm';
        return;
      }

      const typeClass = type === 'error'
        ? 'border-red-200 bg-red-50 text-red-700'
        : type === 'success'
          ? 'border-green-200 bg-green-50 text-green-700'
          : 'border-blue-200 bg-blue-50 text-blue-700';

      node.className = `mb-6 rounded-2xl border px-4 py-3 text-sm ${typeClass}`;
      node.textContent = message;
    }

    function setLoading(isLoading) {
      document.getElementById('viewerLoading').classList.toggle('hidden', !isLoading);
      document.getElementById('viewerContent').classList.toggle('hidden', isLoading);
      if (!isLoading) {
        document.getElementById('viewerError').classList.add('hidden');
      }
    }

    function showViewerError(message) {
      document.getElementById('viewerLoading').classList.add('hidden');
      document.getElementById('viewerContent').classList.add('hidden');
      document.getElementById('viewerErrorMessage').textContent = message;
      document.getElementById('viewerError').classList.remove('hidden');
    }

    function applyPageIdentity() {
      document.title = `${state.connectorName} - LANA AI`;
      const lexApp = document.querySelector('lex-app');
      if (lexApp) {
        lexApp.setAttribute('page-title', state.connectorName);
      }

      const breadcrumb = document.getElementById('connectorBreadcrumb');
      if (breadcrumb) {
        breadcrumb.items = [
          { label: 'Data Connectors', href: 'data-connectors.html' },
          { label: state.connectorName }
        ];
      }
    }

    function connectorApi(path) {
      if (!state.sourceId) {
        throw new Error('Integration source ID is required');
      }
      return `/api/v1/generic-connectors/integration-sources/${state.sourceId}${path}`;
    }

    function normalizeFieldOption(option) {
      if (option == null) {
        return null;
      }

      if (typeof option !== 'object') {
        const value = String(option);
        return { value, label: value };
      }

      const value = option.value == null ? '' : String(option.value);
      if (!value) {
        return null;
      }

      return {
        value,
        label: String(option.label == null ? option.value : option.label)
      };
    }

    function getSelectableFieldOptions(field, value) {
      const normalized = [];
      const seen = new Set();
      const appendOption = (option) => {
        const normalizedOption = normalizeFieldOption(option);
        if (!normalizedOption || seen.has(normalizedOption.value)) {
          return;
        }
        seen.add(normalizedOption.value);
        normalized.push(normalizedOption);
      };

      const fieldOptions = Array.isArray(field.options) ? field.options : [];
      fieldOptions.forEach(appendOption);

      const dynamicOptions = Array.isArray(state.dynamicFieldOptions[field.name])
        ? state.dynamicFieldOptions[field.name]
        : [];
      dynamicOptions.forEach(appendOption);

      const selectedValues = Array.isArray(value)
        ? value
        : (typeof value === 'string' && value
          ? value.split(',').map((item) => item.trim()).filter(Boolean)
          : []);
      selectedValues.forEach((selectedValue) => appendOption({ value: selectedValue, label: selectedValue }));

      return normalized;
    }

    function getDynamicDiscoveryButtonLabel(field) {
      if (field.discovery_button_label) {
        return String(field.discovery_button_label);
      }

      const rawLabel = String(field.label || field.name || 'Options').trim();
      const lowerLabel = rawLabel.toLowerCase();
      const splitIndex = lowerLabel.indexOf(' to ');
      const shortened = splitIndex > -1 ? rawLabel.slice(0, splitIndex).trim() : rawLabel;
      return `Discover ${shortened || 'Options'}`;
    }

    async function resolveConnectorContext() {
      if (state.sourceId && state.connectorType && state.uiEntryPoint) {
        applyPageIdentity();
        return;
      }

      const result = await api.get('/api/v1/integrations/connectors');
      const connectors = Array.isArray(result.connectors) ? result.connectors : [];
      const match = connectors.find((connector) => {
        if (state.sourceId && connector.id === state.sourceId) {
          return true;
        }

        if (!state.sourceId && state.connectorId) {
          return connector.id === state.connectorId ||
            connector.connector_id === state.connectorId ||
            connector.connector_type === state.connectorId ||
            connector.type === state.connectorId;
        }

        if (!state.sourceId && !state.connectorId && state.connectorType) {
          return connector.connector_id === state.connectorType || connector.connector_type === state.connectorType;
        }

        return false;
      });

      if (match) {
        state.sourceId = state.sourceId || match.id || '';
        state.connectorType = state.connectorType || match.connector_id || match.connector_type || '';
        state.connectorName = match.name || state.connectorName;
        state.uiEntryPoint = state.uiEntryPoint || match.ui_entry_point || '';
      }

      applyPageIdentity();

      if (!state.sourceId) {
        state.iframeOnlyFallback = true;
        state.activeTab = 'docs';
      }
    }

    async function loadCatalog() {
      if (!state.connectorType) {
        state.catalog = null;
        return;
      }

      const result = await api.get(`/api/v1/integrations/connectors/catalog/${encodeURIComponent(state.connectorType)}`);
      state.catalog = result.connector || null;
    }

    function normalizeCatalogField(field, fallbackRequired) {
      if (!field || !field.name) {
        return null;
      }

      const normalizedType = field.type === 'multi_select' ? 'multiselect' : (field.type || 'text');

      return {
        ...field,
        type: normalizedType,
        required: field.required !== undefined ? Boolean(field.required) : Boolean(fallbackRequired)
      };
    }

    function getCatalogAuthFields() {
      return getAuthFieldsForMode(getSelectedAuthMode());
    }

    function getCatalogSettingsFields() {
      if (!state.catalog) {
        return [];
      }

      if (!state.catalog.configuration) {
        return [];
      }

      const required = Array.isArray(state.catalog.configuration.required_fields)
        ? state.catalog.configuration.required_fields.map((field) => normalizeCatalogField(field, true))
        : [];
      const optional = Array.isArray(state.catalog.configuration.optional_fields)
        ? state.catalog.configuration.optional_fields.map((field) => normalizeCatalogField(field, false))
        : [];

      const authFieldNames = new Set(
        getAvailableAuthModes()
          .flatMap((mode) => getAuthFieldsForMode(mode))
          .map((field) => field?.name)
          .filter(Boolean)
      );

      return [...required, ...optional]
        .filter(Boolean)
        .filter((field) => !authFieldNames.has(field.name));
    }

    function getCatalogFields() {
      const authFields = getCatalogAuthFields();
      const settingsFields = getCatalogSettingsFields();
      const deduped = new Map();

      [...authFields, ...settingsFields].forEach((field) => {
        if (!field?.name) return;
        if (!deduped.has(field.name)) {
          deduped.set(field.name, field);
          return;
        }

        deduped.set(field.name, {
          ...deduped.get(field.name),
          ...field
        });
      });

      return [...deduped.values()];
    }

    function getCatalogDynamicFields() {
      if (!state.catalog?.configuration?.dynamic_fields) {
        return [];
      }

      return Array.isArray(state.catalog.configuration.dynamic_fields)
        ? state.catalog.configuration.dynamic_fields
        : [];
    }

    function getWebhookConfig() {
      if (state.catalog?.webhooks && state.catalog.webhooks.enabled !== false) {
        return state.catalog.webhooks;
      }

      if (state.catalog?.features?.supports_webhooks) {
        return {
          enabled: true,
          description: `This connector advertises webhook support. LANA will use the generated endpoint URL for this connector instance.`,
          config_fields: []
        };
      }

      return null;
    }

    function hasWebhookTab() {
      // LANA is polling-first: inbound webhooks require a cloud relay we have
      // intentionally not built (to keep on-prem Mac Studios fully outbound
      // and customer data off our infra). The Webhooks tab stays hidden
      // unless WEBHOOKS_ENABLED is explicitly turned on.
      //
      // Webhook metadata remains in connector.json packages as reference
      // documentation for vendor contracts and for the day we re-enable the
      // tab with a relay in place.
      const webhooksEnabled = Boolean(
        (typeof window !== 'undefined' && window.LanaConfig && window.LanaConfig.WEBHOOKS_ENABLED === true)
      );
      if (!webhooksEnabled) return false;
      return Boolean(getWebhookConfig());
    }

    function getWebhookFields() {
      const webhookConfig = getWebhookConfig();
      if (!webhookConfig?.config_fields || !Array.isArray(webhookConfig.config_fields)) {
        return [];
      }

      return webhookConfig.config_fields
        .map((field) => normalizeCatalogField(field, false))
        .filter(Boolean);
    }

    function getResolvedClientApiBaseUrl() {
      if (window.URLUtils && typeof window.URLUtils.getPreferredBaseUrlSync === 'function') {
        return window.URLUtils.getPreferredBaseUrlSync();
      }

      return (typeof api !== 'undefined' && api.baseUrl)
        || (window.LanaConfig && window.LanaConfig.API_BASE_URL)
        || '';
    }

    function getGeneratedWebhookEndpointUrl() {
      if (!state.sourceId) {
        return '';
      }

      const apiBase = getResolvedClientApiBaseUrl();
      if (!apiBase) {
        return `/api/v1/generic-connectors/integration-sources/${encodeURIComponent(state.sourceId)}/webhook`;
      }

      return `${String(apiBase).replace(/\/+$/, '')}/api/v1/generic-connectors/integration-sources/${encodeURIComponent(state.sourceId)}/webhook`;
    }

    function getRenderableWebhookFields() {
      return getWebhookFields().filter((field) => field.name !== 'webhook_endpoint_url');
    }

    function isApiConnector() {
      return Boolean(state.catalog && state.catalog.api && state.catalog.api.base_url);
    }

    function getDocumentationLink() {
      return state.catalog?.documentation?.api_reference_url
        || state.catalog?.documentation?.docs_url
        || state.catalog?.metadata?.documentation_url
        || state.catalog?.metadata?.docs_url
        || state.catalog?.metadata?.website
        || '';
    }

    function getLastSuccessfulSync() {
      return state.summary && state.summary.last_sync ? state.summary.last_sync : null;
    }

    function getLastSyncAttempt() {
      return state.summary && state.summary.last_attempt ? state.summary.last_attempt : null;
    }

    function getLastSyncHeadline() {
      const lastSync = getLastSuccessfulSync();
      const lastAttempt = getLastSyncAttempt();

      if (lastSync) {
        return {
          status: lastSync.sync_status || 'completed',
          detail: formatDateTime(lastSync.completed_at || lastSync.started_at),
          relative: timeAgo(lastSync.completed_at || lastSync.started_at),
          helper: ''
        };
      }

      if (lastAttempt) {
        return {
          status: 'Never',
          detail: `Last attempt ${String(lastAttempt.sync_status || 'unknown')} on ${formatDateTime(lastAttempt.completed_at || lastAttempt.started_at)}`,
          relative: 'Never',
          helper: `Last attempt ${String(lastAttempt.sync_status || 'unknown')} ${timeAgo(lastAttempt.completed_at || lastAttempt.started_at)}`
        };
      }

      return {
        status: 'Never',
        detail: 'No sync recorded',
        relative: 'Never',
        helper: ''
      };
    }

    function isConnectorConfigured() {
      return Boolean(state.summary && state.summary.configured);
    }

    function isOAuthConnector() {
      return getSelectedAuthModeType() === 'oauth2';
    }

    function isOAuthAuthorized() {
      if (!isOAuthConnector()) {
        return true;
      }

      const authStatus = String(state.configResponse?.auth_status || '').toLowerCase();
      return authStatus === 'connected' || authStatus === 'active';
    }

    function isConnectorReady() {
      if (!isConnectorConfigured()) {
        return false;
      }

      if (isOAuthConnector()) {
        return isOAuthAuthorized();
      }

      return true;
    }

    function getConnectorSetupState() {
      if (!isConnectorConfigured()) {
        return {
          label: 'Needs Setup',
          badge: 'badge-yellow',
          message: 'Credentials or settings still need to be saved.'
        };
      }

      if (isOAuthConnector() && !isOAuthAuthorized()) {
        return {
          label: 'Authorization Required',
          badge: 'badge-yellow',
          message: 'Credentials are saved. Finish OAuth authorization before syncing.'
        };
      }

      return {
        label: 'Connected',
        badge: 'badge-green',
        message: 'Integration is configured in LANA.'
      };
    }

    function getGeneratedConnectSteps() {
      const fields = getCatalogFields().filter((field) => field.required);
      const fieldLabels = fields.map((field) => field.label || titleCase(field.name));
      const authType = getSelectedAuthModeType() || 'connector auth';
      const authTypeLabel = getAuthTypeDisplayLabel();

      if (authType === 'oauth2') {
        return [
          `Open the Configuration tab for ${state.connectorName}.`,
          fieldLabels.length
            ? `Enter the required OAuth client values: ${fieldLabels.join(', ')}.`
            : 'Enter the required OAuth client values for this connector.',
          'Save the connector configuration to store the OAuth client credentials inside LANA.',
          `Click Connect ${state.connectorName} to complete the OAuth authorization flow.`,
          'Return to the Run tab and trigger a manual sync after authorization succeeds.',
          'Review imported records in Output and assign the right records to matters.'
        ];
      }

      const steps = [
        `Open the Configuration tab for ${state.connectorName}.`,
        fieldLabels.length
          ? `Enter the required ${authTypeLabel} values: ${fieldLabels.join(', ')}.`
          : `Enter the required ${authTypeLabel} values for this connector.`,
        'Save the connector configuration to store credentials inside LANA.',
        'Run Test Connection to verify the credentials before syncing.',
        'Choose a sync frequency or keep the connector in manual mode.',
        'Open the Run tab and trigger a manual sync or ad-hoc request.',
        'Review imported records in Output and assign the right records to matters.'
      ];

      if (!isApiConnector()) {
        steps.splice(4, 2,
          'Choose a sync frequency or keep the connector in manual mode.',
          'Run a manual sync from the Run tab to pull data into LANA.'
        );
      }

      return steps;
    }

    function getConfigValue(name, fallback) {
      const config = state.configResponse && state.configResponse.config ? state.configResponse.config : {};
      return Object.prototype.hasOwnProperty.call(config, name) ? config[name] : fallback;
    }

    function normalizeAbsoluteUrl(value) {
      const raw = String(value || '').trim();
      if (!raw) return '';

      try {
        const parsed = new URL(raw);
        return `${parsed.origin}${parsed.pathname}`.replace(/\/$/, '');
      } catch (_error) {
        return '';
      }
    }

    function getEffectiveApiBase() {
      const explicitBase = normalizeAbsoluteUrl(
        getConfigValue('api_base_url', '')
          || getConfigValue('base_url', '')
          || getConfigValue('endpoint_url', '')
          || getConfigValue('s3_endpoint_url', '')
      );

      if (explicitBase) {
        return explicitBase;
      }

      const apiBaseBehavior = getUiBehavior().api_base || {};
      if (apiBaseBehavior.config_field) {
        const configValue = String(getConfigValue(apiBaseBehavior.config_field, '') || '').trim();
        if (configValue) {
          if (apiBaseBehavior.template) {
            return apiBaseBehavior.template.replace('{value}', configValue);
          }
          const normalizedConfigBase = normalizeAbsoluteUrl(configValue);
          return normalizedConfigBase || configValue;
        }
        return apiBaseBehavior.empty_label || 'Derived from configuration';
      }

      if (apiBaseBehavior.region_field && apiBaseBehavior.region_template) {
        const regionValue = String(getConfigValue(apiBaseBehavior.region_field, '') || '').trim();
        if (regionValue) {
          return apiBaseBehavior.region_template.replace('{value}', regionValue);
        }
        return apiBaseBehavior.empty_label || 'Derived from configuration';
      }

      return state.catalog?.api?.base_url || 'Not exposed';
    }

    function usesHookSignedAuth() {
      const template = String(state.catalog?.auth?.header_value_template || '').toLowerCase();
      return template.includes('computed by custom-api hook') || Boolean(getUiBehavior().auth?.signed_via_hooks);
    }

    function supportsSharedCredentialTest() {
      const authType = getSelectedAuthModeType();
      if (usesHookSignedAuth()) {
        return false;
      }

      return ['api_key', 'basic'].includes(authType);
    }

    function getRunTabModel() {
      const runBehavior = getUiBehavior().run || {};
      if (Object.keys(runBehavior).length) {
        return {
          supportsDateRange: Boolean(runBehavior.supports_date_range),
          supportsValidationHarness: Boolean(runBehavior.supports_validation_harness),
          syncTitle: String(runBehavior.sync_title || `Run Sync Against ${state.connectorName}`).replaceAll('{{connectorName}}', state.connectorName),
          syncDescription: runBehavior.sync_description || 'Trigger a manual sync for this connector.',
          quickRanges: Array.isArray(runBehavior.quick_ranges) ? runBehavior.quick_ranges : [],
          buttonLabel: runBehavior.button_label || 'Run Manual Sync',
          aboutTitle: runBehavior.about_title || 'About Manual Sync',
          aboutBody: runBehavior.about_body || 'Run a manual sync to validate the connector and inspect the resulting records.',
          runGuidance: Array.isArray(runBehavior.guidance) && runBehavior.guidance.length
            ? runBehavior.guidance
            : ['Run a manual sync to validate the connector end to end.']
        };
      }

      return {
        supportsDateRange: true,
        supportsValidationHarness: supportsSharedCredentialTest(),
        syncTitle: `Run Sync Against ${state.connectorName}`,
        syncDescription: 'Choose a date range for a targeted validation sync, or leave the range blank to let the connector use its normal sync behavior.',
        quickRanges: [7, 30, 90, 180, 365],
        buttonLabel: 'Run Manual Sync',
        aboutTitle: 'About Manual Sync',
        aboutBody: 'Use quick ranges for common validation windows or pick custom dates. If no range is selected, the connector falls back to its full sync behavior. Execution Logs shows the actual sync history, timing, and failures.',
        runGuidance: [
          supportsSharedCredentialTest()
            ? 'Use Test Connection first if credentials were changed in Configuration.'
            : 'Save credentials, then use a manual sync to validate the connector end to end.',
          'Manual sync is the safe place to validate a connector before enabling automation.',
          'After sync, use Output to search, assign, and shortlist edits instead of manually overwriting connector payloads.',
          'Use Execution Logs for server-side failures and status transitions.'
        ]
      };
    }

    function getUiBehaviorContext() {
      return {
        config: state.configResponse?.config || {},
        summary: state.summary || {},
        auth_status: state.configResponse?.auth_status || '',
        sync_status: state.configResponse?.sync_status || ''
      };
    }

    function getComputedUiValue(key) {
      const config = state.configResponse?.config || {};
      const lastSyncDisplay = getLastSyncHeadline();

      switch (String(key || '')) {
        case 'configured_bases':
          return Array.isArray(config.bases) ? config.bases.length : 0;
        case 'sync_frequency':
          return titleCase(config.sync_frequency || 'manual');
        case 'last_sync_relative':
          return lastSyncDisplay.relative;
        case 'auth_status':
          return humanizeStatus(state.configResponse?.auth_status || 'unknown');
        case 'sync_status':
          return humanizeStatus(state.configResponse?.sync_status || 'unknown');
        default:
          return undefined;
      }
    }

    function getBehaviorFieldValue(field) {
      if (!field) return '';

      let rawValue;
      if (field.computed) {
        rawValue = getComputedUiValue(field.computed);
      } else if (field.path) {
        rawValue = getValueByPath(getUiBehaviorContext(), field.path);
      }

      if (rawValue == null || rawValue === '') {
        return field.empty_label || 'Not set';
      }

      if (Array.isArray(rawValue)) {
        return rawValue.length ? rawValue.join(', ') : (field.empty_label || 'Not set');
      }

      if (typeof rawValue === 'boolean') {
        return rawValue ? 'Yes' : 'No';
      }

      if (typeof rawValue === 'number') {
        return formatNumber(rawValue);
      }

      return String(rawValue);
    }

    function renderBehaviorFieldRows(fields) {
      if (!Array.isArray(fields) || !fields.length) {
        return '';
      }

      return fields.map((field) => `
        <div class="flex items-center justify-between text-sm">
          <span class="text-gray-500">${escapeHtml(field.label || 'Value')}</span>
          <span class="font-medium text-gray-900">${escapeHtml(getBehaviorFieldValue(field))}</span>
        </div>
      `).join('');
    }

    function getArrayFieldValuesFromDom(fieldName, options) {
      const preserveEmpty = Boolean(options && options.preserveEmpty);
      const rows = document.querySelectorAll(`[data-array-field="${fieldName}"] [data-array-item]`);
      const items = Array.from(rows).map((row) => {
        const item = {};
        row.querySelectorAll('[data-item-field]').forEach((input) => {
          const key = input.getAttribute('data-item-field');
          if (!key) return;
          const rawValue = input.type === 'checkbox' ? Boolean(input.checked) : input.value;
          if (rawValue === '' || rawValue == null) return;
          item[key] = rawValue;
        });
        return item;
      });

      return preserveEmpty ? items : items.filter((item) => Object.keys(item).length > 0);
    }

    function getArrayFieldCurrentValue(fieldName) {
      const domValues = getArrayFieldValuesFromDom(fieldName, { preserveEmpty: true });
      if (domValues.length) {
        return domValues;
      }

      const current = getConfigValue(fieldName, []);
      return Array.isArray(current) ? current : [];
    }

    function addArrayFieldItem(fieldName) {
      const field = getCatalogDynamicFields().find((entry) => entry.name === fieldName);
      if (!field) return;
      const items = getArrayFieldCurrentValue(fieldName);
      items.push({});
      renderArrayField(field, items);
    }

    function removeArrayFieldItem(fieldName, index) {
      const field = getCatalogDynamicFields().find((entry) => entry.name === fieldName);
      if (!field) return;
      const items = getArrayFieldCurrentValue(fieldName);
      items.splice(index, 1);
      renderArrayField(field, items);
    }

    function renderArrayField(field, value) {
      const container = document.getElementById(`dynamic-field-${field.name}`);
      if (!container) return;

      const items = Array.isArray(value) && value.length ? value : [{}];

      container.innerHTML = `
        <div class="rounded-2xl border border-gray-200 bg-gray-50 p-5">
          <div class="flex items-start justify-between gap-4">
            <div>
              <div class="text-sm font-semibold text-gray-900">${escapeHtml(field.label || titleCase(field.name))}</div>
              <div class="mt-2 text-sm text-gray-500">${escapeHtml(field.description || '')}</div>
            </div>
            <div class="text-xs text-gray-500">${field.max_items ? `Up to ${field.max_items}` : ''}</div>
          </div>
          <div class="mt-5 space-y-4" data-array-field="${escapeHtml(field.name)}">

                <div class="mb-4 flex items-center justify-between gap-3">

                    <button type="button" onclick="removeArrayFieldItem('${escapeHtml(field.name)}', ${index})" class="rounded-lg border border-red-200 px-3 py-2 text-xs font-semibold text-red-600 hover:bg-red-50">

                    </button>
                  ` : ''}
                </div>
                <div class="grid gap-4 md:grid-cols-2">

                    <label class="block ${itemField.name === 'max_records' ? 'md:col-span-2' : ''}">
                      <div class="mb-2 text-sm font-medium text-gray-900">${escapeHtml(itemField.label || titleCase(itemField.name))}${itemField.required ? ' *' : ''}</div>
                      <input
                        type="text"
                        data-item-field="${escapeHtml(itemField.name)}"

                    </label>

              </div>
            `).join('')}
          </div>
          ${(!field.max_items || items.length < field.max_items) ? `
            <div class="mt-4">
              <button type="button" onclick="addArrayFieldItem('${escapeHtml(field.name)}')" class="rounded-xl border border-yellow-300 bg-yellow-50 px-4 py-2 text-sm font-semibold text-yellow-800 hover:bg-yellow-100">
                Add ${escapeHtml(field.item_label_prefix || 'Base')}
              </button>
            </div>
          ` : ''}
        </div>
      `;
    }

    function collectNamedFormDraft(form, draft, processed) {
      if (!form) {
        return;
      }

      Array.from(form.querySelectorAll('[name]')).forEach((element) => {
        const name = element.name;
        if (!name || processed.has(name)) {
          return;
        }
        processed.add(name);

        if (element.type === 'checkbox') {
          draft[name] = Boolean(element.checked);
          return;
        }

        if (element.multiple) {
          draft[name] = Array.from(element.selectedOptions || [])
            .map((option) => option.value)
            .filter(Boolean);
          return;
        }

        draft[name] = element.value;
      });
    }

    function captureConfigFormDraft() {
      const configForm = document.getElementById('configForm');
      const webhooksForm = document.getElementById('webhooksForm');
      if (!configForm && !webhooksForm) {
        return {};
      }

      const draft = {};
      const processed = new Set();
      collectNamedFormDraft(configForm, draft, processed);
      collectNamedFormDraft(webhooksForm, draft, processed);

      getCatalogDynamicFields().forEach((field) => {
        if (field.type === 'array') {
          draft[field.name] = getArrayFieldValuesFromDom(field.name, { preserveEmpty: true });
        }
      });

      const selector = document.getElementById('authModeSelect');
      if (selector && selector.value) {
        draft.auth_type = selector.value;
      }

      return draft;
    }

    function handleAuthModeChange() {
      const selector = document.getElementById('authModeSelect');
      if (!selector) return;
      state.formDraft = captureConfigFormDraft();
      state.authModeDraft = selector.value || '';
      renderConfiguration();
    }

    // Read-only rendering of a saved field value. Passwords are masked to the
    // last four characters if long enough; otherwise fully masked.
    function renderReadonlyField(field, value) {
      const label = escapeHtml(field.label || titleCase(field.name));
      const description = field.description ? `<div class="mt-1 text-xs text-gray-500">${escapeHtml(field.description)}</div>` : '';
      let display = '';
      const isPassword = field.type === 'password';
      const isBool = field.type === 'boolean';
      const isMulti = field.type === 'multiselect' || field.type === 'multi_select';

      if (value === null || typeof value === 'undefined' || value === '') {
        display = `<span class="text-gray-400">Not set</span>`;
      } else if (isPassword) {
        const raw = String(value);
        const tail = raw.length > 4 ? raw.slice(-4) : '';
        display = tail ? `<span class="connector-mono">•••••••• ${escapeHtml(tail)}</span>` : `<span class="connector-mono">••••••••</span>`;
      } else if (isBool) {
        display = value ? 'Yes' : 'No';
      } else if (isMulti || Array.isArray(value)) {
        const list = Array.isArray(value) ? value : String(value).split(',').map((s) => s.trim()).filter(Boolean);
        display = list.length
          ? list.map((v) => `<span class="mr-2 inline-flex rounded-full border border-gray-200 bg-gray-50 px-2 py-0.5 text-xs text-gray-700">${escapeHtml(String(v))}</span>`).join('')
          : `<span class="text-gray-400">None</span>`;
      } else {
        display = `<span class="break-all">${escapeHtml(String(value))}</span>`;
      }

      return `
        <div class="rounded-xl border border-gray-200 bg-gray-50 p-3">
          <div class="text-xs font-semibold uppercase tracking-wide text-gray-500">${label}</div>
          <div class="mt-1 text-sm text-gray-900">${display}</div>
          ${description}
        </div>
      `;
    }

    function enterEditConfigMode() {
      state.editingConfig = true;
      renderConfiguration();

    function cancelEditConfigMode() {
      state.editingConfig = false;
      state.formDraft = null;

    async function saveConfigurationAndExitEdit() {

    function renderDeleteConfigModal() {
      const existing = document.getElementById('deleteConfigModal');
      if (!state.deleteConfigModalOpen) {
        if (existing) existing.remove();
        return;
      }
      if (existing) return;

      const modal = document.createElement('div');
      modal.id = 'deleteConfigModal';
      modal.className = 'fixed inset-0 z-50 flex items-center justify-center bg-gray-900/60 p-4';
      modal.innerHTML = `
        <div class="w-full max-w-md rounded-2xl bg-white p-6 shadow-xl">
          <div class="flex items-start gap-3">
            <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-red-100 text-red-600">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5">
                <path d="M12 9v4" />
                <path d="M12 17h.01" />
                <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z" />
              </svg>
            </div>
            <div class="flex-1">
              <h3 class="text-base font-semibold text-gray-900">Delete configuration?</h3>
              <p class="mt-2 text-sm text-gray-600">
                This will clear saved credentials and settings for <span class="font-semibold">${escapeHtml(state.connectorName || 'this connector')}</span>.
                Any running sync schedule will stop. You&rsquo;ll need to re-enter credentials and re-authorize to use this connector again.
                This action cannot be undone.
              </p>
            </div>
          </div>
          <div class="mt-6 flex flex-wrap justify-end gap-3">
            <button type="button" onclick="closeDeleteConfigModal()" class="rounded-xl border border-gray-300 px-4 py-2 text-sm font-semibold text-gray-700 hover:bg-gray-50">
              Cancel
            </button>
            <button type="button" id="confirmDeleteConfigBtn" onclick="confirmDeleteConfig()" class="rounded-xl bg-red-600 px-4 py-2 text-sm font-semibold text-white hover:bg-red-700">
              Delete Configuration
            </button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);

      // Dismiss on backdrop click (but not on card click).
      modal.addEventListener('click', function (event) {

    async function confirmDeleteConfig() {
      const button = document.getElementById('confirmDeleteConfigBtn');
      const originalLabel = button ? button.textContent : '';
      try {
        if (button) {
          button.disabled = true;
          button.textContent = 'Deleting...';
        }
        await disconnectConnector();
        state.editingConfig = false;
        closeDeleteConfigModal();
      } catch (error) {
        if (button) {
          button.disabled = false;
          button.textContent = originalLabel || 'Delete Configuration';
        }
        // disconnectConnector already surfaces the error via showPageAlert.
      }
    }

    function updateSyncSettingsVisibility() {
      const syncFrequency = document.getElementById('syncFrequency');
      const scheduledGroup = document.getElementById('scheduledTimeGroup');
      if (!syncFrequency || !scheduledGroup) return;
      const visible = ['daily', 'weekly'].includes(syncFrequency.value);
      scheduledGroup.classList.toggle('hidden', !visible);
      refreshSyncSettingsButtonState();
    }

    function refreshSyncSettingsButtonState() {
      const button = document.getElementById('saveSyncSettingsBtn');
      const hint = document.getElementById('saveSyncSettingsHint');
      if (!button) return;
      const ready = isConnectorReady();
      button.disabled = !ready;
      if (hint) {
        if (ready) {
          hint.textContent = '';
        } else if (!isConnectorConfigured()) {
          hint.textContent = 'Save credentials first to update sync settings.';
        } else if (isOAuthConnector() && !isOAuthAuthorized()) {
          hint.textContent = 'Complete OAuth authorization first.';
        } else {
          hint.textContent = '';
        }
      }
    }

    async function saveSyncSettings() {
      if (!state.sourceId) return;
      if (!isConnectorReady()) {
        showPageAlert('Save credentials and complete setup before updating sync settings.', 'error');
        return;
      }
      const button = document.getElementById('saveSyncSettingsBtn');
      const syncFrequency = document.getElementById('syncFrequency');
      const scheduledSyncTime = document.getElementById('scheduledSyncTime');
      if (!syncFrequency) return;

      const originalLabel = button ? button.textContent : '';
      try {
        if (button) {
          button.disabled = true;
          button.textContent = 'Saving...';
        }
        const payload = { sync_frequency: syncFrequency.value };
        if (syncFrequency.value === 'daily' || syncFrequency.value === 'weekly') {
          payload.scheduled_sync_time = (scheduledSyncTime && scheduledSyncTime.value) || '08:00:00';
        }
        await api.patch(connectorApi('/sync-settings'), payload);
        await refreshBaseData(false);
        showPageAlert('Sync settings updated.', 'success');
      } catch (error) {
        console.error('[Connector Viewer] Failed to save sync settings', error);
        showPageAlert(error.message || 'Failed to update sync settings.', 'error');
      } finally {
        if (button) {
          button.textContent = originalLabel || 'Update Sync Settings';
          refreshSyncSettingsButtonState();
        }
      }
    }

    function buildDocumentationModel() {
      const documentation = state.catalog && state.catalog.documentation ? state.catalog.documentation : {};
      const metadata = state.catalog && state.catalog.metadata ? state.catalog.metadata : {};
      const entities = (state.summary && state.summary.stats && state.summary.stats.entities) || {};
      const entityEntries = Object.entries(entities);
      const primaryDescription = documentation.description
        || metadata.description
        || state.catalog?.description
        || `${state.connectorName} is connected to LANA through the shared generic connector framework.`;

      const overview = Array.isArray(documentation.overview) && documentation.overview.length
        ? documentation.overview
        : [primaryDescription];

      const keyFeatures = Array.isArray(documentation.key_features) && documentation.key_features.length
        ? documentation.key_features
        : [
            `Shared LANA configuration and debugging for ${state.connectorName}`,
            'Unified sync controls, logs, and data preview',
            `Auth type: ${getAuthTypeDisplayLabel()}`,
            entityEntries.length
              ? `Tracks ${entityEntries.length} connector data type${entityEntries.length === 1 ? '' : 's'}`
              : 'Connector data appears here after the first successful sync'
          ];

      const dataTypes = Array.isArray(documentation.data_types) && documentation.data_types.length
        ? documentation.data_types
        : (entityEntries.length
          ? entityEntries.map(([entityType]) => ({
              name: titleCase(entityType),
              description: `${titleCase(entityType)} records synced into connector data.`
            }))
          : (state.catalog?.sync?.entity_type
            ? [{ name: titleCase(state.catalog.sync.entity_type), description: `${titleCase(state.catalog.sync.entity_type)} records synced into connector data.` }]
            : []));

      const gettingStarted = Array.isArray(documentation.getting_started) && documentation.getting_started.length
        ? documentation.getting_started
        : [
            'Confirm the connector is configured in the Configuration section below.',
            'Save credentials or connector settings if they are not already present.',
            'Run a sync from the Overview tab to pull data into LANA.',
            'Review imported records in the Data tab and failures in the Logs tab.'
          ];

      const requiredFiles = Array.isArray(documentation.required_files) ? documentation.required_files : [];
      const troubleshooting = Array.isArray(documentation.troubleshooting) && documentation.troubleshooting.length
        ? documentation.troubleshooting
        : [
            { title: 'Not Configured', detail: 'Open the Configuration tab and save the required connector credentials or settings.' },
            { title: 'Sync Failed', detail: isOAuthConnector() ? 'Check the Logs tab for the latest sync error and confirm the connector is fully authorized.' : 'Check the Logs tab for the latest sync error and verify the connection with Test Connection.' },
            { title: 'No Data Appears', detail: 'Run a sync, then refresh the Data tab to confirm records were written into connector_data.' }
          ];
      const support = documentation.support || `Need help with the ${state.connectorName} integration? Contact your LANA administrator or support team.`;
      const connectSteps = Array.isArray(documentation.connect_steps) && documentation.connect_steps.length
        ? documentation.connect_steps
        : getGeneratedConnectSteps();

      return {
        title: documentation.title || `${state.connectorName} Integration`,
        overview,
        keyFeatures,
        dataTypes,
        gettingStarted,
        connectSteps,
        requiredFiles,
        troubleshooting,
        support,
        docsUrl: getDocumentationLink()
      };
    }

    /**
     * Render the Documentation tab entirely from connector.json.
     *
     * Preferred structure (authored per-connector):
     *
     *   documentation.setup_guide = {
     *     intro: "string — what this guide helps the user accomplish",
     *     audience_note: "string — optional line written for non-technical readers",
     *     prerequisites: ["string", ...],
     *     steps: [
     *       {
     *         title: "Step title",
     *         body: "string or [string]",
     *         instructions: ["explicit line-by-line sub-steps"],
     *         tip: "optional helpful note",
     *         warning: "optional hard warning",
     *         code: { label: "what this value is", value: "literal text to copy" },
     *         external_link: { label: "Where to go", url: "https://..." }
     *       },
     *       ...
     *     ],
     *     troubleshooting: [{ title, detail }],
     *     support: "string"
     *   }
     *
     * Falls back to the legacy `documentation.connect_steps` list + the
     * existing `troubleshooting` / `getting_started` fields when no
     * setup_guide is authored, so connectors not yet rewritten still render.
     */
    function renderDocumentationGuide() {
      const node = document.getElementById('generatedDocsGuide');
      if (!node) return;
      const docsUrl = getDocumentationLink();
      const catalog = state.catalog || {};
      const documentation = catalog.documentation || {};
      const guide = documentation.setup_guide || null;

      const title = documentation.title || `${state.connectorName || 'Connector'} Setup Guide`;
      const description = documentation.description || '';

      // Normalize to the rich structure. Legacy packages emit only
      // connect_steps + getting_started — we'll render those as a bare list.
      const intro = guide?.intro || description || '';
      const audienceNote = guide?.audience_note || 'Follow each step in order. You don\'t need to be technical — every click and field is spelled out below.';
      const prerequisites = Array.isArray(guide?.prerequisites) ? guide.prerequisites : [];
      const steps = Array.isArray(guide?.steps) ? guide.steps : normalizeLegacyConnectSteps(documentation.connect_steps);
      const troubleshooting = Array.isArray(guide?.troubleshooting)
        ? guide.troubleshooting
        : (Array.isArray(documentation.troubleshooting) ? documentation.troubleshooting : []);
      const support = guide?.support || documentation.support || '';
      const gettingStarted = Array.isArray(documentation.getting_started) ? documentation.getting_started : [];

      const headerHtml = `
        <div class="flex flex-wrap items-start justify-between gap-4">
          <div>
            <div class="connector-label">Setup Guide</div>
            <h3 class="mt-2 text-2xl font-semibold text-gray-900">${escapeHtml(title)}</h3>
            ${intro ? `<p class="mt-3 max-w-3xl text-sm text-gray-600">${escapeHtml(intro)}</p>` : ''}
            ${audienceNote ? `<p class="mt-2 max-w-3xl text-xs text-gray-500">${escapeHtml(audienceNote)}</p>` : ''}
          </div>
          ${docsUrl ? `
            <a href="${escapeHtml(docsUrl)}" target="_blank" rel="noreferrer" class="rounded-xl border border-blue-300 bg-white px-4 py-2 text-sm font-semibold text-blue-700 hover:bg-blue-50">
              Vendor API Docs
            </a>
          ` : ''}
        </div>
      `;

      const prereqHtml = prerequisites.length ? `
        <div class="mt-8 rounded-xl border border-blue-200 bg-blue-50 p-5">
          <div class="text-sm font-semibold text-blue-900">Before you start</div>
          <ul class="mt-3 list-disc space-y-2 pl-5 text-sm text-blue-900">
            ${prerequisites.map((p) => `<li>${escapeHtml(p)}</li>`).join('')}
          </ul>
        </div>
      ` : '';

      const stepsHtml = steps.length ? `
        <ol class="mt-8 space-y-6">
          ${steps.map((step, index) => renderDocStep(step, index + 1)).join('')}
        </ol>
      ` : `
        <div class="mt-8 rounded-xl border border-dashed border-gray-300 p-6 text-sm text-gray-500">
          No step-by-step guide has been authored for this connector yet.
          Vendor-provided documentation is available${docsUrl ? ` <a class="text-blue-700 underline" href="${escapeHtml(docsUrl)}" target="_blank" rel="noreferrer">here</a>` : ''}.
        </div>
      `;

      const gettingStartedHtml = gettingStarted.length ? `
        <div class="mt-10">
          <h4 class="text-base font-semibold text-gray-900">After you\'re connected</h4>
          <ul class="mt-3 list-disc space-y-2 pl-5 text-sm text-gray-700">
            ${gettingStarted.map((line) => `<li>${escapeHtml(line)}</li>`).join('')}
          </ul>
        </div>
      ` : '';

      const troubleshootingHtml = troubleshooting.length ? `
        <div class="mt-10">
          <h4 class="text-base font-semibold text-gray-900">Troubleshooting</h4>
          <div class="mt-3 space-y-3">
            ${troubleshooting.map((entry) => `
              <div class="rounded-xl border border-gray-200 p-4">
                <div class="text-sm font-semibold text-gray-900">${escapeHtml(entry.title || 'Issue')}</div>
                ${entry.detail ? `<div class="mt-2 text-sm text-gray-600">${escapeHtml(entry.detail)}</div>` : ''}
              </div>
            `).join('')}
          </div>
        </div>
      ` : '';

      const supportHtml = support ? `
        <div class="mt-10 rounded-xl border border-gray-200 bg-gray-50 p-5 text-sm text-gray-700">
          <span class="font-semibold text-gray-900">Need more help?</span>
          <span class="ml-1">${escapeHtml(support)}</span>
        </div>
      ` : '';

      node.innerHTML = headerHtml + prereqHtml + stepsHtml + gettingStartedHtml + troubleshootingHtml + supportHtml;
    }

    function renderDocStep(step, number) {
      if (!step) return '';
      const title = step.title || `Step ${number}`;
      const bodyLines = Array.isArray(step.body) ? step.body : (step.body ? [step.body] : []);
      const instructions = Array.isArray(step.instructions) ? step.instructions : [];
      const tip = step.tip || '';
      const warning = step.warning || '';
      const link = step.external_link || null;
      const code = step.code || null;
      const image = step.image || '';

      return `
        <li class="rounded-2xl border border-gray-200 bg-white p-5">
          <div class="flex items-start gap-4">
            <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-blue-100 text-sm font-semibold text-blue-700">${number}</div>
            <div class="min-w-0 flex-1">
              <h4 class="text-base font-semibold text-gray-900">${escapeHtml(title)}</h4>
              ${bodyLines.length ? bodyLines.map((line) => `<p class="mt-2 text-sm text-gray-700">${escapeHtml(line)}</p>`).join('') : ''}

              ${instructions.length ? `
                <ol class="mt-3 list-decimal space-y-1.5 pl-5 text-sm text-gray-700">
                  ${instructions.map((line) => `<li>${escapeHtml(line)}</li>`).join('')}
                </ol>
              ` : ''}

              ${link ? `
                <a href="${escapeHtml(link.url)}" target="_blank" rel="noreferrer" class="mt-3 inline-flex items-center gap-1 text-sm font-semibold text-blue-700 hover:text-blue-800">
                  ${escapeHtml(link.label || 'Open link')}
                  <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                </a>
              ` : ''}

              ${code ? `
                <div class="mt-3 rounded-lg border border-gray-200 bg-gray-50 p-3">
                  ${code.label ? `<div class="text-xs font-semibold uppercase tracking-wide text-gray-500">${escapeHtml(code.label)}</div>` : ''}
                  <div class="mt-1 flex items-center gap-2">
                    <code class="connector-mono break-all text-xs text-gray-900">${escapeHtml(code.value || '')}</code>
                    <button type="button" class="shrink-0 rounded-md border border-gray-300 px-2 py-1 text-xs font-semibold text-gray-700 hover:bg-white" onclick="copyTextToClipboard('${escapeJsString(code.value || '')}')">Copy</button>
                  </div>

    function normalizeLegacyConnectSteps(connectSteps) {
      if (!Array.isArray(connectSteps) || !connectSteps.length) return [];
      return connectSteps.map((line, idx) => ({

        body: line
      }));
    }

    function escapeJsString(value) {
      return String(value || '').split('\\').join('\\\\').split("'").join("\\'").split('\n').join('\\n');
    }

    function copyTextToClipboard(value) {
      if (!value) return;
      const str = String(value);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(str).then(
          () => showPageAlert('Copied to clipboard.', 'success'),
          () => showPageAlert('Clipboard copy blocked by browser.', 'error')
        );
        return;
      }
      const textarea = document.createElement('textarea');
      textarea.value = str;
      textarea.style.position = 'fixed';
      textarea.style.top = '-1000px';
      document.body.appendChild(textarea);
      textarea.select();
      try { document.execCommand('copy'); showPageAlert('Copied to clipboard.', 'success'); }
      catch (_e) { showPageAlert('Clipboard copy blocked by browser.', 'error'); }
      document.body.removeChild(textarea);
    }

    function renderDataRuleBuilder() {
      const container = document.getElementById('dataRulesContainer');
      if (!container) return;

      if (!state.dataRules.length) {
        container.innerHTML = `
          <div class="rounded-xl border border-dashed border-gray-300 p-4 text-sm text-gray-500">
            No rules yet. Add rules for field-level matching such as email contains, status equals, or source field exists.
          </div>
        `;
        return;
      }

      container.innerHTML = state.dataRules.map((rule, index) => `
        <div class="data-rule-row grid gap-3 rounded-xl border border-gray-200 bg-gray-50 p-4 lg:grid-cols-[minmax(0,1.3fr)_180px_minmax(0,1fr)_56px]" data-index="${index}">
          <input data-role="field" type="text" value="${escapeHtml(rule.field || '')}" placeholder="Field key or external_id" class="w-full rounded-xl border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200">
          <select data-role="operator" class="w-full rounded-xl border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200">
            ${['contains', 'not_contains', 'equals', 'not_equals', 'starts_with', 'ends_with', 'exists', 'not_exists'].map((operator) => `
              <option value="${operator}" ${rule.operator === operator ? 'selected' : ''}>${operator}</option>
            `).join('')}
          </select>
          <input data-role="value" type="text" value="${escapeHtml(rule.value || '')}" placeholder="Filter value" class="w-full rounded-xl border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200">
          <button type="button" onclick="removeDataRule(${index})" class="rounded-xl border border-red-200 px-3 py-2 text-sm font-semibold text-red-600 hover:bg-red-50">X</button>
        </div>
      `).join('');
    }

    function syncDataRulesFromDom() {
      const rows = document.querySelectorAll('.data-rule-row');
      state.dataRules = Array.from(rows).map((row) => ({
        field: row.querySelector('[data-role="field"]').value.trim(),
        operator: row.querySelector('[data-role="operator"]').value,
        value: row.querySelector('[data-role="value"]').value
      })).filter((rule) => rule.field);
    }

    function addDataRule() {
      syncDataRulesFromDom();
      state.dataRules.push({ field: '', operator: 'contains', value: '' });
      renderDataRuleBuilder();
    }

    function removeDataRule(index) {
      syncDataRulesFromDom();
      state.dataRules.splice(index, 1);
      renderDataRuleBuilder();
    }

    function getCurrentDataFilters() {
      syncDataRulesFromDom();
      return {
        q: document.getElementById('dataSearchInput')?.value.trim() || '',
        entity_type: document.getElementById('entityTypeFilter')?.value || '',
        sort_by: document.getElementById('dataSortBy')?.value || 'synced_at',
        sort_dir: document.getElementById('dataSortDir')?.value || 'desc',
        filters: state.dataRules
      };
    }

    function renderField(field, value) {
      const safeName = escapeHtml(field.name);
      const safeLabel = escapeHtml(field.label || field.name);
      const safeHelp = field.help_text ? `<p class="mt-2 text-xs text-gray-500">${escapeHtml(field.help_text)}</p>` : '';
      const requiredMark = field.required ? '<span class="text-red-500">*</span>' : '';
      const fieldOptions = getSelectableFieldOptions(field, value);

      if (field.type === 'boolean') {
        return `
          <label class="block rounded-2xl border border-gray-200 p-4">
            <div class="flex items-center justify-between gap-4">
              <div>
                <div class="text-sm font-medium text-gray-900">${safeLabel} ${requiredMark}</div>
                ${safeHelp}
              </div>
              <input type="checkbox" name="${safeName}" ${value ? 'checked' : ''} class="h-5 w-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
            </div>
          </label>
        `;
      }

      if (field.type === 'select') {
        const currentValue = value == null ? '' : String(value);
        return `
          <label class="block">
            <div class="mb-2 text-sm font-medium text-gray-900">${safeLabel} ${requiredMark}</div>
            <select
              name="${safeName}"
              data-required="${field.required ? 'true' : 'false'}"
              ${field.required ? 'required' : ''}
              class="w-full rounded-xl border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
            >
              ${fieldOptions.map((option) => {
                const optionValue = String(option?.value ?? '');
                const optionLabel = String(option?.label ?? optionValue);
                return `<option value="${escapeHtml(optionValue)}" ${optionValue === currentValue ? 'selected' : ''}>${escapeHtml(optionLabel)}</option>`;
              }).join('')}
            </select>
            ${safeHelp}
          </label>
        `;
      }

      if (field.type === 'multiselect') {
        const selectedValues = Array.isArray(value)
          ? value.map((item) => String(item))
          : (typeof value === 'string' && value
            ? value.split(',').map((item) => item.trim()).filter(Boolean)
            : []);
        return `
          <label class="block">
            <div class="mb-2 text-sm font-medium text-gray-900">${safeLabel} ${requiredMark}</div>
            <select
              name="${safeName}"
              multiple
              data-required="${field.required ? 'true' : 'false'}"
              ${field.required ? 'required' : ''}
              class="min-h-[140px] w-full rounded-xl border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
            >
              ${fieldOptions.map((option) => {
                const optionValue = String(option?.value ?? '');
                const optionLabel = String(option?.label ?? optionValue);
                return `<option value="${escapeHtml(optionValue)}" ${selectedValues.includes(optionValue) ? 'selected' : ''}>${escapeHtml(optionLabel)}</option>`;
              }).join('')}
            </select>
            ${safeHelp}
          </label>
        `;
      }

      if (field.type === 'multiselect_dynamic') {
        const selectedValues = Array.isArray(value)
          ? value.map((item) => String(item))
          : (typeof value === 'string' && value
            ? value.split(',').map((item) => item.trim()).filter(Boolean)
            : []);
        const isLoading = Boolean(state.dynamicFieldLoading[field.name]);
        const errorMessage = state.dynamicFieldErrors[field.name];
        const buttonLabel = getDynamicDiscoveryButtonLabel(field);
        return `
          <label class="block">
            <div class="mb-2 flex flex-wrap items-center justify-between gap-3">
              <div class="text-sm font-medium text-gray-900">${safeLabel} ${requiredMark}</div>
              <button
                type="button"
                onclick="discoverDynamicFieldOptions('${escapeHtml(field.name)}')"
                class="rounded-lg border border-blue-200 px-3 py-1.5 text-xs font-semibold text-blue-700 hover:bg-blue-50 ${isLoading ? 'opacity-60 cursor-wait' : ''}"
                ${isLoading ? 'disabled aria-disabled="true"' : ''}
              >
                ${escapeHtml(isLoading ? 'Loading…' : buttonLabel)}
              </button>
            </div>
            <select
              name="${safeName}"
              multiple
              data-required="${field.required ? 'true' : 'false'}"
              ${field.required ? 'required' : ''}
              class="min-h-[140px] w-full rounded-xl border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
            >
              ${fieldOptions.map((option) => {
                const optionValue = String(option?.value ?? '');
                const optionLabel = String(option?.label ?? optionValue);
                return `<option value="${escapeHtml(optionValue)}" ${selectedValues.includes(optionValue) ? 'selected' : ''}>${escapeHtml(optionLabel)}</option>`;
              }).join('')}
            </select>
            ${safeHelp}
            <p class="mt-2 text-xs text-gray-500">${fieldOptions.length ? `${fieldOptions.length} option${fieldOptions.length === 1 ? '' : 's'} available.` : 'No options loaded yet. Discover options after entering the required configuration above.'}</p>
            ${errorMessage ? `<p class="mt-2 text-xs text-red-600">${escapeHtml(errorMessage)}</p>` : ''}
          </label>
        `;
      }

      const inputType = field.type === 'password'
        ? 'password'
        : field.type === 'number'
          ? 'number'
          : field.type === 'date'
            ? 'date'
          : 'text';
      const inputValue = value == null ? '' : String(value);
