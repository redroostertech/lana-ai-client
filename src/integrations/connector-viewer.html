    function serializeConfigForm() {
      const forms = [document.getElementById('configForm'), document.getElementById('webhooksForm')].filter(Boolean);
      const fields = [...getCatalogFields(), ...getWebhookFields()];
      const dynamicFields = getCatalogDynamicFields();
      const payload = {};
      const authModes = getAvailableAuthModes();

      if (authModes.length > 1) {
        payload.auth_type = getSelectedAuthModeType();
      }

      fields.forEach((field) => {
        const element = forms
          .map((form) => form.elements[field.name])
          .find(Boolean);
        if (!element) return;

        if (field.type === 'boolean') {
          payload[field.name] = Boolean(element.checked);
          return;
        }

        const rawValue = element.value;
        if (rawValue === '' && !field.required) {
          return;
        }

        if (field.type === 'number') {
          payload[field.name] = rawValue === '' ? null : Number(rawValue);
          return;
        }

        if (field.type === 'multiselect' || field.type === 'multiselect_dynamic') {
          const selectedValues = Array.from(element.selectedOptions || [])
            .map((option) => option.value)
            .filter(Boolean);
          if (!selectedValues.length && !field.required) {
            return;
          }
          payload[field.name] = selectedValues;
          return;
        }

        payload[field.name] = rawValue;
      });

      dynamicFields.forEach((field) => {
        if (field.type === 'array') {
          payload[field.name] = getArrayFieldValuesFromDom(field.name);
        }
      });

      return payload;
    }

    async function discoverDynamicFieldOptions(fieldName) {
      if (!state.sourceId) return;

      const field = getCatalogFields().find((entry) => entry?.name === fieldName && entry?.type === 'multiselect_dynamic');
      if (!field || !field.dynamic_source) {
        return;
      }

      try {
        state.formDraft = captureConfigFormDraft();
        state.dynamicFieldLoading[fieldName] = true;
        delete state.dynamicFieldErrors[fieldName];
        renderConfiguration();

        const payload = serializeConfigForm();
        const result = await api.post(connectorApi(`/discovery/${encodeURIComponent(field.dynamic_source)}`), {
          config: payload
        });

        state.dynamicFieldOptions[fieldName] = Array.isArray(result?.options) ? result.options : [];
        delete state.dynamicFieldErrors[fieldName];
        showPageAlert(`${field.label || titleCase(field.name)} options loaded.`, 'success');
      } catch (error) {
        console.error('[Connector Viewer] Failed to discover dynamic field options', error);
        state.dynamicFieldErrors[fieldName] = error.message || 'Failed to load options.';
        showPageAlert(error.message || 'Failed to load connector options.', 'error');
      } finally {
        state.dynamicFieldLoading[fieldName] = false;
        renderConfiguration();
      }
    }

    async function saveConfiguration(options = {}) {
      if (!state.sourceId) return;

      try {
        const forms = [document.getElementById('configForm'), document.getElementById('webhooksForm')].filter(Boolean);
        const invalidForm = forms.find((form) => typeof form.reportValidity === 'function' && !form.reportValidity());
        if (invalidForm) {
          throw new Error('Fill in the required configuration fields before saving.');
        }

        if (!options.silentLoading) {
          showPageAlert('Saving configuration...', 'info');
        }
        const configPayload = serializeConfigForm();
        const syncFrequency = document.getElementById('syncFrequency').value;
        const scheduledSyncTime = document.getElementById('scheduledSyncTime').value;

        await api.patch(connectorApi('/config'), configPayload);
        await api.patch(connectorApi('/sync-settings'), {
          sync_frequency: syncFrequency,
          ...(syncFrequency === 'daily' || syncFrequency === 'weekly'
            ? { scheduled_sync_time: scheduledSyncTime || '08:00:00' }
            : {})
        });

        state.formDraft = null;
        state.authModeDraft = '';
        await refreshBaseData(false);
        if (!options.silentSuccess) {
          showPageAlert('Configuration saved.', 'success');
        }
        return true;
      } catch (error) {
        console.error('[Connector Viewer] Failed to save configuration', error);
        showPageAlert(error.message || 'Failed to save configuration.', 'error');
        throw error;
      }
    }

    async function connectOAuthConnector() {
      if (!state.sourceId || !isOAuthConnector()) return;

      try {
        showPageAlert(`Saving ${state.connectorName} configuration before redirecting to OAuth...`, 'info');
        await saveConfiguration({ silentLoading: true, silentSuccess: true });

        const authUrl = await fetchAuthorizationUrl({ force: true });
        window.location.href = authUrl;
      } catch (error) {
        console.error('[Connector Viewer] Failed to start OAuth flow', error);
        showPageAlert(error.message || 'Failed to start OAuth flow.', 'error');

    function buildAuthorizationReturnUrl() {
      const returnUrl = new URL(window.location.href);
      returnUrl.searchParams.set('tab', 'configuration');
      returnUrl.searchParams.delete('oauth_success');
      returnUrl.searchParams.delete('oauth_error');
      returnUrl.searchParams.delete('connector_id');
      return returnUrl.toString();
    }

    async function fetchAuthorizationUrl({ force = false } = {}) {
      if (!state.sourceId || !isOAuthConnector()) {
        throw new Error('OAuth is not configured for this connector.');
      }

      if (!force && state.pendingAuthorizationUrl) {
        return state.pendingAuthorizationUrl;
      }

      state.pendingAuthorizationUrlLoading = true;
      state.pendingAuthorizationUrlError = null;
      updatePendingAuthorizationUrlDisplay('Generating link...');

      try {
        const result = await api.get(
          `/api/v1/integrations/connectors/${encodeURIComponent(state.sourceId)}/authorize?return_to=${encodeURIComponent(buildAuthorizationReturnUrl())}`
        );

        if (!result?.authorization_url) {
          throw new Error('OAuth authorization URL was not returned by the server.');
        }

        state.pendingAuthorizationUrl = result.authorization_url;
        updatePendingAuthorizationUrlDisplay(result.authorization_url);
        return result.authorization_url;
      } catch (error) {
        const message = error?.message || 'Failed to generate authorization link.';
        state.pendingAuthorizationUrl = null;
        state.pendingAuthorizationUrlError = message;
        updatePendingAuthorizationUrlDisplay(message);
        throw error;
      } finally {
        state.pendingAuthorizationUrlLoading = false;
      }
    }

    function updatePendingAuthorizationUrlDisplay(text) {
      const el = document.getElementById('pendingAuthorizationUrlValue');
      if (el) el.textContent = text;
    }

    async function ensurePendingAuthorizationUrl() {
      if (!isOAuthConnector() || isOAuthAuthorized() || !state.sourceId) return;
      if (state.pendingAuthorizationUrl || state.pendingAuthorizationUrlLoading) return;
      try {
        await fetchAuthorizationUrl();
      } catch (error) {
        console.error('[Connector Viewer] Failed to generate authorization link', error);
      }
    }

    async function copyAuthorizationUrl() {
      try {
        const url = state.pendingAuthorizationUrl || await fetchAuthorizationUrl();
        await navigator.clipboard.writeText(url);
        showPageAlert('Authorization link copied to clipboard.', 'success');
      } catch (error) {
        console.error('[Connector Viewer] Failed to copy authorization link', error);
        showPageAlert(error.message || 'Failed to copy authorization link.', 'error');
      }
    }

    async function openAuthorizationUrl() {
      try {
        const url = state.pendingAuthorizationUrl || await fetchAuthorizationUrl();
        window.open(url, '_blank', 'noopener');
      } catch (error) {
        console.error('[Connector Viewer] Failed to open authorization link', error);
        showPageAlert(error.message || 'Failed to open authorization link.', 'error');
      }
    }

    async function refreshAuthorizationUrl() {
      try {
        await fetchAuthorizationUrl({ force: true });
        showPageAlert('Authorization link refreshed.', 'success');
      } catch (error) {
        console.error('[Connector Viewer] Failed to refresh authorization link', error);
        showPageAlert(error.message || 'Failed to refresh authorization link.', 'error');
      }
    }

    async function copyWebhookEndpointUrl() {
      const generatedUrl = getGeneratedWebhookEndpointUrl();
      if (!generatedUrl) {
        showPageAlert('Webhook URL is not available until this connector instance exists.', 'error');
        return;
      }

      try {
        await navigator.clipboard.writeText(generatedUrl);
        showPageAlert('Webhook URL copied to clipboard.', 'success');
      } catch (error) {
        console.error('[Connector Viewer] Failed to copy webhook URL', error);
        showPageAlert('Failed to copy webhook URL.', 'error');
      }
    }

    async function disconnectConnector() {
      if (!state.sourceId) return;

      try {
        showPageAlert('Clearing connector configuration...', 'info');
        await api.delete(connectorApi('/config'));
        state.selectedDataIds = [];
        state.selectedRecordId = '';
        state.selectedRecord = null;
        state.recordAnnotations = [];
        await Promise.all([refreshBaseData(false), refreshDataPreview(), refreshLogs()]);
        showPageAlert('Connector configuration cleared.', 'success');
      } catch (error) {
        console.error('[Connector Viewer] Failed to clear configuration', error);
        showPageAlert(error.message || 'Failed to clear configuration.', 'error');
      }
    }

    async function testConnection() {
      if (!state.sourceId) return;

      try {
        showPageAlert('Testing connector connection...', 'info');
        const payload = serializeConfigForm();
        const result = await api.post(connectorApi('/test-connection'), { config: payload });

        if (result.success) {
          showPageAlert(result.message || 'Connection test succeeded.', 'success');
        } else {
          showPageAlert(result.error || 'Connection test failed.', 'error');
        }
      } catch (error) {
        console.error('[Connector Viewer] Connection test failed', error);
        showPageAlert(error.message || 'Connection test failed.', 'error');
      }
    }

    function setDateRange(days) {
      const startNode = document.getElementById('runStartDate');
      const endNode = document.getElementById('runEndDate');
      if (!startNode || !endNode) return;

      const endDate = new Date();
      const startDate = new Date();
      startDate.setDate(startDate.getDate() - days);

      startNode.value = startDate.toISOString().slice(0, 10);
      endNode.value = endDate.toISOString().slice(0, 10);
    }

    async function runManualSync() {
      if (!state.sourceId) return;

      try {
        if (!isConnectorReady()) {
          throw new Error(getConnectorSetupState().message);
        }

        const startDate = document.getElementById('runStartDate')?.value || '';
        const endDate = document.getElementById('runEndDate')?.value || '';
        const payload = {};

        if (startDate) payload.startDate = `${startDate}T00:00:00.000Z`;
        if (endDate) payload.endDate = `${endDate}T23:59:59.999Z`;

        showPageAlert('Starting manual sync...', 'info');
        const result = await api.post(connectorApi('/sync'), payload);
        showPageAlert(result.message || 'Manual sync started.', 'success');
        await Promise.all([refreshBaseData(false), refreshLogs()]);
      } catch (error) {
        console.error('[Connector Viewer] Failed to run manual sync', error);
        showPageAlert(error.message || 'Failed to start manual sync.', 'error');
      }
    }

    async function executeCustomApiRequest() {
      if (!state.sourceId) return;

      try {
        if (!isConnectorReady()) {
          throw new Error(getConnectorSetupState().message);
        }

        const method = document.getElementById('customRequestMethod')?.value || 'GET';
        const path = document.getElementById('customRequestPath')?.value.trim() || '';
        const queryText = document.getElementById('customRequestQuery')?.value.trim() || '{}';
        const bodyText = document.getElementById('customRequestBody')?.value.trim() || '{}';
        const queryParams = queryText ? JSON.parse(queryText) : {};
        const body = bodyText ? JSON.parse(bodyText) : {};

        showPageAlert('Executing custom API request...', 'info');
        const result = await api.post(connectorApi('/custom-request'), {
          method,
          path,
          queryParams,
          body
        });

        document.getElementById('customRequestResponse').textContent = JSON.stringify(result, null, 2);
        showPageAlert('Custom request completed.', 'success');
      } catch (error) {
        console.error('[Connector Viewer] Custom API request failed', error);
        const responseNode = document.getElementById('customRequestResponse');
        if (responseNode) {
          responseNode.textContent = String(error.message || error);
        }
        showPageAlert(error.message || 'Custom request failed.', 'error');
      }
    }

    function clearCustomApiRequest() {
      const pathNode = document.getElementById('customRequestPath');
      const queryNode = document.getElementById('customRequestQuery');
      const bodyNode = document.getElementById('customRequestBody');
      const responseNode = document.getElementById('customRequestResponse');
      if (pathNode) pathNode.value = '';
      if (queryNode) queryNode.value = '{}';
      if (bodyNode) bodyNode.value = '{}';
      if (responseNode) responseNode.textContent = 'Run a request to see the response here.';
    }

    async function triggerSync() {
      return runManualSync();
    }

    function applyDataFilters() {
      refreshDataPreview().catch((error) => {
        console.error('[Connector Viewer] Failed to apply data filters', error);
        showPageAlert(error.message || 'Failed to apply filters.', 'error');
      });
    }

    function clearDataFilters() {
      state.dataRules = [];
      const searchNode = document.getElementById('dataSearchInput');
      const entityNode = document.getElementById('entityTypeFilter');
      const sortByNode = document.getElementById('dataSortBy');
      const sortDirNode = document.getElementById('dataSortDir');
      if (searchNode) searchNode.value = '';
      if (entityNode) entityNode.value = '';
      if (sortByNode) sortByNode.value = 'synced_at';
      if (sortDirNode) sortDirNode.value = 'desc';
      renderDataRuleBuilder();
      applyDataFilters();
    }

    function toggleDataSelection(recordId, isChecked) {
      if (isChecked) {
        if (!state.selectedDataIds.includes(recordId)) {
          state.selectedDataIds.push(recordId);
        }
      } else {
        state.selectedDataIds = state.selectedDataIds.filter((id) => id !== recordId);
      }
      renderDataPreview();
    }

    function toggleAllDataSelection(isChecked) {
      const rows = state.dataPreview && Array.isArray(state.dataPreview.data) ? state.dataPreview.data : [];
      state.selectedDataIds = isChecked ? rows.map((row) => row.id) : [];
      renderDataPreview();
    }

    async function openRecordDetail(recordId) {
      const rows = state.dataPreview && Array.isArray(state.dataPreview.data) ? state.dataPreview.data : [];
      state.selectedRecordId = recordId;
      state.selectedRecord = rows.find((row) => row.id === recordId) || null;

      try {
        const response = await api.get(`${connectorApi(`/data-records/${recordId}/annotations`)}?limit=25`);
        state.recordAnnotations = Array.isArray(response.annotations) ? response.annotations : [];
      } catch (error) {
        console.error('[Connector Viewer] Failed to load record annotations', error);
        state.recordAnnotations = [];
      }

      renderDataPreview();
    }

    async function submitRecordCorrection() {
      if (!state.selectedRecordId || !state.selectedRecord) return;

      try {
        const fieldKey = document.getElementById('recordCorrectionField')?.value.trim() || '';
        const proposedValue = document.getElementById('recordCorrectionValue')?.value || '';
        const notes = document.getElementById('recordCorrectionNotes')?.value.trim() || '';
        if (!fieldKey || !proposedValue) {
          throw new Error('Field key and proposed value are required');
        }

        await api.post(connectorApi(`/data-records/${state.selectedRecordId}/annotations`), {
          annotation_type: 'correction',
          field_key: fieldKey,
          value: {
            proposed_value: proposedValue,
            notes,
            original_value: state.selectedRecord.data ? state.selectedRecord.data[fieldKey] : null,
            status: 'shortlisted'
          }
        });

        showPageAlert('Correction shortlisted for review.', 'success');
        await Promise.all([openRecordDetail(state.selectedRecordId), refreshDataPreview()]);
      } catch (error) {
        console.error('[Connector Viewer] Failed to shortlist correction', error);
        showPageAlert(error.message || 'Failed to shortlist correction.', 'error');
      }
    }

    async function shortlistSingleRecord(recordId) {
      state.selectedDataIds = [recordId];
      renderDataPreview();
      await shortlistSelectedForEdit();
    }

    async function shortlistSelectedForEdit() {
      if (!state.sourceId) return;

      try {
        if (!state.selectedDataIds.length) {
          throw new Error('Select one or more rows first');
        }

        await api.post(connectorApi('/data/annotations/bulk'), {
          annotation_type: 'flag',
          value: {
            flag: 'shortlisted_for_edit',
            source: 'connector-viewer'
          },
          data_ids: state.selectedDataIds
        });

        showPageAlert('Selected rows were shortlisted for edit.', 'success');
        await refreshDataPreview();
      } catch (error) {
        console.error('[Connector Viewer] Failed to shortlist rows', error);
        showPageAlert(error.message || 'Failed to shortlist rows.', 'error');
      }
    }

    async function assignSelectedToMatter() {
      if (!state.sourceId) return;

      try {
        if (!state.selectedDataIds.length) {
          throw new Error('Select one or more rows first');
        }

        await api.post(connectorApi('/data/assign-matter'), {
          matter_id: document.getElementById('dataMatterSelect')?.value || null,
          data_ids: state.selectedDataIds
        });

        showPageAlert('Selected rows were assigned.', 'success');
        await Promise.all([refreshDataPreview(), refreshBaseData(false)]);
      } catch (error) {
        console.error('[Connector Viewer] Failed to assign selected rows', error);
        showPageAlert(error.message || 'Failed to assign selected rows.', 'error');
      }
    }

    async function assignFilteredToMatter() {
      if (!state.sourceId) return;

      try {
        const filters = getCurrentDataFilters();
        await api.post(connectorApi('/data/assign-matter'), {
          matter_id: document.getElementById('dataMatterSelect')?.value || null,
          q: filters.q,
          entity_type: filters.entity_type || null,
          filters: filters.filters
        });

        showPageAlert('Filtered result set was assigned.', 'success');
        await Promise.all([refreshDataPreview(), refreshBaseData(false)]);
      } catch (error) {
        console.error('[Connector Viewer] Failed to assign filtered rows', error);
        showPageAlert(error.message || 'Failed to assign filtered rows.', 'error');
      }
    }

    async function assignGroupToMatter(groupType, spreadsheetId, sheetName, entityType) {
      if (!state.sourceId) return;

      try {
        const decodedGroupType = decodeURIComponent(groupType || '');
        const decodedSpreadsheetId = decodeURIComponent(spreadsheetId || '');
        const decodedSheetName = decodeURIComponent(sheetName || '');
        const decodedEntityType = decodeURIComponent(entityType || '');
        await api.post(connectorApi('/data/assign-matter'), {
          matter_id: document.getElementById('dataMatterSelect')?.value || null,
          group: decodedGroupType === 'source_collection'
            ? {
                group_type: 'source_collection',
                spreadsheet_id: decodedSpreadsheetId,
                sheet_name: decodedSheetName
              }
            : {
                group_type: 'entity_type',
                entity_type: decodedEntityType
              }
        });

        showPageAlert('Group assignment updated.', 'success');
        await Promise.all([refreshDataPreview(), refreshBaseData(false)]);
      } catch (error) {
        console.error('[Connector Viewer] Failed to assign group', error);
        showPageAlert(error.message || 'Failed to assign group.', 'error');
      }
    }

    function renderViewer() {
      applyPageIdentity();
      setLoading(false);

      if (state.iframeOnlyFallback) {
        showPageAlert('This connector link did not include an integration source ID. Generic controls are unavailable for this launch, so LANA is falling back to the embedded connector documentation only.', 'info');
        ['overview', 'configuration', 'webhooks', 'data', 'logs'].forEach((tabName) => {
          const button = document.querySelector(`.connector-tab[data-tab="${tabName}"]`);
          if (button) {
            button.classList.add('hidden');
          }
        });
        switchTab('docs');
        return;
      }

      renderOverview();
      renderDocumentationGuide();
      renderConfiguration();
      renderWebhooksTab();
      renderRunTab();
      renderDataRuleBuilder();
      renderEntityFilterOptions();
      renderDataGroups();
      renderDataPreview();
      renderBulkActionSummary();
      renderRecordDetail();
      renderLogs();
      updateTabVisibility();
      switchTab(state.activeTab);
    }

    function buildSetupOnlyDocsScript() {
      return `
        <script>
          (function() {
            var SETUP_LABEL_PATTERNS = [
              /setup guide/i,
              /setup instructions/i,
              /oauth setup/i,
              /getting started/i,
              /connection guide/i,
              /documentation/i,
              /instructions/i,
              /setup/i
            ];

            function normalizeText(value) {
              return String(value || '').replace(/\\s+/g, ' ').trim();
            }

            function isVisible(node) {
              if (!node) return false;
              var style = window.getComputedStyle(node);
              if (style.display === 'none' || style.visibility === 'hidden') return false;
              if (node.hidden) return false;
              return true;
            }

            function isSetupLabel(text) {
              var normalized = normalizeText(text);
              return normalized && SETUP_LABEL_PATTERNS.some(function(pattern) {
                return pattern.test(normalized);
              });
            }

            function scoreSetupCandidate(node) {
              var text = normalizeText(node.textContent);
              if (!isSetupLabel(text)) return -1;
              if (/setup guide/i.test(text)) return 100;
              if (/setup instructions/i.test(text)) return 90;
              if (/getting started/i.test(text)) return 80;
              if (/oauth setup/i.test(text)) return 70;
              if (/documentation/i.test(text)) return 50;
              if (/instructions/i.test(text)) return 40;
              return 20;
            }

            function findSetupControl() {
              var candidates = Array.from(document.querySelectorAll('button, a, [role="tab"], .tab-btn, [data-tab]'))
                .filter(function(node) { return isVisible(node); })
                .map(function(node) {
                  return { node: node, score: scoreSetupCandidate(node) };
                })
                .filter(function(entry) { return entry.score > -1; })
                .sort(function(a, b) { return b.score - a.score; });

              return candidates.length ? candidates[0].node : null;
            }

            function findSetupPanel() {
              var candidates = Array.from(document.querySelectorAll('[id], [data-tab], [data-panel], section, article, div'))
                .filter(function(node) {
                  if (!isVisible(node)) return false;
                  var text = normalizeText(node.id || node.getAttribute('data-tab') || node.getAttribute('data-panel') || '');
                  if (isSetupLabel(text)) return true;
                  var heading = node.querySelector && node.querySelector('h1, h2, h3, h4, .text-xl, .text-lg');
                  return !!(heading && isSetupLabel(heading.textContent));
                });

              return candidates[0] || null;
            }

            function hideSiblingNodes(parent, keepNodes) {
              if (!parent) return;
              Array.from(parent.children).forEach(function(child) {
                if (keepNodes.indexOf(child) === -1) {
                  child.style.display = 'none';
                }
              });
            }

            function reduceEmbeddedChrome(activeControl, activePanel) {
              var nav = activeControl && activeControl.closest('nav, [role="tablist"], .tabs, .tab-nav, .tab-buttons, .border-b');
              var cardShell = (nav && nav.closest('.bg-white, .rounded-xl, .rounded-2xl, section, article, main, div'))
                || (activePanel && activePanel.closest('.bg-white, .rounded-xl, .rounded-2xl, section, article, main, div'));
              var pageShell = cardShell && cardShell.parentElement;

              if (pageShell && cardShell) {
                hideSiblingNodes(pageShell, [cardShell]);
              }

              if (nav && nav.parentElement) {
                nav.style.display = 'none';
              }

              document.body.style.background = '#ffffff';
              document.body.style.padding = '0';
              document.body.style.margin = '0';

              if (activePanel && typeof activePanel.scrollIntoView === 'function') {
                activePanel.scrollIntoView({ block: 'start' });
              }
            }

            function activateSetupMode() {
              var setupControl = findSetupControl();
              if (setupControl) {
                try {
                  setupControl.click();
                } catch (error) {
                  console.warn('[LANA Docs Mode] Failed to activate setup control', error);
                }
              }

              window.requestAnimationFrame(function() {
                window.requestAnimationFrame(function() {
                  var activePanel = findSetupPanel();
                  reduceEmbeddedChrome(setupControl, activePanel);
                });
              });
            }

            if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', activateSetupMode);
            } else {
              activateSetupMode();
            }
          })();
        <\/script>
      `;
    }

    /**
     * Kept as a no-op so existing callers still compile. The Docs tab is now
     * rendered entirely from connector.json via renderDocumentationGuide().
     * The embedded `ui/index.html` iframe has been retired — step-by-step
     * setup instructions live in the JSON `documentation.setup_guide` block
     * so they can be version-controlled, localized, and audited like every
     * other package contract.
     */
    async function loadConnectorDocs() {
      renderDocumentationGuide();
    }

    function handleOAuthRedirectResult() {
      const params = new URLSearchParams(window.location.search);
      const oauthSuccess = params.get('oauth_success');
      const oauthError = params.get('oauth_error');

      if (oauthSuccess === 'true') {
        showPageAlert(`${state.connectorName} authorization completed.`, 'success');
      } else if (oauthError) {
        showPageAlert(oauthError, 'error');
      } else {
        return;
      }

      params.delete('oauth_success');
      params.delete('oauth_error');
      params.delete('connector_id');
      const query = params.toString();
      const nextUrl = `${window.location.pathname}${query ? `?${query}` : ''}`;
      window.history.replaceState({}, '', nextUrl);
    }

    async function init() {
      try {
        setLoading(true);
        applyPageIdentity();
        await resolveConnectorContext();

        if (!state.iframeOnlyFallback) {
          await loadCatalog();
          await refreshBaseData(false);
          await Promise.all([loadMatterOptions(), refreshDataPreview(), refreshLogs()]);
        } else {
          renderViewer();
        }

        document.querySelectorAll('.connector-tab').forEach((button) => {
          button.addEventListener('click', () => switchTab(button.dataset.tab));
        });
        handleOAuthRedirectResult();
      } catch (error) {
        console.error('[Connector Viewer] Initialization failed', error);
        showViewerError(error.message || 'An unexpected error occurred while loading the connector viewer.');
      }
    }

    function goBack() {
      window.history.back();
    }

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        event.preventDefault();
        goBack();
      }
    });

    window.saveConfiguration = saveConfiguration;
    window.saveConfigurationAndExitEdit = saveConfigurationAndExitEdit;
    window.saveSyncSettings = saveSyncSettings;
    window.enterEditConfigMode = enterEditConfigMode;
    window.cancelEditConfigMode = cancelEditConfigMode;
    window.openDeleteConfigModal = openDeleteConfigModal;
    window.closeDeleteConfigModal = closeDeleteConfigModal;
    window.confirmDeleteConfig = confirmDeleteConfig;
    window.copyTextToClipboard = copyTextToClipboard;
    window.connectOAuthConnector = connectOAuthConnector;
    window.copyAuthorizationUrl = copyAuthorizationUrl;
    window.openAuthorizationUrl = openAuthorizationUrl;
    window.refreshAuthorizationUrl = refreshAuthorizationUrl;
    window.copyWebhookEndpointUrl = copyWebhookEndpointUrl;
    window.testConnection = testConnection;
    window.triggerSync = triggerSync;
    window.disconnectConnector = disconnectConnector;
    window.setDateRange = setDateRange;
    window.runManualSync = runManualSync;
    window.executeCustomApiRequest = executeCustomApiRequest;
    window.clearCustomApiRequest = clearCustomApiRequest;
    window.addArrayFieldItem = addArrayFieldItem;
    window.removeArrayFieldItem = removeArrayFieldItem;
    window.addDataRule = addDataRule;
    window.removeDataRule = removeDataRule;
    window.applyDataFilters = applyDataFilters;
    window.clearDataFilters = clearDataFilters;
    window.toggleDataSelection = toggleDataSelection;
    window.toggleAllDataSelection = toggleAllDataSelection;
    window.openRecordDetail = openRecordDetail;
    window.submitRecordCorrection = submitRecordCorrection;
    window.shortlistSingleRecord = shortlistSingleRecord;
    window.shortlistSelectedForEdit = shortlistSelectedForEdit;
    window.assignSelectedToMatter = assignSelectedToMatter;
    window.assignFilteredToMatter = assignFilteredToMatter;
    window.assignGroupToMatter = assignGroupToMatter;
    window.refreshBaseData = refreshBaseData;
    window.refreshDataPreview = refreshDataPreview;
    window.refreshLogs = refreshLogs;
    window.closeRecordDetail = closeRecordDetail;
    window.switchTab = switchTab;
    window.discoverDynamicFieldOptions = discoverDynamicFieldOptions;

    init();
  </script>
