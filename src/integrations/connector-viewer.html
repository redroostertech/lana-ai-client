    async function switchToLanaManagedCredentials() {
      if (!state.sourceId || !isLanaManagedAvailable()) return;

      const confirmed = window.confirm(
        `Remove your own OAuth app credentials for ${state.connectorName} and use LANA-managed credentials instead?\n\n` +
        'Existing connections will need to be re-authorized.'
      );
      if (!confirmed) return;

      try {
        showPageAlert('Switching to LANA-managed credentials...', 'info');

        // Clear per-connection auth secrets (empty string deletes stored secrets).
        const clearPayload = {};
        getCatalogAuthFields().forEach((field) => {
          if (field?.name) clearPayload[field.name] = '';
        });
        if (Object.keys(clearPayload).length > 0) {
          await api.patch(connectorApi('/config'), clearPayload);
        }

        // Clear firm-level OAuth app credentials (404 = none stored, fine).
        const connectorType = state.connectorType || state.connectorId || state.configResponse?.connector_id;
        if (connectorType) {
          try {
            await api.delete(`/api/connectors/${encodeURIComponent(connectorType)}/oauth-app`);
          } catch (deleteError) {
            if (!String(deleteError?.message || '').toLowerCase().includes('not found')) {
              throw deleteError;
            }
          }
        }

        state.useOwnOAuthApp = false;
        state.formDraft = null;
        await refreshBaseData(false);
        showPageAlert('Now using LANA-managed credentials. Click Authorize to reconnect.', 'success');
      } catch (error) {
        console.error('[Connector Viewer] Failed to switch to LANA-managed credentials', error);
        showPageAlert(error.message || 'Failed to switch to LANA-managed credentials.', 'error');
      }
    }

    async function openOAuthAuthorizationUrl(authUrl, { sameWindow = false } = {}) {
      if (window.electronAPI && typeof window.electronAPI.invoke === 'function') {
        await window.electronAPI.invoke('open-external-url', authUrl);
        startAuthorizationStatusPolling();
        return;
      }

      if (urlParams.get('chrome') === 'embedded' && window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'lex-open-external-url', url: authUrl }, '*');
        startAuthorizationStatusPolling();
        return;
      }

      if (sameWindow) {
        window.location.href = authUrl;
      } else {
        window.open(authUrl, '_blank', 'noopener');
        startAuthorizationStatusPolling();
      }
    }

    function stopAuthorizationStatusPolling() {
      if (!state.authStatusPollTimer) return;
      clearInterval(state.authStatusPollTimer);
      state.authStatusPollTimer = null;
    }

    function startAuthorizationStatusPolling() {
      if (!state.sourceId || !isOAuthConnector() || isOAuthAuthorized()) return;

      stopAuthorizationStatusPolling();

      const startedAt = LanaTime.nowMs();
      state.authStatusPollTimer = setInterval(async () => {
        if (!state.sourceId || !isOAuthConnector() || isOAuthAuthorized()) {
          stopAuthorizationStatusPolling();
          return;
        }

        if (LanaTime.millisecondsSince(startedAt) > 90000) {
          stopAuthorizationStatusPolling();
          return;
        }

        try {
          await refreshBaseData(false, { preserveDraft: true });
          if (isOAuthAuthorized()) {
            state.pendingAuthorizationUrl = null;
            state.pendingAuthorizationUrlError = null;
            stopAuthorizationStatusPolling();
            showPageAlert(`${state.connectorName} authorization completed.`, 'success');
          }
        } catch (error) {
          console.warn('[Connector Viewer] Authorization status refresh failed', error);
        }
      }, 2000);
    }

    function buildAuthorizationReturnUrl() {
      const returnUrl = new URL(window.location.href);
      returnUrl.searchParams.set('tab', 'configuration');
      returnUrl.searchParams.delete('oauth_success');
      returnUrl.searchParams.delete('oauth_error');
      returnUrl.searchParams.delete('connector_id');
      return returnUrl.toString();
    }

    function shouldUseElectronOAuthExchangeFlow() {
      return Boolean(window.isElectron || window.electronAPI || window.location.protocol === 'file:');
    }

    async function fetchAuthorizationUrl({ force = false } = {}) {
      if (!state.sourceId || !isOAuthConnector()) {
        throw new Error('OAuth is not configured for this connector.');
      }

      if (!force && state.pendingAuthorizationUrl) {
        return state.pendingAuthorizationUrl;
      }

      state.pendingAuthorizationUrlLoading = true;
      state.pendingAuthorizationUrlError = null;
      updatePendingAuthorizationUrlDisplay('Generating link...');

      try {
        const params = new URLSearchParams();
        if (shouldUseElectronOAuthExchangeFlow()) {
          params.set('flow', 'electron');
        } else {
          params.set('return_to', buildAuthorizationReturnUrl());
        }

        const result = await api.get(
          `/api/v1/integrations/connectors/${encodeURIComponent(state.sourceId)}/authorize?${params.toString()}`
        );

        if (!result?.authorization_url) {
          throw new Error('OAuth authorization URL was not returned by the server.');
        }

        if (result.redirect_uri) {
          state.oauthRedirectUri = result.redirect_uri;
        }
        state.pendingAuthorizationUrl = result.authorization_url;
        updatePendingAuthorizationUrlDisplay(result.authorization_url);
        return result.authorization_url;
      } catch (error) {
        const message = error?.message || 'Failed to generate authorization link.';
        state.pendingAuthorizationUrl = null;
        state.pendingAuthorizationUrlError = message;
        updatePendingAuthorizationUrlDisplay(message);
        throw error;
      } finally {
        state.pendingAuthorizationUrlLoading = false;
      }
    }

    function updatePendingAuthorizationUrlDisplay(text) {
      const el = document.getElementById('pendingAuthorizationUrlValue');
      if (el) el.textContent = text;
    }

    async function ensurePendingAuthorizationUrl() {
      if (!isOAuthConnector() || isOAuthAuthorized() || !state.sourceId) return;
      if (state.pendingAuthorizationUrl || state.pendingAuthorizationUrlLoading) return;
      try {
        await fetchAuthorizationUrl();
      } catch (error) {
        console.error('[Connector Viewer] Failed to generate authorization link', error);
      }
    }

    function registerElectronOAuthCallbackHandler() {
      if (state.oauthCallbackRegistered) return;

      // The preload script doesn't run inside iframes (nodeIntegrationInSubFrames
      // is false), so window.electronAPI is undefined here. The parent window
      // does have it because it's same-origin (file://, webSecurity:false), so
      // fall back to that. Without this, oauth-callback IPC arrives at the
      // parent renderer with no listener and the OAuth exchange never runs.
      const electronAPI = window.electronAPI || (window.parent && window.parent.electronAPI);
      if (!electronAPI || typeof electronAPI.onOAuthCallback !== 'function') return;

      electronAPI.onOAuthCallback(async (data) => {
        if (!data || (!data.code && !data.error)) return;
        if (!isOAuthConnector()) return;

        if (data.error) {
          showPageAlert(data.error_description || data.error, 'error');
          return;
        }

        try {
          showPageAlert(`Completing ${state.connectorName} authorization...`, 'info');
          const connectorType = state.connectorType || state.connectorId;
          const result = await api.post('/api/v1/integrations/oauth/exchange', {
            code: data.code,
            state: data.state,
            provider: connectorType,
            connectorId: connectorType,
            redirectUri: state.oauthRedirectUri || 'lana-ai://oauth/callback',
            realmId: data.realmId || data.realm_id
          });

          if (result?.integrationSourceId) {
            state.sourceId = result.integrationSourceId;
            const params = new URLSearchParams(window.location.search);
            params.set('sourceId', result.integrationSourceId);
            params.set('connectorId', connectorType);
            params.set('connectorType', connectorType);
            params.set('connectorScope', state.connectorScope);
            params.set('tab', 'configuration');
            window.history.replaceState({}, '', `${window.location.pathname}?${params.toString()}`);
          }

          state.pendingAuthorizationUrl = null;
          state.pendingAuthorizationUrlError = null;
          await refreshBaseData(false);
          showPageAlert(`${state.connectorName} authorization completed.`, 'success');
        } catch (error) {
          console.error('[Connector Viewer] OAuth callback exchange failed', error);
          showPageAlert(error.message || 'Failed to complete OAuth authorization.', 'error');
        }
      });

      state.oauthCallbackRegistered = true;
    }

    function setDateRange(days) {
      const startNode = document.getElementById('runStartDate');
      const endNode = document.getElementById('runEndDate');
      if (!startNode || !endNode) return;

      const endDate = LanaTime.nowDate();
      const startDate = LanaTime.addDays(endDate, -days);

      startNode.value = LanaTime.formatUtcDateOnly(startDate);
      endNode.value = LanaTime.formatUtcDateOnly(endDate);
    }

    function collectRunOptionOverrides() {
      const runModel = getRunTabModel();
      if (!runModel.options.length) return {};

      const form = document.getElementById('runOptionsForm');
      if (!form) return {};

      const draft = {};
      const processed = new Set();
      collectNamedFormDraft(form, draft, processed);

      // Drop empty values so they don't override saved config with blanks,
      // unless an explicit default is declared (meaning user can reset to that value).
      const overrides = {};
      runModel.options.forEach((option) => {
        if (!Object.prototype.hasOwnProperty.call(draft, option.name)) return;
        const value = draft[option.name];
        if (option.type === 'boolean') {
          overrides[option.name] = Boolean(value);
          return;
        }
        if (Array.isArray(value)) {
          if (value.length > 0) overrides[option.name] = value;
          return;
        }
        if (value === '' || value === null || value === undefined) return;
        if (option.type === 'number') {
          const num = Number(value);
          if (!Number.isNaN(num)) overrides[option.name] = num;
          return;
        }
        overrides[option.name] = value;
      });

      return overrides;
    }

    async function runManualSync() {
      if (!state.sourceId) return;

      try {
        if (!isConnectorReady()) {
          throw new Error(getConnectorSetupState().message);
        }

        const startDate = document.getElementById('runStartDate')?.value || '';
        const endDate = document.getElementById('runEndDate')?.value || '';
        const payload = {};

        if (startDate) payload.startDate = LanaTime.utcDayStart(startDate);
        if (endDate) payload.endDate = LanaTime.utcDayEnd(endDate);

        const overrides = collectRunOptionOverrides();
        if (Object.keys(overrides).length) {
          payload.runtime_overrides = overrides;
          if (Object.prototype.hasOwnProperty.call(overrides, 'force_full_resync')) {
            payload.forceFullSync = Boolean(overrides.force_full_resync);
          }
        }

        showPageAlert('Starting manual sync...', 'info');
        const result = await api.post(connectorApi('/sync'), payload);
        showPageAlert(result.message || 'Manual sync started.', 'success');
        await Promise.all([refreshBaseData(false), refreshLogs()]);
      } catch (error) {
        console.error('[Connector Viewer] Failed to run manual sync', error);
        showPageAlert(error.message || 'Failed to start manual sync.', 'error');
      }

    function goToDataPage(direction) {
      const pagination = state.dataPreview && state.dataPreview.pagination;
      if (!pagination) return;
      const limit = pagination.limit || state.dataPreviewLimit || 25;
      const total = pagination.total || 0;
      const current = state.dataPreviewOffset || 0;
      let next = current;

      if (direction === 'next') {
        next = current + limit;
      } else if (direction === 'prev') {
        next = current - limit;
      } else if (direction === 'first') {
        next = 0;
      } else if (direction === 'last') {
        next = Math.max(0, Math.floor(Math.max(0, total - 1) / limit) * limit);
      }

      next = Math.max(0, Math.min(next, Math.max(0, total - 1)));
      if (next === current) return;

      state.dataPreviewOffset = next;
      refreshDataPreview().catch((error) => {
        console.error('[Connector Viewer] Failed to change data page', error);
        showPageAlert(error.message || 'Failed to load page.', 'error');
      });
    }

    function toggleDataSelection(recordId, isChecked) {
      const rows = state.dataPreview && Array.isArray(state.dataPreview.data) ? state.dataPreview.data : [];
      if (state.selectionMode === 'all-filtered') {
        state.selectionMode = 'manual';
        state.selectedDataIds = rows.map((row) => row.id);
        state.selectedRowsById = {};
        for (const row of rows) {
          if (row && row.id) state.selectedRowsById[row.id] = row;
        }
      }
      if (isChecked) {
        if (!state.selectedDataIds.includes(recordId)) {
          state.selectedDataIds.push(recordId);
        }
        const row = rows.find((r) => r.id === recordId);
        if (row) state.selectedRowsById[recordId] = row;
      } else {
        state.selectedDataIds = state.selectedDataIds.filter((id) => id !== recordId);
        delete state.selectedRowsById[recordId];
      }
      renderDataPreview();
      scheduleCascadePanelRefresh();
    }

    function toggleAllDataSelection(isChecked) {
      const rows = state.dataPreview && Array.isArray(state.dataPreview.data) ? state.dataPreview.data : [];
      state.selectionMode = 'manual';
      if (isChecked) {
        for (const row of rows) {
          if (row && row.id) {
            if (!state.selectedDataIds.includes(row.id)) {
              state.selectedDataIds.push(row.id);
            }
            state.selectedRowsById[row.id] = row;

      } else {
        const visible = new Set(rows.map((row) => row.id));
        state.selectedDataIds = state.selectedDataIds.filter((id) => !visible.has(id));
        for (const id of visible) delete state.selectedRowsById[id];

      renderDataPreview();

    const MAX_CASCADE_PARENTS = 10000;

    async function fetchAllMatchingParents(baseParams) {
      const PAGE_SIZE = 1000;
      const out = [];
      let offset = 0;
      while (true) {
        const q = new URLSearchParams();
        for (const [k, v] of Object.entries(baseParams)) {
          if (v !== undefined && v !== null && v !== '') q.set(k, v);
        }
        q.set('limit', String(PAGE_SIZE));
        q.set('offset', String(offset));
        const page = await api.get(`${connectorApi('/data')}?${q.toString()}`);
        const rows = Array.isArray(page.data) ? page.data : [];
        const total = page.pagination?.total ?? (offset + rows.length);
        out.push(...rows);
        if (out.length < total && out.length >= MAX_CASCADE_PARENTS) {
          throw new Error(`Cascade is limited to ${MAX_CASCADE_PARENTS.toLocaleString()} parent rows (filter matched ${total.toLocaleString()}). Narrow filters and try again, or assign without cascade.`);
        }
        if (rows.length < PAGE_SIZE || out.length >= total) break;
        offset += rows.length;
      }
      return out;
    }

    async function unassignSelectedFromMatter() {
      if (!state.sourceId) return;

      try {
        const allFiltered = state.selectionMode === 'all-filtered';
        const filters = getCurrentDataFilters();
        const filteredTotal = state.dataPreview?.pagination?.total || 0;

        if (!allFiltered && !state.selectedDataIds.length) {
          throw new Error('Select one or more rows first');
        }

        const count = allFiltered ? filteredTotal : state.selectedDataIds.length;
        const target = allFiltered
          ? `${formatNumber(count)} filtered row${count === 1 ? '' : 's'}`
          : `${formatNumber(count)} selected row${count === 1 ? '' : 's'}`;

        if (!window.confirm(`Unassign ${target} from their current matters? Source data is not modified.`)) {
          return;
        }

        const body = { unassign: true };
        if (allFiltered) {
          body.q = filters.q;
          body.entity_type = filters.entity_type || null;
          body.filters = filters.filters;
        } else {
          body.data_ids = state.selectedDataIds.slice();
        }

        const response = await api.post(connectorApi('/data/assign-matter'), body);
        const assigned = Number.isFinite(response?.rows_assigned) ? response.rows_assigned : 0;
        const skipped = Number.isFinite(response?.rows_skipped) ? response.rows_skipped : 0;
        const parts = [`Unassigned ${formatNumber(assigned)} row${assigned === 1 ? '' : 's'}`];
        if (skipped > 0) parts.push(`${formatNumber(skipped)} already unassigned`);
        showPageAlert(`${parts.join(' — ')}.`, 'success');
        state.cascadeIndex = {};
        state.cascadeIndexErrors = {};
        await Promise.all([refreshDataPreview(), refreshBaseData(false)]);
      } catch (error) {
        console.error('[Connector Viewer] Failed to unassign rows', error);
        showPageAlert(error.message || 'Failed to unassign rows.', 'error');
      }
    }

    function buildSetupOnlyDocsScript() {
      return `
        <script>
          (function() {
            var SETUP_LABEL_PATTERNS = [
              /setup guide/i,
              /setup instructions/i,
              /oauth setup/i,
              /getting started/i,
              /connection guide/i,
              /documentation/i,
              /instructions/i,
              /setup/i
            ];

            function normalizeText(value) {
              return String(value || '').replace(/\\s+/g, ' ').trim();
            }

            function isVisible(node) {
              if (!node) return false;
              var style = window.getComputedStyle(node);
              if (style.display === 'none' || style.visibility === 'hidden') return false;
              if (node.hidden) return false;
              return true;
            }

            function isSetupLabel(text) {
              var normalized = normalizeText(text);
              return normalized && SETUP_LABEL_PATTERNS.some(function(pattern) {
                return pattern.test(normalized);
              });
            }

            function scoreSetupCandidate(node) {
              var text = normalizeText(node.textContent);
              if (!isSetupLabel(text)) return -1;
              if (/setup guide/i.test(text)) return 100;
              if (/setup instructions/i.test(text)) return 90;
              if (/getting started/i.test(text)) return 80;
              if (/oauth setup/i.test(text)) return 70;
              if (/documentation/i.test(text)) return 50;
              if (/instructions/i.test(text)) return 40;
              return 20;
            }

            function findSetupControl() {
              var candidates = Array.from(document.querySelectorAll('button, a, [role="tab"], .tab-btn, [data-tab]'))
                .filter(function(node) { return isVisible(node); })
                .map(function(node) {
                  return { node: node, score: scoreSetupCandidate(node) };
                })
                .filter(function(entry) { return entry.score > -1; })
                .sort(function(a, b) { return b.score - a.score; });

              return candidates.length ? candidates[0].node : null;
            }

            function findSetupPanel() {
              var candidates = Array.from(document.querySelectorAll('[id], [data-tab], [data-panel], section, article, div'))
                .filter(function(node) {
                  if (!isVisible(node)) return false;
                  var text = normalizeText(node.id || node.getAttribute('data-tab') || node.getAttribute('data-panel') || '');
                  if (isSetupLabel(text)) return true;
                  var heading = node.querySelector && node.querySelector('h1, h2, h3, h4, .text-xl, .text-lg');
                  return !!(heading && isSetupLabel(heading.textContent));
                });

              return candidates[0] || null;
            }

            function hideSiblingNodes(parent, keepNodes) {
              if (!parent) return;
              Array.from(parent.children).forEach(function(child) {
                if (keepNodes.indexOf(child) === -1) {
                  child.style.display = 'none';
                }
              });
            }

            function reduceEmbeddedChrome(activeControl, activePanel) {
              var nav = activeControl && activeControl.closest('nav, [role="tablist"], .tabs, .tab-nav, .tab-buttons, .border-b');
              var cardShell = (nav && nav.closest('.bg-white, .rounded-xl, .rounded-2xl, section, article, main, div'))
                || (activePanel && activePanel.closest('.bg-white, .rounded-xl, .rounded-2xl, section, article, main, div'));
              var pageShell = cardShell && cardShell.parentElement;

              if (pageShell && cardShell) {
                hideSiblingNodes(pageShell, [cardShell]);
              }

              if (nav && nav.parentElement) {
                nav.style.display = 'none';
              }

              document.body.style.background = '#ffffff';
              document.body.style.padding = '0';
              document.body.style.margin = '0';

              if (activePanel && typeof activePanel.scrollIntoView === 'function') {
                activePanel.scrollIntoView({ block: 'start' });
              }
            }

            function activateSetupMode() {
              var setupControl = findSetupControl();
              if (setupControl) {
                try {
                  setupControl.click();
                } catch (error) {
                  console.warn('[LANA Docs Mode] Failed to activate setup control', error);
                }
              }

              window.requestAnimationFrame(function() {
                window.requestAnimationFrame(function() {
                  var activePanel = findSetupPanel();
                  reduceEmbeddedChrome(setupControl, activePanel);
                });
              });
            }

            if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', activateSetupMode);
            } else {
              activateSetupMode();
            }
          })();
        <\/script>
      `;
    }

    /**
     * Kept as a no-op so existing callers still compile. The Docs tab is now
     * rendered entirely from connector.json via renderDocumentationGuide().
     * The embedded `ui/index.html` iframe has been retired — step-by-step
     * setup instructions live in the JSON `documentation.setup_guide` block
     * so they can be version-controlled, localized, and audited like every
     * other package contract.
     */
    async function loadConnectorDocs() {
      renderDocumentationGuide();
    }

    function handleOAuthRedirectResult() {
      const params = new URLSearchParams(window.location.search);
      const oauthSuccess = params.get('oauth_success');
      const oauthError = params.get('oauth_error');

      if (oauthSuccess === 'true') {
        showPageAlert(`${state.connectorName} authorization completed.`, 'success');
      } else if (oauthError) {
        showPageAlert(oauthError, 'error');
      } else {
        return;
      }

      params.delete('oauth_success');
      params.delete('oauth_error');
      params.delete('connector_id');
      const query = params.toString();
      const nextUrl = `${window.location.pathname}${query ? `?${query}` : ''}`;
      window.history.replaceState({}, '', nextUrl);
    }

    async function init() {
      try {
        setLoading(true);
        applyPageIdentity();
        await resolveConnectorContext();
        registerElectronOAuthCallbackHandler();

        if (!state.iframeOnlyFallback) {
          await loadCatalog();
          await refreshBaseData(false);
          await Promise.all([loadMatterOptions(), refreshDataPreview(), refreshLogs()]);
        } else {
          renderViewer();
        }

        document.querySelectorAll('.connector-tab').forEach((button) => {
          button.addEventListener('click', () => switchTab(button.dataset.tab));
        });
        handleOAuthRedirectResult();
      } catch (error) {
        console.error('[Connector Viewer] Initialization failed', error);
        showViewerError(error.message || 'An unexpected error occurred while loading the connector viewer.');
      }
    }

    function goBack() {
      if (urlParams.get('chrome') === 'embedded' && window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'lex-embedded-back', href: '../data-connectors.html' }, '*');
        return;
      }

      window.history.back();
    }

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        event.preventDefault();
        goBack();
      }
    });

    window.addEventListener('focus', async () => {
      if (!state.sourceId || !isOAuthConnector() || isOAuthAuthorized()) return;
      try {
        await refreshBaseData(false, { preserveDraft: true });
      } catch (error) {
        console.warn('[Connector Viewer] Focus refresh failed', error);
      }
    });

    window.saveConfiguration = saveConfiguration;
    window.saveConfigurationAndExitEdit = saveConfigurationAndExitEdit;
    window.saveSyncSettings = saveSyncSettings;

    window.copyAuthorizationUrl = copyAuthorizationUrl;
    window.openAuthorizationUrl = openAuthorizationUrl;
    window.refreshAuthorizationUrl = refreshAuthorizationUrl;
    window.copyWebhookEndpointUrl = copyWebhookEndpointUrl;
    window.testConnection = testConnection;
    window.triggerSync = triggerSync;
    window.disconnectConnector = disconnectConnector;
    window.setDateRange = setDateRange;
    window.runManualSync = runManualSync;
    window.executeCustomApiRequest = executeCustomApiRequest;
    window.clearCustomApiRequest = clearCustomApiRequest;
    window.addArrayFieldItem = addArrayFieldItem;
    window.removeArrayFieldItem = removeArrayFieldItem;
    window.addDataRule = addDataRule;
    window.removeDataRule = removeDataRule;
    window.onDataRuleOperatorChange = onDataRuleOperatorChange;
    window.onDataRuleFieldChange = onDataRuleFieldChange;
    window.applyDataFilters = applyDataFilters;
    window.clearDataFilters = clearDataFilters;
    window.goToDataPage = goToDataPage;
    window.toggleDataSelection = toggleDataSelection;
    window.toggleAllDataSelection = toggleAllDataSelection;
    window.selectPageRows = selectPageRows;
    window.selectAllFiltered = selectAllFiltered;
    window.clearAssignSelection = clearAssignSelection;
    window.onMatterDropdownChange = onMatterDropdownChange;
    window.openRecordDetail = openRecordDetail;
    window.openParentRecord = openParentRecord;
    window.refreshParentRecordsForOpenRecord = refreshParentRecordsForOpenRecord;
    window.submitRecordCorrection = submitRecordCorrection;
    window.onCorrectionFieldSelectChange = onCorrectionFieldSelectChange;
    window.updateCurrentValueDisplay = updateCurrentValueDisplay;
    window.prefillCorrectionFromPath = prefillCorrectionFromPath;

    window.assignSelectedToMatter = assignSelectedToMatter;
    window.assignFilteredToMatter = assignFilteredToMatter;
    window.unassignSelectedFromMatter = unassignSelectedFromMatter;
    window.deleteRecordAnnotation = deleteRecordAnnotation;
    window.closeDeleteAnnotationModal = closeDeleteAnnotationModal;
    window.confirmDeleteAnnotation = confirmDeleteAnnotation;

    window.assignSingleRecordWithCascade = assignSingleRecordWithCascade;
    window.setCascadeEnabled = setCascadeEnabled;
    window.toggleCascadeRel = toggleCascadeRel;
    window.refreshLinkedRecordsForOpenRecord = refreshLinkedRecordsForOpenRecord;
    window.filterToLinkedRecords = filterToLinkedRecords;
    window.closeAssignDialog = closeAssignDialog;
    window.setAssignDialogMode = setAssignDialogMode;
    window.setAssignDialogMatter = setAssignDialogMatter;
    window.updateAssignDialogField = updateAssignDialogField;
    window.setAssignDialogOneMatterPerRow = setAssignDialogOneMatterPerRow;
    window.refreshAssignDialogTotals = refreshAssignDialogTotals;
    window.confirmAssignDialog = confirmAssignDialog;
    window.refreshBaseData = refreshBaseData;
    window.refreshDataPreview = refreshDataPreview;
    window.refreshLogs = refreshLogs;
    window.closeRecordDetail = closeRecordDetail;
    window.openLogDetail = openLogDetail;
    window.closeLogDetail = closeLogDetail;
    window.switchTab = switchTab;
    window.discoverDynamicFieldOptions = discoverDynamicFieldOptions;

    init();
  </script>
