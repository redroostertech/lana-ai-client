<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connector - LANA AI</title>

  <!-- CSS + Tailwind in head — behavioral scripts at end of body -->
  <link rel="stylesheet" href="../css/lex-tokens.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/tailwind-output.css">
  <script src="../js/tailwind-loader.js"></script>

</head>
<body>

  <!-- Branded loader -->
  <lex-loader theme="light"></lex-loader>

  <lex-app
    logo-src="../img/logo-light.png"
    logo-alt="LANA AI"
    logo-href="../dashboard.html"
    active-nav-id="connectors"
    page-title="Connector"
  ></lex-app>

  <template id="page-content">

    <lex-breadcrumb id="connectorBreadcrumb" items='[{"label":"Data Connectors","href":"data-connectors.html"},{"label":"Connector"}]'></lex-breadcrumb>

    <!-- Connector UI iframe container -->
    <div id="iframe-container" class="fixed inset-0 lg:ml-64 flex flex-col" style="top: 105px;">
      <!-- Loading Overlay -->
      <div id="loading-overlay" class="absolute inset-0 bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center z-10 transition-opacity">
        <div class="text-center">
          <div class="spinner w-16 h-16 border-4 border-white/30 border-t-white rounded-full animate-spin mx-auto mb-4"></div>
          <p class="text-white text-lg font-medium">Loading connector...</p>
        </div>
      </div>

      <!-- Error Screen -->
      <div id="error-screen" class="hidden absolute inset-0 bg-white flex items-center justify-center z-10">
        <div class="max-w-md text-center px-6">
          <svg class="w-16 h-16 text-red-500 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          <h2 class="text-2xl font-bold text-gray-900 mb-2">Failed to Load Connector</h2>
          <p class="text-gray-600 mb-6" id="error-message">An error occurred while loading the connector UI.</p>
          <button onclick="goBack()" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg transition-colors">
            Back to Connectors
          </button>
        </div>
      </div>

      <!-- Connector UI iframe -->
      <iframe
        id="connector-frame"
        class="w-full h-full border-0"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"
        allow="clipboard-read; clipboard-write"
      ></iframe>
    </div>

    <style>
      #loading-overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #error-screen.show {
        display: flex !important;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .animate-spin {
        animation: spin 1s linear infinite;
      }
    </style>

    <main class="hidden p-4 lg:p-8">
      <!-- Original dashboard content hidden -->

      <!-- Global Search Bar -->
      <div id="globalSearchSection" class="mb-8 hidden">
        <div class="relative max-w-3xl mx-auto">
          <input
            type="text"
            id="globalSearchInput"
            class="w-full px-6 py-4 text-lg border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent shadow-lg bg-white text-gray-900"
            placeholder="Search across all your connected data sources..."
            autocomplete="off"
            onkeypress="if(event.key==='Enter'){const q=document.getElementById('globalSearchInput').value; if(q.trim()) window.location.href='search-results.html?q='+encodeURIComponent(q);}"
          />
          <button
            type="button"
            class="absolute right-2 top-1/2 transform -translate-y-1/2 bg-indigo-600 text-white px-6 py-2 rounded-full hover:bg-indigo-700 transition-colors"
            onclick="const q=document.getElementById('globalSearchInput').value; if(q.trim()) window.location.href='search-results.html?q='+encodeURIComponent(q);"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
          </button>
        </div>
        <p class="text-center mt-3 text-sm text-gray-500">
          Powered by AI semantic search • Search across ActionStep, SharePoint, Google Drive, and more
        </p>
      </div>

      <!-- Stats Grid - Loading State -->
      <div id="statsLoading" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
        <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100 animate-pulse">
          <div class="flex items-center justify-between mb-4">
            <div class="w-12 h-12 bg-gray-200 rounded-lg"></div>
          </div>
          <div class="h-8 bg-gray-200 rounded w-16 mb-2"></div>
          <div class="h-4 bg-gray-200 rounded w-24"></div>
        </div>
        <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100 animate-pulse">
          <div class="flex items-center justify-between mb-4">
            <div class="w-12 h-12 bg-gray-200 rounded-lg"></div>
          </div>
          <div class="h-8 bg-gray-200 rounded w-12 mb-2"></div>
          <div class="h-4 bg-gray-200 rounded w-20"></div>
        </div>
        <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100 animate-pulse">
          <div class="flex items-center justify-between mb-4">
            <div class="w-12 h-12 bg-gray-200 rounded-lg"></div>
          </div>
          <div class="h-8 bg-gray-200 rounded w-14 mb-2"></div>
          <div class="h-4 bg-gray-200 rounded w-20"></div>
        </div>
        <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100 animate-pulse">
          <div class="flex items-center justify-between mb-4">
            <div class="w-12 h-12 bg-gray-200 rounded-lg"></div>
          </div>
          <div class="h-8 bg-gray-200 rounded w-20 mb-2"></div>
          <div class="h-4 bg-gray-200 rounded w-24"></div>
        </div>
      </div>

      <!-- Stats Grid - Content -->
      <div id="statsContent" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
        <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
          <div class="flex items-center justify-between mb-4">
            <div class="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center">
              <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"></path>
              </svg>
            </div>
          </div>
          <h3 class="text-2xl font-bold text-gray-900" id="statMatters">-</h3>
          <p class="text-gray-500 text-sm" id="statMattersLabel">My Matters</p>
          <div id="mattersBreakdown" class="mt-3 pt-3 border-t border-gray-200 text-xs text-gray-600 hidden">
            <span id="mattersBreakdownText"></span>
          </div>
        </div>

        <div id="statUsersCard" class="bg-white rounded-xl shadow-sm p-6 border border-gray-100 hidden">
          <div class="flex items-center justify-between mb-4">
            <div class="w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center">
              <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
              </svg>
            </div>
          </div>
          <h3 class="text-2xl font-bold text-gray-900" id="statUsers">-</h3>
          <p class="text-gray-500 text-sm">Total Users</p>
          <div id="userBreakdown" class="mt-3 pt-3 border-t border-gray-200 text-xs text-gray-600 space-y-1 hidden">
            <div class="flex justify-between">
              <span>Active:</span>
              <span id="activeUsers" class="font-medium text-gray-900">-</span>
            </div>
            <div class="flex justify-between">
              <span>Other:</span>
              <span id="otherUsers" class="font-medium text-gray-600">-</span>
            </div>
          </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
          <div class="flex items-center justify-between mb-4">
            <div class="w-12 h-12 bg-purple-100 rounded-lg flex items-center justify-center">
              <svg class="w-6 h-6 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
              </svg>
            </div>
          </div>
          <h3 class="text-2xl font-bold text-gray-900" id="statDocuments">-</h3>
          <p class="text-gray-500 text-sm">Documents</p>
          <div id="documentBreakdown" class="mt-3 pt-3 border-t border-gray-200 text-xs text-gray-600 space-y-1 hidden">
            <div class="flex justify-between">
              <span>Active:</span>
              <span id="activeDocuments" class="font-medium text-gray-900">-</span>
            </div>
            <div class="flex justify-between">
              <span>Marked for deletion:</span>
              <span id="deletedDocuments" class="font-medium text-orange-600">-</span>
            </div>
          </div>
        </div>

        <div id="statStorageCard" class="bg-white rounded-xl shadow-sm p-6 border border-gray-100 hidden">
          <div class="flex items-center justify-between mb-4">
            <div class="w-12 h-12 bg-orange-100 rounded-lg flex items-center justify-center">
              <svg class="w-6 h-6 text-orange-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4"></path>
              </svg>
            </div>
          </div>
          <h3 class="text-2xl font-bold text-gray-900" id="statStorage">-</h3>
          <p class="text-gray-500 text-sm">Storage Used <span id="storageUsagePercent" class="font-semibold"></span></p>
          <div id="storageBreakdown" class="mt-3 pt-3 border-t border-gray-200 text-xs text-gray-600 space-y-1 hidden">
            <div class="flex justify-between">
              <span>Database:</span>
              <span id="databaseStorage" class="font-medium text-gray-900">-</span>
            </div>
            <div id="volumeStorageList" class="space-y-1">
              <!-- Volume items will be added dynamically -->
            </div>
          </div>
          <div class="mt-3 pt-3 border-t border-gray-200">
            <a href="admin/health.html" class="inline-flex items-center justify-center w-full px-4 py-2 text-sm font-medium text-indigo-600 bg-indigo-50 rounded-lg hover:bg-indigo-100 transition-colors">
              View details
            </a>
          </div>
        </div>

      </div>

      <!-- User Productivity Widget (Full Width) -->
      <div id="userProductivityWidget" class="bg-white rounded-xl shadow-sm p-6 border border-gray-100 mb-8">
        <div class="mb-4">
          <div class="flex items-start justify-between gap-4">
            <div class="flex items-start gap-2">
              <div>
                <h3 class="text-lg font-semibold text-gray-900">Activity Overview</h3>
                <p class="text-sm text-gray-500 mt-1">Last 90 days of organization activity</p>
              </div>
              <div class="flex-shrink-0">
                <button id="activityHeatmapInfoBtn" type="button" class="p-1 rounded-full text-gray-400 hover:text-gray-600 hover:bg-gray-100 transition-colors" aria-label="How to read the heatmap" title="How to read the heatmap">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M12 16v-4M12 8h.01"/>
                  </svg>
                </button>
              </div>
            </div>
            <!-- User Filter Dropdown (Admins Only) -->
            <div id="activityUserFilterContainer" class="hidden">
              <select id="activityUserFilter" class="block w-64 rounded-lg border-gray-300 text-sm focus:border-indigo-500 focus:ring-indigo-500">
                <option value="me">My Activity</option>
                <option value="all">All Users</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Stats Summary - Simple GitHub-style -->
        <div class="flex items-center gap-6 mb-6 text-sm text-gray-600">
          <div>
            <span id="totalActivities" class="font-semibold text-gray-900">-</span> activities in the last 90 days
          </div>
        </div>

        <!-- Side-by-side Layout: Heatmap + Recent Activity -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

          <!-- Left: Activity Heatmap -->
          <div class="flex flex-col">
            <div id="activityHeatmapContainer" class="w-full min-w-0">
              <!-- Heatmap will be rendered here -->
            </div>
          </div>

          <!-- Right: Recent Activity -->
          <div class="flex flex-col">
            <div class="mb-4 flex items-center justify-between">
              <h4 class="text-base font-semibold text-gray-900">Recent Activity</h4>
              <div class="flex items-center gap-3">
                <button id="refreshActivityFeedBtn" class="text-gray-400 hover:text-gray-600 transition-colors" title="Refresh">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                  </svg>
                </button>
                <button id="viewAllActivityHeaderBtn" class="text-sm text-indigo-600 hover:text-indigo-800 font-medium">View all</button>
              </div>
            </div>
            <!-- Activity Loading Skeleton -->
            <div id="activityFeedLoading" class="divide-y divide-gray-100">
              <div class="p-4 animate-pulse">
                <div class="flex items-start gap-3">
                  <div class="w-10 h-10 bg-gray-200 rounded-full flex-shrink-0"></div>
                  <div class="flex-1">
                    <div class="h-4 bg-gray-200 rounded w-3/4 mb-2"></div>
                    <div class="h-3 bg-gray-200 rounded w-1/2 mb-2"></div>
                    <div class="h-3 bg-gray-200 rounded w-24"></div>
                  </div>
                </div>
              </div>
              <div class="p-4 animate-pulse">
                <div class="flex items-start gap-3">
                  <div class="w-10 h-10 bg-gray-200 rounded-full flex-shrink-0"></div>
                  <div class="flex-1">
                    <div class="h-4 bg-gray-200 rounded w-2/3 mb-2"></div>
                    <div class="h-3 bg-gray-200 rounded w-1/3 mb-2"></div>
                    <div class="h-3 bg-gray-200 rounded w-20"></div>
                  </div>
                </div>
              </div>
              <div class="p-4 animate-pulse">
                <div class="flex items-start gap-3">
                  <div class="w-10 h-10 bg-gray-200 rounded-full flex-shrink-0"></div>
                  <div class="flex-1">
                    <div class="h-4 bg-gray-200 rounded w-4/5 mb-2"></div>
                    <div class="h-3 bg-gray-200 rounded w-2/5 mb-2"></div>
                    <div class="h-3 bg-gray-200 rounded w-28"></div>
                  </div>
                </div>
              </div>
              <div class="p-4 animate-pulse">
                <div class="flex items-start gap-3">
                  <div class="w-10 h-10 bg-gray-200 rounded-full flex-shrink-0"></div>
                  <div class="flex-1">
                    <div class="h-4 bg-gray-200 rounded w-1/2 mb-2"></div>
                    <div class="h-3 bg-gray-200 rounded w-1/4 mb-2"></div>
                    <div class="h-3 bg-gray-200 rounded w-16"></div>
                  </div>
                </div>
              </div>
            </div>
            <!-- Activity Content -->
            <div id="activityFeed" class="hidden divide-y divide-gray-100 max-h-96 overflow-y-auto">
            </div>
          </div>

        </div>
      </div>

    </main>
  </div>

  <!-- Overlay for mobile sidebar -->
  <div id="sidebarOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-20 hidden lg:hidden"></div>

  <!-- Activity Heatmap Info Modal -->
  <div id="activityHeatmapInfoModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center p-4" style="z-index: 9999;" onclick="if(event.target === this) closeActivityHeatmapInfoModal()">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-xl max-h-[90vh] overflow-y-auto" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between p-6 border-b border-gray-200">
        <h2 class="text-xl font-semibold text-gray-900">Understanding the Activity Overview</h2>
        <button type="button" onclick="closeActivityHeatmapInfoModal()" class="text-gray-400 hover:text-gray-600 transition-colors" aria-label="Close">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
      <div class="p-6 space-y-6">
        <div>
          <h3 class="text-sm font-semibold text-gray-900 mb-2">What is this?</h3>
          <p class="text-sm text-gray-600 leading-relaxed">The Activity Overview is a calendar-style chart that shows <strong>when your organization was active</strong> over the last 90 days. Each small square represents one day; the color shows how much activity happened that day.</p>
        </div>
        <div>
          <h3 class="text-sm font-semibold text-gray-900 mb-2">Why does it matter?</h3>
          <p class="text-sm text-gray-600 leading-relaxed">It helps you spot patterns at a glance: which days of the week are busiest, whether activity is steady or concentrated in certain weeks, and how engagement has changed over time. Use it to understand how your team uses the system and when activity peaks.</p>
        </div>
        <div>
          <h3 class="text-sm font-semibold text-gray-900 mb-2">How we track activity</h3>
          <p class="text-sm text-gray-600 leading-relaxed mb-2">Activity is counted from usage across your whole organization. Each time someone in your org uses Lana (for example, starting or replying to conversations, viewing or uploading documents, running searches, or other interactions), that counts as activity. The chart adds up all of these actions per day so you can see when your org is most engaged.</p>
          <p class="text-sm text-gray-600 leading-relaxed">The numbers you see are <strong>total activity events</strong> for that day, not unique users. So a busy day might show a high count because many people used the system or because a few people were very active.</p>
        </div>
        <div>
          <h3 class="text-sm font-semibold text-gray-900 mb-2">What am I looking at?</h3>
          <ul class="text-sm text-gray-600 space-y-2 list-disc pl-5">
            <li><strong class="text-gray-900">Rows.</strong> Each row is a day of the week (Sunday at the top through Saturday at the bottom).</li>
            <li><strong class="text-gray-900">Columns.</strong> Each column is one week. Time runs left to right: older weeks on the left, recent weeks on the right.</li>
            <li><strong class="text-gray-900">Colors.</strong> Each square’s color shows how much activity happened that day. See “Color scale” below for the exact ranges.</li>
          </ul>
        </div>
        <div>
          <h3 class="text-sm font-semibold text-gray-900 mb-2">Color scale</h3>
          <p class="text-sm text-gray-600 leading-relaxed mb-2">The chart uses five levels based on the number of activity events that day:</p>
          <ul class="text-sm text-gray-600 space-y-1.5 list-disc pl-5">
            <li><strong class="text-gray-900">Light gray:</strong> No activity (0 events)</li>
            <li><strong class="text-gray-900">Light green:</strong> Low activity (1 to 4 events)</li>
            <li><strong class="text-gray-900">Medium green:</strong> Moderate activity (5 to 9 events)</li>
            <li><strong class="text-gray-900">Dark green:</strong> High activity (10 to 14 events)</li>
            <li><strong class="text-gray-900">Darkest green:</strong> Very high activity (15 or more events)</li>
          </ul>
          <p class="text-sm text-gray-600 leading-relaxed mt-2">The legend under the chart shows “Less” to “More” as a quick reference.</p>
        </div>
        <div>
          <h3 class="text-sm font-semibold text-gray-900 mb-2">How do I use it?</h3>
          <p class="text-sm text-gray-600 leading-relaxed mb-2"><strong class="text-gray-900">Interacting with the chart.</strong> Hover over any square to see the exact date and activity count for that day. No clicking required; just move your cursor over the chart to explore.</p>
          <p class="text-sm text-gray-600 leading-relaxed mb-2"><strong class="text-gray-900">Using the data for your business.</strong> Use the heatmap to see when your organization is most engaged and spot trends over time. For example:</p>
          <ul class="text-sm text-gray-600 space-y-1.5 list-disc pl-5 mb-2">
            <li>Compare week to week: are recent weeks busier or quieter than earlier ones?</li>
            <li>See which days of the week are busiest (e.g. midweek vs Monday/Friday) so you can plan capacity, support, or training.</li>
            <li>Notice quiet stretches: low or gray activity for many days in a row may mean low adoption, seasonal lulls, or a need to encourage usage.</li>
            <li>Use the pattern as a baseline: once you know your “normal” activity, you can tell when something changes (e.g. after a rollout or a process change).</li>
          </ul>
          <p class="text-sm text-gray-600 leading-relaxed">The chart doesn’t tell you why activity went up or down, but it shows you when it did so you can dig in elsewhere (e.g. reports or conversations) to understand the cause.</p>
        </div>
      </div>
      <div class="p-6 pt-0">
        <button type="button" onclick="closeActivityHeatmapInfoModal()" class="w-full px-4 py-2.5 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition-colors">
          Got it
        </button>
      </div>
    </div>
  </div>

  </template>

  <script src="../js/lex/components/foundation/lex-toast.js"></script>
  <script src="../js/lex/components/foundation/lex-spinner.js"></script>
  <script src="../js/lex/components/foundation/lex-btn.js"></script>
  <script src="../js/lex/components/foundation/lex-empty.js"></script>
  <script src="../js/lex/components/layout/lex-sidebar.js"></script>
  <script src="../js/lex/components/layout/lex-topbar.js"></script>
  <script src="../js/lex/components/layout/lex-conversation-item.js"></script>
  <script src="../js/lex/components/layout/lex-notification-panel.js"></script>
  <script src="../js/lex/components/layout/lex-app.js"></script>
  <script src="../js/lex/components/foundation/lex-breadcrumb.js"></script>

  <!-- Inject page content + hoist modals -->
  <script src="../js/lex/lex-page-init.js"></script>

  <!-- Page controller -->
  <script>

    // ============================================================================
    // CONNECTOR VIEWER SPECIFIC CODE
    // ============================================================================

    // Get URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const uiEntryPoint = urlParams.get('ui');
    const connectorName = urlParams.get('name') || 'Connector';
    const connectorId = urlParams.get('connectorId') || '';

    // Update page title, lex-app header, and breadcrumb
    document.title = `${connectorName} - LanaAI`;
    const lexApp = document.querySelector('lex-app');
    if (lexApp) lexApp.setAttribute('page-title', connectorName);
    const breadcrumb = document.getElementById('connectorBreadcrumb');
    if (breadcrumb) {
      breadcrumb.items = [
        { label: 'Data Connectors', href: 'data-connectors.html' },
        { label: connectorName }
      ];
    }

    // Go back to connectors page
    function goBack() {
      window.history.back();
    }

    // Show error screen
    function showError(message) {
      document.getElementById('error-message').textContent = message;
      document.getElementById('error-screen').classList.add('show');
      document.getElementById('loading-overlay').classList.add('hidden');
    }

    // Load connector UI
    async function loadConnectorUI() {
      try {
        // Validate parameters
        if (!uiEntryPoint) {
          showError('No connector UI specified. Please select a connector from the list.');
          return;
        }

        console.log('[Connector Viewer] Loading UI:', uiEntryPoint);

        // Support both file:// URLs and HTTP URLs (MinIO S3-compatible serving)
        if (uiEntryPoint.startsWith('file://') || uiEntryPoint.startsWith('http://') || uiEntryPoint.startsWith('https://')) {
          const iframe = document.getElementById('connector-frame');

          // Fetch the HTML, inject config BEFORE loading, then load modified HTML
          // Add cache-busting parameter to bypass browser/MinIO caching
          var cacheBustUrl = uiEntryPoint + (uiEntryPoint.indexOf('?') === -1 ? '?' : '&') + '_cb=' + Date.now();
          fetch(cacheBustUrl)
            .then(response => response.text())
            .then(html => {
              console.log('[Connector Viewer] Fetched connector HTML, injecting config...');

              // Build config injection script
              // Get token from global api instance (created by api.js)
              const token = (typeof api !== 'undefined' && api.token) || localStorage.getItem('token') || '';
              console.log('[Connector Viewer] Injecting token:', token ? token.substring(0, 20) + '...' : 'NO TOKEN');

              const configScript = `
                <script>
                  // Injected by connector-viewer - available before any other scripts run
                  window.LanaConfig = ${JSON.stringify(window.LanaConfig || {})};
                  window.LanaConnectorId = "${connectorId}";
                  window.api = { token: "${token}" };
                  localStorage.setItem('lana_token', "${token}");
                  localStorage.setItem('token', "${token}");
                  console.log('[Connector UI] Config injected - API URL:', window.LanaConfig.API_BASE_URL);
                  console.log('[Connector UI] Token injected:', "${token}" ? "${token}".substring(0, 20) + "..." : "NO TOKEN");

                  // Patch fetch to resolve relative URLs against the API base URL
                  // (blob:// origins cannot resolve relative paths like /api/...)
                  (function() {
                    var _originalFetch = window.fetch;
                    var _apiBase = (window.LanaConfig && window.LanaConfig.API_BASE_URL) || '';
                    window.fetch = function(input, init) {
                      if (typeof input === 'string' && input.startsWith('/') && _apiBase) {
                        input = _apiBase + input;
                      }
                      return _originalFetch.call(this, input, init);
                    };
                  })();
                <\/script>
              `;

              // Remove broken CSS links
              html = html.replace(/<link[^>]*href=["']\/css\/tailwind\.css["'][^>]*>/gi, '');

              // Fix relative asset URLs to use absolute MinIO URLs
              // Extract base URL from uiEntryPoint (e.g., http://localhost:9000/lana-connectors/.../v2/ui/)
              const baseUrl = uiEntryPoint.substring(0, uiEntryPoint.lastIndexOf('/') + 1);
              // Replace relative asset paths with absolute URLs
              html = html.replace(/src=["']assets\//gi, `src="${baseUrl}assets/`);
              html = html.replace(/href=["']assets\//gi, `href="${baseUrl}assets/`);
              html = html.replace(/src=["']js\//gi, `src="${baseUrl}js/`);

              // Inject config script, Tailwind, and tab styles at the beginning of <head>
              const tailwindScript = '<script src="https://cdn.tailwindcss.com"><\/script>';
              const tabStyles = `
                <style>
                  /* Ensure tabs display correctly */
                  .tab-button {
                    background: none;
                    border: none;
                    cursor: pointer;
                    position: relative;
                  }
                  .tab-button.active {
                    border-bottom: 2px solid #2563eb !important;
                  }
                </style>
              `;
              html = html.replace('<head>', '<head>' + configScript + tailwindScript + tabStyles);

              // Create blob URL and load modified HTML
              const blob = new Blob([html], { type: 'text/html' });
              const blobUrl = URL.createObjectURL(blob);

              iframe.onload = function() {
                console.log('[Connector Viewer] UI loaded successfully');
                document.getElementById('loading-overlay').classList.add('hidden');
                // Clean up blob URL after load
                URL.revokeObjectURL(blobUrl);
              };

              iframe.onerror = function(error) {
                console.error('[Connector Viewer] Failed to load UI:', error);
                showError('Failed to load connector UI.');
                URL.revokeObjectURL(blobUrl);
              };

              iframe.src = blobUrl;
            })
            .catch(error => {
              console.error('[Connector Viewer] Failed to fetch UI:', error);
              showError('Failed to load connector UI: ' + error.message);
            });

          // Timeout after 30 seconds
          setTimeout(() => {
            const loadingOverlay = document.getElementById('loading-overlay');
            if (!loadingOverlay.classList.contains('hidden')) {
              console.error('[Connector Viewer] Timeout loading UI');
              showError('Loading timeout. The connector UI took too long to load.');
            }
          }, 30000);

        } else {
          // Invalid URL format
          showError('Invalid connector URL format. URL must start with file://, http://, or https://');
        }

      } catch (error) {
        console.error('[Connector Viewer] Error:', error);
        showError(error.message || 'An unexpected error occurred.');
      }
    }

    // Initialize on page load
    loadConnectorUI();

    // ──────────────────────────────────────────────────────────────────
    // postMessage bridge: iframe ↔ parent ↔ Electron IPC
    // ──────────────────────────────────────────────────────────────────

    // Forward iframe requests to open external URLs (for OAuth flow)
    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'lana-open-external') {
        console.log('[Connector Viewer] Opening external URL:', event.data.url);
        if (window.electronAPI && window.electronAPI.openExternal) {
          window.electronAPI.openExternal(event.data.url);
        } else {
          window.open(event.data.url, '_blank');
        }
      }
    });

    // Forward Electron OAuth callbacks into the iframe
    if (window.electronAPI && window.electronAPI.onOAuthCallback) {
      window.electronAPI.onOAuthCallback((callbackData) => {
        console.log('[Connector Viewer] Forwarding OAuth callback to iframe');
        const iframe = document.getElementById('connector-frame');
        if (iframe && iframe.contentWindow) {
          iframe.contentWindow.postMessage({
            type: 'lana-oauth-callback',
            data: callbackData
          }, '*');
        }
      });
    }

    // Handle keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      // ESC to go back
      if (e.key === 'Escape') {
        e.preventDefault();
        goBack();
      }
    });
  </script>

  <!-- Auth guard + loader dismiss (MUST be last) -->
  <script src="../js/auth-guard.js"></script>
</body>
</html>
