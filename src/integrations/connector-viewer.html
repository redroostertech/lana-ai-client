    function captureConfigFormDraft() {
      const configForm = document.getElementById('configForm');
      const webhooksForm = document.getElementById('webhooksForm');
      if (!configForm && !webhooksForm) {
        return {};
      }

      const draft = {};
      const processed = new Set();
      collectNamedFormDraft(configForm, draft, processed);
      collectNamedFormDraft(webhooksForm, draft, processed);

      getCatalogDynamicFields().forEach((field) => {
        if (field.type === 'array') {
          draft[field.name] = getArrayFieldValuesFromDom(field.name, { preserveEmpty: true });
        }
      });

      const selector = document.getElementById('authModeSelect');
      if (selector && selector.value) {
        draft.auth_type = selector.value;
      }

      return draft;
    }

    function handleAuthModeChange() {
      const selector = document.getElementById('authModeSelect');
      if (!selector) return;
      state.formDraft = captureConfigFormDraft();
      state.authModeDraft = selector.value || '';
      renderConfiguration();
    }

    // Read-only rendering of a saved field value. Passwords are masked to the
    // last four characters if long enough; otherwise fully masked.
    function renderReadonlyField(field, value) {
      const label = escapeHtml(field.label || titleCase(field.name));
      const description = field.description ? `<div class="mt-1 text-xs text-gray-500">${escapeHtml(field.description)}</div>` : '';
      let display = '';
      const isPassword = field.type === 'password';
      const isBool = field.type === 'boolean';
      const isMulti = field.type === 'multiselect' || field.type === 'multi_select';

      if (value === null || typeof value === 'undefined' || value === '') {
        display = `<span class="text-gray-400">Not set</span>`;
      } else if (isPassword) {
        const raw = String(value);
        const tail = raw.length > 4 ? raw.slice(-4) : '';
        display = tail ? `<span class="connector-mono">•••••••• ${escapeHtml(tail)}</span>` : `<span class="connector-mono">••••••••</span>`;
      } else if (isBool) {
        display = value ? 'Yes' : 'No';
      } else if (isMulti || Array.isArray(value)) {
        const list = Array.isArray(value) ? value : String(value).split(',').map((s) => s.trim()).filter(Boolean);
        display = list.length
          ? list.map((v) => `<span class="mr-2 inline-flex rounded-full border border-gray-200 bg-gray-50 px-2 py-0.5 text-xs text-gray-700">${escapeHtml(String(v))}</span>`).join('')
          : `<span class="text-gray-400">None</span>`;
      } else {
        display = `<span class="break-all">${escapeHtml(String(value))}</span>`;
      }

      return `
        <div class="rounded-xl border border-gray-200 bg-gray-50 p-3">
          <div class="text-xs font-semibold uppercase tracking-wide text-gray-500">${label}</div>
          <div class="mt-1 text-sm text-gray-900">${display}</div>
          ${description}
        </div>
      `;
    }

                <path d="M12 17h.01" />

    async function confirmDeleteConfig() {
      const button = document.getElementById('confirmDeleteConfigBtn');
      const originalLabel = button ? button.textContent : '';
      try {
        if (button) {
          button.disabled = true;
          button.textContent = 'Deleting...';
        }
        await disconnectConnector();
        state.editingConfig = false;
        closeDeleteConfigModal();
      } catch (error) {
        if (button) {

          button.textContent = originalLabel || 'Delete Configuration';

    function updateSyncSettingsVisibility() {
      const syncFrequency = document.getElementById('syncFrequency');
      const scheduledGroup = document.getElementById('scheduledTimeGroup');
      if (!syncFrequency || !scheduledGroup) return;
      const visible = ['daily', 'weekly'].includes(syncFrequency.value);
      scheduledGroup.classList.toggle('hidden', !visible);
      refreshSyncSettingsButtonState();
    }

    function refreshSyncSettingsButtonState() {
      const button = document.getElementById('saveSyncSettingsBtn');
      const hint = document.getElementById('saveSyncSettingsHint');
      if (!button) return;
      const ready = isConnectorReady();
      button.disabled = !ready;
      if (hint) {
        if (ready) {
          hint.textContent = '';
        } else if (!isConnectorConfigured()) {
          hint.textContent = 'Save credentials first to update sync settings.';
        } else if (isOAuthConnector() && !isOAuthAuthorized()) {
          hint.textContent = 'Complete OAuth authorization first.';
        } else {
          hint.textContent = '';
        }
      }
    }

    async function saveSyncSettings() {
      if (!state.sourceId) return;
      if (!isConnectorReady()) {
        showPageAlert('Save credentials and complete setup before updating sync settings.', 'error');
        return;
      }
      const button = document.getElementById('saveSyncSettingsBtn');
      const syncFrequency = document.getElementById('syncFrequency');
      const scheduledSyncTime = document.getElementById('scheduledSyncTime');
      if (!syncFrequency) return;

      const originalLabel = button ? button.textContent : '';
      try {
        if (button) {
          button.disabled = true;
          button.textContent = 'Saving...';
        }
        const payload = { sync_frequency: syncFrequency.value };
        if (syncFrequency.value === 'daily' || syncFrequency.value === 'weekly') {
          payload.scheduled_sync_time = (scheduledSyncTime && scheduledSyncTime.value) || '08:00:00';
        }
        await api.patch(connectorApi('/sync-settings'), payload);
        await refreshBaseData(false);
        showPageAlert('Sync settings updated.', 'success');
      } catch (error) {
        console.error('[Connector Viewer] Failed to save sync settings', error);
        showPageAlert(error.message || 'Failed to update sync settings.', 'error');
      } finally {
        if (button) {
          button.textContent = originalLabel || 'Update Sync Settings';
          refreshSyncSettingsButtonState();
        }
      }
    }

    /**
     * Render the Documentation tab entirely from connector.json.
     *
     * Preferred structure (authored per-connector):
     *
     *   documentation.setup_guide = {
     *     intro: "string — what this guide helps the user accomplish",
     *     audience_note: "string — optional line written for non-technical readers",
     *     prerequisites: ["string", ...],
     *     steps: [
     *       {
     *         title: "Step title",
     *         body: "string or [string]",
     *         instructions: ["explicit line-by-line sub-steps"],
     *         tip: "optional helpful note",
     *         warning: "optional hard warning",
     *         code: { label: "what this value is", value: "literal text to copy" },
     *         external_link: { label: "Where to go", url: "https://..." }
     *       },
     *       ...
     *     ],
     *     troubleshooting: [{ title, detail }],
     *     support: "string"
     *   }
     *
     * Falls back to the legacy `documentation.connect_steps` list + the
     * existing `troubleshooting` / `getting_started` fields when no
     * setup_guide is authored, so connectors not yet rewritten still render.
     */
    function renderDocumentationGuide() {
      const node = document.getElementById('generatedDocsGuide');
      if (!node) return;
      const docsUrl = getDocumentationLink();
      const catalog = state.catalog || {};
      const documentation = catalog.documentation || {};
      const guide = documentation.setup_guide || null;

      const baseTitle = state.connectorName || documentation.title || catalog.name || 'Connector';
      const title = guide?.title
        || (/setup guide/i.test(String(documentation.title || '')) ? documentation.title : `${baseTitle} Setup Guide`);
      const description = guide?.description || documentation.description || '';

      // Normalize to the rich structure. Legacy packages emit only
      // connect_steps + getting_started — we'll render those as a bare list.
      const intro = guide?.intro || description || '';
      const audienceNote = guide?.audience_note || 'Follow each step in order. You don\'t need to be technical — every click and field is spelled out below.';
      const prerequisites = Array.isArray(guide?.prerequisites) ? guide.prerequisites : [];
      const steps = Array.isArray(guide?.steps) ? guide.steps : normalizeLegacyConnectSteps(documentation.connect_steps);
      const troubleshooting = Array.isArray(guide?.troubleshooting)
        ? guide.troubleshooting
        : (Array.isArray(documentation.troubleshooting) ? documentation.troubleshooting : []);
      const support = guide?.support || documentation.support || '';
      const gettingStarted = Array.isArray(documentation.getting_started) ? documentation.getting_started : [];

      const headerHtml = `
        <div class="flex flex-wrap items-start justify-between gap-4">
          <div>
            <div class="connector-label">Setup Guide</div>
            <h3 class="mt-2 text-2xl font-semibold text-gray-900">${escapeHtml(title)}</h3>
            ${intro ? `<p class="mt-3 max-w-3xl text-sm text-gray-600">${escapeHtml(intro)}</p>` : ''}
            ${audienceNote ? `<p class="mt-2 max-w-3xl text-xs text-gray-500">${escapeHtml(audienceNote)}</p>` : ''}
          </div>
          ${docsUrl ? `
            <a href="${escapeHtml(docsUrl)}" target="_blank" rel="noreferrer" class="rounded-xl border border-blue-300 bg-white px-4 py-2 text-sm font-semibold text-blue-700 hover:bg-blue-50">
              Vendor API Docs
            </a>
          ` : ''}
        </div>
      `;

      const prereqHtml = prerequisites.length ? `
        <div class="mt-8 rounded-xl border border-blue-200 bg-blue-50 p-5">
          <div class="text-sm font-semibold text-blue-900">Before you start</div>
          <ul class="mt-3 list-disc space-y-2 pl-5 text-sm text-blue-900">
            ${prerequisites.map((p) => `<li>${escapeHtml(p)}</li>`).join('')}
          </ul>
        </div>
      ` : '';

      const stepsHtml = steps.length ? `
        <ol class="mt-8 space-y-6">
          ${steps.map((step, index) => renderDocStep(step, index + 1)).join('')}
        </ol>
      ` : '';

      const gettingStartedHtml = gettingStarted.length ? `
        <div class="mt-10">
          <h4 class="text-base font-semibold text-gray-900">After you\'re connected</h4>
          <ul class="mt-3 list-disc space-y-2 pl-5 text-sm text-gray-700">
            ${gettingStarted.map((line) => `<li>${escapeHtml(line)}</li>`).join('')}
          </ul>
        </div>
      ` : '';

      const troubleshootingHtml = troubleshooting.length ? `
        <div class="mt-10">
          <h4 class="text-base font-semibold text-gray-900">Troubleshooting</h4>
          <div class="mt-3 space-y-3">
            ${troubleshooting.map((entry) => `
              <div class="rounded-xl border border-gray-200 p-4">
                <div class="text-sm font-semibold text-gray-900">${escapeHtml(entry.title || 'Issue')}</div>
                ${entry.detail ? `<div class="mt-2 text-sm text-gray-600">${escapeHtml(entry.detail)}</div>` : ''}
              </div>
            `).join('')}
          </div>
        </div>
      ` : '';

      const supportHtml = support ? `
        <div class="mt-10 rounded-xl border border-gray-200 bg-gray-50 p-5 text-sm text-gray-700">
          <span class="font-semibold text-gray-900">Need more help?</span>
          <span class="ml-1">${escapeHtml(support)}</span>
        </div>
      ` : '';

      node.innerHTML = headerHtml + prereqHtml + stepsHtml + gettingStartedHtml + troubleshootingHtml + supportHtml;
    }

    function renderDocStep(step, number) {
      if (!step) return '';
      const title = step.title || `Step ${number}`;
      const bodyLines = Array.isArray(step.body) ? step.body : (step.body ? [step.body] : []);
      const instructions = Array.isArray(step.instructions) ? step.instructions : [];
      const tip = step.tip || '';
      const warning = step.warning || '';
      const link = step.external_link || null;
      const code = step.code || null;
      const image = step.image || '';

      return `
        <li class="rounded-2xl border border-gray-200 bg-white p-5">
          <div class="flex items-start gap-4">
            <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-blue-100 text-sm font-semibold text-blue-700">${number}</div>
            <div class="min-w-0 flex-1">
              <h4 class="text-base font-semibold text-gray-900">${escapeHtml(title)}</h4>
              ${bodyLines.length ? bodyLines.map((line) => `<p class="mt-2 text-sm text-gray-700">${escapeHtml(line)}</p>`).join('') : ''}

              ${instructions.length ? `
                <ol class="mt-3 list-decimal space-y-1.5 pl-5 text-sm text-gray-700">
                  ${instructions.map((line) => `<li>${escapeHtml(line)}</li>`).join('')}
                </ol>
              ` : ''}

              ${link ? `
                <a href="${escapeHtml(link.url)}" target="_blank" rel="noreferrer" class="mt-3 inline-flex items-center gap-1 text-sm font-semibold text-blue-700 hover:text-blue-800">
                  ${escapeHtml(link.label || 'Open link')}
                  <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                </a>
              ` : ''}

              ${code ? `
                <div class="mt-3 rounded-lg border border-gray-200 bg-gray-50 p-3">
                  ${code.label ? `<div class="text-xs font-semibold uppercase tracking-wide text-gray-500">${escapeHtml(code.label)}</div>` : ''}
                  <div class="mt-1 flex items-center gap-2">
                    <code class="connector-mono break-all text-xs text-gray-900">${escapeHtml(code.value || '')}</code>
                    <button type="button" class="shrink-0 rounded-md border border-gray-300 px-2 py-1 text-xs font-semibold text-gray-700 hover:bg-white" onclick="copyTextToClipboard('${escapeJsString(code.value || '')}')">Copy</button>
                  </div>
                </div>
              ` : ''}

              ${image ? `<img src="${escapeHtml(image)}" alt="${escapeHtml(title)}" class="mt-3 max-w-full rounded-lg border border-gray-200">` : ''}

              ${tip ? `
                <div class="mt-3 rounded-lg border border-green-200 bg-green-50 px-3 py-2 text-xs text-green-900">
                  <span class="font-semibold">Tip:</span> ${escapeHtml(tip)}
                </div>
              ` : ''}

              ${warning ? `
                <div class="mt-3 rounded-lg border border-amber-200 bg-amber-50 px-3 py-2 text-xs text-amber-900">
                  <span class="font-semibold">Heads up:</span> ${escapeHtml(warning)}
                </div>
              ` : ''}
            </div>
          </div>
        </li>
      `;
    }

    function normalizeLegacyConnectSteps(connectSteps) {
      if (!Array.isArray(connectSteps) || !connectSteps.length) return [];
      return connectSteps.map((line, idx) => ({
        title: `Step ${idx + 1}`,
        body: line
      }));
    }

    function escapeJsString(value) {
      return String(value || '').split('\\').join('\\\\').split("'").join("\\'").split('\n').join('\\n');
    }

    function copyTextToClipboard(value) {
      if (!value) return;
      const str = String(value);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(str).then(
          () => showPageAlert('Copied to clipboard.', 'success'),
          () => showPageAlert('Clipboard copy blocked by browser.', 'error')
        );
        return;
      }
      const textarea = document.createElement('textarea');
      textarea.value = str;
      textarea.style.position = 'fixed';
      textarea.style.top = '-1000px';
      document.body.appendChild(textarea);
      textarea.select();
      try { document.execCommand('copy'); showPageAlert('Copied to clipboard.', 'success'); }
      catch (_e) { showPageAlert('Clipboard copy blocked by browser.', 'error'); }
      document.body.removeChild(textarea);
    }

    const DATA_RULE_FIELDS = [
      { value: 'external_id', label: 'External ID (LANA-prefixed, e.g. AS-244)' },
      { value: 'entity_type', label: 'Entity Type' },
      { value: 'matter_id', label: 'Assigned Matter (LANA)' },
      { value: 'synced_at', label: 'Synced At' },
      { value: 'source_created_at', label: 'Source Created At' },
      { value: 'source_updated_at', label: 'Source Updated At' },
      { value: 'annotation_count', label: 'Annotation Count' },
      { value: 'has_corrections', label: 'Has Corrections (true/false)' },
      { value: 'has_flags', label: 'Has Flags (true/false)' },
      { value: '__data_path__', label: 'Source data field…' }
    ];

    const DATA_RULE_OPERATORS = [
      { value: 'contains', label: 'contains', valueless: false },
      { value: 'not_contains', label: 'does not contain', valueless: false },
      { value: 'equals', label: 'equals', valueless: false },
      { value: 'not_equals', label: 'does not equal', valueless: false },
      { value: 'starts_with', label: 'starts with', valueless: false },
      { value: 'ends_with', label: 'ends with', valueless: false },
      { value: 'exists', label: 'is set', valueless: true },
      { value: 'not_exists', label: 'is empty', valueless: true }
    ];

    function isValuelessOperator(op) {
      const entry = DATA_RULE_OPERATORS.find((o) => o.value === op);
      return Boolean(entry && entry.valueless);
    }

    function renderDataRuleBuilder() {
      const container = document.getElementById('dataRulesContainer');
      if (!container) return;

      if (!state.dataRules.length) {
        container.innerHTML = `
          <div class="rounded-xl border border-dashed border-gray-300 p-4 text-sm text-gray-500">
            No rules yet. Add rules to filter on Entity Type, Matter ID, Health, and other indexed fields.
          </div>
        `;
        return;
      }

      const indexedFieldValues = DATA_RULE_FIELDS
        .filter((f) => f.value !== '__data_path__')
        .map((f) => f.value);

      const fieldOptions = (selectedField, isDataPathMode) => DATA_RULE_FIELDS
        .map((f) => {
          const isSelected = (f.value === '__data_path__' && isDataPathMode)
            || (f.value === selectedField && !isDataPathMode);
          return `<option value="${f.value}" ${isSelected ? 'selected' : ''}>${f.label}</option>`;
        })
        .join('');

      const operatorOptions = (selected) => DATA_RULE_OPERATORS
        .map((o) => `<option value="${o.value}" ${selected === o.value ? 'selected' : ''}>${o.label}</option>`)
        .join('');

      container.innerHTML = state.dataRules.map((rule, index) => {
        const valueless = isValuelessOperator(rule.operator);
        const fieldRaw = rule.field || '';
        const isDataPathMode = fieldRaw.startsWith('data.');
        const isKnownField = indexedFieldValues.includes(fieldRaw);
        // Treat any non-empty, non-indexed, non-data.* field as a data-path entry too,
        // so a rule with field="custom_key" still survives a re-render.
        const treatAsDataPath = isDataPathMode || (fieldRaw && !isKnownField);
        const dataPathValue = isDataPathMode ? fieldRaw.slice('data.'.length) : (treatAsDataPath ? fieldRaw : '');
        const fieldSelectValue = treatAsDataPath ? '__data_path__' : fieldRaw;
        return `
          <div class="data-rule-row space-y-2 rounded-xl border border-gray-200 bg-gray-50 p-3" data-index="${index}" data-mode="${treatAsDataPath ? 'data' : 'indexed'}">
            <div class="flex items-start gap-2">
              <select data-role="field" onchange="onDataRuleFieldChange(${index}, this.value)" class="flex-1 min-w-0 rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200">
                <option value="" ${!fieldRaw ? 'selected' : ''}>Pick a field…</option>
                ${fieldOptions(fieldSelectValue, treatAsDataPath)}
              </select>
              <button type="button" onclick="removeDataRule(${index})" aria-label="Remove rule" class="shrink-0 rounded-lg border border-gray-200 bg-white p-2 text-gray-500 hover:border-red-200 hover:bg-red-50 hover:text-red-600">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
                  <path d="M18 6 6 18" /><path d="m6 6 12 12" />
                </svg>
              </button>
            </div>
            <div class="${treatAsDataPath ? '' : 'hidden'} flex items-center gap-2">
              <span class="text-xs font-semibold text-gray-500">data.</span>
              <input data-role="data-path" type="text" value="${escapeHtml(dataPathValue)}" placeholder="e.g. matter_id" class="flex-1 min-w-0 rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200">
            </div>
            <div class="flex items-start gap-2">
              <select data-role="operator" onchange="onDataRuleOperatorChange(${index}, this.value)" class="rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200" style="flex: 0 0 auto; max-width: 50%;">
                ${operatorOptions(rule.operator || 'contains')}
              </select>
              <input data-role="value" type="text" value="${escapeHtml(rule.value || '')}" placeholder="Value" class="flex-1 min-w-0 rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200 ${valueless ? 'hidden' : ''}">
            </div>
          </div>
        `;
      }).join('');
    }

    function syncDataRulesFromDom() {
      const rows = document.querySelectorAll('.data-rule-row');
      state.dataRules = Array.from(rows).map((row) => {
        const fieldEl = row.querySelector('[data-role="field"]');
        const operatorEl = row.querySelector('[data-role="operator"]');
        const valueEl = row.querySelector('[data-role="value"]');
        const dataPathEl = row.querySelector('[data-role="data-path"]');
        const operator = operatorEl ? operatorEl.value : 'contains';
        const fieldSelectValue = fieldEl ? fieldEl.value.trim() : '';
        let field = fieldSelectValue;
        if (fieldSelectValue === '__data_path__') {
          const path = dataPathEl ? dataPathEl.value.trim() : '';
          field = path ? `data.${path}` : '__data_path__';
        }
        return {
          field,
          operator,
          value: valueEl && !isValuelessOperator(operator) ? valueEl.value : ''
        };
      });
    }

    function onDataRuleFieldChange(index, newField) {
      syncDataRulesFromDom();
      if (state.dataRules[index]) {
        // Picker changed: clear the field so the renderer treats it correctly,
        // letting the next sync (or render) re-establish based on the select choice.
        if (newField === '__data_path__') {
          // Keep current value so user can edit the path; renderer reads from DOM
        } else if (newField === '') {
          state.dataRules[index].field = '';
        } else {
          state.dataRules[index].field = newField;
        }
      }
      renderDataRuleBuilder();
    }

    function onDataRuleOperatorChange(index, newOperator) {
      syncDataRulesFromDom();
      if (state.dataRules[index]) {
        state.dataRules[index].operator = newOperator;
      }
      renderDataRuleBuilder();
    }

    function addDataRule() {
      syncDataRulesFromDom();
      state.dataRules.push({ field: '', operator: 'contains', value: '' });
      renderDataRuleBuilder();
    }

    function removeDataRule(index) {
      syncDataRulesFromDom();
      state.dataRules.splice(index, 1);
      renderDataRuleBuilder();
    }

    function getCurrentDataFilters() {
      syncDataRulesFromDom();
      const submittable = state.dataRules.filter((rule) => {
        if (!rule.field || rule.field === '__data_path__') return false;
        if (isValuelessOperator(rule.operator)) return true;
        return String(rule.value || '') !== '';
      });
      return {
        q: document.getElementById('dataSearchInput')?.value.trim() || '',
        entity_type: document.getElementById('entityTypeFilter')?.value || '',
        sort_by: document.getElementById('dataSortBy')?.value || 'synced_at',
        sort_dir: document.getElementById('dataSortDir')?.value || 'desc',
        filters: submittable
      };
    }

    function renderField(field, value) {
      const safeName = escapeHtml(field.name);
      const safeLabel = escapeHtml(field.label || field.name);
      const safeHelp = field.help_text ? `<p class="mt-2 text-xs text-gray-500">${escapeHtml(field.help_text)}</p>` : '';
      const requiredMark = field.required ? '<span class="text-red-500">*</span>' : '';
      const fieldOptions = getSelectableFieldOptions(field, value);

      if (field.type === 'boolean') {
        return `
          <label class="block rounded-2xl border border-gray-200 p-4">
            <div class="flex items-center justify-between gap-4">
              <div>
                <div class="text-sm font-medium text-gray-900">${safeLabel} ${requiredMark}</div>
                ${safeHelp}
              </div>
              <input type="checkbox" name="${safeName}" ${value ? 'checked' : ''} class="h-5 w-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
            </div>
          </label>
        `;
      }

      if (field.type === 'select') {
        const currentValue = value == null ? '' : String(value);
        return `
          <label class="block">
            <div class="mb-2 text-sm font-medium text-gray-900">${safeLabel} ${requiredMark}</div>
            <select
              name="${safeName}"
              data-required="${field.required ? 'true' : 'false'}"
              ${field.required ? 'required' : ''}
              class="w-full rounded-xl border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
            >
              ${fieldOptions.map((option) => {
                const optionValue = String(option?.value ?? '');
                const optionLabel = String(option?.label ?? optionValue);
                return `<option value="${escapeHtml(optionValue)}" ${optionValue === currentValue ? 'selected' : ''}>${escapeHtml(optionLabel)}</option>`;
              }).join('')}
            </select>
            ${safeHelp}
          </label>
        `;
      }

      if (field.type === 'multiselect') {
        const selectedValues = Array.isArray(value)
          ? value.map((item) => String(item))
          : (typeof value === 'string' && value
            ? value.split(',').map((item) => item.trim()).filter(Boolean)
            : []);
        return `
          <label class="block">
            <div class="mb-2 text-sm font-medium text-gray-900">${safeLabel} ${requiredMark}</div>
            <select
              name="${safeName}"
              multiple
              data-required="${field.required ? 'true' : 'false'}"
              ${field.required ? 'required' : ''}
              class="min-h-[140px] w-full rounded-xl border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
            >
              ${fieldOptions.map((option) => {
                const optionValue = String(option?.value ?? '');
                const optionLabel = String(option?.label ?? optionValue);
                return `<option value="${escapeHtml(optionValue)}" ${selectedValues.includes(optionValue) ? 'selected' : ''}>${escapeHtml(optionLabel)}</option>`;
              }).join('')}
            </select>
            ${safeHelp}
          </label>
        `;
      }

      if (field.type === 'multiselect_dynamic') {
        const selectedValues = Array.isArray(value)
          ? value.map((item) => String(item))
          : (typeof value === 'string' && value
            ? value.split(',').map((item) => item.trim()).filter(Boolean)
            : []);
        const isLoading = Boolean(state.dynamicFieldLoading[field.name]);
        const errorMessage = state.dynamicFieldErrors[field.name];
        const buttonLabel = getDynamicDiscoveryButtonLabel(field);
        return `
          <label class="block">
            <div class="mb-2 flex flex-wrap items-center justify-between gap-3">
              <div class="text-sm font-medium text-gray-900">${safeLabel} ${requiredMark}</div>
              <button
                type="button"
                onclick="discoverDynamicFieldOptions('${escapeHtml(field.name)}')"
                class="rounded-lg border border-blue-200 px-3 py-1.5 text-xs font-semibold text-blue-700 hover:bg-blue-50 ${isLoading ? 'opacity-60 cursor-wait' : ''}"
                ${isLoading ? 'disabled aria-disabled="true"' : ''}
              >
                ${escapeHtml(isLoading ? 'Loading…' : buttonLabel)}
              </button>
            </div>
            <select
              name="${safeName}"
              multiple
              data-required="${field.required ? 'true' : 'false'}"
              ${field.required ? 'required' : ''}
              class="min-h-[140px] w-full rounded-xl border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
            >
              ${fieldOptions.map((option) => {
                const optionValue = String(option?.value ?? '');
                const optionLabel = String(option?.label ?? optionValue);
                return `<option value="${escapeHtml(optionValue)}" ${selectedValues.includes(optionValue) ? 'selected' : ''}>${escapeHtml(optionLabel)}</option>`;
              }).join('')}
            </select>
            ${safeHelp}
            <p class="mt-2 text-xs text-gray-500">${fieldOptions.length ? `${fieldOptions.length} option${fieldOptions.length === 1 ? '' : 's'} available.` : 'No options loaded yet. Discover options after entering the required configuration above.'}</p>
            ${errorMessage ? `<p class="mt-2 text-xs text-red-600">${escapeHtml(errorMessage)}</p>` : ''}
          </label>
        `;
      }

      const inputType = field.type === 'password'
        ? 'password'
        : field.type === 'number'
          ? 'number'
          : field.type === 'date'
            ? 'date'
          : 'text';
      const inputValue = value == null ? '' : String(value);

      return `
        <label class="block">
          <div class="mb-2 text-sm font-medium text-gray-900">${safeLabel} ${requiredMark}</div>
          <input
            name="${safeName}"
            type="${inputType}"
            value="${escapeHtml(inputValue)}"
            data-required="${field.required ? 'true' : 'false'}"
            ${field.required ? 'required' : ''}
            class="w-full rounded-xl border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
          >
          ${safeHelp}
        </label>
      `;
    }

    function renderBulkActionSummary() {
      const node = document.getElementById('bulkActionSummary');
      const rows = state.dataPreview && Array.isArray(state.dataPreview.data) ? state.dataPreview.data : [];
      const filteredTotal = state.dataPreview?.pagination?.total || 0;
      const allFiltered = state.selectionMode === 'all-filtered';
      const targetLabel = allFiltered
        ? `${formatNumber(filteredTotal)} filtered row${filteredTotal === 1 ? '' : 's'}`
        : `${state.selectedDataIds.length} row${state.selectedDataIds.length === 1 ? '' : 's'}`;

      if (node) {
        node.innerHTML = `
          <div class="space-y-2">
            <div class="flex items-center justify-between gap-4">
              <span>Will assign</span>
              <span class="font-semibold text-gray-900">${targetLabel}</span>
            </div>
            <div class="flex items-center justify-between gap-4">
              <span>Visible rows</span>
              <span class="font-semibold text-gray-900">${rows.length}</span>
            </div>
            <div class="flex items-center justify-between gap-4">
              <span>Filtered total</span>
              <span class="font-semibold text-gray-900">${formatNumber(filteredTotal)}</span>
            </div>
          </div>
        `;
      }

      updateAssignSelectedButton();
      updateUnassignSelectedButton();
      updateShortlistSelectedButton();
      renderMatterDropdownHint();
    }

    function getCurrentSelectionCount() {
      if (state.selectionMode === 'all-filtered') {
        return state.dataPreview?.pagination?.total || 0;
      }
      return state.selectedDataIds.length;
    }

    function renderSelectionToolbar() {
      const node = document.getElementById('selectionToolbar');
      if (!node) return;

      const rows = state.dataPreview && Array.isArray(state.dataPreview.data) ? state.dataPreview.data : [];
      const filteredTotal = state.dataPreview?.pagination?.total || 0;
      const pageCount = rows.length;
      const allFiltered = state.selectionMode === 'all-filtered';
      const manualCount = state.selectedDataIds.length;

      let label;
      if (allFiltered) {
        label = `<span class="font-semibold text-blue-700">All ${formatNumber(filteredTotal)} filtered selected</span>`;
      } else if (manualCount === 0) {
        label = `<span class="text-gray-500">No rows selected</span>`;
      } else {
        label = `<span class="font-semibold text-gray-900">${formatNumber(manualCount)} selected</span>`;
      }

      const hasSelection = allFiltered || manualCount > 0;
      const canSelectAllFiltered = filteredTotal > 0 && filteredTotal !== pageCount;

      const buttons = [];
      if (pageCount > 0) {
        buttons.push(`<button type="button" onclick="selectPageRows()" class="rounded-lg border border-gray-300 bg-white px-2 py-1 font-semibold text-gray-700 hover:bg-gray-50">Select page (${formatNumber(pageCount)})</button>`);
      }
      if (canSelectAllFiltered) {
        buttons.push(`<button type="button" onclick="selectAllFiltered()" class="rounded-lg border border-blue-300 bg-blue-50 px-2 py-1 font-semibold text-blue-700 hover:bg-blue-100">Select all filtered (${formatNumber(filteredTotal)})</button>`);
      }
      if (hasSelection) {
        buttons.push(`<button type="button" onclick="clearAssignSelection()" class="rounded-lg border border-gray-300 bg-white px-2 py-1 font-semibold text-gray-700 hover:bg-gray-50">Clear</button>`);
      }

      node.innerHTML = `
        <span class="text-gray-500">Selection:</span>
        ${label}
        <span class="mx-1 h-4 w-px bg-gray-300"></span>
        ${buttons.join('')}
      `;
    }

    function selectPageRows() {
      const rows = state.dataPreview && Array.isArray(state.dataPreview.data) ? state.dataPreview.data : [];
      state.selectionMode = 'manual';
      for (const row of rows) {
        if (row && row.id) {
          if (!state.selectedDataIds.includes(row.id)) {
            state.selectedDataIds.push(row.id);
          }
          state.selectedRowsById[row.id] = row;
        }
      }
      renderDataPreview();
      scheduleCascadePanelRefresh();
    }

    function selectAllFiltered() {
      const filteredTotal = state.dataPreview?.pagination?.total || 0;
      if (!filteredTotal) {
        showPageAlert('No filtered rows to select.', 'info');
        return;
      }
      state.selectionMode = 'all-filtered';
      state.selectedDataIds = [];
      state.selectedRowsById = {};
      renderDataPreview();
      scheduleCascadePanelRefresh();
    }

    function clearAssignSelection() {
      state.selectionMode = 'manual';
      state.selectedDataIds = [];
      state.selectedRowsById = {};
      renderDataPreview();
      scheduleCascadePanelRefresh();
    }

    function updateAssignSelectedButton() {
      const button = document.getElementById('assignSelectedButton');
      if (!button) return;
      const count = getCurrentSelectionCount();
      const matterId = document.getElementById('dataMatterSelect')?.value || '';
      const matterName = matterId
        ? (state.matterOptions.find((m) => m.id === matterId)?.name || 'Selected matter')
        : '';
      const allFiltered = state.selectionMode === 'all-filtered';
      const cascadeChildren = state.cascadeEnabled
        && state.cascadePanelPreview
        && Number(state.cascadePanelPreview.totalChildren || 0) > 0
        ? Number(state.cascadePanelPreview.totalChildren)
        : 0;

      const linkedSuffix = cascadeChildren > 0 ? ` + ${formatNumber(cascadeChildren)} linked` : '';
      const target = matterName || 'new matter';

      let label;
      if (count === 0) {
        label = 'Assign Selected';
      } else if (allFiltered) {
        label = matterName
          ? `Assign ${formatNumber(count)} filtered → ${matterName}`
          : `Assign ${formatNumber(count)} filtered to new matter`;
      } else {
        label = `Assign ${formatNumber(count)}${linkedSuffix} → ${target}`;
      }
      button.textContent = label;
      button.disabled = count === 0;
      button.classList.toggle('opacity-60', count === 0);
      button.classList.toggle('cursor-not-allowed', count === 0);
    }

    function updateUnassignSelectedButton() {
      const button = document.getElementById('unassignSelectedButton');
      if (!button) return;
      const count = getCurrentSelectionCount();
      const allFiltered = state.selectionMode === 'all-filtered';
      button.disabled = count === 0;
      if (count === 0) {
        button.textContent = 'Unassign Selected';
      } else if (allFiltered) {
        button.textContent = `Unassign ${formatNumber(count)} filtered from matter`;
      } else {
        button.textContent = `Unassign ${formatNumber(count)} from matter`;
      }
    }

    function updateShortlistSelectedButton() {
      const button = document.getElementById('shortlistSelectedButton');
      const hint = document.getElementById('shortlistHint');
      if (!button) return;
      const allFiltered = state.selectionMode === 'all-filtered';
      const manualCount = state.selectedDataIds.length;
      const disabled = allFiltered || manualCount === 0;
      button.disabled = disabled;
      if (manualCount === 0 && !allFiltered) {
        button.textContent = 'Flag Selected For Review';
      } else if (allFiltered) {
        button.textContent = 'Flag Selected For Review';
      } else {
        button.textContent = `Flag ${formatNumber(manualCount)} For Review`;
      }
      if (hint) {
        if (allFiltered) {
          hint.textContent = 'Flagging requires individual row selection. Pick rows manually or use "Select page" to flag a single page at a time.';
        } else if (manualCount === 0) {
          hint.textContent = 'Pick one or more rows to flag for review.';
        } else {
          hint.textContent = '';
        }
      }
    }

    function renderMatterDropdownHint() {
      const hint = document.getElementById('matterDropdownHint');
      if (!hint) return;
      const matterId = document.getElementById('dataMatterSelect')?.value || '';
      hint.textContent = matterId
        ? ''
        : 'A new matter will be created when you assign — you\'ll name it in the next step.';
    }

    function onMatterDropdownChange() {
      renderMatterDropdownHint();
      updateAssignSelectedButton();
    }

    function getDependentEntitiesMap() {
      const declared = state.catalog && state.catalog.relationships;
      if (!declared || typeof declared !== 'object' || Array.isArray(declared)) return {};
      const map = {};
      for (const [parent, rels] of Object.entries(declared)) {
        if (!Array.isArray(rels)) continue;
        const cleaned = rels
          .filter((rel) => rel && typeof rel === 'object' && rel.entity_type && rel.via)
          .map((rel) => ({
            entity_type: String(rel.entity_type),
            label: rel.label ? String(rel.label) : titleCase(String(rel.entity_type)),
            via: String(rel.via),
            match: rel.match ? String(rel.match) : 'external_id',
            transitive: Array.isArray(rel.transitive)
              ? rel.transitive
                  .filter((t) => t && t.entity_type && t.via)
                  .map((t) => ({
                    entity_type: String(t.entity_type),
                    label: t.label ? String(t.label) : titleCase(String(t.entity_type)),
                    via: String(t.via),
                    match: t.match ? String(t.match) : 'external_id'
                  }))
              : []
          }));
        if (cleaned.length) map[parent] = cleaned;
      }
      return map;
    }

    function hasAnyDependentEntities() {
      const map = getDependentEntitiesMap();
      return Object.keys(map).length > 0;
    }

    function getRelationshipsForEntity(entityType) {
      if (!entityType) return [];
      const map = getDependentEntitiesMap();
      return Array.isArray(map[entityType]) ? map[entityType] : [];
    }

    function readPathValue(row, path) {
      if (!row || !path) return null;
      const segments = String(path).split('.').filter(Boolean);
      let cursor = row;
      for (const segment of segments) {
        if (cursor == null || typeof cursor !== 'object') return null;
        cursor = cursor[segment];
      }
      if (cursor == null) return null;
      return String(cursor);
    }

    async function loadCascadeIndexForEntity(entityType) {
      if (!entityType || !state.sourceId) return [];
      if (Array.isArray(state.cascadeIndex[entityType])) {
        return state.cascadeIndex[entityType];
      }
      if (state.cascadeIndexLoading[entityType]) {
        return state.cascadeIndexLoading[entityType];
      }
      const promise = (async () => {
        const collected = [];
        const pageSize = 500;
        let offset = 0;
        let total = Infinity;
        while (offset < total) {
          const params = new URLSearchParams({
            limit: String(pageSize),
            offset: String(offset),
            entity_type: entityType
          });
          const response = await api.get(`${connectorApi('/data')}?${params.toString()}`);
          const rows = Array.isArray(response.data) ? response.data : [];
          collected.push(...rows);
          const pagination = response.pagination || {};
          total = typeof pagination.total === 'number' ? pagination.total : collected.length;
          if (!rows.length) break;
          offset += rows.length;
          if (offset >= total) break;
          if (collected.length >= 5000) break;
        }
        state.cascadeIndex[entityType] = collected;
        return collected;
      })().catch((error) => {
        state.cascadeIndexErrors[entityType] = error.message || 'Failed to load linked records';
        state.cascadeIndex[entityType] = [];
        return [];
      }).finally(() => {
        delete state.cascadeIndexLoading[entityType];
      });
      state.cascadeIndexLoading[entityType] = promise;
      return promise;
    }

    function getMatchValuesForRows(rows, matchPath) {
      const path = String(matchPath || 'external_id');
      const values = new Set();
      for (const row of rows || []) {
        let value = null;
        if (path === 'external_id') value = row && row.external_id != null ? String(row.external_id) : null;
        else if (path === 'id') value = row && row.id != null ? String(row.id) : null;
        else value = readPathValue(row, path);
        if (value != null && value !== '') values.add(value);
      }
      return values;
    }

    function findChildRowsForParents(childRows, viaPath, parentMatchValues) {
      const matches = [];
      for (const child of childRows || []) {
        const fkValue = readPathValue(child, viaPath);
        if (fkValue != null && parentMatchValues.has(fkValue)) {
          matches.push(child);
        }
      }
      return matches;
    }

    // Fetch matched child rows for a relationship by pushing the FK filter to
    // the server. Replaces the older "load entity pool client-side then filter"
    // path which silently capped at 5000 rows per entity and under-reported
    // matches for high-volume entity types (notes/tasks/matter_participants).
    async function fetchMatchedChildrenForRel(childEntityType, viaPath, parentMatchValues) {
      const valuesArray = Array.from(parentMatchValues);
      if (!valuesArray.length) return [];
      const matched = [];
      const pageSize = 500;
      let offset = 0;
      let total = Infinity;
      while (offset < total) {
        const filters = JSON.stringify([{ field: viaPath, operator: 'in', value: valuesArray }]);
        const params = new URLSearchParams({
          entity_type: childEntityType,
          limit: String(pageSize),
          offset: String(offset),
          filters
        });
        const response = await api.get(`${connectorApi('/data')}?${params.toString()}`);
        const rows = Array.isArray(response.data) ? response.data : [];
        matched.push(...rows);
        const pagination = response.pagination || {};
        total = typeof pagination.total === 'number' ? pagination.total : matched.length;
        if (!rows.length) break;
        offset += rows.length;
        if (offset >= total) break;
        if (matched.length >= 25000) break;
      }
      return matched;
    }

    async function computeCascadeForRows(parentRows) {
      const result = {
        parents: Array.isArray(parentRows) ? parentRows.length : 0,
        breakdown: [],
        idsByEntity: {},
        allChildIds: new Set(),
        warnings: []
      };
      if (!parentRows || !parentRows.length) return result;

      const groupedByEntity = new Map();
      for (const row of parentRows) {
        const entityType = row && row.entity_type;
        if (!entityType) continue;
        if (!groupedByEntity.has(entityType)) groupedByEntity.set(entityType, []);
        groupedByEntity.get(entityType).push(row);
      }

      for (const [parentEntityType, parentsOfType] of groupedByEntity.entries()) {
        const rels = getRelationshipsForEntity(parentEntityType);
        if (!rels.length) continue;

        for (const rel of rels) {
          if (state.cascadeDisabledRels[`${parentEntityType}::${rel.entity_type}`]) continue;
          const parentValues = getMatchValuesForRows(parentsOfType, rel.match);
          if (!parentValues.size) continue;

          let matchedChildren;
          try {
            matchedChildren = await fetchMatchedChildrenForRel(rel.entity_type, rel.via, parentValues);
          } catch (error) {
            result.warnings.push(`Failed to load ${rel.label}: ${error.message || error}`);
            continue;
          }

          if (!matchedChildren.length) {
            result.breakdown.push({
              parent_entity_type: parentEntityType,
              entity_type: rel.entity_type,
              label: rel.label,
              count: 0,
              ids: []
            });
            continue;
          }

          const childIds = matchedChildren.map((row) => row.id).filter(Boolean);
          for (const id of childIds) result.allChildIds.add(id);
          if (!result.idsByEntity[rel.entity_type]) result.idsByEntity[rel.entity_type] = new Set();
          for (const id of childIds) result.idsByEntity[rel.entity_type].add(id);

          result.breakdown.push({
            parent_entity_type: parentEntityType,
            entity_type: rel.entity_type,
            label: rel.label,
            count: childIds.length,
            ids: childIds
          });

          if (Array.isArray(rel.transitive) && rel.transitive.length) {
            for (const trans of rel.transitive) {
              if (state.cascadeDisabledRels[`${parentEntityType}::${rel.entity_type}::${trans.entity_type}`]) continue;
              const transParentValues = getMatchValuesForRows(matchedChildren, trans.match);
              if (!transParentValues.size) continue;

              let matchedTrans;
              try {
                matchedTrans = await fetchMatchedChildrenForRel(trans.entity_type, trans.via, transParentValues);
              } catch (error) {
                result.warnings.push(`Failed to load ${trans.label}: ${error.message || error}`);
                continue;
              }

              const transIds = matchedTrans.map((row) => row.id).filter(Boolean);
              for (const id of transIds) result.allChildIds.add(id);
              if (!result.idsByEntity[trans.entity_type]) result.idsByEntity[trans.entity_type] = new Set();
              for (const id of transIds) result.idsByEntity[trans.entity_type].add(id);

              result.breakdown.push({
                parent_entity_type: rel.entity_type,
                entity_type: trans.entity_type,
                label: trans.label,
                count: transIds.length,
                ids: transIds,
                transitive: true
              });
            }
          }
        }
      }
      return result;
    }

    function getCascadeRelKey(parentEntity, childEntity, transChild) {
      return transChild
        ? `${parentEntity}::${childEntity}::${transChild}`
        : `${parentEntity}::${childEntity}`;
    }

    function toggleCascadeRel(parentEntity, childEntity, transChild, isDisabled) {
      const key = getCascadeRelKey(parentEntity, childEntity, transChild);
      if (isDisabled) {
        state.cascadeDisabledRels[key] = true;
      } else {
        delete state.cascadeDisabledRels[key];
      }
      renderCascadePanel();
      scheduleCascadePanelRefresh();
    }

    function setCascadeEnabled(value) {
      state.cascadeEnabled = Boolean(value);
      renderCascadePanel();
      scheduleCascadePanelRefresh();
    }

    function getCascadeMatchCount(entityType, transitiveEntityType) {
      const preview = state.cascadePanelPreview;
      if (!preview || !Array.isArray(preview.breakdown)) return null;
      const target = transitiveEntityType || entityType;
      const isTransitive = Boolean(transitiveEntityType);
      let total = 0;
      let found = false;
      for (const row of preview.breakdown) {
        if (row.entity_type !== target) continue;
        if (Boolean(row.transitive) !== isTransitive) continue;
        total += Number(row.count || 0);
        found = true;
      }
      return found ? total : 0;
    }

    function renderCascadeMatchLabel(rel, entityType, transitiveEntityType) {
      const poolSize = Array.isArray(state.cascadeIndex[entityType])
        ? state.cascadeIndex[entityType].length
        : null;
      const loading = Boolean(state.cascadeIndexLoading[entityType]);
      if (loading) return 'Loading pool…';

      const parentCount = state.cascadePanelPreview ? state.cascadePanelPreview.parents : 0;
      if (parentCount === 0) {
        return poolSize == null
          ? 'Pool not loaded'
          : `${formatNumber(poolSize)} candidate${poolSize === 1 ? '' : 's'} (select rows to compute matches)`;
      }

      if (state.cascadePanelLoading) return 'Computing matches…';

      const matched = getCascadeMatchCount(transitiveEntityType ? entityType : null, transitiveEntityType || rel);
      const matchedSafe = matched == null ? 0 : matched;
      if (poolSize == null) {
        return `${formatNumber(matchedSafe)} matched`;
      }
      return `${formatNumber(matchedSafe)} matched of ${formatNumber(poolSize)}`;
    }

    function renderCascadePanel() {
      const node = document.getElementById('cascadePanel');
      if (!node) return;
      if (!hasAnyDependentEntities()) {
        node.innerHTML = '';
        node.classList.add('hidden');
        return;
      }
      node.classList.remove('hidden');

      const map = getDependentEntitiesMap();
      const parentEntities = Object.keys(map);

      const checkboxId = 'cascadeEnabledToggle';
      const lines = [];
      lines.push(`
        <label class="flex items-start gap-3 rounded-xl border border-gray-200 bg-white p-3">
          <input id="${checkboxId}" type="checkbox" ${state.cascadeEnabled ? 'checked' : ''} onchange="setCascadeEnabled(this.checked)" class="mt-1 h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
          <div>
            <div class="text-sm font-medium text-gray-900">Also assign linked records</div>
            <div class="mt-1 text-xs text-gray-500">When on, assigning rows to a matter also assigns their linked records (${parentEntities.map(titleCase).join(', ')} relationships). Match counts below reflect the current selection.</div>
          </div>
        </label>
      `);

      if (state.cascadeEnabled) {
        const rows = [];
        for (const parent of parentEntities) {
          for (const rel of map[parent]) {
            const key = getCascadeRelKey(parent, rel.entity_type);
            const disabled = Boolean(state.cascadeDisabledRels[key]);
            const label = renderCascadeMatchLabel(rel.entity_type, rel.entity_type, null);
            rows.push(`
              <label class="flex items-center justify-between gap-3 rounded-lg border border-gray-200 bg-white px-3 py-2">
                <div class="flex items-start gap-3">
                  <input type="checkbox" ${disabled ? '' : 'checked'} onchange="toggleCascadeRel('${escapeHtml(parent)}','${escapeHtml(rel.entity_type)}','', !this.checked)" class="mt-1 h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                  <div>
                    <div class="text-sm text-gray-900">${escapeHtml(rel.label)}</div>
                    <div class="text-xs text-gray-500">${escapeHtml(titleCase(parent))} &rarr; ${escapeHtml(rel.entity_type)} via <code>${escapeHtml(rel.via)}</code></div>
                  </div>
                </div>
                <div class="text-xs text-gray-500 text-right">${label}</div>
              </label>
            `);
            if (Array.isArray(rel.transitive)) {
              for (const trans of rel.transitive) {
                const tkey = getCascadeRelKey(parent, rel.entity_type, trans.entity_type);
                const tdisabled = Boolean(state.cascadeDisabledRels[tkey]);
                const tlabel = renderCascadeMatchLabel(trans.entity_type, trans.entity_type, trans.entity_type);
                rows.push(`
                  <label class="ml-6 flex items-center justify-between gap-3 rounded-lg border border-dashed border-gray-200 bg-white px-3 py-2">
                    <div class="flex items-start gap-3">
                      <input type="checkbox" ${tdisabled ? '' : 'checked'} onchange="toggleCascadeRel('${escapeHtml(parent)}','${escapeHtml(rel.entity_type)}','${escapeHtml(trans.entity_type)}', !this.checked)" class="mt-1 h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                      <div>
                        <div class="text-sm text-gray-900">${escapeHtml(trans.label)}</div>
                        <div class="text-xs text-gray-500">${escapeHtml(rel.entity_type)} &rarr; ${escapeHtml(trans.entity_type)} via <code>${escapeHtml(trans.via)}</code></div>
                      </div>
                    </div>
                    <div class="text-xs text-gray-500 text-right">${tlabel}</div>
                  </label>
                `);
              }
            }
          }
        }
        lines.push(`<div class="mt-3 space-y-2">${rows.join('')}</div>`);
        const errorKeys = Object.keys(state.cascadeIndexErrors || {});
        if (errorKeys.length) {
          lines.push(`<div class="mt-3 rounded-lg border border-red-200 bg-red-50 p-3 text-xs text-red-700">${errorKeys.map((k) => escapeHtml(`${k}: ${state.cascadeIndexErrors[k]}`)).join('<br>')}</div>`);
        }
      }

      node.innerHTML = lines.join('');
    }

    function getParentRowsForCurrentSelection() {
      if (state.selectionMode === 'all-filtered') return null;
      const rows = state.dataPreview && Array.isArray(state.dataPreview.data) ? state.dataPreview.data : [];
      return rows.filter((row) => state.selectedDataIds.includes(row.id));
    }

    function scheduleCascadePanelRefresh() {
      if (state.cascadePanelDebounce) clearTimeout(state.cascadePanelDebounce);
      state.cascadePanelDebounce = setTimeout(() => {
        state.cascadePanelDebounce = null;
        refreshCascadePanelMatchCounts();
      }, 150);
    }

    async function refreshCascadePanelMatchCounts() {
      if (!state.cascadeEnabled || !hasAnyDependentEntities()) {
        state.cascadePanelPreview = null;
        renderCascadePanel();
        updateAssignSelectedButton();
        return;
      }
      const parentRows = getParentRowsForCurrentSelection();
      if (parentRows == null) {
        // all-filtered: too expensive to recompute live; fall back to pool counts
        state.cascadePanelPreview = null;
        renderCascadePanel();
        updateAssignSelectedButton();
        return;
      }
      if (!parentRows.length) {
        state.cascadePanelPreview = { parents: 0, breakdown: [], totalChildren: 0, warnings: [] };
        renderCascadePanel();
        updateAssignSelectedButton();
        return;
      }
      state.cascadePanelLoading = true;
      renderCascadePanel();
      try {
        const preview = await previewCascadeForSelection(parentRows);
        state.cascadePanelPreview = preview;
      } catch (error) {
        state.cascadePanelPreview = { parents: parentRows.length, breakdown: [], totalChildren: 0, warnings: [error.message || String(error)] };
      } finally {
        state.cascadePanelLoading = false;
        renderCascadePanel();
        updateAssignSelectedButton();
      }
    }

    async function previewCascadeForSelection(parentRows, options = {}) {
      const result = await computeCascadeForRows(parentRows);
      const totalChildren = result.allChildIds.size;
      const totalRows = (result.parents || 0) + totalChildren;
      return {
        parents: result.parents,
        breakdown: result.breakdown,
        warnings: result.warnings,
        idsByEntity: result.idsByEntity,
        allChildIds: result.allChildIds,
        totalChildren,
        totalRows,
        threshold: options.threshold == null ? 100 : options.threshold
      };
    }

    function buildAssignTargetBody(target) {
      if (!target || !target.mode) {
        throw new Error('Assign target is required');
      }
      if (target.mode === 'existing') {
        if (!target.matterId) throw new Error('Select a matter before assigning');
        return { matter_id: target.matterId };
      }
      if (target.mode === 'create') {
        const form = target.createForm || {};
        const create_matter = {};
        for (const key of ['name', 'client_name', 'description', 'status', 'matter_type', 'case_number', 'visibility']) {
          const value = (form[key] == null ? '' : String(form[key])).trim();
          if (value) create_matter[key] = value;
        }
        if (!create_matter.name) throw new Error('Matter name is required');
        if (!create_matter.matter_type) create_matter.matter_type = 'workspace';
        if (!create_matter.status) create_matter.status = 'active';
        return { create_matter };
      }
      throw new Error('Unsupported assign mode');
    }

    function summarizeAssignResponse(response, fallbackCount, label) {
      const assigned = Number.isFinite(response?.rows_assigned)
        ? response.rows_assigned
        : (Number.isFinite(response?.rows_updated) ? response.rows_updated : fallbackCount);
      const skipped = Number.isFinite(response?.rows_skipped) ? response.rows_skipped : 0;
      const parts = [`${label} (${formatNumber(assigned)} rows assigned`];
      if (skipped > 0) parts.push(`, ${formatNumber(skipped)} skipped`);
      parts.push(').');
      return parts.join('');
    }

    async function performAssign(target, payloadExtras, label, fallbackCount) {
      const body = Object.assign({}, payloadExtras || {}, buildAssignTargetBody(target));
      if (typeof body.skip_already_assigned !== 'boolean') {
        body.skip_already_assigned = true;
      }
      const response = await api.post(connectorApi('/data/assign-matter'), body);
      showPageAlert(summarizeAssignResponse(response, fallbackCount, label), 'success');
      state.cascadeIndex = {};
      state.cascadeIndexErrors = {};
      await Promise.all([refreshDataPreview(), refreshBaseData(false)]);
      if (response && response.created_matter && response.created_matter.id) {
        await loadMatterOptions();
        const select = document.getElementById('dataMatterSelect');
        if (select) select.value = response.created_matter.id;
        renderMatterDropdownHint();
        updateAssignSelectedButton();
      }
      return response;
    }

    async function performAssignWithIds(matterId, dataIds, label) {
      if (!Array.isArray(dataIds) || !dataIds.length) {
        throw new Error('No rows to assign');
      }
      return performAssign(
        { mode: 'existing', matterId },
        { data_ids: dataIds },
        label,
        dataIds.length
      );
    }

    function getMatterNameById(matterId) {
      if (!matterId) return '';
      const matter = state.matterOptions.find((m) => m.id === matterId);
      if (!matter) return '';
      return matter.name || matter.matter_id || matter.client_name || 'Matter';
    }

    function deriveDefaultMatterName(parentRows) {
      if (!Array.isArray(parentRows) || !parentRows.length) return '';
      const first = parentRows[0];
      const data = first && typeof first.data === 'object' ? first.data : {};
      const candidates = [data.name, data.title, data.matter_name, data.case_name, first.external_id];
      for (const candidate of candidates) {
        const value = candidate == null ? '' : String(candidate).trim();
        if (value) return value;
      }
      return '';
    }

    function summarizeAlreadyImported(parentRows) {
      const examples = [];
      const seen = new Set();
      let totalAssigned = 0;
      const seedRows = Array.isArray(parentRows) ? parentRows.slice() : [];
      for (const set of Object.values(state.cascadeIndex || {})) {
        if (!Array.isArray(set)) continue;
        for (const row of set) {
          if (!row || !row.id || seen.has(row.id)) continue;
          seen.add(row.id);
          if (row.matter_id) seedRows.push(row);
        }
      }
      const liveRows = state.dataPreview && Array.isArray(state.dataPreview.data) ? state.dataPreview.data : [];
      for (const row of liveRows) {
        if (!row || !row.id || seen.has(row.id)) continue;
        seen.add(row.id);
        if (row.matter_id) seedRows.push(row);
      }
      const scannedIds = new Set();
      for (const row of seedRows) {
        if (!row || !row.id || scannedIds.has(row.id)) continue;
        scannedIds.add(row.id);
        if (!row.matter_id) continue;
        totalAssigned += 1;
        if (examples.length < 5) {
          examples.push({
            id: row.id,
            external_id: row.external_id || '',
            matter_id: row.matter_id,
            matter_name: row.matter_name || getMatterNameById(row.matter_id) || ''
          });
        }
      }
      return { count: totalAssigned, examples };
    }

    function openAssignDialog(context) {
      const parentRows = Array.isArray(context.parentRows) ? context.parentRows : [];
      const cascadeAvailable = Boolean(state.cascadeEnabled && hasAnyDependentEntities() && context.cascadeAllowed !== false);
      const defaultName = deriveDefaultMatterName(parentRows);
      const presetMatterId = document.getElementById('dataMatterSelect')?.value || '';
      const alreadyImported = summarizeAlreadyImported(parentRows);
      state.assignDialog = {
        open: true,
        mode: presetMatterId ? 'existing' : 'create',
        context,
        targetMatterId: presetMatterId,
        createForm: {
          name: defaultName,
          client_name: '',
          description: '',
          status: 'active',
          matter_type: 'workspace',
          case_number: '',
          visibility: 'private'
        },
        oneMatterPerRow: false,
        alreadyImported,
        cascadePreview: null,
        cascadeAvailable,
        cascadeLoading: cascadeAvailable,
        cascadeError: null,
        inFlight: false
      };
      renderAssignDialog();
      if (cascadeAvailable) {
        previewCascadeForSelection(parentRows)
          .then((preview) => {
            if (!state.assignDialog) return;
            state.assignDialog.cascadePreview = preview;
            state.assignDialog.cascadeLoading = false;
            renderAssignDialog();
          })
          .catch((error) => {
            if (!state.assignDialog) return;
            state.assignDialog.cascadeLoading = false;
            state.assignDialog.cascadeError = error.message || String(error);
            renderAssignDialog();
          });
      }
    }

    function closeAssignDialog() {
      state.assignDialog = null;
      renderAssignDialog();
    }

    function setAssignDialogMode(mode) {
      if (!state.assignDialog) return;
      state.assignDialog.mode = mode === 'create' ? 'create' : 'existing';
      renderAssignDialog();
    }

    function setAssignDialogMatter(matterId) {
      if (!state.assignDialog) return;
      state.assignDialog.targetMatterId = matterId || '';
      renderAssignDialog();
    }

    function updateAssignDialogField(field, value) {
      if (!state.assignDialog) return;
      if (!state.assignDialog.createForm) state.assignDialog.createForm = {};
      state.assignDialog.createForm[field] = value;
    }

    function setAssignDialogOneMatterPerRow(value) {
      if (!state.assignDialog) return;
      state.assignDialog.oneMatterPerRow = Boolean(value);
      renderAssignDialog();
    }

    function deriveMatterNameForRow(parentRow) {
      if (!parentRow) return '(unnamed row)';
      const name = deriveDefaultMatterName([parentRow]);
      if (name) return name;
      const externalId = parentRow.external_id == null ? '' : String(parentRow.external_id).trim();
      if (externalId) return externalId;
      return '(unnamed row)';
    }

    function getAssignDialogTotals() {
      const dialog = state.assignDialog;
      if (!dialog) return { rowCount: 0, cascadeChildren: 0, totalRows: 0 };
      const ctx = dialog.context || {};
      const parents = Array.isArray(ctx.parentRows) ? ctx.parentRows.length : 0;
      const baseCount = Number.isFinite(ctx.rowCount) ? ctx.rowCount : parents;
      const willCascade = dialog.cascadeAvailable && dialog.cascadePreview && dialog.cascadePreview.totalChildren > 0;
      const cascadeChildren = willCascade ? dialog.cascadePreview.totalChildren : 0;
      return {
        rowCount: baseCount,
        cascadeChildren,
        totalRows: baseCount + cascadeChildren
      };
    }

    function renderAssignDialog() {
      const node = document.getElementById('assignMatterModal');
      if (!node) return;
      const dialog = state.assignDialog;
      if (!dialog || !dialog.open) {
        node.classList.add('hidden');
        node.innerHTML = '';
        return;
      }
      const ctx = dialog.context || {};
      const totals = getAssignDialogTotals();
      const targetLabel = dialog.mode === 'create'
        ? (dialog.createForm?.name?.trim() || 'newly-created matter')
        : (getMatterNameById(dialog.targetMatterId) || 'Unassigned');
      const skippedCount = dialog.alreadyImported.count || 0;
      const examplesHtml = dialog.alreadyImported.examples.length
        ? `<ul class="mt-2 space-y-1 text-xs text-gray-600">${dialog.alreadyImported.examples.map((ex) => {
            const left = ex.external_id ? escapeHtml(ex.external_id) : escapeHtml(ex.id);
            const right = ex.matter_name ? escapeHtml(ex.matter_name) : 'Matter';
            return `<li>${left} &rarr; ${right}</li>`;
          }).join('')}</ul>`
        : '';
      const skippedHtml = skippedCount > 0
        ? `
          <div class="rounded-xl border border-amber-200 bg-amber-50 p-3 text-sm text-amber-800">
            <div class="font-medium">${formatNumber(skippedCount)} row${skippedCount === 1 ? '' : 's'} already assigned to a matter — these will be skipped.</div>
            ${examplesHtml}
            <div class="mt-2 text-xs text-amber-700">Edit individually via Inspect &rarr; Assign if you need to reassign.</div>
          </div>`
        : '<div class="rounded-xl border border-gray-200 bg-gray-50 p-3 text-xs text-gray-500">No rows in the current selection are already assigned to a matter.</div>';

      const matterOptionsHtml = ['<option value="">Select a matter…</option>']
        .concat(state.matterOptions.map((matter) => {
          const label = matter.name || matter.matter_id || matter.client_name || 'Matter';
          const selected = matter.id === dialog.targetMatterId ? ' selected' : '';
          return `<option value="${escapeHtml(matter.id)}"${selected}>${escapeHtml(label)}</option>`;
        }))
        .join('');

      const existingPanelHtml = dialog.mode === 'existing' ? `
        <div class="mt-3 space-y-2">
          <label class="block text-xs font-medium text-gray-700">Matter</label>
          <select id="assignDialogMatterSelect" onchange="setAssignDialogMatter(this.value)" class="w-full rounded-xl border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200">${matterOptionsHtml}</select>
        </div>` : '';

      const form = dialog.createForm || {};
      const ctxParentRows = Array.isArray(ctx.parentRows) ? ctx.parentRows : [];
      const oneMatterPerRow = Boolean(dialog.oneMatterPerRow);
      const perRowNamePreview = oneMatterPerRow
        ? ctxParentRows.slice(0, 5).map((row) => deriveMatterNameForRow(row))
        : [];
      const perRowExtraCount = oneMatterPerRow && ctxParentRows.length > 5 ? ctxParentRows.length - 5 : 0;
      const perRowToggleHtml = dialog.mode === 'create' ? `
        <div class="mt-3 rounded-xl border border-gray-200 bg-gray-50 p-3">
          <div class="text-xs font-medium text-gray-700">Creation strategy</div>
          <div class="mt-2 flex flex-col gap-2 sm:flex-row sm:items-start sm:gap-6">
            <label class="flex items-start gap-2 text-sm text-gray-700">
              <input type="radio" name="assignDialogPerRow" value="single" ${oneMatterPerRow ? '' : 'checked'} onchange="setAssignDialogOneMatterPerRow(false)" class="mt-1" />
              <span>
                <span class="font-medium">Single new matter</span>
                <span class="block text-xs text-gray-500">All selected rows and linked records go into one matter.</span>
              </span>
            </label>
            <label class="flex items-start gap-2 text-sm text-gray-700">
              <input type="radio" name="assignDialogPerRow" value="perRow" ${oneMatterPerRow ? 'checked' : ''} onchange="setAssignDialogOneMatterPerRow(true)" ${ctxParentRows.length > 0 ? '' : 'disabled'} />
              <span>
                <span class="font-medium">One matter per selected row</span>
                <span class="block text-xs text-gray-500">Each selected row becomes its own matter; linked records are partitioned per parent.</span>
              </span>
            </label>
          </div>
        </div>` : '';

      const perRowPreviewHtml = oneMatterPerRow ? `
        <div class="mt-3 rounded-xl border border-gray-200 bg-white p-3">
          <div class="text-xs font-medium text-gray-700">Preview (${formatNumber(ctxParentRows.length)} matter${ctxParentRows.length === 1 ? '' : 's'} will be created)</div>
          ${perRowNamePreview.length
            ? `<ul class="mt-2 space-y-1 text-xs text-gray-600">${perRowNamePreview.map((name) => `<li>&bull; ${escapeHtml(name)}</li>`).join('')}</ul>`
            : '<div class="mt-2 text-xs text-gray-500">No selected rows to preview.</div>'}
          ${perRowExtraCount > 0 ? `<div class="mt-2 text-xs text-gray-500">…and ${formatNumber(perRowExtraCount)} more</div>` : ''}
        </div>` : '';

      const singleCreateFieldsHtml = !oneMatterPerRow ? `
        <label class="block sm:col-span-2">
          <div class="text-xs font-medium text-gray-700">Name<span class="text-red-500">*</span></div>
          <input type="text" value="${escapeHtml(form.name || '')}" oninput="updateAssignDialogField('name', this.value); refreshAssignDialogTotals();" class="mt-1 w-full rounded-xl border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200" />
        </label>
        <label class="block">
          <div class="text-xs font-medium text-gray-700">Client Name</div>
          <input type="text" value="${escapeHtml(form.client_name || '')}" oninput="updateAssignDialogField('client_name', this.value)" class="mt-1 w-full rounded-xl border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200" />
        </label>
        <label class="block">
          <div class="text-xs font-medium text-gray-700">Case Number</div>
          <input type="text" value="${escapeHtml(form.case_number || '')}" oninput="updateAssignDialogField('case_number', this.value)" class="mt-1 w-full rounded-xl border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200" />
        </label>
        <label class="block sm:col-span-2">
          <div class="text-xs font-medium text-gray-700">Description</div>
          <textarea rows="2" oninput="updateAssignDialogField('description', this.value)" class="mt-1 w-full rounded-xl border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200">${escapeHtml(form.description || '')}</textarea>
        </label>` : '';

      const createPanelHtml = dialog.mode === 'create' ? `
        ${perRowToggleHtml}
        ${perRowPreviewHtml}
        <div class="mt-3 grid grid-cols-1 gap-3 sm:grid-cols-2">
          ${singleCreateFieldsHtml}
          <label class="block">
            <div class="text-xs font-medium text-gray-700">Status</div>
            <select onchange="updateAssignDialogField('status', this.value)" class="mt-1 w-full rounded-xl border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200">
              ${['active', 'pending', 'archived', 'closed'].map((s) => `<option value="${s}"${(form.status || 'active') === s ? ' selected' : ''}>${escapeHtml(s)}</option>`).join('')}
            </select>
          </label>
          <label class="block">
            <div class="text-xs font-medium text-gray-700">Matter Type</div>
            <select onchange="updateAssignDialogField('matter_type', this.value)" class="mt-1 w-full rounded-xl border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200">
              ${['workspace', 'matter'].map((s) => `<option value="${s}"${(form.matter_type || 'workspace') === s ? ' selected' : ''}>${escapeHtml(s)}</option>`).join('')}
            </select>
          </label>
        </div>` : '';

      const cascadeHtml = dialog.cascadeAvailable
        ? (dialog.cascadeLoading
          ? '<div class="rounded-xl border border-gray-200 bg-white p-3 text-sm text-gray-500">Computing linked records…</div>'
          : (dialog.cascadeError
            ? `<div class="rounded-xl border border-red-200 bg-red-50 p-3 text-xs text-red-700">${escapeHtml(dialog.cascadeError)}</div>`
            : (dialog.cascadePreview && dialog.cascadePreview.breakdown.length
              ? `<div class="space-y-2">${dialog.cascadePreview.breakdown.map((row) => `
                  <div class="flex items-center justify-between gap-4 rounded-lg border border-gray-200 bg-white px-3 py-2 text-sm">
                    <div>
                      <div class="font-medium text-gray-900">${escapeHtml(row.label)}${row.transitive ? ' <span class="text-xs text-gray-500">(transitive)</span>' : ''}</div>
                      <div class="text-xs text-gray-500">${escapeHtml(row.parent_entity_type)} &rarr; ${escapeHtml(row.entity_type)}</div>
                    </div>
                    <div class="text-sm font-semibold text-gray-900">${formatNumber(row.count)}</div>
                  </div>`).join('')}</div>`
              : '<div class="rounded-xl border border-gray-200 bg-white p-3 text-xs text-gray-500">No linked records were found for this selection.</div>')))
        : '';

      const cascadeWarningsHtml = dialog.cascadePreview && dialog.cascadePreview.warnings && dialog.cascadePreview.warnings.length
        ? `<div class="mt-2 rounded-lg border border-amber-200 bg-amber-50 p-3 text-xs text-amber-800">${dialog.cascadePreview.warnings.map(escapeHtml).join('<br>')}</div>`
        : '';

      const canConfirm = !dialog.inFlight
        && (
          dialog.mode === 'existing'
            ? Boolean(dialog.targetMatterId)
            : (oneMatterPerRow ? ctxParentRows.length > 0 : Boolean((form.name || '').trim()))
        )
        && totals.rowCount > 0;

      const confirmLabel = dialog.inFlight
        ? (oneMatterPerRow && dialog.mode === 'create' ? 'Creating…' : 'Assigning…')
        : (oneMatterPerRow && dialog.mode === 'create'
          ? `Create ${formatNumber(ctxParentRows.length)} matter${ctxParentRows.length === 1 ? '' : 's'}`
          : 'Confirm');

      const description = ctx.parentDescription || `${formatNumber(totals.rowCount)} row${totals.rowCount === 1 ? '' : 's'}`;

      node.classList.remove('hidden');
      node.innerHTML = `
        <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 p-4">
          <div class="w-full max-w-2xl max-h-[90vh] overflow-y-auto rounded-2xl bg-white p-6 shadow-2xl">
            <div class="flex items-start justify-between gap-3">
              <div>
                <div class="connector-label">Assign to matter</div>
                <div class="mt-1 text-sm text-gray-600">${escapeHtml(description)} from this connector.</div>
              </div>
              <button type="button" onclick="closeAssignDialog()" class="rounded-lg border border-gray-200 px-2 py-1 text-xs text-gray-500 hover:bg-gray-50">Close</button>
            </div>

            <div class="mt-4">${skippedHtml}</div>

            <div class="mt-4 rounded-xl border border-gray-200 p-4">
              <div class="text-sm font-semibold text-gray-900">Target</div>
              <div class="mt-2 flex flex-wrap gap-4">
                <label class="flex items-center gap-2 text-sm text-gray-700">
                  <input type="radio" name="assignDialogMode" value="existing" ${dialog.mode === 'existing' ? 'checked' : ''} onchange="setAssignDialogMode('existing')" />
                  Existing matter
                </label>
                <label class="flex items-center gap-2 text-sm text-gray-700">
                  <input type="radio" name="assignDialogMode" value="create" ${dialog.mode === 'create' ? 'checked' : ''} onchange="setAssignDialogMode('create')" />
                  Create new matter
                </label>
