<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connector - LanaAI</title>
  <script src="../js/tailwind-loader.js"></script>
  <script src="../js/config.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      background: #f3f4f6;
    }

    #connector-frame {
      width: 100%;
      height: 100%;
      border: 0;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.3s ease-out;
    }

    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #back-button {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 100;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 10px 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      border: 1px solid rgba(0, 0, 0, 0.1);
    }

    #back-button:hover {
      background: white;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
      transform: translateY(-1px);
    }

    #error-screen {
      display: none;
      position: fixed;
      inset: 0;
      background: white;
      align-items: center;
      justify-content: center;
      padding: 40px;
      text-align: center;
    }

    #error-screen.show {
      display: flex;
    }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="spinner"></div>
  </div>

  <!-- Error Screen -->
  <div id="error-screen">
    <div class="max-w-md">
      <svg class="w-16 h-16 text-red-500 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
      <h1 class="text-2xl font-bold text-gray-900 mb-2">Failed to Load Connector</h1>
      <p class="text-gray-600 mb-6" id="error-message">An error occurred while loading the connector UI.</p>
      <button onclick="goBack()" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg transition-colors">
        Back to Connectors
      </button>
    </div>
  </div>

  <!-- Back Button -->
  <button id="back-button" onclick="goBack()">
    <svg class="w-5 h-5 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
    </svg>
    <span class="text-gray-700 font-medium">Back</span>
  </button>

  <!-- Connector UI iframe -->
  <iframe id="connector-frame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox" allow="clipboard-read; clipboard-write"></iframe>

  <script>
    // Get URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const uiEntryPoint = urlParams.get('ui');
    const connectorName = urlParams.get('name') || 'Connector';

    // Update page title
    document.title = `${connectorName} - LanaAI`;

    // Go back to connectors page
    function goBack() {
      window.history.back();
    }

    // Show error screen
    function showError(message) {
      document.getElementById('error-message').textContent = message;
      document.getElementById('error-screen').classList.add('show');
      document.getElementById('loading-screen').classList.add('hidden');
      document.getElementById('back-button').style.display = 'none';
    }

    // Load connector UI
    async function loadConnectorUI() {
      try {
        // Validate parameters
        if (!uiEntryPoint) {
          showError('No connector UI specified. Please select a connector from the list.');
          return;
        }

        // Get base URL from config
        const baseUrl = window.LanaConfig?.API_BASE_URL || 'http://localhost:8080';

        // Construct full URL
        const fullUrl = `${baseUrl}${uiEntryPoint}`;

        console.log('[Connector Viewer] Loading UI from:', fullUrl);

        // Get auth token
        const token = localStorage.getItem('token');
        if (!token) {
          showError('Authentication required. Please log in and try again.');
          return;
        }

        // Set iframe src with auth token (we'll inject it via postMessage for security)
        const iframe = document.getElementById('connector-frame');

        // Load the iframe
        iframe.src = fullUrl;

        // Hide loading screen when iframe loads
        iframe.onload = function() {
          console.log('[Connector Viewer] UI loaded successfully');
          document.getElementById('loading-screen').classList.add('hidden');
        };

        // Show error if iframe fails to load
        iframe.onerror = function(error) {
          console.error('[Connector Viewer] Failed to load UI:', error);
          showError('Failed to load connector UI. Please check your connection and try again.');
        };

        // Timeout after 30 seconds
        setTimeout(() => {
          const loadingScreen = document.getElementById('loading-screen');
          if (!loadingScreen.classList.contains('hidden')) {
            console.error('[Connector Viewer] Timeout loading UI');
            showError('Loading timeout. The connector UI took too long to respond.');
          }
        }, 30000);

      } catch (error) {
        console.error('[Connector Viewer] Error:', error);
        showError(error.message || 'An unexpected error occurred.');
      }
    }

    // Initialize on page load
    loadConnectorUI();

    // Handle keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      // ESC or Backspace to go back
      if (e.key === 'Escape' || (e.key === 'Backspace' && e.target === document.body)) {
        e.preventDefault();
        goBack();
      }
    });
  </script>
</body>
</html>
