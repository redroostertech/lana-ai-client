<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matter Details - LANA AI</title>
  <link rel="stylesheet" href="css/lex-tokens.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/components/document-metadata.css">
  <link rel="stylesheet" href="css/matter-notes.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/drawflow@0.0.60/dist/drawflow.min.css">
  <link rel="stylesheet" href="css/lana-ask-btn.css">
  <link rel="stylesheet" href="css/tailwind-output.css">
  <link rel="stylesheet" href="css/companion-bridge-consent.css">
  <script src="js/tailwind-loader.js"></script>
</head>
<body>

  <lex-loader theme="light"></lex-loader>

  <lex-app
    logo-src="img/logo-light.png"
    logo-alt="LANA AI"
    logo-href="dashboard.html"
    active-nav-id="workspaces"
    page-title="Matter Details"
  ></lex-app>

  <template id="page-content">
  <main>
    <div class="flex flex-col h-full">
      <!-- Banner -->
      <lex-banner
        id="matterBanner"
        variant="light"
        heading="Loading..."
        subtitle=""
        max-actions="1"
      >
        <!-- Ask Matter -->
        <button id="askMatterBtn" class="lana-insights-btn" style="padding:6px 12px;font-size:10.5px;">
          <span class="lana-btn-icon">
            <svg class="lana-btn-corner-tl" width="8" height="8" viewBox="0 0 8 8" fill="none"><path d="M0 0L8 0M0 0L0 8" stroke="currentColor" stroke-width="1.5"/></svg>
            <svg class="lana-btn-corner-br" width="8" height="8" viewBox="0 0 8 8" fill="none"><path d="M8 8L0 8M8 8L8 0" stroke="currentColor" stroke-width="1.5"/></svg>
          </span>
          <span>LANA</span>
        </button>
        <button id="headerOptionsEdit">Edit Matter</button>
        <button id="headerOptionsStatus">Change Status</button>
        <button id="headerOptionsDelete" style="color: var(--lex-color-danger-600);">Delete</button>
      </lex-banner>

      <!-- Breadcrumbs -->
      <lex-breadcrumb id="matterBreadcrumb" style="margin:8px 0;" items='[{"label":"Workspaces & Matters","href":"workspaces.html"},{"label":"Loading..."}]'></lex-breadcrumb>

      <!-- Description has been moved into the Information card in the right
           dock (see renderDetailPanel in workspace-details.js). The original
           top-of-page card is left out of the DOM intentionally. -->
      <lex-card id="descriptionArea" heading="Description" class="hidden" hidden style="display:none;">
        <p id="descriptionText" class="text-sm line-clamp-2" style="color: var(--lex-text-secondary); margin:0;"></p>
        <button id="descriptionToggle" class="text-sm mt-1 hidden" style="color: var(--lex-text-accent)">Show more</button>
      </lex-card>

      <!-- Single-column tabbed layout. The previous right-side dock has been
           folded into a "Summary" tab in the main tab bar — see the Summary
           tab content below for the (preserved) dockPanelDetails /
           dockPanelContext containers. -->
      <div class="flex-1 flex flex-col min-h-0">
        <!-- Tab bar -->
        <div class="flex flex-shrink-0 px-6">
          <lex-tabs
            id="tabBar"
            class="flex-1"
            active="activity"
            variant="underline"
            tabs='[{"id":"summary","label":"Summary"},{"id":"activity","label":"Activity"},{"id":"notes","label":"Notes"},{"id":"tasks","label":"Tasks"},{"id":"comments","label":"Discussions"},{"id":"documents","label":"Documents"},{"id":"conversations","label":"Conversations"},{"id":"billableHours","label":"Billable Hours"}]'
          ></lex-tabs>
        </div>

        <!-- Tab content (single column, scrollable) -->
        <div class="flex-1 min-h-0">
          <div class="h-full overflow-y-auto">
            <div id="tabContentActivity" class="p-6">
              <!-- Placeholder for redacted shimmer -->
              <div class="space-y-4">
                <div class="h-4 bg-gray-100 rounded w-1/3"></div>
                <div class="space-y-3">
                  <div class="flex gap-3"><div class="w-8 h-8 bg-gray-100 rounded-full flex-shrink-0"></div><div class="flex-1 space-y-2"><div class="h-3 bg-gray-100 rounded w-3/4"></div><div class="h-3 bg-gray-100 rounded w-1/2"></div></div></div>
                  <div class="flex gap-3"><div class="w-8 h-8 bg-gray-100 rounded-full flex-shrink-0"></div><div class="flex-1 space-y-2"><div class="h-3 bg-gray-100 rounded w-2/3"></div><div class="h-3 bg-gray-100 rounded w-5/12"></div></div></div>
                  <div class="flex gap-3"><div class="w-8 h-8 bg-gray-100 rounded-full flex-shrink-0"></div><div class="flex-1 space-y-2"><div class="h-3 bg-gray-100 rounded w-4/5"></div><div class="h-3 bg-gray-100 rounded w-1/3"></div></div></div>
                  <div class="flex gap-3"><div class="w-8 h-8 bg-gray-100 rounded-full flex-shrink-0"></div><div class="flex-1 space-y-2"><div class="h-3 bg-gray-100 rounded w-3/5"></div><div class="h-3 bg-gray-100 rounded w-2/5"></div></div></div>
                </div>
              </div>
            </div>
            <div id="tabContentNotes" class="hidden p-6"></div>
            <div id="tabContentTasks" class="hidden p-6"></div>
            <div id="tabContentComments" class="hidden p-6"></div>
            <div id="tabContentDocuments" class="hidden p-6"></div>
            <div id="tabContentConversations" class="hidden p-6"></div>
            <div id="tabContentBillableHours" class="hidden p-6">
              <!-- Summary card -->
              <div id="bhSummaryCard" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:1rem;margin-bottom:1.5rem;">
              </div>
              <!-- Filters bar -->
              <div id="bhFiltersBar" style="margin-bottom:1rem;"></div>
              <!-- Time entries table -->
              <div id="bhEntriesSection">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.25rem;">
                  <div style="font-size:0.9rem;font-weight:600;color:var(--lex-text-primary);">Time Entries</div>
                  <div style="display:flex;gap:0.5rem;">
                    <lex-btn id="bhAddManualBtn" variant="primary" size="sm">+ New entry</lex-btn>
                    <lex-btn id="bhGenerateBtn" variant="outline" size="sm">Generate for Today</lex-btn>
                  </div>
                </div>
                <div id="bhEntriesLoading" class="animate-pulse flex flex-col gap-2">
                  <div class="cc-skeleton" style="height:2.5rem;width:100%;"></div>
                  <div class="cc-skeleton" style="height:2.5rem;width:100%;"></div>
                  <div class="cc-skeleton" style="height:2.5rem;width:100%;"></div>
                </div>
                <div id="bhEntriesList" class="hidden" style="display:flex;flex-direction:column;gap:0;border:1px solid var(--lex-border-default,#e5e7eb);border-radius:0.5rem;overflow:hidden;">
                </div>
                <div id="bhEntriesEmpty" class="hidden" style="text-align:center;padding:2rem;color:var(--lex-text-muted);font-size:0.875rem;">
                  No time entries for this matter yet. Click "Generate for Today" to create drafts from today's activity.
                </div>
                <!-- Pagination -->
                <div id="bhPagination" style="margin-top:0.5rem;"></div>
              </div>
            </div>
            <div id="tabContentDocGeneration" class="hidden p-6"></div>
            <div id="tabContentAnalytics" class="hidden p-6">
              <div id="matterAnalyticsCards" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1rem;"></div>
              <div id="matterAnalyticsEmpty" style="display:none;color:#6b7280;font-size:0.875rem;">No analytics data available.</div>
              <div id="matterAnalyticsError" style="display:none;color:#ef4444;font-size:0.875rem;">Failed to load analytics. Please try again.</div>
            </div>
            <!-- Summary tab — hosts the former right-dock content. The
                 dock toggle (Details / Context) and the dock panels keep
                 their original IDs so the renderer code in
                 workspace-details.js (which writes to dockPanelDetails /
                 dockPanelContext by id) continues to work unchanged. -->
            <div id="tabContentSummary" class="hidden">
              <div class="p-4 border-b border-gray-200">
                <lex-segmented id="dockToggle" value="details" size="sm"
                  options='[{"value":"details","label":"Details"},{"value":"context","label":"Context"}]'>
                </lex-segmented>
              </div>
              <div id="dockPanelDetails" class="p-4">
                <!-- Placeholder shimmer (replaced by detail card render) -->
                <div class="space-y-4">
                  <div class="h-3 bg-gray-100 rounded w-1/3 mb-2"></div>
                  <div class="space-y-2">
                    <div class="flex justify-between"><div class="h-3 bg-gray-100 rounded w-1/4"></div><div class="h-3 bg-gray-100 rounded w-1/3"></div></div>
                    <div class="flex justify-between"><div class="h-3 bg-gray-100 rounded w-1/5"></div><div class="h-3 bg-gray-100 rounded w-1/4"></div></div>
                    <div class="flex justify-between"><div class="h-3 bg-gray-100 rounded w-1/4"></div><div class="h-3 bg-gray-100 rounded w-1/5"></div></div>
                    <div class="flex justify-between"><div class="h-3 bg-gray-100 rounded w-1/5"></div><div class="h-3 bg-gray-100 rounded w-2/5"></div></div>
                    <div class="flex justify-between"><div class="h-3 bg-gray-100 rounded w-1/3"></div><div class="h-3 bg-gray-100 rounded w-1/3"></div></div>
                  </div>
                  <div class="h-3 bg-gray-100 rounded w-1/3 mt-4 mb-2"></div>
                  <div class="flex gap-2">
                    <div class="h-6 bg-gray-100 rounded-full w-20"></div>
                    <div class="h-6 bg-gray-100 rounded-full w-24"></div>
                  </div>
                </div>
              </div>
              <div id="dockPanelContext" class="hidden p-4"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- ═══════════════════════════════════════════════════════════════════════
       Modals — at page level so they are not trapped by stacking contexts
       ═══════════════════════════════════════════════════════════════════════ -->

  <!-- Task Modal -->
  <lex-modal id="taskModal" heading="Create Task" size="lg" hide-actions>
      <form id="taskForm" onsubmit="saveTask(event)" class="p-6 space-y-5">
        <input type="hidden" id="taskId">

        <lex-input id="taskTitle" label="Title" required></lex-input>

        <lex-textarea id="taskDescription" label="Description" rows="3" placeholder="Describe the task..."></lex-textarea>

        <lex-textarea id="taskNotes" label="Notes" rows="2" placeholder="Additional notes..."></lex-textarea>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <lex-select id="taskStatus" label="Status"
              options='[{"value":"pending","label":"Pending"},{"value":"in_progress","label":"In Progress"},{"value":"in_review","label":"In Review"},{"value":"complete","label":"Complete"},{"value":"cancelled","label":"Cancelled"}]'>
            </lex-select>
          </div>
          <div>
            <lex-select id="taskPriority" label="Priority"
              options='[{"value":"low","label":"Low"},{"value":"normal","label":"Normal"},{"value":"high","label":"High"}]'>
            </lex-select>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <lex-input id="taskDueDate" label="Due Date" type="datetime-local"></lex-input>
          </div>
          <div>
            <lex-select id="taskAssignedTo" label="Assign To" placeholder="Unassigned"
              options='[{"value":"","label":"Unassigned"}]'>
            </lex-select>
          </div>
        </div>

        <div class="flex justify-between items-center pt-4 border-t border-gray-200">
          <div id="taskDeleteArea">
            <button id="taskDeleteBtn" type="button" onclick="confirmDeleteTask()" class="p-2 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors" title="Delete task">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
            </button>
            <div id="taskDeleteConfirm" class="hidden flex items-center gap-2">
              <span class="text-xs text-red-600">Delete this task?</span>
              <button type="button" onclick="deleteTask(document.getElementById('taskId').value)" class="px-2 py-1 text-xs font-medium text-white bg-red-600 hover:bg-red-700 rounded transition-colors">Yes, delete</button>
              <button type="button" onclick="cancelDeleteTask()" class="px-2 py-1 text-xs font-medium text-gray-600 bg-gray-100 hover:bg-gray-200 rounded transition-colors">No</button>
            </div>
          </div>
          <div class="flex gap-3">
            <lex-btn type="button" onclick="closeTaskModal()" variant="secondary">Cancel</lex-btn>
            <lex-btn type="submit" variant="primary">Save Task</lex-btn>
          </div>
        </div>
      </form>
  </lex-modal>

  <!-- Create Task Plan Modal -->
  <lex-modal id="taskPlanModal" heading="Create Task Plan" size="lg" hide-actions>
    <form id="taskPlanForm" onsubmit="saveTaskPlan(event)" class="p-6 space-y-5">
      <lex-input id="taskPlanTitle" label="Plan name" required placeholder="e.g. New client intake checklist"></lex-input>

      <lex-textarea id="taskPlanDescription" label="Description" rows="3" placeholder="Describe what this plan accomplishes..."></lex-textarea>

      <div>
        <div class="flex items-center justify-between mb-2">
          <label class="text-sm font-medium text-gray-700">Checklist items</label>
          <lex-btn type="button" size="sm" variant="secondary" onclick="addTaskPlanItem()">+ Add item</lex-btn>
        </div>
        <div id="taskPlanItemsList" class="space-y-2"></div>
      </div>

      <div class="flex justify-end gap-3 pt-4 border-t border-gray-200">
        <lex-btn type="button" onclick="closeTaskPlanModal()" variant="secondary">Cancel</lex-btn>
        <lex-btn type="submit" variant="primary">Save Task Plan</lex-btn>
      </div>
    </form>
  </lex-modal>

  <!-- Contact Modal -->
  <lex-modal id="contactModal" heading="Add Contact" size="lg" hide-actions>
      <form id="contactForm" onsubmit="saveContact(event)" class="p-6 space-y-5">
        <input type="hidden" id="contactMatterId">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <lex-input id="contactFirstName" label="First Name" required></lex-input>
          <lex-input id="contactLastName" label="Last Name" required></lex-input>
        </div>

        <lex-input id="contactDisplayName" label="Display Name" placeholder="Optional - defaults to First Last"></lex-input>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <lex-input id="contactCompanyName" label="Company Name" placeholder="Company name"></lex-input>
          <lex-input id="contactTitle" label="Title/Position" placeholder="e.g., Partner, CEO"></lex-input>
        </div>

        <lex-input id="contactEmail" label="Email" type="email" placeholder="email@example.com"></lex-input>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <lex-input id="contactPhoneMobile" label="Mobile Phone" type="tel" placeholder="(555) 555-5555"></lex-input>
          <lex-input id="contactPhoneWork" label="Work Phone" type="tel" placeholder="(555) 555-5555"></lex-input>
        </div>

        <lex-select id="contactType" label="Contact Type"
          options='[{"value":"contact:participant","label":"Participant"},{"value":"contact:opportunity","label":"Opportunity"},{"value":"contact:lead","label":"Lead"},{"value":"contact:other","label":"Other"}]'>
        </lex-select>

        <div class="flex justify-end gap-3 pt-4 border-t border-gray-200">
          <lex-btn type="button" onclick="closeContactModal()" variant="secondary">Cancel</lex-btn>
          <lex-btn type="submit" variant="primary">Save Contact</lex-btn>
        </div>
      </form>
  </lex-modal>

  <!-- Contact Detail Modal -->
  <lex-modal id="contactDetailModal" heading="Contact Details" size="lg" hide-actions>
    <div id="contactDetailContent" class="p-6"></div>
  </lex-modal>

  <!-- Edit Contact Modal -->
  <lex-modal id="editContactModal" heading="Edit Contact" size="lg" hide-actions>
      <form id="editContactForm" onsubmit="updateContact(event)" class="p-6 space-y-5">
        <input type="hidden" id="editContactId">
        <input type="hidden" id="editContactMatterId">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <lex-input id="editContactFirstName" label="First Name" required></lex-input>
          <lex-input id="editContactLastName" label="Last Name" required></lex-input>
        </div>

        <lex-input id="editContactDisplayName" label="Display Name" placeholder="Optional - defaults to First Last"></lex-input>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <lex-input id="editContactCompanyName" label="Company Name" placeholder="Company name"></lex-input>
          <lex-input id="editContactTitle" label="Title/Position" placeholder="e.g., Partner, CEO"></lex-input>
        </div>

        <lex-input id="editContactEmail" label="Email" type="email" placeholder="email@example.com"></lex-input>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <lex-input id="editContactPhoneMobile" label="Mobile Phone" type="tel" placeholder="(555) 555-5555"></lex-input>
          <lex-input id="editContactPhoneWork" label="Work Phone" type="tel" placeholder="(555) 555-5555"></lex-input>
        </div>

        <lex-select id="editContactType" label="Contact Type"
          options='[{"value":"contact:participant","label":"Participant"},{"value":"contact:opportunity","label":"Opportunity"},{"value":"contact:lead","label":"Lead"},{"value":"contact:other","label":"Other"}]'>
        </lex-select>

        <div class="flex justify-end gap-3 pt-4 border-t border-gray-200">
          <lex-btn type="button" onclick="closeEditContactModal()" variant="secondary">Cancel</lex-btn>
          <lex-btn type="submit" variant="primary">Save Changes</lex-btn>
        </div>
      </form>
  </lex-modal>

  <!-- Create Link Modal -->
  <lex-modal id="createLinkModal" heading="Link Related Matter" subtitle="Connect this matter to another matter" size="lg" hide-actions>
      <form onsubmit="createLink(event)" class="p-6 space-y-4">
        <input type="hidden" id="linkSourceMatterId" value="">

        <div>
          <div class="relative">
            <lex-input
              id="linkMatterSearch"
              label="Search for Matter to Link"
              leading-icon="search"
              placeholder="Type matter name or ID to search..."
            ></lex-input>
            <div id="linkMatterSearchResults" class="hidden absolute z-10 w-full mt-1 bg-white border border-gray-300 rounded-lg shadow-lg max-h-96 overflow-y-auto"></div>
          </div>
        </div>

        <div id="selectedLinkMatter" class="hidden">
          <label class="block text-sm font-medium text-gray-700 mb-2">Selected Matter</label>
          <div class="flex items-center justify-between p-3 border rounded-lg" style="background: var(--lex-bg-accent-muted); border-color: var(--lex-border)">
            <div class="flex-1 min-w-0">
              <p id="selectedLinkMatterName" class="text-sm font-medium text-gray-900 truncate"></p>
              <p id="selectedLinkMatterId" class="text-xs text-gray-500 font-mono"></p>
            </div>
            <button type="button" onclick="clearLinkMatterSelection()" class="ml-3 p-1" style="color: var(--lex-text-accent)">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
              </svg>
            </button>
          </div>
        </div>

        <div id="linkTypeContainer">
          <lex-select id="linkType" label="Link Type"
            options='[{"value":"related_to","label":"Related To (bidirectional)"},{"value":"parent_of","label":"Parent Of (this matter is parent)"},{"value":"child_of","label":"Child Of (this matter is child)"}]'>
          </lex-select>
          <p class="mt-1 text-xs text-gray-500">Choose how these matters are related to each other</p>
        </div>

        <div class="flex justify-end gap-3 pt-4 border-t border-gray-200">
          <lex-btn type="button" onclick="closeCreateLinkModal()" variant="secondary">Cancel</lex-btn>
          <lex-btn type="submit" id="createLinkBtn" variant="primary" disabled>Create Link</lex-btn>
        </div>
      </form>
  </lex-modal>

  <!-- Orphaned Document Viewer Modal (for untracked files only) -->
  <lex-modal id="documentViewerModal" heading="Document" size="full" hide-actions>
    <div class="flex items-center gap-2 mb-4">
      <h3 id="viewerFileName" class="text-base font-semibold text-gray-900 truncate flex-1"></h3>
      <p id="viewerFileInfo" class="text-sm text-gray-500 whitespace-nowrap"></p>
      <a id="viewerDownloadBtn" href="#" class="px-4 py-2 rounded-lg font-medium flex items-center gap-2 text-sm" style="color: var(--lex-text-accent)">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
        Download
      </a>
    </div>
    <div class="relative flex-1" style="min-height: 60vh;">
      <div id="viewerLoading" class="absolute inset-0 flex items-center justify-center">
        <lex-spinner size="lg"></lex-spinner>
      </div>
      <div id="viewerError" class="hidden absolute inset-0 flex items-center justify-center">
        <div class="text-center">
          <p id="viewerErrorMsg" class="text-gray-500 mb-4">Failed to load document</p>
          <a id="viewerErrorDownload" href="#" class="text-sm font-medium" style="color: var(--lex-text-accent)">Download instead</a>
        </div>
      </div>
      <iframe id="viewerIframe" class="hidden w-full h-full border-0 rounded" style="min-height: 60vh;"></iframe>
      <pre id="viewerText" class="hidden w-full h-full overflow-auto p-4 bg-gray-50 rounded text-sm font-mono" style="min-height: 60vh;"></pre>
      <div id="viewerTable" class="hidden w-full overflow-auto" style="min-height: 60vh;"></div>
      <img id="viewerImage" class="hidden max-w-full max-h-full mx-auto rounded" alt="Document preview" />
      <div id="viewerDocx" class="hidden w-full overflow-auto p-6 bg-white rounded prose max-w-none" style="min-height: 60vh;"></div>
    </div>
  </lex-modal>

  <!-- Doc Studio Document Creation Modal -->
  <lex-modal id="createDocStudioDocumentModal" heading="Create with Doc Studio" subtitle="Generate a matter-specific file from selected or all matter documents" size="lg" hide-actions close-on-overlay>
    <form id="createDocStudioDocumentForm" class="p-6 space-y-5">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <lex-select id="docStudioOutputFormat" label="Format"
          options='[{"value":"document","label":"Legal Document"},{"value":"presentation","label":"Presentation"},{"value":"webpage","label":"Webpage"}]'>
        </lex-select>
        <lex-select id="docStudioDocumentStyle" label="Style"
          options='[{"value":"executive","label":"Executive"},{"value":"editorial","label":"Editorial"},{"value":"modern","label":"Modern"},{"value":"blueprint","label":"Blueprint"},{"value":"luxe","label":"Luxe"}]'>
        </lex-select>
      </div>
      <lex-input id="docStudioDocumentTitle" label="Working title" placeholder="e.g., Mutual NDA for Acme diligence"></lex-input>
      <lex-textarea id="docStudioDocumentPrompt" label="Prompt" rows="8" placeholder="Describe the document you need, parties, business context, key terms, jurisdiction, signature requirements, and any special clauses."></lex-textarea>
      <div id="docStudioDocumentProgress" class="hidden rounded-lg border border-gray-200 bg-gray-50 p-3">
        <div class="flex items-center justify-between gap-3">
          <div>
            <div id="docStudioProgressTitle" class="text-sm font-semibold text-gray-900">Generating with Doc Studio</div>
            <div id="docStudioProgressSubtitle" class="text-xs text-gray-500">Preparing request...</div>
          </div>
          <div id="docStudioProgressElapsed" class="text-xs font-medium text-gray-500">0s</div>
        </div>
        <div class="mt-3 h-1.5 overflow-hidden rounded-full bg-gray-200">
          <div id="docStudioProgressBar" class="h-full rounded-full transition-all" style="width: 0%; background: var(--lex-bg-accent)"></div>
        </div>
        <ol id="docStudioProgressSteps" class="mt-3 space-y-2 text-sm"></ol>
      </div>
