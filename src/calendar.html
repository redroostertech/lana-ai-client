<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar - LANA AI</title>

  <!-- CSS in head; behavioral scripts at end of body. -->
  <script src="js/lex/lex.theme.js"></script>
  <link rel="stylesheet" href="css/lex-tokens.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/tailwind-output.css">
  <link rel="stylesheet" href="css/lex-calendar-grid.css">
  <link rel="stylesheet" href="css/calendar.css">
  <script src="js/tailwind-loader.js"></script>

  <link rel="stylesheet" href="css/lex-chat.css">
</head>
<body>

  <lex-loader theme="light"></lex-loader>

  <lex-app
    logo-src="img/logo-light.png"
    logo-alt="LANA AI"
    logo-href="dashboard.html"
    active-nav-id="calendar"
    page-title="Calendar"
  ></lex-app>

  <template id="page-content">
    <main id="calendarPage" class="cal-page">

      <lex-banner
        id="calBanner"
        variant="light"
        heading="Calendar"
        subtitle="Your meetings and appointments from LANA and your connected apps, with coworkers' busy time when you add them."
        lana
        lana-context-type="full_chat"
      ></lex-banner>

      <div class="cal-toolbar" role="toolbar" aria-label="Calendar view">
        <div class="cal-toolbar-nav">
          <lex-btn id="calTodayBtn" variant="secondary" size="sm">Today</lex-btn>
          <lex-btn id="calPrevBtn" variant="ghost" size="sm" icon leading-icon="chevron-left" aria-label="Previous"></lex-btn>
          <lex-btn id="calNextBtn" variant="ghost" size="sm" icon leading-icon="chevron-right" aria-label="Next"></lex-btn>
          <h2 id="calRangeTitle" class="cal-range-title" aria-live="polite"></h2>
        </div>
        <div class="cal-toolbar-controls">
          <div class="cal-people">
            <lex-select
              id="calCoworkers"
              multiple
              searchable
              clearable
              placeholder="Add coworkers"
              aria-label="Show coworkers' busy time"
            ></lex-select>
          </div>
          <lex-segmented
            id="calViewToggle"
            value="week"
            options='[{"value":"day","label":"Day"},{"value":"week","label":"Week"}]'
          ></lex-segmented>
        </div>
      </div>

      <p id="calNotice" class="cal-notice hidden" role="status"></p>

      <div id="calLegend" class="cal-legend hidden" aria-label="People shown"></div>

      <lex-calendar-grid id="calGrid" empty-text="Nothing scheduled in this range."></lex-calendar-grid>

      <p id="calZoneNote" class="cal-zone-note"></p>

      <section id="calFirmSettings" class="cal-firm-settings hidden" aria-labelledby="calFirmSettingsTitle">
        <h2 id="calFirmSettingsTitle" class="cal-section-title">Firm calendar settings</h2>
        <lex-toggle id="calFreeBusyToggle" name="freebusy_visible_to_members" label="Coworkers can see each other's free/busy"></lex-toggle>
        <p class="cal-help">When this is off, each person sees only their own calendar. Event titles are never shown to someone who could not open the event; they see Busy.</p>
      </section>

      <lex-drawer id="calEventDrawer" heading="Event" width="md" data-hoist>
        <div class="cal-detail">
          <p id="calDetailWhen" class="cal-detail-when"></p>
          <dl class="cal-detail-list">
            <div class="cal-detail-row"><dt>Source</dt><dd id="calDetailSource"></dd></div>
            <div id="calDetailStatusRow" class="cal-detail-row"><dt>Status</dt><dd id="calDetailStatus"></dd></div>
            <div id="calDetailOrganizerRow" class="cal-detail-row"><dt>Organizer</dt><dd id="calDetailOrganizer"></dd></div>
            <div id="calDetailMatterRow" class="cal-detail-row"><dt>Matter</dt><dd id="calDetailMatter"></dd></div>
          </dl>
          <p id="calDetailReadOnly" class="cal-help hidden"></p>
          <div class="cal-detail-actions">
            <lex-btn id="calOpenSourceBtn" class="hidden" variant="secondary" leading-icon="external-link">Open in source app</lex-btn>
          </div>
        </div>
      </lex-drawer>
    </main>
  </template>

  <noscript>
    <div class="cal-noscript">Please enable JavaScript to use LANA AI.</div>
  </noscript>

  <script src="js/error-reporter.js"></script>
  <script src="js/config.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/time-utils.js"></script>
  <script src="js/shared/request-retry.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/shared/safe-url.js"></script>
  <script src="js/shared/safe-html.js"></script>
  <script src="js/components.js"></script>
  <script src="js/version.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/navigation-helpers.js"></script>
  <script src="js/conversation-search-modal.js"></script>
  <script src="js/contact-search-modal.js"></script>
  <script src="js/notifications.js"></script>

  <script src="js/lex/lex.core.js"></script>
  <script src="js/lex/lex.icons.js"></script>
  <script src="js/lex/lex.data.js"></script>
  <script src="js/lex/lex.forms.js"></script>
  <script src="js/lex/lex.state.js"></script>
  <script src="js/lex/lex.utils.js"></script>
  <script src="js/lex/lex.auth.js"></script>
  <script src="js/lex/lex-nav.js"></script>

  <script src="js/lex/components/foundation/lex-loader.js"></script>
  <script src="js/lex/components/foundation/lex-toast.js"></script>
  <script src="js/lex/components/foundation/lex-spinner.js"></script>
  <script src="js/lex/components/foundation/lex-btn.js"></script>
  <script src="js/lex/components/foundation/lex-empty.js"></script>
  <script src="js/lex/components/form/lex-segmented.js"></script>
  <script src="js/lex/components/layout/lex-sidebar.js"></script>
  <script src="js/lex/components/layout/lex-topbar.js"></script>
  <script src="js/lex/components/layout/lex-conversation-item.js"></script>
  <script src="js/lex/components/layout/lex-notification-panel.js"></script>
  <script src="js/lex/components/layout/lex-app.js"></script>

  <!-- Page components, loaded BEFORE the template is injected -->
  <script src="js/lex/components/foundation/lex-banner.js"></script>
  <script src="js/lex/components/foundation/lex-badge.js"></script>
  <script src="js/lex/components/foundation/lex-drawer.js"></script>
  <script src="js/lex/components/form/lex-select.js"></script>
  <script src="js/lex/components/form/lex-toggle.js"></script>
  <script src="js/calendar/calendar-layout.js"></script>
  <script src="js/lex/components/data/lex-calendar-grid.js"></script>

  <script src="js/lex/lex-page-init.js"></script>
  <script src="js/shared/device-time-zone.js"></script>
  <script src="js/services/calendar-api.service.js"></script>
  <script src="js/calendar/calendar-page.model.js"></script>
  <script src="js/calendar/calendar-page.js"></script>

  <lex-lana-dock page-scope="dashboard" context-type="full_chat" placeholder="Ask LANA anything..." thread-title="LANA Chat"></lex-lana-dock>
  <!-- LANA dock (IDE-style docked chat panel) -->
  <script src="js/lex/chat/lex-chat.format.js"></script>
  <script src="js/lex/chat/lex-chat.conversations-api.js"></script>
  <script src="js/lex/chat/lex-chat.source.js"></script>
  <script src="js/lex/chat/lex-chat.message.js"></script>
  <script src="js/lex/chat/lex-chat-progress-events.js"></script>
  <script src="js/lex/chat/lex-chat.activity.js"></script>
  <script src="js/lex/chat/lex-chat.documents.js"></script>
  <script src="js/lex/chat/lex-chat.composer-mentions.js"></script>
  <script src="js/services/slash-commands.service.js"></script>
  <script src="js/lex/chat/lex-chat.composer-slash.js"></script>
  <script src="js/lex/chat/lex-chat.composer.js"></script>
  <script src="js/lex/chat/lex-chat.thread.js"></script>
  <script src="js/lex/chat/lex-chat.threads.js"></script>
  <script src="js/lex/chat/lex-chat.js"></script>
  <script src="js/lex/chat/lex-dynamic-card.renderer.js"></script>
  <script src="js/lex/chat/lex-agentic-plan-card.js"></script>
  <script src="js/lex/chat/lex-chat.index.js"></script>
  <script src="js/lex/components/chat/lex-lana-panel.js"></script>
  <script src="js/lex/components/layout/lex-lana-dock.js"></script>

  <script src="js/auth-guard.js"></script>
</body>
</html>
