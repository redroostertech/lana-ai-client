<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skills - LANA AI</title>

  <!-- CSS + Tailwind in head — behavioral scripts at end of body -->
  <link rel="stylesheet" href="css/lex-tokens.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/tailwind-output.css">
  <link rel="stylesheet" href="css/lex-chat.css">
  <!-- lana-ask-btn.css replaced by self-contained lex-ask-lana-btn component -->
  <link rel="stylesheet" href="css/skills.css">
  <script src="js/tailwind-loader.js"></script>

  <!-- .lana-topbar-divider no longer needed — button in template -->

</head>
<body>

  <!-- Branded loader — shows once lex-loader.js upgrades the element -->
  <lex-loader theme="light"></lex-loader>

  <!-- App shell — sidebar, topbar, empty content area.
       Page content lives in <template> below and gets injected after
       the shell renders. -->
  <lex-app
    logo-src="img/logo-light.png"
    logo-alt="LANA AI"
    logo-href="dashboard.html"
    active-nav-id=""
    page-title="Skills"
  ></lex-app>

  <!-- Page content as inert <template> — elements inside are NOT upgraded
       by the browser until cloned into the live DOM. -->
  <template id="page-content">

    <main>
      <!-- Welcome Banner -->
      <lex-banner
        id="skillsBanner"
        variant="light"
        corners
        heading="Skills"
        subtitle="Browse, import, and manage skills to automate your workflows."
      >
        <lex-btn id="learnMoreBtn" variant="secondary">Learn More</lex-btn>
        <lex-ask-lana-btn panel="skillsLana" size="sm"></lex-ask-lana-btn>
      </lex-banner>

      <!-- Breadcrumb — updated by skills.js when matter context is available -->
      <lex-breadcrumb id="skillsBreadcrumb" items='[{"label":"Skills"}]'></lex-breadcrumb>

      <!-- Content card — header, table/grid body -->
      <lex-card padding="none" style="margin-top:1rem;">
        <!-- Card header — title, action buttons, view toggles -->
        <div class="flex items-center justify-between p-4">
          <div>
            <h2 id="skillsSectionHeading" class="text-lg font-semibold" style="color: var(--lex-text-primary)">All Skills</h2>
          </div>
          <div class="flex items-center gap-3">
            <lex-btn id="create-skill-btn" variant="primary" leading-icon="+">
              Create Skill
            </lex-btn>
            <lex-btn id="import-skill-btn" variant="secondary">
              Import
            </lex-btn>
            <div class="flex items-center gap-1" style="border-left: 1px solid var(--lex-border-default); padding-left: 12px;">
              <lex-btn id="grid-view-btn" variant="ghost" icon="true" title="Grid View">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path>
                </svg>
              </lex-btn>
              <lex-btn id="list-view-btn" variant="primary" icon="true" title="List View">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path>
                </svg>
              </lex-btn>
            </div>
          </div>
        </div>

        <!-- Grid View: search + category filter + cards (hidden by default) -->
        <div id="grid-view-container" class="hidden">
          <div class="px-4 pb-4">
            <div class="flex flex-col md:flex-row gap-3">
              <div class="flex-1 relative">
                <input
                  type="text"
                  id="search-input"
                  placeholder="Search skills..."
                  class="w-full pl-10 pr-4 py-2 rounded-lg skill-builder-input"
                />
                <svg class="w-5 h-5 absolute left-3 top-1/2 transform -translate-y-1/2" style="color: var(--lex-text-tertiary);" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
              </div>
              <lex-select
                id="category-filter"
                placeholder="All Categories"
                size="md"
                style="width:200px;"
                options='[{"value":"all","label":"All Categories"},{"value":"document-intelligence","label":"Document Intelligence"},{"value":"ai-assistance","label":"AI Assistance"},{"value":"automation","label":"Automation"},{"value":"workflow","label":"Workflow"},{"value":"integration","label":"Integration"}]'
              ></lex-select>
            </div>
            <!-- Filter Chips -->
            <div id="filter-chips" class="flex flex-wrap gap-2 mt-3"></div>
          </div>

          <!-- Loading State -->
          <div id="loading-state" class="flex justify-center py-16">
            <lex-spinner size="lg" label="Loading skills..."></lex-spinner>
          </div>

          <!-- Skills Grid (populated by JS) -->
          <div id="skills-grid-container" class="hidden"></div>

          <!-- Empty State (grid) -->
          <div id="grid-empty-state" class="hidden">
            <lex-empty heading="No skills found" description="Try adjusting your search or filters"></lex-empty>
          </div>

          <!-- Pagination (grid view) -->
          <div class="px-4 pb-2">
            <lex-pagination id="grid-pagination"></lex-pagination>
          </div>
        </div>

        <!-- List View: lex-table with built-in search, sort, filter, pagination -->
        <lex-table
          id="skillsListView"
          columns="skill_name,description,category,skill_type,version,installation_count,created_at"
          labels="Name,Description,Category,Type,Version,Runs,Created"
          searchable
          filterable
          column-filters
          compact
          sort-by="created_at"
          sort-dir="desc"
          empty-text="No skills found"
          id-key="skill_id"
        ></lex-table>

        <!-- Pagination (list view) -->
        <lex-pagination id="list-pagination"></lex-pagination>

      </lex-card>

      <!-- Skills Designer panel (drawer mode) -->
      <lex-lana-panel
        id="skillsLana"
        mode="drawer"
        drawer-heading="Skills Designer"
        drawer-width="lg"
        page-scope="skills"
        context-type="skills_chat"
        placeholder="Describe the skill you want to create..."
        tools-locked="true"
        default-tool="skills_chat"
        destroy-on-close="true"
        thread-title="Skills Designer"
        composer-tools='[{"id":"skills_chat","label":"Skills Designer","description":"Design and create skills with AI assistance"}]'
      ></lex-lana-panel>

    </main>

    <!-- Learn More Modal (hoisted to body by lex-page-init) -->
    <div id="learn-more-modal" class="modal hidden" data-hoist>
      <div class="modal-overlay"></div>
      <div class="modal-content max-w-2xl">
        <div class="modal-header">
          <h3 class="text-xl font-semibold" style="color: var(--lex-text-primary);">About Skills</h3>
          <button class="modal-close">&times;</button>
        </div>
        <div class="modal-body">
          <div class="flex items-start gap-4 mb-4">
            <div class="w-12 h-12 flex items-center justify-center rounded-lg flex-shrink-0" style="background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);"><svg class="w-6 h-6" style="color: var(--lex-color-white, #fff);" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M15.39 4.39a1 1 0 0 0 1.68-.474 2.5 2.5 0 1 1 3.014 3.015 1 1 0 0 0-.474 1.68l1.683 1.682a2.414 2.414 0 0 1 0 3.414L19.61 15.39a1 1 0 0 1-1.68-.474 2.5 2.5 0 1 0-3.014 3.015 1 1 0 0 1 .474 1.68l-1.683 1.682a2.414 2.414 0 0 1-3.414 0L8.61 19.61a1 1 0 0 0-1.68.474 2.5 2.5 0 1 1-3.014-3.015 1 1 0 0 0 .474-1.68l-1.683-1.682a2.414 2.414 0 0 1 0-3.414L4.39 8.61a1 1 0 0 1 1.68.474 2.5 2.5 0 1 0 3.014-3.015 1 1 0 0 1-.474-1.68l1.683-1.682a2.414 2.414 0 0 1 3.414 0z"/></svg></div>
            <div>
              <h4 class="text-lg font-semibold mb-1" style="color: var(--lex-text-primary);">What are Skills?</h4>
              <p class="text-sm" style="color: var(--lex-text-secondary);">Skills are automated workflows that respond to events in your matters. They combine triggers, conditions, and actions to automate repetitive legal tasks.</p>
            </div>
          </div>
          <div class="space-y-4">
            <div>
              <h5 class="text-sm font-semibold mb-1" style="color: var(--lex-text-secondary);">How Skills Work</h5>
              <p class="text-sm" style="color: var(--lex-text-secondary);">Each skill listens for a specific trigger event (e.g., a document upload or a status change). When the event occurs, the skill evaluates its conditions and, if met, executes a sequence of actions such as AI analysis, notifications, or document generation.</p>
            </div>
            <div>
              <h5 class="text-sm font-semibold mb-1" style="color: var(--lex-text-secondary);">Getting Started</h5>
              <ul class="text-sm list-disc list-inside space-y-1" style="color: var(--lex-text-secondary);">
                <li><strong>Browse</strong> the skills catalog to find pre-built automations</li>
                <li><strong>Import</strong> skill packages shared by your team</li>
                <li><strong>Create</strong> custom skills using the LANA designer in the top bar</li>
                <li><strong>Install</strong> skills to specific matters to activate them</li>
              </ul>
            </div>
            <div>
              <h5 class="text-sm font-semibold mb-1" style="color: var(--lex-text-secondary);">Categories</h5>
              <div class="flex flex-wrap gap-2">
                <span class="category-badge category-document-intelligence">Document Intelligence</span>
                <span class="category-badge category-ai-assistance">AI Assistance</span>
                <span class="category-badge category-automation">Automation</span>
                <span class="category-badge category-workflow">Workflow</span>
                <span class="category-badge category-integration">Integration</span>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <lex-btn id="learn-more-close-btn" variant="secondary">Close</lex-btn>
        </div>
      </div>
    </div>

    <!-- Skill Details Modal (hoisted to body by lex-page-init) -->
    <div id="skill-details-modal" class="modal hidden" data-hoist>
      <div class="modal-overlay"></div>
      <div class="modal-content max-w-3xl">
        <div class="modal-header">
          <h3 class="text-xl font-semibold" style="color: var(--lex-text-primary);">Skill Details</h3>
          <button class="modal-close">&times;</button>
        </div>
        <div id="skill-details-body" class="modal-body">
          <!-- Populated by JS -->
        </div>
        <div class="modal-footer">
          <lex-btn id="modal-cancel-btn" variant="secondary">Close</lex-btn>
          <lex-btn id="modal-install-btn" variant="primary">Install to Matter</lex-btn>
        </div>
      </div>
    </div>

    <!-- Matter Selector Modal -->
    <div id="matter-selector-modal" class="modal hidden" data-hoist>
      <div class="modal-overlay"></div>
      <div class="modal-content max-w-2xl">
        <div class="modal-header">
          <h3 class="text-xl font-semibold" style="color: var(--lex-text-primary);">Install Skill to Matter</h3>
          <button class="modal-close">&times;</button>
        </div>
        <div class="modal-body">
          <p class="text-sm mb-4" style="color: var(--lex-text-secondary);">Select one or more matters to install this skill:</p>
          <div class="relative mb-4">
            <input
              type="text"
              id="matter-search-input"
              placeholder="Search matters..."
              class="w-full pl-10 pr-4 py-2 rounded-lg skill-builder-input"
            />
            <svg class="w-5 h-5 absolute left-3 top-1/2 transform -translate-y-1/2" style="color: var(--lex-text-tertiary);" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
          </div>
          <div id="matters-list" class="max-h-96 overflow-y-auto rounded-lg divide-y"
               style="border: 1px solid var(--lex-border-default);">
            <!-- Populated by JS -->
          </div>
        </div>
        <div class="modal-footer">
          <lex-btn id="matter-modal-cancel-btn" variant="secondary">Cancel</lex-btn>
          <lex-btn id="matter-modal-install-btn" variant="primary">Install</lex-btn>
        </div>
      </div>
    </div>

    <!-- Skill Builder Modal (full-screen overlay) -->
    <div id="createSkillModal" class="fixed inset-0 bg-white hidden flex-col" style="z-index: 10001;" data-hoist>
      <!-- Modal Header -->
      <div class="flex items-center justify-between px-6 py-4 shadow-sm"
           style="border-bottom: 1px solid var(--lex-border-default); background: var(--lex-bg-primary);">
        <div class="flex items-center gap-3">
          <div class="flex-shrink-0 w-10 h-10 rounded-lg flex items-center justify-center"
               style="background: var(--lex-bg-accent-muted);">
            <svg class="w-6 h-6" style="color: var(--lex-text-accent);" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
            </svg>
          </div>
          <div>
            <h2 class="text-xl font-semibold" style="color: var(--lex-text-primary);">Skill Builder</h2>
            <p class="text-sm" style="color: var(--lex-text-secondary);">Create a multi-step automated skill</p>
          </div>
        </div>
        <lex-btn id="closeSkillBuilderBtn" variant="ghost" icon="true" title="Close builder">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </lex-btn>
      </div>

      <!-- Modal Body -->
      <div class="flex-1 overflow-hidden flex">
        <!-- Left Panel - Intent Sequencer -->
        <div class="flex-1 p-6 overflow-y-auto" style="background: var(--lex-bg-secondary);">
          <!-- Skill Header -->
          <div class="mb-6 rounded-lg p-5 shadow-sm"
               style="background: var(--lex-bg-primary); border: 1px solid var(--lex-border-default);">
            <div class="flex items-start gap-4">
              <div class="flex-shrink-0 w-12 h-12 rounded-lg flex items-center justify-center"
                   style="background: var(--lex-bg-accent);">
                <svg class="w-6 h-6" style="color: var(--lex-text-on-accent);" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
              </div>
              <div class="flex-1">
                <label class="block text-xs font-semibold mb-2 uppercase tracking-wide"
                       style="color: var(--lex-text-secondary);">Skill Intent</label>
                <input type="text" id="skill_name" placeholder="e.g., Auto-triage new litigation documents"
                       class="w-full px-4 py-2.5 rounded-lg transition-colors font-medium skill-builder-input">
                <textarea id="skill_description" rows="2" placeholder="Describe the business outcome this skill achieves..."
                       class="w-full mt-3 px-4 py-2.5 rounded-lg transition-colors text-sm resize-none skill-builder-input"></textarea>
              </div>
            </div>
          </div>

          <!-- Step Sequence Container -->
          <div id="workflow-steps-container" class="relative space-y-4">
            <!-- Connector Rail (Visual Flow Line) -->
            <div class="absolute left-6 top-0 bottom-0 w-0.5" style="background: var(--lex-border-accent);"></div>
            <!-- Steps will be added here dynamically -->
          </div>

          <!-- Add Step Button -->
          <button type="button" id="addStepBtn"
                  class="w-full mt-6 ml-14 px-6 py-3 bg-white border-2 border-dashed rounded-lg transition-colors flex items-center justify-center gap-2 group"
                  style="border-color: var(--lex-border-strong); color: var(--lex-text-secondary);">
            <div class="w-8 h-8 rounded-lg flex items-center justify-center transition-colors"
                 style="background: var(--lex-bg-tertiary);">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
              </svg>
            </div>
            <span class="font-medium">Add Next Step</span>
          </button>
        </div>

        <!-- Right Panel - MX Diagnostics & Step Palette -->
        <div class="w-96 overflow-y-auto p-6"
             style="border-left: 1px solid var(--lex-border-default); background: var(--lex-bg-primary);">

          <!-- MX Diagnostics Panel -->
          <div class="mb-6 rounded-lg p-5"
               style="background: var(--lex-status-success-bg); border: 1px solid var(--lex-color-success-200, #bbf7d0);">
            <div class="flex items-center justify-between mb-3">
              <h3 class="text-sm font-bold uppercase tracking-wide" style="color: var(--lex-status-success-text);">MX Health</h3>
              <div class="flex items-center gap-1.5">
                <div class="w-2 h-2 rounded-full animate-pulse" style="background: var(--lex-color-success-500);"></div>
                <span class="text-xs font-mono" style="color: var(--lex-status-success-text);">Ready</span>
              </div>
            </div>

            <div class="space-y-3">
              <!-- Parseability Index -->
              <div class="rounded-lg p-3" style="background: var(--lex-bg-primary); border: 1px solid var(--lex-border-default);">
                <div class="flex items-center justify-between mb-2">
                  <span class="text-xs font-medium" style="color: var(--lex-text-secondary);">Parseability Index</span>
                  <span class="text-lg font-bold font-mono" style="color: var(--lex-color-success-700);" id="mx-parseability-score">0%</span>
                </div>
                <div class="h-2 rounded-full overflow-hidden" style="background: var(--lex-color-gray-200);">
                  <div id="mx-parseability-bar" class="h-full transition-all duration-500" style="width: 0%; background: var(--lex-color-success-500);"></div>
                </div>
                <p class="text-xs mt-2" style="color: var(--lex-text-tertiary);">How clearly the AI can understand this workflow</p>
              </div>

              <!-- Intent Clarity -->
              <div class="rounded-lg p-3" style="background: var(--lex-bg-primary); border: 1px solid var(--lex-border-default);">
                <div class="flex items-center justify-between mb-2">
                  <span class="text-xs font-medium" style="color: var(--lex-text-secondary);">Intent Clarity</span>
                  <span class="text-sm font-bold font-mono" style="color: var(--lex-text-secondary);" id="mx-intent-score">Unknown</span>
                </div>
                <p class="text-xs" style="color: var(--lex-text-tertiary);">Add workflow description to improve</p>
              </div>

              <!-- Step Health -->
              <div class="rounded-lg p-3" style="background: var(--lex-bg-primary); border: 1px solid var(--lex-border-default);">
                <div class="flex items-center justify-between mb-1">
                  <span class="text-xs font-medium" style="color: var(--lex-text-secondary);">Step Health</span>
                  <span class="text-sm font-bold font-mono" style="color: var(--lex-text-accent);" id="mx-step-count">0 steps</span>
                </div>
                <div class="flex gap-1 mt-2">
                  <div class="flex-1 text-center">
                    <div class="text-xs font-mono" style="color: var(--lex-color-info-500);" id="mx-trigger-count">0</div>
                    <div class="text-xs" style="color: var(--lex-text-tertiary);">Triggers</div>
                  </div>
                  <div class="flex-1 text-center">
                    <div class="text-xs font-mono" style="color: var(--lex-color-warning-700);" id="mx-condition-count">0</div>
                    <div class="text-xs" style="color: var(--lex-text-tertiary);">Logic</div>
                  </div>
                  <div class="flex-1 text-center">
                    <div class="text-xs font-mono" style="color: var(--lex-color-success-700);" id="mx-action-count">0</div>
                    <div class="text-xs" style="color: var(--lex-text-tertiary);">Actions</div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Step Types Palette -->
          <div class="mb-6">
            <h3 class="text-xs font-bold uppercase tracking-wide mb-4 flex items-center gap-2"
                style="color: var(--lex-text-secondary);">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"></path>
              </svg>
              Step Components
            </h3>

            <div class="space-y-3">
              <!-- Trigger Step -->
              <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 hover:border-blue-300 hover:bg-blue-100 transition-all cursor-pointer">
                <div class="flex items-center gap-3 mb-2">
                  <div class="w-8 h-8 rounded-lg bg-blue-100 flex items-center justify-center">
                    <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                    </svg>
                  </div>
                  <span class="text-sm font-bold text-blue-900">Trigger</span>
                  <code class="ml-auto text-xs font-mono text-blue-700 bg-blue-100 px-2 py-0.5 rounded">trigger.*</code>
                </div>
                <p class="text-xs text-blue-800 leading-relaxed">Initiates workflow on system events</p>
                <div class="mt-2 flex flex-wrap gap-1">
                  <span class="text-xs font-mono text-blue-700 bg-blue-100 px-2 py-0.5 rounded">document.created</span>
                  <span class="text-xs font-mono text-blue-700 bg-blue-100 px-2 py-0.5 rounded">lead.created</span>
                </div>
              </div>

              <!-- Condition Step -->
              <div class="bg-amber-50 border border-amber-200 rounded-lg p-4 hover:border-amber-300 hover:bg-amber-100 transition-all cursor-pointer">
                <div class="flex items-center gap-3 mb-2">
                  <div class="w-8 h-8 rounded-lg bg-amber-100 flex items-center justify-center">
                    <svg class="w-4 h-4 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                  </div>
                  <span class="text-sm font-bold text-amber-900">Condition</span>
                  <code class="ml-auto text-xs font-mono text-amber-700 bg-amber-100 px-2 py-0.5 rounded">if.*</code>
                </div>
                <p class="text-xs text-amber-800 leading-relaxed">Branches flow based on data evaluation</p>
                <div class="mt-2 flex flex-wrap gap-1">

            class="border-2 border-dashed rounded-xl p-8 text-center cursor-pointer transition-colors mb-4"

            </svg>

            <p class="text-xs mt-1" style="color: var(--lex-text-tertiary);">or click to browse (.zip files only, max 5MB)</p>
            <input type="file" id="skill-file-input" accept=".zip,application/zip" class="hidden">
          </div>
          <!-- Selected file info -->
          <div id="skill-file-info" class="hidden mb-4">
            <div class="flex items-center justify-between p-3 rounded-lg"

                </svg>
                <div>
                  <p id="skill-file-name" class="text-sm font-medium" style="color: var(--lex-text-primary);"></p>
                  <p id="skill-file-size" class="text-xs" style="color: var(--lex-text-tertiary);"></p>
                </div>
              </div>
              <button id="skill-file-clear-btn" class="text-xs font-medium"
                      style="color: var(--lex-color-danger-500);">Remove</button>
            </div>
          </div>
          <!-- Import result -->
          <div id="skill-import-result" class="hidden mb-4"></div>
        </div>
        <div class="modal-footer">
          <lex-btn id="skill-import-cancel-btn" variant="secondary">Cancel</lex-btn>
          <lex-btn id="skill-import-confirm-btn" variant="primary" disabled>Import Skill</lex-btn>
