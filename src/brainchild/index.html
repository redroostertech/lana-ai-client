<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Brainchild</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231b1430'/%3E%3Cpath d='M32 14a12 12 0 0 0-9 20l1 6h16l1-6a12 12 0 0 0-9-20z' fill='%23f4b740'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="../css/tailwind-output.css">
    <script src="../js/tailwind-loader.js"></script>
    <link rel="stylesheet" href="../css/lex-tokens.css">
    <script src="../js/config.js"></script>
    <script src="../js/app-catalog.js"></script>
    <script>
      if (window.location.protocol !== 'file:' && window.LanaConfig) {
        window.LanaConfig.API_BASE_URL = '';
      }
    </script>
    <link rel="stylesheet" href="./styles.css?v=20260609-brainchild">
    <link rel="stylesheet" href="../css/lex-chat.css">
</head>
  <body>
    <lex-app
      id="brainchild-shell"
      logo-src="../img/logo-light.png"
      logo-alt="LANA AI"
      logo-href="../dashboard.html"
      active-nav-id="brainchild-library"
      page-title="Brainchild"
    ></lex-app>

    <template id="brainchildTemplate">
      <main class="bc-shell">
        <lex-banner
          id="brainchildBanner"
          variant="light"
          heading="Brainchild"
          subtitle="One surface for your organization's documents and your personal knowledge."
          max-actions="0"
          lana
          lana-context-type="full_chat"
        ></lex-banner>

        <div class="bc-toolbar">
          <lex-segmented
            id="bcScopeToggle"
            value="org"
            options='[{"value":"org","label":"Organization"},{"value":"my","label":"My"}]'
          ></lex-segmented>
        </div>

        <section id="bcOrgPanel" class="bc-panel" aria-label="Organization documents">
          <div class="bc-table-toolbar" role="search" aria-label="Search and filter organization documents">
            <div class="bc-table-toolbar-row">
              <div class="bc-table-toolbar-search">
                <lex-input id="bcOrgSearch" placeholder="Search documents..." clearable="true" leading-icon="search"></lex-input>
              </div>
              <div class="bc-table-toolbar-group">
                <label class="bc-table-toolbar-label">Sort by:</label>
                <lex-select
                  id="bcOrgSort"
                  options='[{"value":"updated_at","label":"Last edited"},{"value":"created_at","label":"Created"},{"value":"name","label":"File"}]'
                  value="updated_at"
                ></lex-select>
              </div>
              <lex-btn id="bcOrgSortOrder" variant="ghost" icon="true" title="Toggle sort order" data-order="desc">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12"></path>
              </svg>
              </lex-btn>
              <div class="bc-table-toolbar-group">
                <label class="bc-table-toolbar-label">Source:</label>
                <lex-select
                  id="bcOrgSource"
                  options='[{"value":"stored","label":"Documents"},{"value":"studio","label":"Doc Studio files"}]'
                  value="stored"
                ></lex-select>
              </div>
              <div id="bcOrgCount" class="bc-table-toolbar-label"></div>
            </div>
          </div>

          <div class="bc-section-heading">
            <h2 id="bcOrgSectionTitle" class="bc-section-title">Documents</h2>
            <span id="bcOrgSectionCount" class="bc-table-toolbar-label" aria-live="polite"></span>
          </div>

          <lex-table
            id="bcOrgTable"
            class="lex-table--card"
            column-filters
            server-paging
            columns="name,type,workspace,is_template,created_at,updated_at"
            labels="File,Type,Matter,Template,Created,Last edited"
            sortable-columns="name,created_at,updated_at"
            sort-by="updated_at"
            sort-dir="desc"
            limit="20"
            id-key="id"
            empty-text="No organization documents yet."
            aria-label="Organization documents"
          ></lex-table>
          <lex-table
            id="bcOrgStudioTable"
            class="lex-table--card"
            column-filters
            columns="name,style,cards,created_at"
            labels="File,Style,Sections,Created"
            sort-by="created_at"
            sort-dir="desc"
            limit="20"
            id-key="id"
            empty-text="No saved Doc Studio files yet."
            aria-label="Doc Studio files"
            style="display: none"
          ></lex-table>
        </section>

        <section id="bcMyPanel" class="bc-panel bc-hidden" aria-label="My personal knowledge">
          <lex-banner
            id="bcMyBanner"
            class="bc-hidden"
            variant="light"
            size="compact"
            max-actions="0"
            lana
            lana-context-type="full_chat"
          ></lex-banner>
          <lex-empty
            id="bcMyEmpty"
            icon="link"
            message="Connect Brainchild"
            description="Your personal notes live in the Brainchild app on this device. Launch and connect Brainchild to read your vault here."
            action-label="Launch Brainchild"
          ></lex-empty>
          <div id="bcMyList" class="bc-list bc-hidden">
            <div class="bc-table-toolbar" role="search" aria-label="Search and filter personal notes">
              <div class="bc-table-toolbar-row">
                <div class="bc-table-toolbar-search">
                  <lex-input id="bcMySearch" placeholder="Search notes..." clearable="true" leading-icon="search"></lex-input>
                </div>
                <div class="bc-table-toolbar-group">
                  <label class="bc-table-toolbar-label">Sort by:</label>
                  <lex-select
                    id="bcMySort"
                    options='[{"value":"updated_at","label":"Last edited"},{"value":"created_at","label":"Created"},{"value":"name","label":"Name"},{"value":"folder","label":"Folder"}]'
                    value="updated_at"
                  ></lex-select>
                </div>
                <lex-btn id="bcMySortOrder" variant="ghost" icon="true" title="Toggle sort order" data-order="desc">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12"></path>
              </svg>
                </lex-btn>
                <div id="bcMyCount" class="bc-table-toolbar-label"></div>
              </div>
            </div>

            <div class="bc-section-heading">
              <h2 class="bc-section-title">My notes</h2>
              <span id="bcMySectionCount" class="bc-table-toolbar-label" aria-live="polite"></span>
            </div>

            <lex-table
              id="bcMyTable"
              class="lex-table--card"
              column-filters
              columns="name,folder,created_at,updated_at"
              labels="Name,Folder,Created,Last edited"
              sort-by="updated_at"
              sort-dir="desc"
              limit="20"
              id-key="id"
              empty-text="No personal notes found."
              aria-label="Personal notes"
            ></lex-table>
          </div>
        </section>

        <p id="bcStatus" class="bc-status" role="status"></p>
      </main>
    </template>

    <script src="../js/version.js"></script>
    <script src="../js/time-utils.js"></script>
    <script src="../js/lex/lex.core.js"></script>
    <script src="../js/lex/lex.icons.js"></script>
    <script src="../js/lex/lex.utils.js"></script>
    <script src="../js/lex/lex.data.js"></script>
    <script src="../js/lex/lex.forms.js"></script>
    <script src="../js/lex/lex.state.js"></script>
    <script src="../js/lex/lex-nav.js"></script>
    <script src="../js/lex/components/foundation/lex-btn.js"></script>
    <script src="../js/lex/components/foundation/lex-badge.js"></script>
    <script src="../js/lex/components/foundation/lex-empty.js?v=20260526-empty-state"></script>
    <script src="../js/lex/components/foundation/lex-banner.js"></script>
    <script src="../js/lex/components/foundation/lex-modal.js"></script>
    <script src="../js/lex/components/foundation/lex-toast.js"></script>
    <script src="../js/lex/components/form/lex-segmented.js"></script>

    <script src="../js/lex/components/form/lex-select.js"></script>
    <script src="../js/lex/components/data/lex-table.js"></script>
    <script src="../js/lex/components/data/lex-pagination.js"></script>
    <script src="../js/lex/components/layout/lex-sidebar.js"></script>
    <script src="../js/lex/components/layout/lex-topbar.js"></script>

    <script src="../js/lex/components/layout/lex-app.js"></script>
    <script src="../js/lex/index.js"></script>
    <script src="../js/sidebar-footer-hydrate.js"></script>
    <script src="../js/shared/document-library-mapper.js"></script>
    <script src="../js/shared/brainchild-promote-builder.js"></script>
    <script src="../js/shared/library-column-filters.js"></script>
    <script src="../js/shared/doc-studio-library-table.js"></script>
    <script src="../js/shared/brainchild-table.js"></script>
    <script>
      (function () {
        function mountBrainchild() {
          var shell = document.getElementById('brainchild-shell');
          var template = document.getElementById('brainchildTemplate');
          if (!shell || !template || shell.dataset.brainchildMounted === 'true') return;
          var content = typeof shell.getContentEl === 'function'
            ? shell.getContentEl()
            : document.getElementById('lex-main-content');
          if (!content) return;
          shell.dataset.brainchildMounted = 'true';
          shell.setAttribute('active-nav-id', 'brainchild-library');
          if (typeof shell.setSections === 'function') {
            shell.setSections([
              {
                id: 'brainchild',
                isStaticTop: true,
                items: [
                  { id: 'brainchild-library', label: 'Library', icon: 'table', isButton: true }
                ]
              }
            ]);
          }
          content.appendChild(template.content.cloneNode(true));
          var script = document.createElement('script');
          script.src = './app.js?v=20260609-brainchild';
          document.body.appendChild(script);
        }

        var shell = document.getElementById('brainchild-shell');
        if (shell) {
          shell.addEventListener('lex-app-ready', mountBrainchild, { once: true });
          requestAnimationFrame(mountBrainchild);
        }
      })();
    </script>
    <lex-lana-dock page-scope="brainchild" context-type="full_chat" placeholder="Ask LANA anything..." thread-title="LANA Chat"></lex-lana-dock>
