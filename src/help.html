<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Help & Support - LANA AI</title>

  <!-- ── CSS + Tailwind in head — behavioral scripts at end of body ── -->
  <link rel="stylesheet" href="css/lex-tokens.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/tailwind-output.css">
  <link rel="stylesheet" href="css/companion-bridge-consent.css">
  <script src="js/tailwind-loader.js"></script>

  <link rel="stylesheet" href="css/lex-chat.css">
</head>
<body>

  <!-- Branded loader — shows once lex-loader.js upgrades the element -->
  <lex-loader theme="light"></lex-loader>

  <!-- App shell — sidebar, topbar, empty content area.
       Page content lives in <template> below and gets injected after
       the shell renders. This avoids double-rendering of child components. -->
  <lex-app
    logo-src="img/logo-light.png"
    logo-alt="LANA AI"
    logo-href="dashboard.html"
    active-nav-id="help"
    page-title="Help & Support"
  ></lex-app>

  <!-- Page content as inert <template> — elements inside are NOT upgraded
       by the browser until cloned into the live DOM. Zero double-rendering. -->
  <template id="page-content">

    <main>

      <!-- Header -->
      <div class="bg-gradient-to-r from-indigo-500 to-purple-600 rounded-2xl p-8 mb-8 text-white">
        <h2 class="text-3xl font-bold mb-2">How can we help you?</h2>
        <p class="text-indigo-100 mb-6">Search our help articles or contact our support team</p>

        <!-- Search Bar -->
        <div class="relative max-w-2xl">
          <input
            type="text"
            id="helpSearch"
            placeholder="Search help articles and FAQs..."
            class="w-full px-4 py-3 pr-12 rounded-lg text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-300"
          />
          <button class="absolute right-3 top-3 text-gray-400 hover:text-gray-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
          </button>
        </div>

        <!-- Quick Links -->
        <div class="flex flex-wrap gap-2 mt-4">
          <a href="faq.html" class="px-3 py-1 bg-white/20 hover:bg-white/30 rounded-full text-sm transition-colors">
            View FAQs
          </a>
          <a href="#contact-support" class="px-3 py-1 bg-white/20 hover:bg-white/30 rounded-full text-sm transition-colors">
            Contact Support
          </a>
          <a href="https://www.youtube.com/@redroostertec" target="_blank" class="px-3 py-1 bg-white/20 hover:bg-white/30 rounded-full text-sm transition-colors" style="display: none;">
            Video Tutorials
          </a>
        </div>
      </div>

      <!-- Loading State -->
      <div id="helpLoading" class="flex items-center justify-center py-12">
        <div class="animate-spin w-12 h-12 border-4 border-indigo-200 border-t-indigo-600 rounded-full"></div>
      </div>

      <!-- Error State -->
      <div id="helpError" class="hidden bg-red-50 border border-red-200 rounded-lg p-6 text-center">
        <svg class="w-12 h-12 text-red-500 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <h3 class="text-lg font-semibold text-gray-900 mb-2">Failed to load help content</h3>
        <p class="text-gray-600 mb-4">There was an error loading the help articles. Please try again.</p>
        <button id="retryLoadHelp" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors">
          Retry
        </button>
      </div>

      <!-- Help Content -->
      <div id="helpContent" class="hidden">
        <!-- Quick Access Cards -->
        <div id="quickLinks" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
          <!-- Dynamically populated -->
        </div>

        <!-- Help Sections -->
        <div id="helpSections">
          <!-- Dynamically populated -->
        </div>
      </div>

      <!-- Contact Support Section -->
      <div id="contact-support" class="mt-12 bg-white rounded-xl shadow-sm border border-gray-200 p-8">
        <div class="max-w-2xl mx-auto">
          <div class="text-center mb-8">
            <div class="w-16 h-16 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-4">
              <svg class="w-8 h-8 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
              </svg>
            </div>
            <h2 class="text-2xl font-bold text-gray-900 mb-2">Contact Support</h2>
            <p class="text-gray-600">Can't find what you're looking for? Send us a message and we'll get back to you within 24 hours.</p>
          </div>

          <!-- Contact Form -->
          <form id="contactSupportForm" class="space-y-6">
            <!-- Hidden fields for user data (auto-populated from session) -->
            <input type="hidden" id="contactName" />
            <input type="hidden" id="contactEmail" />
            <input type="hidden" id="contactOrganization" />

            <div>
              <label for="contactSubject" class="block text-sm font-medium text-gray-700 mb-2">Subject *</label>
              <input
                type="text"
                id="contactSubject"
                required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                placeholder="Brief description of your issue"
              />
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <label for="contactCategory" class="block text-sm font-medium text-gray-700 mb-2">Category *</label>
                <select
                  id="contactCategory"
                  required
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                >
                  <option value="">Select a category</option>
                  <option value="technical">Technical Support</option>
                  <option value="billing">Billing Question</option>
                  <option value="feature-request">Feature Request</option>
                  <option value="bug-report">Bug Report</option>
                  <option value="general">General Inquiry</option>
                </select>
              </div>

              <div>
                <label for="contactPriority" class="block text-sm font-medium text-gray-700 mb-2">Priority *</label>
                <select
                  id="contactPriority"
                  required
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                >
                  <option value="normal">Normal</option>
                  <option value="low">Low</option>
                  <option value="high">High</option>
                  <option value="urgent">Urgent</option>
                </select>
              </div>
            </div>

            <div>
              <label for="contactMessage" class="block text-sm font-medium text-gray-700 mb-2">Message *</label>
              <textarea
                id="contactMessage"
                required
                rows="6"
                minlength="20"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                placeholder="Describe your issue or question in detail..."
              ></textarea>
              <p class="text-xs text-gray-500 mt-1">Minimum 20 characters</p>
            </div>

            <!-- Success Message -->
            <div id="contactSuccess" class="hidden bg-green-50 border border-green-200 rounded-lg p-4">
              <div class="flex items-start">
                <svg class="w-5 h-5 text-green-600 mt-0.5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <div>
                  <h4 class="text-sm font-medium text-green-800">Message sent successfully!</h4>
                  <p class="text-sm text-green-700 mt-1">We've received your support request. Our team will respond within 24 hours.</p>
                  <p class="text-xs text-green-600 mt-2">Ticket ID: <span id="ticketId" class="font-mono"></span></p>
                </div>
              </div>
            </div>

            <!-- Error Message -->
            <div id="contactError" class="hidden bg-red-50 border border-red-200 rounded-lg p-4">
              <div class="flex items-start">
                <svg class="w-5 h-5 text-red-600 mt-0.5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <div>
                  <h4 class="text-sm font-medium text-red-800">Failed to send message</h4>
                  <p class="text-sm text-red-700 mt-1" id="contactErrorMessage">An error occurred. Please try again or email support@redroostertec.com directly.</p>
                </div>
              </div>
            </div>

            <div class="flex items-center justify-between pt-4 border-t border-gray-200">
              <p class="text-sm text-gray-500">Fields marked with * are required</p>
              <button
                type="submit"
                id="submitContactForm"
                class="px-6 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors font-medium flex items-center gap-2"
              >
                <span>Send Message</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                </svg>
              </button>
            </div>
          </form>
        </div>
      </div>

    </main>

  </template>

  <noscript>
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,sans-serif;color:#666;">
      Please enable JavaScript to use LANA AI.
    </div>
  </noscript>

  <!-- ══════════════════════════════════════════════════════════════════
       Scripts at end of body — HTML renders first, scripts load after
       ══════════════════════════════════════════════════════════════════ -->

  <!-- Universal shell scripts -->
  <script src="js/error-reporter.js"></script>
  <script src="js/config.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/time-utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/utils/rename-conversation.js"></script>
  <script src="js/components.js"></script>
  <script src="js/version.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/navigation-helpers.js"></script>
  <script src="js/conversation-search-modal.js"></script>
  <script src="js/contact-search-modal.js"></script>
  <script src="js/notifications.js"></script>

  <!-- Lex UI core -->
  <script src="js/lex/lex.core.js"></script>
  <script src="js/lex/lex.icons.js"></script>
  <script src="js/lex/lex.data.js"></script>
  <script src="js/lex/lex.forms.js"></script>
  <script src="js/lex/lex.state.js"></script>
  <script src="js/lex/lex.utils.js"></script>
  <script src="js/lex/lex.auth.js"></script>
  <script src="js/lex/lex-nav.js"></script>

  <!-- Lex UI layout (shell components — lex-app builds sidebar/topbar) -->
  <script src="js/lex/components/foundation/lex-loader.js"></script>
  <script src="js/lex/components/foundation/lex-toast.js"></script>
  <script src="js/lex/components/foundation/lex-spinner.js"></script>
  <script src="js/lex/components/foundation/lex-btn.js"></script>
  <script src="js/lex/components/foundation/lex-empty.js"></script>
  <script src="js/lex/components/foundation/lex-modal.js"></script>
  <script src="js/lex/components/layout/lex-sidebar.js"></script>
  <script src="js/lex/components/layout/lex-topbar.js"></script>
  <script src="js/lex/components/layout/lex-conversation-item.js"></script>
  <script src="js/lex/components/layout/lex-notification-panel.js"></script>
  <script src="js/lex/components/layout/lex-app.js"></script>

  <!-- Inject page content + hoist modals -->
  <script src="js/lex/lex-page-init.js"></script>

  <!-- Page controller (MUST be last before auth-guard) -->
  <script src="js/help.js"></script>

  <!-- PAC bridge consent handler (Lex modal for token requests) -->
  <script src="js/companion-bridge-consent.js"></script>

  <lex-lana-dock page-scope="dashboard" context-type="full_chat" placeholder="Ask LANA anything..." thread-title="LANA Chat"></lex-lana-dock>
  <!-- LANA dock (IDE-style docked chat panel) -->
  <script src="js/lex/chat/lex-chat.format.js"></script>
  <script src="js/lex/chat/lex-chat.conversations-api.js"></script>
  <script src="js/lex/chat/lex-chat.source.js"></script>
  <script src="js/lex/chat/lex-chat.message.js"></script>
  <script src="js/lex/chat/lex-chat.activity.js"></script>
  <script src="js/lex/chat/lex-chat.documents.js"></script>
  <script src="js/lex/chat/lex-chat.composer-mentions.js"></script>
  <script src="js/lex/chat/lex-chat.composer.js"></script>
  <script src="js/lex/chat/lex-chat.thread.js"></script>
  <script src="js/lex/chat/lex-chat.threads.js"></script>
  <script src="js/lex/chat/lex-chat.js"></script>
  <script src="js/lex/chat/lex-dynamic-card.renderer.js"></script>
  <script src="js/lex/chat/lex-agentic-plan-card.js"></script>
  <script src="js/lex/chat/lex-chat.index.js"></script>
  <script src="js/lex/components/chat/lex-lana-panel.js"></script>
  <script src="js/lex/components/layout/lex-lana-dock.js"></script>

  <!-- Auth guard + loader dismiss (MUST be last) -->
  <script src="js/auth-guard.js"></script>
</body>
</html>
