<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workspace Data - LANA AI</title>

  <link rel="stylesheet" href="css/lex-tokens.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/tailwind-output.css">
  <link rel="stylesheet" href="css/lex-chat.css">
  <link rel="stylesheet" href="css/workspace-summary.css">
  <!-- lana-ask-btn.css replaced by self-contained lex-ask-lana-btn component -->
  <link rel="stylesheet" href="css/companion-bridge-consent.css">
  <script src="js/tailwind-loader.js"></script>
</head>
<body>

  <lex-loader theme="light"></lex-loader>

  <lex-app
    logo-src="img/logo-light.png"
    logo-alt="LANA AI"
    logo-href="dashboard.html"
    active-nav-id="workspaces"
    page-title="Workspace Data"
  ></lex-app>

  <template id="page-content">

    <main style="display:flex;flex-direction:column;height:calc(100vh - var(--lex-topbar-height, 64px));overflow:hidden;margin:0;box-sizing:border-box;">

      <div id="wsDataLayout" style="display:flex;flex:1;min-height:0;overflow:hidden;">

        <!-- Left: main content column -->
        <div id="wsDataMainColumn" style="flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;">

          <!-- Page header -->
          <lex-banner
            id="wsDataBanner"
            variant="light"
            heading="Connected Data"
            subtitle="Browse and query data connected to this workspace"
          >
            <lex-ask-lana-btn panel="wsDataLana" size="sm"></lex-ask-lana-btn>
          </lex-banner>

          <lex-breadcrumb id="wsDataBreadcrumb" items='[{"label":"Workspaces","href":"workspaces.html"},{"label":"Connected Data"}]'></lex-breadcrumb>

          <!-- Summary stats bar -->
          <div id="wsDataSummary" style="padding:0 1rem;flex-shrink:0;">
            <div style="display:flex;gap:0.75rem;margin-bottom:0.75rem;" id="wsDataStatCards"></div>
          </div>

          <!-- Table area -->
          <div style="flex:1;min-height:0;display:flex;flex-direction:column;padding:0 1rem 1rem;">
            <lex-card padding="none" style="flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;">
              <div style="display:flex;align-items:center;gap:0.75rem;padding:0.75rem 1rem;flex-shrink:0;flex-wrap:wrap;">
                <lex-select
                  id="wsDataEntityFilter"
                  placeholder="All Entity Types"
                  size="sm"
                  style="width:200px;"
                ></lex-select>
                <lex-select
                  id="wsDataConnectorFilter"
                  placeholder="All Connectors"
                  size="sm"
                  style="width:200px;"
                ></lex-select>
                <div style="flex:1;"></div>
                <input
                  type="text"
                  id="wsDataSearch"
                  placeholder="Search records..."
                  style="width:240px;padding:6px 12px;border:1px solid var(--lex-border-default, #e5e7eb);border-radius:6px;font-size:13px;outline:none;"
                >
                <lex-btn id="wsDataImportBtn" variant="primary" size="sm" leading-icon="upload">Import CSV</lex-btn>
              </div>
              <div id="wsDataImportStrip" class="ws-import-strip" hidden></div>
              <div id="wsDataImportHistory" class="ws-import-history" data-testid="workspace-csv-import-history" hidden></div>
              <lex-table
                id="wsDataTable"
                columns="external_id,entity_type,connector_id,raw_data,ai_action"
                labels="ID,Entity Type,Connector,Data,&#8203;"
                searchable
                filterable
                empty-text="No connected data found"
                sort-by="synced_at"
                sort-dir="desc"
                style="flex:1;min-height:0;overflow:hidden;"
              ></lex-table>
              <lex-pagination id="wsDataPagination" style="padding:0 1rem;flex-shrink:0;"></lex-pagination>
            </lex-card>
          </div>

        </div>

        <!-- Right column: Unified LANA chat panel -->
        <lex-lana-panel
          id="wsDataLana"
          mode="column"
          page-scope="workspace_data"
          context-type="full_chat"
          placeholder="Ask about this workspace data..."
          composer-tools='[{"id":"insights_chat","label":"Insights","icon":"eye","description":"Ask about this workspace data"},{"id":"skills_chat","label":"Create Task","icon":"wand","description":"Create a skill or task for LANA"}]'
          tools-locked="false"
          thread-title="Workspace Data"
          column-heading="LANA Assistant"
          column-subtitle="Query data insights or create tasks"
          width="380"
          style="margin-left:16px;"
        ></lex-lana-panel>

      </div>

      <lex-modal id="wsDataImportModal" heading="Import CSV" size="full" hide-actions="true">
        <div class="ws-import-wizard" data-import-wizard>
          <div class="ws-import-rail">
            <div class="ws-import-step is-active" data-step-marker="upload">
              <span>1</span>
              <div>
                <strong>Upload</strong>
                <small>Select a CSV file</small>
              </div>
            </div>
            <div class="ws-import-step" data-step-marker="mapping">
              <span>2</span>
              <div>
                <strong>Mapping</strong>
                <small>Review inferred fields</small>
              </div>
            </div>
            <div class="ws-import-step" data-step-marker="validation">
              <span>3</span>
              <div>
                <strong>Validate</strong>
                <small>Spot-check rows</small>
              </div>
            </div>
            <div class="ws-import-step" data-step-marker="promotion">
              <span>4</span>
              <div>
                <strong>Promote</strong>
                <small>Import records</small>
              </div>
            </div>
          </div>

          <div class="ws-import-body">
            <section class="ws-import-pane is-active" data-step-pane="upload">
              <lex-card padding="lg">
                <div class="ws-import-pane-head">
                  <div>
                    <h3>Upload CSV</h3>
                    <p>Stage a CSV against this workspace and infer an initial field mapping.</p>
                  </div>
                  <lex-badge id="wsImportUploadBadge" label="Ready" color="gray" size="sm"></lex-badge>
                </div>
                <label class="ws-import-drop" for="wsImportFile">
                  <input id="wsImportFile" type="file" accept=".csv,text/csv">
                  <span class="ws-import-drop-icon">CSV</span>
                  <strong id="wsImportFileName">Choose a CSV file</strong>
                  <small id="wsImportFileMeta">Up to the backend CSV upload limit</small>
                </label>
                <div class="ws-import-form-grid">
                  <label>
                    <span>Source name</span>
                    <input id="wsImportSourceName" type="text" placeholder="CSV source name">
                  </label>
                  <label>
                    <span>Timezone</span>
                    <input id="wsImportTimezone" type="text" value="UTC">
                  </label>
                </div>
                <div class="ws-import-footer">
                  <lex-btn id="wsImportCancelUpload" variant="secondary" size="sm">Cancel</lex-btn>
                  <lex-btn id="wsImportUploadAction" variant="primary" size="sm" leading-icon="upload">Upload and Infer</lex-btn>
                </div>
              </lex-card>
            </section>

            <section class="ws-import-pane" data-step-pane="mapping">
              <div class="ws-import-pane-head">
                <div>
                  <h3>Column Mapping</h3>
                  <p>Adjust how CSV columns map to the target entity before validation.</p>
                </div>
                <div class="ws-import-inline-actions">
                  <lex-badge id="wsImportMappingBadge" label="Not uploaded" color="gray" size="sm"></lex-badge>
                </div>
              </div>
              <div id="wsImportPreviewSummary" class="ws-import-summary"></div>
              <div class="ws-import-entity-row">
                <label>
                  <span>Target entity</span>
                  <select id="wsImportEntityType"></select>
                </label>
              </div>
              <div class="ws-import-table-wrap">
                <table class="ws-import-map-table">
                  <thead>
                    <tr>
                      <th>CSV Column</th>
                      <th>Target Field</th>
                      <th>Sample Values</th>
                      <th>Confidence</th>
                    </tr>
                  </thead>
                  <tbody id="wsImportMappingRows"></tbody>
                </table>
              </div>
              <div
                id="wsImportCustomFieldApproval"
                class="ws-import-custom-approval"
                data-testid="workspace-csv-custom-field-approval"
                hidden
              >
                <div class="ws-import-custom-approval-copy">
                  <strong>Custom field approval required</strong>
                  <p>These CSV columns will be saved outside the standard entity schema as named custom fields.</p>
                  <ul id="wsImportCustomFieldList" class="ws-import-custom-field-list"></ul>
                </div>
                <lex-checkbox
                  id="wsImportCustomFieldApproved"
                  data-testid="workspace-csv-custom-field-approved"
                  label="I approve importing these columns as custom fields"
                ></lex-checkbox>
              </div>
              <div class="ws-import-footer">
                <lex-btn id="wsImportBackToUpload" variant="secondary" size="sm">Back</lex-btn>
                <lex-btn id="wsImportSaveMapping" variant="secondary" size="sm">Save Mapping</lex-btn>
                <lex-btn id="wsImportValidateAction" variant="primary" size="sm">Validate Rows</lex-btn>
              </div>
            </section>

            <section class="ws-import-pane" data-step-pane="validation">
              <div class="ws-import-pane-head">
                <div>
                  <h3>Validation</h3>
                  <p>Review row outcomes and spot-check mapped values before importing.</p>
                </div>
                <lex-badge id="wsImportValidationBadge" label="Not validated" color="gray" size="sm"></lex-badge>
              </div>
              <div id="wsImportValidationSummary" class="ws-import-summary"></div>
              <div class="ws-import-table-wrap">
                <table class="ws-import-row-table">
                  <thead>
                    <tr>
                      <th class="ws-import-select-heading">Import</th>
                      <th>Row</th>
                      <th>Status</th>
                      <th>Mapped Data</th>
                      <th>Issues</th>
                    </tr>
                  </thead>
                  <tbody id="wsImportValidationRows"></tbody>
                </table>
              </div>
              <div class="ws-import-spot-check">
                <lex-checkbox
                  id="wsImportSpotCheckConfirmed"
                  data-testid="workspace-csv-import-spot-check-confirmed"
                  label="I reviewed the mapped values and selected rows for this import"
                ></lex-checkbox>
              </div>
              <div id="wsImportPlan" class="ws-import-plan" data-testid="workspace-csv-import-plan" hidden></div>
              <div class="ws-import-footer">
                <lex-btn id="wsImportBackToMapping" variant="secondary" size="sm">Back</lex-btn>
                <lex-btn id="wsImportRefreshRows" variant="secondary" size="sm">Refresh Rows</lex-btn>
                <lex-btn id="wsImportPromoteAction" variant="primary" size="sm">Promote Import</lex-btn>
              </div>
            </section>

            <section class="ws-import-pane" data-step-pane="promotion">
              <lex-card padding="lg">
                <div class="ws-import-pane-head">
                  <div>
                    <h3>Import Result</h3>
                    <p>Promotion creates connected data records from validated rows and preserves row lineage.</p>
                  </div>
                  <lex-badge id="wsImportPromotionBadge" label="Not imported" color="gray" size="sm"></lex-badge>
                </div>
                <div id="wsImportPromotionSummary" class="ws-import-summary"></div>
                <div id="wsImportPromotionRows" class="ws-import-result-list"></div>
                <div class="ws-import-footer">
                  <lex-btn id="wsImportCloseDone" variant="secondary" size="sm">Close</lex-btn>
                  <lex-btn id="wsImportReloadData" variant="primary" size="sm">Refresh Connected Data</lex-btn>
                </div>
              </lex-card>
            </section>
          </div>
        </div>
      </lex-modal>

    </main>

  </template>

  <noscript>
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,sans-serif;color:#666;">
      Please enable JavaScript to use LANA AI.
    </div>
  </noscript>

  <!-- Universal shell scripts -->
  <script src="js/error-reporter.js"></script>
  <script src="js/config.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/time-utils.js"></script>
  <script src="js/shared/request-retry.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/utils/rename-conversation.js"></script>
  <script src="js/components.js"></script>
  <script src="js/version.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/navigation-helpers.js"></script>
  <script src="js/conversation-search-modal.js"></script>
  <script src="js/contact-search-modal.js"></script>
  <script src="js/notifications.js"></script>

  <!-- Lex UI core -->
  <script src="js/lex/lex.core.js"></script>
  <script src="js/lex/lex.icons.js"></script>
  <script src="js/lex/lex.data.js"></script>
  <script src="js/lex/lex.forms.js"></script>
  <script src="js/lex/lex.state.js"></script>
  <script src="js/lex/lex.utils.js"></script>
  <script src="js/lex/lex.auth.js"></script>
  <script src="js/lex/lex-nav.js"></script>

  <!-- Lex UI foundation + layout -->
  <script src="js/lex/components/foundation/lex-loader.js"></script>
  <script src="js/lex/components/foundation/lex-toast.js"></script>
  <script src="js/lex/components/foundation/lex-spinner.js"></script>
  <script src="js/lex/components/foundation/lex-btn.js"></script>
  <script src="js/lex/components/foundation/lex-empty.js"></script>
  <script src="js/lex/components/foundation/lex-badge.js"></script>
  <script src="js/lex/components/form/lex-segmented.js"></script>
  <script src="js/lex/components/layout/lex-sidebar.js"></script>
  <script src="js/lex/components/layout/lex-topbar.js"></script>
  <script src="js/lex/components/layout/lex-conversation-item.js"></script>
  <script src="js/lex/components/layout/lex-notification-panel.js"></script>
  <script src="js/lex/components/layout/lex-app.js"></script>

  <!-- Page-specific Lex components -->
  <script src="js/lex/components/foundation/lex-breadcrumb.js"></script>
  <script src="js/lex/components/foundation/lex-banner.js"></script>
  <script src="js/lex/components/foundation/lex-card.js"></script>
  <script src="js/lex/components/foundation/lex-modal.js"></script>
  <script src="js/lex/components/form/lex-checkbox.js"></script>
  <script src="js/lex/components/form/lex-select.js"></script>
  <script src="js/lex/components/data/lex-table.js"></script>
  <script src="js/lex/components/data/lex-pagination.js"></script>

  <!-- Mermaid -->
  <script src="js/vendor/mermaid.min.js"></script>

  <!-- Services used by chat components -->
  <script src="js/services/document-processing.service.js"></script>

  <!-- Chat components -->
  <script src="js/lex/chat/lex-chat.format.js"></script>
  <script src="js/lex/chat/lex-chat.conversations-api.js"></script>
  <script src="js/lex/chat/lex-chat.source.js"></script>
  <script src="js/lex/chat/lex-chat.message.js"></script>
  <script src="js/lex/chat/lex-chat-progress-events.js"></script>
  <script src="js/lex/chat/lex-chat.activity.js"></script>
  <script src="js/lex/chat/lex-chat.documents.js"></script>
  <script src="js/lex/chat/lex-chat.composer-mentions.js"></script>
  <script src="js/services/slash-commands.service.js"></script>
  <script src="js/lex/chat/lex-chat.composer-slash.js"></script>
  <script src="js/lex/chat/lex-chat.composer.js"></script>
  <script src="js/lex/chat/lex-chat.thread.js"></script>
  <script src="js/lex/chat/lex-chat.threads.js"></script>
  <script src="js/lex/chat/lex-chat.js"></script>
  <script src="js/lex/chat/lex-dynamic-card.renderer.js"></script>
  <script src="js/lex/chat/lex-agentic-plan-card.js"></script>
  <script src="js/lex/chat/lex-chat.index.js"></script>
  <script src="js/lex/components/chat/lex-ask-lana-btn.js"></script>
  <script src="js/lex/components/chat/lex-lana-panel.js"></script>

  <!-- Inject page content -->
  <script src="js/lex/lex-page-init.js"></script>

  <!-- Page controller -->
  <script src="js/workspace-data.js"></script>

  <!-- PAC bridge consent handler (Lex modal for token requests) -->
  <script src="js/companion-bridge-consent.js"></script>

  <!-- Auth guard (MUST be last) -->
  <script src="js/auth-guard.js"></script>
  <lex-lana-dock page-scope="dashboard" context-type="full_chat" placeholder="Ask LANA anything..." thread-title="LANA Chat"></lex-lana-dock>
  <!-- LANA dock (IDE-style docked chat panel) -->
  <script src="js/lex/components/layout/lex-lana-dock.js"></script>
</body>
</html>
