<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LANA Voice</title>
  <link rel="stylesheet" href="../../css/lex-tokens.css">
  <link rel="stylesheet" href="../../css/tailwind-output.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="voice-shell" aria-label="LANA screen-aware voice assistant">
    <section class="compact-bar" aria-live="polite" aria-atomic="true">
      <img class="voice-mark" src="lana-mark.svg" alt="" aria-hidden="true">
      <strong id="statusTitle" class="status-title">Ready</strong>
      <lex-progress-bar id="levelMeter" class="level-meter no-drag" value="0" color="accent" size="xs" animate="false" aria-label="Microphone level"></lex-progress-bar>
      <lex-badge id="modeBadge" class="mode-badge" label="Dictation" color="gray" size="sm"></lex-badge>
      <div class="compact-actions no-drag">
        <lex-btn id="undoButton" class="compact-secondary" variant="ghost" size="sm" icon="true" leading-icon="rotate-ccw" title="Undo last voice edit" hidden></lex-btn>
        <lex-btn id="agentCompactButton" class="compact-secondary" variant="ghost" size="sm" icon="true" leading-icon="bot" title="Ask LANA"></lex-btn>
        <lex-btn id="micButton" class="mic-control" variant="ghost" size="sm" icon="true" leading-icon="mic" title="Start dictation"></lex-btn>
        <lex-btn id="settingsButton" class="compact-secondary" variant="ghost" size="sm" icon="true" leading-icon="settings" title="Voice settings"></lex-btn>
        <lex-btn id="dismissButton" class="compact-secondary" variant="ghost" size="sm" icon="true" leading-icon="x" title="Hide voice overlay"></lex-btn>
      </div>
    </section>

    <section id="expandedSurface" class="expanded-surface" hidden>
      <div id="expandedStatus" class="expanded-status">
        <lex-text id="expandedHeading" variant="primary" size="label" weight="semibold">Voice details</lex-text>
        <p id="statusDetail">Dictate into the focused field or ask LANA about this window.</p>
        <div id="contextNotice" class="context-notice" hidden>Using accessible content from the active window.</div>
      </div>

      <p id="transcript" class="transcript" hidden></p>
      <section id="preview" class="preview" hidden>
        <label for="previewText">Proposed result</label>
        <textarea id="previewText" readonly></textarea>
        <div class="actions">
          <button id="confirmButton" class="button primary no-drag" type="button">Insert</button>
          <lex-btn id="copyButton" class="no-drag" variant="secondary" size="sm" leading-icon="copy">Copy</lex-btn>
          <lex-btn id="cancelButton" class="no-drag" variant="ghost" size="sm">Cancel</lex-btn>
        </div>
      </section>

      <section id="idleActions" class="actions recovery-actions" hidden>
        <lex-btn id="dictateButton" class="no-drag" variant="primary" size="sm" leading-icon="mic">Try dictation</lex-btn>
        <lex-btn id="agentButton" class="no-drag" variant="secondary" size="sm" leading-icon="bot">Ask agent</lex-btn>
      </section>

      <form id="settingsPanel" class="settings-panel" hidden>
        <lex-text variant="primary" size="h5" weight="semibold" tag="h2">Voice settings</lex-text>
        <label>Dictation shortcut<input id="dictationShortcut" autocomplete="off"></label>
        <label>Agent shortcut<input id="agentShortcut" autocomplete="off"></label>
        <label>Default mode
          <select id="defaultMode"><option value="dictation">Dictation</option><option value="agent">Agent</option></select>
        </label>
        <label class="check"><input id="openAtLogin" type="checkbox"> Open at Login</label>
        <label class="check"><input id="screenContextEnabled" type="checkbox"> Use active-window context in Agent mode</label>
        <label class="check"><input id="voiceOutputEnabled" type="checkbox"> Speak agent answers</label>
        <label>Confirmation
          <select id="confirmationPolicy"><option value="risk_based">Risk based</option><option value="always">Always preview</option><option value="never_safe_only">Skip for safe inserts</option></select>
        </label>
        <div class="permission-summary" aria-live="polite">
          <div><span>Microphone</span><lex-badge id="microphonePermissionBadge" label="Checking" color="gray" size="sm"></lex-badge></div>
          <div><span>Accessibility</span><lex-badge id="accessibilityPermissionBadge" label="Checking" color="gray" size="sm"></lex-badge></div>
          <p id="permissionHelp">Checking system permissions…</p>
        </div>
        <div class="actions">
          <lex-btn class="no-drag" variant="primary" size="sm" type="submit">Save</lex-btn>
          <lex-btn id="accessibilityButton" class="no-drag" variant="secondary" size="sm">Enable Accessibility</lex-btn>
          <lex-btn id="microphoneButton" class="no-drag" variant="secondary" size="sm">Enable Microphone</lex-btn>
        </div>
      </form>
    </section>
  </main>
  <script src="../../js/lex/lex.core.js"></script>
  <script src="../../js/lex/lex.icons.js"></script>
  <script src="../../js/lex/components/foundation/lex-btn.js"></script>
  <script src="../../js/lex/components/foundation/lex-badge.js"></script>
  <script src="../../js/lex/components/foundation/lex-progress-bar.js"></script>
  <script src="../../js/lex/components/foundation/lex-text.js"></script>
  <script src="app.js"></script>
</body>
</html>
