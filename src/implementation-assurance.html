<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Implementation Assurance - LANA AI</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/lex-tokens.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/implementation-assurance.css">
  <link rel="stylesheet" href="css/tailwind-output.css">
  <link rel="stylesheet" href="css/companion-bridge-consent.css">
  <script src="js/tailwind-loader.js"></script>

  <link rel="stylesheet" href="css/lex-chat.css">
</head>
<body>

  <lex-loader theme="light"></lex-loader>

  <lex-app
    logo-src="img/logo-light.png"
    logo-alt="LANA AI"
    logo-href="dashboard.html"
    active-nav-id="workspaces"
    page-title="Implementation Assurance"
  ></lex-app>

  <template id="page-content">
    <main class="assurance-page" id="assurancePage">
      <lex-banner variant="light" heading="Implementation assurance" subtitle="Connect the accepted plan to reported assets, evidence, and professional decisions."></lex-banner>
      <div class="assurance-actions"><lex-btn id="assuranceBack" variant="secondary">Back to matter</lex-btn><lex-btn id="assuranceDocuments" variant="secondary">Open matter documents</lex-btn><lex-btn id="assuranceRefresh" variant="ghost">Refresh records</lex-btn></div>
      <p id="assuranceMatter" class="assurance-muted"></p>
      <div id="assuranceNotice" class="assurance-status" role="status" aria-live="polite">Loading available records…</div>
      <section id="assuranceRecovery" class="assurance-status" hidden aria-label="Pending change recovery"><p id="assuranceRecoveryText"></p><lex-btn id="assuranceRecover" label="Recover the same change" variant="primary"></lex-btn></section>
      <div id="assuranceReadiness" class="assurance-muted"></div>
      <lex-btn id="assuranceMore" variant="secondary" hidden>Load more choices and records</lex-btn>
      <lex-select id="assuranceStep" label="Workflow section" aria-label="Implementation assurance sections"></lex-select>
      <section data-assurance-step="inventory" class="assurance-grid">
        <lex-card heading="Reported asset inventory"><section class="assurance-section"><p class="assurance-muted">A reported asset is not evidence that the plan has been implemented.</p><ul id="assuranceAssets" class="assurance-list"></ul></section></lex-card>
        <lex-card heading="Add or update an asset"><section class="assurance-section">
          <lex-select id="assuranceAssetEdit" label="Asset" placeholder="Add a new asset"></lex-select>
          <lex-form id="assuranceAssetForm"><div class="assurance-section">
            <lex-select id="assuranceAssetClass" name="asset_classification" label="Asset type" required></lex-select>
            <lex-input id="assuranceAssetDescription" name="description" label="Description" placeholder="Family savings account" required></lex-input>
            <lex-input id="assuranceAssetLastFour" name="account_last_four" label="Account last four (optional)" maxlength="4"></lex-input>
            <lex-input id="assuranceAssetValue" name="asset_value" label="Reported value (optional)" placeholder="45000.00"></lex-input>
            <lex-input id="assuranceAssetCurrency" name="currency" label="Currency" value="USD" maxlength="3" required></lex-input>
            <lex-btn id="assuranceAssetSave" type="submit" variant="primary" label="Save reported asset" data-assurance-permission="write"></lex-btn>
          </div></lex-form>
        </section></lex-card>
      </section>
      <section data-assurance-step="plan" class="assurance-grid" hidden>
        <lex-card heading="Accepted plans"><section class="assurance-section"><div id="assurancePlans" class="assurance-list"></div></section></lex-card>
        <lex-card heading="Accept a plan version"><section class="assurance-section">
          <p class="assurance-muted">Choose retained document versions, inspect their content, and record your professional acceptance. Uploading or selecting a file does not approve it.</p>
          <lex-form id="assurancePlanForm"><div class="assurance-section">
            <lex-select id="assurancePlanEdit" label="Plan record" placeholder="Accept a new plan"></lex-select>
            <lex-select id="assurancePlanReleases" label="Retained plan documents" multiple searchable required></lex-select>
            <div id="assurancePlanSources" class="assurance-source-list"></div>
            <lex-textarea id="assurancePlanRationale" name="rationale" label="Basis for accepting this plan" rows="3" required></lex-textarea>
            <lex-checkbox id="assurancePlanConfirm" label="I reviewed these document versions and accept them as the plan for this matter."></lex-checkbox>
            <lex-btn id="assurancePlanSave" type="submit" label="Accept this plan version" variant="primary" data-assurance-permission="review"></lex-btn>
          </div></lex-form>
        </section></lex-card>
      </section>
      <section data-assurance-step="rulebook" class="assurance-grid" hidden>
        <lex-card heading="Firm rulebook"><section class="assurance-section">
          <p id="assuranceRulebookSummary" class="assurance-muted"></p>
          <p id="assuranceRulebookFlags" class="assurance-status"></p>
          <div id="assuranceRulebookRules" class="assurance-section"></div>
        </section></lex-card>
        <lex-card heading="Starter rulebook"><section class="assurance-section">
          <p id="assuranceRulebookAccess" class="assurance-muted"></p>
          <lex-select id="assuranceRulebookJurisdiction" label="Jurisdiction to preview" placeholder="Choose a jurisdiction"></lex-select>
          <lex-form id="assuranceRulebookForm"><div class="assurance-section">
            <p class="assurance-muted">Adoption publishes this starter as the firm rulebook. It records your professional choice; it does not verify the flagged rules.</p>
            <lex-textarea id="assuranceRulebookRationale" label="Basis for adopting this rulebook" rows="3" required></lex-textarea>
            <lex-checkbox id="assuranceRulebookConfirm" label="I reviewed this starter rulebook, including its review flags, and adopt it as the firm rulebook."></lex-checkbox>
            <lex-btn id="assuranceRulebookAdopt" type="submit" variant="primary" label="Adopt this rulebook" data-assurance-permission="publishRulebook"></lex-btn>
          </div></lex-form>
        </section></lex-card>
      </section>
      <section data-assurance-step="targets" class="assurance-grid" hidden>
        <lex-card heading="Implementation targets"><section class="assurance-section"><div id="assuranceTargetsList" class="assurance-list"></div><p class="assurance-muted">Targets express the accepted plan's intended result. They do not assert that an institution or record already reflects it.</p></section></lex-card>
        <lex-card heading="Accept an implementation target"><lex-form id="assuranceTargetForm"><div class="assurance-section">
          <lex-select id="assuranceTargetEdit" label="Target record" placeholder="Create a new target"></lex-select>
          <lex-select id="assuranceTargetPlan" label="Accepted plan" required></lex-select>
          <lex-select id="assuranceTargetRulebook" label="Adopted firm rulebook" required></lex-select>
          <lex-select id="assuranceTargetRule" label="Rulebook rule" searchable required></lex-select>
          <p id="assuranceTargetRuleDetails" class="assurance-muted"></p>
          <lex-select id="assuranceTargetAsset" label="Reported asset" searchable required></lex-select>
          <div id="assuranceTargetValue" class="assurance-section"></div>
          <lex-textarea id="assuranceTargetRationale" label="Basis for this target" rows="3" required></lex-textarea>
          <lex-checkbox id="assuranceTargetConfirm" label="I reviewed the plan and accept this target and its selected rulebook rule."></lex-checkbox>
          <lex-btn id="assuranceTargetSave" type="submit" variant="primary" label="Accept target" data-assurance-permission="review"></lex-btn>
        </div></lex-form></lex-card>
      </section>
      <section data-assurance-step="observations" class="assurance-grid" hidden>
        <lex-card heading="Record observed evidence"><lex-form id="assuranceObservationForm"><div class="assurance-section">
          <p class="assurance-muted">Record what a source establishes. Saving an observation leaves it pending professional review; it does not establish implementation.</p>
          <lex-select id="assuranceObservationTarget" label="Target this evidence concerns" required></lex-select>
          <lex-select id="assuranceObservationEdit" label="Observation record" placeholder="Record a new observation"></lex-select>
          <div id="assuranceObservationValue" class="assurance-section"></div>
          <lex-input id="assuranceObservationFrom" label="Valid from (your local time)" required></lex-input>
          <lex-input id="assuranceObservationUntil" label="Valid until (optional, your local time)"></lex-input>
          <lex-select id="assuranceObservationSupersedes" label="Earlier observations this replaces (optional)" multiple searchable></lex-select>
          <lex-btn id="assuranceObservationSave" type="submit" variant="primary" label="Save for professional review" data-assurance-permission="write"></lex-btn>
        </div></lex-form></lex-card>
        <lex-card heading="Source evidence"><section class="assurance-section"><p class="assurance-muted">Use an exact retained release. Open the selected source to inspect it. If it has not been released, use the existing document review flow first.</p><div id="assuranceObservationEvidence" class="assurance-section"></div></section></lex-card>
      </section>
      <section data-assurance-step="evidence-review" class="assurance-grid" hidden>
        <lex-card heading="Review an observation"><section class="assurance-section"><lex-select id="assuranceObservationReview" label="Observation" searchable></lex-select><div id="assuranceObservationDetails" class="assurance-section"></div></section></lex-card>
        <lex-card heading="Professional evidence review"><lex-form id="assuranceObservationReviewForm"><div class="assurance-section">
          <p class="assurance-muted">Inspect the exact sources and recorded value. Reviewing this observation does not accept the final implementation conclusion.</p>
          <lex-textarea id="assuranceObservationReviewRationale" label="Review rationale" rows="4" required></lex-textarea>
          <lex-checkbox id="assuranceObservationReviewConfirm" label="I inspected the sources and reviewed this exact observation version."></lex-checkbox>
          <lex-btn id="assuranceObservationReviewSave" type="submit" variant="primary" label="Record evidence review" data-assurance-permission="review"></lex-btn>
        </div></lex-form></lex-card>
      </section>
      <section data-assurance-step="review" class="assurance-grid" hidden>
        <lex-card heading="Assess an accepted target"><section class="assurance-section">
          <p class="assurance-muted">The application compares the accepted target with eligible reviewed evidence. A system finding remains separate from your decision.</p>
          <lex-select id="assuranceTarget" label="Target to review" placeholder="Select an accepted target" disabled></lex-select>
          <div id="assuranceTargetDetails" class="assurance-muted"></div>
          <lex-btn id="assuranceAssess" variant="primary" disabled>Assess current evidence</lex-btn>
          <div id="assuranceAssessment" class="assurance-section" hidden></div>
        </section></lex-card>
        <lex-card heading="Professional decision"><section id="assuranceDecisionForm" class="assurance-section" hidden aria-label="Professional decision">
          <p class="assurance-muted">Check the referenced plan and sources before deciding. An exception does not turn an unsupported finding into a match.</p>
          <lex-select id="assuranceDecision" label="Your decision" placeholder="Choose a decision"></lex-select>
          <lex-textarea id="assuranceRationale" label="Reason for your decision" placeholder="Describe the evidence reviewed and the basis for your decision." rows="4" maxlength="4000" required></lex-textarea>
          <lex-btn id="assuranceSave" variant="primary" label="Record professional decision"></lex-btn>
        </section></lex-card>
      </section>
      <section data-assurance-step="closeout" class="assurance-grid" hidden>
        <lex-card heading="Closeout of recorded requirements"><section class="assurance-section">
          <p class="assurance-muted">Prepare a pinned record of the requirements recorded for this plan, their assessments, decisions and unresolved exceptions. This is not a claim that every estate obligation is captured or complete. The server reports its recorded scope; preparation alone is not acceptance.</p>
          <lex-select id="assuranceCloseoutPlan" label="Accepted plan"></lex-select>
          <lex-btn id="assuranceCloseoutPrepare" label="Prepare closeout record" variant="primary" data-assurance-permission="prepareCloseout"></lex-btn>
          <lex-select id="assuranceCloseoutSelect" label="Prepared closeout"></lex-select>
          <div id="assuranceCloseoutDetails" class="assurance-section"></div>
          <lex-btn id="assuranceCloseoutDownload" label="Download pinned record" variant="secondary" disabled></lex-btn>
        </section></lex-card>
        <lex-card heading="Accept a closeout"><lex-form id="assuranceCloseoutForm"><div class="assurance-section">
          <p class="assurance-muted">Review every target and exception. If records have changed, prepare a fresh closeout before accepting it.</p>
          <lex-textarea id="assuranceCloseoutRationale" label="Acceptance rationale" rows="4" required></lex-textarea>
          <lex-checkbox id="assuranceCloseoutConfirm" label="I accept closeout for these recorded requirements only, including the stated exceptions. This does not establish coverage of every estate obligation."></lex-checkbox>
          <lex-btn id="assuranceCloseoutAccept" type="submit" label="Accept this closeout" variant="primary" data-assurance-permission="acceptCloseout"></lex-btn>
          <div id="assuranceMaintenance" class="assurance-muted"></div>
        </div></lex-form></lex-card>
      </section>
      <div class="assurance-actions" aria-label="Onboarding navigation"><lex-btn id="assurancePrevious" variant="secondary" label="Previous section"></lex-btn><lex-btn id="assuranceNext" variant="secondary" label="Next section"></lex-btn></div>
    </main>
  </template>
  <!-- Universal shell scripts -->
  <script src="js/error-reporter.js"></script>
  <script src="js/config.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/time-utils.js"></script>
  <script src="js/shared/request-retry.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/utils/rename-conversation.js"></script>
  <script src="js/components.js"></script>
  <script src="js/version.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/navigation-helpers.js"></script>
  <script src="js/conversation-search-modal.js"></script>
  <script src="js/contact-search-modal.js"></script>
  <script src="js/notifications.js"></script>

  <!-- Lex UI core -->
  <script src="js/lex/lex.core.js"></script>
  <script src="js/lex/lex.icons.js"></script>
  <script src="js/lex/lex.data.js"></script>
  <script src="js/lex/lex.forms.js"></script>
  <script src="js/lex/lex.state.js"></script>
  <script src="js/lex/lex.utils.js"></script>
  <script src="js/lex/lex.auth.js"></script>
  <script src="js/lex/lex-nav.js"></script>

  <!-- Lex UI layout -->
  <script src="js/lex/components/foundation/lex-loader.js"></script>
  <script src="js/lex/components/foundation/lex-toast.js"></script>
  <script src="js/lex/components/foundation/lex-spinner.js"></script>
  <script src="js/lex/components/foundation/lex-btn.js"></script>
  <script src="js/lex/components/foundation/lex-empty.js"></script>
  <script src="js/lex/components/form/lex-input.js"></script>
  <script src="js/lex/components/form/lex-select.js"></script>
  <script src="js/lex/components/form/lex-textarea.js"></script>
  <script src="js/lex/components/form/lex-form.js"></script>
  <script src="js/lex/components/form/lex-checkbox.js"></script>
  <script src="js/lex/components/layout/lex-sidebar.js"></script>
  <script src="js/lex/components/layout/lex-topbar.js"></script>
  <script src="js/lex/components/layout/lex-conversation-item.js"></script>
  <script src="js/lex/components/layout/lex-notification-panel.js"></script>
  <script src="js/lex/components/layout/lex-app.js"></script>

  <!-- Page-specific Lex components -->
  <script src="js/lex/components/foundation/lex-banner.js"></script>
  <script src="js/lex/components/foundation/lex-badge.js"></script>
  <script src="js/lex/components/foundation/lex-card.js"></script>
  <script src="js/lex/components/foundation/lex-modal.js"></script>
  <script src="js/lex/components/data/lex-table.js"></script>

  <!-- Inject page content -->
  <script src="js/lex/lex-page-init.js"></script>

  <!-- Page controller (MUST be last before auth-guard) -->
  <script src="js/services/assurance-onboarding-client.js"></script>
  <script src="js/services/assurance-value-controls.js"></script>
  <script src="js/services/assurance-evidence-controls.js"></script>
  <script src="js/services/assurance-rulebook-view.js"></script>
  <script src="js/services/implementation-assurance-client.js"></script>
  <script src="js/assurance-onboarding.js"></script>
  <script src="js/implementation-assurance.js"></script>

  <!-- PAC bridge consent handler (Lex modal for token requests) -->
  <script src="js/companion-bridge-consent.js"></script>

  <!-- Auth guard + loader dismiss -->
  <script src="js/auth-guard.js"></script>

</body>
</html>
