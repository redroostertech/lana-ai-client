<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Conversation - LANA AI</title>

  <!-- ── CSS + Tailwind in head — behavioral scripts at end of body ── -->
  <link rel="stylesheet" href="css/lex-tokens.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/tailwind-output.css">
  <script src="js/tailwind-loader.js"></script>
  <link rel="stylesheet" href="css/lex-chat.css">
  <link rel="stylesheet" href="css/chat-v2.css">
  <link rel="stylesheet" href="css/companion-bridge-consent.css">
  <style>
    @keyframes cv2-pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    @keyframes cv2-spin  { to{transform:rotate(360deg)} }
  </style>

</head>
<body>

  <!-- Branded loader — shows once lex-loader.js upgrades the element -->
  <lex-loader theme="light"></lex-loader>

  <!-- App shell — sidebar, topbar, empty content area.
       Page content lives in <template> below and gets injected after
       the shell renders. This avoids double-rendering of child components. -->
  <lex-app
    logo-src="img/logo-light.png"
    logo-alt="LANA AI"
    logo-href="dashboard.html"
    active-nav-id="chat"
    page-title="New Conversation"
  ></lex-app>

  <!-- Page content as inert <template> — elements inside are NOT upgraded
       by the browser until cloned into the live DOM. Zero double-rendering. -->
  <template id="page-content">
    <div id="lex-page-content" class="cv2-page">

      <!-- ── Stage: LOADING + LANDING ── -->
      <div id="cv2-stage-center" class="cv2-stage-center">

        <!-- Greeting -->
        <lex-text id="cv2-greeting-sub" variant="primary" size="h1" tag="h1">
          I'm ready to help. Select a matter or start a general chat.
        </lex-text>

        <!-- Matter panel: cards + search (visible in LANDING, collapses in SELECTED) -->
        <div id="cv2-matter-panel" class="cv2-matter-panel">

          <!-- Recent matters section -->
          <div id="cv2-recent-section">
            <lex-text variant="tertiary" size="body-sm" class="cv2-overline">RECENT MATTERS</lex-text>
            <!-- Cards injected here by JS. Shown with lex-redact shimmer during LOADING. -->
            <div id="cv2-cards-wrapper" class="cv2-cards-wrapper" lex-redacted>
              <!-- Placeholder height so shimmer has something to show -->
              <div class="cv2-skeleton-placeholder"></div>
            </div>
          </div>

          <lex-divider id="cv2-or-divider" label="or"></lex-divider>

          <!-- Matter search -->
          <div class="cv2-search-wrapper">
            <lex-input
              id="cv2-search-input"
              placeholder="Search matters by name, client, or number..."
              leading-icon="search"
              clearable="true">
            </lex-input>
            <div id="cv2-search-results" class="cv2-search-results" role="listbox"></div>
          </div>

        </div>
        <!-- /cv2-matter-panel -->

        <!-- Inline composer: intent selection (visible in SELECTED, hidden otherwise) -->
        <div id="cv2-composer-inline" class="cv2-composer-inline">
          <div class="cv2-composer-context">
            <lex-badge id="cv2-matter-badge" color="gray"></lex-badge>
          </div>
          <lex-text variant="secondary" size="body-sm" class="cv2-intent-label">
            How would you like to start?
          </lex-text>
          <div class="cv2-intents" id="cv2-intents">
            <!-- Intent buttons injected by JS -->
          </div>
        </div>
        <!-- /cv2-composer-inline -->

      </div>
      <!-- /cv2-stage-center -->

      <!-- ── Gap 1: Active generation banner (hidden until lex-chat-generation-active fires) ── -->
      <div id="cv2-generation-banner" style="display:none;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--lex-color-warning-subtle,#fefce8);border-bottom:1px solid var(--lex-color-warning-border,#fde047);font-size:var(--lex-body-sm-size,13px);">
        <div style="display:flex;align-items:center;gap:10px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--lex-color-warning,#ca8a04)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;animation:cv2-pulse 1.5s ease-in-out infinite;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span style="color:var(--lex-text-primary);">AI is still responding — Generation started <span id="cv2-generation-duration">a moment ago</span></span>
        </div>
        <button id="cv2-stop-generation-btn" style="flex-shrink:0;padding:4px 12px;font-size:var(--lex-body-sm-size,13px);font-weight:500;color:var(--lex-text-primary);background:var(--lex-bg-primary);border:1px solid var(--lex-border-default);border-radius:var(--lex-radius-sm);cursor:pointer;">Stop</button>
      </div>

      <!-- ── Gap 4: Auto-compaction banner (hidden until auto_compact_start) ── -->
      <div id="cv2-compact-banner" style="display:none;align-items:center;gap:10px;padding:8px 16px;background:var(--lex-bg-tertiary);border-bottom:1px solid var(--lex-border-subtle);font-size:var(--lex-body-sm-size,13px);color:var(--lex-text-secondary);">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;animation:cv2-spin 1s linear infinite;"><path d="M21 12a9 9 0 11-6.219-8.56"/></svg>
        <span>Optimising conversation context…</span>
      </div>

      <!-- ── Gap 3: Context meter — shown in ACTIVE stage ── -->
      <div id="cv2-context-meter" style="display:none;padding:4px 16px;font-size:var(--lex-body-xs-size,11px);color:var(--lex-text-tertiary);text-align:right;">
        <span id="cv2-context-text">Context available: 100%</span>
      </div>

      <!-- ── Gap 5: Followup chip row — shown above the composer after agentic followup ── -->
      <div id="cv2-followup-chips" style="display:none;padding:6px 16px;flex-wrap:wrap;gap:6px;border-top:1px solid var(--lex-border-subtle);background:var(--lex-bg-primary);"></div>

      <!-- ── Stage: ACTIVE — messages area ── -->
      <div id="cv2-messages-area" class="cv2-messages-area">
        <!-- lex-chat component mounted here by JS after conversation ID exists -->
      </div>

    </div>
    <!-- /lex-page-content -->

  </template>

  <noscript>
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,sans-serif;color:#666;">
      Please enable JavaScript to use LANA AI.
    </div>
  </noscript>

  <!-- ══════════════════════════════════════════════════════════════════
       Scripts at end of body — HTML renders first, scripts load after
       ══════════════════════════════════════════════════════════════════ -->

  <!-- Universal shell scripts -->
  <script src="js/error-reporter.js"></script>
  <script src="js/config.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/utils/document-lifecycle.js"></script>
  <script src="js/utils/rename-conversation.js"></script>
  <script src="js/components.js"></script>
  <script src="js/version.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/navigation-helpers.js"></script>
  <script src="js/new-project-modal.js"></script>
  <script src="js/conversation-menu.js"></script>
  <script src="js/conversation-search-modal.js"></script>
  <script src="js/contact-search-modal.js"></script>
  <script src="js/notifications.js"></script>

  <!-- Lex UI core -->
  <script src="js/lex/lex.core.js"></script>
  <script src="js/lex/lex.icons.js"></script>
  <script src="js/lex/lex.data.js"></script>
  <script src="js/lex/lex.forms.js"></script>
  <script src="js/lex/lex.state.js"></script>
  <script src="js/lex/lex.utils.js"></script>
  <script src="js/lex/lex.auth.js"></script>
  <script src="js/lex/lex-nav.js"></script>

  <!-- Lex UI foundation -->
  <script src="js/lex/components/foundation/lex-loader.js"></script>
  <script src="js/lex/components/foundation/lex-toast.js"></script>
  <script src="js/lex/components/foundation/lex-spinner.js"></script>
  <script src="js/lex/components/foundation/lex-btn.js"></script>
  <script src="js/lex/components/foundation/lex-empty.js"></script>
  <script src="js/lex/components/foundation/lex-modal.js"></script>
  <script src="js/lex/components/foundation/lex-drawer.js"></script>

  <!-- Lex UI layout -->
  <script src="js/lex/components/layout/lex-sidebar.js"></script>
  <script src="js/lex/components/layout/lex-topbar.js"></script>
  <script src="js/lex/components/layout/lex-conversation-item.js"></script>
  <script src="js/lex/components/layout/lex-notification-panel.js"></script>
  <script src="js/lex/components/layout/lex-app.js"></script>

  <!-- Page-specific Lex components — ALL loaded BEFORE inject so custom elements
       are defined when template content enters the DOM. Tree-order upgrade ensures
       parents capture un-rendered children (no double-rendering). -->
  <script src="js/lex/components/foundation/lex-text.js"></script>
  <script src="js/lex/components/foundation/lex-action-card.js"></script>
  <script src="js/lex/components/foundation/lex-badge.js"></script>
  <script src="js/lex/components/foundation/lex-divider.js"></script>
  <script src="js/lex/components/form/lex-input.js"></script>

  <!-- Mermaid diagram rendering (before chat format) -->
  <script src="js/vendor/mermaid.min.js"></script>

  <!-- Services used by chat components -->
  <script src="js/services/document-processing.service.js"></script>

  <!-- Chat component chain (dependency order) -->
  <script src="js/lex/chat/lex-chat.format.js"></script>
  <script src="js/lex/chat/lex-chat.source.js"></script>
  <script src="js/lex/chat/lex-chat.source-llama.js"></script>
  <script src="js/lex/chat/lex-chat-artifact-promotion.js"></script>
  <script src="js/lex/chat/lex-chat-progress-events.js"></script>
  <script src="js/lex/chat/lex-chat.message.js"></script>
  <script src="js/lex/chat/lex-chat.activity.js"></script>
  <script src="js/lex/chat/lex-chat.documents.js"></script>
  <script src="js/lex/chat/lex-chat.composer-mentions.js"></script>
  <script src="js/lex/chat/lex-chat.composer-slash.js"></script>
  <script src="js/lex/chat/lex-chat.composer.js"></script>
  <script src="js/lex/chat/lex-chat.thread.js"></script>
  <script src="js/lex/chat/lex-chat.js"></script>
  <script src="js/lex/chat/lex-dynamic-card.renderer.js"></script>
  <script src="js/lex/chat/lex-agentic-plan-card.js"></script>
  <script src="js/lex/chat/lex-chat.index.js"></script>

  <!-- Demo responses for demo mode -->
  <script src="js/chat-demo-responses.js"></script>

  <!-- Inject page content + hoist modals -->
  <script src="js/lex/lex-page-init.js"></script>

  <!-- Page dependencies -->
  <script src="js/chat_v2.file-drawer.js"></script>

  <!-- Page controller (MUST be last before auth-guard) -->
  <script src="js/chat_v2.js"></script>

  <!-- PAC bridge consent handler (Lex modal for token requests) -->
  <script src="js/companion-bridge-consent.js"></script>

  <!-- Auth guard + loader dismiss (MUST be last) -->
  <script src="js/auth-guard.js"></script>
</body>
</html>
