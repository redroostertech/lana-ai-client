<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Approvals - LANA AI</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/lex-tokens.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/approvals.css">
  <link rel="stylesheet" href="css/tailwind-output.css">
  <link rel="stylesheet" href="css/companion-bridge-consent.css">
  <script src="js/tailwind-loader.js"></script>

  <link rel="stylesheet" href="css/lex-chat.css">
</head>
<body>

  <lex-loader theme="light"></lex-loader>

  <lex-app
    logo-src="img/logo-light.png"
    logo-alt="LANA AI"
    logo-href="dashboard.html"
    active-nav-id="approvals"
    page-title="Approvals"
  ></lex-app>

  <template id="page-content">

    <main>

      <lex-banner
        heading="Approval Inbox"
        subtitle="Review and act on pending approval requests"
      ></lex-banner>

      <!-- Stats bar (clickable to filter by status) -->
      <div class="apr-stats mt-4" id="aprStats">
        <div class="apr-stat" data-status="" id="aprStatAll">
          <div class="apr-stat-value" id="aprCountAll">—</div>
          <div class="apr-stat-label">All</div>
        </div>
        <div class="apr-stat active" data-status="pending" id="aprStatPending">
          <div class="apr-stat-value" id="aprCountPending">—</div>
          <div class="apr-stat-label">Pending</div>
        </div>
        <div class="apr-stat" data-status="approved" id="aprStatApproved">
          <div class="apr-stat-value" id="aprCountApproved">—</div>
          <div class="apr-stat-label">Approved</div>
        </div>
        <div class="apr-stat" data-status="rejected" id="aprStatRejected">
          <div class="apr-stat-value" id="aprCountRejected">—</div>
          <div class="apr-stat-label">Rejected</div>
        </div>
        <div class="apr-stat" data-status="expired" id="aprStatExpired">
          <div class="apr-stat-value" id="aprCountExpired">—</div>
          <div class="apr-stat-label">Expired</div>
        </div>
      </div>

      <!-- Search / Sort / Filter toolbar (docs/TABLE-STANDARD.md) -->
      <div class="bg-white rounded-lg shadow-sm border mb-4 p-4" style="border-color: var(--lex-border-default)" role="search" aria-label="Search and filter approvals">
        <div class="flex items-center gap-4 flex-wrap">
          <div class="flex-1 min-w-[200px]">
            <lex-input id="aprSearch" placeholder="Search approvals..." clearable="true" leading-icon="search"></lex-input>
          </div>
          <div class="flex items-center gap-2">
            <label class="text-sm whitespace-nowrap" style="color: var(--lex-text-secondary)">Sort by:</label>
            <lex-select id="aprSort" options='[{"value":"created_at","label":"Created"},{"value":"priority","label":"Priority"},{"value":"expires_at","label":"Expires"}]' value="created_at"></lex-select>
          </div>
          <lex-btn id="aprSortOrder" variant="ghost" icon="true" title="Toggle sort order" data-order="desc">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12"></path>
            </svg>
          </lex-btn>
          <div class="flex items-center gap-2">
            <label class="text-sm whitespace-nowrap" style="color: var(--lex-text-secondary)">Status:</label>
            <lex-select id="aprStatusFilter" options='[{"value":"all","label":"All"},{"value":"pending","label":"Pending"},{"value":"approved","label":"Approved"},{"value":"rejected","label":"Rejected"},{"value":"expired","label":"Expired"},{"value":"cancelled","label":"Cancelled"}]' value="pending"></lex-select>
          </div>
          <div id="aprCount" class="text-sm whitespace-nowrap" style="color: var(--lex-text-secondary)"></div>
        </div>
      </div>

      <section aria-labelledby="aprHeading">
        <div class="flex items-center justify-between mb-3">
          <h2 id="aprHeading" class="text-lg font-semibold" style="color: var(--lex-text-primary)">Approval Requests</h2>
          <span id="aprSectionCount" class="text-sm" style="color: var(--lex-text-secondary)" aria-live="polite"></span>
        </div>

        <lex-table
          id="aprTable"
          class="apr-table lex-table--card"
          column-filters
          server-paging
          columns="title,source_type,priority,status,requested_by,assigned_to,matter_id,expires_at,created_at"
          labels="Approval,Source,Priority,Status,Requested by,Assigned to,Workspace,Expires,Created"
          sortable-columns="priority,expires_at,created_at"
          sort-by="created_at"
          sort-dir="desc"
          limit="20"
          id-key="id"
          empty-text="No approvals yet"
          aria-label="Approval requests"
        ></lex-table>
      </section>

    </main>

  </template>

  <noscript>
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,sans-serif;color:#666;">
      Please enable JavaScript to use LANA AI.
    </div>
  </noscript>

  <!-- Universal shell scripts -->
  <script src="js/error-reporter.js"></script>
  <script src="js/config.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/time-utils.js"></script>
  <script src="js/shared/request-retry.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/utils/rename-conversation.js"></script>
  <script src="js/components.js"></script>
  <script src="js/version.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/navigation-helpers.js"></script>
  <script src="js/conversation-search-modal.js"></script>
  <script src="js/contact-search-modal.js"></script>
  <script src="js/notifications.js"></script>

  <!-- Lex UI core -->
  <script src="js/lex/lex.core.js"></script>
  <script src="js/lex/lex.icons.js"></script>
  <script src="js/lex/lex.data.js"></script>
  <script src="js/lex/lex.forms.js"></script>
  <script src="js/lex/lex.state.js"></script>
  <script src="js/lex/lex.utils.js"></script>
  <script src="js/lex/lex.auth.js"></script>
  <script src="js/lex/lex-nav.js"></script>

  <!-- Lex UI layout -->
  <script src="js/lex/components/foundation/lex-loader.js"></script>
  <script src="js/lex/components/foundation/lex-toast.js"></script>
  <script src="js/lex/components/foundation/lex-spinner.js"></script>
  <script src="js/lex/components/foundation/lex-btn.js"></script>
  <script src="js/lex/components/foundation/lex-empty.js"></script>
  <script src="js/lex/components/form/lex-segmented.js"></script>
  <script src="js/lex/components/form/lex-input.js"></script>
  <script src="js/lex/components/form/lex-select.js"></script>
  <script src="js/lex/components/layout/lex-sidebar.js"></script>
  <script src="js/lex/components/layout/lex-topbar.js"></script>
  <script src="js/lex/components/layout/lex-conversation-item.js"></script>
  <script src="js/lex/components/layout/lex-notification-panel.js"></script>
  <script src="js/lex/components/layout/lex-app.js"></script>

  <!-- Page-specific Lex components -->
  <script src="js/lex/components/foundation/lex-banner.js"></script>
  <script src="js/lex/components/foundation/lex-badge.js"></script>
  <script src="js/lex/components/foundation/lex-card.js"></script>
  <script src="js/lex/components/foundation/lex-modal.js"></script>
  <script src="js/lex/components/data/lex-table.js"></script>

  <!-- Inject page content -->
  <script src="js/lex/lex-page-init.js"></script>

  <!-- Page controller (MUST be last before auth-guard) -->
  <script src="js/shared/library-column-filters.js"></script>
  <script src="js/admin/admin-table-kit.js"></script>
  <script src="js/approvals.js"></script>

  <!-- PAC bridge consent handler (Lex modal for token requests) -->
  <script src="js/companion-bridge-consent.js"></script>

  <!-- Auth guard + loader dismiss -->
  <script src="js/auth-guard.js"></script>
  <lex-lana-dock page-scope="dashboard" context-type="full_chat" placeholder="Ask LANA anything..." thread-title="LANA Chat"></lex-lana-dock>
  <!-- LANA dock (IDE-style docked chat panel) -->
  <script src="js/lex/chat/lex-chat.format.js"></script>
  <script src="js/lex/chat/lex-chat.conversations-api.js"></script>
  <script src="js/lex/chat/lex-chat.source.js"></script>
  <script src="js/lex/chat/lex-chat.message.js"></script>
  <script src="js/lex/chat/lex-chat-progress-events.js"></script>
  <script src="js/lex/chat/lex-chat.activity.js"></script>
  <script src="js/lex/chat/lex-chat.documents.js"></script>
  <script src="js/lex/chat/lex-chat.composer-mentions.js"></script>
  <script src="js/services/slash-commands.service.js"></script>
  <script src="js/lex/chat/lex-chat.composer-slash.js"></script>
  <script src="js/lex/chat/lex-chat.composer.js"></script>
  <script src="js/lex/chat/lex-chat.thread.js"></script>
  <script src="js/lex/chat/lex-chat.threads.js"></script>
  <script src="js/lex/chat/lex-chat.js"></script>
  <script src="js/lex/chat/lex-dynamic-card.renderer.js"></script>
  <script src="js/lex/chat/lex-agentic-plan-card.js"></script>
  <script src="js/lex/chat/lex-chat.index.js"></script>
  <script src="js/lex/components/chat/lex-lana-panel.js"></script>
  <script src="js/lex/components/layout/lex-lana-dock.js"></script>
</body>
</html>
