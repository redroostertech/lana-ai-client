<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workspaces - LANA AI</title>

  <!-- ── CSS + Tailwind in head — behavioral scripts at end of body ── -->
  <link rel="stylesheet" href="css/lex-tokens.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/components/document-metadata.css">
  <link rel="stylesheet" href="css/matter-notes.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/drawflow@0.0.60/dist/drawflow.min.css">
  <link rel="stylesheet" href="css/tailwind-output.css">
  <script src="js/tailwind-loader.js"></script>

</head>
<body>

  <!-- Branded loader — shows once lex-loader.js upgrades the element -->
  <lex-loader theme="light"></lex-loader>

  <!-- App shell — sidebar, topbar, empty content area.
       Page content lives in <template> below and gets injected after
       the shell renders. This avoids double-rendering of child components. -->
  <lex-app
    logo-src="img/logo-light.png"
    logo-alt="LANA AI"
    logo-href="dashboard.html"
    active-nav-id="workspaces"
    page-title="Workspaces"
  ></lex-app>

  <!-- Page content as inert <template> — elements inside are NOT upgraded
       by the browser until cloned into the live DOM. Zero double-rendering. -->
  <template id="page-content">

    <main>
      <!-- Welcome Banner -->
      <lex-banner
        id="workspacesBanner"
        class="mb-6"
        variant="light"
        corners
        heading="Workspaces"
        subtitle="Organize matters, cases, and projects into dedicated spaces with isolated documents, conversations, and AI context."
      >
        <lex-btn id="learnMoreBtn" variant="secondary">Learn More</lex-btn>
      </lex-banner>

      <!-- Summary Metrics -->
      <div id="workspaceSummaryMetrics" class="hidden mb-4">
        <!-- Loading skeleton -->
        <div id="metricsLoading" class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div class="bg-white rounded-xl border border-gray-100 p-4 animate-pulse">
            <div class="h-3 bg-gray-200 rounded w-24 mb-2"></div>
            <div class="h-7 bg-gray-200 rounded w-16"></div>
          </div>
          <div class="bg-white rounded-xl border border-gray-100 p-4 animate-pulse">
            <div class="h-3 bg-gray-200 rounded w-24 mb-2"></div>
            <div class="h-7 bg-gray-200 rounded w-16"></div>
          </div>
          <div class="bg-white rounded-xl border border-gray-100 p-4 animate-pulse">
            <div class="h-3 bg-gray-200 rounded w-32 mb-2"></div>
            <div class="h-7 bg-gray-200 rounded w-12"></div>
          </div>
        </div>
        <!-- Actual metrics (hidden until loaded) -->
        <div id="metricsContent" class="hidden">
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-2">
            <div class="bg-white rounded-xl border border-gray-100 overflow-hidden">
              <lex-metric id="metricActiveMatters" label="Active Matters (30d)" value="--" status="blue"></lex-metric>
            </div>
            <div class="bg-white rounded-xl border border-gray-100 overflow-hidden">
              <lex-metric id="metricOutstandingTasks" label="Outstanding Tasks" value="--" status="yellow"></lex-metric>
            </div>
            <div class="bg-white rounded-xl border border-gray-100 overflow-hidden cursor-pointer" id="recentActivityTrigger" title="Click to view recent activity">
              <lex-metric id="metricRecentActivity" label="Recent Events" value="--" status="green"></lex-metric>
            </div>
          </div>
          <lex-detail-panel id="recentActivityPanel" heading="Recent Matter Activity" action-label="View All" action-href="matters/timeline.html">
          </lex-detail-panel>
        </div>
      </div>

      <!-- Pinned Matters (list view only) -->
      <div id="listPinnedSection" class="hidden mb-4" style="transition: opacity var(--lex-transition-normal, 200ms) ease, max-height 300ms ease; overflow: hidden;">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-lg font-semibold flex items-center gap-2" style="color: var(--lex-text-primary)">
            <svg class="w-5 h-5 text-yellow-500" fill="currentColor" viewBox="0 0 24 24">
              <path d="M16 12V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v8l-2 2v2h5v6l1 1 1-1v-6h5v-2l-2-2z"/>
            </svg>
            Pinned
          </h2>
          <span id="listPinnedCount" class="text-sm" style="color: var(--lex-text-secondary)">0 items</span>
        </div>
        <div id="listPinnedCards" class="flex gap-4 overflow-x-auto pb-4 scrollbar-thin"></div>
      </div>

      <!-- Content card — header, view toggles, grid/list body -->
      <lex-card padding="none">
        <!-- Card header — title, count, New Matter, view toggles -->
        <div class="flex items-center justify-between p-4">
          <div>
            <h2 id="listSectionHeading" class="text-lg font-semibold" style="color: var(--lex-text-primary)">All Matters</h2>
          </div>
          <div class="flex items-center gap-3">
            <!--
              "Show archived" toggle — off by default. workspace.js reads this
              checkbox in loadMatters() and filters status='archived' rows out
              when unchecked. Backend endpoint already returns archived rows;
              filter is purely client-side so we don't need a new query param.
            -->
            <label class="flex items-center gap-2 text-sm cursor-pointer" style="color: var(--lex-text-secondary);" title="Include archived matters in the list">
              <input type="checkbox" id="showArchivedToggle" class="w-4 h-4 rounded border-gray-300">
              <span>Show archived</span>
            </label>
            <lex-btn id="createMatterBtn" variant="primary" leading-icon="+">
              New Matter
            </lex-btn>
            <div class="flex items-center gap-1" style="border-left: 1px solid var(--lex-border-default); padding-left: 12px;">
              <lex-btn id="gridViewBtn" variant="ghost" icon="true" title="Grid View">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path>
                </svg>
              </lex-btn>
              <lex-btn id="listViewBtn" variant="primary" icon="true" title="List View">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path>
                </svg>
              </lex-btn>
            </div>
          </div>
        </div>

        <!-- Loading State -->
        <div id="mattersLoading" class="flex justify-center py-16">
          <lex-spinner size="lg" label="Loading matters..."></lex-spinner>
        </div>

        <!-- Matters Grid View -->
        <div id="mattersGrid" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 p-4"></div>

        <!-- Matters List View -->
        <lex-table
          id="mattersListView"
          class="hidden"
          columns="matter_id,name,status,matter_type,created_at"
          labels="Matter ID,Name,Status,Type,Created"
          searchable
          filterable
          column-filters
          selectable
          compact
          sort-by="created_at"
          sort-dir="desc"
          empty-text="No matters found"
          id-key="matter_id"
          bulk-actions='[{"label":"Delete","action":"delete","variant":"danger"}]'
        ></lex-table>

        <!-- Pagination -->
        <lex-pagination id="pagination"></lex-pagination>
      </lex-card>
    </main>

    <!-- Shared Matter Options Dropdown -->
    <div id="matterOptionsDropdown" class="hidden fixed w-36 bg-white rounded-lg shadow-lg border border-gray-200 py-1" style="z-index: 9999">
      <button id="matterOptionsEdit" class="w-full px-4 py-2 text-left text-sm lex-text-accent hover:bg-gray-50 transition-colors">Edit</button>
      <!-- Label flips to "Unarchive" when the targeted matter is already archived; see js/workspace.js showMatterOptions. -->
      <button id="matterOptionsArchive" class="w-full px-4 py-2 text-left text-sm text-gray-700 hover:bg-gray-50 transition-colors">Archive</button>
      <button id="matterOptionsDelete" class="w-full px-4 py-2 text-left text-sm text-red-600 hover:bg-red-50 transition-colors">Delete</button>
    </div>

    <!-- Matter Modal -->
    <lex-modal id="matterModal" heading="Create Matter" size="full" hide-actions>
        <form id="matterForm" class="max-w-2xl mx-auto px-6 py-8 space-y-6">
          <input type="hidden" id="matterId">
          <div id="matterIdDisplay" class="hidden">
            <label class="block text-sm font-medium text-gray-700 mb-1">Matter ID</label>
            <div class="px-3 py-2 bg-gray-100 border border-gray-300 rounded-lg text-gray-600 font-mono text-sm truncate" id="matterIdValue"></div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <lex-input id="matterName" label="Matter Name" required></lex-input>
            <lex-input id="clientName" label="Client Name"></lex-input>
          </div>

          <div id="matterTypeSection">
            <label class="block text-sm font-medium text-gray-700 mb-2">Matter Type <span class="text-red-500">*</span></label>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
              <label class="flex items-start gap-3 p-4 border-2 border-gray-200 rounded-lg cursor-pointer hover:lex-border-accent hover:lex-bg-accent-muted transition-colors">
                <input type="radio" name="matterType" value="matter" class="mt-1 h-4 w-4 lex-text-accent lex-ring-focus">
                <div class="flex-1">
                  <div class="flex items-center gap-2">
                    <span class="font-semibold text-gray-900">Client Matter</span>
                    <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-blue-100 text-blue-800">Billable</span>
                  </div>
                  <p class="text-sm text-gray-600 mt-1">Individual client case with isolated data. Included in analytics, billing reports, and practice area metrics.</p>
                </div>
              </label>

              <label class="flex items-start gap-3 p-4 border-2 border-gray-200 rounded-lg cursor-pointer hover:lex-border-accent hover:lex-bg-accent-muted transition-colors">
                <input type="radio" name="matterType" value="workspace" class="mt-1 h-4 w-4 lex-text-accent lex-ring-focus" checked>
                <div class="flex-1">
                  <div class="flex items-center gap-2">
                    <span class="font-semibold text-gray-900">Workspace</span>
                    <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium lex-bg-accent-soft lex-text-accent">Collaborative</span>
                  </div>
                  <p class="text-sm text-gray-600 mt-1">Collaborative container that can link multiple matters, upload shared documents, and enable AI reasoning across connected data sources. Excluded from billing analytics.</p>
                </div>
              </label>
            </div>
            <div class="mt-2 bg-amber-50 border border-amber-200 rounded-lg p-3 flex items-start gap-2">
              <svg class="w-5 h-5 text-amber-600 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
              </svg>
              <p class="text-xs text-amber-800">
                <strong>Important:</strong> Once created, this type cannot be changed. Choose carefully.
              </p>
            </div>
          </div>

          <div id="workspaceSelectorSection" class="hidden">
            <label class="block text-sm font-medium text-gray-700 mb-1">
              Link to Workspace <span class="text-gray-400">(Optional)</span>
            </label>
            <lex-select id="workspaceSelector" options='[{"value":"","label":"No workspace (standalone matter)"}]' placeholder="No workspace (standalone matter)"></lex-select>
            <p class="text-xs text-gray-500 mt-1">
              Linking to a workspace allows this matter to access documents from the workspace and other linked matters (read-only).
            </p>
          </div>

          <lex-textarea id="matterDescription" label="Description" rows="4" placeholder="Brief description of the matter..."></lex-textarea>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <lex-select id="matterVisibility" label="Visibility"
              options='[{"value":"private","label":"Private - Only shared users can access"},{"value":"organization","label":"Organization - All org members can view"}]'>
            </lex-select>

            <lex-select id="matterStatus" label="Status"
              options='[{"value":"active","label":"Active"},{"value":"closed","label":"Closed"},{"value":"archived","label":"Archived"}]'>
            </lex-select>
          </div>

          <div id="shareWithSection">
            <label class="block text-sm font-medium text-gray-700 mb-2">Share with Team Members</label>
            <div class="border border-gray-200 rounded-lg">
              <div class="p-3 border-b border-gray-200">
                  <lex-input id="userSearchInput" placeholder="Search users to add..." leading-icon="search" size="sm"></lex-input>
                <div id="userSearchResults" class="hidden mt-2 max-h-40 overflow-y-auto bg-white border border-gray-200 rounded-lg shadow-lg"></div>
              </div>
              <div class="p-3">
                <div id="selectedUsersList" class="space-y-2">
                  <p class="text-sm text-gray-500 italic" id="noUsersSelected">No users selected. Start typing to search and add team members.</p>
                </div>
              </div>
            </div>
            <p class="text-xs text-gray-500 mt-1">Selected users will have read and write access to this matter.</p>
          </div>

          <div id="conflictDetectionContainer"></div>

          <div class="flex justify-end gap-3 pt-6 border-t border-gray-200">
            <lex-btn type="button" id="cancelMatterBtn" variant="secondary">Cancel</lex-btn>
            <lex-btn type="submit" variant="primary">Save Matter</lex-btn>
          </div>
        </form>
    </lex-modal>

    <!-- Create Matter from Workspace Modal -->
    <lex-modal id="workspaceMatterModal" heading="Create New Matter in Workspace" subtitle="This matter will be automatically linked to the workspace" size="full" hide-actions>
        <form id="workspaceMatterForm" class="max-w-2xl mx-auto px-6 py-8 space-y-6">
          <input type="hidden" id="workspaceIdForMatter">

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <lex-input id="workspaceMatterName" label="Matter Name" required></lex-input>
            <lex-input id="workspaceClientName" label="Client Name"></lex-input>
          </div>

          <lex-textarea id="workspaceMatterDescription" label="Description" rows="4" placeholder="Brief description of the matter..."></lex-textarea>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <lex-select id="workspaceMatterVisibility" label="Visibility"
              options='[{"value":"private","label":"Private - Only shared users can access"},{"value":"organization","label":"Organization - All org members can view"}]'>
            </lex-select>

            <lex-select id="workspaceMatterStatus" label="Status"
              options='[{"value":"active","label":"Active"},{"value":"closed","label":"Closed"},{"value":"archived","label":"Archived"}]'>
            </lex-select>
          </div>

          <div id="workspaceShareWithSection">
            <label class="block text-sm font-medium text-gray-700 mb-2">Share with Team Members</label>
            <div class="border border-gray-200 rounded-lg">
              <div class="p-3 border-b border-gray-200">
                  <lex-input id="workspaceUserSearchInput" placeholder="Search users to add..." leading-icon="search" size="sm"></lex-input>
                <div id="workspaceUserSearchResults" class="hidden mt-2 max-h-40 overflow-y-auto bg-white border border-gray-200 rounded-lg shadow-lg"></div>
              </div>
              <div class="p-3">
                <div id="workspaceSelectedUsersList" class="space-y-2">
                  <p class="text-sm text-gray-500 italic" id="workspaceNoUsersSelected">No users selected. Start typing to search and add team members.</p>
                </div>
              </div>
            </div>
            <p class="text-xs text-gray-500 mt-1">Selected users will have read and write access to this matter.</p>
          </div>

          <div id="workspaceConflictDetectionContainer"></div>

          <div class="flex justify-end gap-3 pt-6 border-t border-gray-200">
            <lex-btn type="button" id="cancelWorkspaceMatterBtn" variant="secondary">Cancel</lex-btn>
            <lex-btn type="submit" variant="primary">Create Matter</lex-btn>
          </div>
        </form>
    </lex-modal>

  </template>

  <noscript>
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,sans-serif;color:#666;">
      Please enable JavaScript to use LANA AI.
    </div>
  </noscript>

  <!-- ══════════════════════════════════════════════════════════════════
       Scripts at end of body — HTML renders first, scripts load after
       ══════════════════════════════════════════════════════════════════ -->

  <!-- Universal shell scripts -->
  <script src="js/error-reporter.js"></script>
  <script src="js/config.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/utils/rename-conversation.js"></script>
  <script src="js/components.js"></script>
  <script src="js/version.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/navigation-helpers.js"></script>
  <script src="js/new-project-modal.js"></script>
  <script src="js/conversation-menu.js"></script>
  <script src="js/conversation-search-modal.js"></script>
  <script src="js/contact-search-modal.js"></script>
  <script src="js/notifications.js"></script>

  <!-- Lex UI core -->
  <script src="js/lex/lex.core.js"></script>
  <script src="js/lex/lex.icons.js"></script>
  <script src="js/lex/lex.data.js"></script>
  <script src="js/lex/lex.forms.js"></script>
  <script src="js/lex/lex.state.js"></script>
  <script src="js/lex/lex.utils.js"></script>
  <script src="js/lex/lex.auth.js"></script>
  <script src="js/lex/lex-nav.js"></script>

  <!-- Lex UI foundation -->
  <script src="js/lex/components/foundation/lex-loader.js"></script>
  <script src="js/lex/components/foundation/lex-toast.js"></script>
  <script src="js/lex/components/foundation/lex-spinner.js"></script>
  <script src="js/lex/components/foundation/lex-btn.js"></script>
  <script src="js/lex/components/foundation/lex-empty.js"></script>
  <script src="js/lex/components/form/lex-segmented.js"></script>

  <!-- Lex UI layout -->
  <script src="js/lex/components/layout/lex-sidebar.js"></script>
  <script src="js/lex/components/layout/lex-topbar.js"></script>
  <script src="js/lex/components/layout/lex-conversation-item.js"></script>
  <script src="js/lex/components/layout/lex-notification-panel.js"></script>
  <script src="js/lex/components/layout/lex-app.js"></script>

  <!-- Page-specific Lex components — ALL loaded BEFORE inject so custom elements
       are defined when template content enters the DOM. Tree-order upgrade ensures
       parents capture un-rendered children (no double-rendering). -->
  <script src="js/lex/components/foundation/lex-banner.js"></script>
  <script src="js/lex/components/foundation/lex-metric.js"></script>
  <script src="js/lex/components/foundation/lex-detail-panel.js"></script>
  <script src="js/lex/components/foundation/lex-badge.js"></script>
  <script src="js/lex/components/foundation/lex-modal.js"></script>
  <script src="js/lex/components/foundation/lex-drawer.js"></script>
  <script src="js/lex/components/foundation/lex-card.js"></script>
  <script src="js/lex/components/foundation/lex-tabs.js"></script>
  <script src="js/lex/components/foundation/lex-accordion.js"></script>
  <script src="js/lex/components/form/lex-input.js"></script>
  <script src="js/lex/components/form/lex-select.js"></script>
  <script src="js/lex/components/form/lex-checkbox.js"></script>
  <script src="js/lex/components/form/lex-textarea.js"></script>
  <script src="js/lex/components/data/lex-table.js"></script>
  <script src="js/lex/components/data/lex-filter-bar.js"></script>
  <script src="js/lex/components/data/lex-pagination.js"></script>

  <!-- Inject page content + hoist modals -->
  <script src="js/lex/lex-page-init.js"></script>

  <!-- Page dependencies -->
  <script src="js/services/feature-tracker.js"></script>
  <script src="js/vendor/mammoth.min.js"></script>
  <script src="js/conflict-detection.js"></script>
  <script src="js/similar-matters-widget.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/utils/document-lifecycle.js"></script>
  <script src="js/utils/metadata-formatter.js"></script>
  <script src="js/services/metadata-service.js"></script>
  <script src="js/vendor/marked.min.js"></script>
  <script src="js/components/document-metadata-viewer.js"></script>
  <script src="js/tiptap-bundle-built.js"></script>
  <script src="js/api/matter-notes-api.client.js"></script>
  <script src="js/components/note-list.component.js"></script>
  <script src="js/components/note-editor.component.js"></script>
  <script src="js/matter-notes.js"></script>
  <script src="js/shared/event-catalog.js"></script>
  <script src="js/shared/event-browser.js"></script>
  <script src="js/matter-skills.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/drawflow@0.0.60/dist/drawflow.min.js"></script>
  <script src="js/workflow-builder.js"></script>

  <!-- Page controller (MUST be last) -->
  <script src="js/workspace.js"></script>

  <!-- Auth guard + loader dismiss (MUST be last) -->
  <script src="js/auth-guard.js"></script>
</body>
</html>
