<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Tasks - LANA AI</title>

  <link rel="stylesheet" href="css/lex-tokens.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/my-tasks.css">
  <link rel="stylesheet" href="css/tailwind-output.css">
  <script src="js/tailwind-loader.js"></script>
</head>
<body>

  <lex-loader theme="light"></lex-loader>

  <lex-app
    logo-src="img/logo-light.png"
    logo-alt="LANA AI"
    logo-href="dashboard.html"
    active-nav-id="my-tasks"
    page-title="My Tasks"
  ></lex-app>

  <template id="page-content">
    <main>
      <lex-banner
        variant="light"
        heading="My Tasks"
        subtitle="Tasks assigned to you across matters and workspaces"
      >
        <div class="my-tasks-banner-actions">
          <div class="my-tasks-new-wrapper">
            <lex-btn id="myTasksNewBtn" variant="primary" leading-icon="plus" aria-haspopup="menu" aria-expanded="false">New</lex-btn>
            <div id="myTasksNewMenu" class="my-tasks-new-menu hidden" role="menu" aria-labelledby="myTasksNewBtn">
              <button type="button" class="my-tasks-new-menu__item" role="menuitem" data-new-action="task">
                <span class="my-tasks-new-menu__title">New Task</span>
                <span class="my-tasks-new-menu__hint">Create a single task on a matter</span>
              </button>
              <button type="button" class="my-tasks-new-menu__item" role="menuitem" data-new-action="task-plan" data-requires-role="admin">
                <span class="my-tasks-new-menu__title">New Task Plan</span>
                <span class="my-tasks-new-menu__hint">Draft a checklist that publishes to tasks</span>
              </button>
            </div>
          </div>
        </div>
      </lex-banner>

      <section class="my-tasks-toolbar" aria-label="Task filters">
        <lex-segmented
          id="myTasksStatusFilter"
          value="open"
          options='[{"value":"open","label":"Open"},{"value":"all","label":"All"},{"value":"complete","label":"Complete"}]'
        ></lex-segmented>
        <lex-select
          id="myTasksPriorityFilter"
          value=""
          placeholder="All priorities"
          options='[{"value":"","label":"All priorities"},{"value":"high","label":"High"},{"value":"medium","label":"Medium"},{"value":"normal","label":"Normal"},{"value":"low","label":"Low"}]'
        ></lex-select>
        <lex-input
          id="myTasksSearch"
          type="search"
          clearable
          leading-icon="search"
          placeholder="Search title, matter, or description"
        ></lex-input>
      </section>

      <section class="my-tasks-summary" aria-live="polite">
        <span id="myTasksCount">Loading tasks...</span>
      </section>

      <section id="myTasksList" class="my-tasks-list" aria-live="polite">
        <lex-spinner label="Loading tasks"></lex-spinner>
      </section>

      <lex-pagination
        id="myTasksPagination"
        class="my-tasks-pagination"
        page="1"
        total-pages="1"
        total="0"
        limit="20"
      ></lex-pagination>

      <lex-modal
        id="myTaskDetailsModal"
        class="my-task-details-modal"
        heading="Task Details"
        size="full"
        hide-actions
        close-on-overlay
      >
        <div id="myTaskDetailsContent"></div>
      </lex-modal>
    </main>

    <lex-modal
      id="myTaskCreateModal"
      heading="Create Task"
      size="lg"
      hide-actions
      data-hoist
    >
      <lex-form id="myTaskCreateForm">
        <div class="my-task-form-grid">
          <lex-input
            id="myTaskTitle"
            name="title"
            label="Title"
            placeholder="Review intake summary"
            required
          ></lex-input>
          <lex-select
            id="myTaskPriority"
            name="priority"
            label="Priority"
            value="medium"
            options='[{"value":"low","label":"Low"},{"value":"normal","label":"Normal"},{"value":"medium","label":"Medium"},{"value":"high","label":"High"}]'
          ></lex-select>
          <div class="my-task-scope-field my-task-picker-field">
            <label class="my-task-picker-label" for="myTaskMatterPickBtn">
              Matter / Workspace <span class="my-task-picker-optional">(optional)</span>
            </label>
            <div class="my-task-picker-frame">
              <button
                type="button"
                id="myTaskMatterPickBtn"
                class="my-task-picker-trigger"
                aria-haspopup="dialog"
              >
                <span id="myTaskMatterPickLabel" class="my-task-picker-trigger__label is-placeholder">
                  Select a matter — or leave blank for a workspace task
                </span>
              </button>
              <button
                type="button"
                id="myTaskMatterClearBtn"
                class="my-task-picker-trigger__clear hidden"
                aria-label="Clear matter selection"
                title="Clear matter selection"
              >&times;</button>
              <span class="my-task-picker-trigger__hint" aria-hidden="true">Browse</span>
            </div>
            <input type="hidden" id="myTaskMatterId" name="matter_id" />
          </div>
          <lex-input
            id="myTaskDueDate"
            name="due_date"
            label="Due Date"
            type="date"
          ></lex-input>
          <lex-select
            id="myTaskTargetType"
            name="target_type"
            label="Assign to"
            value="unassigned"
            options='[{"value":"unassigned","label":"Unassigned / Org-level"},{"value":"user","label":"Individual User"},{"value":"organization","label":"Entire Organization"}]'
          ></lex-select>
          <div id="myTaskTargetUserField" class="my-task-scope-field my-task-picker-field hidden">
            <label class="my-task-picker-label" for="myTaskUserPickBtn">User</label>
            <button
              type="button"
              id="myTaskUserPickBtn"
              class="my-task-picker-trigger"
              aria-haspopup="dialog"
            >
              <span id="myTaskUserPickLabel" class="my-task-picker-trigger__label is-placeholder">
                Select a user…
              </span>
              <span class="my-task-picker-trigger__hint" aria-hidden="true">Browse</span>
            </button>
            <input type="hidden" id="myTaskAssignee" name="assignee" />
          </div>
        </div>

        <lex-textarea
          id="myTaskDescription"
          name="description"
          label="Description"
          placeholder="Optional context, scope, or success criteria"
          rows="4"
          auto-resize
        ></lex-textarea>

        <div class="my-task-modal-actions">
          <lex-btn id="myTaskCancelBtn" variant="secondary" size="md">Cancel</lex-btn>
          <lex-btn id="myTaskSaveBtn" variant="primary" size="md" type="submit">Create Task</lex-btn>
        </div>
      </lex-form>
    </lex-modal>

    <lex-modal
      id="myTaskPlanCreateModal"
      heading="Create Task Plan"
      size="lg"
      hide-actions
      data-hoist
    >
      <lex-form id="myTaskPlanCreateForm">
        <div class="my-task-form-grid">
          <lex-input
            id="myTaskPlanTitle"
            name="title"
            label="Title"
            placeholder="Q3 onboarding checklist"
            required
          ></lex-input>
          <div class="my-task-scope-field my-task-picker-field">
            <label class="my-task-picker-label" for="myTaskPlanMatterPickBtn">
              Matter / Workspace <span class="my-task-picker-optional">(optional)</span>
            </label>
            <button
              type="button"
              id="myTaskPlanMatterPickBtn"
              class="my-task-picker-trigger"
              aria-haspopup="dialog"
            >
              <span id="myTaskPlanMatterPickLabel" class="my-task-picker-trigger__label is-placeholder">
                None — applies to your workspace
              </span>
              <span class="my-task-picker-trigger__hint" aria-hidden="true">Browse</span>
            </button>
            <input type="hidden" id="myTaskPlanMatterId" name="matter_id" />
          </div>
        </div>

        <lex-textarea
          id="myTaskPlanDescription"
          name="description"
          label="Description"
          placeholder="What this plan covers. You can add items on the next screen."
          rows="3"
          auto-resize
        ></lex-textarea>

        <p class="my-task-plan-hint">
          After creating the plan, you'll be taken to the editor to add items
          and assignees.
        </p>

        <div class="my-task-modal-actions">
          <lex-btn id="myTaskPlanCancelBtn" variant="secondary" size="md">Cancel</lex-btn>
          <lex-btn id="myTaskPlanSaveBtn" variant="primary" size="md" type="submit">Create &amp; Edit Items</lex-btn>
        </div>
      </lex-form>
    </lex-modal>
  </template>

  <noscript>
    <div class="my-tasks-noscript">Please enable JavaScript to use LANA AI.</div>
  </noscript>

  <script src="js/error-reporter.js"></script>
  <script src="js/config.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/utils/rename-conversation.js"></script>
  <script src="js/components.js"></script>
  <script src="js/version.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/navigation-helpers.js"></script>
  <script src="js/new-project-modal.js"></script>
  <script src="js/user-picker-modal.js"></script>
  <script src="js/conversation-menu.js"></script>
  <script src="js/conversation-search-modal.js"></script>
  <script src="js/contact-search-modal.js"></script>
  <script src="js/notifications.js"></script>

  <script src="js/lex/lex.core.js"></script>
  <script src="js/lex/lex.icons.js"></script>
  <script src="js/lex/lex.data.js"></script>
  <script src="js/lex/lex.forms.js"></script>
  <script src="js/lex/lex.state.js"></script>
  <script src="js/lex/lex.utils.js"></script>
  <script src="js/lex/lex.auth.js"></script>
  <script src="js/lex/lex-nav.js"></script>

  <script src="js/lex/components/foundation/lex-loader.js"></script>
  <script src="js/lex/components/foundation/lex-toast.js"></script>
  <script src="js/lex/components/foundation/lex-spinner.js"></script>
  <script src="js/lex/components/foundation/lex-btn.js"></script>
  <script src="js/lex/components/foundation/lex-empty.js"></script>
  <script src="js/lex/components/foundation/lex-badge.js"></script>
  <script src="js/lex/components/foundation/lex-banner.js"></script>
  <script src="js/lex/components/foundation/lex-card.js"></script>
  <script src="js/lex/components/foundation/lex-modal.js"></script>
  <script src="js/lex/components/form/lex-form.js"></script>
  <script src="js/lex/components/form/lex-input.js"></script>
  <script src="js/lex/components/form/lex-segmented.js"></script>
  <script src="js/lex/components/form/lex-select.js"></script>
  <script src="js/lex/components/form/lex-textarea.js"></script>
  <script src="js/lex/components/data/lex-pagination.js"></script>
  <script src="js/lex/components/layout/lex-sidebar.js"></script>
  <script src="js/lex/components/layout/lex-topbar.js"></script>
  <script src="js/lex/components/layout/lex-conversation-item.js"></script>
  <script src="js/lex/components/layout/lex-notification-panel.js"></script>
  <script src="js/lex/components/layout/lex-app.js"></script>

  <script src="js/lex/lex-page-init.js"></script>
  <script src="js/pages/my-tasks.js"></script>
  <script src="js/auth-guard.js"></script>
</body>
</html>
