<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workflow Templates - LanaAI</title>
  <script src="../js/tailwind-loader.js"></script>
  <script src="../js/error-reporter.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/menu.js"></script>
  <script src="../js/workflows.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-gray-900 text-white transform -translate-x-full lg:translate-x-0 transition-transform z-30 flex flex-col">
    <div class="flex-shrink-0 flex items-center justify-between h-16 px-6 border-b border-gray-800">
      <a href="../index.html"><img src="../img/logo-light.png" alt="LanaAI" class="h-7"></a>
      <button id="closeSidebar" class="lg:hidden text-gray-400 hover:text-white">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>
    <nav id="mainNav" class="flex-1 overflow-hidden pt-6 px-3">
      <!-- Menu will be dynamically rendered by menu.js -->
    </nav>
  </aside>

  <div class="lg:ml-64">
    <header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-20">
      <div class="flex items-center justify-between h-16 px-4 lg:px-8">
        <button id="openSidebar" class="lg:hidden text-gray-500 hover:text-gray-700">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
        <div class="flex-1 px-4 lg:px-0">
          <h1 class="text-xl font-semibold text-gray-900">Workflow Templates</h1>
          <p class="text-sm text-gray-500">Pre-built automation workflows ready to deploy</p>
        </div>
      </div>
    </header>

    <main class="p-4 lg:p-8">
      <!-- Category Filter -->
      <div class="mb-6 flex flex-wrap gap-2">
        <button onclick="filterCategory('all')" class="category-btn px-4 py-2 text-sm font-medium rounded-full bg-indigo-600 text-white" data-category="all">All Templates</button>
        <button onclick="filterCategory('Lead Management')" class="category-btn px-4 py-2 text-sm font-medium rounded-full bg-gray-100 text-gray-700 hover:bg-gray-200" data-category="Lead Management">Lead Management</button>
        <button onclick="filterCategory('Client Intake')" class="category-btn px-4 py-2 text-sm font-medium rounded-full bg-gray-100 text-gray-700 hover:bg-gray-200" data-category="Client Intake">Client Intake</button>
        <button onclick="filterCategory('Appointments')" class="category-btn px-4 py-2 text-sm font-medium rounded-full bg-gray-100 text-gray-700 hover:bg-gray-200" data-category="Appointments">Appointments</button>
        <button onclick="filterCategory('Billing')" class="category-btn px-4 py-2 text-sm font-medium rounded-full bg-gray-100 text-gray-700 hover:bg-gray-200" data-category="Billing">Billing</button>
        <button onclick="filterCategory('Marketing')" class="category-btn px-4 py-2 text-sm font-medium rounded-full bg-gray-100 text-gray-700 hover:bg-gray-200" data-category="Marketing">Marketing</button>
        <button onclick="filterCategory('Documents')" class="category-btn px-4 py-2 text-sm font-medium rounded-full bg-gray-100 text-gray-700 hover:bg-gray-200" data-category="Documents">Documents</button>
      </div>

      <!-- Templates Grid -->
      <div id="templatesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Populated by JavaScript -->
      </div>
    </main>
  </div>

  <!-- Template Details Modal -->
  <div id="templateModal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-xl max-w-lg w-full max-h-[90vh] overflow-y-auto">
      <div class="p-6 border-b border-gray-100">
        <div class="flex items-start justify-between">
          <div class="flex items-center gap-4">
            <div id="modalIcon" class="w-12 h-12 bg-indigo-100 rounded-lg flex items-center justify-center">
              <svg class="w-6 h-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            </div>
            <div>
              <h3 id="modalTitle" class="text-lg font-semibold text-gray-900">Template Name</h3>
              <span id="modalCategory" class="text-sm text-indigo-600">Category</span>
            </div>
          </div>
          <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
        </div>
      </div>
      <div class="p-6">
        <p id="modalDescription" class="text-gray-600 mb-6">Description</p>

        <div class="grid grid-cols-2 gap-4 mb-6">
          <div class="text-center p-4 bg-gray-50 rounded-lg">
            <p class="text-2xl font-bold text-gray-900" id="modalNodes">-</p>
            <p class="text-sm text-gray-500">Workflow Steps</p>
          </div>
          <div class="text-center p-4 bg-gray-50 rounded-lg">
            <p class="text-2xl font-bold text-green-600" id="modalPopularity">-</p>
            <p class="text-sm text-gray-500">Popularity Score</p>
          </div>
        </div>

        <h4 class="font-medium text-gray-900 mb-3">What this workflow does:</h4>
        <ul id="modalFeatures" class="space-y-2 mb-6">
          <!-- Populated by JavaScript -->
        </ul>

        <div class="flex gap-3">
          <button onclick="installTemplate()" class="flex-1 px-4 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg transition-colors">
            Install Template
          </button>
          <button onclick="closeModal()" class="px-4 py-3 border border-gray-300 text-gray-700 font-medium rounded-lg hover:bg-gray-50 transition-colors">
            Cancel
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    if (!api.requireAuth()) throw new Error('Not authenticated');
    renderMenu('#mainNav');
    const sidebar = document.getElementById('sidebar');
    document.getElementById('openSidebar').addEventListener('click', () => sidebar.classList.remove('-translate-x-full'));
    document.getElementById('closeSidebar').addEventListener('click', () => sidebar.classList.add('-translate-x-full'));

    let allTemplates = [];
    let selectedTemplate = null;
    let activeCategory = 'all';

    const iconMap = {
      'clock': '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>',
      'document': '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>',
      'calendar': '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>',
      'currency': '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>',
      'user-plus': '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>',
      'star': '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path></svg>',
      'refresh': '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>',
      'document-text': '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>'
    };

    const featuresByCategory = {
      'Lead Management': ['Automated lead scoring', 'Follow-up reminders', 'Lead assignment rules', 'Activity tracking'],
      'Client Intake': ['Welcome sequences', 'Document collection', 'Intake form automation', 'Appointment scheduling'],
      'Appointments': ['Reminder sequences', 'No-show handling', 'Rescheduling automation', 'Calendar sync'],
      'Billing': ['Invoice generation', 'Payment reminders', 'AR tracking', 'Late fee automation'],
      'Marketing': ['Email sequences', 'Review requests', 'Retargeting sync', 'Drip campaigns'],
      'Documents': ['Auto-generation', 'E-signature requests', 'File organization', 'Template population']
    };

    function getColorClass(category) {
      const colors = {
        'Lead Management': { bg: 'bg-blue-100', text: 'text-blue-600', badge: 'bg-blue-50 text-blue-700' },
        'Client Intake': { bg: 'bg-green-100', text: 'text-green-600', badge: 'bg-green-50 text-green-700' },
        'Appointments': { bg: 'bg-purple-100', text: 'text-purple-600', badge: 'bg-purple-50 text-purple-700' },
        'Billing': { bg: 'bg-yellow-100', text: 'text-yellow-600', badge: 'bg-yellow-50 text-yellow-700' },
        'Marketing': { bg: 'bg-pink-100', text: 'text-pink-600', badge: 'bg-pink-50 text-pink-700' },
        'Documents': { bg: 'bg-indigo-100', text: 'text-indigo-600', badge: 'bg-indigo-50 text-indigo-700' }
      };
      return colors[category] || { bg: 'bg-gray-100', text: 'text-gray-600', badge: 'bg-gray-50 text-gray-700' };
    }

    function filterCategory(category) {
      activeCategory = category;
      document.querySelectorAll('.category-btn').forEach(btn => {
        if (btn.dataset.category === category) {
          btn.className = 'category-btn px-4 py-2 text-sm font-medium rounded-full bg-indigo-600 text-white';
        } else {
          btn.className = 'category-btn px-4 py-2 text-sm font-medium rounded-full bg-gray-100 text-gray-700 hover:bg-gray-200';
        }
      });
      renderTemplates();
    }

    function renderTemplates() {
      const container = document.getElementById('templatesGrid');
      let templates = allTemplates;
      if (activeCategory !== 'all') {
        templates = templates.filter(t => t.category === activeCategory);
      }

      container.innerHTML = templates.map(t => {
        const colors = getColorClass(t.category);
        return `
          <div class="bg-white rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition-shadow cursor-pointer" onclick="showTemplateDetails('${t.id}')">
            <div class="p-6">
              <div class="flex items-start justify-between mb-4">
                <div class="${colors.bg} w-12 h-12 rounded-lg flex items-center justify-center ${colors.text}">
                  ${iconMap[t.icon] || iconMap['document']}
                </div>
                <span class="px-2 py-1 text-xs font-medium rounded-full ${colors.badge}">${t.category}</span>
              </div>
              <h3 class="font-semibold text-gray-900 mb-2">${t.name}</h3>
              <p class="text-sm text-gray-500 mb-4">${t.description}</p>
              <div class="flex items-center justify-between pt-4 border-t border-gray-100">
                <div class="flex items-center gap-1 text-sm text-gray-500">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5z"></path></svg>
                  ${t.nodes} steps
                </div>
                <div class="flex items-center gap-1">
                  <div class="flex -space-x-1">
                    ${Array(Math.min(5, Math.ceil(t.popularity / 20))).fill().map(() => '<svg class="w-4 h-4 text-yellow-400" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>').join('')}
                  </div>
                  <span class="text-sm text-gray-500 ml-1">${t.popularity}%</span>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function showTemplateDetails(templateId) {
      selectedTemplate = allTemplates.find(t => t.id === templateId);
      if (!selectedTemplate) return;

      const colors = getColorClass(selectedTemplate.category);
      document.getElementById('modalIcon').className = `w-12 h-12 rounded-lg flex items-center justify-center ${colors.bg} ${colors.text}`;
      document.getElementById('modalIcon').innerHTML = iconMap[selectedTemplate.icon] || iconMap['document'];
      document.getElementById('modalTitle').textContent = selectedTemplate.name;
      document.getElementById('modalCategory').textContent = selectedTemplate.category;
      document.getElementById('modalDescription').textContent = selectedTemplate.description;
      document.getElementById('modalNodes').textContent = selectedTemplate.nodes;
      document.getElementById('modalPopularity').textContent = `${selectedTemplate.popularity}%`;

      const features = featuresByCategory[selectedTemplate.category] || [];
      document.getElementById('modalFeatures').innerHTML = features.map(f => `
        <li class="flex items-center gap-2 text-sm text-gray-600">
          <svg class="w-4 h-4 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
          ${f}
        </li>
      `).join('');

      document.getElementById('templateModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('templateModal').classList.add('hidden');
      selectedTemplate = null;
    }

    async function installTemplate() {
      if (!selectedTemplate) return;
      try {
        Toast.info('Installing template...');
        const result = await Workflows.installTemplate(selectedTemplate.id);
        if (result.success) {
          Toast.success('Template installed successfully!');
          closeModal();
          setTimeout(() => {
            window.location.href = 'active.html';
          }, 1000);
        } else {
          Toast.error(result.error || 'Failed to install template');
        }
      } catch (error) {
        Toast.error('Failed to install template');
        console.error(error);
      }
    }

    document.getElementById('templateModal').addEventListener('click', (e) => {
      if (e.target.id === 'templateModal') closeModal();
    });

    async function loadTemplates() {
      try {
        const data = await Workflows.getTemplates();
        allTemplates = data.templates;
        renderTemplates();
      } catch (error) {
        Toast.error('Failed to load templates');
        console.error(error);
      }
    }

    loadTemplates();
  </script>
</body>
</html>
