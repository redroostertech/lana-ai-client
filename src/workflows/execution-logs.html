<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Execution Logs - LanaAI</title>
  <link rel="stylesheet" href="../css/lex-tokens.css">
  <link rel="stylesheet" href="../css/admin/admin-tables.css">
  <link rel="stylesheet" href="../css/workflows/workflow-tables.css">
  <link rel="stylesheet" href="../css/tailwind-output.css">
  <script src="../js/tailwind-loader.js"></script>
  <script src="../js/error-reporter.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/time-utils.js"></script>
  <script src="../js/shared/request-retry.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/menu.js"></script>
  <script src="../js/workflows.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-gray-900 text-white transform -translate-x-full lg:translate-x-0 transition-transform z-30 flex flex-col">
    <div class="flex-shrink-0 flex items-center justify-between h-16 px-6 border-b border-gray-800">
      <a href="../index.html"><img src="../img/logo-light.png" alt="LanaAI" class="h-7"></a>
      <button id="closeSidebar" class="lg:hidden text-gray-400 hover:text-white">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>
    <nav id="mainNav" class="flex-1 overflow-hidden pt-6 px-3">
      <!-- Menu will be dynamically rendered by menu.js -->
    </nav>
  </aside>

  <div class="lg:ml-64">
    <header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-20">
      <div class="flex items-center justify-between h-16 px-4 lg:px-8">
        <button id="openSidebar" class="lg:hidden text-gray-500 hover:text-gray-700">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
        <div class="flex-1 px-4 lg:px-0">
          <h1 class="text-xl font-semibold text-gray-900">Execution Logs</h1>
          <p class="text-sm text-gray-500">Detailed history of workflow executions</p>
        </div>
        <button onclick="refreshLogs()" class="flex items-center gap-2 px-4 py-2 border border-gray-300 text-gray-700 font-medium rounded-lg hover:bg-gray-50 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
          Refresh
        </button>
      </div>
    </header>

    <main class="p-4 lg:p-8">
      <!-- Stats Cards Loading Skeleton -->
      <div id="statsLoading" class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
        <div class="bg-white rounded-lg shadow-sm border border-gray-100 p-4 animate-pulse">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-gray-200 rounded-lg"></div>
            <div>
              <div class="h-6 bg-gray-200 rounded w-12 mb-1"></div>
              <div class="h-3 bg-gray-200 rounded w-24"></div>
            </div>
          </div>
        </div>
        <div class="bg-white rounded-lg shadow-sm border border-gray-100 p-4 animate-pulse">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-gray-200 rounded-lg"></div>
            <div>
              <div class="h-6 bg-gray-200 rounded w-12 mb-1"></div>
              <div class="h-3 bg-gray-200 rounded w-20"></div>
            </div>
          </div>
        </div>
        <div class="bg-white rounded-lg shadow-sm border border-gray-100 p-4 animate-pulse">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-gray-200 rounded-lg"></div>
            <div>
              <div class="h-6 bg-gray-200 rounded w-12 mb-1"></div>
              <div class="h-3 bg-gray-200 rounded w-16"></div>
            </div>
          </div>
        </div>
        <div class="bg-white rounded-lg shadow-sm border border-gray-100 p-4 animate-pulse">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-gray-200 rounded-lg"></div>
            <div>
              <div class="h-6 bg-gray-200 rounded w-12 mb-1"></div>
              <div class="h-3 bg-gray-200 rounded w-20"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Stats Cards -->
      <div id="statsCards" class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6 hidden">
        <div class="bg-white rounded-lg shadow-sm border border-gray-100 p-4">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-blue-100 rounded-lg flex items-center justify-center">
              <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            </div>
            <div>
              <p id="totalExecutions" class="text-xl font-bold text-gray-900">-</p>
              <p class="text-xs text-gray-500">Total Executions</p>
            </div>
          </div>
        </div>
        <div class="bg-white rounded-lg shadow-sm border border-gray-100 p-4">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-green-100 rounded-lg flex items-center justify-center">
              <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <div>
              <p id="successCount" class="text-xl font-bold text-green-600">-</p>
              <p class="text-xs text-gray-500">Successful</p>
            </div>
          </div>
        </div>
        <div class="bg-white rounded-lg shadow-sm border border-gray-100 p-4">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-red-100 rounded-lg flex items-center justify-center">
              <svg class="w-5 h-5 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </div>
            <div>
              <p id="failedCount" class="text-xl font-bold text-red-600">-</p>
              <p class="text-xs text-gray-500">Failed</p>
            </div>
          </div>
        </div>
        <div class="bg-white rounded-lg shadow-sm border border-gray-100 p-4">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-purple-100 rounded-lg flex items-center justify-center">
              <svg class="w-5 h-5 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
            </div>
            <div>
              <p id="avgDuration" class="text-xl font-bold text-gray-900">-</p>
              <p class="text-xs text-gray-500">Avg Duration</p>
            </div>
          </div>
        </div>
      </div>

      <div class="bg-white rounded-lg shadow-sm border mb-4 mt-4 p-4" style="border-color: var(--lex-border-default)" role="search" aria-label="Search and filter execution logs">
        <div class="flex items-center gap-4 flex-wrap">
          <div class="flex-1 min-w-[200px]">
            <lex-input id="logsSearch" placeholder="Search executions..." clearable="true" leading-icon="search"></lex-input>
          </div>
          <div class="flex items-center gap-2">
            <label class="admin-table-toolbar-label text-sm whitespace-nowrap">Sort by:</label>
            <lex-select id="logsSort" options='[{"value":"created_at","label":"Created"},{"value":"workflow_name","label":"Workflow"},{"value":"status","label":"Status"},{"value":"trigger","label":"Trigger"},{"value":"records_processed","label":"Records"},{"value":"duration_ms","label":"Duration"}]' value="created_at"></lex-select>
          </div>
          <lex-btn id="logsSortOrder" variant="ghost" icon="true" title="Toggle sort order" data-order="desc"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12"></path></svg></lex-btn>
          <div class="flex items-center gap-2">
            <label class="admin-table-toolbar-label text-sm whitespace-nowrap">Status:</label>
            <lex-select id="logsStatusFilter" options='[{"value":"all","label":"All"},{"value":"success","label":"Success"},{"value":"error","label":"Failed"},{"value":"running","label":"Running"}]' value="all"></lex-select>
          </div>
          <div id="logsCount" class="admin-table-toolbar-label text-sm whitespace-nowrap"></div>
        </div>
      </div>
      <div class="flex items-center justify-between mb-3">
        <h2 class="admin-table-section-title text-lg font-semibold">All Executions</h2>
        <div class="flex items-center gap-3">
          <span id="logsSectionCount" class="admin-table-toolbar-label text-sm" aria-live="polite"></span>
        </div>
      </div>
      <lex-table
        id="logsTable"
        class="admin-table lex-table--card"
        column-filters
        columns="workflow_name,status,trigger,records_processed,duration_ms,created_at,actions"
        labels="Workflow,Status,Trigger,Records,Duration,Created,"
        search-keys="workflow_name,id"
        sort-by="created_at"
        sort-dir="desc"
        limit="20"
        id-key="id"
        empty-text="No execution logs yet. Logs appear here once workflows start running."
        aria-label="Execution logs"
      ></lex-table>
    </main>
  </div>

  <!-- Log Details Modal -->
  <lex-modal id="logModal" heading="Execution details" size="lg" footer-content='<button type="button" class="lex-modal-btn lex-modal-btn--cancel" data-log-action="close">Close</button><button type="button" class="lex-modal-btn lex-modal-btn--confirm" data-log-action="retry">Retry execution</button>'>
    <div>
      <p id="logWorkflow" class="text-sm text-gray-500 mb-4">-</p>
      <div class="grid grid-cols-2 gap-4 mb-6">
        <div class="p-4 bg-gray-50 rounded-lg">
          <p class="text-xs text-gray-500 mb-1">Status</p>
          <p id="logStatus" class="font-medium">-</p>
        </div>
        <div class="p-4 bg-gray-50 rounded-lg">
          <p class="text-xs text-gray-500 mb-1">Trigger</p>
          <p id="logTrigger" class="font-medium">-</p>
        </div>
        <div class="p-4 bg-gray-50 rounded-lg">
          <p class="text-xs text-gray-500 mb-1">Duration</p>
          <p id="logDuration" class="font-medium">-</p>
        </div>
        <div class="p-4 bg-gray-50 rounded-lg">
          <p class="text-xs text-gray-500 mb-1">Records processed</p>
          <p id="logRecords" class="font-medium">-</p>
        </div>
      </div>
      <div class="space-y-4 mb-6">
        <div class="flex items-center justify-between py-3 border-b border-gray-100">
          <span class="text-sm text-gray-500">Execution ID</span>
          <code id="logId" class="text-sm font-mono bg-gray-100 px-2 py-1 rounded">-</code>
        </div>
        <div class="flex items-center justify-between py-3 border-b border-gray-100">
          <span class="text-sm text-gray-500">Started</span>
          <span id="logStarted" class="text-sm font-medium text-gray-900">-</span>
        </div>
        <div class="flex items-center justify-between py-3 border-b border-gray-100">
          <span class="text-sm text-gray-500">Completed</span>
          <span id="logCompleted" class="text-sm font-medium text-gray-900">-</span>
        </div>
      </div>
      <div id="errorSection" class="hidden">
        <h4 class="text-sm font-medium text-gray-900 mb-2">Error details</h4>
        <div class="p-4 bg-red-50 border border-red-200 rounded-lg">
          <pre id="logError" class="text-sm text-red-700 whitespace-pre-wrap font-mono">-</pre>
        </div>
      </div>
    </div>
  </lex-modal>

  <!-- Lex UI (lex-table, lex-select, lex-modal) + table helpers (docs/TABLE-STANDARD.md) -->
  <script src="../js/lex/lex.core.js"></script>
  <script src="../js/lex/lex.icons.js"></script>
  <script src="../js/lex/lex.data.js"></script>
  <script src="../js/lex/lex.forms.js"></script>
  <script src="../js/lex/lex.state.js"></script>
  <script src="../js/lex/lex.utils.js"></script>
  <script src="../js/lex/components/foundation/lex-btn.js"></script>
  <script src="../js/lex/components/foundation/lex-badge.js"></script>
  <script src="../js/lex/components/foundation/lex-empty.js"></script>
  <script src="../js/lex/components/foundation/lex-spinner.js"></script>
  <script src="../js/lex/components/foundation/lex-modal.js"></script>
  <script src="../js/lex/components/data/lex-table.js"></script>
  <script src="../js/lex/components/form/lex-select.js"></script>
  <script src="../js/lex/components/form/lex-input.js"></script>
  <script src="../js/shared/library-column-filters.js"></script>
  <script src="../js/admin/admin-table-kit.js"></script>
  <script src="../js/workflows/workflow-tables.js"></script>

  <script>
    if (!api.requireAuth()) throw new Error('Not authenticated');
    renderMenu('#mainNav');
    const sidebar = document.getElementById('sidebar');
    document.getElementById('openSidebar').addEventListener('click', () => sidebar.classList.remove('-translate-x-full'));
    document.getElementById('closeSidebar').addEventListener('click', () => sidebar.classList.add('-translate-x-full'));

    const kit = window.AdminTableKit;
    const WT = window.WorkflowTables;
    const logsTable = document.getElementById('logsTable');
    const logModal = document.getElementById('logModal');
    let allLogs = [];
    let selectedLog = null;
    let logsToolbar = null;

    function badgeHtml(map, value) {
      const entry = map[value];
      return kit.badge(entry ? entry.label : kit.capitalize(value), entry ? entry.color : 'gray');
    }

    function showLogDetails(logId) {
      selectedLog = allLogs.find(l => l.id === logId);
      if (!selectedLog) return;
      const fmt = (v) => (v ? Lex.Utils.formatDateTime(v) : '—');

      logModal.heading = `Execution ${selectedLog.id}`;
      document.getElementById('logWorkflow').textContent = selectedLog.workflow_name || '—';
      document.getElementById('logStatus').innerHTML = badgeHtml(WT.EXECUTION_STATUS, selectedLog.status);
      document.getElementById('logTrigger').innerHTML = badgeHtml(WT.TRIGGERS, selectedLog.trigger);
      document.getElementById('logDuration').textContent = WT.formatDuration(selectedLog.duration_ms) || '—';
      document.getElementById('logRecords').textContent = selectedLog.records_processed === null ? '—' : selectedLog.records_processed;
      document.getElementById('logId').textContent = selectedLog.id;
      document.getElementById('logStarted').textContent = fmt(selectedLog.created_at);
      document.getElementById('logCompleted').textContent = fmt(selectedLog._raw.completedAt || selectedLog._raw.completed_at);

      const error = selectedLog._raw.error;
      document.getElementById('errorSection').classList.toggle('hidden', !error);
      document.getElementById('logError').textContent = error || '';
      logModal.open = true;
    }

    function closeLogModal() {
      logModal.open = false;
      selectedLog = null;
    }

    async function retryExecution() {
      if (!selectedLog) return;
      try {
        Toast.info('Retrying workflow...');
        const result = await Workflows.execute(selectedLog.workflow_id);
        const processed = result && result.recordsProcessed;
        Toast.success(processed !== undefined ? `Workflow completed. Processed ${processed} records.` : 'Workflow started.');
        closeLogModal();
        await loadData();
      } catch (error) {
        Toast.error('Workflow execution failed');
      }
    }

    logModal.addEventListener('click', (e) => {
      const button = e.target.closest && e.target.closest('[data-log-action]');
      if (!button) return;
      if (button.dataset.logAction === 'retry') retryExecution();
      else closeLogModal();
    });
    logModal.addEventListener('lex-close', () => { selectedLog = null; });

    function updateStats() {
      const successCount = allLogs.filter(l => l.status === 'success').length;
      const failedCount = allLogs.filter(l => l.status === 'error' || l.status === 'failed').length;
      const totalDuration = allLogs.reduce((sum, l) => sum + (l.duration_ms || 0), 0);
      const avgDuration = allLogs.length > 0 ? totalDuration / allLogs.length : 0;

      document.getElementById('totalExecutions').textContent = allLogs.length;
      document.getElementById('successCount').textContent = successCount;
      document.getElementById('failedCount').textContent = failedCount;
      document.getElementById('avgDuration').textContent = WT.formatDuration(avgDuration) || '0ms';
    }

    function showStatsLoading(loading) {
      document.getElementById('statsLoading').classList.toggle('hidden', !loading);
      document.getElementById('statsCards').classList.toggle('hidden', loading);
    }

    async function loadData() {
      showStatsLoading(true);
      try {
        const logsData = await Workflows.getExecutionLogs();
        allLogs = ((logsData && logsData.logs) || []).map(WT.mapExecution);
        logsTable.setColumnFilterOptions(WT.executionFilterOptions(allLogs.map(l => l.workflow_name)));
        logsTable.setData(allLogs);
        updateStats();
        return true;
      } catch (error) {
        console.error(error);
        logsTable.setError('Execution logs could not be loaded. Check your connection and try again.');
        return false;
      } finally {
        showStatsLoading(false);
      }
    }

    async function refreshLogs() {
      if (await loadData()) Toast.success('Logs refreshed');
      else Toast.error('Failed to refresh logs');
    }

    kit.whenTableReady().then(() => {
      logsTable.setCellRenderers(WT.executionRenderers());
      logsToolbar = kit.bindToolbar({
        table: logsTable,
        searchId: 'logsSearch',
        sortId: 'logsSort',
        orderId: 'logsSortOrder',
        filterId: 'logsStatusFilter',
        filterKey: 'status',
        countIds: ['logsCount', 'logsSectionCount'],
        noun: ['execution', 'executions']
      });
      const updateCount = () => logsToolbar.setCount(Array.isArray(logsTable.filteredRows) ? logsTable.filteredRows.length : null);
      logsTable.addEventListener('lex-filter-change', (e) => { if (e.target === logsTable) updateCount(); });
      logsTable.addEventListener('lex-data-loaded', (e) => { if (e.target === logsTable) updateCount(); });
      logsTable.addEventListener('row-click', (e) => {
        const row = e.detail && e.detail.row;
        if (row) showLogDetails(row.id);
      });
      logsTable.addEventListener('click', (e) => {
        const button = e.target.closest && e.target.closest('[data-action="details"]');
        if (button && logsTable.contains(button)) showLogDetails(button.getAttribute('data-id'));
      });
      loadData().then((ok) => { if (!ok) Toast.error('Failed to load execution logs'); });
    });
  </script>
</body>
</html>
