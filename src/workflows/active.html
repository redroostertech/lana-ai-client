<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Active Workflows - LanaAI</title>
  <link rel="stylesheet" href="../css/lex-tokens.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin/admin-tables.css">
  <link rel="stylesheet" href="../css/tailwind-output.css">
  <script src="../js/tailwind-loader.js"></script>
  <script src="../js/error-reporter.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/time-utils.js"></script>
  <script src="../js/shared/request-retry.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/menu.js"></script>
  <script src="../js/workflows.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-gray-900 text-white transform -translate-x-full lg:translate-x-0 transition-transform z-30 flex flex-col">
    <div class="flex-shrink-0 flex items-center justify-between h-16 px-6 border-b border-gray-800">
      <a href="../index.html"><img src="../img/logo-light.png" alt="LanaAI" class="h-7"></a>
      <button id="closeSidebar" class="lg:hidden text-gray-400 hover:text-white">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>
    <nav id="mainNav" class="flex-1 overflow-hidden pt-6 px-3">
      <!-- Menu will be dynamically rendered by menu.js -->
    </nav>
  </aside>

  <div class="lg:ml-64">
    <header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-20">
      <div class="flex items-center justify-between h-16 px-4 lg:px-8">
        <button id="openSidebar" class="lg:hidden text-gray-500 hover:text-gray-700">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
        <div class="flex-1 px-4 lg:px-0">
          <h1 class="text-xl font-semibold text-gray-900">Active Workflows</h1>
          <p class="text-sm text-gray-500">Manage your running automation workflows</p>
        </div>
        <a href="templates.html" class="flex items-center gap-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
          Add Workflow
        </a>
      </div>
    </header>

    <main class="p-4 lg:p-8">
      <style>
        /* Active workflows table (docs/TABLE-STANDARD.md): Workflow, Status, Trigger, Runs, Success rate, Last run, Created, actions */
        #activeWorkflowsTable table { min-width: 1120px; table-layout: fixed; }
        #activeWorkflowsTable th { white-space: nowrap; }
        #activeWorkflowsTable td { overflow: hidden; }
        #activeWorkflowsTable th:nth-child(2) { width: 110px; }
        #activeWorkflowsTable th:nth-child(3) { width: 120px; }
        #activeWorkflowsTable th:nth-child(4) { width: 90px; }
        #activeWorkflowsTable th:nth-child(5) { width: 130px; }
        #activeWorkflowsTable th:nth-child(6) { width: 140px; }
        #activeWorkflowsTable th:nth-child(7) { width: 176px; }
        #activeWorkflowsTable th:nth-child(8) { width: 230px; }
        .workflows-active-actions { display: flex; gap: 6px; flex-wrap: nowrap; }
        .workflows-active-action {
          appearance: none; background: var(--lex-bg-primary, #fff); border: 1px solid var(--lex-border-default);
          border-radius: var(--lex-radius-md, 6px); color: var(--lex-text-primary); cursor: pointer;
          font: inherit; font-size: 12px; font-weight: 500; line-height: 1.4; padding: 3px 9px; white-space: nowrap;
        }
        .workflows-active-action:hover { background: var(--lex-bg-secondary, #f5f5f0); }
        .workflows-active-action:focus-visible { box-shadow: var(--lex-focus-ring); outline: none; }
        .workflows-active-action--danger { color: var(--lex-danger, #b91c1c); }
      </style>

      <!-- Search / Sort / Filter toolbar (docs/TABLE-STANDARD.md) -->
      <div class="bg-white rounded-lg shadow-sm border mb-4 mt-4 p-4" style="border-color: var(--lex-border-default)" role="search" aria-label="Search and filter workflows">
        <div class="flex items-center gap-4 flex-wrap">
          <div class="flex-1 min-w-[200px]">
            <lex-input id="activeWorkflowsSearch" placeholder="Search workflows..." clearable="true" leading-icon="search"></lex-input>
          </div>
          <div class="flex items-center gap-2">
            <label class="admin-table-toolbar-label text-sm whitespace-nowrap" style="color: var(--lex-text-secondary)">Sort by:</label>
            <lex-select id="activeWorkflowsSort" options='[{"value":"created_at","label":"Created"},{"value":"name","label":"Workflow"},{"value":"status","label":"Status"},{"value":"trigger_type","label":"Trigger"},{"value":"executions","label":"Runs"},{"value":"success_rate","label":"Success rate"},{"value":"last_run","label":"Last run"}]' value="created_at"></lex-select>
          </div>
          <lex-btn id="activeWorkflowsSortOrder" variant="ghost" icon="true" title="Toggle sort order" data-order="desc">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12"></path>
            </svg>
          </lex-btn>
          <div class="flex items-center gap-2">
            <label class="admin-table-toolbar-label text-sm whitespace-nowrap" style="color: var(--lex-text-secondary)">Status:</label>
            <lex-select id="activeWorkflowsStatusFilter" options='[{"value":"all","label":"All"},{"value":"active","label":"Active"},{"value":"paused","label":"Paused"},{"value":"draft","label":"Draft"},{"value":"archived","label":"Archived"},{"value":"error","label":"Error"}]' value="all"></lex-select>
          </div>
          <div id="activeWorkflowsCount" class="text-sm whitespace-nowrap" style="color: var(--lex-text-secondary)"></div>
        </div>
      </div>

      <section aria-labelledby="activeWorkflowsHeading">
        <div class="flex items-center justify-between mb-3">
          <h2 id="activeWorkflowsHeading" class="text-lg font-semibold" style="color: var(--lex-text-primary)">All Workflows</h2>
          <span id="activeWorkflowsSectionCount" class="text-sm" style="color: var(--lex-text-secondary)" aria-live="polite"></span>
        </div>

        <lex-table
          id="activeWorkflowsTable"
          class="admin-table lex-table--card"
          column-filters
          columns="name,status,trigger_type,executions,success_rate,last_run,created_at,actions"
          labels="Workflow,Status,Trigger,Runs,Success rate,Last run,Created,Actions"
          sortable-columns="name,status,trigger_type,executions,success_rate,last_run,created_at"
          search-keys="name,description,status,trigger_type"
          sort-by="created_at"
          sort-dir="desc"
          limit="20"
          id-key="id"
          empty-text="No workflows yet"
          aria-label="Workflows"
        ></lex-table>
      </section>
    </main>
  </div>

  <script>
    if (!api.requireAuth()) throw new Error('Not authenticated');
    renderMenu('#mainNav');
    const sidebar = document.getElementById('sidebar');
    document.getElementById('openSidebar').addEventListener('click', () => sidebar.classList.remove('-translate-x-full'));
    document.getElementById('closeSidebar').addEventListener('click', () => sidebar.classList.add('-translate-x-full'));
  </script>

  <!-- Lex UI (full page load; the SPA router loads the same list from lex-router.pages.js) -->
  <script src="../js/lex/lex.core.js"></script>
  <script src="../js/lex/lex.icons.js"></script>
  <script src="../js/lex/lex.data.js"></script>
  <script src="../js/lex/lex.forms.js"></script>
  <script src="../js/lex/lex.state.js"></script>
  <script src="../js/lex/lex.utils.js"></script>
  <script src="../js/lex/lex.auth.js"></script>
  <script src="../js/lex/lex-nav.js"></script>
  <script src="../js/lex/components/foundation/lex-toast.js"></script>
  <script src="../js/lex/components/foundation/lex-btn.js"></script>
  <script src="../js/lex/components/foundation/lex-badge.js"></script>
  <script src="../js/lex/components/foundation/lex-modal.js"></script>
  <script src="../js/lex/components/foundation/lex-drawer.js"></script>
  <script src="../js/lex/components/form/lex-input.js"></script>
  <script src="../js/lex/components/form/lex-select.js"></script>
  <script src="../js/lex/components/data/lex-table.js"></script>

  <!-- Page controller -->
  <script src="../js/shared/library-column-filters.js"></script>
  <script src="../js/admin/admin-table-kit.js"></script>
  <script src="../js/pages/workflows-active.js"></script>
</body>
</html>
