[project]
name = "lana-redactor"
version = "0.1.0"
description = "Presidio-backed redaction service for the Lana gateway."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "python-multipart==0.0.20",
  "pydantic==2.10.4",
  "presidio-analyzer==2.2.355",
  "presidio-anonymizer==2.2.355",
  "spacy==3.7.5",
  "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.7.1/en_core_web_lg-3.7.1.tar.gz",
  # TRUE document redaction (/redact-document): PyMuPDF burns PII out of PDFs
  # (glyph deletion, not overlay); python-docx replaces run text in DOCX.
  "PyMuPDF==1.28.0",
  "python-docx==1.2.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.8.4"]

# OCR layer for scanned / image-only PDF pages. pytesseract is a thin wrapper
# around the `tesseract` CLI, which must be installed as a SYSTEM binary
# (apt-get install tesseract-ocr / brew install tesseract) — it is NOT a Python
# package. When the binary is absent the service reports OCR-unavailable per page
# instead of emitting a silently-unredacted scanned page.
ocr = ["pytesseract==0.3.13", "Pillow>=10,<13"]

# PHI layer: scispaCy biomedical NER (diagnoses + medications). The engine runs
# it when present and degrades to the deterministic phrase/acronym/regex floor
# when absent (see redactor/engine.py), so it is optional but recommended for
# health-information coverage. The model is a direct-URL dep, like en_core_web_lg.
phi = [
  "scispacy==0.6.2",
  "en-ner-bc5cdr-md @ https://s3-us-west-2.amazonaws.com/ai2-s2-scispacy/releases/v0.5.4/en_ner_bc5cdr_md-0.5.4.tar.gz",
]

# De-identification transformer layer (obi/deid_roberta_i2b2), OPT-IN at runtime
# via REDACTOR_DEID=1. transformers 5.x breaks against torch 2.2.x, hence the pin.
#
# torch is the one platform-specific dependency:
#   * macOS: the default PyPI wheel is already CPU/MPS, so the marker below pulls
#     it automatically — `pip install -e '.[ml]'` Just Works.
#   * Linux: the default PyPI wheel is the multi-GB CUDA build. The CPU wheel
#     lives on a separate index that PEP 508 markers cannot express, so on Linux
#     torch is installed by install-ml.sh / Dockerfile.full (which point pip at
#     https://download.pytorch.org/whl/cpu). Use install-ml.sh — don't hand-run
#     `pip install -e '.[ml]'` on Linux or you'll get no torch (de-id stays off).
# The de-id model downloads from the HF hub on first load, or is pre-baked by
# Dockerfile.full.
deid = [
  "transformers==4.44.2",
  "torch==2.2.2 ; sys_platform == 'darwin'",
]

# High-recall TRANSFORMER base NER (en_core_web_trf), an OPT-IN swap for the
# default CNN en_core_web_lg. Selected at runtime via REDACTOR_SPACY_MODEL=
# en_core_web_trf (see redactor/main.py::_build_analyzer). Pulls the curated-
# transformers backend + torch. IMPORTANT: on CPU it costs ~5x the base spaCy NER
# time per request (this env: ~15ms -> ~74ms) and spaCy runs on CPU unless the
# process calls spacy.require_gpu(), so on a CPU-only prod box (Railway) expect
# the full slowdown. On Linux torch installs like the deid extra (see that note /
# install-ml.sh for the CPU wheel). Keep en_core_web_lg for the latency-sensitive
# sync redaction hop; enable trf only where the recall/latency tradeoff is worth
# it. See eval/lg.json vs eval/trf.json for the measured tradeoff.
trf = [
  "spacy-curated-transformers>=0.2,<0.3",
  "en-core-web-trf @ https://github.com/explosion/spacy-models/releases/download/en_core_web_trf-3.7.3/en_core_web_trf-3.7.3.tar.gz",
]

# Convenience: both ML layers at once. torch still installs separately (see deid).
ml = ["lana-redactor[phi]", "lana-redactor[deid]"]

# LLM-prompt PII detection layer (redactor/llm_redact.py), OPT-IN and additive.
# It is the RECALL frontier for context-dependent PII (aliases/initials, novel
# ID formats, quasi-identifiers, relational references) that regex/NER miss.
# TRUST CONSTRAINT: it sends CLEARTEXT to a model, so it MUST target Lana's OWN
# sovereign self-hosted Forge (GATEWAY_INFERENCE_URL / an injected sovereign
# client) and NEVER a third-party API. The default adapter (ForgeChatClient)
# uses stdlib urllib, so this layer adds NO runtime dependency; the extra exists
# only as a documentation anchor. The client is injected, so nothing is required
# to unit-test or wire the module in.
llm = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["redactor*"]

[tool.ruff]
line-length = 100
target-version = "py311"
